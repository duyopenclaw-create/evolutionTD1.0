'use strict';

// ── Canvas ────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('g');
const ctx = cvs.getContext('2d');

// ── Audio Context ─────────────────────────────────────────────────────────────
let AC = null;
const getAC = () => { if (!AC) AC = new (AudioContext || webkitAudioContext)(); return AC; };

function mkNoise(dur) {
  const a = getAC();
  const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

// ── Game Audio Bus ─────────────────────────────────────────────────────────────
let gameBus = null;
function getGB() {
  if (!gameBus) { gameBus = getAC().createGain(); gameBus.connect(getAC().destination); }
  return gameBus;
}
function muteGameBus() {
  const a = getAC(), g = getGB().gain;
  g.cancelScheduledValues(a.currentTime);
  g.setValueAtTime(0, a.currentTime);
}
function unmuteGameBus() {
  const a = getAC(), g = getGB().gain;
  g.cancelScheduledValues(a.currentTime);
  g.setValueAtTime(1, a.currentTime);
}

// ── Song-audio helpers ────────────────────────────────────────────────────────
function playKick(t, vol = 0.85) {
  const a = getAC(), gb = getGB();
  const osc = a.createOscillator(), g = a.createGain();
  osc.connect(g); g.connect(gb);
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(0.001, t + 0.55);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  osc.start(t); osc.stop(t + 0.55);
}
function playSnare(t, vol = 0.5) {
  const a = getAC(), gb = getGB();
  const ns = a.createBufferSource(); ns.buffer = mkNoise(0.25);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200;
  const ng = a.createGain();
  ns.connect(bp); bp.connect(ng); ng.connect(gb);
  ng.gain.setValueAtTime(vol, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  ns.start(t); ns.stop(t + 0.22);
  const osc = a.createOscillator(), og = a.createGain();
  osc.frequency.value = 200; osc.type = 'triangle';
  osc.connect(og); og.connect(gb);
  og.gain.setValueAtTime(vol * 0.55, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  osc.start(t); osc.stop(t + 0.09);
}
function playHat(t, open = false, vol = 0.2) {
  const a = getAC(), gb = getGB();
  const dur = open ? 0.22 : 0.04;
  const ns = a.createBufferSource(); ns.buffer = mkNoise(dur);
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 8000;
  const g = a.createGain();
  ns.connect(hp); hp.connect(g); g.connect(gb);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  ns.start(t); ns.stop(t + dur);
}
function playBass(t, freq, dur, vol = 0.38) {
  const a = getAC(), gb = getGB();
  const osc = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = freq;
  lp.type = 'lowpass'; lp.frequency.value = 360;
  osc.connect(lp); lp.connect(g); g.connect(gb);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.85);
  g.gain.linearRampToValueAtTime(0, t + dur);
  osc.start(t); osc.stop(t + dur);
}
function playLead(t, freq, dur, vol = 0.1) {
  const a = getAC(), gb = getGB();
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = 'square'; osc.frequency.value = freq;
  osc.connect(g); g.connect(gb);
  g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0, t + dur);
  osc.start(t); osc.stop(t + dur);
}
function playArp(t, freq, dur, vol = 0.11) {
  const a = getAC(), gb = getGB();
  const osc = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
  osc.type = 'square'; osc.frequency.value = freq;
  lp.type = 'lowpass'; lp.frequency.value = freq * 2.8;
  osc.connect(lp); lp.connect(g); g.connect(gb);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.setValueAtTime(vol, t + dur * 0.65); g.gain.linearRampToValueAtTime(0, t + dur);
  osc.start(t); osc.stop(t + dur);
}
function playPad(t, freq, dur, vol = 0.048) {
  const a = getAC(), gb = getGB();
  [0, 1].forEach(d => {
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = 'sine'; osc.frequency.value = freq * (1 + d * 0.005);
    osc.connect(g); g.connect(gb);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.3);
    g.gain.setValueAtTime(vol, t + dur - 0.3); g.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t); osc.stop(t + dur);
  });
}

// ── SFX ───────────────────────────────────────────────────────────────────────
function tone(freq, type, dur, vol, t0 = null) {
  const a = getAC(); const t = t0 ?? a.currentTime;
  const osc = a.createOscillator(), g = a.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}

// ── Title Music ────────────────────────────────────────────────────────────────
let titleGainNode = null;
function getTG() {
  if (!titleGainNode) {
    titleGainNode = getAC().createGain();
    titleGainNode.gain.value = 0;
    titleGainNode.connect(getAC().destination);
  }
  return titleGainNode;
}
const TITLE_BPM = 118, TITLE_BL = 60/TITLE_BPM, TITLE_S16 = TITLE_BL/4;
const TITLE_CHORDS = [
  { bass:110,   arp:[440,523.25,659.25,880] },
  { bass:87.31, arp:[349.23,440,523.25,698.46] },
  { bass:65.41, arp:[261.63,329.63,392,523.25] },

function tKick(t,vol=0.65){const a=getAC(),tg=getTG();const osc=a.createOscillator(),g=a.createGain();osc.connect(g);g.connect(tg);osc.frequency.setValueAtTime(180,t);osc.frequency.exponentialRampToValueAtTime(0.001,t+0.5);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);osc.start(t);osc.stop(t+0.5);}
function tSnare(t,vol=0.38){const a=getAC(),tg=getTG();const ns=a.createBufferSource();ns.buffer=mkNoise(0.18);const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;const g=a.createGain();ns.connect(bp);bp.connect(g);g.connect(tg);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);ns.start(t);ns.stop(t+0.18);}
function tHat(t,open=false,vol=0.13){const a=getAC(),tg=getTG();const dur=open?0.18:0.04;const ns=a.createBufferSource();ns.buffer=mkNoise(dur);const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=9000;const g=a.createGain();ns.connect(hp);hp.connect(g);g.connect(tg);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);ns.start(t);ns.stop(t+dur);}
function tBass(t,freq,dur,vol=0.28){const a=getAC(),tg=getTG();const osc=a.createOscillator(),lp=a.createBiquadFilter(),g=a.createGain();osc.type='sawtooth';osc.frequency.value=freq;lp.type='lowpass';lp.frequency.value=420;osc.connect(lp);lp.connect(g);g.connect(tg);g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(vol,t+dur*0.85);g.gain.linearRampToValueAtTime(0,t+dur);osc.start(t);osc.stop(t+dur);}
function tPad(t,freq,dur,vol=0.05){const a=getAC(),tg=getTG();[0,0.5].forEach(dt=>{const osc=a.createOscillator(),g=a.createGain();osc.type='sine';osc.frequency.value=freq*(1+dt*0.004);osc.connect(g);g.connect(tg);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.25);g.gain.setValueAtTime(vol,t+dur-0.3);g.gain.linearRampToValueAtTime(0,t+dur);osc.start(t);osc.stop(t+dur);});}
function tArp(t,freq,dur,vol=0.10){const a=getAC(),tg=getTG();const osc=a.createOscillator(),lp=a.createBiquadFilter(),g=a.createGain();osc.type='square';osc.frequency.value=freq;lp.type='lowpass';lp.frequency.value=freq*2.5;osc.connect(lp);lp.connect(g);g.connect(tg);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.setValueAtTime(vol,t+dur*0.65);g.gain.linearRampToValueAtTime(0,t+dur);osc.start(t);osc.stop(t+dur);}

let titleBarNum = 0;
function scheduleTitleBar(t0) {
  const bl=TITLE_BL, s8=bl/2, s16=TITLE_S16;
  const chord=TITLE_CHORDS[titleBarNum%TITLE_CHORDS.length];
  titleBarNum++;
  tKick(t0); tKick(t0+bl*2);
  if (titleBarNum%4===0) tKick(t0+bl*3+s8,0.4);
  tSnare(t0+bl); tSnare(t0+bl*3);
  for (let i=0;i<8;i++) tHat(t0+i*s8,i===2||i===6,0.12);
  tHat(t0+bl*1.5,true,0.1);
  tBass(t0,chord.bass,bl*1.9); tBass(t0+bl*2,chord.bass,bl*1.9);
  chord.arp.slice(0,3).forEach(f=>tPad(t0,f,bl*3.8));
  const arpPat=[0,1,2,3,2,1,0,1,2,3,2,1,0,2,1,3];
  arpPat.forEach((ci,i)=>tArp(t0+i*s16,chord.arp[ci],s16*0.72));
}

let titleNextT=0, titleScheduleId=null;
function scheduleTitleAhead() {
  const a=getAC(), LOOK=2.5;
  while (titleNextT < a.currentTime+LOOK) { scheduleTitleBar(titleNextT); titleNextT+=TITLE_BL*4; }
}
function startTitleMusic() {
  if (titleScheduleId) return;
  const a=getAC();
  a.resume().then(()=>{
    titleBarNum=0; titleNextT=a.currentTime+0.08;
    scheduleTitleAhead();
    titleScheduleId=setInterval(scheduleTitleAhead,250);
    const g=getTG().gain;
    g.cancelScheduledValues(a.currentTime);
    g.setValueAtTime(0,a.currentTime);
    g.linearRampToValueAtTime(0.62,a.currentTime+1.4);
  });
}
function stopTitleMusic() {
  clearInterval(titleScheduleId); titleScheduleId=null;
  const a=getAC(), g=getTG().gain;
  g.cancelScheduledValues(a.currentTime);
  g.setValueAtTime(g.value,a.currentTime);
  g.linearRampToValueAtTime(0,a.currentTime+0.35);
}

// ── Songs ─────────────────────────────────────────────────────────────────────
function genMap(bpm, duration, barPattern) {
  const eighth=(60/bpm)/2;
  const bars=barPattern.split('|');
  const CH={'W':'w','A':'a','S':'s','D':'d','<':'ArrowLeft','>':'ArrowRight','^':'ArrowUp','v':'ArrowDown','L':'ArrowLeft','R':'ArrowRight'};
  const notes=[]; let t=2.0, bi=0;
  while (t < duration-1.5) {
    const bar=bars[bi%bars.length];
    for (let i=0;i<bar.length;i++) {
      const key=CH[bar[i]];
      if (key) notes.push({time:t+i*eighth, key, hit:false, missed:false});
    }
    t+=bar.length*eighth; bi++;
  }
  return notes;
}

function scheduleSong(song, audioStart, mult) {
  const bl = (60 / song.bpm) / mult;
  const dur = song.duration / mult;
  const numBars = Math.ceil(dur / (bl*4)) + 2;
  for (let b=0; b<numBars; b++) {
    const t = audioStart + b*bl*4;
    if (t < audioStart + dur + 4) song.schedule(t, bl, b);
  }
}

// ── Note / Skin Drawing ───────────────────────────────────────────────────────
function drawNote(x, y, r, col, label, t) {
  const sk = equippedSkin;
  ctx.shadowBlur = 0;

  if (sk === 'neon') {
    [3,2,1].forEach(i=>{
      ctx.strokeStyle=rgba(col,0.18*(4-i)); ctx.lineWidth=i*5;
      ctx.beginPath(); ctx.arc(x,y,r+i*5,0,Math.PI*2); ctx.stroke();
    });
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x-r*0.28,y-r*0.28,r*0.22,0,Math.PI*2); ctx.fill();
  } else if (sk === 'fire') {
    const gr=ctx.createRadialGradient(x,y-r*0.25,0,x,y,r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.25,'#ffff88');
    gr.addColorStop(0.6,'#ff6600'); gr.addColorStop(1,'#880000');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    // flicker ring
    ctx.strokeStyle=`rgba(255,180,0,${0.4+0.3*Math.sin(t*18)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,r+2,0,Math.PI*2); ctx.stroke();
  } else if (sk === 'ice') {
    const gr=ctx.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.45,'#aaddff'); gr.addColorStop(1,'#1155aa');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1;
    for (let i=0;i<6;i++){
      const a=i*Math.PI/3;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*r*0.9,y+Math.sin(a)*r*0.9); ctx.stroke();
    }
  } else if (sk === 'gold') {
    const gr=ctx.createRadialGradient(x-r*0.35,y-r*0.35,0,x,y,r);
    gr.addColorStop(0,'#ffffcc'); gr.addColorStop(0.4,'#ffdd00'); gr.addColorStop(1,'#996600');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,240,100,0.7)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,r-1.5,0,Math.PI*2); ctx.stroke();
  } else if (sk === 'star') {
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.5,'#ffff44'); gr.addColorStop(1,'#ff8800');
    ctx.fillStyle=gr;
    ctx.beginPath();
    for (let i=0;i<10;i++){
      const a=i*Math.PI/5-Math.PI/2, R=i%2===0?r:r*0.42;
      i===0?ctx.moveTo(x+Math.cos(a)*R,y+Math.sin(a)*R):ctx.lineTo(x+Math.cos(a)*R,y+Math.sin(a)*R);
    }
    ctx.closePath(); ctx.fill();
  } else if (sk === 'rainbow') {
    const gr=ctx.createLinearGradient(x-r,y,x+r,y);
    ['#ff0000','#ff8800','#ffff00','#00ff88','#00aaff','#cc00ff'].forEach((c,i,a)=>gr.addColorStop(i/(a.length-1),c));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  } else if (sk === 'diamond') {
    const s=r*1.15;
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
    const gr=ctx.createRadialGradient(-s*0.25,-s*0.25,0,0,0,s*0.9);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.4,'#ccffff'); gr.addColorStop(1,'#0077aa');
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  } else if (sk === 'void') {
    const gr=ctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.25,'#cc44ff');
    gr.addColorStop(0.65,'#330055'); gr.addColorStop(1,'#000000');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for (let i=0;i<5;i++){
      const a=t*0.7+i*1.257, rr=r*0.5*(0.35+0.65*Math.abs(Math.sin(t*0.9+i)));
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,1.3,0,Math.PI*2); ctx.fill();
    }
  } else {
    // classic
    ctx.shadowColor=col; ctx.shadowBlur=14;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.arc(x,y,r*0.5,0,Math.PI*2); ctx.fill();
  }
  // Key label
  ctx.shadowBlur=0;
  ctx.fillStyle = (sk==='classic') ? 'rgba(0,20,40,0.88)' : 'rgba(0,0,0,0.65)';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`bold ${Math.round(r*0.72)}px 'Courier New'`;
  ctx.fillText(label, x, y);
  ctx.textBaseline='alphabetic';
}

// ── Gameplay ──────────────────────────────────────────────────────────────────
function pressKey(key) {
  if (state !== 'playing') return;
  if (!LANE_INFO[key]) return;
  laneFlash[key] = 1.0;
  const now = gt();
  let best=null, bestD=Infinity;
  for (const n of notes) {
    if (n.hit||n.missed||n.key!==key) continue;
    const d=Math.abs(n.time-now);
    if (d<bestD && d<WIN_B) { bestD=d; best=n; }
  }
  if (!best) return;
  best.hit=true;
  consecutiveMisses=0;
  const diff=now-best.time, abs=Math.abs(diff);
  let pts=0, judgeText='', judgeCol='#fff';
  if (abs<=WIN_P)      { pts=300+combo*5; judg.perfect++; judgeText='PERFECT!'; judgeCol='#ffee22'; sfxPerfect(); }
  else if (abs<=WIN_G) { pts=150+combo*2; judg.good++;    judgeText='GOOD';     judgeCol='#44ffcc'; sfxGood(); }
  else if (diff<0)     { pts=50;          judg.early++;   judgeText='EARLY';    judgeCol='#55aaff'; sfxEarly(); }
  else                 { pts=50;          judg.late++;    judgeText='LATE';     judgeCol='#ff9944'; sfxLate(); }
  score+=pts; combo++;
  if (combo>maxCombo) maxCombo=combo;
  showJudge(judgeText, key, judgeCol);
  const info=LANE_INFO[key];
  const bcol=abs<=WIN_P ? info.col : '#aaaaaa';
  burst(laneX(key), hitY(), bcol, abs<=WIN_P?16:8);
}

function showJudge(text, key, col) { lastJudge={text,ts:performance.now(),key,col}; }

function burst(x, y, col, n) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=70+Math.random()*220;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-90,life:1,col,r:2+Math.random()*5});
  }
}

function startGame() {
  // Go to difficulty select first
  state = 'difficulty';
  diffIdx = 1; // default to Normal
  sfxNav();
}

function startGameWithDiff() {
  activeDiff = DIFFICULTIES[diffIdx];
  const mult = activeDiff.mult;
  getAC().resume();
  stopTitleMusic();
  unmuteGameBus();
  song = SONGS[menuIdx];
  notes = song.beatmap.map(n=>({...n, time: n.time / mult}));
  effectiveScroll = SCROLL / mult;
  score=combo=maxCombo=0; consecutiveMisses=0; livesRemaining=activeDiff.lives; lifeFlash=0; coinsEarned=0;
  judg={perfect:0,good:0,early:0,late:0,miss:0};
  particles=[]; laneFlash={}; LANE_KEYS.forEach(k=>laneFlash[k]=0);
  songScheduled=false; resultsFanfareDone=false; lastCdNum=-1;
  cdStart=performance.now();
  state='countdown';
  sfxSelect();
}

function goMenu() {
  if (state==='playing'||state==='countdown') muteGameBus();
  setTimeout(unmuteGameBus, 800);
  state='menu'; song=null;
  startTitleMusic();
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked=true;
  getAC().resume().then(()=>startTitleMusic());
}

function enterMenu() { unlockAudio(); state='menu'; }

// ── Input ─────────────────────────────────────────────────────────────────────
addEventListener('keydown', e => {
  if (state==='splash') { enterMenu(); return; }
  if (state==='menu') {
    if (e.key==='ArrowLeft')  { menuIdx=(menuIdx-1+SONGS.length)%SONGS.length; sfxNav(); return; }
    if (e.key==='ArrowRight') { menuIdx=(menuIdx+1)%SONGS.length; sfxNav(); return; }
    if (e.key==='Enter'||e.key===' ') { startGame(); return; }
    if (e.key==='s'||e.key==='S') { state='shop'; sfxNav(); return; }
    return;
  }
  if (state==='difficulty') {
    if (e.key==='ArrowLeft')  { diffIdx=(diffIdx-1+DIFFICULTIES.length)%DIFFICULTIES.length; sfxNav(); return; }
    if (e.key==='ArrowRight') { diffIdx=(diffIdx+1)%DIFFICULTIES.length; sfxNav(); return; }
    if (e.key==='Enter'||e.key===' ') { startGameWithDiff(); return; }
    if (e.key==='Escape') { state='menu'; return; }
    return;
  }
  if (state==='results'||state==='gameover') { if (e.key==='Enter'||e.key===' '||e.key==='Escape') goMenu(); return; }
  if (state==='shop') { if (e.key==='Escape') { state='menu'; return; } return; }
  const nk=(['w','a','s','d'].includes(e.key.toLowerCase()))?e.key.toLowerCase():e.key;
  if (LANE_INFO[nk]) { pressKey(nk); return; }
  if (e.key==='Escape') goMenu();
});

cvs.addEventListener('mousedown', e => {
  e.preventDefault();
  if (state==='splash')     { enterMenu(); return; }
  if (state==='menu')       { menuClick(e.clientX, e.clientY, e.button); return; }
  if (state==='difficulty') { diffClick(e.clientX, e.clientY); return; }
  if (state==='results'||state==='gameover') { goMenu(); return; }
  if (state==='shop')       { shopClick(e.clientX, e.clientY); return; }
  if (state==='playing')    { if (e.button===0) pressKey('ArrowLeft'); if (e.button===2) pressKey('ArrowRight'); }
});
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ── Click Handlers ────────────────────────────────────────────────────────────
function menuClick(mx, my, btn) {
  if (btn!==0) return;
  // Shop button
  const sbx=W-130, sby=18, sbw=112, sbh=32;
  if (mx>=sbx&&mx<=sbx+sbw&&my>=sby&&my<=sby+sbh) { state='shop'; sfxNav(); return; }
  const COLS=3;
  const cw=Math.min(240,(W-60)/COLS-16), ch=Math.min(210,H*0.28);
  const hgap=Math.min(20,cw*0.08), vgap=Math.min(16,ch*0.08);
  const gridW=COLS*cw+(COLS-1)*hgap, gridX=W/2-gridW/2, gridY=H*0.26;
  for (let i=0;i<SONGS.length;i++) {
    const cx=gridX+(i%COLS)*(cw+hgap), cy=gridY+Math.floor(i/COLS)*(ch+vgap);
    if (mx>=cx&&mx<=cx+cw&&my>=cy&&my<=cy+ch) {
      if (menuIdx===i) startGame(); else { menuIdx=i; sfxNav(); }
      return;
    }
  }
}

function diffClick(mx, my) {
  // Back button
  if (mx>=18&&mx<=100&&my>=18&&my<=44) { state='menu'; sfxNav(); return; }
  const bw=Math.min(130,(W-80)/5-10), bh=90;
  const gap=10;
  const totalW=5*bw+4*gap, startX=W/2-totalW/2;
  const by=H*0.44;
  for (let i=0;i<DIFFICULTIES.length;i++) {
    const bx=startX+i*(bw+gap);
    if (mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh) {
      diffIdx=i;
      if (diffIdx===i) startGameWithDiff(); else sfxNav();
      return;
    }
  }
  // Play button
  const pbx=W/2-90, pby=H*0.72, pbw=180, pbh=46;
  if (mx>=pbx&&mx<=pbx+pbw&&my>=pby&&my<=pby+pbh) { startGameWithDiff(); return; }
}

function shopClick(mx, my) {
  // Back button
  if (mx>=18&&mx<=100&&my>=18&&my<=44) { state='menu'; sfxNav(); return; }
  const COLS=3, ROWS=3;
  const cw=Math.min(180,(W-60)/COLS-14), ch=Math.min(160,H*0.22);
  const hgap=14, vgap=12;
  const gridW=COLS*cw+(COLS-1)*hgap, gridX=W/2-gridW/2;
  const gridY=H*0.18;
  for (let i=0;i<SKINS.length;i++) {
    const cx=gridX+(i%COLS)*(cw+hgap), cy=gridY+Math.floor(i/COLS)*(ch+vgap);
    if (mx>=cx&&mx<=cx+cw&&my>=cy&&my<=cy+ch) {
      const sk=SKINS[i];
      if (equippedSkin===sk.key) return; // already equipped, do nothing
      if (ownedSkins.includes(sk.key)) {
        equippedSkin=sk.key; saveSave(); sfxNav(); return;
      }
      if (coins>=sk.price) {
        coins-=sk.price; ownedSkins.push(sk.key); equippedSkin=sk.key; saveSave(); sfxBuy(); return;
      }
      // not enough coins — flash?
      sfxMiss();
      return;
    }
  }
}

// ── Drawing Helpers ───────────────────────────────────────────────────────────
function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function rr(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function arrowShape(x,y,r,left) {
  ctx.beginPath();
  if (left) { ctx.moveTo(x-r,y); ctx.lineTo(x+r*.5,y-r*.65); ctx.lineTo(x+r*.5,y+r*.65); }
  else       { ctx.moveTo(x+r,y); ctx.lineTo(x-r*.5,y-r*.65); ctx.lineTo(x-r*.5,y+r*.65); }
  ctx.closePath(); ctx.fill();
}
function bgGrid() {
  ctx.strokeStyle='rgba(80,80,180,0.04)'; ctx.lineWidth=1;
  for (let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for (let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

// ── Draw: Gameplay ────────────────────────────────────────────────────────────
function drawGame(dt) {
  const now=gt(), hy=hitY();
  ctx.fillStyle='#03030c'; ctx.fillRect(0,0,W,H);

  // Zone labels
  ctx.textAlign='center';
  ctx.font=`bold ${Math.min(10,W/110)}px 'Courier New'`;
  ctx.fillStyle='rgba(255,140,60,0.22)';
  ctx.fillText('BEATS  ( W A S D )',W*0.25,22);
  ctx.fillStyle='rgba(100,180,255,0.22)';
  ctx.fillText('MELODY  ( ← ↑ ↓ → )',W*0.75,22);

  // Center divider
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  ctx.setLineDash([5,9]);
  ctx.beginPath(); ctx.moveTo(W*0.5,0); ctx.lineTo(W*0.5,H); ctx.stroke();
  ctx.setLineDash([]);

  // Lane glows and guide lines
  for (const k of LANE_KEYS) {
    const info=LANE_INFO[k], lx=info.xf*W, fl=laneFlash[k]||0;
    if (fl>0) {
      const lg=ctx.createLinearGradient(lx-LANE_W,0,lx+LANE_W,0);
      lg.addColorStop(0,rgba(info.col,0)); lg.addColorStop(0.5,rgba(info.col,fl*0.14)); lg.addColorStop(1,rgba(info.col,0));
      ctx.fillStyle=lg; ctx.fillRect(lx-LANE_W,0,LANE_W*2,H);
    }
    laneFlash[k]=Math.max(0,fl-dt*5.5);
    ctx.strokeStyle=rgba(info.col,0.12); ctx.lineWidth=1;
    ctx.setLineDash([5,9]);
    ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Hit line
  ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(W,hy); ctx.stroke();

  // Consecutive miss warning
  const warnAt = activeDiff.deathAt - 2;
  if (consecutiveMisses >= warnAt) {
    const pulse=0.5+0.5*Math.sin(performance.now()/180);
    ctx.textAlign='center'; ctx.font=`bold ${Math.min(14,W/62)}px 'Courier New'`;
    ctx.fillStyle=`rgba(255,50,50,${pulse*0.9})`;
    const left = activeDiff.deathAt - consecutiveMisses;
    const wlabel = activeDiff.lives>1 ? 'LIFE LOST' : 'GAME OVER';
    ctx.fillText(`${left} MORE MISS = ${wlabel}`,W/2,H*0.12);
  }

  // Life-lost flash overlay
  if (lifeFlash > 0) {
    ctx.fillStyle=`rgba(255,0,0,${lifeFlash*0.35})`;
    ctx.fillRect(0,0,W,H);
  }

  // Lives display (IMPOSSIBLE only)
  if (activeDiff.lives > 1) {
    ctx.textAlign='left'; ctx.font=`bold ${Math.min(13,W/70)}px 'Courier New'`;
    for (let li=0;li<activeDiff.lives;li++) {
      ctx.fillStyle = li < livesRemaining ? '#ff44ff' : '#332233';
      ctx.fillText('♥', 18 + li*20, H*0.5);
    }
    ctx.font=`${Math.min(9,W/100)}px 'Courier New'`; ctx.fillStyle='#552255';
    ctx.fillText('LIVES',18,H*0.5+14);
  }

  // Hit targets
  for (const k of LANE_KEYS) {
    const info=LANE_INFO[k], lx=info.xf*W, fl=laneFlash[k]||0;
    ctx.strokeStyle=rgba(info.col, 0.38+fl*0.55); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(lx,hy,22,0,Math.PI*2); ctx.stroke();
    if (fl>0){ctx.fillStyle=rgba(info.col,fl*0.20);ctx.beginPath();ctx.arc(lx,hy,22,0,Math.PI*2);ctx.fill();}
    ctx.textAlign='center'; ctx.font=`bold ${Math.min(10,W/110)}px 'Courier New'`;
    ctx.fillStyle=rgba(info.col, 0.45+fl*0.4); ctx.fillText(info.label,lx,hy+38);
  }

  // Notes
  for (const n of notes){
    if (n.hit||n.missed) continue;
    const info=LANE_INFO[n.key]; if(!info) continue;
    const lx=info.xf*W;
    const ny=hy-(n.time-now)/effectiveScroll*H*HIT_FRAC;
    if (ny<-60||ny>H+60) continue;
    drawNote(lx, ny, 20, info.col, info.label, now);
  }

  // Particles
  for (const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;

  // Judge popup
  const ja=(performance.now()-lastJudge.ts)/680;
  if (ja<1){
    const jinfo=LANE_INFO[lastJudge.key]||LANE_INFO['ArrowLeft'];
    ctx.globalAlpha=1-ja; ctx.textAlign='center';
    ctx.font=`bold ${Math.min(22,W/45)}px 'Courier New'`;
    ctx.shadowColor=lastJudge.col; ctx.shadowBlur=14; ctx.fillStyle=lastJudge.col;
    ctx.fillText(lastJudge.text,jinfo.xf*W,hy-60-ja*35);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  ctx.textAlign='right';
  ctx.font=`bold ${Math.min(36,W/26)}px 'Courier New'`;
  ctx.fillStyle='#ffffff'; ctx.fillText(String(score).padStart(8,'0'),W-18,52);
  ctx.font=`${Math.min(10,W/92)}px 'Courier New'`; ctx.fillStyle='#334455'; ctx.fillText('SCORE',W-18,66);

  if (combo>=2){
    ctx.textAlign='center';
    ctx.font=`bold ${Math.min(32,W/26)}px 'Courier New'`;
    ctx.shadowColor=song.colL; ctx.shadowBlur=18;
    ctx.fillStyle='#ffffff'; ctx.fillText(`×${combo}`,W/2,48);
    ctx.shadowBlur=0;
    ctx.font=`${Math.min(10,W/92)}px 'Courier New'`; ctx.fillStyle='#334455'; ctx.fillText('COMBO',W/2,62);
  }

  ctx.textAlign='left';
  ctx.font=`bold ${Math.min(13,W/75)}px 'Courier New'`; ctx.fillStyle=song.colL; ctx.fillText(song.name,18,26);
  ctx.font=`${Math.min(10,W/95)}px 'Courier New'`; ctx.fillStyle='#2a3a4a';
  ctx.fillText(song.artist+' · '+song.bpm+' BPM · '+activeDiff.name,18,40);

  const labels=[['P',judg.perfect,'#ffee22'],['G',judg.good,'#44ffcc'],['E',judg.early,'#55aaff'],['L',judg.late,'#ff9944'],['M',judg.miss,'#ff4444']];
  ctx.font=`${Math.min(10,W/95)}px 'Courier New'`;
  labels.forEach(([lbl,val,col],i)=>{ctx.fillStyle=col;ctx.fillText(`${lbl}:${val}`,18,58+i*16);});

  // Accuracy live
  const tot=judg.perfect+judg.good+judg.early+judg.late+judg.miss;
  const liveAcc=tot>0?Math.round((judg.perfect+judg.good*0.66+(judg.early+judg.late)*0.33)/tot*100):100;
  ctx.font=`${Math.min(10,W/95)}px 'Courier New'`;
  ctx.fillStyle=liveAcc>=70?'#44ff88':'#ff4444';
  ctx.fillText(`ACC ${liveAcc}%  ${liveAcc>=70?'▲PASS':'▼FAIL'}`,18,58+5*16);

  const prog=Math.min(1,now/(song.duration/activeDiff.mult));
  ctx.fillStyle='#0d0d1f'; ctx.fillRect(0,H-5,W,5);
  const pg=ctx.createLinearGradient(0,0,W,0);
  pg.addColorStop(0,song.colR||song.colL); pg.addColorStop(1,song.colL);
  ctx.fillStyle=pg; ctx.fillRect(0,H-5,W*prog,5);
  ctx.textAlign='left'; ctx.font=`${Math.min(10,W/95)}px 'Courier New'`; ctx.fillStyle='#1a2535';
  ctx.fillText('ESC ← Menu',18,H-10);
}

// ── Draw: Game Over ───────────────────────────────────────────────────────────
function drawGameOver() {
  const nt=performance.now()/1000;
  ctx.fillStyle='#03030c'; ctx.fillRect(0,0,W,H);
  bgGrid();
  ctx.textAlign='center';
  ctx.font=`bold ${Math.min(80,W/10)}px 'Courier New'`;
  ctx.shadowColor='#ff2222'; ctx.shadowBlur=65;
  ctx.fillStyle='#ff3333'; ctx.fillText('GAME OVER',W/2,H*0.36);
  ctx.shadowBlur=0;
  ctx.font=`${Math.min(16,W/55)}px 'Courier New'`; ctx.fillStyle='#883333';
  ctx.fillText('5 CONSECUTIVE MISSES',W/2,H*0.48);

  // Mini stats
  ctx.font=`${Math.min(13,W/70)}px 'Courier New'`; ctx.fillStyle='#445566';
  ctx.fillText(`SCORE: ${String(score).padStart(8,'0')}  ·  MAX COMBO: ${maxCombo}×`,W/2,H*0.58);

  const pulse=0.5+0.5*Math.sin(nt*2.5);
  ctx.globalAlpha=pulse;
  ctx.font=`bold ${Math.min(16,W/52)}px 'Courier New'`; ctx.fillStyle='#8899cc';
  ctx.fillText('ENTER / CLICK TO RETURN',W/2,H*0.7);
  ctx.globalAlpha=1;
}

// ── Draw: Results ─────────────────────────────────────────────────────────────
function drawResults() {
  ctx.fillStyle='#03030c'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font=`bold ${Math.min(54,W/14)}px 'Courier New'`;
  ctx.shadowColor=song.colL; ctx.shadowBlur=35;
  ctx.fillStyle='#ffffff'; ctx.fillText('RESULTS',W/2,H*0.10);
  ctx.shadowBlur=0;
  ctx.font=`${Math.min(13,W/68)}px 'Courier New'`; ctx.fillStyle='#334455';
  ctx.fillText(song.name+' · '+song.artist+' · '+activeDiff.name,W/2,H*0.17);

  const total=judg.perfect+judg.good+judg.early+judg.late+judg.miss;
  const acc=total>0?(judg.perfect+judg.good*0.66+(judg.early+judg.late)*0.33)/total:0;
  const passed=acc>=0.70;
  let grade='F';
  if(acc>=0.94)grade='S'; else if(acc>=0.84)grade='A'; else if(acc>=0.70)grade='B'; else if(acc>=0.55)grade='C'; else grade='D';

  if (!resultsFanfareDone){
    resultsFanfareDone=true;
    coinsEarned=passed?activeDiff.coins:0;
    if(passed){coins+=coinsEarned; saveSave();}
    if(passed) sfxWin(); else sfxLose();
    startTitleMusic();
  }

  const gc={S:'#ffdd00',A:'#00eeff',B:'#44ff88',C:'#ffaa33',D:'#ff6644',F:'#ff2222'};
  ctx.font=`bold ${Math.min(100,H*0.17)}px 'Courier New'`;
  ctx.shadowColor=gc[grade]; ctx.shadowBlur=50;
  ctx.fillStyle=gc[grade]; ctx.fillText(grade,W/2,H*0.44);
  ctx.shadowBlur=0;

  // Pass / Fail banner
  ctx.font=`bold ${Math.min(22,W/40)}px 'Courier New'`;
  ctx.shadowColor=passed?'#44ff88':'#ff4444'; ctx.shadowBlur=20;
  ctx.fillStyle=passed?'#44ff88':'#ff4444';
  ctx.fillText(passed?'✓  CLEARED!':'✗  FAILED — need 70%',W/2,H*0.54);
  ctx.shadowBlur=0;

  const row1=[['PERFECT',judg.perfect,'#ffee22'],['GOOD',judg.good,'#44ffcc'],['EARLY',judg.early,'#55aaff']];
  const row2=[['LATE',judg.late,'#ff9944'],['MISS',judg.miss,'#ff4444'],['MAX COMBO',maxCombo+'×',song.colL]];
  const colW=Math.min(155,W*0.16);
  [[row1,H*0.62],[row2,H*0.62+46]].forEach(([row,ry])=>{
    const rx=W/2-(row.length/2-0.5)*colW;
    row.forEach(([lbl,val,col],i)=>{
      const x=rx+i*colW;
      ctx.font=`${Math.min(10,W/88)}px 'Courier New'`; ctx.fillStyle='#445566'; ctx.fillText(lbl,x,ry);
      ctx.font=`bold ${Math.min(18,W/44)}px 'Courier New'`; ctx.fillStyle=col; ctx.fillText(String(val),x,ry+21);
    });
  });

  ctx.font=`${Math.min(13,W/68)}px 'Courier New'`; ctx.fillStyle='#aaaaff';
  ctx.fillText(`ACCURACY: ${(acc*100).toFixed(1)}%  (need 70% to pass)`,W/2,H*0.78);

  // Coins earned
  ctx.font=`bold ${Math.min(13,W/68)}px 'Courier New'`;
  ctx.fillStyle=passed?'#ffdd44':'#665533';
  ctx.fillText(passed?`+${coinsEarned} COINS  ·  TOTAL: ${coins}`:'no coins — clear the song first!',W/2,H*0.84);

  const pulse=0.5+0.5*Math.sin(performance.now()/520);
  ctx.globalAlpha=pulse; ctx.font=`${Math.min(15,W/55)}px 'Courier New'`; ctx.fillStyle='#8899cc';
  ctx.fillText('ENTER / CLICK TO RETURN',W/2,H*0.92);
  ctx.globalAlpha=1;
}

// ── Draw: Shop ────────────────────────────────────────────────────────────────
function drawShop() {
  const nt=performance.now()/1000;
  ctx.fillStyle='#03030c'; ctx.fillRect(0,0,W,H);
  bgGrid();

  // Back
  ctx.fillStyle='rgba(20,20,40,0.9)'; rr(18,18,78,26,6); ctx.fill();
  ctx.strokeStyle='#334466'; ctx.lineWidth=1; rr(18,18,78,26,6); ctx.stroke();
  ctx.textAlign='center'; ctx.font=`${Math.min(11,W/90)}px 'Courier New'`;
  ctx.fillStyle='#667799'; ctx.fillText('◄ BACK',57,35);

  // Coins
  ctx.textAlign='right'; ctx.font=`bold ${Math.min(15,W/70)}px 'Courier New'`;
  ctx.fillStyle='#ffdd00'; ctx.fillText(`COINS: ${coins}`,W-18,36);

  ctx.textAlign='center';
  ctx.font=`bold ${Math.min(48,W/15)}px 'Courier New'`;
  ctx.shadowColor='#ffaa33'; ctx.shadowBlur=30;
  ctx.fillStyle='#ffffff'; ctx.fillText('SKIN SHOP',W/2,H*0.10);
  ctx.shadowBlur=0;

  const COLS=3;
  const cw=Math.min(175,(W-60)/COLS-14), ch=Math.min(155,H*0.22);
  const hgap=14, vgap=12;
  const gridW=COLS*cw+(COLS-1)*hgap, gridX=W/2-gridW/2, gridY=H*0.16;

  SKINS.forEach((sk,i)=>{
    const col2=i%COLS, row=Math.floor(i/COLS);
    const cx=gridX+col2*(cw+hgap), cy=gridY+row*(ch+vgap);
    const owned=ownedSkins.includes(sk.key);
    const equipped=equippedSkin===sk.key;
    const canBuy=!owned&&coins>=sk.price;

    if (equipped){ctx.shadowColor='#ffdd00';ctx.shadowBlur=16;}
    const bg=ctx.createLinearGradient(cx,cy,cx,cy+ch);
    bg.addColorStop(0,equipped?'rgba(40,30,0,1)':owned?'rgba(12,18,12,1)':'rgba(10,10,22,1)');
    bg.addColorStop(1,'rgba(4,4,14,1)');
    ctx.fillStyle=bg;
    ctx.strokeStyle=equipped?'#ffdd00':owned?'#336633':'#1a2540';
    ctx.lineWidth=equipped?2:1;
    rr(cx,cy,cw,ch,10); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;

    // Skin preview
    const previewCol=equipped?'#ffdd00':owned?'#44ff88':'#4488aa';
    drawSkinPreview(sk.key, cx+cw/2, cy+ch*0.34, 20, previewCol);

    ctx.textAlign='center';
    ctx.font=`bold ${Math.min(11,cw/14)}px 'Courier New'`;
    ctx.fillStyle=equipped?'#ffdd00':owned?'#88dd88':'#aabbcc';
    ctx.fillText(sk.name, cx+cw/2, cy+ch*0.62);

    ctx.font=`${Math.min(9,cw/17)}px 'Courier New'`;
    ctx.fillStyle='#445566'; ctx.fillText(sk.desc, cx+cw/2, cy+ch*0.74);

    // Status / price
    ctx.font=`bold ${Math.min(10,cw/16)}px 'Courier New'`;
    if (equipped)       { ctx.fillStyle='#ffdd00'; ctx.fillText('EQUIPPED',cx+cw/2,cy+ch*0.87); }
    else if (owned)     { ctx.fillStyle='#44aa44'; ctx.fillText('TAP TO EQUIP',cx+cw/2,cy+ch*0.87); }
    else if (sk.price===0){ ctx.fillStyle='#44ff88'; ctx.fillText('FREE',cx+cw/2,cy+ch*0.87); }
    else if (canBuy)    { ctx.fillStyle='#ffaa33'; ctx.fillText(`${sk.price}c — BUY`,cx+cw/2,cy+ch*0.87); }
    else                { ctx.fillStyle='#554444'; ctx.fillText(`${sk.price}c`,cx+cw/2,cy+ch*0.87); }
  });

  ctx.textAlign='center'; ctx.font=`${Math.min(11,W/88)}px 'Courier New'`; ctx.fillStyle='#334455';
  ctx.fillText('Click a skin to buy / equip  ·  ESC or BACK to return',W/2,H*0.94);
}

// ── Main Loop ─────────────────────────────────────────────────────────────────
let prev = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt=Math.min((now-prev)/1000,0.1);
  prev=now;

  if (state==='playing'){
    const gtime=gt();
    // Miss detection
    for (const n of notes){
      if (!n.hit&&!n.missed&&n.time<gtime-WIN_B){
        n.missed=true; combo=0; judg.miss++;
        consecutiveMisses++;
        showJudge('MISS',n.key,'#ff4444'); sfxMiss();
        if (consecutiveMisses >= activeDiff.deathAt) {
          consecutiveMisses = 0;
          livesRemaining--;
          if (livesRemaining <= 0) {
            muteGameBus();
            state='gameover';
            sfxLose();
            return;
          }
          // Life lost but still alive — flash and warn, stop processing this frame
          lifeFlash = 1.0;
          showJudge('LIFE LOST!', n.key, '#ff00ff');
          sfxLose();
          break;
        }
      }
    }
    lifeFlash = Math.max(0, lifeFlash - dt*2.5);
    for (const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=330*dt;p.life-=dt*2.4;}
    particles=particles.filter(p=>p.life>0);
    const gameDur=song.duration/activeDiff.mult;
    if (gtime>gameDur+0.6){ state='results'; return; }
    drawGame(dt);
  } else if (state==='splash')     drawSplash();
  else if (state==='menu')         drawMenu();
  else if (state==='difficulty')   drawDifficulty();
  else if (state==='countdown')    drawCountdown();
  else if (state==='results')      drawResults();
  else if (state==='gameover')     drawGameOver();
  else if (state==='shop')         drawShop();
}

requestAnimationFrame(loop);
</script>
