// ── AUDIO ────────────────────────────────────────────────────
const Audio = (() => {
  let ac, masterGain, sfxGain, musicGain, mNodes=[];
  let initialized=false;
  function init(){
    if(initialized) return;
    initialized=true;
    ac = new (window.AudioContext||window.webkitAudioContext)();
    masterGain=ac.createGain(); masterGain.gain.value=1; masterGain.connect(ac.destination);
    musicGain=ac.createGain(); musicGain.gain.value=0.25; musicGain.connect(masterGain);
    sfxGain=ac.createGain(); sfxGain.gain.value=0.55; sfxGain.connect(masterGain);
  }
  function resume(){ if(ac&&ac.state==='suspended') ac.resume(); }
  function stopMusic(){
    mNodes.forEach(n=>{ try{ n.stop?n.stop():n.disconnect(); }catch(e){} });
    mNodes=[];
  }
  function osc(freq,type,startT,stopT,vol,dest,freqRamp){
    if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    if(freqRamp) freqRamp(o.frequency,startT,ac);
    g.gain.setValueAtTime(vol||0.2, startT);
    g.gain.exponentialRampToValueAtTime(0.001, stopT);
    o.connect(g); g.connect(dest||sfxGain);
    o.start(startT); o.stop(stopT);
    return o;
  }
  function noise(dur, startT, vol, filtFreq){
    if(!ac) return;
    const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=filtFreq||800;
    src.buffer=buf;
    g.gain.setValueAtTime(vol||0.2,startT);
    g.gain.exponentialRampToValueAtTime(0.001,startT+dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(startT);
    return src;
  }
  function playMenuMusic(){
    if(!ac) return; stopMusic();
    const drones=[55,82.5,110];
    drones.forEach(f=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sine'; o.frequency.value=f; g.gain.value=0.04; o.connect(g); g.connect(musicGain); o.start(); mNodes.push(o); });
    const arp=[220,261.6,329.6,392,329.6,261.6]; let t=ac.currentTime;
    function schedArp(){
      arp.forEach((f,i)=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0,t+i*0.6); g.gain.linearRampToValueAtTime(0.08,t+i*0.6+0.1); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.6+0.55);
        o.connect(g); g.connect(musicGain); o.start(t+i*0.6); o.stop(t+i*0.6+0.6); mNodes.push(o); });
      t+=arp.length*0.6;
      const tid=setTimeout(schedArp,(arp.length*0.6-0.5)*1000); mNodes.push({stop:()=>clearTimeout(tid)});
    } schedArp();
  }
  function playBattleMusic(){
    if(!ac) return; stopMusic();
    const melody=[110,138.6,165,184.9,220,184.9,165,138.6,110,138.6,165,220,184.9,165,138.6,110];
    let t=ac.currentTime; const beat=0.25;
    function loop(){
      melody.forEach((f,i)=>{
        const o=ac.createOscillator(),g=ac.createGain(),flt=ac.createBiquadFilter();
        o.type='sawtooth'; o.frequency.value=f; flt.type='lowpass'; flt.frequency.value=900;
        g.gain.setValueAtTime(0,t+i*beat); g.gain.linearRampToValueAtTime(0.12,t+i*beat+0.04);
        g.gain.setValueAtTime(0.12,t+i*beat+beat*0.7); g.gain.linearRampToValueAtTime(0,t+i*beat+beat);
        o.connect(flt); flt.connect(g); g.connect(musicGain); o.start(t+i*beat); o.stop(t+i*beat+beat); mNodes.push(o);
      });
      // bass drum on beats 1,5,9,13
      [0,4,8,12].forEach(i=>{ const o=ac.createOscillator(),g=ac.createGain(); o.type='sine';
        o.frequency.setValueAtTime(80,t+i*beat); o.frequency.exponentialRampToValueAtTime(40,t+i*beat+0.25);
        g.gain.setValueAtTime(0.4,t+i*beat); g.gain.exponentialRampToValueAtTime(0.001,t+i*beat+0.25);
        o.connect(g); g.connect(musicGain); o.start(t+i*beat); o.stop(t+i*beat+0.25); mNodes.push(o); });
      // snare 3,7,11,15
      [2,6,10,14].forEach(i=>{ noise(0.12,t+i*beat,0.15,1200); });
      t+=melody.length*beat;
      const tid=setTimeout(loop,(melody.length*beat-0.3)*1000); mNodes.push({stop:()=>clearTimeout(tid)});
    } loop();
  }
  function attack(){
    if(!ac) return; const t=ac.currentTime;
    osc(350,'sawtooth',t,t+0.12,0.35,sfxGain,(f,st)=>{ f.setValueAtTime(350,st); f.exponentialRampToValueAtTime(80,st+0.12); });
    noise(0.1,t+0.05,0.2,600);
  }
  function hit(){
    if(!ac) return; const t=ac.currentTime;
    osc(250,'square',t,t+0.18,0.3,sfxGain,(f,st)=>{ f.setValueAtTime(250,st); f.exponentialRampToValueAtTime(80,st+0.18); });
  }
  function coin(){
    if(!ac) return; const t=ac.currentTime;
    [880,1320,1760].forEach((f,i)=>{ osc(f,'sine',t+i*0.08,t+i*0.08+0.22,0.15); });
  }
  function spinTick(){
    if(!ac) return; const t=ac.currentTime;
    osc(1400,'sine',t,t+0.03,0.04);
  }
  function spinStart(){
    if(!ac) return; const t=ac.currentTime;
    osc(200,'sawtooth',t,t+0.6,0.2,sfxGain,(f,st)=>{ f.setValueAtTime(200,st); f.exponentialRampToValueAtTime(1200,st+0.5); });
  }
  function victory(){
    if(!ac) return; stopMusic(); const t=ac.currentTime;
    [523,659,784,659,784,1047].forEach((f,i)=>{ osc(f,'sine',t+i*0.16,t+i*0.16+0.3,0.25); });
  }
  function death(){
    if(!ac) return; stopMusic(); const t=ac.currentTime;
    osc(440,'sawtooth',t,t+1.8,0.3,sfxGain,(f,st)=>{ f.setValueAtTime(440,st); f.exponentialRampToValueAtTime(40,st+1.8); });
  }
  function roar(type){
    if(!ac) return; const t=ac.currentTime;
    const fm={slime:300,goblin:400,orc:200,troll:120,dragon:80,demon:60,archdemon:50,boss:35}[type]||100;
    osc(fm,'sawtooth',t,t+0.6,0.35,sfxGain,(f,st)=>{ f.setValueAtTime(fm,st); f.setValueAtTime(fm*1.5,st+0.1); f.exponentialRampToValueAtTime(fm*0.3,st+0.6); });
    noise(0.4,t,0.2,fm*3);
  }
  function usepower(){
    if(!ac) return; const t=ac.currentTime;
    [440,550,660,880].forEach((f,i)=>{ osc(f,'sine',t+i*0.07,t+i*0.07+0.2,0.15); });
  }
  let _inited=false;
  function initOnce(){ if(_inited)return; _inited=true; init(); resume(); playMenuMusic(); }
  return {init,resume,stopMusic,playMenuMusic,playBattleMusic,attack,hit,coin,spinTick,spinStart,victory,death,roar,usepower,initOnce};
})();

// ── PARTICLES ────────────────────────────────────────────────
const PS = (() => {
  let pool=[];
  function emit(x,y,n,col,spd,sz,life,grav=true){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=(0.5+Math.random()*0.5)*spd;
      pool.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,sz:(0.5+Math.random()*0.5)*sz,life,ml:life,grav});
    }
  }
  function hit(x,y,col){ emit(x,y,12,col,160,5,0.7); emit(x,y,8,'#fff',220,3,0.3); }
  function explosion(x,y,col){ emit(x,y,25,col,280,7,1.0); emit(x,y,15,'#fff',320,3,0.35); emit(x,y,10,'#ffaa00',200,5,0.8); }
  function coins(x,y){ emit(x,y,8,'#f1c40f',110,4,0.9); emit(x,y,4,'#fff',160,2,0.4); }
  function sparkle(x,y,col){ emit(x,y,6,col,80,3,0.5,false); }
  function update(dt){
    pool=pool.filter(p=>p.life>0);
    pool.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.grav) p.vy+=280*dt; p.life-=dt; });
  }
  function draw(){
    pool.forEach(p=>{
      const a=p.life/p.ml;
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=p.sz*3;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
  }
  return {emit,hit,explosion,coins,sparkle,update,draw};
})();

// ── FLOATING TEXTS ───────────────────────────────────────────
let floats=[];
function addFloat(text,x,y,col,sz=22){
  floats.push({text,x,y,col,sz,life:1.2,vy:-60});
}
function updateFloats(dt){
  floats=floats.filter(f=>f.life>0);
  floats.forEach(f=>{ f.y+=f.vy*dt; f.vy*=0.96; f.life-=dt; });
}
function drawFloats(){
  floats.forEach(f=>{
    const a=f.life/1.2;
    ctx.save(); ctx.globalAlpha=a; ctx.font=`bold ${f.sz}px sans-serif`; ctx.textAlign='center';
    ctx.shadowColor=f.col; ctx.shadowBlur=10; ctx.fillStyle=f.col;
    ctx.fillText(f.text,f.x,f.y); ctx.restore();
  });
}

// ── DRAWING UTILITIES ────────────────────────────────────────
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
}
function glow(col,blur){ ctx.shadowColor=col; ctx.shadowBlur=blur; }
function noglow(){ ctx.shadowColor='transparent'; ctx.shadowBlur=0; }
function text(str,x,y,col,sz,align='center',font='sans-serif'){
  ctx.font=`${sz}px ${font}`; ctx.textAlign=align; ctx.fillStyle=col; ctx.fillText(str,x,y);
}
function btext(str,x,y,col,sz,align='center'){
  ctx.font=`bold ${sz}px sans-serif`; ctx.textAlign=align; ctx.fillStyle=col; ctx.fillText(str,x,y);
}
function hpBar(x,y,w,h,cur,max,col){
  ctx.fillStyle='#111'; rr(x,y,w,h,h/2);
  const pct=Math.max(0,cur/max), c=pct>0.5?col:pct>0.25?'#e67e22':'#e74c3c';
  if(pct>0){ ctx.fillStyle=c; glow(c,8); rr(x,y,w*pct,h,h/2); noglow(); }
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(x,y,w,h,h/2); ctx.stroke();
}
function button(x,y,w,h,label,col,hovered,sublabel){
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,hovered?lighten(col,40):col);
  g.addColorStop(1,hovered?col:darken(col,40));
  ctx.fillStyle=g;
  if(hovered){ glow(col,18); }
  rr(x,y,w,h,8);
  noglow();
  ctx.strokeStyle=hovered?'#fff':'rgba(255,255,255,0.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`bold 16px sans-serif`; ctx.textAlign='center';
  ctx.fillText(label,x+w/2,y+h/2+(sublabel?-6:5));
  if(sublabel){ ctx.font='12px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillText(sublabel,x+w/2,y+h/2+12); }
}
function lighten(hex,amt){
  let c=parseInt(hex.slice(1),16);
  return '#'+[c>>16,(c>>8)&255,c&255].map(v=>Math.min(255,v+amt).toString(16).padStart(2,'0')).join('');
}
function darken(hex,amt){ return lighten(hex,-amt); }

// ── BACKGROUND ───────────────────────────────────────────────
function drawBg(type){
  // Deep space / dungeon background
  if(type==='battle'){
    const g=ctx.createLinearGradient(0,0,0,BH);
    g.addColorStop(0,'#0a0008'); g.addColorStop(0.5,'#120015'); g.addColorStop(1,'#050010');
    ctx.fillStyle=g; ctx.fillRect(0,0,BW,BH);
    // Ground
    const gg=ctx.createLinearGradient(0,BH-150,0,BH);
    gg.addColorStop(0,'#1a0030'); gg.addColorStop(1,'#0a0015');
    ctx.fillStyle=gg; ctx.fillRect(0,BH-150,BW,150);
    // Stone cracks
    ctx.strokeStyle='rgba(100,0,150,0.15)'; ctx.lineWidth=1;
    for(let i=0;i<6;i++){
      const sx=100+i*200,sy=BH-140;
      ctx.beginPath(); ctx.moveTo(sx,sy);
      ctx.lineTo(sx+30+Math.sin(i)*20,sy+70); ctx.lineTo(sx+10,sy+140); ctx.stroke();
    }
  } else {
    const g=ctx.createLinearGradient(0,0,0,BH);
    g.addColorStop(0,'#020010'); g.addColorStop(1,'#08001a');
    ctx.fillStyle=g; ctx.fillRect(0,0,BW,BH);
  }
  // Stars
  G.bgStars.forEach(s=>{
    const tw=Math.sin(G.t*1.2+s.tw)*0.5+0.5;
    ctx.fillStyle=`rgba(255,255,255,${0.3+tw*0.7})`; ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  // Ambient particles
  if(type==='battle'){
    for(let i=0;i<8;i++){
      const px=(G.t*20+i*163)%BW, py=BH-200+Math.sin(G.t*0.5+i)*80;
      ctx.fillStyle=`rgba(150,0,255,${0.04+Math.sin(G.t+i)*0.02})`; ctx.beginPath();
      ctx.arc(px,py,20,0,Math.PI*2); ctx.fill();
    }
  }
}

// ── CHARACTER DRAWING ─────────────────────────────────────────
function drawHero(x,y,charIdx,sc,anim,effects){
  const c=CHARS[charIdx], t=G.t;
  const bob=Math.sin(t*3)*3*sc;
  const lean=(anim==='attack')?sc*25:0;
  ctx.save();
  ctx.translate(x+lean,y+bob);
  const col=c.col;

  // Glow/aura
  if(effects&&effects.rage>0){ ctx.shadowColor='#e74c3c'; ctx.shadowBlur=30; }
  else if(effects&&effects.invince>0){ ctx.shadowColor='#1abc9c'; ctx.shadowBlur=35; }
  else if(effects&&effects.shield>0){ ctx.shadowColor='#3498db'; ctx.shadowBlur=25; }
  else { ctx.shadowColor=col; ctx.shadowBlur=15; }

  // Legs
  const legG=ctx.createLinearGradient(-18*sc,0,18*sc,0);
  legG.addColorStop(0,'#1a1a2e'); legG.addColorStop(1,'#2c2c54');
  ctx.fillStyle=legG;
  ctx.fillRect(-14*sc,40*sc,10*sc,42*sc);
  ctx.fillRect(4*sc,40*sc,10*sc,42*sc);
  // Boots
  ctx.fillStyle='#111'; ctx.fillRect(-16*sc,76*sc,14*sc,10*sc); ctx.fillRect(2*sc,76*sc,14*sc,10*sc);

  // Body
  const bodyG=ctx.createLinearGradient(-22*sc,0,22*sc,0);
  bodyG.addColorStop(0,darken(col,30)); bodyG.addColorStop(0.4,col); bodyG.addColorStop(1,darken(col,20));
  ctx.fillStyle=bodyG;
  ctx.beginPath(); ctx.roundRect(-22*sc,5*sc,44*sc,40*sc,5*sc); ctx.fill();
  // Chest detail
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(0,20*sc,10*sc,8*sc,0,0,Math.PI*2); ctx.fill();

  // Arms
  const armAngle=(anim==='attack')?-0.5:Math.sin(t*3)*0.1;
  ctx.save();
  ctx.translate(-22*sc,10*sc); ctx.rotate(-armAngle);
  ctx.fillStyle=col; ctx.fillRect(-10*sc,0,10*sc,32*sc);
  ctx.restore();
  ctx.save();
  ctx.translate(22*sc,10*sc); ctx.rotate(armAngle);
  ctx.fillStyle=col; ctx.fillRect(0,0,10*sc,32*sc);
  // Weapon in right hand
  const w=WEAPONS[G.weaponIdx];
  ctx.fillStyle=w.col; glow(w.col,12);
  if(w.id==='fists'){ /* nothing */ }
  else if(w.id==='thunder'||w.id==='void'){
    ctx.fillRect(2*sc,28*sc,8*sc,50*sc); // axe handle
    ctx.fillRect(-4*sc,22*sc,22*sc,14*sc); // axe head
  } else {
    ctx.fillRect(3*sc,28*sc,5*sc,55*sc);
    ctx.fillRect(0,22*sc,14*sc,10*sc);
  }
  noglow();
  ctx.restore();

  // Head
  ctx.shadowColor=col; ctx.shadowBlur=12;
  const headG=ctx.createRadialGradient(-6*sc,-22*sc,1*sc,0,-18*sc,18*sc);
  headG.addColorStop(0,'#f0c08a'); headG.addColorStop(1,'#c8894c');
  ctx.fillStyle=headG;
  ctx.beginPath(); ctx.arc(0,-18*sc,18*sc,0,Math.PI*2); ctx.fill();

  // Helmet
  ctx.fillStyle=darken(col,10);
  ctx.beginPath(); ctx.arc(0,-18*sc,18*sc,-Math.PI,0); ctx.fill();
  ctx.fillRect(-18*sc,-22*sc,36*sc,8*sc);

  // Eyes
  ctx.shadowColor='#fff'; ctx.shadowBlur=14;
  ctx.fillStyle=effects&&effects.rage>0?'#e74c3c':'#74b9ff';
  ctx.beginPath(); ctx.ellipse(-7*sc,-18*sc,4*sc,3*sc,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7*sc,-18*sc,4*sc,3*sc,0,0,Math.PI*2); ctx.fill();

  // Shield effect ring
  if(effects&&effects.shield>0){
    noglow(); ctx.strokeStyle=`rgba(52,152,219,${0.5+Math.sin(G.t*4)*0.3})`;
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,30*sc,50*sc,0,Math.PI*2); ctx.stroke();
  }
  noglow();
  ctx.restore();
}

    ctx.fillStyle=bg; ctx.beginPath(); ctx.roundRect(-45*sc*iscale,-15*sc*iscale,90*sc*iscale,55*sc*iscale,10*sc); ctx.fill();
    // Head

      ctx.moveTo(Math.cos(a-0.15)*38*sc,-45*sc+Math.sin(a-0.15)*38*sc);
      ctx.lineTo(Math.cos(a)*60*sc,-45*sc+Math.sin(a)*60*sc);
      ctx.lineTo(Math.cos(a+0.15)*38*sc,-45*sc+Math.sin(a+0.15)*38*sc); ctx.fill();
    }
    // Eyes - three
    ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=30;
    ctx.beginPath(); ctx.ellipse(-14*sc,-48*sc,7*sc,7*sc,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14*sc,-48*sc,7*sc,7*sc,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-58*sc,6*sc,6*sc,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(-14*sc,-48*sc,4*sc,4*sc,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14*sc,-48*sc,4*sc,4*sc,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-58*sc,4*sc,4*sc,0,0,Math.PI*2); ctx.fill();
  }

  ctx.filter='none';
  noglow();
  ctx.restore();
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// ── WHEEL DRAWING ─────────────────────────────────────────────
function drawWheel(cx,cy,radius,items,angle){
  const n=items.length, arc=Math.PI*2/n;
  for(let i=0;i<n;i++){
    const start=angle+i*arc, end=start+arc;
    const item=items[i];
    const rcol=RARE_COL[item.rare||'common'];
    // Segment
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,radius);
    g.addColorStop(0,'#1a0030'); g.addColorStop(0.5,darken(rcol,30)); g.addColorStop(1,darken(rcol,10));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,end); ctx.closePath(); ctx.fill();
    // Border
    ctx.strokeStyle=lighten(rcol,20); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,start,end); ctx.closePath(); ctx.stroke();
    // Text
    const mid=start+arc/2, tx=cx+Math.cos(mid)*(radius*0.65), ty=cy+Math.sin(mid)*(radius*0.65);
    ctx.save(); ctx.translate(tx,ty); ctx.rotate(mid+Math.PI/2);
    ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.shadowColor='#000'; ctx.shadowBlur=4;
    const name=item.name.length>10?item.name.slice(0,9)+'…':item.name;
    ctx.fillText(name,0,0); ctx.restore();
  }
  // Center hub
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,30);
  cg.addColorStop(0,'#444'); cg.addColorStop(1,'#111');
  ctx.fillStyle=cg; ctx.shadowColor='#fff'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx,cy,28,0,Math.PI*2); ctx.fill();
  noglow();
  // Pointer arrow at top
  ctx.fillStyle='#fff'; ctx.shadowColor='#fff'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(cx,cy-radius-18); ctx.lineTo(cx-12,cy-radius+2); ctx.lineTo(cx+12,cy-radius+2); ctx.closePath(); ctx.fill();
  noglow();
}

// ── BATTLE SYSTEM ─────────────────────────────────────────────
function startBattle(diff){
  const ps=playerStats();
  const maxHp=ps.hp;
  G.battle={
    diff, timer:300,
    playerHp: maxHp, playerMaxHp: maxHp,
    effects:{shield:0,rage:0,poison:0,slow:0,invince:0},
    atkCooldown:0,
    monsters: Array.from({length:diff.cnt},(_,i)=>{
      const m=MONSTERS[diff.mi];
      return {
        ...m,
        id:i,
        hp: Math.floor(m.hp*diff.hpM),
        maxHp: Math.floor(m.hp*diff.hpM),
        atk: Math.floor(m.atk*diff.atkM),
        atkCooldown: 2+(Math.random()*1.5),
        poisonTime:0,
        phase: Math.random()*Math.PI*2,
        hitFlash:0,
        dead:false,
        deathTimer:0,
      };
    }),
    coinsEarned:0,
    won:false, lost:false,
    targetIdx:0,
    playerFlash:0,
    atkAnim:0,
  };
  G.screen='battle';
  Audio.playBattleMusic();
}

function updateBattle(dt){
  const B=G.battle;
  if(!B||B.won||B.lost) return;
  B.timer-=dt;
  B.atkCooldown-=dt;
  B.atkAnim=Math.max(0,B.atkAnim-dt*3);
  B.playerFlash=Math.max(0,B.playerFlash-dt*4);

  const ps=playerStats();

  // Effect timers
  ['shield','rage','slow','invince'].forEach(k=>{ if(B.effects[k]>0) B.effects[k]-=dt; });
  if(B.effects.poison>0){ B.effects.poison-=dt; }

  // Monster updates
  const liveMons=B.monsters.filter(m=>!m.dead);
  liveMons.forEach(m=>{
    m.hitFlash=Math.max(0,m.hitFlash-dt*5);
    m.atkCooldown-=dt*(B.effects.slow>0?0.5:1);
    if(m.poisonTime>0){ m.poisonTime-=dt; m.hp=Math.max(0,m.hp-8*dt); if(m.hp<=0){ killMonster(m,B); } }
    if(m.atkCooldown<=0){
      m.atkCooldown=2+Math.random()*1.5;
      if(B.effects.invince<=0){
        const dmg=Math.max(1,m.atk - ps.def*(B.effects.shield>0?2:1));
        B.playerHp-=dmg*(B.effects.shield>0?0.5:1);
        B.playerFlash=1;
        Audio.hit();
        addFloat(`-${Math.floor(dmg*(B.effects.shield>0?0.5:1))}`,320,360,'#e74c3c',26);
        PS.hit(280,380,'#e74c3c');
      }
      Audio.roar(m.type);
    }
  });

  if(B.playerHp<=0){ B.playerHp=0; B.lost=true; G.screen='gameover'; Audio.death(); return; }
  if(B.timer<=0){ B.lost=true; G.screen='gameover'; Audio.death(); return; }
  if(liveMons.length===0){ B.won=true; G.coins+=B.coinsEarned; Audio.victory(); G.screen='victory'; return; }

  PS.update(dt);
  updateFloats(dt);
}

function killMonster(m,B){
  m.dead=true;
  const earned=Math.floor(m.maxHp/10*B.diff.cm/10+B.diff.cm);
  B.coinsEarned+=earned;
  addFloat(`+${earned}🪙`,850,350,'#f1c40f',24);
  PS.explosion(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt,BH),m.col);
  PS.coins(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt,BH));
  Audio.coin();
}

function playerAttack(targetIdx){
  const B=G.battle;
  if(!B||B.atkCooldown>0) return;
  const ps=playerStats();
  const target=B.monsters.filter(m=>!m.dead)[targetIdx];
  if(!target) return;
  const crit=Math.random()<ps.crit;
  let dmg=Math.max(1,ps.atk+(ps.magic*0.3|0))*(B.effects.rage>0?2:1)*(crit?2:1);
  if(WEAPONS[G.weaponIdx].sp==='stun') target.atkCooldown=Math.max(target.atkCooldown,4);
  if(WEAPONS[G.weaponIdx].sp==='burn') dmg*=1.2;
  if(WEAPONS[G.weaponIdx].sp==='holy') dmg*=1.3;
  dmg=Math.floor(dmg);
  target.hp-=dmg;
  target.hitFlash=1;
  if(ps.lifesteal>0) B.playerHp=Math.min(B.playerMaxHp, B.playerHp+dmg*ps.lifesteal);
  B.atkAnim=1;
  const mx=getMonsterX(target.id,B.diff.cnt), my=getMonsterY(target.id,B.diff.cnt,BH);
  PS.hit(mx,my,CHARS[G.charIdx].col);
  addFloat(crit?`CRIT! ${dmg}`:`-${dmg}`,mx,my-60,crit?'#f1c40f':'#fff',crit?28:22);
  Audio.attack();
  if(WEAPONS[G.weaponIdx].sp==='drain'){ B.playerHp=Math.min(B.playerMaxHp,B.playerHp+dmg*0.15); addFloat(`+${(dmg*0.15)|0}❤️`,300,340,'#e74c3c'); }
  if(target.hp<=0) killMonster(target,B);
  const spd=ps.spd; B.atkCooldown=Math.max(0.3, 2.5 - spd*0.08);
}

function usePower(power){
  const B=G.battle;
  if(!B) return;
  Audio.usepower();
  if(power.id==='shield'){ B.effects.shield=power.dur; addFloat('🛡 SHIELD!',BW/2,200,'#3498db'); }
  else if(power.id==='rage'){ B.effects.rage=power.dur; addFloat('🔥 RAGE!',BW/2,200,'#e74c3c'); }
  else if(power.id==='heal'){ B.playerHp=Math.min(B.playerMaxHp,B.playerHp+80); addFloat('+80 HP ❤️',300,300,'#2ecc71'); PS.hit(300,350,'#2ecc71'); }
  else if(power.id==='poison'){ B.monsters.filter(m=>!m.dead).forEach(m=>m.poisonTime=power.dur); addFloat('☠ POISON!',BW/2,200,'#27ae60'); }
  else if(power.id==='slow'){ B.effects.slow=power.dur; addFloat('⏱ SLOW!',BW/2,200,'#9b59b6'); }
  else if(power.id==='nuke'){
    B.monsters.filter(m=>!m.dead).forEach(m=>{ m.hp-=200; if(m.hp<=0) killMonster(m,B); else { PS.explosion(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt,BH),'#f1c40f'); } });
    addFloat('💥 HOLY NUKE!',BW/2,200,'#f1c40f',30);
  }
  else if(power.id==='invince'){ B.effects.invince=power.dur; addFloat('⚡ INVINCIBLE!',BW/2,200,'#1abc9c'); }
  G.inventory=G.inventory.filter(p=>p!==power);
}

function getMonsterX(id,cnt){
  return BW-320+((id-(cnt-1)/2)*160);
}
function getMonsterY(id,cnt,h){
  const base=h*0.55;
  if(cnt===1) return base;
  return base+(id-(cnt-1)/2)*100;
}

// ── INPUT ─────────────────────────────────────────────────────
function inRect(p,x,y,w,h){ return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h; }

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(), s=canvas._scale||1;
  G.hover={x:(e.clientX-r.left)/s, y:(e.clientY-r.top)/s};
});

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(), s=canvas._scale||1;
  const mx=(e.clientX-r.left)/s, my=(e.clientY-r.top)/s;
  const p={x:mx,y:my};
  Audio.initOnce();

  if(G.screen==='menu'){
    const bw=200,bh=55,btnY=BH-140,b1x=BW/2-220,b2x=BW/2+20;
    if(inRect(p,b1x,btnY,bw,bh)){ G.screen='wheels'; Audio.playMenuMusic(); }
    if(inRect(p,b2x,btnY,bw,bh)){ G.screen='diffsel'; }
  }
  else if(G.screen==='wheels'){
    // Tab clicks
    WHEEL_TYPES.forEach((wt,i)=>{
      const tx=BW/2+(i-2)*180;
      if(inRect(p,tx-90,85,176,36)){ G.wheel.active=i; G.wheel.result=null; G.wheel.showTime=0; }
    });
    // Spin button
    if(inRect(p,BW/2-85,BH-90,170,50) && !G.wheel.spinning && G.coins>=50){
      G.coins-=50; spinWheel();
    }
    // Back
    if(inRect(p,30,BH-65,120,42)){ G.screen='menu'; Audio.playMenuMusic(); }
  }
  else if(G.screen==='diffsel'){
    const cols=4,bw=260,bh=110,gap=16,totalW=cols*bw+(cols-1)*gap,startX=(BW-totalW)/2,startY=130;
    DIFFS.forEach((d,i)=>{
      const col=i%cols,row=Math.floor(i/cols), x=startX+col*(bw+gap), y=startY+row*(bh+gap);
      if(inRect(p,x,y,bw,bh)){ startBattle(d); }
    });
    if(inRect(p,30,BH-65,120,42)){ G.screen='menu'; }
  }
  else if(G.screen==='battle'){
    const B=G.battle;
    // Power ups
    G.inventory.forEach((pw,i)=>{
      const puw=140,puh=52,puy=BH-75;
      const px=BW/2-((G.inventory.length-1)*0.5-i)*(puw+8)-puw/2;
      if(inRect(p,px,puy,puw,puh)){ usePower(pw); }
    });
    // Click monster to attack
    const liveMons=B.monsters.filter(m=>!m.dead);
    liveMons.forEach((m,i)=>{
      const msc=B.diff.cnt>2?0.6:0.75;
      const mmx=getMonsterX(m.id,B.diff.cnt), mmy=getMonsterY(m.id,B.diff.cnt,BH);
      const dist=Math.hypot(mx-mmx,my-mmy);
      if(dist<65*msc){ B.targetIdx=i; playerAttack(i); }
    });
  }
  else if(G.screen==='victory'){
    const by=420,bw=200,bh=60;
    if(inRect(p,BW/2-220,by,bw,bh)){ G.screen='wheels'; Audio.playMenuMusic(); }
    if(inRect(p,BW/2+20,by,bw,bh)){ G.screen='menu'; Audio.playMenuMusic(); }
  }
  else if(G.screen==='gameover'){
    if(G.battle&&!G.battle._cashed){ G.coins+=G.battle.coinsEarned; G.battle._cashed=true; }
    const by=390,bw=200,bh=60;
    if(inRect(p,BW/2-210,by,bw,bh)){ startBattle(G.battle?G.battle.diff:DIFFS[0]); }
    if(inRect(p,BW/2+10,by,bw,bh)){ G.screen='menu'; Audio.playMenuMusic(); }
  }
});

// Auto-attack on spacebar
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&G.screen==='battle'){
    const B=G.battle;
    const liveMons=B.monsters.filter(m=>!m.dead);
    if(liveMons.length>0) playerAttack(B.targetIdx);
    e.preventDefault();
  }
});

// ── WHEEL SPIN LOGIC ──────────────────────────────────────────
function spinWheel(){
  const wh=G.wheel;
  wh.spinning=true; wh.result=null; wh.showTime=0;
  wh.vel=(15+Math.random()*12) * (Math.random()<0.5?1:-1);
  Audio.spinStart();
  let lastTick=0;
  function spin(){
    if(!wh.spinning) return;
    wh.angle+=wh.vel*0.016;
    wh.vel*=0.985;
    // Tick sound
    const items=WHEEL_TYPES[wh.active].items;
    const arc=Math.PI*2/items.length;
    const seg=Math.floor((((-wh.angle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2))/arc)%items.length;
    if(seg!==lastTick){ lastTick=seg; Audio.spinTick(); }
    if(Math.abs(wh.vel)<0.05){
      wh.spinning=false;
      wh.result=seg;
      wh.showTime=3;
      applyWheelResult(wh.active,seg);
      PS.sparkle(BW/2,350,'#f1c40f');
      Audio.coin();
    } else {
      requestAnimationFrame(spin);
    }
  }
  requestAnimationFrame(spin);
}

function applyWheelResult(wheelIdx,itemIdx){
  const wt=WHEEL_TYPES[wheelIdx];
  const item=wt.items[itemIdx];
  if(wheelIdx===0){ // Character
    G.charIdx=CHARS.indexOf(item);
    addFloat(`New character: ${item.name}!`,BW/2,200,item.col,22);
  } else if(wheelIdx===1){ // Weapon
    G.weaponIdx=WEAPONS.indexOf(item);
    addFloat(`${item.name} equipped!`,BW/2,200,item.col,22);
  } else if(wheelIdx===2){ // Armor
    G.armorIdx=ARMORS.indexOf(item);
    addFloat(`${item.name} equipped!`,BW/2,200,item.col,22);
  } else if(wheelIdx===3){ // Upgrade
    const eff=item.eff;
    Object.entries(eff).forEach(([k,v])=>{ G.upgrades[k]=(G.upgrades[k]||0)+v; });
    addFloat(`${item.name}!`,BW/2,200,item.col,22);
  } else if(wheelIdx===4){ // Power Up
    if(G.inventory.length<3){ G.inventory.push(item); addFloat(`${item.name} added!`,BW/2,200,item.col,22); }
    else addFloat('Bag full! (max 3)',BW/2,200,'#e74c3c',22);
  }
}

// ── GAME LOOP ─────────────────────────────────────────────────
let lastTime=0;
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05); lastTime=ts;
  G.t+=dt;
  G.flash.a=Math.max(0,G.flash.a-dt*3);
  if(G.wheel.showTime>0) G.wheel.showTime-=dt;

  ctx.clearRect(0,0,BW,BH);

  if(G.screen==='menu') drawMenu();
  else if(G.screen==='wheels') drawWheels();
  else if(G.screen==='diffsel') drawDiffSel();
  else if(G.screen==='battle'){ updateBattle(dt); drawBattle(); }
  else if(G.screen==='victory') drawVictory();
  else if(G.screen==='gameover') drawGameOver();

  requestAnimationFrame(loop);
}

// Start — audio needs user gesture first, so we init on first interaction
// Menu music will trigger on first click via Audio.init() + Audio.resume()
requestAnimationFrame(loop);
</script>
