// ── BUILD WEIGHTED SEGMENTS ────────────────────────────────────
function buildSegs(items){
  const counts={};
  items.forEach(it=>counts[it.rare]=(counts[it.rare]||0)+1);
  const weights=items.map(it=>RAR[it.rare].w/counts[it.rare]);
  const total=weights.reduce((a,b)=>a+b,0);
  let angle=0;
  return items.map((it,i)=>{
    const arc=(weights[i]/total)*Math.PI*2;
    const seg={it,start:angle,arc,mid:angle+arc/2};
    angle+=arc; return seg;
  });
}
const WHEEL_SEGS=WHEEL_DEFS.map(wd=>buildSegs(wd.items));

function segAtAngle(segs,rotation){
  // needle at top = -PI/2 canvas. wheel draws from angle -PI/2+rotation.
  // needle in seg-space: (-PI/2 - (-PI/2+rotation)) = -rotation → normalize to [0,2PI)
  const n=((-rotation)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  let cum=0;
  for(const seg of segs){if(n>=cum&&n<cum+seg.arc)return seg;cum+=seg.arc;}
  return segs[0];
}

// ── AUDIO ─────────────────────────────────────────────────────
const SFX=(()=>{
  let ac,mg,sg,mNodes=[],_ok=false;
  function boot(){
    if(_ok)return; _ok=true;
    ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();mg.gain.value=1;mg.connect(ac.destination);
    sg=ac.createGain();sg.gain.value=0.55;sg.connect(mg);
    playMenu();
  }
  function resume(){if(ac&&ac.state==='suspended')ac.resume();}
  function stopMusic(){mNodes.forEach(n=>{try{n.stop?n.stop():n.disconnect();}catch(e){}});mNodes=[];}
  function tone(f,type,t0,t1,vol,dest,ramp){
    if(!ac)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;
    if(ramp)ramp(o.frequency,t0);
    g.gain.setValueAtTime(vol||0.2,t0);g.gain.exponentialRampToValueAtTime(0.0001,t1);
    o.connect(g);g.connect(dest||sg);o.start(t0);o.stop(t1);return o;
  }
  function nb(dur,t0,vol,fq){
    if(!ac)return;
    const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();
    fl.type='bandpass';fl.frequency.value=fq||800;src.buffer=buf;
    g.gain.setValueAtTime(vol||0.2,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(fl);fl.connect(g);g.connect(sg);src.start(t0);return src;
  }
  let menuMG;
  function playMenu(){
    if(!ac)return;stopMusic();
    menuMG=ac.createGain();menuMG.gain.value=0.18;menuMG.connect(mg);
    [55,82.5,110].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0.04;o.connect(g);g.connect(menuMG);o.start();mNodes.push(o);});
    const arp=[220,261.6,329.6,392,329.6,261.6];let t=ac.currentTime;
    function sched(){
      arp.forEach((f,i)=>{
        const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(0,t+i*0.55);g.gain.linearRampToValueAtTime(0.07,t+i*0.55+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.55+0.5);
        o.connect(g);g.connect(menuMG);o.start(t+i*0.55);o.stop(t+i*0.55+0.55);mNodes.push(o);
      });
      t+=arp.length*0.55;
      const id=setTimeout(sched,(arp.length*0.55-0.4)*1000);mNodes.push({stop:()=>clearTimeout(id)});
    }sched();
  }
  function playBattle(){
    if(!ac)return;stopMusic();
    const bMG=ac.createGain();bMG.gain.value=0.22;bMG.connect(mg);
    const mel=[110,138.6,165,184.9,220,184.9,165,138.6,110,138.6,165,220,165,138.6,110,82.5];
    let t=ac.currentTime;const beat=0.22;
    function loop(){
      mel.forEach((f,i)=>{
        const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
        o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=1000;
        g.gain.setValueAtTime(0,t+i*beat);g.gain.linearRampToValueAtTime(0.1,t+i*beat+0.03);
        g.gain.setValueAtTime(0.1,t+i*beat+beat*0.75);g.gain.linearRampToValueAtTime(0,t+i*beat+beat);
        o.connect(fl);fl.connect(g);g.connect(bMG);o.start(t+i*beat);o.stop(t+i*beat+beat);mNodes.push(o);
      });
      [0,4,8,12].forEach(i=>{
        const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
        o.frequency.setValueAtTime(90,t+i*beat);o.frequency.exponentialRampToValueAtTime(40,t+i*beat+0.2);
        g.gain.setValueAtTime(0.35,t+i*beat);g.gain.exponentialRampToValueAtTime(0.0001,t+i*beat+0.2);
        o.connect(g);g.connect(bMG);o.start(t+i*beat);o.stop(t+i*beat+0.2);mNodes.push(o);
      });
      [2,6,10,14].forEach(i=>nb(0.1,t+i*beat,0.12,1200));
      t+=mel.length*beat;
      const id=setTimeout(loop,(mel.length*beat-0.3)*1000);mNodes.push({stop:()=>clearTimeout(id)});
    }loop();
  }
  function attack(){if(!ac)return;const t=ac.currentTime;tone(350,'sawtooth',t,t+0.12,0.3,sg,(f,t0)=>{f.setValueAtTime(400,t0);f.exponentialRampToValueAtTime(80,t0+0.12);});nb(0.08,t+0.04,0.18,600);}
  function hit(){if(!ac)return;const t=ac.currentTime;tone(220,'square',t,t+0.18,0.28,sg,(f,t0)=>{f.setValueAtTime(280,t0);f.exponentialRampToValueAtTime(70,t0+0.18);});}
  function coin(){if(!ac)return;const t=ac.currentTime;[880,1320,1760].forEach((f,i)=>tone(f,'sine',t+i*0.07,t+i*0.07+0.2,0.14));}
  function tick(){if(!ac)return;const t=ac.currentTime;tone(1500,'sine',t,t+0.025,0.035);}
  function spinSnd(){if(!ac)return;const t=ac.currentTime;tone(150,'sawtooth',t,t+0.55,0.18,sg,(f,t0)=>{f.setValueAtTime(150,t0);f.exponentialRampToValueAtTime(1400,t0+0.5);});}
  function victory(){if(!ac)return;stopMusic();const t=ac.currentTime;[523,659,784,659,784,1047,784,1047,1568].forEach((f,i)=>tone(f,'sine',t+i*0.13,t+i*0.13+0.25,0.22));}
  function death(){if(!ac)return;stopMusic();const t=ac.currentTime;tone(440,'sawtooth',t,t+2,0.28,sg,(f,t0)=>{f.setValueAtTime(440,t0);f.exponentialRampToValueAtTime(35,t0+2);});}
  function roar(type){if(!ac)return;const t=ac.currentTime,fm={slime:350,goblin:420,orc:220,troll:110,dragon:75,demon:55,archdemon:45,boss:35}[type]||80;tone(fm,'sawtooth',t,t+0.6,0.32,sg,(f,t0)=>{f.setValueAtTime(fm,t0);f.setValueAtTime(fm*1.6,t0+0.08);f.exponentialRampToValueAtTime(fm*0.25,t0+0.6);});nb(0.35,t,0.15,fm*2.5);}
  function power(){if(!ac)return;const t=ac.currentTime;[440,554,659,880,1108].forEach((f,i)=>tone(f,'sine',t+i*0.06,t+i*0.06+0.18,0.13));}
  return{boot,resume,stopMusic,playMenu,playBattle,attack,hit,coin,tick,spinSnd,victory,death,roar,power};
})();

// ── PARTICLES ─────────────────────────────────────────────────
const PS=(()=>{
  let pool=[];
  function emit(x,y,n,col,spd,sz,life,grav=true){
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(0.5+Math.random()*0.5)*spd;pool.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,sz:(0.5+Math.random()*0.5)*sz,life,ml:life,grav});}
  }
  function hit(x,y,col){emit(x,y,12,col,180,5,0.65);emit(x,y,8,'#fff',240,2.5,0.28);}
  function explode(x,y,col){emit(x,y,28,col,300,7,1);emit(x,y,18,'#fff',350,3,0.35);emit(x,y,12,'#ffaa00',200,5,0.8);}
  function gold(x,y){emit(x,y,10,'#f1c40f',130,4,1);emit(x,y,6,'#fff',180,2,0.4);}
  function sparkle(x,y,col){emit(x,y,8,col,90,3,0.55,false);}
  function update(dt){pool=pool.filter(p=>p.life>0);pool.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grav)p.vy+=290*dt;p.life-=dt;});}
  function draw(){pool.forEach(p=>{const a=p.life/p.ml;ctx.save();ctx.globalAlpha=a*0.9;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=p.sz*2.5;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);ctx.fill();ctx.restore();});}
  return{emit,hit,explode,gold,sparkle,update,draw};
})();

// ── FLOATING TEXT ─────────────────────────────────────────────
let FLOATS=[];
function addFloat(txt,x,y,col,sz=22){FLOATS.push({txt,x,y,col,sz,life:1.3,vy:-55});}
function updateFloats(dt){FLOATS=FLOATS.filter(f=>f.life>0);FLOATS.forEach(f=>{f.y+=f.vy*dt;f.vy*=0.97;f.life-=dt;});}
function drawFloats(){FLOATS.forEach(f=>{const a=Math.min(1,f.life/1.3);ctx.save();ctx.globalAlpha=a;ctx.font=`bold ${f.sz}px sans-serif`;ctx.textAlign='center';ctx.shadowColor=f.col;ctx.shadowBlur=12;ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);ctx.restore();});}

// ── SAVE / LOAD ───────────────────────────────────────────────
function saveGame(){
  const d={
    coins:G.coins,
    roster:G.roster,
    activeCharId:CHARS[G.charIdx].id,
    weaponIdx:G.weaponIdx,
    armorIdx:G.armorIdx,
    upgrades:{...G.upgrades},
    inventory:G.inventory.map(p=>p.id),
  };
  try{localStorage.setItem('wof_v2',JSON.stringify(d));}catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem('wof_v2');if(!raw)return;
    const d=JSON.parse(raw);
    G.coins=d.coins||50;
    G.roster=d.roster||['warrior'];
    const ci=CHARS.findIndex(c=>c.id===d.activeCharId);if(ci>=0)G.charIdx=ci;
    G.weaponIdx=d.weaponIdx||0;
    G.armorIdx=d.armorIdx||0;
    if(d.upgrades)Object.assign(G.upgrades,d.upgrades);
    G.inventory=(d.inventory||[]).map(id=>POWERUPS.find(p=>p.id===id)).filter(Boolean).slice(0,3);
  }catch(e){}
}

// ── DRAW UTILITIES ────────────────────────────────────────────
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function glow(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function ng(){ctx.shadowColor='transparent';ctx.shadowBlur=0;}
function bt(s,x,y,c,sz,a='center'){ctx.font=`bold ${sz}px sans-serif`;ctx.textAlign=a;ctx.fillStyle=c;ctx.fillText(s,x,y);}
function ft(s,x,y,c,sz,a='center'){ctx.font=`${sz}px sans-serif`;ctx.textAlign=a;ctx.fillStyle=c;ctx.fillText(s,x,y);}
function hpBar(x,y,w,h,cur,max,col){
  ctx.fillStyle='#0a0015';rr(x,y,w,h,h/2);
  const pct=Math.max(0,cur/max);
  if(pct>0){const c=pct>0.5?col:pct>0.25?'#e67e22':'#e74c3c';ctx.fillStyle=c;glow(c,10);rr(x,y,w*pct,h,h/2);ng();}
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.stroke();
}
function lighten(h,a){let c=parseInt(h.replace('#',''),16);return '#'+[c>>16,(c>>8)&255,c&255].map(v=>Math.min(255,v+a).toString(16).padStart(2,'0')).join('');}
function darken(h,a){return lighten(h,-a);}
function hexRgb(h){let c=parseInt(h.replace('#',''),16);return[c>>16,(c>>8)&255,c&255];}
function inRect(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}

function btn(x,y,w,h,label,col,hov,sub){
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,hov?lighten(col,35):lighten(col,10));
  g.addColorStop(1,hov?col:darken(col,25));
  ctx.fillStyle=g;if(hov){glow(col,22);}
  rr(x,y,w,h,9);ng();
  ctx.strokeStyle=hov?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.2)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.stroke();

}

// ── BACKGROUND ────────────────────────────────────────────────
function drawBg(type){
  if(type==='battle'){
    // Dark dungeon
    const g=ctx.createLinearGradient(0,0,0,BH);
    g.addColorStop(0,'#04000e');g.addColorStop(0.6,'#0d0020');g.addColorStop(1,'#020008');
    ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
    // Back wall
    const wg=ctx.createLinearGradient(0,80,0,BH-130);
    wg.addColorStop(0,'#18003a');wg.addColorStop(1,'#0a001a');
    ctx.fillStyle=wg;ctx.fillRect(0,80,BW,BH-210);
    // Stone bricks
    ctx.strokeStyle='rgba(80,0,120,0.18)';ctx.lineWidth=1;
    for(let row=0;row<8;row++){for(let col=0;col<16;col++){
      const bx=col*85+(row%2)*42,by=85+row*48;
      ctx.strokeRect(bx,by,83,46);
    }}
    // Ground
    const fg=ctx.createLinearGradient(0,BH-130,0,BH);
    fg.addColorStop(0,'#1a003a');fg.addColorStop(1,'#08001a');
    ctx.fillStyle=fg;ctx.fillRect(0,BH-130,BW,130);
    // Ground cracks
    ctx.strokeStyle='rgba(100,0,180,0.2)';ctx.lineWidth=1.5;
    [[100,BH-125,160,BH-60],[300,BH-100,340,BH-55],[600,BH-120,640,BH-50],[900,BH-110,960,BH-65],[1150,BH-125,1180,BH-55]].forEach(([x1,y1,x2,y2])=>{
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    });
    // Torches
    [180,640,1100].forEach(tx=>{
      const flicker=0.7+Math.sin(G.t*8+tx)*0.3;
      ctx.fillStyle=`rgba(255,150,0,${flicker*0.12})`;
      ctx.beginPath();ctx.arc(tx,160,70,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(255,200,50,${flicker*0.06})`;
      ctx.beginPath();ctx.arc(tx,160,120,0,Math.PI*2);ctx.fill();
      // Torch bracket
      ctx.fillStyle='#3a2000';ctx.fillRect(tx-4,155,8,25);
      ctx.fillStyle=`rgba(255,${150+Math.sin(G.t*12)*50|0},0,${flicker})`;
      ctx.beginPath();ctx.ellipse(tx,155,7,12,0,0,Math.PI*2);ctx.fill();
    });
  } else {
    const g=ctx.createLinearGradient(0,0,0,BH);
    g.addColorStop(0,'#020010');g.addColorStop(1,'#09001e');
    ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
    // Nebula clouds
    [[BW*0.2,BH*0.3,200,'#1a0040'],[BW*0.8,BH*0.6,180,'#001a40'],[BW*0.5,BH*0.15,150,'#0d0030']].forEach(([x,y,r,c])=>{
      const rg=ctx.createRadialGradient(x,y,0,x,y,r);
      const [r1,g1,b1]=hexRgb(c);
      rg.addColorStop(0,`rgba(${r1},${g1},${b1},0.4)`);rg.addColorStop(1,'transparent');
      ctx.fillStyle=rg;ctx.fillRect(0,0,BW,BH);
    });
  }
  // Stars
  G.stars.forEach(s=>{
    const tw=Math.sin(G.t*1.1+s.tw)*0.5+0.5;
    ctx.fillStyle=`rgba(255,255,255,${0.25+tw*0.75})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
}

// ── DRAW CHARACTER ────────────────────────────────────────────
function drawHero(x,y,charIdx,sc,anim,eff){
  const c=CHARS[charIdx],t=G.t;

  ctx.beginPath();ctx.moveTo(-10*sc,8*sc);ctx.bezierCurveTo(-25*sc,30*sc,-22*sc,65*sc,-8*sc,82*sc);ctx.lineTo(8*sc,82*sc);ctx.bezierCurveTo(22*sc,65*sc,25*sc,30*sc,10*sc,8*sc);ctx.fill();

  ctx.fillStyle='#111';ctx.fillRect(-17*sc,76*sc,16*sc,10*sc);ctx.fillRect(1*sc,76*sc,16*sc,10*sc);

  ctx.fillStyle='rgba(255,255,255,0.07)';ctx.fillRect(-15*sc,76*sc,8*sc,4*sc);ctx.fillRect(3*sc,76*sc,8*sc,4*sc);

  // Body armor
  const bodyG=ctx.createLinearGradient(-24*sc,0,24*sc,0);
  bodyG.addColorStop(0,darken(col,25));bodyG.addColorStop(0.35,lighten(col,15));bodyG.addColorStop(0.65,col);bodyG.addColorStop(1,darken(col,20));
  ctx.fillStyle=bodyG;ctx.beginPath();ctx.roundRect(-24*sc,5*sc,48*sc,40*sc,6*sc);ctx.fill();
  // Chest plate shine
  const shG=ctx.createLinearGradient(-10*sc,8*sc,10*sc,24*sc);shG.addColorStop(0,'rgba(255,255,255,0.28)');shG.addColorStop(1,'rgba(255,255,255,0.04)');
  ctx.fillStyle=shG;ctx.beginPath();ctx.ellipse(0,18*sc,12*sc,9*sc,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='rgba(255,215,0,0.4)';ctx.beginPath();ctx.arc(0,41*sc,5*sc,0,Math.PI*2);ctx.fill();

  // Left arm
  const lArmG=ctx.createLinearGradient(-36*sc,0,-24*sc,0);lArmG.addColorStop(0,darken(col,15));lArmG.addColorStop(1,col);
  ctx.fillStyle=lArmG;ctx.beginPath();ctx.roundRect(-36*sc,8*sc,14*sc,34*sc,4*sc);ctx.fill();
  // Shield on left arm (if shield active)
  if(eff&&eff.shield>0){
    glow('#3498db',20);ctx.fillStyle='#1a5276';ctx.beginPath();ctx.ellipse(-38*sc,24*sc,10*sc,14*sc,0.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3498db';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-38*sc,24*sc,10*sc,14*sc,0.2,0,Math.PI*2);ctx.stroke();
    glow(esc,20);
  }
  // Right arm + weapon
  const rArmG=ctx.createLinearGradient(24*sc,0,36*sc,0);rArmG.addColorStop(0,col);rArmG.addColorStop(1,darken(col,15));
  ctx.fillStyle=rArmG;ctx.beginPath();ctx.roundRect(22*sc,8*sc,14*sc,34*sc,4*sc);ctx.fill();
  // Weapon
  const w=WEAPONS[G.weaponIdx];
  glow(w.col,18);ctx.fillStyle=w.col;
  if(w.id!=='fists'){
    if(w.id==='thunder'){

      const ag=ctx.createLinearGradient(22*sc,20*sc,50*sc,20*sc);ag.addColorStop(0,w.col);ag.addColorStop(1,lighten(w.col,30));
      ctx.fillStyle=ag;ctx.beginPath();ctx.moveTo(22*sc,18*sc);ctx.lineTo(50*sc,22*sc);ctx.lineTo(50*sc,36*sc);ctx.lineTo(22*sc,32*sc);ctx.fill();

      ctx.fillRect(35*sc,24*sc,7*sc,55*sc);
      ctx.fillStyle=lighten(w.col,20);ctx.beginPath();ctx.moveTo(32*sc,18*sc);ctx.lineTo(45*sc,24*sc);ctx.lineTo(35*sc,30*sc);ctx.fill();

    }else{

      const hg=ctx.createLinearGradient(30*sc,18*sc,46*sc,26*sc);hg.addColorStop(0,lighten(w.col,30));hg.addColorStop(1,w.col);
      ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(28*sc,16*sc,18*sc,13*sc,3*sc);ctx.fill();

  ctx.fillStyle=headG;ctx.beginPath();ctx.arc(0,-17*sc,18*sc,0,Math.PI*2);ctx.fill();
  // Helmet
  const helmG=ctx.createLinearGradient(-18*sc,-36*sc,18*sc,-10*sc);
  helmG.addColorStop(0,lighten(col,20));helmG.addColorStop(0.5,col);helmG.addColorStop(1,darken(col,15));
  ctx.fillStyle=helmG;ctx.beginPath();ctx.arc(0,-17*sc,19*sc,-Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.roundRect(-20*sc,-22*sc,40*sc,9*sc,2*sc);ctx.fill();
  // Visor highlight
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.ellipse(0,-22*sc,10*sc,3*sc,0,0,Math.PI*2);ctx.fill();
  // Eyes
  glow(eff&&eff.rage>0?'#ff0000':'#74b9ff',16);
  ctx.fillStyle=eff&&eff.rage>0?'#e74c3c':eff&&eff.invince>0?'#1abc9c':'#74b9ff';
  ctx.beginPath();ctx.ellipse(-7*sc,-18*sc,4*sc,3*sc,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(7*sc,-18*sc,4*sc,3*sc,0,0,Math.PI*2);ctx.fill();
  // Pupils
  ng();ctx.fillStyle='rgba(0,0,40,0.8)';
  ctx.beginPath();ctx.ellipse(-6*sc,-18*sc,2*sc,2.5*sc,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(8*sc,-18*sc,2*sc,2.5*sc,0,0,Math.PI*2);ctx.fill();

  // Effect aura ring
  if(eff&&(eff.invince>0||eff.rage>0)){
    const a=0.4+Math.sin(G.t*6)*0.3;
    ctx.strokeStyle=`rgba(${hexRgb(esc).join(',')},${a})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,30*sc,52*sc,0,Math.PI*2);ctx.stroke();
  }
  ng();ctx.restore();
}

// ── BATTLE ────────────────────────────────────────────────────
function getMonsterX(id,cnt){
  if(cnt===1)return 900;
  if(cnt===2)return 820+id*160;
  if(cnt===3)return 760+id*145;
  return 700+id*130;
}
function getMonsterY(id,cnt){
  if(cnt<=2)return 490;
  return 460+(id%2)*60;
}

function startBattle(diff){
  const ps=pStats();
  G.diff=diff;
  G.battle={
    diff,
    timer:300,
    playerHp:ps.hp,playerMaxHp:ps.hp,
    effects:{shield:0,rage:0,slow:0,invince:0,poison:0},
    atkCD:0,atkAnim:0,playerFlash:0,
    monsters:Array.from({length:diff.cnt},(_,i)=>{
      const mo=MONSTERS[diff.mi];
      return{...mo,id:i,hp:Math.floor(mo.hp*diff.hpM),maxHp:Math.floor(mo.hp*diff.hpM),atk:Math.floor(mo.atk*diff.atkM),atkCD:2+Math.random()*1.5,poisonT:0,phase:Math.random()*Math.PI*2,hitFlash:0,dead:false};
    }),
    coinsEarned:0,targetIdx:0,won:false,lost:false,_cashed:false,
  };
  G.screen='battle';
  SFX.playBattle();
}

function updateBattle(dt){
  const B=G.battle;if(!B||B.won||B.lost)return;
  B.timer-=dt;B.atkCD-=dt;B.atkAnim=Math.max(0,B.atkAnim-dt*3);B.playerFlash=Math.max(0,B.playerFlash-dt*4);
  const ps=pStats();
  ['shield','rage','slow','invince'].forEach(k=>{if(B.effects[k]>0)B.effects[k]-=dt;});
  const live=B.monsters.filter(m=>!m.dead);
  live.forEach(m=>{
    m.hitFlash=Math.max(0,m.hitFlash-dt*5);
    m.atkCD-=dt*(B.effects.slow>0?0.4:1);
    if(m.poisonT>0){m.poisonT-=dt;m.hp=Math.max(0,m.hp-10*dt);if(m.hp<=0)killM(m,B);}
    if(m.atkCD<=0&&!m.dead){
      m.atkCD=1.8+Math.random()*1.5;
      if(B.effects.invince<=0){
        const raw=Math.max(1,m.atk-ps.def*(B.effects.shield>0?1.8:1));
        const dmg=Math.floor(raw*(B.effects.shield>0?0.5:1));
        B.playerHp-=dmg;B.playerFlash=1;SFX.hit();
        addFloat(`-${dmg}`,240,360,'#e74c3c',26);PS.hit(230,380,'#e74c3c');
      }
      SFX.roar(m.type);
    }
  });
  if(B.playerHp<=0){B.playerHp=0;B.lost=true;G.screen='gameover';SFX.death();return;}
  if(B.timer<=0){B.lost=true;G.screen='gameover';SFX.death();return;}
  if(B.monsters.filter(m=>!m.dead).length===0){B.won=true;G.coins+=B.coinsEarned;B._cashed=true;SFX.victory();G.screen='victory';return;}
  PS.update(dt);updateFloats(dt);
}

function killM(m,B){
  m.dead=true;
  const earned=Math.max(B.diff.cm,Math.floor(m.maxHp*B.diff.cm*0.05));
  B.coinsEarned+=earned;
  addFloat(`+${earned}🪙`,getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt)-80,'#f1c40f',24);
  PS.explode(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt),m.col);
  PS.gold(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt));
  SFX.coin();
}

function doAttack(idx){
  const B=G.battle;if(!B||B.atkCD>0)return;
  const live=B.monsters.filter(m=>!m.dead);if(idx>=live.length)idx=0;
  const tgt=live[idx];if(!tgt)return;
  const ps=pStats();
  const crit=Math.random()<ps.crit;
  const w=WEAPONS[G.weaponIdx];
  let dmg=Math.max(1,ps.atk+(ps.mag*0.35|0))*(B.effects.rage>0?2:1)*(crit?2.2:1);
  if(w.sp==='burn')dmg*=1.25;if(w.sp==='holy')dmg*=1.35;if(w.sp==='void')dmg*=1.5;
  dmg=Math.floor(dmg);
  tgt.hp-=dmg;tgt.hitFlash=1;
  if(w.sp==='stun')tgt.atkCD=Math.max(tgt.atkCD,4.5);
  if(w.sp==='drain'){const h=Math.floor(dmg*0.18);B.playerHp=Math.min(B.playerMaxHp,B.playerHp+h);addFloat(`+${h}❤️`,240,320,'#e74c3c');}
  if(ps.lifesteal>0){const h=Math.floor(dmg*ps.lifesteal);B.playerHp=Math.min(B.playerMaxHp,B.playerHp+h);}
  B.atkAnim=1;
  const mx=getMonsterX(tgt.id,B.diff.cnt),my=getMonsterY(tgt.id,B.diff.cnt);
  PS.hit(mx,my,CHARS[G.charIdx].col);
  addFloat(crit?`CRIT! ${dmg}`:`${dmg}`,mx,my-70,crit?'#f1c40f':'#fff',crit?30:22);
  SFX.attack();
  if(tgt.hp<=0)killM(tgt,B);
  const spd=ps.spd;B.atkCD=Math.max(0.28,2.8-spd*0.09);
}

function usePower(pw){
  const B=G.battle;if(!B)return;SFX.power();
  if(pw.id==='shield'){B.effects.shield=pw.dur;addFloat('🛡 SHIELD!',BW/2,200,'#3498db',24);}
  else if(pw.id==='rage'){B.effects.rage=pw.dur;addFloat('🔥 RAGE!',BW/2,200,'#e74c3c',24);}
  else if(pw.id==='heal'){B.playerHp=Math.min(B.playerMaxHp,B.playerHp+80);addFloat('+80 HP',240,300,'#2ecc71',24);PS.sparkle(240,380,'#2ecc71');}
  else if(pw.id==='poison'){B.monsters.filter(m=>!m.dead).forEach(m=>m.poisonT=pw.dur);addFloat('☠ POISON!',BW/2,200,'#27ae60',24);}
  else if(pw.id==='slow'){B.effects.slow=pw.dur;addFloat('⏱ SLOW!',BW/2,200,'#9b59b6',24);}
  else if(pw.id==='nuke'){B.monsters.filter(m=>!m.dead).forEach(m=>{m.hp-=200;if(m.hp<=0)killM(m,B);else{m.hitFlash=1;PS.explode(getMonsterX(m.id,B.diff.cnt),getMonsterY(m.id,B.diff.cnt),'#f1c40f');}});addFloat('💥 HOLY NUKE!',BW/2,180,'#f1c40f',32);}
  else if(pw.id==='invince'){B.effects.invince=pw.dur;addFloat('⚡ INVINCIBLE!',BW/2,200,'#1abc9c',24);}
  else if(pw.id==='worldend'){B.monsters.filter(m=>!m.dead).forEach(m=>{m.hp=0;killM(m,B);});addFloat('💀 WORLD END!',BW/2,180,'#ff0066',36);glow('#ff0066',60);}
  G.inventory=G.inventory.filter(p=>p!==pw);
}

function drawBattle(){
  drawBg('battle');
  const B=G.battle;if(!B)return;
  const ps=pStats();

  // Top HUD
  panel(0,0,BW,72,0,0.75);
  // Player HP
  hpBar(18,12,300,22,B.playerHp,B.playerMaxHp,'#2ecc71');
  bt(CHARS[G.charIdx].name,18,10,'rgba(255,255,255,0.7)',12,'left');
  ft(`${Math.ceil(B.playerHp)}/${B.playerMaxHp}`,182,28,'rgba(255,255,255,0.55)',12);

  // Timer
  const mins=Math.floor(B.timer/60),secs=Math.floor(B.timer%60);
  const tstr=`${mins}:${secs.toString().padStart(2,'0')}`;
  const tcol=B.timer<60?'#e74c3c':B.timer<120?'#f39c12':'#2ecc71';
  if(B.timer<30){glow(tcol,25);}
  bt(tstr,BW/2,50,tcol,42);ng();

  // Coins
  glow('#f1c40f',10);bt(`🪙 ${G.coins}  (+${B.coinsEarned})`,BW-18,48,'#f1c40f',20,'right');ng();

  // Effects row
  let ex=22;const eff=B.effects;
  if(eff.shield>0){glow('#3498db',12);bt(`🛡${eff.shield|0}s`,ex,68,'#3498db',13,'left');ex+=72;ng();}
  if(eff.rage>0){glow('#e74c3c',12);bt(`🔥${eff.rage|0}s`,ex,68,'#e74c3c',13,'left');ex+=72;ng();}
  if(eff.slow>0){glow('#9b59b6',12);bt(`⏱${eff.slow|0}s`,ex,68,'#9b59b6',13,'left');ex+=72;ng();}
  if(eff.invince>0){glow('#1abc9c',12);bt(`⚡${eff.invince|0}s`,ex,68,'#1abc9c',13,'left');ng();}

  // ATK cooldown bar under HUD
  if(B.atkCD>0){const maxCD=2.8-ps.spd*0.09;ctx.fillStyle='rgba(241,196,15,0.4)';rr(18,74,300*(1-B.atkCD/Math.max(0.28,maxCD)),6,3);}

  // Divider
  ctx.strokeStyle='rgba(120,0,200,0.15)';ctx.lineWidth=1;ctx.setLineDash([6,10]);
  ctx.beginPath();ctx.moveTo(BW/2,78);ctx.lineTo(BW/2,BH-100);ctx.stroke();ctx.setLineDash([]);

  // Player
  if(B.playerFlash>0)ctx.filter='saturate(4) brightness(2)';
  drawHero(200,520,G.charIdx,1,B.atkAnim>0?'attack':null,B.effects);
  ctx.filter='none';

  // Monsters
  const live=B.monsters.filter(m=>!m.dead);
  B.monsters.forEach(m=>{
    if(m.dead)return;
    const li=live.indexOf(m);
    const mx=getMonsterX(m.id,B.diff.cnt),my=getMonsterY(m.id,B.diff.cnt);
    const msc=B.diff.cnt>=3?0.62:0.78;
    // Target ring
    if(li===B.targetIdx){
      ctx.strokeStyle=`rgba(255,200,0,${0.5+Math.sin(G.t*4)*0.3})`;ctx.lineWidth=2;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(mx,my,60*msc,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
    drawMonster(mx,my,m,msc);
    // HP bar
    const bw=130,bh=13;
    hpBar(mx-bw/2,my-88*msc,bw,bh,m.hp,m.maxHp,m.col);
    ft(m.name,mx,my-92*msc,'rgba(255,255,255,0.85)',11);
    ft(`${Math.ceil(m.hp)}/${m.maxHp}`,mx,my-76*msc,'rgba(255,255,255,0.5)',10);
    // Poison
    if(m.poisonT>0){glow('#27ae60',18);ctx.fillStyle='rgba(39,174,96,0.18)';ctx.beginPath();ctx.arc(mx,my,60*msc,0,Math.PI*2);ctx.fill();ng();}
    // ATK CD bar for monster
    const mPct=Math.min(1,1-m.atkCD/3);ctx.fillStyle='rgba(231,76,60,0.6)';rr(mx-bw/2,my-74*msc,bw*mPct,4,2);
  });

  // Power up buttons
  panel(0,BH-92,BW,92,0,0.75);
  ft('POWERS',BW/2,BH-78,'rgba(255,255,255,0.35)',12);
  G.inventory.forEach((pw,i)=>{
    const pw_w=160,pw_h=54,pw_y=BH-85;
    const px=BW/2-((G.inventory.length-1)*0.5-i)*(pw_w+10)-pw_w/2;
    btn(px,pw_y,pw_w,pw_h,pw.name,pw.col,inRect(G.hover,px,pw_y,pw_w,pw_h),pw.desc);
  });
  if(G.inventory.length===0){ft('No power-ups — spin the Power Up wheel to get some!',BW/2,BH-55,'rgba(255,255,255,0.3)',14);}

  // Difficulty label
  ft(B.diff.name.toUpperCase(),BW-18,BH-104,'rgba(255,255,255,0.2)',13,'right');
  ft('SPACE or click monster to attack',BW/2,BH-6,'rgba(255,255,255,0.2)',12);

  PS.draw();drawFloats();
  if(G.flash.a>0){ctx.fillStyle=`rgba(${hexRgb(G.flash.col).join(',')},${G.flash.a})`;ctx.fillRect(0,0,BW,BH);}
}

// ── VICTORY / GAMEOVER ────────────────────────────────────────
function drawVictory(){
  drawBg('menu');
  for(let i=0;i<4;i++)PS.emit(Math.random()*BW,-10,1,'#f1c40f',90,5,3,true);
  PS.update(0.016);PS.draw();
  const vg=ctx.createLinearGradient(0,160,0,245);vg.addColorStop(0,'#f1c40f');vg.addColorStop(1,'#e67e22');
  ctx.font='bold 88px serif';ctx.textAlign='center';ctx.fillStyle=vg;glow('#f1c40f',55);ctx.fillText('VICTORY!',BW/2,225);ng();
  bt(`+${G.battle?G.battle.coinsEarned:0} Coins Earned`,BW/2,285,'#f1c40f',28);
  bt(`Total: 🪙 ${G.coins}`,BW/2,322,'#fff',20);
  const el=G.battle?300-G.battle.timer:0,em=Math.floor(el/60),es=Math.floor(el%60);
  ft(`Cleared in ${em}:${es.toString().padStart(2,'0')}`,BW/2,354,'rgba(255,255,255,0.5)',18);
  const by=405,bw=200,bh=58;
  btn(BW/2-225,by,bw,bh,'⚙ SPIN WHEELS','#6c3483',inRect(G.hover,BW/2-225,by,bw,bh));
  btn(BW/2-5,by,bw,bh,'⚔ PLAY AGAIN','#922b21',inRect(G.hover,BW/2-5,by,bw,bh));
  btn(BW/2+215,by,bw,bh,'🏠 Main Menu','#2c3e50',inRect(G.hover,BW/2+215,by,bw,bh));
  drawFloats();
}

function drawGameOver(){
  drawBg('menu');
  ctx.font='bold 82px serif';ctx.textAlign='center';glow('#e74c3c',55);ctx.fillStyle='#e74c3c';ctx.fillText('DEFEATED',BW/2,225);ng();
  ft(G.battle&&G.battle.timer<=0?'Time ran out!':'You fell in battle...',BW/2,275,'rgba(255,255,255,0.6)',22);
  bt(`Coins earned: +${G.battle?G.battle.coinsEarned:0}`,BW/2,315,'#f1c40f',20);
  const by=380,bw=210,bh=58;
  btn(BW/2-225,by,bw,bh,'↩ Try Again','#922b21',inRect(G.hover,BW/2-225,by,bw,bh));
  btn(BW/2+15,by,bw,bh,'🏠 Main Menu','#2c3e50',inRect(G.hover,BW/2+15,by,bw,bh));
}

// ── SPIN LOGIC ────────────────────────────────────────────────
function startSpin(){
  const W=G.wheel;
  W.spinning=true;W.result=null;W.showTimer=0;W._wtype=W.active;
  W.vel=(14+Math.random()*14)*(Math.random()<0.5?1:-1);
  SFX.spinSnd();
}

function updateSpin(dt){
  const W=G.wheel;if(!W.spinning)return;
  const prev=W.angle;
  W.angle+=W.vel*dt*60*0.016; // normalize to 60fps feel
  W.vel*=Math.pow(0.982,dt*60);
  // Tick sound
  const segs=WHEEL_SEGS[W.active];
  const arc=Math.PI*2/segs.length;
  const prevSeg=Math.floor(((-prev%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/arc);
  const curSeg=Math.floor(((-W.angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/arc);
  if(prevSeg!==curSeg)SFX.tick();
  if(Math.abs(W.vel)<0.04){
    W.spinning=false;
    const seg=segAtAngle(WHEEL_SEGS[W.active],W.angle);
    W.result=WHEEL_SEGS[W.active].indexOf(seg);
    W.showTimer=4;
    applyResult(W.active,seg);
    PS.sparkle(BW/2,390,'#f1c40f');SFX.coin();
  }
}

function applyResult(wi,seg){
  const it=seg.it;
  if(wi===0){
    // Character — add to roster
    if(!G.roster.includes(it.id))G.roster.push(it.id);
    G.charIdx=CHARS.indexOf(it);
    const rc=RAR[it.rare];
    addFloat(`${rc.label}: ${it.name}!`,BW/2,220,rc.glow,24);
  }else if(wi===1){G.weaponIdx=WEAPONS.indexOf(it);addFloat(`${it.name} equipped!`,BW/2,220,it.col,22);}
  else if(wi===2){G.armorIdx=ARMORS.indexOf(it);addFloat(`${it.name} equipped!`,BW/2,220,it.col,22);}
  else if(wi===3){Object.entries(it.eff).forEach(([k,v])=>{G.upgrades[k]=(G.upgrades[k]||0)+v;});addFloat(`${it.name}!`,BW/2,220,it.col,22);}
  else if(wi===4){if(G.inventory.length<3){G.inventory.push(it);addFloat(`${it.name} added!`,BW/2,220,it.col,22);}else addFloat('Bag full! (max 3)',BW/2,220,'#e74c3c',22);}
}

// ── INPUT ─────────────────────────────────────────────────────
function getXY(e){
  const r=canvas.getBoundingClientRect(),s=canvas._s||1;
  const src=e.touches?e.touches[0]:e;
  return{x:(src.clientX-r.left)/s,y:(src.clientY-r.top)/s};
}
canvas.addEventListener('mousemove',e=>{const p=getXY(e);G.hover={x:p.x,y:p.y};});
canvas.addEventListener('touchmove',e=>{const p=getXY(e);G.hover={x:p.x,y:p.y};e.preventDefault();},{passive:false});

function onClick(e){
  const p=getXY(e);
  SFX.boot();SFX.resume();

  if(G.screen==='menu'){
    if(inRect(p,BW/2-330,BH-115,210,60)){G.screen='wheels';}
    else if(inRect(p,BW/2-100,BH-115,200,60)){G.screen='roster';}
    else if(inRect(p,BW/2+120,BH-115,210,60)){G.screen='diffsel';}
  }
  else if(G.screen==='wheels'){
    // Tabs
    WHEEL_DEFS.forEach((wd,i)=>{const tx=BW/2+(i-2)*170;if(inRect(p,tx-85,82,166,38)){G.wheel.active=i;G.wheel.result=null;G.wheel.showTimer=0;}});
    // Spin
    if(inRect(p,BW/2-95,BH-78,190,52)&&!G.wheel.spinning&&G.coins>=50){G.coins-=50;startSpin();}
    // Roster
    if(inRect(p,BW-160,BH-78,145,52)){G.screen='roster';}
    // Back
    if(inRect(p,18,BH-78,120,52)){G.screen='menu';}
  }
  else if(G.screen==='roster'){
    const cols=4,cw=280,ch=200,gapX=16,gapY=16;
    const startX=(BW-cols*cw-(cols-1)*gapX)/2,startY=80;
    CHARS.forEach((c,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const x=startX+col*(cw+gapX),y=startY+row*(ch+gapY);
      if(inRect(p,x,y,cw,ch)&&G.roster.includes(c.id)){G.charIdx=i;}
    });
    if(inRect(p,18,BH-72,140,52)){G.screen='wheels';}
  }
  else if(G.screen==='diffsel'){
    const cols=2,bw=560,bh=115,gapX=20,gapY=10;
    const sx=(BW-cols*bw-(cols-1)*gapX)/2,sy=82;
    DIFFS.forEach((d,i)=>{const col=i%cols,row=Math.floor(i/cols),x=sx+col*(bw+gapX),y=sy+row*(bh+gapY);if(inRect(p,x,y,bw,bh))startBattle(d);});
    if(inRect(p,18,BH-68,130,50)){G.screen='menu';}
  }
  else if(G.screen==='battle'){
    const B=G.battle;
    // Power ups
    G.inventory.forEach((pw,i)=>{
      const pw_w=160,pw_h=54,pw_y=BH-85;
      const px=BW/2-((G.inventory.length-1)*0.5-i)*(pw_w+10)-pw_w/2;
      if(inRect(p,px,pw_y,pw_w,pw_h))usePower(pw);
    });
    // Click monster
    const live=B.monsters.filter(m=>!m.dead);
    live.forEach((m,i)=>{
      const msc=B.diff.cnt>=3?0.62:0.78;
      const mx=getMonsterX(m.id,B.diff.cnt),my=getMonsterY(m.id,B.diff.cnt);
      if(Math.hypot(p.x-mx,p.y-my)<70*msc){B.targetIdx=i;doAttack(i);}
    });
  }
  else if(G.screen==='victory'){
    const by=405,bw=200,bh=58;
    if(inRect(p,BW/2-225,by,bw,bh)){G.screen='wheels';}
    else if(inRect(p,BW/2-5,by,bw,bh)){startBattle(G.diff||DIFFS[2]);}
    else if(inRect(p,BW/2+215,by,bw,bh)){G.screen='menu';}
  }
  else if(G.screen==='gameover'){
    if(!G.battle._cashed){G.coins+=G.battle.coinsEarned;G.battle._cashed=true;}
    if(inRect(p,BW/2-225,380,210,58)){startBattle(G.diff||DIFFS[2]);}
    else if(inRect(p,BW/2+15,380,210,58)){G.screen='menu';}
  }
}
canvas.addEventListener('click',onClick);
canvas.addEventListener('touchend',e=>{onClick(e.changedTouches[0]?{clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY}:e);e.preventDefault();},{passive:false});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&G.screen==='battle'){
    const B=G.battle,live=B.monsters.filter(m=>!m.dead);
    if(live.length)doAttack(B.targetIdx);
    e.preventDefault();
  }
});

// ── GAME LOOP ─────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;G.t+=dt;
  G.flash.a=Math.max(0,G.flash.a-dt*3);
  if(G.wheel.showTimer>0)G.wheel.showTimer-=dt;
  updateSpin(dt);

  ctx.clearRect(0,0,BW,BH);
  if(G.screen==='menu')drawMenu();
  else if(G.screen==='wheels')drawWheelScr();
  else if(G.screen==='roster')drawRoster();
  else if(G.screen==='diffsel')drawDiffSel();
  else if(G.screen==='battle'){updateBattle(dt);drawBattle();}
  else if(G.screen==='victory')drawVictory();
  else if(G.screen==='gameover')drawGameOver();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
