<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHEEL OF FATE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
#c{display:block;cursor:pointer;}
/* Wheel panel — position:fixed, placed by JS over the right half of canvas */
#wheelPanel{
  display:none;position:fixed;overflow:hidden;
  flex-direction:column;gap:1%;padding:1%;
  background:rgba(4,0,14,0.92);
  border:1px solid rgba(100,0,200,0.25);
  border-radius:10px;
  box-shadow:0 0 30px rgba(80,0,160,0.35);
}
#wheelPanel.show{display:flex;}
.wtype{
  flex:1;min-height:0;
  border:2px solid rgba(255,255,255,0.12);border-radius:8px;
  background:rgba(8,0,22,0.95);color:#666;
  font-weight:bold;font-family:sans-serif;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:all .12s;line-height:1.3;
}
.wtype:hover{background:rgba(45,0,100,0.95);color:#ccc;border-color:rgba(140,70,255,0.6);}
.wtype.on{color:#fff;border-width:2px;border-color:#a855f7;background:rgba(80,20,180,0.95);box-shadow:0 0 12px rgba(168,85,247,0.5);}
.wsub{font-size:0.65em;opacity:0.45;font-weight:normal;display:block;margin-top:2px;}
#spinBtn{
  flex:1.5;min-height:0;
  border:2px solid #7c3aed;border-radius:10px;
  background:rgba(72,24,165,0.92);
  color:#fff;font-weight:bold;font-family:sans-serif;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;
  transition:all .1s;
}
#spinBtn:not([disabled]):hover{background:rgba(110,44,225,0.97);border-color:#c084fc;box-shadow:0 0 18px rgba(168,85,247,0.65);}
#spinBtn[disabled]{background:rgba(20,20,20,0.85);border-color:#2a2a2a;color:#484848;cursor:not-allowed;}
#spinLabel{font-size:1.4em;font-weight:bold;}
#spinSub{font-size:0.72em;opacity:0.75;}
#wResult{
  flex:0.9;min-height:0;
  border:1px solid rgba(255,255,255,0.08);border-radius:8px;
  background:rgba(3,0,10,0.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:sans-serif;color:#555;
  text-align:center;padding:4%;line-height:1.5;overflow:hidden;
}
#wNavRow{display:flex;gap:3%;flex:0 0 auto;min-height:0;}
.wnavbtn{
  flex:1;
  border:1px solid rgba(255,255,255,0.15);border-radius:7px;
  background:rgba(14,14,28,0.92);
  color:#999;font-family:sans-serif;font-weight:bold;
  cursor:pointer;
  transition:all .1s;
}
.wnavbtn:hover{background:rgba(40,40,75,0.97);color:#fff;border-color:rgba(255,255,255,0.38);}
/* Roster panel */
#rosterPanel{
  display:none;position:fixed;overflow-y:auto;
  background:rgba(4,0,14,0.96);
  border:1px solid rgba(100,0,200,0.25);
  border-radius:10px;
  box-shadow:0 0 30px rgba(80,0,160,0.35);
  flex-direction:column;gap:8px;padding:12px;
}
#rosterPanel.show{display:flex;}
#rosterGrid{display:grid;gap:8px;flex:1;}
.rcard{
  border:2px solid rgba(255,255,255,0.1);border-radius:8px;
  background:rgba(10,0,24,0.9);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px;
  transition:all .12s;
  min-height:0;
}
.rcard:hover.owned{background:rgba(50,0,110,0.9);border-color:rgba(150,80,255,0.55);}
.rcard.active{border-color:#f1c40f;background:rgba(241,196,15,0.08);box-shadow:0 0 12px rgba(241,196,15,0.3);}
.rcard.locked{cursor:default;opacity:0.4;}
.rcard-name{font-family:sans-serif;font-weight:bold;color:#fff;text-align:center;}
.rcard-rare{font-family:sans-serif;color:#888;text-align:center;margin-top:2px;}

#rosterBack{
  border:1px solid rgba(255,255,255,0.15);border-radius:7px;
  background:rgba(14,14,28,0.92);color:#999;
  font-family:sans-serif;font-weight:bold;cursor:pointer;
  padding:10px;transition:all .1s;flex-shrink:0;
}
#rosterBack:hover{background:rgba(40,40,75,0.97);color:#fff;}

<canvas id="c"></canvas>
<!-- Wheel controls panel — positioned by JS over the right half of the canvas -->
<div id="wheelPanel">
  <div id="wTypeLabel" style="text-align:center;color:rgba(255,255,255,0.4);font-family:sans-serif;flex-shrink:0;padding:2px 0;">SELECT WHEEL TYPE</div>
  <button class="wtype" data-wi="0">Character<span class="wsub">9 items · Common → Mythic</span></button>
  <button class="wtype" data-wi="1">Weapon<span class="wsub">8 items · Common → Mythic</span></button>
  <button class="wtype" data-wi="2">Armor<span class="wsub">7 items · Common → Mythic</span></button>

  <div id="wResult">Spin the wheel to discover your fate…</div>
  <div id="wNavRow">
    <button class="wnavbtn" id="wBackBtn">← Menu</button>
    <button class="wnavbtn" id="wRosterBtn">👤 Roster</button>
  </div>
</div>
<!-- Roster panel — positioned by JS -->
<div id="rosterPanel">
  <div style="text-align:center;color:#f1c40f;font-family:sans-serif;font-weight:bold;flex-shrink:0;padding:4px 0;">CHARACTER ROSTER</div>
  <div style="text-align:center;color:rgba(255,255,255,0.4);font-family:sans-serif;flex-shrink:0;padding:2px 0;font-size:0.8em;">Spin Character wheel to unlock · Click to equip</div>
  <div id="rosterGrid"></div>
  <button id="rosterBack">← Back to Wheels</button>

<script>
const canvas=document.getElementById('c');

const BW=1280,BH=720;
canvas.width=BW;canvas.height=BH;

const spinSubEl=document.getElementById('spinSub');

const wtypeBtns=[...document.querySelectorAll('.wtype')];
const rosterPanel=document.getElementById('rosterPanel');

// ── RESIZE + PANEL POSITIONING ────────────────────────────────
let _s=1;
function resize(){
  _s=Math.min(window.innerWidth/BW,window.innerHeight/BH);
  canvas.style.width=BW*_s+'px';canvas.style.height=BH*_s+'px';
  positionPanels();
}
function positionPanels(){
  // Canvas is flex-centered; calculate its screen position
  const cw=BW*_s,ch=BH*_s;
  const cl=(window.innerWidth-cw)/2,ct=(window.innerHeight-ch)/2;
  // Wheel panel covers right 47% of canvas, starting at 51%
  const px=cl+cw*0.51,py=ct+ch*0.08,pw=cw*0.47,ph=ch*0.88;
  setPanel(wheelPanel,px,py,pw,ph,_s);
  // Roster panel covers full canvas area
  setPanel(rosterPanel,cl+cw*0.01,ct+ch*0.01,cw*0.98,ch*0.98,_s);
}
function setPanel(el,x,y,w,h,s){
  el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';
  el.style.fontSize=Math.max(9,s*14)+'px';
  // Nav row height
  if(el===wheelPanel){const nv=el.querySelector('#wNavRow');if(nv)nv.style.height=Math.max(28,h*0.09)+'px';}
}
window.addEventListener('resize',resize);resize();

// ── RARITIES ──────────────────────────────────────────────────
const RAR={

const RAR_COLS=['#7f8c8d','#27ae60','#2980b9','#d35400','#d4ac0d','#ff0066'];

// ── DATA ──────────────────────────────────────────────────────
const CHARS=[

  {id:'void',   name:'Void Blade',   rare:'mythic',   atk:70,sp:'void', col:'#ff0066'},

const ARMORS=[

  {id:'leather',name:'Leather',      rare:'common',   def:8, col:'#8b6914'},

const MONSTERS=[

const DIFFS=[
  {id:'beginner',    name:'Beginner',    col:'#27ae60',hpM:0.4,atkM:0.3,cnt:1,mi:0,cm:2},
  {id:'easy',        name:'Easy',        col:'#2ecc71',hpM:0.7,atkM:0.6,cnt:1,mi:1,cm:5},
  {id:'normal',      name:'Normal',      col:'#f39c12',hpM:1.0,atkM:1.0,cnt:2,mi:2,cm:12},

const WDEFS=[
  {name:'Character',items:CHARS},
  {name:'Weapon',   items:WEAPONS},

// ── WEIGHTED WHEEL SEGMENTS ───────────────────────────────────
function buildSegs(items){
  const counts={};items.forEach(it=>counts[it.rare]=(counts[it.rare]||0)+1);
  const weights=items.map(it=>RAR[it.rare].w/counts[it.rare]);
  const total=weights.reduce((a,b)=>a+b,0);let a=0;
  return items.map((it,i)=>{const arc=(weights[i]/total)*Math.PI*2;const seg={it,start:a,arc};a+=arc;return seg;});
}
const WSEGS=WDEFS.map(wd=>buildSegs(wd.items));
function segAt(segs,rot){const n=((-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);let c=0;for(const s of segs){if(n>=c&&n<c+s.arc)return s;c+=s.arc;}return segs[0];}

// ── AUDIO ─────────────────────────────────────────────────────
const SFX=(()=>{
  let ac,sg,mNodes=[],ok=false;
  function boot(){if(ok)return;ok=true;try{ac=new(window.AudioContext||window.webkitAudioContext)();const mg=ac.createGain();mg.gain.value=1;mg.connect(ac.destination);sg=ac.createGain();sg.gain.value=0.5;sg.connect(mg);const mmg=ac.createGain();mmg.gain.value=0.18;mmg.connect(mg);menuLoop(mmg);}catch(e){ac=null;}}
  function resume(){try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}}
  function stopMusic(){mNodes.forEach(n=>{try{n.stop?n.stop():n.disconnect();}catch(e){}});mNodes=[];}
  function tone(f,type,t0,t1,vol,ramp){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;if(ramp)ramp(o.frequency,t0);g.gain.setValueAtTime(vol||0.15,t0);g.gain.exponentialRampToValueAtTime(0.0001,t1);o.connect(g);g.connect(sg);o.start(t0);o.stop(t1);}
  function noise(dur,t0,vol,fq){if(!ac)return;const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=ac.createBufferSource(),g=ac.createGain(),fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=fq||800;src.buffer=buf;g.gain.setValueAtTime(vol||0.15,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);src.connect(fl);fl.connect(g);g.connect(sg);src.start(t0);}
  function menuLoop(dest){if(!ac)return;const arp=[220,261.6,329.6,392,329.6,261.6];let t=ac.currentTime;function sched(){arp.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.55);g.gain.linearRampToValueAtTime(0.07,t+i*0.55+0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.55+0.52);o.connect(g);g.connect(dest||sg);o.start(t+i*0.55);o.stop(t+i*0.55+0.55);mNodes.push(o);});t+=arp.length*0.55;const id=setTimeout(sched,(arp.length*0.55-0.4)*1000);mNodes.push({stop:()=>clearTimeout(id)});}sched();}
  function battleLoop(){if(!ac)return;stopMusic();const mel=[110,138.6,165,184.9,220,184.9,165,138.6,110,138.6,165,220,165,138.6,110,82.5];let t=ac.currentTime;const bt=0.22;function loop(){mel.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=1000;g.gain.setValueAtTime(0,t+i*bt);g.gain.linearRampToValueAtTime(0.09,t+i*bt+0.03);g.gain.setValueAtTime(0.09,t+i*bt+bt*0.7);g.gain.linearRampToValueAtTime(0,t+i*bt+bt);o.connect(fl);fl.connect(g);g.connect(sg);o.start(t+i*bt);o.stop(t+i*bt+bt);mNodes.push(o);});[0,4,8,12].forEach(i=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(90,t+i*bt);o.frequency.exponentialRampToValueAtTime(40,t+i*bt+0.2);g.gain.setValueAtTime(0.3,t+i*bt);g.gain.exponentialRampToValueAtTime(0.0001,t+i*bt+0.22);o.connect(g);g.connect(sg);o.start(t+i*bt);o.stop(t+i*bt+0.22);mNodes.push(o);});[2,6,10,14].forEach(i=>noise(0.1,t+i*bt,0.1,1200));t+=mel.length*bt;const id=setTimeout(loop,(mel.length*bt-0.3)*1000);mNodes.push({stop:()=>clearTimeout(id)});}loop();}
  function attack(){if(!ac)return;const t=ac.currentTime;tone(350,'sawtooth',t,t+0.12,0.28,(f,t0)=>{f.setValueAtTime(400,t0);f.exponentialRampToValueAtTime(80,t0+0.12);});noise(0.08,t+0.04,0.15,600);}
  function hit(){if(!ac)return;const t=ac.currentTime;tone(220,'square',t,t+0.18,0.25,(f,t0)=>{f.setValueAtTime(280,t0);f.exponentialRampToValueAtTime(70,t0+0.18);});}
  function coin(){if(!ac)return;const t=ac.currentTime;[880,1320,1760].forEach((f,i)=>tone(f,'sine',t+i*0.07,t+i*0.07+0.2,0.12));}
  function tick(){if(!ac)return;const t=ac.currentTime;tone(1500,'sine',t,t+0.025,0.03);}
  function spinSnd(){if(!ac)return;const t=ac.currentTime;tone(150,'sawtooth',t,t+0.55,0.15,(f,t0)=>{f.setValueAtTime(150,t0);f.exponentialRampToValueAtTime(1400,t0+0.5);});}
  function victory(){if(!ac)return;stopMusic();const t=ac.currentTime;[523,659,784,659,784,1047,784,1047,1568].forEach((f,i)=>tone(f,'sine',t+i*0.13,t+i*0.13+0.25,0.2));}
  function death(){if(!ac)return;stopMusic();const t=ac.currentTime;tone(440,'sawtooth',t,t+2,0.25,(f,t0)=>{f.setValueAtTime(440,t0);f.exponentialRampToValueAtTime(35,t0+2);});}

// ── PARTICLES ─────────────────────────────────────────────────
const PS=(()=>{
  let pool=[];
  function emit(x,y,n,col,spd,sz,life,grav=true){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(0.5+Math.random()*0.5)*spd;pool.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,sz:(0.5+Math.random()*0.5)*sz,life,ml:life,grav});}}
  function hit(x,y,c){emit(x,y,12,c,180,5,0.6);emit(x,y,7,'#fff',240,2.5,0.28);}
  function explode(x,y,c){emit(x,y,28,c,300,7,1);emit(x,y,15,'#fff',350,3,0.35);emit(x,y,10,'#ffaa00',200,5,0.8);}
  function gold(x,y){emit(x,y,10,'#f1c40f',130,4,1);emit(x,y,5,'#fff',180,2,0.4);}
  function sparkle(x,y,c){emit(x,y,8,c,90,3,0.5,false);}
  function update(dt){pool=pool.filter(p=>p.life>0);pool.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grav)p.vy+=290*dt;p.life-=dt;});}
  function draw(){pool.forEach(p=>{const a=p.life/p.ml;ctx.save();ctx.globalAlpha=a*0.9;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=p.sz*2;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*a,0,Math.PI*2);ctx.fill();ctx.restore();});}
  return{emit,hit,explode,gold,sparkle,update,draw};
})();

const SAVE_KEY='wheeloffate';
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({coins:G.coins,roster:G.roster,cid:CHARS[G.charIdx].id,wi:G.weaponIdx,ai:G.armorIdx,upg:G.upgrades,inv:G.inventory.map(p=>p.id)}));}catch(e){}
}
function loadGame(){
  try{
    // Try stable key first, then old versioned keys as fallback
    const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('wof_v5')||localStorage.getItem('wof_v4')||localStorage.getItem('wof_v3')||'null';
    const d=JSON.parse(raw);if(!d)return;
    G.coins=typeof d.coins==='number'?Math.max(0,d.coins):50;
    G.roster=d.roster||['warrior'];
    const ci=CHARS.findIndex(c=>c.id===d.cid);if(ci>=0)G.charIdx=ci;
    if(d.wi>=0&&d.wi<WEAPONS.length)G.weaponIdx=d.wi;
    if(d.ai>=0&&d.ai<ARMORS.length)G.armorIdx=d.ai;
    if(d.upg)Object.assign(G.upgrades,d.upg);
    G.inventory=(d.inv||[]).map(id=>POWERUPS.find(p=>p.id===id)).filter(Boolean).slice(0,3);
  }catch(e){}
}

// ── BATTLE ────────────────────────────────────────────────────
function mX(id,cnt){return cnt===1?900:cnt===2?820+id*160:cnt===3?760+id*145:700+id*130;}
function mY(id,cnt){return cnt<=2?490:460+(id%2)*65;}
function startBattle(diff){
  const ps=pStats();G.diff=diff;
  G.battle={diff,timer:300,playerHp:ps.hp,playerMaxHp:ps.hp,effects:{shield:0,rage:0,slow:0,invince:0},atkCD:0,atkAnim:0,playerFlash:0,
    monsters:Array.from({length:diff.cnt},(_,i)=>{const mo=MONSTERS[diff.mi];return{...mo,id:i,hp:Math.floor(mo.hp*diff.hpM),maxHp:Math.floor(mo.hp*diff.hpM),atk:Math.floor(mo.atk*diff.atkM),atkCD:2+Math.random()*1.5,poisonT:0,phase:Math.random()*Math.PI*2,hitFlash:0,dead:false};}),
    coinsEarned:0,targetIdx:0,won:false,lost:false,_cashed:false};
  G.screen='battle';SFX.battleLoop();
}
function killM(m,B){m.dead=true;const earned=Math.max(B.diff.cm,Math.floor(m.maxHp*B.diff.cm*0.04));B.coinsEarned+=earned;addFloat(`+${earned}🪙`,mX(m.id,B.diff.cnt),mY(m.id,B.diff.cnt)-90,'#f1c40f',24);PS.explode(mX(m.id,B.diff.cnt),mY(m.id,B.diff.cnt),m.col);PS.gold(mX(m.id,B.diff.cnt),mY(m.id,B.diff.cnt));SFX.coin();}
function updBattle(dt){
  const B=G.battle;if(!B||B.won||B.lost)return;
  B.timer-=dt;B.atkCD-=dt;B.atkAnim=Math.max(0,B.atkAnim-dt*3);B.playerFlash=Math.max(0,B.playerFlash-dt*4);
  const ps=pStats();['shield','rage','slow','invince'].forEach(k=>{if(B.effects[k]>0)B.effects[k]-=dt;});
  B.monsters.filter(m=>!m.dead).forEach(m=>{m.hitFlash=Math.max(0,m.hitFlash-dt*5);m.atkCD-=dt*(B.effects.slow>0?0.4:1);if(m.poisonT>0){m.poisonT-=dt;m.hp=Math.max(0,m.hp-10*dt);if(m.hp<=0)killM(m,B);}if(m.atkCD<=0&&!m.dead){m.atkCD=1.8+Math.random()*1.5;if(B.effects.invince<=0){const dmg=Math.max(1,Math.floor(m.atk-ps.def*(B.effects.shield>0?1.8:1))*(B.effects.shield>0?0.5:1));B.playerHp-=dmg;B.playerFlash=1;SFX.hit();addFloat(`-${Math.floor(dmg)}`,240,360,'#e74c3c',26);PS.hit(230,380,'#e74c3c');}SFX.roar(m.type);}});
  if(B.playerHp<=0){B.playerHp=0;B.lost=true;G.coins+=B.coinsEarned;B._cashed=true;G.screen='gameover';SFX.death();saveGame();return;}
  if(B.timer<=0){B.lost=true;G.coins+=B.coinsEarned;B._cashed=true;G.screen='gameover';SFX.death();saveGame();return;}
  if(B.monsters.filter(m=>!m.dead).length===0){B.won=true;G.coins+=B.coinsEarned;B._cashed=true;SFX.victory();G.screen='victory';saveGame();return;}
  PS.update(dt);updFloats(dt);
}
function doAttack(idx){
  const B=G.battle;if(!B||B.atkCD>0)return;const live=B.monsters.filter(m=>!m.dead);if(!live.length)return;idx=Math.min(idx,live.length-1);const tgt=live[idx];if(!tgt)return;
  const ps=pStats(),w=WEAPONS[G.weaponIdx],crit=Math.random()<ps.crit;let dmg=Math.max(1,ps.atk+(ps.mag*0.35|0))*(B.effects.rage>0?2:1)*(crit?2.2:1);if(w.sp==='burn')dmg*=1.25;if(w.sp==='holy')dmg*=1.35;if(w.sp==='void')dmg*=1.5;dmg=Math.floor(dmg);tgt.hp-=dmg;tgt.hitFlash=1;if(w.sp==='stun')tgt.atkCD=Math.max(tgt.atkCD,4.5);if(w.sp==='drain'){const h=Math.floor(dmg*0.18);B.playerHp=Math.min(B.playerMaxHp,B.playerHp+h);}if(ps.lifesteal>0)B.playerHp=Math.min(B.playerMaxHp,B.playerHp+Math.floor(dmg*ps.lifesteal));B.atkAnim=1;PS.hit(mX(tgt.id,B.diff.cnt),mY(tgt.id,B.diff.cnt),CHARS[G.charIdx].col);addFloat(crit?`CRIT! ${dmg}`:`${dmg}`,mX(tgt.id,B.diff.cnt),mY(tgt.id,B.diff.cnt)-70,crit?'#f1c40f':'#fff',crit?30:22);SFX.attack();if(tgt.hp<=0)killM(tgt,B);B.atkCD=Math.max(0.28,2.8-pStats().spd*0.09);
}
function usePow(pw){
  const B=G.battle;if(!B)return;SFX.power();
  if(pw.id==='shield')B.effects.shield=pw.dur;else if(pw.id==='rage')B.effects.rage=pw.dur;else if(pw.id==='heal')B.playerHp=Math.min(B.playerMaxHp,B.playerHp+80);else if(pw.id==='poison')B.monsters.filter(m=>!m.dead).forEach(m=>m.poisonT=pw.dur);else if(pw.id==='slow')B.effects.slow=pw.dur;else if(pw.id==='invince')B.effects.invince=pw.dur;else if(pw.id==='nuke')B.monsters.filter(m=>!m.dead).forEach(m=>{m.hp-=200;if(m.hp<=0)killM(m,B);else{m.hitFlash=1;PS.explode(mX(m.id,B.diff.cnt),mY(m.id,B.diff.cnt),'#f1c40f');}});else if(pw.id==='worldend')B.monsters.filter(m=>!m.dead).forEach(m=>{m.hp=0;killM(m,B);});
  G.inventory=G.inventory.filter(pw2=>pw2!==pw);
}

  let ex=22;const ef=B.effects;if(ef.shield>0){glow('#3498db',12);bt(`🛡${ef.shield|0}s`,ex,65,'#3498db',13,'left');ex+=72;ng();}if(ef.rage>0){glow('#e74c3c',12);bt(`🔥${ef.rage|0}s`,ex,65,'#e74c3c',13,'left');ex+=72;ng();}if(ef.slow>0){glow('#9b59b6',12);bt(`⏱${ef.slow|0}s`,ex,65,'#9b59b6',13,'left');ex+=72;ng();}if(ef.invince>0){glow('#1abc9c',12);bt(`⚡${ef.invince|0}s`,ex,65,'#1abc9c',13,'left');ng();}
  if(B.atkCD>0){const maxCD=2.8-ps.spd*0.09;ctx.fillStyle='rgba(241,196,15,0.35)';rr(18,70,300*(1-B.atkCD/Math.max(0.28,maxCD)),5,2);}
  if(B.playerFlash>0)ctx.filter='saturate(5) brightness(2.5)';
  drawHero(200,520,G.charIdx,1,B.atkAnim>0?'attack':null,B.effects);ctx.filter='none';
  const live=B.monsters.filter(m=>!m.dead);
  B.monsters.forEach(m=>{if(m.dead)return;const li2=live.indexOf(m),mmx=mX(m.id,B.diff.cnt),mmy=mY(m.id,B.diff.cnt),msc=B.diff.cnt>=3?0.62:0.78;if(li2===B.targetIdx){ctx.strokeStyle=`rgba(255,200,0,${0.45+Math.sin(G.t*4)*0.3})`;ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(mmx,mmy,60*msc,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}drawMonster(mmx,mmy,m,msc);hpBar(mmx-65,mmy-88*msc,130,12,m.hp,m.maxHp,m.col);ft(m.name,mmx,mmy-92*msc,'rgba(255,255,255,0.85)',11);ft(`${Math.ceil(m.hp)}/${m.maxHp}`,mmx,mmy-76*msc,'rgba(255,255,255,0.5)',10);if(m.poisonT>0){glow('#27ae60',18);ctx.fillStyle='rgba(39,174,96,0.15)';ctx.beginPath();ctx.arc(mmx,mmy,60*msc,0,Math.PI*2);ctx.fill();ng();}});
  panel(0,BH-90,BW,90,0,0.78);ft('POWERS — click to use',BW/2,BH-76,'rgba(255,255,255,0.3)',12);
  G.inventory.forEach((pw,i)=>{const pw2=160,ph=54,py=BH-83,px=BW/2-((G.inventory.length-1)*0.5-i)*(pw2+10)-pw2/2;bigBtn(px,py,pw2,ph,pw.name,pw.col,inRect(G.hover,px,py,pw2,ph),pw.desc);});
  if(!G.inventory.length)ft('No powers — spin the Power Up wheel',BW/2,BH-52,'rgba(255,255,255,0.28)',14);
  ft('SPACE or click monster to attack',BW/2,BH-6,'rgba(255,255,255,0.2)',12);
  PS.draw();drawFloats();
}
function drawVictory(){
  drawBg('menu');for(let i=0;i<4;i++)PS.emit(Math.random()*BW,-10,1,'#f1c40f',90,5,3,true);PS.update(0.016);PS.draw();
  const vg=ctx.createLinearGradient(0,160,0,245);vg.addColorStop(0,'#f1c40f');vg.addColorStop(1,'#e67e22');
  ctx.font='bold 88px serif';ctx.textAlign='center';ctx.fillStyle=vg;glow('#f1c40f',55);ctx.fillText('VICTORY!',BW/2,225);ng();
  bt(`+${G.battle?G.battle.coinsEarned:0} Coins Earned`,BW/2,284,'#f1c40f',28);bt(`Total: 🪙 ${G.coins}`,BW/2,320,'#fff',20);
  const by=402;bigBtn(BW/2-330,by,200,58,'⚙ SPIN WHEELS','#6c3483',inRect(G.hover,BW/2-330,by,200,58));bigBtn(BW/2-110,by,200,58,'⚔ PLAY AGAIN','#922b21',inRect(G.hover,BW/2-110,by,200,58));bigBtn(BW/2+110,by,220,58,'🏠 Main Menu','#2c3e50',inRect(G.hover,BW/2+110,by,220,58));drawFloats();
}
function drawGameOver(){
  drawBg('menu');ctx.font='bold 82px serif';ctx.textAlign='center';glow('#e74c3c',55);ctx.fillStyle='#e74c3c';ctx.fillText('DEFEATED',BW/2,225);ng();
  ft(G.battle&&G.battle.timer<=0?'Time ran out!':'You fell in battle…',BW/2,274,'rgba(255,255,255,0.6)',22);bt(`Coins earned: +${G.battle?G.battle.coinsEarned:0}`,BW/2,314,'#f1c40f',20);
  const by=378;bigBtn(BW/2-230,by,215,58,'↩ Try Again','#922b21',inRect(G.hover,BW/2-230,by,215,58));bigBtn(BW/2+15,by,215,58,'🏠 Main Menu','#2c3e50',inRect(G.hover,BW/2+15,by,215,58));
}

// ── SPIN LOGIC ────────────────────────────────────────────────
function startSpin(){const W=G.wheel;W.spinning=true;W.vel=(13+Math.random()*14)*(Math.random()<0.5?1:-1);SFX.spinSnd();refreshWheelUI();}
function updSpin(dt){
  const W=G.wheel;if(!W.spinning)return;
  const prev=W.angle;W.angle+=W.vel*dt*58;W.vel*=Math.pow(0.983,dt*60);
  const segs=WSEGS[W.active],arc=Math.PI*2/segs.length;
  const ps=((-prev%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/arc)|0,cs=((-W.angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/arc)|0;
  if(ps!==cs)SFX.tick();
  if(Math.abs(W.vel)<0.035){W.spinning=false;const seg=segAt(WSEGS[W.active],W.angle);applyResult(W.active,seg);PS.sparkle(310,355,'#f1c40f');SFX.coin();refreshWheelUI();saveGame();}
}
function applyResult(wi,seg){
  const it=seg.it,rc=RAR[it.rare]||RAR.common;
  wResultEl.innerHTML=`<span style="color:${rc.glow};font-size:1.1em;font-weight:bold">✨ ${it.name}</span><br><span style="color:#888;font-size:0.9em">[${rc.label}]</span>${it.desc?`<br><span style="color:#666;font-size:0.82em">${it.desc}</span>`:''}`;
  if(wi===0){if(!G.roster.includes(it.id))G.roster.push(it.id);G.charIdx=CHARS.indexOf(it);addFloat(`${rc.label}: ${it.name}!`,310,180,rc.glow,24);}
  else if(wi===1){G.weaponIdx=WEAPONS.indexOf(it);addFloat(`${it.name} equipped!`,310,180,it.col,22);}
  else if(wi===2){G.armorIdx=ARMORS.indexOf(it);addFloat(`${it.name} equipped!`,310,180,it.col,22);}
  else if(wi===3){Object.entries(it.eff).forEach(([k,v])=>{G.upgrades[k]=(G.upgrades[k]||0)+v;});addFloat(`${it.name}!`,310,180,it.col,22);}
  else if(wi===4){if(G.inventory.length<3){G.inventory.push(it);addFloat(`${it.name} added!`,310,180,it.col,22);}else addFloat('Bag full! (3 max)',310,180,'#e74c3c',22);}
}

// ── WHEEL HTML PANEL ──────────────────────────────────────────
function showWheelPanel(v){
  wheelPanel.classList.toggle('show',v);
  rosterPanel.classList.remove('show');
  if(v)refreshWheelUI();
}
function refreshWheelUI(){
  const W=G.wheel,canSpin=!W.spinning&&G.coins>=50;
  wtypeBtns.forEach((b,i)=>{
    b.classList.toggle('on',G.wheel.active===i);
    b.style.borderColor=G.wheel.active===i?RAR_COLS[i]:'';
    b.style.boxShadow=G.wheel.active===i?`0 0 12px ${RAR_COLS[i]}66`:'';
  });
  spinBtnEl.disabled=!canSpin;
  spinLabelEl.textContent=G.wheel.spinning?'Spinning…':'⚡ SPIN!';
  spinSubEl.textContent=G.wheel.spinning?'':canSpin?`Cost 50🪙 · You have ${G.coins}`:G.coins<50?`Need ${50-G.coins} more coins`:'Not enough coins';
}

wtypeBtns.forEach(b=>b.addEventListener('click',()=>{
  try{SFX.boot();SFX.resume();}catch(e){}
  G.wheel.active=+b.dataset.wi;
  wResultEl.textContent='Spin the wheel to discover your fate…';
  refreshWheelUI();
}));

spinBtnEl.addEventListener('click',()=>{
  if(G.wheel.spinning||G.coins<50)return;
  try{SFX.boot();SFX.resume();}catch(e){}
  G.coins-=50;wResultEl.textContent='Spinning…';startSpin();
});

document.getElementById('wBackBtn').addEventListener('click',()=>{
  try{SFX.boot();SFX.resume();}catch(e){}
  G.screen='menu';showWheelPanel(false);
});
document.getElementById('wRosterBtn').addEventListener('click',()=>{
  try{SFX.boot();SFX.resume();}catch(e){}
  showWheelPanel(false);showRosterPanel();
});

// ── ROSTER HTML PANEL ─────────────────────────────────────────
function showRosterPanel(){
  rosterGrid.innerHTML='';
  // 3 columns grid
  rosterGrid.style.gridTemplateColumns='repeat(3,1fr)';
  rosterGrid.style.flex='1';
  CHARS.forEach((c,i)=>{
    const owned=G.roster.includes(c.id),active=G.charIdx===i;
    const rc=RAR[c.rare]||RAR.common;
    const card=document.createElement('div');
    card.className='rcard'+(active?' active':'')+(owned?' owned':' locked');
    card.style.borderColor=active?'#f1c40f':owned?c.col+'88':'rgba(255,255,255,0.08)';
    card.innerHTML=`<div class="rcard-name" style="font-size:0.9em;color:${owned?'#fff':'#444'}">${owned?'':'🔒 '}${c.name}</div>`+
      `<div class="rcard-rare" style="color:${owned?rc.glow:'#333'};font-size:0.72em">[${rc.label}]</div>`+
      (active?'<div class="rcard-status" style="font-size:0.72em">✓ ACTIVE</div>':'')+
      (!owned?'<div style="color:#333;font-size:0.68em;font-family:sans-serif;margin-top:4px">Spin to unlock</div>':'')+
      (owned&&!active?`<div style="color:rgba(255,255,255,0.35);font-size:0.68em;font-family:sans-serif;margin-top:4px">ATK ${c.atk} DEF ${c.def} HP ${c.hp}</div>`:'');
    if(owned){
      card.addEventListener('click',()=>{
        try{SFX.boot();SFX.resume();}catch(e){}
        G.charIdx=i;showRosterPanel();saveGame();
      });
    }
    rosterGrid.appendChild(card);
  });
  rosterPanel.classList.add('show');
  G.screen='roster';
}

document.getElementById('rosterBack').addEventListener('click',()=>{
  try{SFX.boot();SFX.resume();}catch(e){}
  rosterPanel.classList.remove('show');G.screen='wheels';showWheelPanel(true);
});

// ── CANVAS INPUT ──────────────────────────────────────────────
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();G.hover={x:(e.clientX-r.left)/r.width*BW,y:(e.clientY-r.top)/r.height*BH};});

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();const p={x:(e.clientX-r.left)/r.width*BW,y:(e.clientY-r.top)/r.height*BH};
  try{SFX.boot();SFX.resume();}catch(err){}
  if(G.screen==='menu'){
    const by=BH-108;
    if(inRect(p,BW/2-330,by,200,60)){G.screen='wheels';showWheelPanel(true);}
    else if(inRect(p,BW/2-110,by,200,60)){showRosterPanel();}
    else if(inRect(p,BW/2+110,by,220,60)){G.screen='diffsel';}
  }
  else if(G.screen==='diffsel'){
    const cols=2,bw=580,bh=112,gx=18,gy=8,sx=(BW-cols*bw-(cols-1)*gx)/2,sy=68;
    DIFFS.forEach((d,i)=>{const c=i%cols,row=Math.floor(i/cols),x=sx+c*(bw+gx),y=sy+row*(bh+gy);if(inRect(p,x,y,bw,bh))startBattle(d);});
    if(inRect(p,20,BH-64,140,50))G.screen='menu';
  }
  else if(G.screen==='battle'){
    const B=G.battle;
    G.inventory.forEach((pw,i)=>{const pw2=160,ph=54,py=BH-83,px=BW/2-((G.inventory.length-1)*0.5-i)*(pw2+10)-pw2/2;if(inRect(p,px,py,pw2,ph))usePow(pw);});
    B.monsters.filter(m=>!m.dead).forEach((m,i)=>{const msc=B.diff.cnt>=3?0.62:0.78;if(Math.hypot(p.x-mX(m.id,B.diff.cnt),p.y-mY(m.id,B.diff.cnt))<70*msc){B.targetIdx=i;doAttack(i);}});
  }
  else if(G.screen==='victory'){
    if(inRect(p,BW/2-330,402,200,58)){G.screen='wheels';showWheelPanel(true);}
    else if(inRect(p,BW/2-110,402,200,58)){startBattle(G.diff||DIFFS[2]);}
    else if(inRect(p,BW/2+110,402,220,58)){G.screen='menu';}
  }
  else if(G.screen==='gameover'){
    if(inRect(p,BW/2-230,378,215,58))startBattle(G.diff||DIFFS[2]);
    else if(inRect(p,BW/2+15,378,215,58))G.screen='menu';
  }
});

canvas.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0];if(!t)return;canvas.dispatchEvent(new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY,bubbles:true}));e.preventDefault();},{passive:false});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&G.screen==='battle'){const B=G.battle,live=B.monsters.filter(m=>!m.dead);if(live.length)doAttack(B.targetIdx);e.preventDefault();}});

// ── GAME LOOP ─────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;G.t+=dt;
  G.flash.a=Math.max(0,G.flash.a-dt*3);
  updSpin(dt);
  ctx.clearRect(0,0,BW,BH);
  if(G.screen==='menu')drawMenu();
  else if(G.screen==='wheels'||G.screen==='roster')drawWheelScr();
  else if(G.screen==='diffsel')drawDiffSel();
  else if(G.screen==='battle'){updBattle(dt);drawBattle();}
  else if(G.screen==='victory')drawVictory();
  else if(G.screen==='gameover')drawGameOver();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
