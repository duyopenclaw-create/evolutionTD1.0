function renderLobby(room){
  var code = room.getAttribute("data-id");
  var players = roomPlayers(room);
  var myRole = roleOf(room, myId);
  var isAdmin = myRole === "admin";
  var isMod = myRole === "mod";
  var canModerate = isAdmin || isMod;

  var rowsHtml = players.map(function(p){
    var pid = p.getAttribute("data-id");
    var role = p.getAttribute("data-role");
    var color = playerColor(room, pid);
    var timedOut = isTimedOut(p);
    var tools = "";
    if(pid !== myId && canModerate){
      if(isAdmin && role !== "admin"){
        tools += '<button class="btn small ghost" data-action="make-mod" data-id="'+pid+'" title="Make moderator">🛡️</button>';
      }
      if(role !== "admin" && !timedOut){
        tools += '<button class="btn small ghost" data-action="timeout-player" data-id="'+pid+'" title="Timeout 60s">⏱️</button>';
      }
      if(isAdmin && role !== "admin"){
        tools += '<button class="btn small ghost" data-action="kick-player" data-id="'+pid+'" title="Remove">🚫</button>';
      }
    }
    return '<div class="player-row"><span class="dot" style="background:'+color+';"></span>'+
      '<span class="avatar">'+esc(p.getAttribute("data-avatar"))+'</span>'+
      '<span class="pname">'+esc(p.getAttribute("data-name"))+'</span>'+
      (pid===myId ? '<span class="tag you">you</span>' : '')+
      (role==="admin" ? '<span class="tag">host</span>' : role==="mod" ? '<span class="tag">mod</span>' : '')+
      (timedOut ? '<span class="tag timeout">timeout</span>' : '')+
      '<span class="tools">'+tools+'</span></div>';
  }).join("");

  var chatMsgs = Array.prototype.slice.call(room.querySelectorAll(".chat > *")).slice(-40);
  var chatHtml = chatMsgs.map(function(m){
    if(m.classList.contains("system")){
      return '<div class="chat-msg system">'+esc(m.textContent)+'</div>';
    }
    var color = playerColor(room, m.getAttribute("data-author"));
    return '<div class="chat-msg"><span class="who" style="color:'+color+';">'+esc(m.getAttribute("data-name"))+':</span>'+esc(m.textContent)+'</div>';
  }).join("");

  var gtype = room.getAttribute("data-game-type");
  var gamePicksHtml = GAMES.map(function(g){
    return '<button class="game-pick'+(gtype===g.type?" active":"")+'" data-action="pick-game" data-type="'+g.type+'" '+(isAdmin?"":"disabled")+'>'+
      '<span class="emoji">'+g.emoji+'</span><span class="name">'+g.name+'</span></button>';
  }).join("");

  var inviteLink = location.href.split("#")[0] + "#r=" + code;

  var out = '';
  if(readOnly) out += '<div class="readonly-banner">👀 You\'re viewing read-only — ask the host to share this room with edit access so you can play.</div>';
  out += '<div class="back-row"><button class="btn ghost small" data-action="leave-room">← Leave</button>'+
    (isAdmin ? '<button class="btn ghost small" data-action="close-room">Close room</button>' : '')+
    '<button class="btn gold small" data-action="open-invite">Invite</button></div>';
  out += '<div class="room-head"><h2 class="disp">'+esc(room.getAttribute("data-name"))+'</h2><span class="code-pill mono">'+esc(code)+'</span></div>';
  out += '<div class="lobby-grid">';
  out += '<div>';
  out += '<div class="card panel"><h3>Players ('+players.length+')</h3>'+rowsHtml+'</div>';
  out += '<div class="card panel"><h3>Chat</h3><div class="chat-box"><div class="chat-log" id="chat-log">'+chatHtml+'</div>'+
    '<div class="chat-input"><input type="text" id="chat-input" placeholder="Say something nice..." maxlength="300" autocomplete="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true" data-bwignore oninput="this.value=this.value.replace(/[^ -~]/g,\'\')">'+
    '<button class="btn primary" data-action="send-chat">Send</button></div></div></div>';
  out += '</div>';
  out += '<div>';
  out += '<div class="card panel"><h3>Choose a game'+(isAdmin?"":" (host picks)")+'</h3><div class="game-pick-grid">'+gamePicksHtml+'</div></div>';
  out += '<div class="card panel" id="game-stage-slot">'+(gtype ? renderGame(room, gtype) : '<div class="empty-note">Waiting for the host to start a game.</div>')+'</div>';
  out += '</div>';
  out += '</div>';

  out += '<div class="modal-backdrop" id="invite-modal" '+(nav.inviteOpen?'':'hidden')+'><div class="modal"><h3 class="disp">Invite friends 🎉</h3>'+
    '<p style="color:var(--muted);font-size:14px;">Share this room code or link:</p>'+
    '<div class="link-box mono">'+esc(inviteLink)+'</div>'+
    '<button class="btn primary block" data-action="copy-invite" data-link="'+esc(inviteLink)+'">Copy invite link</button>'+
    '<button class="btn ghost block" style="margin-top:8px;" data-action="close-invite">Close</button></div></div>';

  setTimeout(function(){
    var log = document.getElementById("chat-log");
    if(log) log.scrollTop = log.scrollHeight;
  }, 0);

  return out;
}

function renderGame(room, type){
  if(type==="tictactoe") return renderTicTacToe(room, room.querySelector(".game"));
  if(type==="spam") return renderSpam(room, room.querySelector(".game"));
  if(type==="guesswho") return renderGuessWho(room, room.querySelector(".game"));
  if(type==="flappy") return renderFlappy(room, room.querySelector(".game"));
  if(type==="cups") return renderCups(room, room.querySelector(".game"));
  return "";
}

/* ---------- TicTacToe render ---------- */
function renderTicTacToe(room, game){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2");
  var turn=game.getAttribute("data-turn"), winner=game.getAttribute("data-winner");
  var iAmPlaying = myId===p1 || myId===p2;
  var out = '<div class="stage-head"><h2 class="disp">⭕ Tic Tac Toe</h2></div>';
  if(!p1 || !p2){
    out += '<div class="turn-banner">Waiting for players ('+((p1?1:0)+(p2?1:0))+'/2)</div>';
    if(!iAmPlaying) out += '<button class="btn primary block" data-action="ttt-join">Join as player</button>';
  } else if(winner){
    var wname = winner==="draw" ? "It's a draw!" : (playerName(room,winner)+" wins! 🎉");
    out += '<div class="turn-banner">'+esc(wname)+'</div>';
  } else {
    out += '<div class="turn-banner">'+(turn===myId?"Your turn!":(playerName(room,turn)+"\u2019s turn"))+'</div>';
  }
  if(!iAmPlaying && (p1&&p2)) out += '<div class="spectator-note">You\'re spectating this match.</div>';
  out += '<div class="ttt-board">';
  for(var i=0;i<9;i++){
    var cell = game.querySelector('.cell[data-idx="'+i+'"]');
    var mark = cell ? cell.getAttribute("data-mark") : "";
    var playable = (turn===myId && !mark && !winner);
    out += '<div class="ttt-cell '+(mark==="X"?"x":mark==="O"?"o":"")+(playable?" playable":"")+'" '+(playable?'data-action="ttt-move" data-idx="'+i+'"':'')+'>'+mark+'</div>';
  }
  out += '</div>';
  if(winner) out += '<button class="btn gold block" data-action="ttt-reset">Play again</button>';
  out += '<div class="flappy-scoreboard"><span class="flappy-score-chip">X: '+(p1?esc(playerName(room,p1)):"—")+'</span><span class="flappy-score-chip">O: '+(p2?esc(playerName(room,p2)):"—")+'</span></div>';
  return out;
}

/* ---------- Spam render ---------- */
function renderSpam(room, game){
  var status = game.getAttribute("data-status");
  var entries = Array.prototype.slice.call(game.querySelectorAll(".spam-entry"));
  var out = '<div class="stage-head"><h2 class="disp">🔴 Spam Button</h2></div>';
  if(status==="idle" || !entries.length){
    out += '<div class="turn-banner">Everyone gets 10 seconds to click as fast as they can!</div>';
    out += '<button class="btn primary block" data-action="spam-start">Start round</button>';
    return out;
  }
  var endsAt = parseInt(game.getAttribute("data-ends-at")||"0",10);
  var remain = Math.max(0, Math.ceil((endsAt-Date.now())/1000));
  if(status==="active"){
    out += '<div class="spam-timer mono">'+remain+'s</div>';
  } else {
    var top = entries.slice().sort(function(a,b){return parseInt(b.getAttribute("data-clicks"))-parseInt(a.getAttribute("data-clicks"));})[0];
    out += '<div class="turn-banner">'+(top?esc(playerName(room, top.getAttribute("data-id")))+" wins with "+top.getAttribute("data-clicks")+" clicks! 🏆":"Round over")+'</div>';
  }
  out += '<div class="spam-grid">';
  entries.forEach(function(e){
    var pid = e.getAttribute("data-id");
    var clicks = e.getAttribute("data-clicks");
    var color = playerColor(room, pid);
    var mine = pid===myId;
    out += '<div class="spam-card" style="border:2px solid '+color+';">'+
      '<div>'+esc(playerName(room,pid))+'</div>'+
      '<div class="clicks mono" data-id="'+pid+'" data-base="'+clicks+'">'+clicks+'</div>'+
      (mine && status==="active" ? '<button class="spam-btn" data-action="spam-click">TAP!</button>' : '')+
      '</div>';
  });
  out += '</div>';
  if(status==="ended") out += '<button class="btn gold block" style="margin-top:14px;" data-action="spam-start">Play again</button>';
  return out;
}

/* ---------- Guess Who render ---------- */
function renderGuessWho(room, game){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2");
  var turn=game.getAttribute("data-turn"), winner=game.getAttribute("data-winner"), status=game.getAttribute("data-status");
  var iAmPlaying = myId===p1||myId===p2;
  var mySecretIsMine = myId===p1 ? game.getAttribute("data-secret1") : myId===p2 ? game.getAttribute("data-secret2") : "";
  var myChar = CHARACTERS.filter(function(c){return c.id===mySecretIsMine;})[0];
  var out = '<div class="stage-head"><h2 class="disp">🕵️ Guess Who</h2></div>';
  if(status==="waiting"){
    out += '<div class="turn-banner">Waiting for players ('+((p1?1:0)+(p2?1:0))+'/2)</div>';
    if(!iAmPlaying) out += '<button class="btn primary block" data-action="gw-join">Join as player</button>';
    return out;
  }
  if(winner){
    out += '<div class="turn-banner">'+esc(playerName(room,winner))+' guessed correctly! 🎉</div>';
  } else {
    out += '<div class="turn-banner">'+(turn===myId?"Your turn — ask a question or guess!":(playerName(room,turn)+"\u2019s turn"))+'</div>';
  }
  if(iAmPlaying && myChar){
    out += '<div class="spectator-note">Your secret character (opponent is guessing this): '+myChar.emoji+' '+myChar.name+'</div>';
  } else if(!iAmPlaying){
    out += '<div class="spectator-note">You\'re spectating this match.</div>';
  }
  out += '<div class="gw-grid">';
  CHARACTERS.forEach(function(c){
    var flipKey = nav.roomId+"_"+c.id;
    var flipped = !!gwFlips[flipKey];
    out += '<div class="gw-card'+(flipped?" flipped":"")+'" data-action="gw-flip-toggle" data-char="'+c.id+'"><div>'+c.emoji+'</div><div class="nm">'+c.name+'</div></div>';
  });
  out += '</div>';
  if(iAmPlaying && turn===myId && !winner){
    out += '<div class="gw-controls"><select id="gw-question-select">'+GW_QUESTIONS.map(function(q){return '<option value="'+q.attr+'">'+q.text+'</option>';}).join("")+'</select>'+
      '<button class="btn primary" data-action="gw-ask">Ask</button></div>';
    out += '<div class="gw-controls"><select id="gw-guess-select">'+CHARACTERS.map(function(c){return '<option value="'+c.id+'">'+c.emoji+' '+c.name+'</option>';}).join("")+'</select>'+
      '<button class="btn gold" data-action="gw-guess">Guess!</button></div>';
  }
  var log = Array.prototype.slice.call(game.querySelectorAll(".gw-entry")).slice(-30);
  out += '<div class="gw-log" style="margin-top:12px;">'+(log.length?log.map(function(e){return '<div>'+esc(e.textContent)+'</div>';}).join(""):'<div class="empty-note">No questions yet.</div>')+'</div>';
  if(winner) out += '<button class="btn gold block" style="margin-top:12px;" data-action="gw-reset">Play again</button>';
  return out;
}

/* ---------- Flappy render ---------- */
function renderFlappy(room, game){
  var status = game.getAttribute("data-status");
  var order = (room.getAttribute("data-ready-order")||"").split(",").filter(Boolean);
  var startedAt = parseInt(game.getAttribute("data-started-at")||"0",10);
  var isAdmin = roleOf(room, myId)==="admin";
  var out = '<div class="stage-head"><h2 class="disp">🐦 Flappy Race</h2></div>';
  if(status==="waiting"){
    out += '<div class="turn-banner">Get ready! Players join one at a time, 1 second apart.</div>';
    out += '<div class="flappy-waiting-list">'+order.map(function(id){return '<span class="tag">'+esc(playerName(room,id))+'</span>';}).join("")+'</div>';
    if(order.indexOf(myId)===-1) out += '<button class="btn primary block" data-action="flappy-ready">I\'m ready!</button>';
    else out += '<div class="empty-note">You\'re in — waiting for the host to start.</div>';
    if(isAdmin && order.length) out += '<button class="btn gold block" style="margin-top:8px;" data-action="flappy-start">Start race</button>';
    return out;
  }
  var seed = parseInt(game.getAttribute("data-seed")||"1",10);
  out += '<div class="flappy-track" id="flappy-track">';
  // pipes based on my own elapsed (visual approximation, one shared track)
  var refIdx = order.indexOf(myId);
  var myStart = startedAt + Math.max(0,refIdx)*1000;
  var elapsed = Math.max(0, Date.now()-myStart);
  var pipeSpacing = 220, speed = 0.09;
  var worldX = elapsed*speed;
  for(var k=-1;k<4;k++){
    var pIdx = Math.floor(worldX/pipeSpacing)+k;
    if(pIdx<0) continue;
    var screenX = (pIdx*pipeSpacing) - worldX + 40;
    if(screenX < -60 || screenX > 700) continue;
    var gap = pipeGapAt(seed, pIdx);
    out += '<div class="flappy-pipe" style="left:'+screenX+'px; top:0; height:'+Math.max(0,gap-55)+'px;"></div>';
    out += '<div class="flappy-pipe" style="left:'+screenX+'px; top:'+(gap+55)+'px; bottom:0; height:'+Math.max(0,340-(gap+55))+'px;"></div>';
  }
  var birds = Array.prototype.slice.call(game.querySelectorAll(".flappy-bird-store"));
  birds.forEach(function(b, bi){
    var pid = b.getAttribute("data-id");
    var y = parseFloat(b.getAttribute("data-y")||"150");
    var alive = b.getAttribute("data-alive")==="1";
    var color = playerColor(room, pid);
    var idx = order.indexOf(pid);
    var started = Date.now() >= startedAt + Math.max(0,idx)*1000;
    if(!started) return;
    out += '<div class="flappy-bird'+(alive?"":" flappy-crashed")+'" style="left:'+(30+ (idx%3)*4)+'px; top:'+y+'px; background:'+color+';">'+
      '<span class="flappy-name" style="color:'+color+';">'+esc(playerName(room,pid))+(pid===myId?" (you)":"")+'</span>🐤</div>';
  });
  out += '</div>';
  out += '<div class="flappy-scoreboard">'+birds.map(function(b){
    return '<span class="flappy-score-chip">'+esc(playerName(room,b.getAttribute("data-id")))+': '+b.getAttribute("data-score")+(b.getAttribute("data-alive")==="0"?" 💥":"")+'</span>';
  }).join("")+'</div>';
  var myBird = game.querySelector('.flappy-bird-store[data-id="'+myId+'"]');
  var myIdxInOrder = order.indexOf(myId);
  var myTurnStarted = myIdxInOrder!==-1 && Date.now() >= startedAt + myIdxInOrder*1000;
  if(status==="active" && myBird && myTurnStarted && myBird.getAttribute("data-alive")==="1"){
    out += '<button class="btn primary block" style="margin-top:10px;" data-action="flappy-flap">FLAP! (tap repeatedly)</button>';
  } else if(status==="active" && myIdxInOrder!==-1 && !myTurnStarted){
    out += '<div class="spectator-note">Your bird launches in '+Math.ceil((startedAt+myIdxInOrder*1000-Date.now())/1000)+'s...</div>';
  } else if(status==="active" && myIdxInOrder===-1){
    out += '<div class="spectator-note">You\'re spectating this race.</div>';
  }
  if(status==="ended") out += '<button class="btn gold block" style="margin-top:10px;" data-action="flappy-reset">Race again</button>';
  return out;
}

/* ---------- Cups render ---------- */
function renderCups(room, game){
  var status = game.getAttribute("data-status");
  var order = (game.getAttribute("data-order")||"").split(",").filter(Boolean);
  var current = game.getAttribute("data-current");
  var out = '<div class="stage-head"><h2 class="disp">🥤 Cup Shuffle</h2></div>';
  if(!order.length || order.indexOf(myId)===-1){
    out += '<div class="turn-banner">Take turns finding the ball!</div>';
    out += '<button class="btn primary block" data-action="cups-join">Join rotation</button>';
  }
  if(order.length){
    out += '<div class="turn-banner">'+(current===myId?"Your turn!":(playerName(room,current)+"\u2019s turn"))+'</div>';
  }
  var seed = parseInt(game.getAttribute("data-shuffle-seed")||"0",10);
  var swaps = parseInt(game.getAttribute("data-swaps")||"7",10);
  var startedAt = parseInt(game.getAttribute("data-shuffle-started-at")||"0",10);
  var elapsed = Date.now()-startedAt;
  var slotInfo = { order:[0,1,2] };
  if(status==="shuffling" || status==="guessing"){
    slotInfo = cupsSlotOrderAt(seed, swaps, status==="guessing"?999999:elapsed, 450);
  } else if(status==="revealed"){
    slotInfo = cupsSlotOrderAt(seed, swaps, 999999, 450);
  }
  var ballCup = parseInt(game.getAttribute("data-ball-cup")||"0",10);
  var revealed = game.getAttribute("data-revealed")==="1";
  var guessedSlot = parseInt(game.getAttribute("data-guessed-slot")||"-1",10);
  out += '<div class="cups-stage">';
  for(var slot=0; slot<3; slot++){
    var cupIdx = slotInfo.order[slot];
    var hasBall = cupIdx === ballCup;
    var clickable = status==="guessing" && current===myId;
    out += '<div class="cup'+(revealed?" revealed":"")+(hasBall&&revealed?" hasball":"")+(clickable?" clickable":"")+'" style="left:'+(slot*120)+'px;" '+(clickable?'data-action="cups-guess" data-slot="'+slot+'"':'')+'>'+
      '<div class="ball"></div><div class="cup-shape"></div></div>';
  }
  out += '</div>';
  if(status==="revealed"){
    var correct = game.getAttribute("data-correct")==="1";
    out += '<div class="turn-banner">'+(correct?"Found it! 🎉":"Not quite — better luck next time!")+'</div>';
    if(current===myId) out += '<button class="btn gold block" data-action="cups-next-turn">Next player\'s turn</button>';
  } else if(status==="idle" && current===myId){
    out += '<button class="btn primary block" data-action="cups-start-turn">Shuffle!</button>';
  } else if(status==="shuffling"){
    out += '<div class="spectator-note">Shuffling...</div>';
  }
  out += '<div class="cups-scoreboard">'+Array.prototype.slice.call(game.querySelectorAll(".cup-score")).map(function(s){
    return '<span class="flappy-score-chip">'+esc(playerName(room,s.getAttribute("data-id")))+': '+s.getAttribute("data-score")+'</span>';
  }).join("")+'</div>';
  return out;
}

function renderAchievementsModal(){
  var mount = document.getElementById("achievements-mount");
  if(!nav.achievementsOpen){ mount.innerHTML = ""; return; }
  var totalUnlocked = Object.keys(unlockedSet).length;
  var total = ACHIEVEMENTS.length;
  var pct = Math.round(100*totalUnlocked/total);
  var body = ACH_CATEGORIES.map(function(cat){
    var items = ACHIEVEMENTS.filter(function(a){ return a.category===cat; });
    var catUnlocked = items.filter(function(a){ return unlockedSet[a.id]; }).length;
    var itemsHtml = items.map(function(a){
      var isUnlocked = !!unlockedSet[a.id];
      var progress = achProgress(a);
      return '<div class="ach-item'+(isUnlocked?"":" locked")+'"><div class="icon">'+(isUnlocked?a.icon:"🔒")+'</div>'+
        '<div class="txt"><div class="nm">'+esc(a.name)+'</div><div class="ds">'+esc(a.desc)+'</div>'+
        (isUnlocked?'':'<div class="bar"><div style="width:'+(progress*100)+'%;"></div></div><div class="ds mono">'+(stats[a.statKey]||0)+' / '+a.threshold+'</div>')+
        '</div></div>';
    }).join("");
    return '<div class="ach-cat"><h4>'+esc(cat)+' <span class="n">('+catUnlocked+'/'+items.length+')</span></h4><div class="ach-grid">'+itemsHtml+'</div></div>';
  }).join("");
  mount.innerHTML = '<div class="modal-backdrop"><div class="modal ach-modal">'+
    '<div class="ach-head"><div><h3 class="disp">🏆 Achievements</h3><div class="ach-total">'+totalUnlocked+' / '+total+' unlocked</div>'+
    '<div class="ach-overall-bar"><div style="width:'+pct+'%;"></div></div></div>'+
    '<button class="btn ghost small" data-action="close-achievements">✕ Close</button></div>'+
    '<div class="ach-body">'+body+'</div></div></div>';
}

/* ======================================================================
   EVENT DELEGATION
   ====================================================================== */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  var room = nav.roomId ? findRoom(nav.roomId) : null;
  var game = room ? room.querySelector(".game") : null;

  switch(action){
    case "set-name": {
      var v = sanitizeText(document.getElementById("name-input").value).slice(0,18);
      if(!v) return;
      myName = v; localStorage.setItem("pl_name", v);
      audio.sfx.notify();
      registerKnown();
      var hash = location.hash;
      if(hash && hash.indexOf("#r=")===0){
        joinRoom(hash.slice(3));
      } else render();
      break;
    }
    case "create-room": {
      var name = document.getElementById("room-name-input").value;
      createRoom(name);
      break;
    }
    case "join-room": {
      var code = document.getElementById("join-code-input").value;
      joinRoom(code);
      break;
    }
    case "join-room-code": joinRoom(el.getAttribute("data-code")); break;
    case "add-friend": {
      var fn = document.getElementById("friend-name-input").value;
      sendFriendRequestByName(fn);
      document.getElementById("friend-name-input").value = "";
      break;
    }
    case "accept-friend": acceptFriendRequest(el.getAttribute("data-id")); break;
    case "decline-friend": declineFriendRequest(el.getAttribute("data-id")); break;
    case "cancel-friend": cancelFriendRequest(el.getAttribute("data-id")); break;
    case "unfriend": unfriend(el.getAttribute("data-id")); break;
    case "edit-name": {
      var newName = sanitizeText(window.prompt("Change your name:", myName) || "").slice(0,18);
      if(newName && newName !== myName){
        myName = newName; localStorage.setItem("pl_name", newName);
        registerKnown();
        var r2 = nav.roomId ? findRoom(nav.roomId) : null;
        if(r2){ var mp = findPlayer(r2, myId); if(mp){ commit(function(){ mp.setAttribute("data-name", newName); }); } }
        else render();
      }
      break;
    }
    case "leave-room": leaveRoom(); break;
    case "close-room": closeRoom(); break;
    case "open-invite": nav.inviteOpen = true; render(); break;
    case "close-invite": nav.inviteOpen = false; render(); break;
    case "open-achievements": nav.achievementsOpen = true; render(); break;
    case "close-achievements": nav.achievementsOpen = false; render(); break;
    case "copy-invite": {
      var link = el.getAttribute("data-link");
      bumpStat("invitesSent",1);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(link).then(function(){ toast("Invite link copied!"); }).catch(function(){ toast(link); });
      } else toast(link);
      break;
    }
    case "send-chat": {
      var input = document.getElementById("chat-input");
      sendChat(input.value); input.value="";
      break;
    }
    case "make-mod": if(room) setRole(room, el.getAttribute("data-id"), "mod"); break;
    case "timeout-player": if(room) timeoutPlayer(room, el.getAttribute("data-id")); break;
    case "kick-player": if(room) kickPlayer(room, el.getAttribute("data-id")); break;
    case "pick-game": if(room && roleOf(room,myId)==="admin") pickGame(el.getAttribute("data-type")); break;

    case "ttt-join": if(room&&game) tttJoin(room,game); break;
    case "ttt-move": if(room&&game) tttMove(room,game,parseInt(el.getAttribute("data-idx"),10)); break;
    case "ttt-reset": if(room&&game) tttReset(room,game); break;

    case "spam-start": if(room&&game) spamStart(room,game); break;
    case "spam-click": if(room&&game) spamClick(room,game); break;

    case "gw-join": if(room&&game) gwJoin(room,game); break;
    case "gw-flip-toggle": {
      var key = nav.roomId+"_"+el.getAttribute("data-char");
      gwFlips[key] = !gwFlips[key];
      render();
      break;
    }
    case "gw-ask": {
      var sel = document.getElementById("gw-question-select");
      if(room&&game&&sel) gwAsk(room,game,sel.value);
      break;
    }
    case "gw-guess": {
      var gsel = document.getElementById("gw-guess-select");
      if(room&&game&&gsel) gwGuess(room,game,gsel.value);
      break;
    }
    case "gw-reset": if(room&&game) gwReset(room,game); break;

    case "flappy-ready": if(room&&game) flappyReady(room,game); break;
    case "flappy-start": if(room&&game) flappyStart(room,game); break;
    case "flappy-flap": if(room&&game) flappyFlap(room,game); break;
    case "flappy-reset": if(room&&game) flappyReset(room,game); break;

    case "cups-join": if(room&&game) cupsJoinRotation(room,game); break;
    case "cups-start-turn": if(room&&game) cupsStartTurn(room,game); break;
    case "cups-guess": if(room&&game) cupsGuess(room,game,parseInt(el.getAttribute("data-slot"),10)); break;
    case "cups-next-turn": if(room&&game) cupsNextTurn(room,game); break;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    if(e.target.id === "name-input"){ document.querySelector('[data-action="set-name"]').click(); }
    if(e.target.id === "chat-input"){ document.querySelector('[data-action="send-chat"]').click(); }
    if(e.target.id === "join-code-input"){ document.querySelector('[data-action="join-room"]').click(); }
  }
  if(e.code === "Space"){
    var room = nav.roomId ? findRoom(nav.roomId) : null;
    var game = room ? room.querySelector(".game") : null;
    if(room && game && room.getAttribute("data-game-type")==="flappy" && document.activeElement.tagName!=="INPUT"){
      e.preventDefault();
      flappyFlap(room, game);
    }
  }
});

  if(myName) registerKnown();

    joinRoom(location.hash.slice(3));
  } else {
    render();
  }
  audio.initFromPref();

/* periodic tick: presence heartbeat + live game ticks */
var lastHeartbeat = 0;
var lastKnownBeat = 0;
setInterval(function(){
  var t0 = Date.now();
  if(t0 - lastKnownBeat > 20000){ lastKnownBeat = t0; registerKnown(); }
  checkFriendshipTransitions();
  var room = nav.roomId ? findRoom(nav.roomId) : null;
  if(!room){ render(); return; }
  var t = Date.now();
  if(t - lastHeartbeat > 20000){ lastHeartbeat = t; heartbeat(); }
  var game = room.querySelector(".game");
  var gtype = room.getAttribute("data-game-type");
  if(gtype === "spam" && game) spamCheckEnd(room, game);
  if(gtype === "flappy" && game){
    flappyTick(room, game);
    flappyMaybeEnd(room, game);
  }
  if(gtype === "cups" && game) cupsAdvanceIfDone(room, game);
  if(gtype && game) checkStatsTransitions(room, game, gtype);
  checkPersonalTransitions(room);
  render();
}, 200);

})();
