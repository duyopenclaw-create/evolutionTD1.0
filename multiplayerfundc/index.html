<title>Party Line</title>
<style>
  :root{
    --bg:#eef1fb; --surface:#ffffff; --surface2:#e4e9fb;
    --ink:#1c2140; --muted:#5c6389;
    --accent:#ff5c72; --accent-ink:#ffffff;
    --gold:#ffb648; --good:#2fbf71; --info:#4f7dff;
    --line: rgba(28,33,64,.12);
    --shadow: 0 10px 30px -12px rgba(28,33,64,.25);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12142a; --surface:#1b1e3d; --surface2:#242849;
      --ink:#eef0fb; --muted:#9aa0c9;
      --accent:#ff6b81; --accent-ink:#1c2140;
      --gold:#ffc35e; --good:#3ddc84; --info:#6f93ff;
      --line: rgba(238,240,251,.14);
      --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12142a; --surface:#1b1e3d; --surface2:#242849;
    --ink:#eef0fb; --muted:#9aa0c9;
    --accent:#ff6b81; --accent-ink:#1c2140;
    --gold:#ffc35e; --good:#3ddc84; --info:#6f93ff;
    --line: rgba(238,240,251,.14);
    --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    min-height:100vh;
  }
  #data-store{ display:none; }
  .disp{
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Rounded","Nunito",system-ui,sans-serif;
    font-weight:800; letter-spacing:-0.01em; text-wrap:balance;
  }
  .mono{ font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }

  #topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  #topbar .logo{ font-size:20px; display:flex; align-items:center; gap:8px; }
  #topbar .logo b{ font-size:19px; }
  #topbar .spacer{ flex:1; }
  #identity-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface2);
    padding:6px 12px 6px 6px; border-radius:999px; font-size:14px; font-weight:600;
  }
  .dot{ width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; box-shadow:0 0 0 2px var(--surface); }
  .dot-admin{ background:var(--accent); }
  .dot-mod{ background:var(--info); }
  .iconbtn{
    background:var(--surface2); border:1px solid var(--line); color:var(--ink);
    width:36px; height:36px; border-radius:50%; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{ filter:brightness(1.06); }

  #local-root{ max-width:1100px; margin:0 auto; padding:22px 18px 60px; }

  .btn{
    border:none; border-radius:12px; padding:12px 20px; font-weight:700; font-size:15px;
    background:var(--surface2); color:var(--ink); transition:transform .08s ease;
  }
  .btn:active{ transform:scale(.96); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.gold{ background:var(--gold); color:#1c2140; }
  .btn.good{ background:var(--good); color:#08321a; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); }
  .btn.small{ padding:7px 12px; font-size:13px; border-radius:9px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.block{ width:100%; }

  .card{
    background:var(--surface); border-radius:var(--radius); padding:20px;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  input[type=text], input[type=search]{
    background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; color:var(--ink); font-size:15px; width:100%;
  }
  label.field{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--muted); font-weight:600; }

  /* ---- landing ---- */
  .hero{ text-align:center; padding:38px 10px 26px; }
  .hero h1{ font-size:44px; margin:0 0 8px; }
  .hero p{ color:var(--muted); font-size:16px; max-width:480px; margin:0 auto; }
  .landing-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:22px; }
  @media (max-width:720px){ .landing-grid{ grid-template-columns:1fr; } .hero h1{ font-size:32px; } }
  .landing-grid h3{ margin:0 0 12px; font-size:18px; }
  .room-browse-item{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px;
    background:var(--surface2); margin-bottom:8px;
  }
  .room-browse-item .rname{ font-weight:700; flex:1; }
  .room-browse-item .rcount{ font-size:12px; color:var(--muted); }
  .empty-note{ color:var(--muted); font-size:14px; padding:10px 2px; }

  /* ---- lobby ---- */
  .lobby-grid{ display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
  @media (max-width:820px){ .lobby-grid{ grid-template-columns:1fr; } }
  .room-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .room-head h2{ margin:0; font-size:24px; }
  .code-pill{ background:var(--surface2); padding:4px 10px; border-radius:999px; font-size:13px; font-weight:700; letter-spacing:.06em; }
  .player-row{ display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:10px; }
  .player-row:hover{ background:var(--surface2); }
  .player-row .pname{ flex:1; font-weight:600; font-size:14px; }
  .player-row .avatar{ font-size:18px; }
  .player-row .tools{ display:flex; gap:4px; }
  .tag{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:6px; background:var(--surface2); color:var(--muted); }
  .tag.you{ background:var(--gold); color:#1c2140; }
  .tag.timeout{ background:var(--accent); color:var(--accent-ink); }

  .chat-box{ display:flex; flex-direction:column; height:280px; }
  .chat-log{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:4px 2px; }
  .chat-msg{ font-size:13.5px; line-height:1.4; }
  .chat-msg .who{ font-weight:700; margin-right:4px; }
  .chat-msg.system{ color:var(--muted); font-style:italic; }
  .chat-input{ display:flex; gap:8px; margin-top:10px; }
  .chat-input input{ flex:1; }

  .game-pick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .game-pick{
    background:var(--surface2); border-radius:14px; padding:16px 12px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:6px; border:2px solid transparent;
  }
  .game-pick .emoji{ font-size:32px; }
  .game-pick .name{ font-weight:700; font-size:14px; }
  .game-pick.active{ border-color:var(--accent); }

  section.panel{ margin-bottom:18px; }
  section.panel h3{ margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }

  .readonly-banner{ background:var(--surface2); border:1px dashed var(--muted); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--muted); margin-bottom:16px; }

  /* ---- games common ---- */
  .stage{ min-height:360px; }
  .stage-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .stage-head h2{ margin:0; font-size:22px; }
  .turn-banner{ text-align:center; font-weight:700; padding:10px; border-radius:12px; background:var(--surface2); margin-bottom:14px; }
  .spectator-note{ text-align:center; color:var(--muted); font-size:13px; margin-bottom:10px; }

  /* tic tac toe */
  .ttt-board{ display:grid; grid-template-columns:repeat(3,84px); grid-template-rows:repeat(3,84px); gap:8px; justify-content:center; margin:18px auto; }
  .ttt-cell{ background:var(--surface2); border-radius:14px; font-size:40px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .ttt-cell.playable:hover{ background:var(--gold); cursor:pointer; }
  .ttt-cell.x{ color:var(--accent); } .ttt-cell.o{ color:var(--info); }

  /* spam */
  .spam-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-top:12px; }
  .spam-card{ text-align:center; padding:16px 10px; border-radius:16px; background:var(--surface2); }
  .spam-card .clicks{ font-size:34px; font-weight:800; }
  .spam-btn{
    width:120px; height:120px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    font-size:16px; font-weight:800; border:none; margin:10px auto 0; display:block;
    box-shadow:0 8px 0 #b83a4c; user-select:none;
  }
  .spam-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #b83a4c; }
  .spam-timer{ font-size:30px; font-weight:800; text-align:center; margin-bottom:6px; }

  /* guess who */
  .gw-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 16px; }
  @media (max-width:600px){ .gw-grid{ grid-template-columns:repeat(3,1fr); } }
  .gw-card{ background:var(--surface2); border-radius:12px; padding:10px 4px; text-align:center; font-size:26px; position:relative; }
  .gw-card .nm{ font-size:11px; font-weight:700; color:var(--muted); margin-top:2px; }
  .gw-card.flipped{ opacity:.25; }
  .gw-card.flipped::after{ content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--accent); }
  .gw-log{ max-height:150px; overflow-y:auto; background:var(--surface2); border-radius:12px; padding:10px 12px; font-size:13px; display:flex; flex-direction:column; gap:4px; }
  .gw-controls{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .gw-controls select{ flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px; color:var(--ink); min-width:180px;}

  /* flappy */
  .flappy-track{ position:relative; height:380px; background:linear-gradient(#8fd3ff,#c8ecff); border-radius:16px; overflow:hidden; }
  :root[data-theme="dark"] .flappy-track, @media (prefers-color-scheme:dark){ }
  .flappy-lane{ position:absolute; top:0; bottom:0; width:60px; border-right:1px dashed rgba(255,255,255,.4); }
  .flappy-bird{ position:absolute; width:30px; height:24px; border-radius:50% 50% 50% 10%; display:flex; align-items:center; justify-content:center; font-size:16px; transition:top .16s linear; }
  .flappy-pipe{ position:absolute; width:44px; background:#5cb85c; border:3px solid #3d8b3d; border-radius:6px; }
  .flappy-name{ position:absolute; top:-18px; font-size:10px; font-weight:700; white-space:nowrap; left:50%; transform:translateX(-50%); }
  .flappy-scoreboard{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .flappy-score-chip{ background:var(--surface2); border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; }
  .flappy-crashed{ opacity:.35; filter:grayscale(1); }
  .flappy-waiting-list{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }

  /* cups */
  .cups-stage{ height:130px; position:relative; width:320px; margin:20px auto; }
  .cup{ position:absolute; bottom:0; width:80px; height:100px; transition:left .42s cubic-bezier(.4,0,.2,1); font-size:0; }
  .cup .cup-shape{ width:100%; height:100%; background:linear-gradient(#e2725b,#b6543e); border-radius:8px 8px 26px 26px; box-shadow:inset 0 -8px 14px rgba(0,0,0,.25); }
  .cup.revealed .cup-shape{ transform:translateY(-70px); }
  .cup .ball{ position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 60%,#c98a1f); opacity:0; }
  .cup.revealed.hasball .ball{ opacity:1; }
  .cup.clickable{ cursor:pointer; }
  .cup.clickable:hover .cup-shape{ filter:brightness(1.08); }
  .cups-scoreboard{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }

  .friends-list{ display:flex; flex-direction:column; gap:6px; }
  .friend-row{ display:flex; align-items:center; gap:8px; font-size:14px; padding:6px; border-radius:8px; background:var(--surface2); }
  .friend-row .status{ width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .friend-row .status.online{ background:var(--good); }
  .friend-add{ display:flex; gap:8px; margin-top:8px; }

  .toast-wrap{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:40; padding:20px; }
  .modal-backdrop:not([hidden]){ display:flex; }
  .modal{ background:var(--surface); border-radius:18px; padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow); }
  .modal h3{ margin-top:0; }
  .link-box{ background:var(--surface2); border-radius:10px; padding:10px; font-size:13px; word-break:break-all; margin:12px 0; }

  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }

  /* ---- achievements ---- */
  .ach-modal{ max-width:640px; max-height:82vh; display:flex; flex-direction:column; padding:0; overflow:hidden; }
  .ach-head{ padding:20px 22px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  .ach-head h3{ margin:0; font-size:20px; }
  .ach-head .ach-total{ color:var(--muted); font-size:13px; }
  .ach-head .btn{ margin-left:auto; }
  .ach-overall-bar{ height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; margin-top:8px; }
  .ach-overall-bar > div{ height:100%; background:var(--gold); }
  .ach-body{ overflow-y:auto; padding:8px 22px 22px; }
  .ach-cat{ margin-top:18px; }
  .ach-cat h4{ margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .ach-cat h4 .n{ font-weight:400; }
  .ach-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .ach-item{ background:var(--surface2); border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:flex-start; }
  .ach-item.locked{ opacity:.5; }
  .ach-item .icon{ font-size:22px; line-height:1; }
  .ach-item .txt{ flex:1; min-width:0; }
  .ach-item .nm{ font-weight:700; font-size:13px; }
  .ach-item .ds{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .ach-item .bar{ height:5px; border-radius:999px; background:var(--surface); overflow:hidden; margin-top:6px; }
  .ach-item .bar > div{ height:100%; background:var(--info); }
</style>

<div id="topbar">
  <div class="logo disp">🕹️ <b>Party Line</b></div>
  <div class="spacer"></div>
  <artifact-local id="topbar-local">
    <div id="identity-chip-slot"></div>
    <button class="iconbtn" id="achievements-toggle" data-action="open-achievements" title="Achievements">🏆</button>
    <button class="iconbtn" id="sound-toggle" title="Toggle sound">🔊</button>
  </artifact-local>
</div>

<div id="local-root"><artifact-local id="local-mount"></artifact-local></div>
<artifact-local id="achievements-mount"></artifact-local>
<div class="toast-wrap" id="toast-wrap"></div>

<!-- ============ SHARED DATA STORE (synced to every viewer) ============ -->
<div id="data-store">
  <div id="rooms-directory"></div>
  <div id="social">
    <div class="known-list"></div>
    <div class="freq-list"></div>
    <div class="friendship-list"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== constants ============================== */
var TIMEOUT_MS = 60000;
var PLAYER_COLORS = ["#2fbf71","#4f7dff","#b98cff","#45d6c0","#ff8ac1","#ffd166","#ff9f45","#6bd1ff"];
var GAMES = [
  {type:"tictactoe", name:"Tic Tac Toe", emoji:"⭕"},
  {type:"spam", name:"Spam Button", emoji:"🔴"},
  {type:"guesswho", name:"Guess Who", emoji:"🕵️"},
  {type:"flappy", name:"Flappy Race", emoji:"🐦"},
  {type:"cups", name:"Cup Shuffle", emoji:"🥤"}
];
var CHARACTERS = [
  {id:"c1",emoji:"👧",name:"Mia",  hat:false,glasses:false,smiling:true, curly:true, beard:false},
  {id:"c2",emoji:"👦",name:"Leo",  hat:true, glasses:false,smiling:true, curly:false,beard:false},
  {id:"c3",emoji:"👩",name:"Ana",  hat:false,glasses:true, smiling:false,curly:true, beard:false},
  {id:"c4",emoji:"👨",name:"Sam",  hat:false,glasses:false,smiling:false,curly:false,beard:true},
  {id:"c5",emoji:"👵",name:"Rosa", hat:true, glasses:true, smiling:true, curly:false,beard:false},
  {id:"c6",emoji:"👴",name:"Gus",  hat:false,glasses:true, smiling:false,curly:false,beard:true},
  {id:"c7",emoji:"🧑‍🦱",name:"Kai", hat:false,glasses:false,smiling:true, curly:true, beard:false},
  {id:"c8",emoji:"🧑‍🦰",name:"Rey", hat:false,glasses:false,smiling:false,curly:false,beard:false},
  {id:"c9",emoji:"👱‍♀️",name:"Elle",hat:true, glasses:false,smiling:true, curly:false,beard:false},
  {id:"c10",emoji:"👱‍♂️",name:"Finn",hat:false,glasses:true, smiling:true, curly:false,beard:false},
  {id:"c11",emoji:"🧔",name:"Theo",hat:false,glasses:false,smiling:false,curly:true, beard:true},
  {id:"c12",emoji:"👩‍🦳",name:"Nan", hat:true, glasses:true, smiling:false,curly:true, beard:false}
];
var GW_QUESTIONS = [
  {attr:"hat", text:"Are they wearing a hat?"},
  {attr:"glasses", text:"Do they wear glasses?"},
  {attr:"smiling", text:"Are they smiling?"},
  {attr:"curly", text:"Do they have curly hair?"},
  {attr:"beard", text:"Do they have a beard?"}
];

/* ============================== achievements ============================== */
var MEDALS = ["🔰","🥉","🥈","🥇","🏅","💎","🌟","👑","🏆"];
var TIER9 = ["Rookie","Bronze","Silver","Gold","Platinum","Diamond","Master","Champion","Legend"];
var TIER5 = ["Rookie","Bronze","Silver","Gold","Legend"];
var THRESH_COUNT9   = [1,3,5,10,20,35,50,75,100];
var THRESH_STREAK9  = [2,3,4,5,6,8,10,15,20];
var THRESH_CLICKSB9 = [5,10,15,20,30,40,55,70,90];
var THRESH_CLICKST9 = [25,75,150,300,600,1000,1750,3000,5000];
var THRESH_QUEST9   = [1,5,10,20,35,50,75,100,150];
var THRESH_SCORE9   = [1,3,5,10,15,20,30,45,60];
var THRESH_FLAPS9   = [10,30,60,120,250,450,750,1200,2000];
var THRESH_COUNT5   = [1,3,5,10,20];

function tierAchievements(idPrefix, category, label, verbTemplate, statKey, thresholds){
  return thresholds.map(function(n, i){
    return {
      id: idPrefix+"_"+i,
      icon: MEDALS[i],
      name: TIER9[i]+" "+label,
      desc: verbTemplate.replace("{n}", n),
      statKey: statKey,
      threshold: n,
      category: category
    };
  });
}
function tierAchievements5(idPrefix, category, label, verbTemplate, statKey, thresholds){
  return thresholds.map(function(n, i){
    return {
      id: idPrefix+"_"+i,
      icon: MEDALS[i+2],
      name: TIER5[i]+" "+label,
      desc: verbTemplate.replace("{n}", n),
      statKey: statKey,
      threshold: n,
      category: category
    };
  });
}

var ACHIEVEMENTS = [].concat(
  tierAchievements5("gen_rooms","General","Host","Create {n} room(s).","roomsCreated",THRESH_COUNT5),
  tierAchievements5("gen_joins","General","Guest","Join {n} room(s).","roomsJoined",THRESH_COUNT5),
  tierAchievements5("gen_chat","General","Chatterbox","Send {n} chat message(s).","chatSent",THRESH_COUNT5),
  [
    {id:"gen_friend1", icon:"🤗", name:"Making Friends", desc:"Add your first friend.", statKey:"friendsAdded", threshold:1, category:"General"},
    {id:"gen_invite1", icon:"📨", name:"Party Starter", desc:"Send your first invite link.", statKey:"invitesSent", threshold:1, category:"General"},
    {id:"gen_mod1", icon:"🛡️", name:"Trusted", desc:"Get promoted to moderator by a room host.", statKey:"becameMod", threshold:1, category:"General"},
    {id:"gen_five", icon:"🎯", name:"Five For Five", desc:"Play all 5 Party Line games at least once.", statKey:"gamesPlayedCount", threshold:5, category:"General"},
    {id:"gen_timeout1", icon:"🧊", name:"Cool Down", desc:"Get timed out once. It happens to everyone!", statKey:"timedOutCount", threshold:1, category:"General"}
  ],

/* per-room transition cache so multi-player outcomes (win/loss/draw) are counted once
   on every participant's own client, even though only one client's click caused them */
var statsPrevCache = {};
function checkStatsTransitions(room, game, type){
  var roomId = room.getAttribute("data-id");
  var key = roomId+":"+type;
  var prev = statsPrevCache[key] || {};

  if(type === "tictactoe"){
    var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2");
    var winner = game.getAttribute("data-winner");
    if(winner && winner !== prev.winner && (myId===p1||myId===p2)){
      bumpStat("tttPlayed",1);
      if(winner===myId){ stats.tttWinStreak=(stats.tttWinStreak||0)+1; setMaxStat("tttBestWinStreak", stats.tttWinStreak); bumpStat("tttWins",1); }
      else if(winner==="draw"){ stats.tttWinStreak=0; saveStats(); bumpStat("tttDraws",1); }
      else { stats.tttWinStreak=0; saveStats(); }
    }
    prev.winner = winner;
  } else if(type === "spam"){
    var status = game.getAttribute("data-status");
    if(status==="ended" && prev.status==="active"){
      var entry = game.querySelector('.spam-entry[data-id="'+myId+'"]');
      if(entry){
        bumpStat("spamRounds",1);
        var myClicks = parseInt(entry.getAttribute("data-clicks")||"0",10);
        setMaxStat("spamBestRound", myClicks);
        var all = Array.prototype.slice.call(game.querySelectorAll(".spam-entry"));
        var top = all.reduce(function(a,b){ return parseInt(a.getAttribute("data-clicks"))>=parseInt(b.getAttribute("data-clicks"))?a:b; }, all[0]);
        if(top && top.getAttribute("data-id")===myId) bumpStat("spamWins",1);
      }
    }
    prev.status = status;
  } else if(type === "guesswho"){
    var gp1=game.getAttribute("data-p1"), gp2=game.getAttribute("data-p2");
    var gwWinner = game.getAttribute("data-winner");
    if(gwWinner && gwWinner !== prev.winner && (myId===gp1||myId===gp2)){
      bumpStat("gwPlayed",1);
      if(gwWinner===myId){ stats.gwWinStreak=(stats.gwWinStreak||0)+1; setMaxStat("gwBestWinStreak", stats.gwWinStreak); bumpStat("gwWins",1); }
      else { stats.gwWinStreak=0; saveStats(); }
    }
    prev.winner = gwWinner;
  } else if(type === "flappy"){
    var fstatus = game.getAttribute("data-status");
    if(fstatus==="ended" && prev.status==="active"){
      var order = (room.getAttribute("data-ready-order")||"").split(",").filter(Boolean);
      if(order.indexOf(myId)!==-1){
        var myBird = game.querySelector('.flappy-bird-store[data-id="'+myId+'"]');
        if(myBird){
          bumpStat("flappyPlayed",1);
          setMaxStat("flappyBestScore", parseInt(myBird.getAttribute("data-score")||"0",10));
          var birds = Array.prototype.slice.call(game.querySelectorAll(".flappy-bird-store"));
          var ftop = birds.reduce(function(a,b){ return parseInt(a.getAttribute("data-score"))>=parseInt(b.getAttribute("data-score"))?a:b; }, birds[0]);
          if(ftop && ftop.getAttribute("data-id")===myId) bumpStat("flappyWins",1);
        }
      }
    }
    prev.status = fstatus;
  }
  statsPrevCache[key] = prev;
}
function checkPersonalTransitions(room){
  var roomId = room.getAttribute("data-id");
  var key = roomId+":personal";
  var prev = statsPrevCache[key] || {};
  var role = roleOf(room, myId);
  if(role === "mod" && !stats.becameMod){ bumpStat("becameMod",1); }
  var p = me(room);
  var timedOut = isTimedOut(p);
  if(timedOut && !prev.timedOut){ bumpStat("timedOutCount",1); }
  prev.timedOut = timedOut;
  statsPrevCache[key] = prev;
}

/* ============================== artifact capability ============================== */
var artifactAPI = null;
var artifactReady = (function(){
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  return window.claude.use("artifact").then(function(a){ artifactAPI = a; return a; }).catch(function(){ return null; });
})();

var commitChain = Promise.resolve();
var backoff = 0;
function commit(mutator){
  commitChain = commitChain.then(function(){
    return doCommit(mutator);
  });
  return commitChain;
}
function doCommit(mutator){
  if(artifactAPI){
    return artifactAPI.sync(mutator).then(function(){
      backoff = 0;
      render();
    }).catch(function(err){
      var code = err && err.code;
      if(code === "not_writer" || code === "not_granted" || code === "consent_required"){
        readOnly = true;
        render();
      } else if(code === "rate_limited"){
        backoff = Math.min((backoff||150)*2, 4000);
        render();
      } else if(code === "conflict"){
        /* runtime is already reloading this view to the winning version */
      } else {
        try{ mutator(); }catch(e){}
        render();
      }
    });
  } else {
    try{ mutator(); }catch(e){}
    render();
    return Promise.resolve();
  }
}

var audio = (function(){
  var ctx = null, enabled = localStorage.getItem("pl_sound") !== "off", musicOn = false, musicTimer = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function tone(freq, dur, type, gain, delay){
    if(!enabled) return; var c = ac(); if(!c) return;
    var t0 = c.currentTime + (delay||0);
    var osc = c.createOscillator(); var g = c.createGain();
    osc.type = type||"sine"; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain||0.14, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  var sfx = {
    click: function(){ tone(520,0.08,"square",0.1); },
    flap: function(){ tone(700,0.09,"sine",0.13); },
    pop: function(){ tone(380,0.12,"triangle",0.15); },
    success: function(){ tone(523,0.12,"sine",0.15); tone(659,0.12,"sine",0.15,0.09); tone(784,0.18,"sine",0.15,0.18); },
    fail: function(){ tone(220,0.25,"sawtooth",0.12); tone(160,0.3,"sawtooth",0.12,0.08); },
    notify: function(){ tone(880,0.08,"sine",0.12); tone(1108,0.1,"sine",0.12,0.09); },
    win: function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,0.22,"sine",0.16,i*0.11); }); },
    tick: function(){ tone(1200,0.03,"square",0.05); }
  };
  function startMusic(){
    if(musicOn) return; musicOn = true;
    var scale = [261.6,293.7,329.6,392.0,440.0,523.3];
    var i = 0;
    function loop(){
      if(!musicOn) return;
      if(enabled){ tone(scale[i%scale.length], 1.1, "sine", 0.045); tone(scale[(i+2)%scale.length]/2, 1.6, "sine", 0.03, 0.2); }
      i++;
      musicTimer = setTimeout(loop, 950);
    }
    loop();
  }
  function stopMusic(){ musicOn = false; if(musicTimer) clearTimeout(musicTimer); }
  return {
    sfx: sfx,
    isEnabled: function(){ return enabled; },
    toggle: function(){
      enabled = !enabled;
      localStorage.setItem("pl_sound", enabled ? "on" : "off");
      if(enabled) startMusic(); else stopMusic();
      return enabled;
    },
    initFromPref: function(){ if(enabled) startMusic(); }
  };
})();
document.getElementById("sound-toggle").addEventListener("click", function(){
  var on = audio.toggle();
  this.textContent = on ? "🔊" : "🔇";
});

/* ============================== seeded rng ============================== */
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h>>>0; }

/* ============================== escaping ============================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* strip emoji/unicode/special characters from anything a player TYPES (names, chat, room names) — keep plain printable ASCII only */
function sanitizeText(s){ return String(s==null?"":s).replace(/[^ -~]/g, "").replace(/\s+/g," ").trim(); }

function mkRoomCode(){
  var letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var s = "";
  for(var i=0;i<4;i++) s += letters[Math.floor(Math.random()*letters.length)];
  return s;
}

function createRoom(roomName){
  roomName = sanitizeText(roomName).slice(0,24);
  var code = mkRoomCode();
  while(findRoom(code)) code = mkRoomCode();
  return commit(function(){
    var room = document.createElement("div");
    room.className = "room";
    room.setAttribute("data-id", code);
    room.setAttribute("data-name", roomName || "Game Night");
    room.setAttribute("data-created", String(Date.now()));
    room.setAttribute("data-game-type", "");
    room.setAttribute("data-ready-order", "");

    var players = document.createElement("div"); players.className = "players";
    room.appendChild(players);
    var chat = document.createElement("div"); chat.className = "chat";
    room.appendChild(chat);
    var game = document.createElement("div"); game.className = "game";
    room.appendChild(game);

    store().appendChild(room);

    var p = document.createElement("div");
    p.className = "player";
    p.setAttribute("data-id", myId);
    p.setAttribute("data-name", myName);
    p.setAttribute("data-avatar", myAvatar);
    p.setAttribute("data-role", "admin");
    p.setAttribute("data-timeout-until", "0");
    p.setAttribute("data-online-at", String(Date.now()));
    players.appendChild(p);

    var sys = document.createElement("div"); sys.className = "msg system";
    sys.setAttribute("data-time", String(Date.now()));
    sys.textContent = myName + " created the room.";
    chat.appendChild(sys);
  }).then(function(){
    nav.screen = "lobby"; nav.roomId = code;
    audio.sfx.success();
    bumpStat("roomsCreated",1);
    render();
  }).then(function(){ return code; });
}

function joinRoom(code){
  code = sanitizeText(code).replace(/[^A-Za-z]/g,"").toUpperCase();
  var room = findRoom(code);
  if(!room){ toast("No room with code " + code); return Promise.resolve(false); }
  var already = findPlayer(room, myId);
  if(already){
    nav.screen = "lobby"; nav.roomId = code; render();
    return Promise.resolve(true);
  }
  return commit(function(){
    var players = room.querySelector(".players");
    var p = document.createElement("div");
    p.className = "player";
    p.setAttribute("data-id", myId);
    p.setAttribute("data-name", myName);
    p.setAttribute("data-avatar", myAvatar);
    p.setAttribute("data-role", "player");
    p.setAttribute("data-timeout-until", "0");
    p.setAttribute("data-online-at", String(Date.now()));
    players.appendChild(p);
    var chat = room.querySelector(".chat");
    var sys = document.createElement("div"); sys.className = "msg system";
    sys.setAttribute("data-time", String(Date.now()));
    sys.textContent = myName + " joined the room.";
    chat.appendChild(sys);
  }).then(function(){
    nav.screen = "lobby"; nav.roomId = code;
    audio.sfx.notify();
    bumpStat("roomsJoined",1);
    render();
    return true;
  });
}

function leaveRoom(){
  var room = findRoom(nav.roomId);
  nav.screen = "landing"; nav.roomId = null;
  render();
  if(!room) return;
  commit(function(){
    var chat = room.querySelector(".chat");
    if(chat){
      var sys = document.createElement("div"); sys.className = "msg system";
      sys.setAttribute("data-time", String(Date.now()));
      sys.textContent = myName + " left the room.";
      chat.appendChild(sys);

    var p = findPlayer(room, myId);
    if(p) p.remove();

}

  nav.screen = "landing"; nav.roomId = null;

}

function sendChat(text){

/* ================= TIC TAC TOE ================= */
var TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(cells){
  for(var i=0;i<TTT_LINES.length;i++){
    var l = TTT_LINES[i], a=cells[l[0]],b=cells[l[1]],c=cells[l[2]];
    if(a && a===b && b===c) return a;
  }
  if(cells.every(function(x){return x;})) return "draw";
  return "";
}
function tttJoin(room, game){
  var p1 = game.getAttribute("data-p1"), p2 = game.getAttribute("data-p2");
  if(p1 === myId || p2 === myId) return;
  markPlayed("tictactoe");
  commit(function(){
    if(!game.getAttribute("data-p1")){ game.setAttribute("data-p1", myId); game.setAttribute("data-turn", myId); }
    else if(!game.getAttribute("data-p2")){ game.setAttribute("data-p2", myId); }
  });
}
function tttMove(room, game, idx){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2"), turn=game.getAttribute("data-turn");
  if(turn !== myId) return;
  var cell = game.querySelector('.cell[data-idx="'+idx+'"]');
  if(!cell || cell.getAttribute("data-mark")) return;
  var mark = (myId === p1) ? "X" : "O";
  audio.sfx.pop();
  commit(function(){
    cell.setAttribute("data-mark", mark);
    var cells = [];
    for(var i=0;i<9;i++) cells.push(game.querySelector('.cell[data-idx="'+i+'"]').getAttribute("data-mark"));
    var w = tttWinner(cells);
    if(w){
      game.setAttribute("data-winner", w);
      game.setAttribute("data-turn","");
    } else {
      game.setAttribute("data-turn", turn === p1 ? p2 : p1);
    }
  }).then(function(){
    var w = game.getAttribute("data-winner");
    if(w === myId) audio.sfx.win(); else if(w && w!=="draw") audio.sfx.fail();
  });
}
function tttReset(room, game){
  commit(function(){
    for(var i=0;i<9;i++) game.querySelector('.cell[data-idx="'+i+'"]').setAttribute("data-mark","");
    game.setAttribute("data-winner","");
    game.setAttribute("data-turn", game.getAttribute("data-p1"));
  });
}

/* ================= SPAM BUTTON ================= */
var spamPending = {}; // local optimistic click buffer per room
function spamStart(room, game){
  audio.sfx.click();
  commit(function(){
    var players = roomPlayers(room);
    // rebuild entries
    Array.prototype.slice.call(game.querySelectorAll(".spam-entry")).forEach(function(e){ e.remove(); });
    players.forEach(function(p){
      if(isTimedOut(p)) return;
      var e = document.createElement("div");
      e.className = "spam-entry";
      e.setAttribute("data-id", p.getAttribute("data-id"));
      e.setAttribute("data-clicks","0");
      game.appendChild(e);
    });
    game.setAttribute("data-status","active");
    game.setAttribute("data-duration","10000");
    game.setAttribute("data-ends-at", String(Date.now()+10000));
  });
}
function spamClick(room, game){
  if(game.getAttribute("data-status") !== "active") return;
  var entry = game.querySelector('.spam-entry[data-id="'+myId+'"]');
  if(!entry) return;
  audio.sfx.tick();
  markPlayed("spam");
  bumpStat("spamTotalClicks",1);
  var key = nav.roomId;
  spamPending[key] = (spamPending[key]||0) + 1;
  renderLocalSpamCount();
  if(!spamPending._flushTimer_ || !spamPending._flushTimer_[key]){
    spamPending._flushTimer_ = spamPending._flushTimer_ || {};
    spamPending._flushTimer_[key] = setTimeout(function(){
      flushSpam(room, game, key);
    }, 180);
  }
}
function flushSpam(room, game, key){
  spamPending._flushTimer_[key] = null;
  var pend = spamPending[key] || 0;
  spamPending[key] = 0;
  if(pend <= 0) return;
  var entry = game.querySelector('.spam-entry[data-id="'+myId+'"]');
  if(!entry) return;
  commit(function(){
    var cur = parseInt(entry.getAttribute("data-clicks")||"0",10);
    entry.setAttribute("data-clicks", String(cur+pend));
  });
}
function renderLocalSpamCount(){
  var el = document.querySelector('.spam-card[data-id="'+myId+'"] .clicks');
  if(!el) return;
  var base = parseInt(el.getAttribute("data-base")||"0",10);
  var pend = spamPending[nav.roomId]||0;
  el.textContent = base + pend;
}
function spamCheckEnd(room, game){
  if(game.getAttribute("data-status") !== "active") return;
  var endsAt = parseInt(game.getAttribute("data-ends-at")||"0",10);
  var isAdmin = roleOf(room, myId) === "admin";
  if(Date.now() >= endsAt && isAdmin){
    var key = nav.roomId;
    if(spamPending[key]) flushSpam(room, game, key);
    commit(function(){
      if(game.getAttribute("data-status")==="active") game.setAttribute("data-status","ended");
    }).then(function(){ audio.sfx.win(); });
  }
}

/* ================= GUESS WHO ================= */
function gwJoin(room, game){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2");
  if(p1===myId||p2===myId) return;
  markPlayed("guesswho");
  commit(function(){
    if(!game.getAttribute("data-p1")){ game.setAttribute("data-p1", myId); }
    else if(!game.getAttribute("data-p2")){
      game.setAttribute("data-p2", myId);
      var c1 = CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)];
      var c2 = CHARACTERS[Math.floor(Math.random()*CHARACTERS.length)];
      game.setAttribute("data-secret1", c1.id);
      game.setAttribute("data-secret2", c2.id);
      game.setAttribute("data-turn", game.getAttribute("data-p1"));
      game.setAttribute("data-status","active");
    }
  });
}
function gwAsk(room, game, attr){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2"), turn=game.getAttribute("data-turn");
  if(turn !== myId || game.getAttribute("data-status")!=="active") return;
  var opponentSecret = (myId===p1) ? game.getAttribute("data-secret2") : game.getAttribute("data-secret1");
  var ch = CHARACTERS.filter(function(c){return c.id===opponentSecret;})[0];
  var q = GW_QUESTIONS.filter(function(x){return x.attr===attr;})[0];
  var answer = ch && ch[attr] ? "Yes" : "No";
  audio.sfx.click();
  bumpStat("gwQuestionsAsked",1);
  commit(function(){
    var log = game.querySelector(".gw-log-store");
    var e = document.createElement("div"); e.className="gw-entry";
    e.setAttribute("data-time", String(Date.now()));
    e.textContent = playerName(room,myId) + " asked: \"" + q.text + "\" — " + answer;
    log.appendChild(e);
    game.setAttribute("data-turn", myId===p1?p2:p1);
  });
}
function gwGuess(room, game, charId){
  var p1=game.getAttribute("data-p1"), p2=game.getAttribute("data-p2"), turn=game.getAttribute("data-turn");
  if(turn !== myId || game.getAttribute("data-status")!=="active") return;
  var opponentSecret = (myId===p1) ? game.getAttribute("data-secret2") : game.getAttribute("data-secret1");
  var correct = charId === opponentSecret;
  commit(function(){
    var log = game.querySelector(".gw-log-store");
    var e = document.createElement("div"); e.className="gw-entry";
    e.setAttribute("data-time", String(Date.now()));
    var chName = CHARACTERS.filter(function(c){return c.id===charId;})[0].name;
    if(correct){
      e.textContent = playerName(room,myId) + " guessed " + chName + " — correct! 🎉";
      game.setAttribute("data-winner", myId);
      game.setAttribute("data-status","ended");
    } else {
      e.textContent = playerName(room,myId) + " guessed " + chName + " — wrong!";
      game.setAttribute("data-turn", myId===p1?p2:p1);
    }
    log.appendChild(e);
  }).then(function(){ correct ? audio.sfx.win() : audio.sfx.fail(); });
}
function gwReset(room, game){
  commit(function(){
    game.setAttribute("data-p1",""); game.setAttribute("data-p2","");
    game.setAttribute("data-turn",""); game.setAttribute("data-secret1","");
    game.setAttribute("data-secret2",""); game.setAttribute("data-winner","");
    game.setAttribute("data-status","waiting");
    game.querySelector(".gw-log-store").innerHTML = "";
  });
}
var gwFlips = {}; // local-only elimination marks: gwFlips[roomId+charId] = true

/* ================= FLAPPY RACE ================= */
var flappyLocal = {}; // per-room local physics: {y, vy, flushAt}
function flappyReady(room, game){
  var order = room.getAttribute("data-ready-order")||"";
  var list = order ? order.split(",") : [];
  if(list.indexOf(myId) !== -1) return;
  markPlayed("flappy");
  commit(function(){
    var order2 = room.getAttribute("data-ready-order")||"";
    var list2 = order2 ? order2.split(",").filter(Boolean) : [];
    if(list2.indexOf(myId)===-1) list2.push(myId);
    room.setAttribute("data-ready-order", list2.join(","));
    var bird = game.querySelector('.flappy-bird-store[data-id="'+myId+'"]');
    if(!bird){
      bird = document.createElement("div");
      bird.className="flappy-bird-store";
      bird.setAttribute("data-id", myId);
      bird.setAttribute("data-y","150");
      bird.setAttribute("data-score","0");
      bird.setAttribute("data-alive","1");
      game.appendChild(bird);
    }
  });
}
function flappyStart(room, game){
  audio.sfx.click();
  commit(function(){
    game.setAttribute("data-status","active");
    game.setAttribute("data-started-at", String(Date.now()));
    game.setAttribute("data-seed", String(Math.floor(Math.random()*1e9)));
  });
}
function flappyFlap(room, game){
  var st = flappyLocal[nav.roomId];
  if(!st || !st.alive) return;
  st.vy = -6.2;
  audio.sfx.flap();
  bumpStat("flappyTotalFlaps",1);
  flushFlappy(room, game, true);
}
function pipeGapAt(seed, index){
  var rnd = mulberry32(seed + index*7919);
  return 70 + rnd()*180; // gap center Y within track
}
function flushFlappy(room, game, force){
  var st = flappyLocal[nav.roomId];
  if(!st) return;
  var nowT = Date.now();
  if(!force && st.lastFlush && nowT - st.lastFlush < 160) return;
  st.lastFlush = nowT;
  commit(function(){
    var bird = game.querySelector('.flappy-bird-store[data-id="'+myId+'"]');
    if(!bird) return;
    bird.setAttribute("data-y", String(Math.round(st.y)));
    bird.setAttribute("data-score", String(st.score));
    bird.setAttribute("data-alive", st.alive ? "1" : "0");
  });
}
function flappyTick(room, game){
  var status = game.getAttribute("data-status");
  if(status !== "active") return;
  var order = (room.getAttribute("data-ready-order")||"").split(",").filter(Boolean);
  var myIdx = order.indexOf(myId);
  if(myIdx === -1) return;
  var startedAt = parseInt(game.getAttribute("data-started-at")||"0",10);
  var myStart = startedAt + myIdx*1000;
  if(Date.now() < myStart) return; // not my turn to fly yet
  var seed = parseInt(game.getAttribute("data-seed")||"1",10);
  var st = flappyLocal[nav.roomId];
  if(!st){
    st = flappyLocal[nav.roomId] = { y:150, vy:0, alive:true, score:0, lastFlush:0, elapsedStart: Date.now() };
  }
  if(!st.alive) return;
  st.vy += 0.42;
  st.y += st.vy;
  var elapsed = Date.now() - myStart;
  var speed = 0.09; // px world-units per ms -> pipe index
  var pipeSpacing = 220;
  var worldX = elapsed * speed;
  var pipeIdx = Math.floor(worldX / pipeSpacing);
  var pipeLocalX = worldX - pipeIdx*pipeSpacing;
  st.score = pipeIdx;
  // collision: check pipe near x=40 (bird x)
  var birdX = 40;
  var gapCenter = pipeGapAt(seed, pipeIdx);
  var gapHalf = 55;
  var pipeScreenX = pipeSpacing - pipeLocalX;
  if(pipeScreenX > 10 && pipeScreenX < 70){
    if(st.y < gapCenter-gapHalf || st.y > gapCenter+gapHalf){
      st.alive = false;
    }
  }
  if(st.y > 340 || st.y < 0) st.alive = false;
  flushFlappy(room, game, !st.alive);
}
function flappyMaybeEnd(room, game){
  if(roleOf(room, myId) !== "admin") return;
  if(game.getAttribute("data-status") !== "active") return;
  var order = (room.getAttribute("data-ready-order")||"").split(",").filter(Boolean);
  if(!order.length) return;
  var startedAt = parseInt(game.getAttribute("data-started-at")||"0",10);
  var allDone = order.every(function(id, i){
    var myStart = startedAt + i*1000;
    if(Date.now() < myStart) return false;
    var bird = game.querySelector('.flappy-bird-store[data-id="'+id+'"]');
    return bird && bird.getAttribute("data-alive")==="0";
  });
  if(allDone){
    commit(function(){ if(game.getAttribute("data-status")==="active") game.setAttribute("data-status","ended"); })
      .then(function(){ audio.sfx.win(); });
  }
}
function flappyReset(room, game){
  commit(function(){
    Array.prototype.slice.call(game.querySelectorAll(".flappy-bird-store")).forEach(function(b){ b.remove(); });
    game.setAttribute("data-status","waiting");
    room.setAttribute("data-ready-order","");
  });
  delete flappyLocal[nav.roomId];
}

/* ================= CUP SHUFFLE ================= */
function cupsSwapSchedule(seed, count){
  var rnd = mulberry32(seed);
  var seq = [];
  for(var i=0;i<count;i++){
    var a = Math.floor(rnd()*3), b = Math.floor(rnd()*3);
    if(a===b) b = (b+1)%3;
    seq.push([a,b]);
  }
  return seq;
}
function cupsSlotOrderAt(seed, count, elapsedMs, stepMs){
  var seq = cupsSwapSchedule(seed, count);
  var steps = Math.min(count, Math.floor(elapsedMs/stepMs));
  var order = [0,1,2]; // order[slot] = cup index currently there
  for(var i=0;i<steps;i++){
    var s = seq[i];
    var tmp = order[s[0]]; order[s[0]] = order[s[1]]; order[s[1]] = tmp;
  }
  return { order: order, steps: steps, total: count };
}
function cupsStartTurn(room, game){
  var order = (game.getAttribute("data-order")||"").split(",").filter(Boolean);
  var current = game.getAttribute("data-current");
  if(current !== myId) return;
  audio.sfx.click();
  bumpStat("cupsShufflesStarted",1);
  commit(function(){
    game.setAttribute("data-ball-cup", String(Math.floor(Math.random()*3)));
    game.setAttribute("data-shuffle-seed", String(Math.floor(Math.random()*1e9)));
    game.setAttribute("data-shuffle-started-at", String(Date.now()));
    game.setAttribute("data-status","shuffling");
    game.setAttribute("data-revealed","0");
  });
}
function cupsJoinRotation(room, game){
  var order = (game.getAttribute("data-order")||"").split(",").filter(Boolean);
  if(order.indexOf(myId)!==-1) return;
  markPlayed("cups");
  commit(function(){
    var o2 = (game.getAttribute("data-order")||"").split(",").filter(Boolean);
    if(o2.indexOf(myId)===-1) o2.push(myId);
    game.setAttribute("data-order", o2.join(","));
    if(!game.getAttribute("data-current")) game.setAttribute("data-current", myId);
    var sc = game.querySelector('.cup-score[data-id="'+myId+'"]');
    if(!sc){
      sc = document.createElement("div"); sc.className="cup-score";
      sc.setAttribute("data-id", myId); sc.setAttribute("data-score","0");
      game.appendChild(sc);
    }
  });
}
function cupsGuess(room, game, slot){
  if(game.getAttribute("data-current") !== myId) return;
  if(game.getAttribute("data-status") !== "guessing") return;
  var seed = parseInt(game.getAttribute("data-shuffle-seed")||"0",10);
  var swaps = parseInt(game.getAttribute("data-swaps")||"7",10);
  var ballCup = parseInt(game.getAttribute("data-ball-cup")||"0",10);
  var finalOrder = cupsSlotOrderAt(seed, swaps, 999999, 1).order; // fully applied
  var ballSlot = finalOrder.indexOf(ballCup);
  var correct = slot === ballSlot;
  bumpStat("cupsPlayed",1);
  if(correct){ stats.cupsWinStreak=(stats.cupsWinStreak||0)+1; setMaxStat("cupsBestWinStreak", stats.cupsWinStreak); bumpStat("cupsWins",1); }
  else { stats.cupsWinStreak=0; saveStats(); }
  commit(function(){
    game.setAttribute("data-revealed","1");
    game.setAttribute("data-guessed-slot", String(slot));
    game.setAttribute("data-correct", correct ? "1":"0");
    if(correct){
      var sc = game.querySelector('.cup-score[data-id="'+myId+'"]');
      if(sc) sc.setAttribute("data-score", String(parseInt(sc.getAttribute("data-score")||"0",10)+1));
    }
    game.setAttribute("data-status","revealed");
  }).then(function(){ correct ? audio.sfx.success() : audio.sfx.fail(); });
}
function cupsNextTurn(room, game){
  var order = (game.getAttribute("data-order")||"").split(",").filter(Boolean);
  var current = game.getAttribute("data-current");
  var idx = order.indexOf(current);
  var next = order[(idx+1)%order.length] || current;
  commit(function(){
    game.setAttribute("data-current", next);
    game.setAttribute("data-status","idle");
    game.setAttribute("data-revealed","0");
  });
}
function cupsAdvanceIfDone(room, game){
  var seed = parseInt(game.getAttribute("data-shuffle-seed")||"0",10);
  var startedAt = parseInt(game.getAttribute("data-shuffle-started-at")||"0",10);
  var swaps = parseInt(game.getAttribute("data-swaps")||"7",10);
  if(game.getAttribute("data-status")==="shuffling"){
    var elapsed = Date.now()-startedAt;
    if(elapsed > swaps*450+150 && game.getAttribute("data-current")===myId){
      commit(function(){ if(game.getAttribute("data-status")==="shuffling") game.setAttribute("data-status","guessing"); });
    }
  }
}

/* ============================== friends (real, mutual — lives in the shared store) ============================== */
function social(){ return document.getElementById("social"); }
function knownList(){ return social().querySelector(".known-list"); }
function freqList(){ return social().querySelector(".freq-list"); }
function friendshipList(){ return social().querySelector(".friendship-list"); }
function findKnown(id){ return knownList().querySelector('.known[data-id="'+cssesc(id)+'"]'); }
function knownName(id){ var k = findKnown(id); return k ? k.getAttribute("data-name") : "(unknown)"; }
function knownAvatar(id){ var k = findKnown(id); return k ? k.getAttribute("data-avatar") : "❔"; }
function knownOnline(id){ var k = findKnown(id); if(!k) return false; return Date.now() - parseInt(k.getAttribute("data-last-seen")||"0",10) < 40000; }

function registerKnown(){
  if(!myName) return;
  commit(function(){
    var k = findKnown(myId);
    if(!k){
      k = document.createElement("div"); k.className="known"; k.setAttribute("data-id", myId);
      knownList().appendChild(k);
    }
    k.setAttribute("data-name", myName);
    k.setAttribute("data-avatar", myAvatar);
    k.setAttribute("data-last-seen", String(Date.now()));
  });
}

function myFriendships(){
  return Array.prototype.slice.call(friendshipList().querySelectorAll(".friendship")).filter(function(f){
    return f.getAttribute("data-a")===myId || f.getAttribute("data-b")===myId;
  });
}
function friendOtherId(f){ return f.getAttribute("data-a")===myId ? f.getAttribute("data-b") : f.getAttribute("data-a"); }
function areFriends(otherId){
  return myFriendships().some(function(f){ return friendOtherId(f)===otherId; });
}
function myIncomingRequests(){
  return Array.prototype.slice.call(freqList().querySelectorAll('.freq[data-status="pending"]')).filter(function(r){ return r.getAttribute("data-to")===myId; });
}
function myOutgoingRequests(){
  return Array.prototype.slice.call(freqList().querySelectorAll('.freq[data-status="pending"]')).filter(function(r){ return r.getAttribute("data-from")===myId; });
}

function sendFriendRequestByName(name){
  name = sanitizeText(name);
  if(!name) return;
  if(name.toLowerCase() === myName.toLowerCase()){ toast("That's you!"); return; }
  var candidates = Array.prototype.slice.call(knownList().querySelectorAll(".known")).filter(function(k){
    return k.getAttribute("data-name").toLowerCase() === name.toLowerCase() && k.getAttribute("data-id") !== myId;
  });
  if(!candidates.length){ toast("No one named \""+name+"\" has opened Party Line yet. Ask them to join a room first, then try again."); return; }
  var targetId = candidates[candidates.length-1].getAttribute("data-id"); // most-recently-registered match
  if(areFriends(targetId)){ toast(name+" is already your friend."); return; }
  var existing = Array.prototype.slice.call(freqList().querySelectorAll('.freq[data-status="pending"]')).filter(function(r){
    return (r.getAttribute("data-from")===myId && r.getAttribute("data-to")===targetId) ||
           (r.getAttribute("data-from")===targetId && r.getAttribute("data-to")===myId);
  });
  if(existing.length){ toast("There's already a pending request with "+name+"."); return; }
  audio.sfx.notify();
  commit(function(){
    var r = document.createElement("div"); r.className="freq";
    r.setAttribute("data-id", uid());
    r.setAttribute("data-from", myId);
    r.setAttribute("data-to", targetId);
    r.setAttribute("data-status", "pending");
    freqList().appendChild(r);
  });
}
function acceptFriendRequest(reqId){
  var req = freqList().querySelector('.freq[data-id="'+cssesc(reqId)+'"]');
  if(!req) return;
  audio.sfx.success();
  commit(function(){
    var fs = document.createElement("div"); fs.className="friendship";
    fs.setAttribute("data-id", uid());
    fs.setAttribute("data-a", req.getAttribute("data-from"));
    fs.setAttribute("data-b", req.getAttribute("data-to"));
    fs.setAttribute("data-since", String(Date.now()));
    friendshipList().appendChild(fs);
    req.remove();
  });
}
function declineFriendRequest(reqId){
  var req = freqList().querySelector('.freq[data-id="'+cssesc(reqId)+'"]');
  if(!req) return;
  commit(function(){ req.remove(); });
}
function cancelFriendRequest(reqId){
  var req = freqList().querySelector('.freq[data-id="'+cssesc(reqId)+'"]');
  if(!req) return;
  commit(function(){ req.remove(); });
}
function unfriend(otherId){
  var f = myFriendships().filter(function(x){ return friendOtherId(x)===otherId; })[0];
  if(!f) return;
  commit(function(){ f.remove(); });
}
function friendCurrentRoom(otherId){
  var rooms = Array.prototype.slice.call(store().querySelectorAll(".room"));
  for(var i=0;i<rooms.length;i++){
    if(findPlayer(rooms[i], otherId)) return rooms[i].getAttribute("data-id");
  }
  return null;
}
var prevFriendshipIds = null;
function checkFriendshipTransitions(){
  var ids = myFriendships().map(function(f){ return f.getAttribute("data-id"); });
  if(prevFriendshipIds !== null){
    var isNew = ids.filter(function(id){ return prevFriendshipIds.indexOf(id) === -1; });
    if(isNew.length) bumpStat("friendsAdded", isNew.length);
  }
  prevFriendshipIds = ids;
}

function fmtTime(ms){
  var d = new Date(ms);
  var h = d.getHours()%12 || 12, m = ("0"+d.getMinutes()).slice(-2);
  return h+":"+m;
}

function renderIdentityChip(){
  var slot = document.getElementById("identity-chip-slot");
  var room = nav.roomId ? findRoom(nav.roomId) : null;
  var role = room ? roleOf(room, myId) : null;
  var dot = role==="admin" ? '<span class="dot dot-admin"></span>' : role==="mod" ? '<span class="dot dot-mod"></span>' : '';
  if(!myName){ slot.innerHTML = ""; return; }
  slot.innerHTML = '<div id="identity-chip" data-action="edit-name" title="Tap to rename yourself" style="cursor:pointer;">'+dot+'<span>'+esc(myAvatar)+' '+esc(myName)+'</span> <span style="opacity:.5;font-size:11px;">✎</span></div>';
}

function render(){
  renderIdentityChip();
  renderAchievementsModal();
  var mount = document.getElementById("local-mount");
  if(!myName){ mount.innerHTML = renderNamePrompt(); return; }
  if(nav.screen === "landing" || !nav.roomId || !findRoom(nav.roomId)){
    if(nav.roomId && !findRoom(nav.roomId)){ nav.roomId = null; nav.screen="landing"; }
    mount.innerHTML = renderLanding();
    return;
  }
  var room = findRoom(nav.roomId);
  var p = me(room);
  if(!p){ nav.screen="landing"; nav.roomId=null; mount.innerHTML = renderLanding(); return; }
  mount.innerHTML = renderLobby(room);

    if(stageSlot) stageSlot.innerHTML = renderGame(room, gtype);

  renderLocalSpamCount();
}
