<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boneclub TD</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a06;font-family:monospace}
  /* side panel — overlays the map on the right, semi-transparent */
  #side-panel{position:fixed;top:4px;right:4px;bottom:4px;width:115px;z-index:10;
              display:flex;flex-direction:column;gap:6px;
              background:rgba(8,6,2,0.82);border:2px solid #5a3a1a;border-radius:8px;padding:8px 6px;
              overflow:hidden;backdrop-filter:blur(2px)}
  #coins-display{color:#ffe060;font-size:17px;font-weight:bold;text-align:center}
  #status-el{font-size:9px;color:#f0a030;font-weight:bold;text-align:center;min-height:12px}
  #cancel-btn{background:#2a1008;border:2px solid #8a3010;color:#f08040;border-radius:5px;
              padding:4px 6px;cursor:pointer;font-family:monospace;font-size:11px;
              text-align:center;visibility:hidden;touch-action:manipulation}
  #side-divider{border:none;border-top:1px solid #3a2a10;margin:0}
  #tower-cards{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;
               scrollbar-width:none}
  #tower-cards::-webkit-scrollbar{display:none}
  .tc{background:#1e1608;border:2px solid #4a3010;border-radius:6px;padding:6px 6px;
      cursor:pointer;user-select:none;touch-action:manipulation;
      display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .tc:hover:not(.cant-afford){border-color:#c0902a}
  .tc.sel{border-color:#ffe060;background:#2a2006}
  .tc.cant-afford{opacity:.4;cursor:not-allowed}
  .tc .dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
  .tc .tname{color:#f0d080;font-size:10px;font-weight:bold;margin-top:2px}
  .tc .tcost{color:#ffe060;font-size:12px;font-weight:bold}
  .tc .tdesc{color:#706040;font-size:8px}
  /* canvas: position:fixed with exact px coords set by JS once — never moves or resizes */
  canvas{position:fixed;border:3px solid #5a3a1a;cursor:crosshair;display:block}
  #speed-btn{position:fixed;bottom:10px;right:10px;z-index:20;
             background:#1a1208;border:2px solid #5a3a1a;color:#a08040;
             border-radius:8px;padding:7px 13px;font-family:monospace;font-size:13px;
             font-weight:bold;cursor:pointer;touch-action:manipulation;user-select:none}
  #speed-btn.fast{background:#2a1a00;border-color:#f0a020;color:#ffe060}
</style>
</head>
<body>
<div id="side-panel">
  <div id="coins-display">💰 <span id="coins-el">35</span></div>
  <div id="status-el"></div>
  <div id="cancel-btn" onpointerup="cancelPlacement()">✕ Cancel</div>
  <hr id="side-divider">
  <div id="tower-cards"></div>
</div>
<canvas id="c" width="900" height="620"></canvas>
<button id="speed-btn">▶ 1x</button>

<script>
// ── Canvas / ctx ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Ring geometry ─────────────────────────────────────────────────────────────
const cx = W/2, cy = 330;
const OUT_RX=390, OUT_RY=195, IN_RX=210, IN_RY=105;

function ringPoint(angle,t){
  const rx=IN_RX+t*(OUT_RX-IN_RX), ry=IN_RY+t*(OUT_RY-IN_RY);
  const depth=(Math.sin(angle)+1)/2;
  return{x:cx+rx*Math.cos(angle),y:cy+ry*Math.sin(angle),scale:0.52+0.48*depth,depth};
}
function inInner(x,y){return((x-cx)/IN_RX)**2+((y-cy)/IN_RY)**2<1}
function inOuter(x,y){return((x-cx)/OUT_RX)**2+((y-cy)/OUT_RY)**2<1}

// ── Tower definitions ─────────────────────────────────────────────────────────
const TOWER_DEFS = [
  {id:0,name:'Rock Slinger', cost:10,  dotColor:'#909090',baseCol:'#7a7a7a',
   range:110,fireRate:0.55,damage:1,projSpeed:180,projColor:'#cccccc',projSize:4,
   desc:'Short range, slow rocks'},
  {id:1,name:'Spear Thrower',cost:20,  dotColor:'#d09040',baseCol:'#8a6030',
   range:155,fireRate:0.85,damage:1,projSpeed:270,projColor:'#e09030',projSize:3,
   desc:'Medium range, spears'},
  {id:2,name:'Bomb Tower',   cost:50,  dotColor:'#ff6600',baseCol:'#5a4030',
   range:130,fireRate:0.38,damage:3,projSpeed:210,projColor:'#ff4400',projSize:6,
   desc:'Explosive, high damage'},
  {id:3,name:'Cannon',       cost:100, dotColor:'#6688cc',baseCol:'#505060',
   range:230,fireRate:0.28,damage:5,projSpeed:360,projColor:'#8899dd',projSize:7,
   desc:'Long range, massive dmg'},
  {id:4,name:'Bone Mage',    cost:250, dotColor:'#cc66ff',baseCol:'#604080',
   range:195,fireRate:1.6, damage:2,projSpeed:420,projColor:'#dd88ff',projSize:5,
   desc:'Fast magic attacks'},
];

// ── Path strips (connected trapezoid quads) ───────────────────────────────────
const N_STRIPS=40;
const allStrips=Array.from({length:N_STRIPS},(_,i)=>{
  const angle=(i/N_STRIPS)*Math.PI*2;
  return{i,angle,depth:(Math.sin(angle)+1)/2};
}).sort((a,b)=>a.depth-b.depth);

// ── Helpers ───────────────────────────────────────────────────────────────────
function shade(hsl,amt){
  const m=hsl.match(/hsl\(([^,]+),([^,]+)%,([^)]+)%\)/);
  if(!m)return hsl;
  return`hsl(${m[1]},${m[2]}%,${Math.min(100,Math.max(0,+m[3]+amt))}%)`;
}
function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

// ── Game state ─────────────────────────────────────────────────────────────────
let coins=1000;
let cavemen=[], nextCaveId=0;
let placedTowers=[], nextTowerId=0;
let projectiles=[];
let particles=[];
let selectedDef=null;  // tower def selected from shop
let mouseWorld={x:0,y:0};
let spawnTimer=0, lastTime=null, gameSpeed=1;
const speedBtn=document.getElementById('speed-btn');
speedBtn.addEventListener('pointerup',()=>{
  gameSpeed=gameSpeed===1?2:1;
  speedBtn.textContent=gameSpeed===2?'⏩ 2x':'▶ 1x';
  speedBtn.classList.toggle('fast',gameSpeed===2);
});
const camScale=0.72;

function updateCoinsUI(){
  document.getElementById('coins-el').textContent=coins;
  rebuildShop();
}
function setStatus(msg){document.getElementById('status-el').textContent=msg;}

// ── Shop HTML ─────────────────────────────────────────────────────────────────
// Cards are built ONCE. rebuildShop() after that only updates CSS classes —
// no innerHTML clearing, no DOM mutation, no layout reflow.
const cardEls = [];
(function buildShopOnce(){
  const el=document.getElementById('tower-cards');
  for(const def of TOWER_DEFS){
    const div=document.createElement('div');
    div.innerHTML=`<div class="dot" style="background:${def.dotColor}"></div>
      <div class="tname">${def.name}</div>
      <div class="tcost">💰${def.cost}</div>
      <div class="tdesc">${def.desc}</div>`;
    div.addEventListener('pointerup',e=>{
      e.preventDefault();
      if(coins<def.cost)return;
      selectedDef=selectedDef===def?null:def;
      document.getElementById('cancel-btn').style.visibility=selectedDef?'visible':'hidden';
      setStatus(selectedDef?'Tap tower to place':'');
      rebuildShop();
    });
    el.appendChild(div);
    cardEls.push({div,def});
  }
})();

function rebuildShop(){
  for(const{div,def}of cardEls){
    div.className='tc'+(selectedDef===def?' sel':'')+(coins<def.cost?' cant-afford':'');
  }
}
rebuildShop();

function cancelPlacement(){
  selectedDef=null;
  document.getElementById('cancel-btn').style.visibility='hidden';
  setStatus('');
  rebuildShop();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelPlacement()});

// ── Placement helpers ─────────────────────────────────────────────────────────
function validPlacement(wx,wy){
  // Allow inside island, outside ring, OR anywhere on the visible canvas
  if(wx>10&&wx<W-10&&wy>10&&wy<H-10) return true;
  return false;
}
function noTowerOverlap(wx,wy,skipId=-1){
  for(const t of placedTowers){
    if(t.id===skipId) continue;
    if(Math.hypot(wx-t.x,wy-t.y)<42) return false;
  }
  return true;
}
function canPlace(wx,wy){
  return validPlacement(wx,wy)&&noTowerOverlap(wx,wy)&&coins>=selectedDef.cost;
}

// ── Spawn cavemen ─────────────────────────────────────────────────────────────
function spawnCaveman(){
  if(cavemen.length>=12) return;
  const spawnAngle=-Math.PI/2;
  const blocked=cavemen.some(c=>{
    let da=Math.abs(c.angle-spawnAngle)%(Math.PI*2);
    return Math.min(da,Math.PI*2-da)<0.32;
  });
  if(blocked) return;
  // 20% each: normal, heavy, knight, soldier, tank
  const roll=Math.random();
  const heavy   = roll<0.20;
  const knight  = !heavy && roll<0.40;
  const soldier = !heavy && !knight && roll<0.60;
  const tank    = !heavy && !knight && !soldier && roll<0.80;
  let hp,angSpeed,coins2,skin;
  if(tank){
    hp=1000; angSpeed=0.05+Math.random()*0.03; coins2=250;
    skin=`hsl(${30+Math.random()*10},${20+Math.random()*10}%,${22+Math.random()*8}%)`;
  } else if(soldier){
    hp=100; angSpeed=0.10+Math.random()*0.07; coins2=45;
    skin=`hsl(${195+Math.random()*20},${45+Math.random()*15}%,${30+Math.random()*10}%)`;
  } else if(knight){
    hp=25; angSpeed=0.22+Math.random()*0.1; coins2=20;
    skin=`hsl(${25+Math.random()*20},${60+Math.random()*20}%,${55+Math.random()*15}%)`;
  } else if(heavy){
    hp=8; angSpeed=0.18+Math.random()*0.12; coins2=10;
    skin=`hsl(${10+Math.random()*10},${45+Math.random()*15}%,${35+Math.random()*10}%)`;
  } else {
    hp=3; angSpeed=0.38+Math.random()*0.25; coins2=10;
    skin=`hsl(${25+Math.random()*20},${60+Math.random()*20}%,${55+Math.random()*15}%)`;
  }
  cavemen.push({
    id:nextCaveId++, angle:spawnAngle, roadT:0.35+Math.random()*0.3,
    angSpeed, bobPhase:Math.random()*Math.PI*2, skin,
    hitFlash:0, hp, maxHp:hp,
    heavy, knight, soldier, tank, coins:coins2,
  });
}

// ── Projectile system ─────────────────────────────────────────────────────────
function fireProjectile(tower,target){
  const tp=ringPoint(target.angle,target.roadT);
  projectiles.push({
    x:tower.x,y:tower.y,targetId:target.id,
    speed:tower.def.projSpeed,damage:tower.def.damage,
    color:tower.def.projColor,size:tower.def.projSize,
  });
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    const tgt=cavemen.find(c=>c.id===p.targetId);
    if(!tgt){projectiles.splice(i,1);continue;}
    const tp=ringPoint(tgt.angle,tgt.roadT);
    const dx=tp.x-p.x,dy=tp.y-p.y,dist=Math.hypot(dx,dy);
    if(dist<10){
      tgt.hp-=p.damage; tgt.hitFlash=0.18;
      if(tgt.hp<=0){
        const pos=ringPoint(tgt.angle,tgt.roadT);
        spawnParticles(pos.x,pos.y,pos.scale);
        cavemen=cavemen.filter(c=>c.id!==tgt.id);
        coins+=5; updateCoinsUI();
      }
      projectiles.splice(i,1);continue;
    }
    const spd=p.speed*dt;
    p.x+=dx/dist*spd; p.y+=dy/dist*spd;
  }
}

// ── Tower attack logic ────────────────────────────────────────────────────────
function updateTowers(dt){
  for(const tower of placedTowers){
    tower.fireTimer+=dt;
    let nearest=null,nearestDist=tower.def.range;
    for(const c of cavemen){
      const cp=ringPoint(c.angle,c.roadT);
      const d=Math.hypot(cp.x-tower.x,cp.y-tower.y);
      if(d<nearestDist){nearestDist=d;nearest=c;}
    }
    if(nearest){
      const tp=ringPoint(nearest.angle,nearest.roadT);
      tower.aimAngle=Math.atan2(tp.y-tower.y,tp.x-tower.x)+Math.PI/2;
      if(tower.fireTimer>=1/tower.def.fireRate){
        tower.fireTimer=0;
        fireProjectile(tower,nearest);
      }
    }
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBackground(){
  const g=ctx.createRadialGradient(cx,cy,IN_RY,cx,cy,OUT_RX+140);
  g.addColorStop(0,'#1e3a16');g.addColorStop(0.6,'#162e10');g.addColorStop(1,'#0a1a06');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawRingBase(){
  ctx.fillStyle='#5c3d1a';
  ctx.beginPath();ctx.ellipse(cx,cy,OUT_RX,OUT_RY,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#3a2008';ctx.lineWidth=5;
  ctx.beginPath();ctx.ellipse(cx,cy,OUT_RX,OUT_RY,0,0,Math.PI*2);ctx.stroke();
}
function drawCentreIsland(){
  const g=ctx.createRadialGradient(cx,cy-10,10,cx,cy,IN_RY);
  g.addColorStop(0,'#2a5a22');g.addColorStop(1,'#1a3a14');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,IN_RX,IN_RY,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2a1a08';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(cx,cy,IN_RX,IN_RY,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#3a7a2a';ctx.lineWidth=1.5;
  for(let i=0;i<20;i++){
    const a=(i/20)*Math.PI*2,r=0.35+(i%3)*0.18;
    const bx=cx+IN_RX*r*Math.cos(a),by=cy+IN_RY*r*Math.sin(a);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a)*8,by+Math.sin(a)*4-10);ctx.stroke();
  }
}
function drawStrip(s){
  const dθ=Math.PI*2/N_STRIPS,a1=s.angle-dθ/2,a2=s.angle+dθ/2;
  const sc=s.depth*0.48+0.52;
  const pi1=ringPoint(a1,0),po1=ringPoint(a1,1),pi2=ringPoint(a2,0),po2=ringPoint(a2,1);
  const col=s.i%2===0?'#909090':'#b0b0b0';
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(pi1.x,pi1.y);ctx.lineTo(po1.x,po1.y);
  ctx.lineTo(po2.x,po2.y);ctx.lineTo(pi2.x,pi2.y);ctx.closePath();ctx.fill();
  if(s.depth>0.25){
    const eh=7*sc;ctx.fillStyle='#323232';
    ctx.beginPath();ctx.moveTo(pi2.x,pi2.y);ctx.lineTo(po2.x,po2.y);
    ctx.lineTo(po2.x,po2.y+eh);ctx.lineTo(pi2.x,pi2.y+eh);ctx.closePath();ctx.fill();
  }
  const hi1=ringPoint(a1+dθ*0.1,0.05),ho1=ringPoint(a1+dθ*0.1,0.95);
  const hi2=ringPoint(a2-dθ*0.1,0.05),ho2=ringPoint(a2-dθ*0.1,0.95);
  ctx.fillStyle='rgba(255,255,255,0.09)';
  ctx.beginPath();ctx.moveTo(hi1.x,hi1.y-1);ctx.lineTo(ho1.x,ho1.y-1);
  ctx.lineTo(ho2.x,ho2.y-1);ctx.lineTo(hi2.x,hi2.y-1);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#4a4a4a';ctx.lineWidth=Math.max(0.4,1.2*sc);
  ctx.beginPath();ctx.moveTo(pi1.x,pi1.y);ctx.lineTo(po1.x,po1.y);
  ctx.lineTo(po2.x,po2.y);ctx.lineTo(pi2.x,pi2.y);ctx.closePath();ctx.stroke();
}
// ── Draw a tower ──────────────────────────────────────────────────────────────
function drawTower(tower,alpha){
  const{x,y,def,aimAngle:aim=0}=tower;
  ctx.save();ctx.translate(x,y);
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  // Range ring (faint)
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.setLineDash([4,6]);
  ctx.beginPath();ctx.arc(0,0,def.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  // Base shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.ellipse(3,6,16,8,0,0,Math.PI*2);ctx.fill();
  // Base circle
  ctx.fillStyle=def.baseCol;
  ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.arc(-4,-5,8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.stroke();
  // Rotating weapon part
  ctx.rotate(aim);
  const c=def.dotColor;
  switch(def.id){
    case 0:// Rock slinger – sling arm
      ctx.fillStyle='#888';ctx.fillRect(-3,-17,6,11);
      ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(0,-17,5,0,Math.PI*2);ctx.fill();
      break;
    case 1:// Spear thrower
      ctx.fillStyle='#a07030';ctx.fillRect(-2.5,-20,5,14);
      ctx.fillStyle=c;
      ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-4,-28);ctx.lineTo(4,-28);ctx.closePath();ctx.fill();
      break;
    case 2:// Bomb tower – short thick barrel
      ctx.fillStyle='#443322';ctx.fillRect(-5,-18,10,12);
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-19,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#220';ctx.fillRect(-1,-27,2,7);
      break;
    case 3:// Cannon – long barrel
      ctx.fillStyle='#333344';ctx.fillRect(-5,-26,10,18);
      ctx.fillStyle='#222233';ctx.fillRect(-6,-26,12,5);
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-26,5,0,Math.PI*2);ctx.fill();
      break;
    case 4:{// Bone mage – pulsing orb
      const pulse=0.85+0.15*Math.sin(Date.now()/250);
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-17,9*pulse,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(-3,-20,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=c;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-17+9*pulse);ctx.stroke();
      break;
    }
  }
  ctx.restore();
}

// ── Draw projectiles ──────────────────────────────────────────────────────────
function drawProjectiles(){
  for(const p of projectiles){
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    // Trail glow
    ctx.fillStyle=hexToRgba(p.color.startsWith('#')?p.color:'#ffffff',0.3);
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*1.8,0,Math.PI*2);ctx.fill();
  }
}

// ── Placement preview ─────────────────────────────────────────────────────────
function drawPlacementPreview(){
  if(!selectedDef) return;
  const{x,y}=mouseWorld;
  const ok=canPlace(x,y);
  // Snap to slot if near
  let px=x,py=y;
  // Range ring
  ctx.save();ctx.translate(px,py);
  ctx.strokeStyle=ok?'rgba(100,255,100,0.35)':'rgba(255,80,80,0.35)';
  ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
  ctx.beginPath();ctx.arc(0,0,selectedDef.range,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=ok?'rgba(100,255,100,0.07)':'rgba(255,80,80,0.07)';
  ctx.beginPath();ctx.arc(0,0,selectedDef.range,0,Math.PI*2);ctx.fill();
  ctx.setLineDash([]);ctx.restore();
  drawTower({x:px,y:py,def:selectedDef,aimAngle:0},ok?0.65:0.35);
}

// ── Tank drawing ──────────────────────────────────────────────────────────────
function drawTankEnemy(c){
  const pos=ringPoint(c.angle,c.roadT);
  let sc=pos.scale*2.5;
  if(sc<0.08)return;
  const now=Date.now()/1000, bob=Math.sin(now*2+c.bobPhase)*1.5*sc;
  const walkDir=-Math.sin(c.angle)>=0?1:-1;
  ctx.save();ctx.translate(pos.x,pos.y+bob);
  // shadow
  ctx.globalAlpha=c.hitFlash>0?0.1:0.35;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,8*sc,30*sc,7*sc,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=c.hitFlash>0?0.35:1;ctx.scale(walkDir,1);
  const ls=Math.sin(now*3+c.bobPhase)*10;
  // massive legs
  function leg(ox,ang){
    const fx=ox+Math.sin(ang*Math.PI/180)*15*sc,fy=35*sc+Math.abs(Math.sin(ang*Math.PI/180))*4*sc;
    ctx.lineWidth=16*sc;ctx.lineCap='round';ctx.strokeStyle='#1a1a1a';
    ctx.beginPath();ctx.moveTo(ox,16*sc);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.lineWidth=13*sc;ctx.strokeStyle='#333';
    ctx.beginPath();ctx.moveTo(ox,16*sc);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(fx,fy+4*sc,10*sc,5*sc,0,0,Math.PI*2);ctx.fill();
  }
  leg(-10*sc,ls);leg(10*sc,-ls);
  // massive body — dark iron
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(3*sc,0,22*sc,26*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(0,0,22*sc,26*sc,0,0,Math.PI*2);ctx.fill();
  // rivets / armour plates
  ctx.strokeStyle='#444';ctx.lineWidth=2.5*sc;
  ctx.beginPath();ctx.moveTo(-14*sc,-8*sc);ctx.lineTo(14*sc,-8*sc);ctx.stroke();

  // viewing slit — orange glow

// ── Soldier drawing ───────────────────────────────────────────────────────────
function drawSoldier(c){
  const pos=ringPoint(c.angle,c.roadT);
  let sc=pos.scale*1.85;
  if(sc<0.08)return;
  const now=Date.now()/1000,bob=Math.sin(now*3.5+c.bobPhase)*2.5*sc;
  const walkDir=-Math.sin(c.angle)>=0?1:-1;
  ctx.save();ctx.translate(pos.x,pos.y+bob);
  ctx.globalAlpha=c.hitFlash>0?0.1:0.22;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,7*sc,22*sc,5.5*sc,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=c.hitFlash>0?0.4:1;ctx.scale(walkDir,1);
  const ls=Math.sin(now*4+c.bobPhase)*14;
  // heavy armoured legs
  function leg(ox,ang){
    const fx=ox+Math.sin(ang*Math.PI/180)*14*sc,fy=32*sc+Math.abs(Math.sin(ang*Math.PI/180))*4*sc;
    ctx.lineWidth=12*sc;ctx.lineCap='round';ctx.strokeStyle='#2a3a2a';
    ctx.beginPath();ctx.moveTo(ox,15*sc);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.lineWidth=10*sc;ctx.strokeStyle='#4a6a4a';
    ctx.beginPath();ctx.moveTo(ox,15*sc);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle='#2a3a2a';ctx.beginPath();ctx.ellipse(fx,fy+3*sc,8*sc,4*sc,0,0,Math.PI*2);ctx.fill();
  }
  leg(-8*sc,ls);leg(8*sc,-ls);
  // thick torso — dark green armour
  ctx.fillStyle='#2a3a2a';ctx.beginPath();ctx.ellipse(2*sc,0,17*sc,22*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a6a4a';ctx.beginPath();ctx.ellipse(0,0,17*sc,22*sc,0,0,Math.PI*2);ctx.fill();
  // armour plates
  ctx.strokeStyle='#3a5a3a';ctx.lineWidth=2*sc;
  ctx.beginPath();ctx.moveTo(-10*sc,-6*sc);ctx.lineTo(10*sc,-6*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-10*sc,4*sc);ctx.lineTo(10*sc,4*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-12*sc);ctx.lineTo(0,12*sc);ctx.stroke();
  // big shoulder pads
  ctx.fillStyle='#2a3a2a';ctx.beginPath();ctx.ellipse(-16*sc,-5*sc,10*sc,7*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a6a4a';ctx.beginPath();ctx.ellipse(-17*sc,-6*sc,9*sc,6*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a3a2a';ctx.beginPath();ctx.ellipse(16*sc,-5*sc,10*sc,7*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4a6a4a';ctx.beginPath();ctx.ellipse(15*sc,-6*sc,9*sc,6*sc,0,0,Math.PI*2);ctx.fill();
  // spear arm
  const as=Math.sin(now*3.5+c.bobPhase+Math.PI)*18;
  ctx.save();ctx.translate(16*sc,-2*sc);ctx.rotate((-20+as)*Math.PI/180);
  ctx.strokeStyle='#2a3a2a';ctx.lineWidth=11*sc;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18*sc);ctx.stroke();
  ctx.strokeStyle='#4a6a4a';ctx.lineWidth=9*sc;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18*sc);ctx.stroke();
  // spear shaft
  ctx.strokeStyle='#8a6030';ctx.lineWidth=3*sc;ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(2*sc,18*sc);ctx.lineTo(2*sc,-28*sc);ctx.stroke();
  // spear tip
  ctx.fillStyle='#ccc';
  ctx.beginPath();ctx.moveTo(-2*sc,-28*sc);ctx.lineTo(6*sc,-28*sc);ctx.lineTo(2*sc,-42*sc);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#999';ctx.lineWidth=sc;ctx.stroke();
  ctx.restore();
  // heavy helmet — full face plate
  ctx.fillStyle='#1e2e1e';ctx.beginPath();ctx.ellipse(2*sc,-23*sc,16*sc,20*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a5a3a';ctx.beginPath();ctx.ellipse(0,-23*sc,16*sc,20*sc,0,0,Math.PI*2);ctx.fill();
  // face plate slit — red glow
  ctx.fillStyle='#111';ctx.fillRect(-9*sc,-29*sc,18*sc,5*sc);
  ctx.fillStyle='#f00';
  for(let i=-3;i<=3;i+=2)ctx.fillRect(i*2.5*sc,-28.5*sc,1.5*sc,3.5*sc);
  // crest / mohawk
  ctx.fillStyle='#c8c000';
  ctx.beginPath();ctx.moveTo(-2*sc,-40*sc);ctx.lineTo(2*sc,-40*sc);
  ctx.lineTo(3*sc,-58*sc);ctx.lineTo(0,-62*sc);ctx.lineTo(-3*sc,-58*sc);ctx.closePath();ctx.fill();
  // health bar
  ctx.globalAlpha=1;
  const barW=50*sc,barH=6*sc,barX=-barW/2,barY=-74*sc;
  ctx.fillStyle='#330000';ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='#22cc44';ctx.fillRect(barX,barY,barW*(c.hp/c.maxHp),barH);
  ctx.strokeStyle='#000';ctx.lineWidth=0.8;ctx.strokeRect(barX,barY,barW,barH);
  ctx.restore();
}

// ── Knight drawing ────────────────────────────────────────────────────────────
function drawKnight(c){
  const pos=ringPoint(c.angle,c.roadT);
  let sc=pos.scale*1.6;
  if(sc<0.08)return;
  const now=Date.now()/1000, bob=Math.sin(now*4+c.bobPhase)*3*sc;
  const walkDir=-Math.sin(c.angle)>=0?1:-1;

  ctx.globalAlpha=c.hitFlash>0?0.1:0.25;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(0,6*sc,20*sc,5*sc,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=c.hitFlash>0?0.4:1;ctx.scale(walkDir,1);
  const ls=Math.sin(now*5+c.bobPhase)*16;
  // legs (armoured, dark grey)
  function leg(ox,ang){
    const fx=ox+Math.sin(ang*Math.PI/180)*13*sc,fy=30*sc+Math.abs(Math.sin(ang*Math.PI/180))*4*sc;
    ctx.lineWidth=10*sc;ctx.lineCap='round';ctx.strokeStyle='#333';

    ctx.lineWidth=8*sc;ctx.strokeStyle='#666';

    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(fx,fy+3*sc,7*sc,3.5*sc,0,0,Math.PI*2);ctx.fill();
  }
  leg(-7*sc,ls);leg(7*sc,-ls);
  // body (plate armour — silver)
  ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(2*sc,0,15*sc,20*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';ctx.beginPath();ctx.ellipse(0,0,15*sc,20*sc,0,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#888';ctx.lineWidth=1.5*sc;
  ctx.beginPath();ctx.moveTo(-8*sc,-5*sc);ctx.lineTo(8*sc,-5*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-10*sc);ctx.lineTo(0,10*sc);ctx.stroke();

  ctx.fillStyle='#999';ctx.beginPath();ctx.ellipse(-14*sc,-4*sc,8*sc,6*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#bbb';ctx.beginPath();ctx.ellipse(-15*sc,-5*sc,7*sc,5*sc,0,0,Math.PI*2);ctx.fill();
  // sword arm
  const as=Math.sin(now*4+c.bobPhase+Math.PI)*20;
  ctx.save();ctx.translate(14*sc,-2*sc);ctx.rotate((-25+as)*Math.PI/180);
  // arm
  ctx.strokeStyle='#888';ctx.lineWidth=9*sc;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16*sc);ctx.stroke();
  ctx.strokeStyle='#aaa';ctx.lineWidth=7*sc;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16*sc);ctx.stroke();
  // sword blade
  ctx.strokeStyle='#dde';ctx.lineWidth=3*sc;
  ctx.beginPath();ctx.moveTo(2*sc,16*sc);ctx.lineTo(2*sc,-22*sc);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=2*sc;
  ctx.beginPath();ctx.moveTo(1*sc,16*sc);ctx.lineTo(1*sc,-22*sc);ctx.stroke();
  // crossguard
  ctx.strokeStyle='#b8a040';ctx.lineWidth=4*sc;ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(-6*sc,14*sc);ctx.lineTo(8*sc,14*sc);ctx.stroke();
  ctx.restore();
  // shield arm
  ctx.save();ctx.translate(-14*sc,0);
  ctx.strokeStyle='#888';ctx.lineWidth=9*sc;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,14*sc);ctx.stroke();
  // shield
  ctx.fillStyle='#8a1010';
  ctx.beginPath();ctx.moveTo(-10*sc,-14*sc);ctx.lineTo(10*sc,-14*sc);
  ctx.lineTo(12*sc,8*sc);ctx.lineTo(0,18*sc);ctx.lineTo(-12*sc,8*sc);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#c8c080';ctx.lineWidth=2*sc;ctx.stroke();
  ctx.strokeStyle='#c8c080';ctx.lineWidth=1.5*sc;
  ctx.beginPath();ctx.moveTo(0,-14*sc);ctx.lineTo(0,18*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-12*sc,0);ctx.lineTo(12*sc,0);ctx.stroke();
  ctx.restore();
  // helmet
  ctx.fillStyle='#666';ctx.beginPath();ctx.ellipse(2*sc,-22*sc,15*sc,18*sc,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';ctx.beginPath();ctx.ellipse(0,-22*sc,15*sc,18*sc,0,0,Math.PI*2);ctx.fill();
  // visor slit
  ctx.fillStyle='#222';ctx.fillRect(-8*sc,-27*sc,16*sc,4*sc);
  ctx.fillStyle='#f80';ctx.fillRect(-6*sc,-26.5*sc,12*sc,2.5*sc); // glowing eyes

  ctx.beginPath();ctx.moveTo(0,-38*sc);ctx.quadraticCurveTo(8*sc,-50*sc,3*sc,-56*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-38*sc);ctx.quadraticCurveTo(-4*sc,-48*sc,-1*sc,-55*sc);ctx.stroke();
  // health bar
  ctx.globalAlpha=1;
  const barW=44*sc,barH=5*sc,barX=-barW/2,barY=-66*sc;
  ctx.fillStyle='#330000';ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle='#4488ff';ctx.fillRect(barX,barY,barW*(c.hp/c.maxHp),barH);
  ctx.strokeStyle='#000';ctx.lineWidth=0.8;ctx.strokeRect(barX,barY,barW,barH);
  ctx.restore();
}

// ── Caveman drawing ───────────────────────────────────────────────────────────
function drawCaveman(c){
  if(c.tank){drawTankEnemy(c);return;}
  if(c.soldier){drawSoldier(c);return;}
  if(c.knight){drawKnight(c);return;}
  const pos=ringPoint(c.angle,c.roadT);
  let sc=pos.scale;
  if(sc<0.08)return;
  if(c.heavy) sc*=1.45; // heavy cavemen are bigger
  const now=Date.now()/1000,bob=Math.sin(now*5+c.bobPhase)*3*sc;
  const walkDir=-Math.sin(c.angle)>=0?1:-1;

  ctx.fillStyle='#5a3a10';ctx.beginPath();ctx.arc(0,-4*sc,7*sc,Math.PI,Math.PI*2);ctx.fill();
  const as=Math.sin(now*5+c.bobPhase+Math.PI)*22;

  ctx.beginPath();ctx.arc(0,-18*sc,6*sc,0.2,Math.PI-0.2);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.fillRect(-4*sc,-20*sc,3*sc,4*sc);ctx.fillRect(1*sc,-20*sc,3*sc,4*sc);
  ctx.fillStyle='#c8804a';ctx.beginPath();ctx.ellipse(0,-20*sc,4*sc,3*sc,0,0,Math.PI*2);ctx.fill();
  // Health bar
  ctx.globalAlpha=1;
  const barW=38*sc, barH=5*sc, barX=-barW/2, barY=-58*sc;
  ctx.fillStyle='#330000';ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle=c.heavy?'#ff6600':'#ff2222';
  ctx.fillRect(barX,barY,barW*(c.hp/c.maxHp),barH);
  ctx.strokeStyle='#000';ctx.lineWidth=0.8;ctx.strokeRect(barX,barY,barW,barH);

  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnParticles(x,y,sc){
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2,spd=(80+Math.random()*130)*sc;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-70*sc,
      life:1,color:Math.random()<0.5?'#ffdd44':'#ff8844',size:(4+Math.random()*7)*sc});
  }
}
function drawParticles(dt){
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt*1.6;
    if(p.life<=0)continue;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.1,p.size*p.life),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function update(ts){
  requestAnimationFrame(update);
  const t=ts/1000,dt=(lastTime===null?0:Math.min(t-lastTime,0.1))*gameSpeed;
  lastTime=t;
  spawnTimer+=dt;
  if(spawnTimer>=5){spawnTimer-=5;spawnCaveman();}
  for(const c of cavemen){c.angle+=c.angSpeed*dt;if(c.hitFlash>0)c.hitFlash-=dt;}
  // Hard separation between cavemen
  const MIN_SEP=0.32;
  cavemen.sort((a,b)=>a.angle-b.angle);
  for(let i=1;i<cavemen.length;i++){
    if(cavemen[i].angle-cavemen[i-1].angle<MIN_SEP)
      cavemen[i].angle=cavemen[i-1].angle+MIN_SEP;
  }
  updateTowers(dt);
  updateProjectiles(dt);

  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(camScale,camScale);ctx.translate(-W/2,-H/2);

  drawBackground();
  drawRingBase();

  const farStrips  = allStrips.filter(s=>s.depth<0.5);
  const nearStrips = allStrips.filter(s=>s.depth>=0.5);
  const sortedCave = [...cavemen].sort((a,b)=>
    ringPoint(a.angle,a.roadT).depth - ringPoint(b.angle,b.roadT).depth);
  const farCave    = sortedCave.filter(c=>ringPoint(c.angle,c.roadT).depth<0.5);
  const nearCave   = sortedCave.filter(c=>ringPoint(c.angle,c.roadT).depth>=0.5);

  // Far half: ALL strips first, then cavemen on top — clipped to ring donut
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(cx,cy,OUT_RX+4,OUT_RY+4,0,0,Math.PI*2);
  ctx.ellipse(cx,cy,IN_RX-2,IN_RY-2,0,0,Math.PI*2);
  ctx.clip('evenodd');
  for(const s of farStrips)  drawStrip(s);
  for(const c of farCave)    drawCaveman(c);
  ctx.restore();

  drawCentreIsland();

  // Towers inside island
  for(const t of placedTowers) if(inInner(t.x,t.y)) drawTower(t);

  // Near half: ALL strips first, then cavemen on top
  for(const s of nearStrips) drawStrip(s);
  for(const c of nearCave)   drawCaveman(c);

  // Towers outside ring
  for(const t of placedTowers) if(!inOuter(t.x,t.y)) drawTower(t);

  drawProjectiles();
  drawParticles(dt);
  drawPlacementPreview();

  ctx.restore();
}

// ── Input coords (works for both mouse events and touch points) ────────────────
function canvasToWorld(e){
  const rect=canvas.getBoundingClientRect();
  const cx2=(e.clientX-rect.left)*(W/rect.width);
  const cy2=(e.clientY-rect.top)*(H/rect.height);
  return{x:(cx2-W/2)/camScale+W/2, y:(cy2-H/2)/camScale+H/2};
}

function handleTap(e){
  const{x,y}=canvasToWorld(e);
  if(selectedDef){
    if(!validPlacement(x,y)||!noTowerOverlap(x,y)||coins<selectedDef.cost)return;
    coins-=selectedDef.cost;updateCoinsUI();
    placedTowers.push({id:nextTowerId++,x,y,def:selectedDef,fireTimer:0,aimAngle:0});
    cancelPlacement();
    return;
  }
  // Tap caveman to bonk
  const sorted=[...cavemen].sort((a,b)=>ringPoint(b.angle,b.roadT).depth-ringPoint(a.angle,a.roadT).depth);
  for(const c of sorted){
    const pos=ringPoint(c.angle,c.roadT),sc=pos.scale*(c.tank?2.5:c.soldier?1.85:c.knight?1.6:1);
    if(Math.abs(x-pos.x)<36*sc&&y-pos.y>-80*sc&&y-pos.y<48*sc){
      c.hp--;c.hitFlash=0.2;spawnParticles(pos.x,pos.y-30*sc,sc);
      if(c.hp<=0){cavemen=cavemen.filter(cc=>cc.id!==c.id);coins+=(c.coins||10);updateCoinsUI();}
      break;
    }
  }
}

// Mouse
canvas.addEventListener('mousemove',e=>{mouseWorld=canvasToWorld(e);});
canvas.addEventListener('click',e=>{handleTap(e);});

// Touch — needed on mobile so placement actually works
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  mouseWorld=canvasToWorld(e.touches[0]);
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  handleTap(e.changedTouches[0]);
},{passive:false});

canvas.addEventListener('contextmenu',e=>{e.preventDefault();cancelPlacement();});

// Canvas fills the full viewport — side panel overlays on top.
// Size is set ONCE here and never changed again.
(function(){
  const PAD = 4;
  const vw = window.innerWidth, vh = window.innerHeight;
  const areaW = vw - PAD * 2;
  const areaH = vh - PAD * 2;
  const aspect = W / H;
  let w = areaW, h = areaW / aspect;
  if(h > areaH){ h = areaH; w = h * aspect; }
  w = Math.floor(w); h = Math.floor(h);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.left   = Math.floor(PAD + (areaW - w) / 2) + 'px';
  canvas.style.top    = Math.floor(PAD + (areaH - h) / 2) + 'px';
})();

spawnCaveman();
requestAnimationFrame(update);
</script>
