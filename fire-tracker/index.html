<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Fire Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #9a9a9a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }

  #hud {
    position: fixed;
    top: 14px; left: 14px;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    z-index: 10;
    pointer-events: none;
  }
  #hud .dist { font-size: 30px; font-weight: 800; letter-spacing: 0.5px; }
  #hud .sub { font-size: 14px; font-weight: 700; opacity: 0.9; margin-top: 3px; }
  #hud .best { font-size: 13px; font-weight: 600; opacity: 0.72; margin-top: 4px; }
  #hud .heightBlock { margin-top: 12px; }
  #hud .height { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }

  #saveFlash {
    position: fixed;
    top: 160px; right: 18px;
    color: #ffdca0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 10;
    pointer-events: none;
  }
  #saveFlash.show { opacity: 1; }

  #minimapWrap {
    position: fixed;
    top: 14px; right: 14px;
    width: 132px; height: 132px;
    z-index: 10;
    pointer-events: none;
    border-radius: 50%;
    background: rgba(35,35,35,0.55);
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #minimapWrap .compass {
    position: absolute;
    color: rgba(255,255,255,0.8);
    font-size: 10px;
    font-weight: 800;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #minimapWrap .compass.n { top: 3px; left: 50%; transform: translateX(-50%); }
  #minimapWrap .compass.s { bottom: 3px; left: 50%; transform: translateX(-50%); opacity: 0.75; }
  #minimapWrap .compass.e { right: 4px; top: 50%; transform: translateY(-50%); opacity: 0.75; }
  #minimapWrap .compass.w { left: 4px; top: 50%; transform: translateY(-50%); opacity: 0.75; }
  #minimap {
    width: 100%; height: 100%;
    border-radius: 50%;
    display: block;
  }

  #hint {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.92);
    font-size: 14px;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    z-index: 10;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.6s ease;
    background: rgba(0,0,0,0.25);
    padding: 8px 16px;
    border-radius: 10px;
  }
  #hint.hide { opacity: 0; }

  #pauseBtn {
    position: fixed;
    bottom: 16px; left: 16px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    z-index: 10;
  }
  #pauseBtn.hide { display: none; }

  #menuOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20,18,16,0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.35s ease;
  }
  #menuOverlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .menuCard {
    background: rgba(32,29,27,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 34px 42px 28px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    max-width: 420px;
    color: #fff;
  }
  #menuTitle {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 6px;
    background: linear-gradient(180deg, #fff2b0 0%, #ff8a1f 45%, #d93a00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,90,20,0.45));
  }
  #menuTitle span { display: block; font-size: 0.5em; letter-spacing: 7px; }
  .menuSub {
    color: rgba(255,255,255,0.72);
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .menuStats {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 22px;
  }
  .menuStats span { font-size: 22px; font-weight: 800; display: block; }
  .menuStats small {
    display: block; font-size: 10px; opacity: 0.6; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase; margin-top: 2px;
  }
  #playBtn {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #2a1200;
    background: linear-gradient(180deg, #ffd27a, #ff7a1f);
    border: none;
    border-radius: 12px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,110,20,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #playBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,110,20,0.5), inset 0 1px 0 rgba(255,255,255,0.5); }
  #playBtn:active { transform: translateY(0); }
  .menuControlsInfo {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
  }
  .menuToggles {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .toggleBtn {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .toggleBtn.off { opacity: 0.45; }
</style>
</head>
<body>

<div id="hud">
  <div class="dist">0<span style="font-size:16px;">m</span></div>
  <div class="sub">distance traveled</div>
  <div class="best">best: 0m</div>
  <div class="heightBlock">
    <div class="height" id="heightVal">0.0<span style="font-size:13px;">m</span></div>
    <div class="sub">height off ground</div>
    <div class="best" id="heightBestVal">peak: 0.0m</div>
  </div>
</div>
<div id="saveFlash">SAVED</div>
<div id="minimapWrap">
  <div class="compass n">N</div>
  <div class="compass s">S</div>
  <div class="compass e">E</div>
  <div class="compass w">W</div>
  <canvas id="minimap" width="132" height="132"></canvas>
</div>
<div id="hint">WASD / Arrow Keys to move &nbsp;·&nbsp; SPACE to jump &nbsp;(double jump in air!)</div>
<button id="pauseBtn" title="Menu">☰</button>

<div id="menuOverlay">
  <div class="menuCard">
    <h1 id="menuTitle">FIRE<span>TRACKER</span></h1>
    <p class="menuSub">Roll a ball of fire. Leave a trail. Keep burning.</p>
    <div class="menuStats">
      <div><span id="menuBestDist">0m</span><small>best distance</small></div>
      <div><span id="menuBestHeight">0.0m</span><small>best height</small></div>
    </div>
    <button id="playBtn">▶ PLAY</button>
    <div class="menuControlsInfo">
      WASD / Arrow Keys — move &nbsp;·&nbsp; SPACE — jump (double jump!)
    </div>
    <div class="menuToggles">
      <button id="toggleMusic" class="toggleBtn">🎵 Music</button>
      <button id="toggleSfx" class="toggleBtn">🔊 SFX</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Renderer / Scene / Camera ----------
  const SKY_COLOR = 0xa8a8a8;
  const GROUND_COLOR = 0x8f8f8f;
  const GRID_COLOR = 0x707070;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 30, 110);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
  const cameraOffset = new THREE.Vector3(0, 6.5, 9.5);
  camera.position.copy(cameraOffset);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; // graceful highlight rolloff instead of hard-clipping to white
  renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Lighting ----------
  const hemi = new THREE.HemisphereLight(0xcfcfcf, 0x4a4a4a, 0.9);
  scene.add(hemi);

  const ambient = new THREE.AmbientLight(0xffffff, 0.35);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 40;
  sun.shadow.camera.left = -16;
  sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 16;
  sun.shadow.camera.bottom = -16;
  scene.add(sun);
  scene.add(sun.target);

  // ---------- Ground ----------
  const GROUND_SIZE = 400;
  const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
  const groundMat = new THREE.MeshStandardMaterial({ color: GROUND_COLOR, roughness: 1, metalness: 0 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(GROUND_SIZE, GROUND_SIZE / 4, GRID_COLOR, GRID_COLOR);
  grid.position.y = 0.01;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  // ---------- Ball ----------
  const RADIUS = 0.6;
  const ballGeo = new THREE.SphereGeometry(RADIUS, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.35, metalness: 0.15 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.castShadow = true;
  ball.position.set(0, RADIUS, 0);
  scene.add(ball);

  // ---------- Terrain: slopes, static platforms, moving platforms ----------
  // Everything here is a fixed, hand-placed layout - no randomness anywhere,
  // including the moving platforms, whose motion is a deterministic function
  // of elapsed time (sin/cos), so it's identical every playthrough.
  const terrainGroup = new THREE.Group();
  scene.add(terrainGroup);

  const SLOPE_MAT = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.95 });
  const PLATFORM_MAT = new THREE.MeshStandardMaterial({ color: 0xacacac, roughness: 0.9 });
  const MOVING_MAT = new THREE.MeshStandardMaterial({
    color: 0x8c7a63, roughness: 0.85, emissive: 0x2a1206, emissiveIntensity: 0.4
  });

  function makeSlope(xMin, xMax, zA, yA, zB, yB) {
    const width = xMax - xMin;
    const runZ = zB - zA;
    const riseY = yB - yA;
    const length = Math.hypot(runZ, riseY);
    const thickness = 0.5;
    const geo = new THREE.BoxGeometry(width, thickness, length);
    geo.translate(0, -thickness / 2, 0); // shift geometry origin onto the box's top face
    const mesh = new THREE.Mesh(geo, SLOPE_MAT);
    // align the box's local +Z (its "length" axis) to the actual 3D rise/run
    // direction, so the tilt is exactly right regardless of sign/quadrant
    const dir = new THREE.Vector3(0, riseY, runZ).normalize();
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    mesh.position.set((xMin + xMax) / 2, (yA + yB) / 2, (zA + zB) / 2);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    terrainGroup.add(mesh);

    return {
      xMin, xMax, zMin: Math.min(zA, zB), zMax: Math.max(zA, zB),
      heightAt(z) {
        const t = THREE.MathUtils.clamp((z - zA) / (zB - zA), 0, 1);
        return yA + (yB - yA) * t;
      }
    };
  }

  function makePlatform(xA, xB, zA, zB, y, thickness = 0.5) {
    // normalize so the hitbox works regardless of which order the edges were
    // given in (the course runs toward -Z, so callers pass "near, far" pairs)
    const xMin = Math.min(xA, xB), xMax = Math.max(xA, xB);
    const zMin = Math.min(zA, zB), zMax = Math.max(zA, zB);
    const geo = new THREE.BoxGeometry(xMax - xMin, thickness, zMax - zMin);
    const mesh = new THREE.Mesh(geo, PLATFORM_MAT);
    mesh.position.set((xMin + xMax) / 2, y - thickness / 2, (zMin + zMax) / 2);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    terrainGroup.add(mesh);
    return { xMin, xMax, zMin, zMax, y, yMin: y - thickness, yMax: y };
  }

  const WALL_MAT = new THREE.MeshStandardMaterial({ color: 0x7c7c7c, roughness: 0.9 });

  function makeWall(xA, xB, zA, zB, yBottom, yTop) {
    // a solid gray obstacle: blocks the ball on all sides (resolveWallCollision)
    // and can still be stood on top of like a platform (getSupport)
    const xMin = Math.min(xA, xB), xMax = Math.max(xA, xB);
    const zMin = Math.min(zA, zB), zMax = Math.max(zA, zB);
    const geo = new THREE.BoxGeometry(xMax - xMin, yTop - yBottom, zMax - zMin);
    const mesh = new THREE.Mesh(geo, WALL_MAT);
    mesh.position.set((xMin + xMax) / 2, (yBottom + yTop) / 2, (zMin + zMax) / 2);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    terrainGroup.add(mesh);
    return { xMin, xMax, zMin, zMax, y: yTop, yMin: yBottom, yMax: yTop };
  }

  function makeMovingPlatform(sizeX, sizeZ, thickness, pathFn) {
    const geo = new THREE.BoxGeometry(sizeX, thickness, sizeZ);
    const mesh = new THREE.Mesh(geo, MOVING_MAT);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    terrainGroup.add(mesh);
    const p0 = pathFn(0);
    const plat = {
      sizeX, sizeZ, thickness, mesh, path: pathFn,
      x: p0.x, y: p0.y, z: p0.z, prevX: p0.x, prevZ: p0.z, dx: 0, dz: 0
    };
    mesh.position.set(plat.x, plat.y - thickness / 2, plat.z);
    return plat;
  }

  // fixed course heading north (-Z, the way W/Up moves you) from spawn
  const SLOPES = [
    makeSlope(-3, 3, -6, 0, -14, 3.5),
    makeSlope(-3, 3, -20, 3.5, -27, 7.2),
    makeSlope(-3, 3, -64, 9, -70, 11)
  ];

  const STATIC_PLATFORMS = [
    makePlatform(-3, 3, -14, -20, 3.5),
    makePlatform(-3, 3, -27, -33, 7.2),
    makePlatform(-3, 3, -41, -47, 7.2),
    makePlatform(-3, 3, -58, -64, 9),
    makePlatform(-3, 3, -70, -74, 11),
    // floating "island" jump section - zigzagged, gapped just far enough
    // apart that you have to actually jump from one to the next
    makePlatform(-2.5, -0.5, -77, -79, 11),
    makePlatform(0.5, 2.5, -82, -84, 11),
    makePlatform(-2.5, -0.5, -87, -89, 11),
    makePlatform(0.5, 2.5, -92, -94, 11),
    makePlatform(-3, 3, -94, -100, 11),
    // grand finale
    makePlatform(-4, 4, -114, -120, 14)
  ];

  const WALLS = [
    // a low bar across platform2 - jump it, don't just walk through it
    makeWall(-3, 3, -29.3, -29.9, 7.2, 8.5),
    // a gate across platform3 with a gap you have to steer through
    makeWall(-3, -1, -44.3, -44.9, 7.2, 10.2),
    makeWall(1, 3, -44.3, -44.9, 7.2, 10.2)
  ];

  const MOVING_PLATFORMS = [
    // horizontal shuttle bridging the gap between the two z=7.2 platforms
    makeMovingPlatform(3, 3, 0.5, (t) => ({
      x: Math.sin(t * (Math.PI * 2 / 5)) * 4, y: 7.2, z: -38
    })),
    // vertical elevator carrying you up to the next platform
    makeMovingPlatform(4, 4, 0.5, (t) => ({
      x: 0, y: 5.5 + Math.sin(t * (Math.PI * 2 / 7)) * 3.5, z: -53.5
    })),
    // circular orbiter bridging the island section to the grand finale
    makeMovingPlatform(3.5, 3.5, 0.5, (t) => ({
      x: Math.sin(t * (Math.PI * 2 / 6)) * 3.5,
      y: 13,
      z: -107 + Math.cos(t * (Math.PI * 2 / 6)) * 3.5
    }))
  ];

  let platformTime = 0;
  function updateMovingPlatforms(t) {
    for (const p of MOVING_PLATFORMS) {
      p.prevX = p.x; p.prevZ = p.z;
      const pos = p.path(t);
      p.x = pos.x; p.y = pos.y; p.z = pos.z;
      p.dx = p.x - p.prevX;
      p.dz = p.z - p.prevZ;
      p.mesh.position.set(p.x, p.y - p.thickness / 2, p.z);
    }
  }

  // how far below a platform's top the ball's previous height can be and still
  // get caught landing on it (keeps the ball from teleporting up through one
  // it's actually passing underneath)
  const PLATFORM_CATCH_TOLERANCE = 0.45;

  function getSupport(x, z, prevY) {
    let bestY = 0; // base ground
    let bestPlatform = null;

    for (const s of SLOPES) {
      if (x >= s.xMin && x <= s.xMax && z >= s.zMin && z <= s.zMax) {
        const y = s.heightAt(z);
        if (y > bestY) { bestY = y; bestPlatform = null; }
      }
    }
    for (const p of STATIC_PLATFORMS) {
      if (x >= p.xMin && x <= p.xMax && z >= p.zMin && z <= p.zMax) {
        if (p.y > bestY && prevY + PLATFORM_CATCH_TOLERANCE >= p.y) { bestY = p.y; bestPlatform = null; }
      }
    }
    for (const p of MOVING_PLATFORMS) {
      // check against where the platform WAS this frame (matching the ball's
      // not-yet-carried position) so a fast-moving platform can't slip out
      // from under a hitbox check made against its post-move position
      const halfX = p.sizeX / 2, halfZ = p.sizeZ / 2;
      if (x >= p.prevX - halfX && x <= p.prevX + halfX && z >= p.prevZ - halfZ && z <= p.prevZ + halfZ) {
        if (p.y > bestY && prevY + PLATFORM_CATCH_TOLERANCE >= p.y) { bestY = p.y; bestPlatform = p; }
      }
    }
    for (const w of WALLS) {
      if (x >= w.xMin && x <= w.xMax && z >= w.zMin && z <= w.zMax) {
        if (w.y > bestY && prevY + PLATFORM_CATCH_TOLERANCE >= w.y) { bestY = w.y; bestPlatform = null; }
      }
    }
    return { y: bestY, platform: bestPlatform };
  }

  // pushes the ball back out of a solid box's side, so platforms/walls feel
  // solid instead of pass-through - only when the ball is roughly at the
  // obstacle's own height (not clearly above its top, which is landing, or
  // below its bottom, which just lets the ball pass underneath)
  function resolveWallCollision(box) {
    if (ball.position.y + RADIUS * 0.5 >= box.yMax) return;
    if (ball.position.y + RADIUS <= box.yMin) return;
    const cx = THREE.MathUtils.clamp(ball.position.x, box.xMin, box.xMax);
    const cz = THREE.MathUtils.clamp(ball.position.z, box.zMin, box.zMax);
    const dx = ball.position.x - cx, dz = ball.position.z - cz;
    const distSq = dx * dx + dz * dz;
    if (distSq < RADIUS * RADIUS) {
      const dist = Math.sqrt(distSq) || 0.0001;
      const overlap = RADIUS - dist;
      ball.position.x += (dx / dist) * overlap;
      ball.position.z += (dz / dist) * overlap;
    }
  }

  function applyWallCollisions() {
    for (const p of STATIC_PLATFORMS) resolveWallCollision(p);
    for (const w of WALLS) resolveWallCollision(w);
    for (const p of MOVING_PLATFORMS) {
      resolveWallCollision({
        xMin: p.x - p.sizeX / 2, xMax: p.x + p.sizeX / 2,
        zMin: p.z - p.sizeZ / 2, zMax: p.z + p.sizeZ / 2,
        yMin: p.y - p.thickness, yMax: p.y
      });
    }
  }

  // ---------- Fire trail ----------
  let gameTime = 0;

  function makeGlowTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,220,130,0.9)');
    g.addColorStop(0.7, 'rgba(255,120,30,0.5)');
    g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }
  const glowTex = makeGlowTexture();

  function makeScorchTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(25,12,6,0.9)');
    g.addColorStop(0.55, 'rgba(35,18,10,0.55)');
    g.addColorStop(1, 'rgba(35,18,10,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const scorchTex = makeScorchTexture();

  const MAX_TRAIL = 320;
  const MAX_SCORCH = 500;
  const trail = []; // { core, outer, age, maxAge }
  const scorches = []; // { mesh, age, maxAge }
  let distSinceEmit = Infinity;
  const EMIT_SPACING = 0.22;

  // breadcrumb path used to draw the minimap trail (independent of the
  // fading fire sprites, so the map keeps a longer memory of where you went)
  const pathHistory = [];
  const MINIMAP_HISTORY_SECONDS = 90;

  function spawnTrailPoint(x, y, z) {
    // trail hovers just beneath wherever the ball actually is - hugging the
    // ground while rolling, but rising to follow it through the air on a jump
    const baseY = (y - RADIUS) + 0.06;

    const outerMat = new THREE.SpriteMaterial({
      map: glowTex, color: 0xff5a1a, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const outer = new THREE.Sprite(outerMat);
    outer.position.set(x, baseY, z);
    outer.scale.set(1.3, 1.3, 1);
    scene.add(outer);

    const coreMat = new THREE.SpriteMaterial({
      map: glowTex, color: 0xfff2b0, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const core = new THREE.Sprite(coreMat);
    core.position.set(x, baseY + 0.04, z);
    core.scale.set(0.65, 0.65, 1);
    scene.add(core);

    trail.push({ outer, core, age: 0, maxAge: 1.6 + Math.random() * 0.8, baseY });
    pathHistory.push({ x, z, t: gameTime });

    if (trail.length > MAX_TRAIL) {
      const old = trail.shift();
      scene.remove(old.outer, old.core);
      old.outer.material.dispose();
      old.core.material.dispose();
    }

    // lingering ash mark left behind by the trail - burned flat into the
    // ground while rolling, or a floating fleck of ash tracing the jump arc
    // through the air, so the whole track (not just the ground) keeps a trace
    const grounded = y <= RADIUS + 0.1;
    let ash;
    if (grounded) {
      const scorchGeo = new THREE.CircleGeometry(0.5 + Math.random() * 0.15, 16);
      const scorchMat = new THREE.MeshBasicMaterial({
        map: scorchTex, transparent: true, opacity: 0.85, depthWrite: false,
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
      });
      ash = new THREE.Mesh(scorchGeo, scorchMat);
      ash.rotation.x = -Math.PI / 2;
      ash.rotation.z = Math.random() * Math.PI * 2;
      ash.position.set(x, 0.02, z);
    } else {
      const ashMat = new THREE.SpriteMaterial({
        map: scorchTex, color: 0x8a7c72, transparent: true, opacity: 0.6,
        blending: THREE.NormalBlending, depthWrite: false
      });
      ash = new THREE.Sprite(ashMat);
      ash.scale.set(0.55 + Math.random() * 0.2, 0.55 + Math.random() * 0.2, 1);
      ash.position.set(x, baseY, z);
    }
    scene.add(ash);
    scorches.push({ mesh: ash, age: 0, maxAge: grounded ? 7 + Math.random() * 3 : 3.5 + Math.random() * 1.5 });

    // a bit of smoke curling up off the burning trail
    if (Math.random() < 0.45) {
      spawnSmoke(x, baseY + 0.15, z, true);
    }

    if (scorches.length > MAX_SCORCH) {
      const old = scorches.shift();
      scene.remove(old.mesh);
      if (old.mesh.isMesh) old.mesh.geometry.dispose(); // sprites share one static geometry - never dispose it
      old.mesh.material.dispose();
    }
  }

  const colorNew = new THREE.Color(0xff5a1a);
  const colorMid = new THREE.Color(0xd93a00);
  const colorOld = new THREE.Color(0x3a1a10);

  function updateTrail(dt) {
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      p.age += dt;
      const t = p.age / p.maxAge;
      if (t >= 1) {
        scene.remove(p.outer, p.core);
        p.outer.material.dispose();
        p.core.material.dispose();
        trail.splice(i, 1);
        continue;
      }
      // flicker + grow then shrink
      const flick = 0.85 + Math.sin(p.age * 18 + i) * 0.15;
      const growth = t < 0.3 ? (t / 0.3) : 1 - (t - 0.3) / 0.7;
      const s = (1.3 + growth * 0.6) * flick;
      p.outer.scale.set(s, s, 1);
      p.core.scale.set(s * 0.5, s * 0.5, 1);

      p.outer.material.opacity = (1 - t);
      p.core.material.opacity = Math.max(0, 1 - t * 1.6);

      const col = t < 0.5
        ? colorNew.clone().lerp(colorMid, t / 0.5)
        : colorMid.clone().lerp(colorOld, (t - 0.5) / 0.5);
      p.outer.material.color.copy(col);

      p.outer.position.y = p.baseY + t * 0.4;
      p.core.position.y = p.baseY + 0.04 + t * 0.5;
    }

    for (let i = scorches.length - 1; i >= 0; i--) {
      const s = scorches[i];
      s.age += dt;
      const t = s.age / s.maxAge;
      if (t >= 1) {
        scene.remove(s.mesh);
        if (s.mesh.isMesh) s.mesh.geometry.dispose(); // sprites share one static geometry - never dispose it
        s.mesh.material.dispose();
        scorches.splice(i, 1);
        continue;
      }
      // hold strong, then fade out over the last third of its life
      s.mesh.material.opacity = 0.85 * (t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4);
    }
  }

  // ---------- Fire aura (the ball itself is on fire) ----------
  const auraAnchor = new THREE.Group();
  scene.add(auraAnchor);

  const auraLight = new THREE.PointLight(0xff7a1f, 1.4, 7, 2);
  auraLight.position.set(0, 0.1, 0);
  auraAnchor.add(auraLight);

  const AURA_COUNT = 12;
  const auraParticles = [];
  for (let i = 0; i < AURA_COUNT; i++) {
    const isCore = i % 3 === 0;
    const mat = new THREE.SpriteMaterial({
      map: glowTex,
      color: isCore ? 0xfff0a0 : 0xff5a1a,
      transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const sprite = new THREE.Sprite(mat);
    const baseScale = isCore ? 0.4 : 0.6;
    sprite.scale.set(baseScale, baseScale, 1);
    auraAnchor.add(sprite);
    auraParticles.push({
      sprite,
      baseScale,
      angle: (i / AURA_COUNT) * Math.PI * 2 + Math.random() * 0.6,
      speed: (0.5 + Math.random() * 0.7) * (Math.random() < 0.5 ? 1 : -1),
      radius: RADIUS * (0.55 + Math.random() * 0.5),
      heightBase: (Math.random() - 0.35) * RADIUS * 1.4,
      phase: Math.random() * Math.PI * 2
    });
  }

  function updateAura(t) {
    auraAnchor.position.copy(ball.position);
    auraLight.intensity = 1.3 + Math.sin(t * 22) * 0.35 + Math.sin(t * 7.3) * 0.15;

    for (const p of auraParticles) {
      const ang = p.angle + t * p.speed;
      const flick = 0.8 + Math.sin(t * 12 + p.phase) * 0.2;
      p.sprite.position.set(
        Math.cos(ang) * p.radius * flick,
        p.heightBase + Math.sin(t * 3.5 + p.phase) * 0.12,
        Math.sin(ang) * p.radius * flick
      );
      const s = p.baseScale * flick;
      p.sprite.scale.set(s, s, 1);
      p.sprite.material.opacity = 0.7 + Math.sin(t * 15 + p.phase) * 0.25;
    }
  }

  // ---------- Smoke ----------
  function makeSmokeTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, 'rgba(90,86,82,0.75)');
    g.addColorStop(0.5, 'rgba(70,66,62,0.4)');
    g.addColorStop(1, 'rgba(60,56,52,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const smokeTex = makeSmokeTexture();

  const MAX_SMOKE = 160;
  const smoke = []; // { sprite, age, maxAge, vx, vz, rise, spin }

  function spawnSmoke(x, y, z, big) {
    const mat = new THREE.SpriteMaterial({
      map: smokeTex, color: 0x555049, transparent: true, opacity: 0.55,
      blending: THREE.NormalBlending, depthWrite: false, rotation: Math.random() * Math.PI * 2
    });
    const sprite = new THREE.Sprite(mat);
    const baseScale = big ? 0.5 : 0.3;
    sprite.scale.set(baseScale, baseScale, 1);
    sprite.position.set(x, y, z);
    scene.add(sprite);

    smoke.push({
      sprite, age: 0, maxAge: 2.2 + Math.random() * 1.6,
      baseScale,
      vx: (Math.random() - 0.5) * 0.5,
      vz: (Math.random() - 0.5) * 0.5,
      rise: 0.6 + Math.random() * 0.5,
      spin: (Math.random() - 0.5) * 1.2
    });

    if (smoke.length > MAX_SMOKE) {
      const old = smoke.shift();
      scene.remove(old.sprite);
      old.sprite.material.dispose();
    }
  }

  function updateSmoke(dt) {
    for (let i = smoke.length - 1; i >= 0; i--) {
      const s = smoke[i];
      s.age += dt;
      const t = s.age / s.maxAge;
      if (t >= 1) {
        scene.remove(s.sprite);
        s.sprite.material.dispose();
        smoke.splice(i, 1);
        continue;
      }
      s.sprite.position.x += s.vx * dt;
      s.sprite.position.z += s.vz * dt;
      s.sprite.position.y += s.rise * dt * (1 - t * 0.4);
      s.sprite.material.rotation += s.spin * dt;

      const scaleGrow = s.baseScale * (1 + t * 2.4);
      s.sprite.scale.set(scaleGrow, scaleGrow, 1);
      // fades in quickly, lingers, then dissolves
      s.sprite.material.opacity = 0.55 * (t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85);
    }
  }

  // a steady wisp of smoke rising off the ball itself, like it's smoldering
  let smokeEmitTimer = 0;
  function emitBallSmoke(dt) {
    smokeEmitTimer -= dt;
    if (smokeEmitTimer <= 0) {
      smokeEmitTimer = 0.18 + Math.random() * 0.14;
      const a = Math.random() * Math.PI * 2;
      spawnSmoke(
        ball.position.x + Math.cos(a) * RADIUS * 0.3,
        ball.position.y + RADIUS * 0.7,
        ball.position.z + Math.sin(a) * RADIUS * 0.3,
        false
      );
    }
  }

  // ---------- Minimap ----------
  const minimapCanvas = document.getElementById('minimap');
  const mmCtx = minimapCanvas.getContext('2d');
  const MM_SIZE = minimapCanvas.width;
  const MM_VIEW_RADIUS = 24; // world units shown from center to edge
  const MM_SCALE = (MM_SIZE / 2 - 6) / MM_VIEW_RADIUS;

  function drawMinimap() {
    mmCtx.clearRect(0, 0, MM_SIZE, MM_SIZE);
    mmCtx.save();
    mmCtx.beginPath();
    mmCtx.arc(MM_SIZE / 2, MM_SIZE / 2, MM_SIZE / 2, 0, Math.PI * 2);
    mmCtx.clip();

    mmCtx.fillStyle = 'rgba(60,60,60,0.5)';
    mmCtx.fillRect(0, 0, MM_SIZE, MM_SIZE);

    const cx = MM_SIZE / 2, cy = MM_SIZE / 2;
    const bx = ball.position.x, bz = ball.position.z;

    // world boundary walls, if within view
    const half = GROUND_SIZE / 2 - 1;
    mmCtx.strokeStyle = 'rgba(255,255,255,0.55)';
    mmCtx.lineWidth = 2;
    const edges = [
      [-half, -half, half, -half],
      [half, -half, half, half],
      [half, half, -half, half],
      [-half, half, -half, -half]
    ];
    for (const [x1, z1, x2, z2] of edges) {
      mmCtx.beginPath();
      mmCtx.moveTo(cx + (x1 - bx) * MM_SCALE, cy + (z1 - bz) * MM_SCALE);
      mmCtx.lineTo(cx + (x2 - bx) * MM_SCALE, cy + (z2 - bz) * MM_SCALE);
      mmCtx.stroke();
    }

    // breadcrumb fire trail, fading with age
    for (let i = 0; i < pathHistory.length; i++) {
      const p = pathHistory[i];
      const age = gameTime - p.t;
      if (age > MINIMAP_HISTORY_SECONDS) continue;
      const dx = (p.x - bx) * MM_SCALE;
      const dz = (p.z - bz) * MM_SCALE;
      if (dx * dx + dz * dz > (MM_SIZE / 2) * (MM_SIZE / 2)) continue;
      const alpha = 1 - age / MINIMAP_HISTORY_SECONDS;
      mmCtx.fillStyle = `rgba(255,110,30,${(alpha * 0.85).toFixed(3)})`;
      mmCtx.beginPath();
      mmCtx.arc(cx + dx, cy + dz, 2, 0, Math.PI * 2);
      mmCtx.fill();
    }

    // facing/heading indicator (drawn under the dot)
    const speed = Math.hypot(velocity.x, velocity.z);
    if (speed > 0.3) {
      const heading = Math.atan2(velocity.x, velocity.z);
      const tipX = cx + Math.sin(heading) * 12;
      const tipY = cy + Math.cos(heading) * 12;
      mmCtx.beginPath();
      mmCtx.moveTo(tipX, tipY);
      mmCtx.lineTo(cx + Math.sin(heading + 2.5) * 5, cy + Math.cos(heading + 2.5) * 5);
      mmCtx.lineTo(cx + Math.sin(heading - 2.5) * 5, cy + Math.cos(heading - 2.5) * 5);
      mmCtx.closePath();
      mmCtx.fillStyle = 'rgba(255,180,60,0.95)';
      mmCtx.fill();
    }

    // player marker (black dot with white ring, matching the ball)
    mmCtx.beginPath();
    mmCtx.arc(cx, cy, 5, 0, Math.PI * 2);
    mmCtx.fillStyle = '#0a0a0a';
    mmCtx.fill();
    mmCtx.lineWidth = 2;
    mmCtx.strokeStyle = '#ffffff';
    mmCtx.stroke();

    mmCtx.restore();
  }

  // ---------- Audio (all procedurally synthesized - filtered noise & soft sine
  // partials rather than raw square/saw oscillators, so nothing buzzes or
  // sounds "electric"; a warm ambient pad + real fire-crackle noise instead) ----------
  const SoundFX = (() => {
    let ctx = null;
    let master, musicGain, sfxGain, wetGain, padBus;
    let musicOn = true, sfxOn = true;
    let crackleTimer = 0.3;

    try {
      musicOn = localStorage.getItem('fireTracker_musicOn') !== '0';
      sfxOn = localStorage.getItem('fireTracker_sfxOn') !== '0';
    } catch (e) {}

    function makeImpulse(seconds, decay) {
      const rate = ctx.sampleRate;
      const length = Math.floor(rate * seconds);
      const buf = ctx.createBuffer(2, length, rate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }
      return buf;
    }

    function makeNoiseBuffer(seconds) {
      const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
      const buf = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }

    function init() {
      if (ctx) return;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume().catch(() => {});

      master = ctx.createGain();
      master.gain.value = 1;
      master.connect(ctx.destination);

      musicGain = ctx.createGain();
      musicGain.gain.value = musicOn ? 0.32 : 0;
      musicGain.connect(master);

      sfxGain = ctx.createGain();
      sfxGain.gain.value = sfxOn ? 0.9 : 0;
      sfxGain.connect(master);

      // soft room reverb for the music pad only, so it feels spacious rather
      // than like a dry synth tone
      const convolver = ctx.createConvolver();
      convolver.buffer = makeImpulse(2.4, 3);
      wetGain = ctx.createGain();
      wetGain.gain.value = 0.3;
      convolver.connect(wetGain);
      wetGain.connect(musicGain);

      padBus = ctx.createGain();
      padBus.gain.value = 1;
      padBus.connect(musicGain);
      padBus.connect(convolver);

      startMusic();
      startFireAmbience();
    }

    function startMusic() {
      // warm, slowly breathing minor pad - sine waves only, individually
      // detuned and swelled so it never locks into a static "electric" drone
      const notes = [73.42, 110.0, 146.83, 174.61]; // D2 A2 D3 F3
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;

        const detuneLfo = ctx.createOscillator();
        detuneLfo.frequency.value = 0.05 + Math.random() * 0.05;
        const detuneGain = ctx.createGain();
        detuneGain.gain.value = 6 + Math.random() * 5;
        detuneLfo.connect(detuneGain);
        detuneGain.connect(osc.detune);
        detuneLfo.start();

        const voiceGain = ctx.createGain();
        voiceGain.gain.value = 0.06;
        const swell = ctx.createOscillator();
        swell.type = 'sine';
        swell.frequency.value = 0.04 + i * 0.011;
        const swellGain = ctx.createGain();
        swellGain.gain.value = 0.045;
        swell.connect(swellGain);
        swellGain.connect(voiceGain.gain);
        swell.start();

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 700;
        filter.Q.value = 0.3;

        osc.connect(voiceGain);
        voiceGain.connect(filter);
        filter.connect(padBus);
        osc.start();
      });

      const wetLfo = ctx.createOscillator();
      wetLfo.frequency.value = 0.02;
      const wetLfoGain = ctx.createGain();
      wetLfoGain.gain.value = 0.1;
      wetLfo.connect(wetLfoGain);
      wetLfoGain.connect(wetGain.gain);
      wetLfo.start();
    }

    function startFireAmbience() {
      // continuous filtered-noise hiss, like a campfire bed, sitting under crackle pops
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(3);
      src.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 900;
      filter.Q.value = 0.6;

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.13;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 350;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start();

      const gain = ctx.createGain();
      gain.gain.value = 0.05;

      src.connect(filter);
      filter.connect(gain);
      gain.connect(sfxGain);
      src.start();
    }

    function playCracklePop() {
      if (!ctx || !sfxOn) return;
      const now = ctx.currentTime;
      const dur = 0.05 + Math.random() * 0.05;
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(dur);
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200 + Math.random() * 2500;
      const g = ctx.createGain();
      const peak = 0.05 + Math.random() * 0.06;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(peak, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(sfxGain);
      src.start(now);
      src.stop(now + dur + 0.02);
    }

    function updateCrackle(dt) {
      if (!ctx) return;
      crackleTimer -= dt;
      if (crackleTimer <= 0) {
        crackleTimer = 0.15 + Math.random() * 0.4;
        if (Math.random() < 0.8) playCracklePop();
      }
    }

    function playJump(double) {
      if (!ctx || !sfxOn) return;
      const now = ctx.currentTime;
      const dur = double ? 0.3 : 0.24;

      // airy whoosh - a bandpass sweep through noise, not a synth beep
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(dur);
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.9;
      filter.frequency.setValueAtTime(double ? 500 : 350, now);
      filter.frequency.exponentialRampToValueAtTime(double ? 1900 : 1100, now + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(double ? 0.32 : 0.26, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(sfxGain);
      src.start(now);
      src.stop(now + dur + 0.02);

      // soft low body underneath, like a puff of air/fire launching
      const bodySrc = ctx.createBufferSource();
      bodySrc.buffer = makeNoiseBuffer(0.12);
      const bodyFilter = ctx.createBiquadFilter();
      bodyFilter.type = 'lowpass';
      bodyFilter.frequency.value = 220;
      const bodyGain = ctx.createGain();
      bodyGain.gain.setValueAtTime(0.13, now);
      bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      bodySrc.connect(bodyFilter);
      bodyFilter.connect(bodyGain);
      bodyGain.connect(sfxGain);
      bodySrc.start(now);
      bodySrc.stop(now + 0.14);
    }

    function playLand(impactSpeed) {
      if (!ctx || !sfxOn) return;
      const now = ctx.currentTime;
      const strength = Math.min(1, impactSpeed / 14);
      const dur = 0.16 + strength * 0.06;
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(dur);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 150 + strength * 90;
      const g = ctx.createGain();
      const peak = 0.08 + strength * 0.18;
      g.gain.setValueAtTime(peak, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(sfxGain);
      src.start(now);
      src.stop(now + dur + 0.02);
    }

    function playSave() {
      if (!ctx || !sfxOn) return;
      const now = ctx.currentTime;
      [660, 990].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2200;
        const g = ctx.createGain();
        const delay = i * 0.05;
        g.gain.setValueAtTime(0, now + delay);
        g.gain.linearRampToValueAtTime(0.15 - i * 0.05, now + delay + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.9);
        osc.connect(filter);
        filter.connect(g);
        g.connect(sfxGain);
        osc.start(now + delay);
        osc.stop(now + delay + 0.95);
      });
    }

    function setMusicOn(v) {
      musicOn = v;
      try { localStorage.setItem('fireTracker_musicOn', v ? '1' : '0'); } catch (e) {}
      if (musicGain) musicGain.gain.linearRampToValueAtTime(v ? 0.32 : 0, ctx.currentTime + 0.3);
    }
    function setSfxOn(v) {
      sfxOn = v;
      try { localStorage.setItem('fireTracker_sfxOn', v ? '1' : '0'); } catch (e) {}
      if (sfxGain) sfxGain.gain.linearRampToValueAtTime(v ? 0.9 : 0, ctx.currentTime + 0.3);
    }
    function duck(isDucked) {
      if (!ctx) return;
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.linearRampToValueAtTime(isDucked ? 0.35 : 1, now + 0.4);
    }

    return {
      init, updateCrackle, playJump, playLand, playSave, duck,
      isMusicOn: () => musicOn, isSfxOn: () => sfxOn,
      setMusicOn, setSfxOn
    };
  })();

  // ---------- Main menu / pause ----------
  let paused = true;
  let gameStarted = false;

  function refreshMenuStats() {
    document.getElementById('menuBestDist').textContent = Math.round(bestDistance) + 'm';
    document.getElementById('menuBestHeight').textContent = bestHeight.toFixed(1) + 'm';
  }

  function setToggleLabel(btn, on, label) {
    btn.textContent = label + (on ? '' : ': off');
    btn.classList.toggle('off', !on);
  }

  const menuOverlay = document.getElementById('menuOverlay');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const toggleMusicBtn = document.getElementById('toggleMusic');
  const toggleSfxBtn = document.getElementById('toggleSfx');

  setToggleLabel(toggleMusicBtn, SoundFX.isMusicOn(), '🎵 Music');
  setToggleLabel(toggleSfxBtn, SoundFX.isSfxOn(), '🔊 SFX');

  playBtn.addEventListener('click', () => {
    SoundFX.init();
    SoundFX.duck(false);
    paused = false;
    gameStarted = true;
    menuOverlay.classList.add('hide');
    playBtn.textContent = '▶ PLAY';
  });

  pauseBtn.addEventListener('click', () => {
    if (!gameStarted) return;
    paused = true;
    SoundFX.duck(true);
    refreshMenuStats();
    playBtn.textContent = '▶ RESUME';
    menuOverlay.classList.remove('hide');
  });

  toggleMusicBtn.addEventListener('click', () => {
    const on = !SoundFX.isMusicOn();
    SoundFX.setMusicOn(on);
    setToggleLabel(toggleMusicBtn, on, '🎵 Music');
  });
  toggleSfxBtn.addEventListener('click', () => {
    const on = !SoundFX.isSfxOn();
    SoundFX.setSfxOn(on);
    setToggleLabel(toggleSfxBtn, on, '🔊 SFX');
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && gameStarted) {
      if (paused) playBtn.click(); else pauseBtn.click();
    }
  });

  // ---------- Input ----------
  const keys = Object.create(null);
  const MOVE_KEYS = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
  let hintHidden = false;
  window.addEventListener('keydown', (e) => {
    if (MOVE_KEYS.has(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (!hintHidden) {
      hintHidden = true;
      document.getElementById('hint').classList.add('hide');
    }
    if (e.code === 'Space' && !paused) tryJump();
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  // ---------- Movement / physics ----------
  const velocity = new THREE.Vector3(0, 0, 0);
  const MOVE_ACCEL = 45;
  const MAX_SPEED = 9;
  const FRICTION = 10;
  const GRAVITY = -28;
  const JUMP_SPEED = 9.5;
  const MAX_JUMPS = 2;
  let velY = 0;
  let grounded = true;
  let jumpsUsed = 0;

  function tryJump() {
    if (jumpsUsed < MAX_JUMPS) {
      const isDouble = jumpsUsed === 1;
      velY = JUMP_SPEED;
      grounded = false;
      jumpsUsed++;
      SoundFX.playJump(isDouble);
    }
  }

  let totalDistance = 0;
  let bestDistance = 0;
  let bestHeight = 0;
  try {
    bestDistance = parseFloat(localStorage.getItem('fireTracker_best') || '0') || 0;
    bestHeight = parseFloat(localStorage.getItem('fireTracker_bestHeight') || '0') || 0;
  } catch (e) {}
  document.querySelector('#hud .best').textContent = 'best: ' + Math.round(bestDistance) + 'm';
  document.getElementById('heightBestVal').textContent = 'peak: ' + bestHeight.toFixed(1) + 'm';
  refreshMenuStats();

  function saveProgress() {
    if (!gameStarted) return;
    try {
      localStorage.setItem('fireTracker_best', String(bestDistance));
      localStorage.setItem('fireTracker_bestHeight', String(bestHeight));
      const flash = document.getElementById('saveFlash');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 900);
      SoundFX.playSave();
    } catch (e) {}
  }
  setInterval(saveProgress, 30000);

  const distEl = document.querySelector('#hud .dist');
  const bestEl = document.querySelector('#hud .best');
  const heightEl = document.getElementById('heightVal');
  const heightBestEl = document.getElementById('heightBestVal');

  // ---------- Main loop ----------
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    gameTime += dt;
    SoundFX.updateCrackle(dt);

    if (!paused) {
      // input direction (world-space, camera looks from a fixed rear offset)
      let ix = 0, iz = 0;
      if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
      if (keys['KeyW'] || keys['ArrowUp']) iz -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) iz += 1;

      const inputVec = new THREE.Vector2(ix, iz);
      if (inputVec.lengthSq() > 0) {
        inputVec.normalize();
        velocity.x += inputVec.x * MOVE_ACCEL * dt;
        velocity.z += inputVec.y * MOVE_ACCEL * dt;
      } else {
        // friction
        const speed = Math.hypot(velocity.x, velocity.z);
        if (speed > 0) {
          const drop = Math.min(speed, FRICTION * dt);
          const scale = (speed - drop) / speed;
          velocity.x *= scale;
          velocity.z *= scale;
        }
      }
      const horizSpeed = Math.hypot(velocity.x, velocity.z);
      if (horizSpeed > MAX_SPEED) {
        const scale = MAX_SPEED / horizSpeed;
        velocity.x *= scale;
        velocity.z *= scale;
      }

      const prevX = ball.position.x, prevY = ball.position.y, prevZ = ball.position.z;
      const wasGrounded = grounded;

      // advance moving platforms on the game clock (deterministic, not random)
      platformTime += dt;
      updateMovingPlatforms(platformTime);

      // move horizontally first, so ground/slope/platform support is checked
      // at the ball's new position
      ball.position.x += velocity.x * dt;
      ball.position.z += velocity.z * dt;

      // keep on the ground plane
      const half = GROUND_SIZE / 2 - 1;
      ball.position.x = Math.max(-half, Math.min(half, ball.position.x));
      ball.position.z = Math.max(-half, Math.min(half, ball.position.z));

      // block the ball on platform/wall sides instead of letting it clip through
      applyWallCollisions();

      const support = getSupport(ball.position.x, ball.position.z, prevY);

      // gravity / vertical
      velY += GRAVITY * dt;
      ball.position.y += velY * dt;
      if (ball.position.y <= support.y + RADIUS) {
        const impactSpeed = Math.abs(velY);
        ball.position.y = support.y + RADIUS;
        velY = 0;
        grounded = true;
        jumpsUsed = 0;
        if (!wasGrounded) SoundFX.playLand(impactSpeed);
        if (support.platform) {
          // ride along with a moving platform
          ball.position.x += support.platform.dx;
          ball.position.z += support.platform.dz;
        }
      } else {
        grounded = false;
      }

      // rolling animation: rotate ball based on travel
      const moveDist = Math.hypot(ball.position.x - prevX, ball.position.z - prevZ);
      if (moveDist > 0) {
        const axis = new THREE.Vector3(-(ball.position.z - prevZ), 0, (ball.position.x - prevX)).normalize();
        const angle = moveDist / RADIUS;
        ball.rotateOnWorldAxis(axis, angle);
        totalDistance += moveDist;
      }
      // use full 3D movement (including straight-up/down jumps) so the trail
      // still follows the ball into the air even with no horizontal input
      distSinceEmit += Math.hypot(moveDist, ball.position.y - prevY);

      // spawn fire trail based on distance traveled
      if (distSinceEmit >= EMIT_SPACING) {
        distSinceEmit = 0;
        spawnTrailPoint(ball.position.x, ball.position.y, ball.position.z);
      }
    }

    updateTrail(dt);
    updateAura(gameTime);
    emitBallSmoke(dt);
    updateSmoke(dt);

    // drop old minimap breadcrumbs so the map only remembers recent history
    while (pathHistory.length && gameTime - pathHistory[0].t > MINIMAP_HISTORY_SECONDS) {
      pathHistory.shift();
    }
    drawMinimap();

    // camera follow (fixed rear/above offset, smoothed)
    const targetCamPos = ball.position.clone().add(cameraOffset);
    camera.position.lerp(targetCamPos, 1 - Math.pow(0.001, dt));
    const lookTarget = ball.position.clone().add(new THREE.Vector3(0, 0.8, 0));
    camera.lookAt(lookTarget);

    // move the sun with the ball so shadows stay in frame over the big ground
    sun.position.set(ball.position.x + 8, ball.position.y + 15, ball.position.z + 10);
    sun.target.position.copy(ball.position);

    // HUD
    if (totalDistance > bestDistance) bestDistance = totalDistance;
    distEl.innerHTML = Math.round(totalDistance) + '<span style="font-size:16px;">m</span>';
    bestEl.textContent = 'best: ' + Math.round(bestDistance) + 'm';

    const currentHeight = Math.max(0, ball.position.y - RADIUS);
    if (currentHeight > bestHeight) bestHeight = currentHeight;
    heightEl.innerHTML = currentHeight.toFixed(1) + '<span style="font-size:13px;">m</span>';
    heightBestEl.textContent = 'peak: ' + bestHeight.toFixed(1) + 'm';

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
