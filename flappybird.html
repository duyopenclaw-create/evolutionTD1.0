<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #eee;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const W = 400;
    const H = 600;
    canvas.width = W;
    canvas.height = H;

    // --- Audio ---
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playCoinSound() {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.type = 'sine';
      const t = ac.currentTime;
      osc.frequency.setValueAtTime(988, t);
      osc.frequency.setValueAtTime(1319, t + 0.08);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t);
      osc.stop(t + 0.25);
    }

    function playJumpSound() {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.type = 'sine';
      const t = ac.currentTime;
      osc.frequency.setValueAtTime(350, t);
      osc.frequency.exponentialRampToValueAtTime(600, t + 0.08);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.1);
    }

    function playGameOverSound() {
      const ac = getAudio();
      [494, 370, 311, 247].forEach((freq, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.type = 'sawtooth';
        const t = ac.currentTime + i * 0.18;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.start(t);
        osc.stop(t + 0.18);
      });
    }

    // --- Background music ---
    let musicPlaying = false;
    let musicTimeoutId = null;

    const SONGS = [
      // Map 0 — Night: mysterious, mid-tempo
      { bpm: 160,
        melody: { type: 'triangle', vol: 0.03, seq: [
          [523,0.5],[659,0.5],[784,0.5],[880,0.5],
          [784,0.5],[659,0.5],[784,0.5],[659,0.5],
          [523,0.5],[587,0.5],[659,0.5],[784,0.5],
          [659,1],[523,1],
          [880,0.5],[784,0.5],[659,0.5],[523,0.5],
          [587,0.5],[659,0.5],[784,0.5],[659,0.5],
          [523,0.5],[440,0.5],[392,0.5],[440,0.5],
          [523,2],
        ]},
        bass: { type: 'square', vol: 0.012, seq: [
          [262,2],[330,2],[262,2],[392,2],
          [349,2],[262,2],[392,2],[262,2],
        ]},
      },
      // Map 1 — Day: bright, upbeat, major key
      { bpm: 172,
        melody: { type: 'triangle', vol: 0.035, seq: [
          [523,0.5],[659,0.5],[784,0.5],[1047,0.5],
          [988,0.5],[784,0.5],[659,0.5],[523,0.5],
          [659,0.5],[784,0.5],[880,0.5],[784,0.5],
          [698,1],[659,1],
          [784,0.5],[659,0.5],[587,0.5],[659,0.5],
          [784,0.5],[880,0.5],[988,0.5],[1047,0.5],
          [880,0.5],[784,0.5],[698,0.5],[659,0.5],
          [523,2],
        ]},
        bass: { type: 'square', vol: 0.015, seq: [
          [262,1],[196,1],[262,1],[196,1],
          [220,1],[330,1],[175,1],[196,1],
          [262,1],[196,1],[175,1],[262,1],
          [196,1],[330,1],[262,2],
        ]},
      },
      // Map 2 — Space: slow, ambient, minor key
      { bpm: 82,
        melody: { type: 'sine', vol: 0.07, seq: [
          [440,2],[523,2],[659,2],[587,2],
          [523,2],[494,2],[440,4],
          [392,2],[349,2],[330,2],[392,2],
          [440,2],[659,2],[440,4],
        ]},
        bass: { type: 'sine', vol: 0.04, seq: [
          [220,4],[165,4],[147,4],[220,4],
          [175,4],[131,4],[196,4],[220,4],
        ]},
      },
      // Map 3 — Lava: intense, driving, minor key
      { bpm: 148,
        melody: { type: 'sawtooth', vol: 0.022, seq: [
          [220,0.5],[196,0.5],[220,0.5],[247,0.5],
          [220,1],[175,1],
          [247,0.5],[220,0.5],[247,0.5],[277,0.5],
          [247,1],[220,1],
          [330,0.5],[311,0.5],[277,0.5],[247,0.5],
          [220,0.5],[196,0.5],[175,0.5],[196,0.5],
          [220,0.5],[247,0.5],[220,0.5],[196,0.5],
          [175,2],
        ]},
        bass: { type: 'square', vol: 0.015, seq: [
          [110,1],[110,1],[98,2],
          [123,1],[110,1],[98,2],
          [110,2],[123,2],
          [98,2],[110,2],
        ]},
      },
    ];

    function scheduleTrack(ac, seq, type, vol, beat, startTime) {
      let t = startTime;
      for (const [freq, beats] of seq) {
        const dur = beats * beat;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.85);
        osc.start(t);
        osc.stop(t + dur);
        t += dur;
      }
      return t - startTime;
    }

    function startMusic() {
      if (musicPlaying) return;
      musicPlaying = true;
      const ac = getAudio();
      const song = SONGS[currentMap];
      const beat = 60 / song.bpm;
      let nextStart = ac.currentTime + 0.05;
      function loop() {
        if (!musicPlaying) return;
        const dur = scheduleTrack(ac, song.melody.seq, song.melody.type, song.melody.vol, beat, nextStart);
        scheduleTrack(ac, song.bass.seq, song.bass.type, song.bass.vol, beat, nextStart);
        nextStart += dur;
        musicTimeoutId = setTimeout(loop, (nextStart - ac.currentTime - 0.15) * 1000);
      }
      loop();
    }

    function stopMusic() {
      musicPlaying = false;
      if (musicTimeoutId) { clearTimeout(musicTimeoutId); musicTimeoutId = null; }
    }

    function restartMusic() {
      stopMusic();
      startMusic();
    }

    // --- Constants ---
    const GRAVITY = 0.5;
    const JUMP_FORCE = -9;
    const PIPE_WIDTH = 60;

    // --- Difficulty ---
    const DIFFICULTIES = {
      easy:   { label: 'Easy',   color: '#2ecc71', speed: 2,   gap: 185, interval: 110 },
      medium: { label: 'Medium', color: '#f5a623', speed: 3,   gap: 150, interval: 90  },
      hard:   { label: 'Hard',   color: '#e74c3c', speed: 4.5, gap: 115, interval: 70  },
    };
    let difficulty = 'easy';
    let tutorialDone = false;
    let menuOpen = false;

    // Difficulty button bounds (top-right)
    const DIFF_BTN = { x: W - 95, y: 8, w: 85, h: 28 };
    const DIFF_OPTIONS = ['easy', 'medium', 'hard'];

    function diff() { return DIFFICULTIES[difficulty]; }

    // --- Skins ---
    const SKINS = [
      { name: 'Classic', price:  0, body: ['#ffe066', '#f5a623', '#e67e22'], wing: '#f39c12', beak: '#e74c3c' },
      { name: 'Sky',     price: 25, body: ['#b3e5fc', '#42a5f5', '#1565c0'], wing: '#2196f3', beak: '#ff7043' },
      { name: 'Crimson', price: 30, body: ['#ffcdd2', '#ef5350', '#b71c1c'], wing: '#e53935', beak: '#ffd54f' },
      { name: 'Jade',    price: 35, body: ['#c8e6c9', '#66bb6a', '#2e7d32'], wing: '#43a047', beak: '#ff8f00' },
      { name: 'Rose',    price: 40, body: ['#fce4ec', '#f06292', '#ad1457'], wing: '#e91e63', beak: '#ff8a65' },
      { name: 'Violet',  price: 45, body: ['#e1bee7', '#ab47bc', '#4a148c'], wing: '#9c27b0', beak: '#ffe082' },
    ];
    let currentSkin = 0;
    let skinsMenuOpen = false;
    let unlockedSkins;

    const SKIN_BTN   = { x: W - 95, y: H - 95, w: 85, h: 28 };
    const SKIN_PANEL = { x: (W - 260) / 2, y: (H - 240) / 2, w: 260, h: 240 };

    // --- Upgrades ---
    const UPGR_BTN   = { x: W / 2 - 45, y: H - 95, w: 90, h: 28 };
    const UPGR_PANEL = { x: (W - 280) / 2, y: (H - 270) / 2, w: 280, h: 270 };
    let upgrsMenuOpen = false;
    const UPGRADES = [
      { id: 'magnet',  name: 'Magnet',     desc: 'Coin attraction',  price: 40, maxLevel: 3 },
      { id: 'coinx2',  name: 'Coin Boost', desc: '+1x coin value',   price: 50, maxLevel: 3 },
      { id: 'shield',  name: 'Shield',     desc: '+1 life per game', price: 60, maxLevel: 3 },
      { id: 'slow',    name: 'Slow Pipes', desc: 'Pipes 12% slower', price: 45, maxLevel: 3 },
    ];
    let boughtUpgrades;  // object: { id: level }
    let shieldLives = 0;
    let invincFrames = 0;

    // --- Maps ---
    const MAP_BTN = { x: 10, y: H - 98, w: 105, h: 36 };
    let currentMap = 0;       // 0 = night, 1 = day, 2 = space, 3 = lava
    let mapUnlocked = false;
    let map2Unlocked = false;
    let map3Unlocked = false;

    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top)  * (H / rect.height),
      };
    }

    function fmtCoins(n) {
      if (n >= 1000) {
        const k = Math.floor(n / 100) / 10;
        return (k % 1 === 0 ? k.toFixed(0) : k.toFixed(1)) + 'k';
      }
      return String(n);
    }

    function hitRect(px, py, rx, ry, rw, rh) {
      return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
    }

    // --- State ---
    let bird, pipes, coins, score, highScore, coinsCollected, frame, state, particles;

    function init() {
      bird = {
        x: 80,
        y: H / 2,
        vy: 0,
        radius: 18,
        angle: 0,
      };
      pipes = [];
      coins = [];
      particles = [];
      score = 0;
      if (highScore === undefined) highScore = 0;
      if (coinsCollected === undefined) coinsCollected = 10;
      if (unlockedSkins === undefined) unlockedSkins = [0];
      if (boughtUpgrades === undefined) boughtUpgrades = {};
      shieldLives = boughtUpgrades.shield || 0;
      invincFrames = 0;
      // mapUnlocked, map2Unlocked, currentMap, unlockedSkins, boughtUpgrades persist — no reset needed
      frame = 0;
      state = 'waiting'; // 'waiting' | 'playing' | 'dead'
    }

    function jump() {
      if (state === 'dead') {
        init();
        return;
      }
      if (state === 'waiting') { state = 'playing'; menuOpen = false; skinsMenuOpen = false; }
      playJumpSound();
      bird.vy = JUMP_FORCE;
      // Burst particles
      const skinColors = SKINS[currentSkin].body;
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: bird.x - bird.radius,
          y: bird.y,
          vx: -Math.random() * 3 - 1,
          vy: (Math.random() - 0.5) * 4,
          life: 1,
          color: skinColors[Math.floor(Math.random() * skinColors.length)],
        });
      }
    }

    // --- Input ---
    function handlePress(clientX, clientY) {
      startMusic();
      const pos = getCanvasPos(clientX, clientY);

      // Difficulty dropdown
      if (menuOpen) {
        for (let i = 0; i < DIFF_OPTIONS.length; i++) {
          const oy = DIFF_BTN.y + DIFF_BTN.h + 4 + i * 30;
          if (hitRect(pos.x, pos.y, DIFF_BTN.x, oy, DIFF_BTN.w, 28)) {
            difficulty = DIFF_OPTIONS[i];
            menuOpen = false;
            return;
          }
        }
        menuOpen = false;
        return;
      }

      // Skins panel
      if (skinsMenuOpen) {
        const { x, y, w } = SKIN_PANEL;
        const cols = 3;
        const cellW = (w - 20) / cols;
        const cellH = 90;
        const gx = x + 10;
        const gy = y + 50;
        for (let i = 0; i < SKINS.length; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          if (hitRect(pos.x, pos.y, gx + col * cellW, gy + row * cellH + 5, cellW - 4, cellH - 10)) {
            if (unlockedSkins.includes(i)) {
              currentSkin = i;
              skinsMenuOpen = false;
            } else if (coinsCollected >= SKINS[i].price) {
              coinsCollected -= SKINS[i].price;
              unlockedSkins.push(i);
              currentSkin = i;
              skinsMenuOpen = false;
            }
            return;
          }
        }
        skinsMenuOpen = false;
        return;
      }

      // Upgrades panel
      if (upgrsMenuOpen) {
        const { x, y, w } = UPGR_PANEL;
        const cols = 2;
        const cellW = (w - 20) / cols;
        const cellH = 100;
        const gx = x + 10;
        const gy = y + 50;
        for (let i = 0; i < UPGRADES.length; i++) {
          const col = i % cols;
          const row = Math.floor(i / cols);
          if (hitRect(pos.x, pos.y, gx + col * cellW, gy + row * cellH + 5, cellW - 4, cellH - 10)) {
            const upg = UPGRADES[i];
            const curLevel = boughtUpgrades[upg.id] || 0;
            const nextPrice = upg.price * Math.pow(2, curLevel);
            if (curLevel < upg.maxLevel && coinsCollected >= nextPrice) {
              coinsCollected -= nextPrice;
              boughtUpgrades[upg.id] = curLevel + 1;
            }
            return;
          }
        }
        upgrsMenuOpen = false;
        // If they didn't click the button itself, let the click also jump/start
        if (!hitRect(pos.x, pos.y, UPGR_BTN.x, UPGR_BTN.y, UPGR_BTN.w, UPGR_BTN.h)) jump();
        return;
      }

      // Check difficulty button (only outside of an active attempt)
      if (state !== 'playing' && hitRect(pos.x, pos.y, DIFF_BTN.x, DIFF_BTN.y, DIFF_BTN.w, DIFF_BTN.h)) {
        menuOpen = true;
        skinsMenuOpen = false;
        upgrsMenuOpen = false;
        return;
      }

      // Check skins button (only outside of an active attempt)
      if (state !== 'playing' && hitRect(pos.x, pos.y, SKIN_BTN.x, SKIN_BTN.y, SKIN_BTN.w, SKIN_BTN.h)) {
        skinsMenuOpen = true;
        menuOpen = false;
        upgrsMenuOpen = false;
        return;
      }

      // Check upgrades button (only outside of an active attempt)
      if (state !== 'playing' && hitRect(pos.x, pos.y, UPGR_BTN.x, UPGR_BTN.y, UPGR_BTN.w, UPGR_BTN.h)) {
        upgrsMenuOpen = true;
        menuOpen = false;
        skinsMenuOpen = false;
        return;
      }

      // Check map button (only outside of an active attempt)
      if (state !== 'playing' && hitRect(pos.x, pos.y, MAP_BTN.x, MAP_BTN.y, MAP_BTN.w, MAP_BTN.h)) {
        if (currentMap === 0 && coinsCollected >= 50) {
          coinsCollected -= 40; mapUnlocked = true; currentMap = 1; restartMusic();
        } else if (currentMap === 1 && coinsCollected >= 100) {
          coinsCollected -= 70; map2Unlocked = true; currentMap = 2; restartMusic();
        } else if (currentMap === 2 && coinsCollected >= 250) {
          coinsCollected -= 240; map3Unlocked = true; currentMap = 3; restartMusic();
        }
        return;
      }

      jump();
    }

    document.addEventListener('mousedown', (e) => handlePress(e.clientX, e.clientY));
    document.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePress(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      startMusic();
      if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    });

    // --- Pipe spawning ---
    function spawnPipe() {
      const gap = diff().gap + (currentMap === 2 ? 75 : 0);
      const minH = 60;
      const maxH = H - gap - minH - 80;
      const topH = Math.floor(Math.random() * (maxH - minH) + minH);
      if (currentMap === 3) {
        pipes.push({ x: W, topH, gap, passed: false, phase: Math.random() * Math.PI * 2, centerH: topH, minTopH: minH, maxTopH: maxH });
      } else {
        pipes.push({ x: W, topH, gap, passed: false });
      }

      // 50% chance to place a coin just past this gap at a random height within it
      if (Math.random() < 0.5 && coins.length < 3) {
        const margin = 24; // keep coin clear of pipe edges
        const safeTop = topH + margin;
        const safeBot = topH + gap - margin;
        coins.push({
          x: W + PIPE_WIDTH + 20 + Math.random() * 40,
          y: safeTop + Math.random() * (safeBot - safeTop),
          r: 9,
          spin: 0,
          attracted: false,
          type: (() => {
            if (currentMap === 3) return 'green';
            const r = Math.random();
            if (currentMap === 2) {
              if (r < 0.30) return 'gold';
              if (r < 0.70) return 'blue';
              return 'green';
            } else if (currentMap === 1) {
              if (r < 0.50) return 'gold';
              if (r < 0.80) return 'blue';
              return 'green';
            } else {
              if (r < 0.70) return 'gold';
              if (r < 0.97) return 'blue';
              return 'green';
            }
          })(),
        });
      }
    }

    // --- Collision ---
    function circleRect(cx, cy, cr, rx, ry, rw, rh) {
      const nearX = Math.max(rx, Math.min(cx, rx + rw));
      const nearY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearX;
      const dy = cy - nearY;
      return dx * dx + dy * dy < cr * cr;
    }

    function checkCollisions() {
      // Ground / ceiling
      if (bird.y + bird.radius >= H - 60 || bird.y - bird.radius <= 0) return true;
      // Pipes
      for (const p of pipes) {
        const hit =
          circleRect(bird.x, bird.y, bird.radius - 2, p.x, 0, PIPE_WIDTH, p.topH) ||
          circleRect(bird.x, bird.y, bird.radius - 2, p.x, p.topH + p.gap, PIPE_WIDTH, H);
        if (hit) return true;
      }
      return false;
    }

    // --- Update ---
    function update() {
      if (state !== 'playing') return;

      frame++;

      // Bird physics
      bird.vy += currentMap === 2 ? GRAVITY * 0.62 : GRAVITY;
      bird.y += bird.vy;
      bird.angle = Math.min(Math.max(bird.vy * 3, -30), 90);

      // Spawn pipes
      if (frame % diff().interval === 0) spawnPipe();

      // Apply slow-pipes upgrade
      const slowLevel = boughtUpgrades.slow || 0;
      const gameSpeed = diff().speed * (1 - slowLevel * 0.12);

      // Move pipes & score
      for (const p of pipes) {
        p.x -= gameSpeed;
        // Lava map: pipes move vertically, bouncing within bounds
        // Lava map: smooth sine oscillation up and down
        if (p.phase !== undefined) {
          p.phase += 0.025;
          p.topH = Math.max(p.minTopH, Math.min(p.maxTopH, Math.round(p.centerH + Math.sin(p.phase) * 55)));
        }
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          if (currentMap === 3) coinsCollected++;
        }
      }
      pipes = pipes.filter(p => p.x + PIPE_WIDTH > 0);

      // Move & collect coins
      const magnetLevel = boughtUpgrades.magnet || 0;
      const magnetRange = magnetLevel * 55;          // 0 / 55 / 110 / 165 px
      const magnetPull  = 0.10 + magnetLevel * 0.04; // 0.14 / 0.18 / 0.22
      for (const c of coins) {
        c.spin += 0.05;
        const dx = bird.x - c.x;
        const dy = bird.y - c.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Magnet: attract coins within range, suck toward bird
        if (magnetLevel > 0 && dist < magnetRange) c.attracted = true;
        if (c.attracted) {
          c.x += dx * magnetPull;
          c.y += dy * magnetPull;
        } else {
          c.x -= gameSpeed;
        }

        if (dist < bird.radius + c.r) {
          // Collect — burst of particles
          const mult = 1 + (boughtUpgrades.coinx2 || 0);
          coinsCollected += (c.type === 'green' ? 5 : c.type === 'blue' ? 3 : 1) * mult;
          playCoinSound();
          const burstColors = c.type === 'green'
            ? ['#a5d6a7', '#43a047', '#1b5e20']
            : c.type === 'blue'
            ? ['#90caf9', '#42a5f5', '#1565c0']
            : ['#FFD700', '#FFE066', '#FFA500'];
          for (let i = 0; i < 10; i++) {
            const a = (i / 10) * Math.PI * 2;
            particles.push({
              x: c.x, y: c.y,
              vx: Math.cos(a) * (Math.random() * 3 + 1),
              vy: Math.sin(a) * (Math.random() * 3 + 1),
              life: 1,
              color: burstColors[i % 3],
            });
          }
          c.r = 0; // mark collected
        }
      }
      coins = coins.filter(c => c.r > 0 && c.x + c.r > 0);

      // Particles
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
      }
      particles = particles.filter(p => p.life > 0);

      // Invincibility countdown after shield absorbs a hit
      if (invincFrames > 0) invincFrames--;

      // Collision
      if (invincFrames === 0 && checkCollisions()) {
        if (shieldLives > 0) {
          shieldLives--;
          invincFrames = 45; // ~0.75s of invincibility so bird can escape the pipe
          bird.vy = JUMP_FORCE * 0.5; // small bounce away
        } else {
        if (score > highScore) { highScore = score; coinsCollected += 5; }
        coinsCollected += Math.floor(score / 2);
        state = 'dead';
        if (!tutorialDone) { tutorialDone = true; difficulty = 'medium'; }
        playGameOverSound();
        // Death burst
        for (let i = 0; i < 20; i++) {
          const angle = (i / 20) * Math.PI * 2;
          particles.push({
            x: bird.x,
            y: bird.y,
            vx: Math.cos(angle) * (Math.random() * 5 + 2),
            vy: Math.sin(angle) * (Math.random() * 5 + 2),
            life: 1,
            color: `hsl(${Math.random() * 40}, 100%, 60%)`,
          });
        }
        } // end else (no shield)
      }
    }

    // --- Drawing helpers ---
    function drawCloud(cx, cy, s) {
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.beginPath();
      ctx.arc(cx,           cy,           s * 0.65, 0, Math.PI * 2);
      ctx.arc(cx + s,       cy - s * 0.2, s * 0.55, 0, Math.PI * 2);
      ctx.arc(cx + s * 1.8, cy,           s * 0.60, 0, Math.PI * 2);
      ctx.arc(cx + s * 0.9, cy + s * 0.4, s * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBackground() {
      if (currentMap === 0) {
        // --- Night map ---
        const sky = ctx.createLinearGradient(0, 0, 0, H - 60);
        sky.addColorStop(0, '#1a1a2e');
        sky.addColorStop(1, '#16213e');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H - 60);

        // Stars
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        const starSeed = [53, 127, 211, 89, 173, 31, 239, 61, 149, 7, 199, 43, 107, 251, 17];
        for (let i = 0; i < starSeed.length; i++) {
          const sx = (starSeed[i] * 37 + i * 73) % W;
          const sy = (starSeed[i] * 53 + i * 41) % (H - 100);
          const sr = ((i % 3) + 1) * 0.7;
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }

        // Ground
        ctx.fillStyle = '#4a7c59';
        ctx.fillRect(0, H - 60, W, 60);
        ctx.fillStyle = '#5a9c6a';
        ctx.fillRect(0, H - 60, W, 12);

      } else if (currentMap === 1) {
        // --- Day map ---
        const sky = ctx.createLinearGradient(0, 0, 0, H - 60);
        sky.addColorStop(0, '#4fa3e0');
        sky.addColorStop(1, '#b8e0f7');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H - 60);

        // Sun
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 24;
        ctx.fillStyle = '#FFE44D';
        ctx.beginPath();
        ctx.arc(60, 65, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Clouds
        drawCloud(90,  90,  22);
        drawCloud(240, 65,  18);
        drawCloud(330, 115, 16);

        // Ground (earthy)
        ctx.fillStyle = '#7a5230';
        ctx.fillRect(0, H - 60, W, 60);
        ctx.fillStyle = '#9b7040';
        ctx.fillRect(0, H - 60, W, 12);

      } else if (currentMap === 2) {
        // --- Space map ---
        const sky = ctx.createLinearGradient(0, 0, 0, H - 60);
        sky.addColorStop(0, '#04001a');
        sky.addColorStop(1, '#0a0030');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H - 60);

        // Dense stars
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        const spaceSeed = [17, 53, 89, 127, 163, 199, 211, 31, 67, 103, 139, 173, 7, 43, 79, 115, 151, 187, 223, 251, 29, 61, 97, 131, 167];
        for (let i = 0; i < spaceSeed.length; i++) {
          const sx = (spaceSeed[i] * 41 + i * 67) % W;
          const sy = (spaceSeed[i] * 59 + i * 37) % (H - 100);
          const sr = ((i % 4) + 1) * 0.6;
          ctx.globalAlpha = 0.5 + (i % 3) * 0.2;
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Planet
        ctx.shadowColor = '#7c4dff';
        ctx.shadowBlur = 28;
        const pg = ctx.createRadialGradient(W - 55, 75, 4, W - 55, 75, 50);
        pg.addColorStop(0, '#ce93d8');
        pg.addColorStop(0.6, '#7c4dff');
        pg.addColorStop(1, '#1a0050');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(W - 55, 75, 50, 0, Math.PI * 2);
        ctx.fill();
        // Planet ring
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(206,147,216,0.45)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(W - 55, 75, 72, 16, -0.3, 0, Math.PI * 2);
        ctx.stroke();

        // Ground (dark rock)
        ctx.fillStyle = '#120820';
        ctx.fillRect(0, H - 60, W, 60);
        ctx.fillStyle = '#1f0f35';
        ctx.fillRect(0, H - 60, W, 12);

      } else {
        // --- Lava map ---
        const sky = ctx.createLinearGradient(0, 0, 0, H - 60);
        sky.addColorStop(0, '#1a0000');
        sky.addColorStop(0.5, '#3d0000');
        sky.addColorStop(1, '#7a1500');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H - 60);

        // Floating embers
        const emberSeed = [23, 67, 113, 157, 199, 241, 37, 89, 131, 173, 211, 53, 97, 139, 181];
        for (let i = 0; i < emberSeed.length; i++) {
          const ex = (emberSeed[i] * 43 + i * 71) % W;
          const ey = (emberSeed[i] * 61 + i * 37) % (H - 100);
          ctx.globalAlpha = 0.4 + (i % 3) * 0.2;
          ctx.fillStyle = i % 2 === 0 ? '#ff6600' : '#ffaa00';
          ctx.beginPath();
          ctx.arc(ex, ey, ((i % 3) + 1) * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Lava glow from ground
        const lavaGlow = ctx.createLinearGradient(0, H - 130, 0, H - 60);
        lavaGlow.addColorStop(0, 'rgba(255,80,0,0)');
        lavaGlow.addColorStop(1, 'rgba(255,80,0,0.35)');
        ctx.fillStyle = lavaGlow;
        ctx.fillRect(0, H - 130, W, 70);

        // Lava ground
        const lavaGrad = ctx.createLinearGradient(0, H - 60, 0, H);
        lavaGrad.addColorStop(0, '#ff4500');
        lavaGrad.addColorStop(0.5, '#cc2200');
        lavaGrad.addColorStop(1, '#7a0a00');
        ctx.fillStyle = lavaGrad;
        ctx.fillRect(0, H - 60, W, 60);
        // Lava surface shine
        ctx.fillStyle = 'rgba(255,180,0,0.55)';
        ctx.fillRect(0, H - 60, W, 7);
      }
    }

    function drawPipe(p) {
      const capH = 20;
      const capExtra = 6;

      // Pipe body gradient
      const makeGrad = (x) => {
        const g = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
        if (currentMap === 0) {
          g.addColorStop(0, '#2ecc71');
          g.addColorStop(0.4, '#27ae60');
          g.addColorStop(1, '#1a7a44');
        } else if (currentMap === 1) {
          g.addColorStop(0, '#b0b0b0');
          g.addColorStop(0.4, '#888');
          g.addColorStop(1, '#505050');
        } else if (currentMap === 2) {
          g.addColorStop(0, '#7e57c2');
          g.addColorStop(0.4, '#512da8');
          g.addColorStop(1, '#1a0050');
        } else {
          g.addColorStop(0, '#8b4513');
          g.addColorStop(0.4, '#5c2a0a');
          g.addColorStop(1, '#2d1000');
        }
        return g;
      };

      // Top pipe
      ctx.fillStyle = makeGrad(p.x);
      ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topH);
      // Top cap
      ctx.fillStyle = makeGrad(p.x - capExtra);
      ctx.fillRect(p.x - capExtra, p.topH - capH, PIPE_WIDTH + capExtra * 2, capH);

      // Bottom pipe
      const botY = p.topH + p.gap;
      ctx.fillStyle = makeGrad(p.x);
      ctx.fillRect(p.x, botY, PIPE_WIDTH, H - botY);
      // Bottom cap
      ctx.fillStyle = makeGrad(p.x - capExtra);
      ctx.fillRect(p.x - capExtra, botY, PIPE_WIDTH + capExtra * 2, capH);
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate((bird.angle * Math.PI) / 180);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(4, 6, bird.radius - 4, bird.radius - 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body
      const sk = SKINS[currentSkin];
      const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, bird.radius);
      bodyGrad.addColorStop(0, sk.body[0]);
      bodyGrad.addColorStop(0.6, sk.body[1]);
      bodyGrad.addColorStop(1, sk.body[2]);
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = sk.wing;
      ctx.beginPath();
      ctx.ellipse(-4, 4, 10, 6, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // Eye white
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(7, -5, 7, 0, Math.PI * 2);
      ctx.fill();

      if (state === 'dead') {
        // X eyes
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(4, -8); ctx.lineTo(11, -1);
        ctx.moveTo(11, -8); ctx.lineTo(4, -1);
        ctx.stroke();
      } else {
        // Pupil
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(9, -4, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(10, -5, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Beak
      ctx.fillStyle = sk.beak;
      ctx.beginPath();
      ctx.moveTo(13, -1);
      ctx.lineTo(22, 2);
      ctx.lineTo(13, 5);
      ctx.closePath();
      ctx.fill();

      // Shield ring (flashes white during invincibility)
      if (shieldLives > 0 || invincFrames > 0) {
        const flashing = invincFrames > 0 && Math.floor(invincFrames / 4) % 2 === 0;
        ctx.strokeStyle = flashing ? 'rgba(255,255,255,0.95)' : 'rgba(100,200,255,0.85)';
        ctx.lineWidth = flashing ? 4 : 3;
        ctx.shadowColor = flashing ? 'white' : '#4fc3f7';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(0, 0, bird.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawHUD() {
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;

      // Center score
      ctx.fillStyle = 'white';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(score, W / 2, 60);

      // Top-left high score
      ctx.textAlign = 'left';
      ctx.font = 'bold 15px Arial';
      ctx.fillStyle = '#f5a623';
      ctx.fillText('Highscore', 12, 28);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px Arial';
      ctx.fillText(highScore, 12, 52);

      // Coins collected
      ctx.font = 'bold 15px Arial';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('Coins', 12, 76);
      ctx.fillStyle = 'white';
      ctx.font = 'bold 20px Arial';
      ctx.fillText(fmtCoins(coinsCollected), 12, 98);

      ctx.shadowBlur = 0;
    }

    function outlineText(text, x, y, fillColor, strokeColor = 'black', lineWidth = 5) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = strokeColor;
      ctx.fillStyle = fillColor;
      ctx.strokeText(text, x, y);
      ctx.fillText(text, x, y);
    }

    function drawOverlay() {
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 10;

      if (state === 'waiting') {
        ctx.font = 'bold 52px Arial';
        outlineText('FLAPPY', W / 2, H / 2 - 60, '#f5a623');
        outlineText('BIRD',   W / 2, H / 2 - 2,  '#f5a623');

        ctx.font = 'bold 20px Arial';
        outlineText('Click / Tap / Space to start', W / 2, H / 2 + 52, 'white', 'black', 4);

        // Tutorial card
        const pulse = 0.7 + 0.3 * Math.abs(Math.sin(frame * 0.05));
        const cardW = 180, cardH = 36;
        const cardX = W / 2 - cardW / 2;
        const cardY = H / 2 + 78;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        roundRect(cardX, cardY, cardW, cardH, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,230,100,0.7)';
        ctx.lineWidth = 1.5;
        roundRect(cardX, cardY, cardW, cardH, 10);
        ctx.stroke();
        ctx.font = 'bold 15px Arial';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 0;
        outlineText('↑  Jump to Fly', W / 2, cardY + 24, '#ffe066', 'black', 3);
        ctx.globalAlpha = 1;
      }

      if (state === 'dead') {
        ctx.font = 'bold 48px Arial';
        outlineText('GAME OVER', W / 2, H / 2 - 48, '#e74c3c');

        ctx.font = 'bold 28px Arial';
        outlineText(`Score: ${score}`, W / 2, H / 2 + 10, 'white');

        ctx.font = 'bold 18px Arial';
        outlineText('Click / Tap / Space to retry', W / 2, H / 2 + 58, '#ddd', 'black', 4);
      }

      ctx.shadowBlur = 0;
    }

    function drawDifficultyButton() {
      const d = diff();
      const { x, y, w, h } = DIFF_BTN;

      // Button background
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(x, y, w, h, 6);
      ctx.fill();
      ctx.strokeStyle = d.color;
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 6);
      ctx.stroke();

      // Button label
      ctx.fillStyle = d.color;
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x + w / 2, y + h / 2 + 5);

      // Dropdown
      if (menuOpen) {
        DIFF_OPTIONS.forEach((key, i) => {
          const od = DIFFICULTIES[key];
          const oy = y + h + 4 + i * 30;
          const isSelected = key === difficulty;

          ctx.fillStyle = isSelected ? 'rgba(0,0,0,0.85)' : 'rgba(0,0,0,0.65)';
          roundRect(x, oy, w, 28, 6);
          ctx.fill();

          ctx.strokeStyle = od.color;
          ctx.lineWidth = isSelected ? 2.5 : 1.5;
          roundRect(x, oy, w, 28, 6);
          ctx.stroke();

          ctx.fillStyle = od.color;
          ctx.font = isSelected ? 'bold 13px Arial' : '13px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(od.label, x + w / 2, oy + 19);
        });
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function drawCoins() {
      for (const c of coins) {
        ctx.save();
        ctx.translate(c.x, c.y);

        // Glow
        ctx.shadowColor = c.type === 'green' ? '#43a047' : c.type === 'blue' ? '#42a5f5' : '#FFD700';
        ctx.shadowBlur = 12;

        // Coin body (squish on X to fake spin)
        const scaleX = Math.abs(Math.cos(c.spin));
        ctx.scale(Math.max(scaleX, 0.15), 1);

        const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, c.r);
        if (c.type === 'green') {
          g.addColorStop(0, '#c8e6c9');
          g.addColorStop(0.5, '#43a047');
          g.addColorStop(1, '#1b5e20');
        } else if (c.type === 'blue') {
          g.addColorStop(0, '#e3f2fd');
          g.addColorStop(0.5, '#42a5f5');
          g.addColorStop(1, '#1565c0');
        } else {
          g.addColorStop(0, '#FFF9C4');
          g.addColorStop(0.5, '#FFD700');
          g.addColorStop(1, '#F57F17');
        }
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath();
        ctx.arc(-2, -2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawMiniBird(cx, cy, skinIdx) {
      const sk = SKINS[skinIdx];
      const r = 16;
      ctx.save();
      ctx.translate(cx, cy);

      const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, r);
      g.addColorStop(0, sk.body[0]);
      g.addColorStop(0.6, sk.body[1]);
      g.addColorStop(1, sk.body[2]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = sk.wing;
      ctx.beginPath();
      ctx.ellipse(-3, 3, 8, 5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(6, -3, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(7, -2.5, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = sk.beak;
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(16, 1.5);
      ctx.lineTo(10, 3.5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawSkinButton() {
      const { x, y, w, h } = SKIN_BTN;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(x, y, w, h, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 6);
      ctx.stroke();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Skins', x + w / 2, y + h / 2 + 5);
    }

    function drawSkinPanel() {
      if (!skinsMenuOpen) return;
      const { x, y, w, h } = SKIN_PANEL;
      const cols = 3;
      const cellW = (w - 20) / cols;
      const cellH = 90;
      const gx = x + 10;
      const gy = y + 50;

      // Panel background
      ctx.fillStyle = 'rgba(10,10,30,0.96)';
      roundRect(x, y, w, h, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 12);
      ctx.stroke();

      // Title
      ctx.fillStyle = 'white';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Bird Shop', x + w / 2, y + 32);

      // Skin cells
      SKINS.forEach((skin, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = gx + col * cellW + cellW / 2;
        const cellY = gy + row * cellH + 5;
        const isUnlocked = unlockedSkins.includes(i);
        const canAfford  = !isUnlocked && coinsCollected >= skin.price;

        // Selected highlight
        if (i === currentSkin) {
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          roundRect(gx + col * cellW, cellY, cellW - 4, cellH - 10, 8);
          ctx.fill();
          ctx.strokeStyle = 'white';
          ctx.lineWidth = 2;
          roundRect(gx + col * cellW, cellY, cellW - 4, cellH - 10, 8);
          ctx.stroke();
        }

        // Gold border hint if affordable
        if (canAfford) {
          ctx.strokeStyle = 'rgba(255,215,0,0.6)';
          ctx.lineWidth = 1.5;
          roundRect(gx + col * cellW, cellY, cellW - 4, cellH - 10, 8);
          ctx.stroke();
        }

        // Bird (dimmed if locked)
        ctx.save();
        if (!isUnlocked) ctx.globalAlpha = 0.35;
        drawMiniBird(cx, cellY + 30, i);
        ctx.restore();

        // Label / price
        ctx.textAlign = 'center';
        if (isUnlocked) {
          ctx.fillStyle = i === currentSkin ? 'white' : '#999';
          ctx.font = i === currentSkin ? 'bold 11px Arial' : '11px Arial';
          ctx.fillText(skin.name, cx, cellY + 66);
        } else {
          // Coin icon
          ctx.fillStyle = canAfford ? '#FFD700' : '#555';
          ctx.beginPath();
          ctx.arc(cx - 16, cellY + 63, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = canAfford ? '#FFD700' : '#666';
          ctx.font = 'bold 11px Arial';
          ctx.fillText(`${skin.price}`, cx + 2, cellY + 67);
        }
      });
    }

    function drawMapButton() {
      const { x, y, w, h } = MAP_BTN;
      const cx = x + w / 2;

      // Determine label and cost for next action
      let line1, line2, borderColor;
      if (currentMap === 0) {
        if (coinsCollected >= 50)  { line1 = 'Day Map'; line2 = '50 coins';  borderColor = '#FFD700'; }
        else                       { line1 = 'Day Map'; line2 = '50 coins';  borderColor = 'rgba(100,100,100,0.5)'; }
      } else if (currentMap === 1) {
        if (coinsCollected >= 100) { line1 = 'Space';   line2 = '100 coins'; borderColor = '#FFD700'; }
        else                       { line1 = 'Space';   line2 = '100 coins'; borderColor = 'rgba(100,100,100,0.5)'; }
      } else if (currentMap === 2) {
        if (coinsCollected >= 250) { line1 = 'Lava Map'; line2 = '250 coins'; borderColor = '#ff4500'; }
        else                       { line1 = 'Lava Map'; line2 = '250 coins'; borderColor = 'rgba(100,100,100,0.5)'; }
      } else {
        line1 = 'Max Map'; line2 = 'Lava'; borderColor = 'rgba(255,69,0,0.7)';
      }

      const affordable = (currentMap === 0 && coinsCollected >= 50) ||
                         (currentMap === 1 && coinsCollected >= 100) ||
                         (currentMap === 2 && coinsCollected >= 250);
      const locked = (currentMap === 0 && coinsCollected < 50) ||
                     (currentMap === 1 && coinsCollected < 100) ||
                     (currentMap === 2 && coinsCollected < 250);

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(x, y, w, h, 6);
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = locked ? 1 : 2;
      roundRect(x, y, w, h, 6);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.shadowBlur = 0;
      ctx.font = 'bold 12px Arial';
      ctx.fillStyle = locked ? '#777' : affordable ? '#FFD700' : 'white';
      ctx.fillText(line1, cx, y + 14);
      ctx.font = '11px Arial';
      ctx.fillStyle = locked ? '#555' : affordable ? 'white' : '#aaa';
      ctx.fillText(line2, cx, y + 28);
    }

    function drawUpgrButton() {
      const { x, y, w, h } = UPGR_BTN;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      roundRect(x, y, w, h, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,0,0.75)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 6);
      ctx.stroke();
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Upgrades', x + w / 2, y + h / 2 + 5);
    }

    function drawUpgrPanel() {
      if (!upgrsMenuOpen) return;
      const { x, y, w, h } = UPGR_PANEL;
      const cols = 2;
      const cellW = (w - 20) / cols;
      const cellH = 100;
      const gx = x + 10;
      const gy = y + 50;

      // Panel background
      ctx.fillStyle = 'rgba(10,10,30,0.96)';
      roundRect(x, y, w, h, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,0,0.35)';
      ctx.lineWidth = 2;
      roundRect(x, y, w, h, 12);
      ctx.stroke();

      // Title
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Upgrades', x + w / 2, y + 32);

      UPGRADES.forEach((upg, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = gx + col * cellW + cellW / 2;
        const cellY = gy + row * cellH + 5;
        const curLevel = boughtUpgrades[upg.id] || 0;
        const atMax = curLevel >= upg.maxLevel;
        const nextPrice = upg.price * Math.pow(2, curLevel);
        const canAfford = !atMax && coinsCollected >= nextPrice;

        // Cell background
        ctx.fillStyle = curLevel > 0 ? 'rgba(255,215,0,0.08)' : 'rgba(255,255,255,0.05)';
        roundRect(gx + col * cellW, cellY, cellW - 4, cellH - 10, 8);
        ctx.fill();
        ctx.strokeStyle = atMax ? 'rgba(76,175,80,0.7)' : curLevel > 0 ? 'rgba(255,215,0,0.5)' : canAfford ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.1)';
        ctx.lineWidth = curLevel > 0 ? 2 : 1.5;
        roundRect(gx + col * cellW, cellY, cellW - 4, cellH - 10, 8);
        ctx.stroke();

        // Name + level dots
        ctx.textAlign = 'center';
        ctx.fillStyle = atMax ? '#4caf50' : curLevel > 0 ? '#FFD700' : 'white';
        ctx.font = 'bold 13px Arial';
        ctx.fillText(upg.name, cx, cellY + 20);

        // Level pips
        for (let lv = 0; lv < upg.maxLevel; lv++) {
          ctx.fillStyle = lv < curLevel ? '#FFD700' : 'rgba(255,255,255,0.2)';
          ctx.beginPath();
          ctx.arc(cx - (upg.maxLevel - 1) * 7 + lv * 14, cellY + 32, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        // Description
        ctx.fillStyle = '#aaa';
        ctx.font = '11px Arial';
        ctx.fillText(upg.desc, cx, cellY + 48);

        // Price / MAX
        if (atMax) {
          ctx.fillStyle = '#4caf50';
          ctx.font = 'bold 12px Arial';
          ctx.fillText('MAX', cx, cellY + 68);
        } else {
          ctx.fillStyle = canAfford ? '#FFD700' : '#555';
          ctx.beginPath();
          ctx.arc(cx - 20, cellY + 64, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = canAfford ? '#FFD700' : '#666';
          ctx.font = 'bold 12px Arial';
          ctx.fillText(`${nextPrice}`, cx + 4, cellY + 68);
        }
      });
    }

    // --- Game loop ---
    function loop() {
      update();

      ctx.clearRect(0, 0, W, H);
      drawBackground();

      for (const p of pipes) drawPipe(p);

      drawCoins();
      drawParticles();
      drawBird();
      drawHUD();
      drawDifficultyButton();
      drawSkinButton();
      drawMapButton();
      drawUpgrButton();
      drawOverlay();
      drawSkinPanel();
      drawUpgrPanel();

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
