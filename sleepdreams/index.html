<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#0d0025; overflow:hidden; font-family:'Georgia',serif; cursor:crosshair; }

/* ── INTRO ── */
#intro {
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 55%, #1e0a4a 0%, #0f0530 55%, #080018 100%);
  opacity:1; transition:opacity 2.5s ease;
}
#intro.gone { opacity:0; pointer-events:none; }

.ttl {
  font-size:clamp(2.8rem,7vw,5.5rem);
  color:#ffffff; letter-spacing:0.35em; text-transform:uppercase;
  text-shadow: 0 0 25px #c080ff, 0 0 55px #9040ee, 0 0 90px #6020cc;
  animation: glow 3s ease-in-out infinite;
  margin-bottom:0.3em;
}
.sub {
  font-size:clamp(0.85rem,2vw,1.05rem);
  color:#b090d8; letter-spacing:0.18em;
  margin-bottom:2.5em;
}
@keyframes glow {
  0%,100%{ text-shadow:0 0 20px #c080ff,0 0 45px #8040dd }
  50%{ text-shadow:0 0 35px #e0a0ff,0 0 70px #a060ee,0 0 100px #7030cc }
}

#box {
  width:min(580px,92vw);
  background:rgba(15,5,38,0.88);
  border:1px solid rgba(160,100,255,0.55);
  border-radius:14px; padding:2em;
  box-shadow: 0 0 60px rgba(100,50,220,0.3), inset 0 0 30px rgba(80,30,180,0.1);
}
#inp {
  width:100%; min-height:110px; resize:none;
  background:rgba(255,255,255,0.04); border:1px solid rgba(140,90,240,0.25);
  border-radius:8px; outline:none; padding:0.7em;
  font-family:'Georgia',serif; font-size:1.05rem; line-height:1.85;
  color:#eedeff; caret-color:#c080ff;
}
#inp::placeholder { color:#6045a0; }
.row { display:flex; align-items:center; justify-content:space-between; margin-top:1em; }
#cnt {
  font-size:0.85rem; color:#9070c8; letter-spacing:0.1em;
  transition:color 0.4s, text-shadow 0.4s;
}
#cnt.ready { color:#d0a0ff; text-shadow:0 0 10px #b070ee; }
#go {
  border:1px solid rgba(180,120,255,0.6); background:rgba(80,30,160,0.35);
  color:#e0b8ff; font-family:'Georgia',serif; font-size:0.85rem;
  letter-spacing:0.2em; text-transform:uppercase;
  padding:0.6em 1.8em; border-radius:30px;
  cursor:pointer; transition:all 0.3s;
  opacity:0.3; pointer-events:none;
}
#go.on { opacity:1; pointer-events:all; }
#go.on:hover { background:rgba(120,60,220,0.5); box-shadow:0 0 22px rgba(150,80,255,0.6); transform:scale(1.04); }
.hint { margin-top:1.4em; text-align:center; font-size:0.75rem; color:#7055a8; letter-spacing:0.08em; line-height:2; }

/* ── CANVAS ── */
#c { position:fixed; inset:0; z-index:1; opacity:0; transition:opacity 2.5s ease; }
#c.show { opacity:1; }

/* ── HUD ── */
#hud {
  position:fixed; inset:0; z-index:20; pointer-events:none;
  display:none; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:8%;
}
#hud.show { display:flex; }
#dreamText {
  font-size:clamp(0.85rem,2.2vw,1.25rem);
  color:rgba(255,240,255,0.82);
  letter-spacing:0.1em; line-height:2;
  text-shadow: 0 0 18px rgba(190,140,255,0.9);
  text-align:center; width:65%;
  opacity:1; transition:opacity 1.8s ease;
}
#dreamText.fade { opacity:0; }
#wakeBtn {
  margin-top:2em;
  font-size:0.68rem; color:rgba(120,90,180,0.4);
  letter-spacing:0.2em; text-transform:uppercase;
  pointer-events:all; cursor:pointer;
  transition:color 0.3s;
}
#wakeBtn:hover { color:rgba(180,150,255,0.65); }

/* ── BLACK CURTAIN (for transitions only) ── */
#curtain {
  position:fixed; inset:0; z-index:100;
  background:#000; pointer-events:none;
  opacity:0; transition:opacity 2s ease;
}
#curtain.on { opacity:1; }
</style>
</head>
<body>

<div id="intro">
  <div class="ttl">Dream</div>
  <div class="sub">type 15 words about your dream below</div>
  <div id="box">
    <textarea id="inp" placeholder="falling through golden light… a warm voice calling my name… the door was open…"></textarea>
    <div class="row">
      <span id="cnt">0 / 15 words</span>
      <button id="go">Enter</button>
    </div>
    <div class="hint">flying · ocean · forest · space · city · nightmare · love · falling</div>
  </div>
</div>

<canvas id="c"></canvas>

<div id="hud">
  <div id="dreamText"></div>
  <div id="wakeBtn" onclick="wakeUp()">wake up · esc</div>
</div>

<div id="curtain"></div>

<script>
'use strict';

// ════════════════════════════════
// UTILS
// ════════════════════════════════
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+0.999));
const TAU=Math.PI*2;

function hash(n){return(Math.abs(Math.sin(n*127.1+311.7))*43758.5453)%1;}
function noise2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi+yi*57),hash(xi+1+yi*57),u),
              lerp(hash(xi+(yi+1)*57),hash(xi+1+(yi+1)*57),u),v);
}

// ════════════════════════════════
// THEME DETECTION
// ════════════════════════════════
const KWORDS={
  flying:  ['fly','flying','float','soar','sky','cloud','wing','air','above','glide','hover','drift','high'],
  ocean:   ['ocean','sea','water','swim','wave','fish','beach','deep','coral','dive','rain','tide','blue'],
  forest:  ['forest','tree','wood','nature','leaf','green','grass','deer','fox','mushroom','moss','owl','wild'],
  space:   ['space','star','moon','planet','galaxy','universe','cosmos','orbit','void','infinite','dark','black'],
  nightmare:['shadow','chase','monster','fear','scary','scream','trapped','lost','alone','cold','run','blood'],
  city:    ['city','street','building','car','road','urban','neon','alley','bridge','crowd','light','night'],
  love:    ['love','heart','kiss','hug','warm','happy','joy','peace','soft','gentle','laugh','smile','together'],
  falling: ['fall','falling','drop','cliff','edge','bottomless','down','endless','pit','gravity','plunge'],
};
const PALETTES={
  flying:   {sky:['#0d0624','#281060','#5828a0','#b060e8','#ffd0ff'],fog:'rgba(170,110,255,0.22)',accent:'#e0aaff'},
  ocean:    {sky:['#000d1f','#001840','#003060','#006090','#00a8cc'],fog:'rgba(0,80,160,0.3)',accent:'#00eeff'},
  forest:   {sky:['#050e00','#0d1f00','#183d00','#2d6600','#4d9400'],fog:'rgba(40,110,20,0.22)',accent:'#90ff50'},
  space:    {sky:['#000003','#020010','#05001e','#0b0030','#120040'],fog:'rgba(35,0,90,0.28)',accent:'#b090ff'},
  nightmare:{sky:['#020000','#0e0000','#1c0004','#130010','#080008'],fog:'rgba(90,0,18,0.42)',accent:'#ff1030'},
  city:     {sky:['#000408','#000e18','#00142c','#002040','#003055'],fog:'rgba(0,8,28,0.48)',accent:'#ff9900'},
  love:     {sky:['#120010','#280020','#520840','#a01e78','#ff60b0'],fog:'rgba(190,55,130,0.18)',accent:'#ffc0e8'},
  falling:  {sky:['#080808','#181818','#303030','#606060','#aaaaaa'],fog:'rgba(40,40,40,0.45)',accent:'#ffffff'},
  default:  {sky:['#060008','#120018','#1c0030','#320055','#500080'],fog:'rgba(50,0,90,0.28)',accent:'#c080ff'},
};
const THOUGHTS={
  flying:   ['the air holds you like a secret','you rise and the world grows small','nothing is heavier than memory','you were always meant to be here'],
  ocean:    ['the deep knows your name','light dissolves into blue','everything that sinks eventually rests','you breathe something older than air'],
  forest:   ['the trees remember longer than we do','something watches without fear','roots reach further than sight','you came from here'],
  space:    ['between the stars is where you truly live','distance is only loneliness in disguise','you are made of what is already gone','the universe breathes'],
  nightmare:['it cannot reach you if you stay still','the shadow has your face','wake up. not yet.','the door was always unlocked'],
  city:     ['a million lives in parallel light','no one looks up but the windows do','the rain remembers every street','you are anyone here'],
  love:     ['this warmth was always yours','you cannot hold it but it holds you','some moments don\'t end — they wait','the feeling comes before the name'],
  falling:  ['the ground keeps its distance','you have always been falling','weight is just a direction','close your eyes further'],
  default:  ['even the dreaming mind knows something true','you are further in than you think','the edge of sleep is its own country','stay a little longer'],
};

function detectTheme(words){
  const scores={};
  for(const t in KWORDS)scores[t]=0;
  words.forEach(w=>{
    const lw=w.toLowerCase().replace(/[^a-z]/g,'');
    for(const t in KWORDS)
      if(KWORDS[t].some(k=>lw.includes(k)||k.includes(lw)))scores[t]++;
  });
  const top=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return top[1]>0?top[0]:'default';
}

// ════════════════════════════════
// CANVAS STATE
// ════════════════════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
window.addEventListener('resize',()=>{resize();if(ACTIVE)buildScene();});

let ACTIVE=false;
let theme='default';
let words=[];
let T=0;           // dream time ms
let prevT=0;
let cam={x:0,y:0,tx:0,ty:0};
let breath=0;
let objs=[];
let parts=[];
let wSprites=[];
let pal;

// ════════════════════════════════
// AUDIO
// ════════════════════════════════
let AC,master,rev;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0;
  rev=buildRev(5,2.5);
  const dry=AC.createGain();dry.gain.value=0.45;
  const wet=AC.createGain();wet.gain.value=0.55;
  master.connect(dry);master.connect(rev);
  dry.connect(AC.destination);rev.connect(wet);wet.connect(AC.destination);
}
function buildRev(dur,dec){
  const sr=AC.sampleRate,len=sr*dur;
  const b=AC.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  const cv=AC.createConvolver();cv.buffer=b;return cv;
}
function startDronePad(freqs){
  const g=AC.createGain();g.gain.value=0;g.connect(master);
  freqs.forEach(f=>{
    const o=AC.createOscillator(),og=AC.createGain();
    o.type='sine';o.frequency.value=f;og.gain.value=0.2+Math.random()*0.15;
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.frequency.value=0.06+Math.random()*0.04;lg.gain.value=f*0.003;
    lfo.connect(lg);lg.connect(o.frequency);lfo.start();o.start();
    o.connect(og);og.connect(g);
  });
  g.gain.setTargetAtTime(0.2,AC.currentTime,3);
}
function startMelody(){
  const scales={
    flying:[261.6,293.7,329.6,392,440,523.3],ocean:[220,246.9,261.6,293.7,369.9],
    forest:[174.6,196,220,261.6,293.7],space:[130.8,146.8,164.8,196,220],
    nightmare:[138.6,155.6,174.6,185,207.7],city:[261.6,311.1,349.2,466.2,523.3],
    love:[293.7,329.6,392,440,587.3],falling:[196,220,246.9,261.6,293.7],
    default:[220,261.6,293.7,329.6,392],
  };
  const sc=scales[theme]||scales.default;
  let step=0;
  function note(){
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    f.type='lowpass';f.frequency.value=700+Math.random()*400;
    o.type='sine';o.frequency.value=sc[step%sc.length]*(Math.random()<0.25?2:1);
    step+=ri(1,3);
    const now=AC.currentTime;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(0.12,now+0.5);
    g.gain.exponentialRampToValueAtTime(0.001,now+3+Math.random()*2);
    o.connect(f);f.connect(g);g.connect(master);o.start(now);o.stop(now+5);
    setTimeout(note,2500+Math.random()*4000);
  }
  setTimeout(note,1200);
}
function startAmb(){
  const buf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const filt=AC.createBiquadFilter();const g=AC.createGain();
  const fq={flying:350,ocean:180,forest:550,space:130,nightmare:260,city:750,love:420,falling:300,default:380};
  const gv={flying:0.04,ocean:0.07,forest:0.05,space:0.025,nightmare:0.09,city:0.06,love:0.035,falling:0.04,default:0.035};
  filt.type='bandpass';filt.frequency.value=fq[theme]||380;filt.Q.value=0.9;
  g.gain.value=gv[theme]||0.04;
  src.connect(filt);filt.connect(g);g.connect(master);src.start();
}
function chime(freq){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=freq||880;
  const t=AC.currentTime;
  g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+1.8);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+2);
}

// ════════════════════════════════
// OBJECTS
// ════════════════════════════════

class Cloud{
  constructor(){this.init(true);}
  init(rand){
    this.x=rand?rnd(0,W):(cam.x>0?-250:W+250);
    this.y=rnd(H*0.04,H*0.52);
    this.spd=rnd(0.12,0.4);
    this.sc=rnd(0.55,2.1);
    this.al=rnd(0.28,0.65);
    this.layer=ri(0,2);
    this.puffs=Array.from({length:ri(4,8)},()=>({ox:rnd(-85,85)*this.sc,oy:rnd(-22,22)*this.sc,r:rnd(32,72)*this.sc}));
  }
  update(dt){
    this.x+=this.spd*(1-this.layer*0.22)*dt*0.06;
    if(this.x-200*this.sc>W+250)this.init();
  }
  draw(){
    const d=1-this.layer*0.25;
    ctx.save();ctx.globalAlpha=this.al*d;
    ctx.translate(this.x-cam.x*(0.04+this.layer*0.035),this.y-cam.y*(0.025+this.layer*0.015));
    const g=ctx.createRadialGradient(0,-8,4,0,0,75*this.sc);
    g.addColorStop(0,'rgba(255,242,255,0.92)');g.addColorStop(0.5,'rgba(215,185,255,0.55)');g.addColorStop(1,'rgba(175,135,245,0)');
    ctx.fillStyle=g;
    ctx.beginPath();this.puffs.forEach(p=>{ctx.moveTo(p.ox+p.r,p.oy);ctx.arc(p.ox,p.oy,p.r,0,TAU);});
    ctx.fill();ctx.restore();
  }
}

class Star{
  constructor(lay){this.layer=lay??ri(0,2);this.init(true);}
  init(rand){
    this.x=rnd(0,W);this.y=rnd(0,H*0.88);
    this.r=rnd(0.4,2.4-this.layer*0.5);
    this.al=rnd(0.4,1);this.tp=rnd(0.5,2.5);this.ph=rnd(0,TAU);
  }
  update(dt){
    this.ph+=this.tp*dt*0.001;
    this.x-=(0.018+this.layer*0.012)*dt*0.06;
    if(this.x<-2)this.x=W+2;
  }
  draw(){
    const a=this.al*(0.55+0.45*Math.sin(this.ph));
    const px=this.x-cam.x*(0.008+this.layer*0.012),py=this.y-cam.y*(0.008+this.layer*0.008);
    ctx.save();ctx.globalAlpha=a;
    const g=ctx.createRadialGradient(px,py,0,px,py,this.r*3.5);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,'rgba(200,175,255,0.55)');g.addColorStop(1,'rgba(150,125,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,this.r*3.5,0,TAU);ctx.fill();ctx.restore();
  }
}

class Bird{
  constructor(){this.init(true);}
  init(rand){
    this.x=rand?rnd(0,W):-55;this.baseY=rnd(H*0.1,H*0.48);this.y=this.baseY;
    this.spd=rnd(0.75,2);this.wA=rnd(8,24);this.wF=rnd(0.5,1.4);
    this.ph=rnd(0,TAU);this.fp=0;this.sc=rnd(0.5,1.15);this.al=rnd(0.55,0.88);
  }
  update(dt){
    this.x+=this.spd*dt*0.06;this.ph+=this.wF*dt*0.001;this.fp+=4*dt*0.001;
    this.y=this.baseY+Math.sin(this.ph)*this.wA;
    if(this.x>W+65)this.init();
  }
  draw(){
    const flap=Math.sin(this.fp)*0.38;
    const px=this.x-cam.x*0.07,py=this.y-cam.y*0.055;
    ctx.save();ctx.globalAlpha=this.al;
    ctx.strokeStyle='rgba(35,15,70,0.82)';ctx.lineWidth=1.4*this.sc;ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(px-11*this.sc,py+flap*9*this.sc);
    ctx.quadraticCurveTo(px,py-7*this.sc*flap,px+11*this.sc,py+flap*9*this.sc);
    ctx.stroke();ctx.restore();
  }
}

class Fish{
  constructor(){this.init(true);}
  init(rand){
    const side=Math.random()<0.5;
    this.x=rand?rnd(0,W):(side?-85:W+85);
    this.y=rnd(H*0.18,H*0.88);
    this.dir=side?1:-1;this.spd=rnd(0.55,2)*this.dir;
    this.wA=rnd(5,18);this.wF=rnd(1,3);this.ph=rnd(0,TAU);
    this.sc=rnd(0.4,1.4);this.hue=ri(155,245);this.tp=0;this.layer=ri(0,2);
    this.bl=rnd(18,42)*this.sc;
  }
  update(dt){
    this.x+=this.spd*dt*0.06;this.tp+=2.8*dt*0.001;this.ph+=this.wF*dt*0.001;
    this.y+=Math.sin(this.ph)*0.28;
    if(this.x<-105||this.x>W+105)this.init();
  }
  draw(){
    const px=this.x-cam.x*(0.045+this.layer*0.028),py=this.y-cam.y*(0.038+this.layer*0.018);
    const tail=Math.sin(this.tp)*0.28;
    ctx.save();ctx.globalAlpha=0.68-this.layer*0.14;
    ctx.translate(px,py);if(this.dir<0)ctx.scale(-1,1);
    const g=ctx.createLinearGradient(0,0,this.bl,0);
    g.addColorStop(0,`hsla(${this.hue},78%,68%,0.9)`);g.addColorStop(1,`hsla(${this.hue+22},58%,48%,0.55)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(this.bl*0.4,0,this.bl*0.48,this.bl*0.19,0,0,TAU);ctx.fill();
    ctx.fillStyle=`hsla(${this.hue-12},68%,52%,0.78)`;
    ctx.beginPath();ctx.moveTo(-this.bl*0.08,0);ctx.lineTo(-this.bl*0.38,this.bl*0.24+tail*this.bl*0.09);ctx.lineTo(-this.bl*0.38,-this.bl*0.24+tail*this.bl*0.09);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

class Jellyfish{
  constructor(){this.init(true);}
  init(rand){
    this.x=rnd(0,W);this.y=rand?rnd(0,H):H+100;
    this.spd=rnd(-0.28,-0.14);this.ph=rnd(0,TAU);this.ps=rnd(1.4,2.8);
    this.sc=rnd(0.38,1.35);this.hue=ri(155,285);this.al=rnd(0.45,0.82);
    this.tent=Array.from({length:ri(5,9)},(_,i)=>({p:i*0.65,a:rnd(9,24)}));
  }
  update(dt){
    this.ph+=this.ps*dt*0.001;this.x+=Math.sin(this.ph*0.38)*0.38*dt*0.06;
    this.y+=this.spd*dt*0.06;if(this.y<-200){this.init();this.y=H+55;}
  }
  draw(){
    const px=this.x-cam.x*0.065,py=this.y-cam.y*0.048;
    const pulse=0.84+0.16*Math.sin(this.ph);const r=38*this.sc*pulse;
    ctx.save();ctx.globalAlpha=this.al;ctx.translate(px,py);
    const g=ctx.createRadialGradient(0,-r*0.28,r*0.08,0,0,r*1.18);
    g.addColorStop(0,`hsla(${this.hue},88%,82%,0.92)`);g.addColorStop(0.45,`hsla(${this.hue},68%,62%,0.48)`);g.addColorStop(1,`hsla(${this.hue},58%,48%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.18,0,TAU);ctx.fill();
    ctx.fillStyle=`hsla(${this.hue},78%,72%,0.65)`;
    ctx.beginPath();ctx.arc(0,0,r,Math.PI,TAU);ctx.fill();
    ctx.strokeStyle=`hsla(${this.hue},88%,88%,0.45)`;ctx.lineWidth=1.4;
    this.tent.forEach((t,i)=>{
      const tx=(i-this.tent.length/2)*r/this.tent.length*1.75;
      ctx.beginPath();ctx.moveTo(tx,0);
      for(let y=0;y<r*1.9;y+=8)ctx.lineTo(tx+Math.sin(this.ph*0.75+t.p+y*0.14)*t.a*this.sc*(y/r)*0.48,y+8);
      ctx.stroke();
    });
    ctx.restore();
  }
}

class Tree{
  constructor(layer){
    this.layer=layer??ri(0,2);this.x=rnd(-55,W+55);
    this.h=rnd(115,310)*(1-this.layer*0.18);this.w=rnd(28,75)*(1-this.layer*0.18);
    this.sp=rnd(0,TAU);this.ss=rnd(0.38,0.85);this.hue=rnd(100,138);
    this.al=0.68+this.layer*0.1;this.bc=ri(3,5);
  }
  update(dt){this.sp+=this.ss*dt*0.001;}
  draw(){
    const px=this.x-cam.x*(0.055+this.layer*0.065),py=H*0.83-cam.y*0.045;
    const sw=Math.sin(this.sp)*3.5*(1-this.layer*0.28);
    ctx.save();ctx.globalAlpha=this.al*(1-this.layer*0.22);
    ctx.strokeStyle=`hsl(${this.hue-28},38%,${9+this.layer*9}%)`;ctx.lineWidth=this.w*0.13;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+sw*0.5,py-this.h*0.5,px+sw,py-this.h);ctx.stroke();
    for(let i=0;i<this.bc;i++){
      const t=(i+1)/(this.bc+1);const bx=px+sw*t,by=py-this.h*t;
      const bl=this.h*rnd(0.14,0.28);const ba=rnd(-1.15,1.15);
      ctx.lineWidth=this.w*0.065*(1-t*0.5);
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(ba)*bl,by+Math.sin(ba)*bl*0.5);ctx.stroke();
    }
    const g=ctx.createRadialGradient(px+sw,py-this.h,this.w*0.08,px+sw,py-this.h,this.w*1.9);
    g.addColorStop(0,`hsla(${this.hue},68%,${23+this.layer*7}%,0.9)`);g.addColorStop(0.55,`hsla(${this.hue},58%,${14+this.layer*5}%,0.6)`);g.addColorStop(1,`hsla(${this.hue},48%,9%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px+sw,py-this.h,this.w*1.9,0,TAU);ctx.fill();
    ctx.restore();
  }
}

class ShadowFigure{

class Building{
  constructor(layer){
    this.layer=layer??ri(0,2);this.x=rnd(0,W);
    this.w=rnd(28,95)*(1-this.layer*0.18);this.h=rnd(75,265)*(1-this.layer*0.18);
    this.hue=ri(180,238);this.glh=ri(10,48);
    const rows=Math.floor(this.h/20),cols=Math.floor(this.w/14);
    this.wins=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      if(Math.random()<0.38)this.wins.push({r,c,on:Math.random()<0.48,flick:Math.random()<0.12});
  }
  update(){
    if(Math.random()<0.0025){const w=this.wins[ri(0,this.wins.length-1)];if(w&&w.flick)w.on=!w.on;}
  }
  draw(){
    const px=this.x-cam.x*(0.048+this.layer*0.055),py=H*0.82-cam.y*0.038;
    const d=1-this.layer*0.18;
    ctx.save();ctx.globalAlpha=0.78*d;
    const bg=ctx.createLinearGradient(px,py-this.h,px,py);
    bg.addColorStop(0,`hsl(${this.hue},28%,${7+this.layer*4}%)`);bg.addColorStop(1,`hsl(${this.hue},18%,${4+this.layer*3}%)`);
    ctx.fillStyle=bg;ctx.fillRect(px-this.w*0.5,py-this.h,this.w,this.h);
    this.wins.forEach(w=>{
      if(!w.on)return;
      const wx=px-this.w*0.5+11+w.c*14,wy=py-this.h+14+w.r*19;
      ctx.globalAlpha=rnd(0.38,0.78)*d;
      const wg=ctx.createRadialGradient(wx+4,wy+5,0,wx+4,wy+5,11);
      wg.addColorStop(0,`hsla(${this.glh},88%,88%,1)`);wg.addColorStop(1,`hsla(${this.glh},78%,58%,0)`);
      ctx.fillStyle=wg;ctx.fillRect(wx,wy,8,9);
    });
    ctx.restore();
  }
}

class LightRay{

// Unified particle
class P{
  constructor(type){this.type=type;this.init(true);}
  init(rand){
    const t=this.type;
    if(t==='dust'){
      this.x=rand?rnd(0,W):rnd(0,W);this.y=rand?rnd(0,H):rnd(0,H);
      this.vx=rnd(-0.14,0.14);this.vy=rnd(-0.09,0.04);
      this.al=rnd(0.08,0.38);this.r=rnd(0.48,1.8);this.ph=rnd(0,TAU);
    }else if(t==='bubble'){
      this.x=rand?rnd(0,W):rnd(0,W);this.y=rand?rnd(0,H):H+18;
      this.vx=rnd(-0.28,0.28);this.vy=rnd(-0.75,-0.18);
      this.al=rnd(0.18,0.55);this.r=rnd(2,11);this.ph=rnd(0,TAU);
    }else if(t==='firefly'){
      this.x=rand?rnd(0,W):rnd(0,W);this.y=rand?rnd(0,H):rnd(H*0.28,H);
      this.vx=rnd(-0.28,0.28);this.vy=rnd(-0.45,-0.08);
      this.al=rnd(0.38,0.95);this.r=rnd(1.4,3.2);this.ph=rnd(0,TAU);
    }else if(t==='rain'){
      this.x=rand?rnd(0,W):rnd(-50,W+50);this.y=rand?rnd(0,H):-22;
      this.vx=rnd(0.8,2.8);this.vy=rnd(7.5,17);
      this.al=rnd(0.18,0.48);this.len=rnd(7,18);
    }else if(t==='ember'){
      this.x=rand?rnd(0,W):rnd(W*0.2,W*0.8);this.y=rand?rnd(0,H):H+5;
      this.vx=rnd(-0.45,0.45);this.vy=rnd(-1.8,-0.45);
      this.al=rnd(0.38,0.88);this.r=rnd(1,3.8);this.hue=rnd(5,42);
    }else if(t==='snow'){
      this.x=rand?rnd(0,W):rnd(0,W);this.y=rand?rnd(0,H):-12;
      this.vx=rnd(-0.42,0.42);this.vy=rnd(0.18,0.72);
      this.al=rnd(0.28,0.75);this.r=rnd(1,3.8);this.ph=rnd(0,TAU);
    }
  }
  update(dt){
    const s=dt*0.06;
    this.x+=this.vx*s;this.y+=this.vy*s;
    if(this.ph!==undefined)this.ph+=1.8*s*0.01;
    if(this.type==='dust')this.x+=Math.sin(this.ph*0.65)*0.28*s;
    if(this.type==='bubble')this.x+=Math.sin(this.ph)*0.38*s;
    if(this.type==='snow')this.x+=Math.sin(this.ph)*0.45*s;
    if(this.y<-35||this.y>H+35||this.x<-55||this.x>W+55)this.init();
  }
  draw(){
    const px=this.x-cam.x*0.11,py=this.y-cam.y*0.09;
    ctx.save();ctx.globalAlpha=this.al;
    if(this.type==='firefly'){
      const g=ctx.createRadialGradient(px,py,0,px,py,this.r*4.5);
      g.addColorStop(0,'rgba(195,255,98,1)');g.addColorStop(0.28,'rgba(148,255,48,0.55)');g.addColorStop(1,'rgba(98,195,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,this.r*4.5,0,TAU);ctx.fill();
    }else if(this.type==='bubble'){
      ctx.strokeStyle=`rgba(145,215,255,${this.al})`;ctx.lineWidth=0.75;
      ctx.beginPath();ctx.arc(px,py,this.r,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(195,238,255,0.09)';ctx.fill();
    }else if(this.type==='dust'){
      ctx.fillStyle='rgba(198,175,255,0.9)';ctx.beginPath();ctx.arc(px,py,this.r,0,TAU);ctx.fill();
    }else if(this.type==='rain'){
      ctx.strokeStyle=`rgba(148,198,255,${this.al})`;ctx.lineWidth=0.75;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+this.vx*this.len*0.1,py+this.len);ctx.stroke();
    }else if(this.type==='ember'){
      const g=ctx.createRadialGradient(px,py,0,px,py,this.r*2.2);
      g.addColorStop(0,`hsla(${this.hue},100%,88%,1)`);g.addColorStop(1,`hsla(${this.hue},100%,48%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,this.r*2.2,0,TAU);ctx.fill();
    }else if(this.type==='snow'){
      ctx.fillStyle='rgba(218,232,255,0.9)';ctx.beginPath();ctx.arc(px,py,this.r,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}

class WordSprite{
  constructor(word,x,y){
    this.word=word;this.x=x;this.y=y;
    this.al=0;this.tal=rnd(0.28,0.65);this.sz=rnd(0.88,1.55);
    this.ph=rnd(0,TAU);this.dx=rnd(-0.28,0.28);this.dy=rnd(-0.22,-0.04);
    this.life=rnd(9000,18000);this.born=T;
  }
  update(dt){
    const age=T-this.born,fi=950,fo=2800;
    if(age<fi)this.al=this.tal*(age/fi);
    else if(age>this.life-fo)this.al=this.tal*Math.max(0,(this.life-age)/fo);
    else this.al=this.tal;
    this.ph+=0.45*dt*0.001;this.x+=this.dx*dt*0.028;this.y+=this.dy*dt*0.028+Math.sin(this.ph)*0.12*dt*0.028;
    return T-this.born<this.life;
  }
  draw(){
    ctx.save();ctx.globalAlpha=this.al;
    ctx.font=`${13*this.sz}px Georgia`;ctx.textAlign='center';
    ctx.fillStyle='rgba(255,242,255,0.92)';ctx.shadowColor='rgba(175,118,255,0.82)';ctx.shadowBlur=11;
    ctx.fillText(this.word,this.x-cam.x*0.14,this.y-cam.y*0.11);
    ctx.restore();
  }
}

// SCENE BUILDER
// ════════════════════════════════
function buildScene(){
  objs=[];parts=[];wSprites=[];
  pal=PALETTES[theme]||PALETTES.default;
  switch(theme){
    case 'flying':
      for(let i=0;i<3;i++)objs.push(new LightRay());
      for(let i=0;i<11;i++)objs.push(new Cloud());
      for(let i=0;i<18;i++)objs.push(new Bird());
      for(let i=0;i<180;i++)parts.push(new P('dust'));
      break;
    case 'ocean':
      for(let i=0;i<55;i++)objs.push(new Fish());
      for(let i=0;i<13;i++)objs.push(new Jellyfish());
      for(let i=0;i<190;i++)parts.push(new P('bubble'));
      for(let i=0;i<70;i++)parts.push(new P('dust'));
      break;
    case 'forest':
      for(let l=2;l>=0;l--)for(let i=0;i<4+l*2;i++)objs.push(new Tree(l));
      for(let i=0;i<2;i++)objs.push(new LightRay());
      for(let i=0;i<75;i++)parts.push(new P('firefly'));
      for(let i=0;i<90;i++)parts.push(new P('dust'));
      for(let i=0;i<55;i++)parts.push(new Leaf());
      break;
    case 'space':
      for(let i=0;i<280;i++)objs.push(new Star(ri(0,2)));
      for(let i=0;i<5;i++)objs.push(new Nebula());
      for(let i=0;i<4;i++)objs.push(new Planet());
      for(let i=0;i<18;i++)objs.push(new Asteroid());
      for(let i=0;i<55;i++)parts.push(new P('dust'));
      break;
    case 'nightmare':
      for(let i=0;i<6;i++)objs.push(new ShadowFigure());
      for(let i=0;i<240;i++)parts.push(new P('rain'));
      for(let i=0;i<28;i++)parts.push(new P('ember'));
      break;
    case 'city':
      for(let l=2;l>=0;l--)for(let i=0;i<6;i++)objs.push(new Building(l));
      for(let i=0;i<5;i++)objs.push(new Neon());
      for(let i=0;i<195;i++)parts.push(new P('rain'));
      for(let i=0;i<38;i++)parts.push(new P('dust'));
      break;
    case 'love':
      for(let i=0;i<5;i++)objs.push(new LightRay());
      for(let i=0;i<8;i++)objs.push(new Cloud());
      for(let i=0;i<145;i++)parts.push(new P('dust'));
      for(let i=0;i<38;i++)parts.push(new P('snow'));
      break;
    case 'falling':
      for(let i=0;i<220;i++)objs.push(new Star(ri(0,2)));
      for(let i=0;i<8;i++)objs.push(new Cloud());
      for(let i=0;i<120;i++)parts.push(new P('dust'));
      break;
    default:
      for(let i=0;i<145;i++)objs.push(new Star(ri(0,2)));
      for(let i=0;i<7;i++)objs.push(new Cloud());
      for(let i=0;i<95;i++)parts.push(new P('dust'));
  }
  words.forEach((w,i)=>{
    setTimeout(()=>{
      if(ACTIVE)wSprites.push(new WordSprite(w,rnd(W*0.14,W*0.86),rnd(H*0.18,H*0.74)));
    },900+i*580);
  });
}

// ════════════════════════════════
// RENDER
// ════════════════════════════════
function drawBG(){
  const c=pal.sky;
  const g=ctx.createLinearGradient(0,0,0,H);
  c.forEach((col,i)=>g.addColorStop(i/(c.length-1),col));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(theme==='ocean'){
    // caustics
    const ct=T*0.00028;
    for(let i=0;i<7;i++){
      const cx=noise2(i*0.5,ct)*W,cy=noise2(i*0.5+10,ct)*H,r=rnd(48,175);
      const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      cg.addColorStop(0,'rgba(0,175,215,0.038)');cg.addColorStop(1,'rgba(0,98,158,0)');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
    }
    // surface shimmer
    ctx.save();ctx.globalAlpha=0.12;
    const sg=ctx.createLinearGradient(0,0,0,H*0.22);
    sg.addColorStop(0,'rgba(0,175,228,0.78)');sg.addColorStop(1,'rgba(0,98,178,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(0,0);
    for(let x=0;x<=W;x+=11){const w=Math.sin(x*0.021+T*0.0009)*11+Math.sin(x*0.04+T*0.0013)*5;ctx.lineTo(x,H*0.11+w);}
    ctx.lineTo(W,0);ctx.closePath();ctx.fill();ctx.restore();
  }

  if(theme==='nightmare'){
    if(Math.random()<0.0018){ctx.fillStyle='rgba(255,228,198,0.14)';ctx.fillRect(0,0,W,H);}
    const rg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.78);
    rg.addColorStop(0,'rgba(55,0,8,0)');rg.addColorStop(1,'rgba(115,0,18,0.28)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }

  if(theme==='city'){
    const sg=ctx.createLinearGradient(0,H*0.8,0,H);
    sg.addColorStop(0,'rgba(4,9,18,0.9)');sg.addColorStop(1,'rgba(2,4,9,1)');
    ctx.fillStyle=sg;ctx.fillRect(0,H*0.8,W,H*0.2);
    // puddle reflection
    ctx.save();ctx.globalAlpha=0.11;ctx.translate(0,H*2*0.82);ctx.scale(1,-1);
    objs.filter(o=>o instanceof Neon).forEach(o=>o.draw());
    ctx.restore();
  }

  if(theme==='forest'||theme==='nightmare'||theme==='love'){
    const gy=H*0.83;
    const gc=theme==='forest'?'rgba(18,46,4,':(theme==='nightmare'?'rgba(8,0,4,':'rgba(46,9,28,');
    const gg=ctx.createLinearGradient(0,gy,0,H);
    gg.addColorStop(0,gc+'0.88)');gg.addColorStop(1,gc+'1)');
    ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  }
}

function drawFog(){
  const g=ctx.createLinearGradient(0,H*0.58,0,H);
  const fc=pal.fog;
  g.addColorStop(0,fc.replace(/[\d.]+\)$/,'0)'));
  g.addColorStop(0.5,fc);
  g.addColorStop(1,fc.replace(/[\d.]+\)$/,'0.75)'));
  ctx.fillStyle=g;ctx.fillRect(0,H*0.58,W,H*0.42);
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.min(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.68)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

let raf;
function loop(ts){
  if(!ACTIVE){raf=0;return;}
  const dt=Math.min(ts-prevT,50);prevT=ts;T+=dt;
  breath+=0.32*dt*0.001;

  cam.x=lerp(cam.x,cam.tx,0.042);cam.y=lerp(cam.y,cam.ty,0.042);
  const bx=Math.sin(breath)*2.8,by=Math.sin(breath*0.78)*4.5+Math.sin(T*0.00038)*7;
  const savedX=cam.x,savedY=cam.y;cam.x+=bx;cam.y+=by;

  ctx.clearRect(0,0,W,H);
  drawBG();
  objs.forEach(o=>{o.update(dt);o.draw();});
  parts.forEach(p=>{p.update(dt);p.draw();});
  wSprites=wSprites.filter(ws=>{const a=ws.update(dt);ws.draw();return a;});
  drawFog();

  // subtle chromatic ghost for space/flying
  if((theme==='space'||theme==='flying')&&Math.random()<0.2){
    ctx.save();ctx.globalAlpha=0.035;ctx.globalCompositeOperation='screen';ctx.drawImage(canvas,1,0);ctx.restore();
  }
  // nightmare glitch
  if(theme==='nightmare'&&Math.random()<0.0025){
    ctx.save();ctx.globalAlpha=0.11;ctx.drawImage(canvas,rnd(-5,5),rnd(-4,4));ctx.restore();
  }

  cam.x=savedX;cam.y=savedY;

  // respawn floating words periodically
  if(T%14000<dt&&words.length>0){
    const w=words[ri(0,words.length-1)];
    wSprites.push(new WordSprite(w,rnd(W*0.14,W*0.86),rnd(H*0.18,H*0.74)));
    chime(rnd(380,1150));
  }
  raf=requestAnimationFrame(loop);
}

// ════════════════════════════════
// DREAM TEXT
// ════════════════════════════════
let txtTimer;
function cycleDreamText(){
  const pool=THOUGHTS[theme]||THOUGHTS.default;
  let i=0;
  function next(){
    const el=document.getElementById('dreamText');
    el.classList.add('fade');
    setTimeout(()=>{
      el.textContent=pool[i%pool.length];i++;
      el.classList.remove('fade');
    },1800);
    txtTimer=setTimeout(next,8500+Math.random()*4000);
  }
  setTimeout(next,4500);
}

// ════════════════════════════════
// INPUT
// ════════════════════════════════
const inp=document.getElementById('inp');
const cnt=document.getElementById('cnt');
const go=document.getElementById('go');
inp.addEventListener('input',()=>{
  const n=inp.value.trim().split(/\s+/).filter(w=>w).length;
  const c=Math.min(n,15);
  cnt.textContent=`${c} / 15 words`;
  if(c>=15){cnt.classList.add('ready');go.classList.add('on');}
  else{cnt.classList.remove('ready');go.classList.remove('on');}
});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tryStart();}
});
go.addEventListener('click',tryStart);

function tryStart(){
  const ws=inp.value.trim().split(/\s+/).filter(w=>w);
  if(ws.length<15)return;
  enterDream(ws.slice(0,15));
}

// ════════════════════════════════
// STATE
// ════════════════════════════════
async function enterDream(ws){
  words=ws;theme=detectTheme(ws);
  initAudio();
  const freqs={
    flying:[55,110,165.8,220,275.6],ocean:[41.2,82.4,123.5,164.8,220],
    forest:[65.4,87.3,130.8,174.6,219.4],space:[27.5,55,82.4,110,138.6],
    nightmare:[43.7,55,73.4,87.3,110.6],city:[110,164.8,220,261.6,329.6],
    love:[130.8,174.6,220,261.6,349.2],falling:[82.4,110,138.6,164.8,220],
    default:[55,110,164.8,220,329.6],
  };
  startDronePad(freqs[theme]||freqs.default);
  startMelody();startAmb();
  master.gain.setTargetAtTime(1,AC.currentTime,2.5);

  resize();buildScene();

  // Drop the curtain (go black)
  const curtain=document.getElementById('curtain');
  curtain.classList.add('on');

  setTimeout(()=>{
    // Hide intro behind curtain
    document.getElementById('intro').classList.add('gone');
    // Show canvas
    canvas.classList.add('show');
    // Show HUD
    document.getElementById('hud').classList.add('show');
    // Start dream loop
    ACTIVE=true;prevT=performance.now();T=0;
    raf=requestAnimationFrame(loop);
    cycleDreamText();
    // Lift curtain
    setTimeout(()=>curtain.classList.remove('on'),100);
  },1200);
}

function wakeUp(){
  if(!ACTIVE)return;
  clearTimeout(txtTimer);
  const curtain=document.getElementById('curtain');
  curtain.classList.add('on');
  if(master)master.gain.setTargetAtTime(0,AC.currentTime,2);
  setTimeout(()=>{
    ACTIVE=false;if(raf)cancelAnimationFrame(raf);
    canvas.classList.remove('show');
    document.getElementById('hud').classList.remove('show');
    const intro=document.getElementById('intro');
    intro.classList.remove('gone');
    inp.value='';cnt.textContent='0 / 15 words';
    cnt.classList.remove('ready');go.classList.remove('on');
    setTimeout(()=>curtain.classList.remove('on'),100);
  },1500);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')wakeUp();});
canvas.addEventListener('mousemove',e=>{
  if(!ACTIVE)return;
  cam.tx=(e.clientX/W-0.5)*55;cam.ty=(e.clientY/H-0.5)*38;
});
canvas.addEventListener('click',e=>{
  if(!ACTIVE)return;
  chime(rnd(300,1200));
  if(words.length>0)wSprites.push(new WordSprite(words[ri(0,words.length-1)],e.clientX,e.clientY));
});

// ════════════════════════════════
// BOOT
// ════════════════════════════════
window.onerror = (msg,_,line) => {
  const d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:20px;left:20px;right:20px;background:rgba(150,0,0,0.85);color:#fff;padding:12px 16px;border-radius:8px;font-size:13px;z-index:9999;font-family:monospace;';
  d.textContent='Error: '+msg+' (line '+line+')';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
};
resize();
</script>
</body>
