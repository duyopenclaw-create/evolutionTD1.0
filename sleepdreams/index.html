<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%;height:100%;background:#0d0025;overflow:hidden;font-family:'Georgia',serif; }
body { cursor:none; }

#intro {
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 55%,#1e0a4a 0%,#0f0530 55%,#080018 100%);
  opacity:1;transition:opacity 2s ease;
}
#intro.gone{opacity:0;pointer-events:none;}
.ttl{
  font-size:clamp(3rem,7vw,5.5rem);color:#fff;letter-spacing:0.35em;text-transform:uppercase;
  text-shadow:0 0 25px #c080ff,0 0 55px #9040ee,0 0 90px #6020cc;
  animation:glow 3s ease-in-out infinite;margin-bottom:0.3em;
}
.sub{font-size:clamp(0.9rem,2vw,1.1rem);color:#b090d8;letter-spacing:0.18em;margin-bottom:2.5em;}
@keyframes glow{
  0%,100%{text-shadow:0 0 20px #c080ff,0 0 45px #8040dd}
  50%{text-shadow:0 0 35px #e0a0ff,0 0 70px #a060ee,0 0 100px #7030cc}
}
#box{
  width:min(580px,92vw);background:rgba(15,5,38,0.9);
  border:1px solid rgba(160,100,255,0.55);border-radius:14px;padding:2em;
  box-shadow:0 0 60px rgba(100,50,220,0.3);
}
#inp{
  width:100%;min-height:110px;resize:none;
  background:rgba(255,255,255,0.05);border:1px solid rgba(140,90,240,0.3);
  border-radius:8px;outline:none;padding:0.7em;
  font-family:'Georgia',serif;font-size:1.05rem;line-height:1.85;
  color:#eedeff;caret-color:#c080ff;
}
#inp::placeholder{color:#5a3e90;}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:1em;}
#cnt{font-size:0.85rem;color:#9070c8;letter-spacing:0.1em;transition:color 0.4s;}
#cnt.ready{color:#d0a0ff;text-shadow:0 0 10px #b070ee;}
#go{
  border:1px solid rgba(180,120,255,0.65);background:rgba(80,30,160,0.4);
  color:#e0b8ff;font-family:'Georgia',serif;font-size:0.85rem;
  letter-spacing:0.2em;text-transform:uppercase;padding:0.6em 1.8em;border-radius:30px;
  cursor:pointer;transition:all 0.3s;opacity:0.3;pointer-events:none;
}
#go.on{opacity:1;pointer-events:all;}
#go.on:hover{background:rgba(120,60,220,0.5);box-shadow:0 0 22px rgba(150,80,255,0.6);transform:scale(1.04);}
.hint{margin-top:1.4em;text-align:center;font-size:0.75rem;color:#7055a8;letter-spacing:0.08em;line-height:2;}

#c{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 2.5s ease;}
#c.show{opacity:1;}

/* Crosshair cursor */
#xhair{
  position:fixed;z-index:30;pointer-events:none;
  width:22px;height:22px;transform:translate(-50%,-50%);
  display:none;
}
#xhair.show{display:block;}
#xhair::before,#xhair::after{
  content:'';position:absolute;background:rgba(255,255,255,0.7);
  border-radius:2px;
}
#xhair::before{width:1px;height:100%;left:50%;transform:translateX(-50%);}
#xhair::after{width:100%;height:1px;top:50%;transform:translateY(-50%);}
#xhair .dot{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,0.9);top:50%;left:50%;transform:translate(-50%,-50%);
}

#hud{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  display:none;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:7%;
}
#hud.show{display:flex;}
#dreamText{
  font-size:clamp(0.85rem,2.2vw,1.25rem);
  color:rgba(255,240,255,0.85);letter-spacing:0.1em;line-height:2;
  text-shadow:0 0 18px rgba(190,140,255,0.9);text-align:center;width:65%;
  opacity:1;transition:opacity 1.8s ease;min-height:2em;
}
#dreamText.fade{opacity:0;}
#controls{
  margin-top:1.2em;font-size:0.65rem;color:rgba(140,110,200,0.5);
  letter-spacing:0.15em;text-align:center;
}
#wakeBtn{
  margin-top:1em;font-size:0.65rem;color:rgba(120,90,180,0.4);
  letter-spacing:0.2em;text-transform:uppercase;pointer-events:all;cursor:pointer;
  transition:color 0.3s;
}
#wakeBtn:hover{color:rgba(180,150,255,0.65);}

/* Interact prompt */
#iprompt{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  z-index:25;pointer-events:none;
  font-size:0.8rem;color:rgba(255,240,180,0.85);letter-spacing:0.2em;
  text-shadow:0 0 10px rgba(255,200,80,0.8);
  opacity:0;transition:opacity 0.3s;
}
#iprompt.show{opacity:1;}

#curtain{
  position:fixed;inset:0;z-index:100;background:#000;
  pointer-events:none;opacity:0;transition:opacity 2s ease;
}
#curtain.on{opacity:1;}
</style>
</head>
<body>

<div id="intro">
  <div class="ttl">Dream</div>
  <div class="sub">type 15 words about your dream</div>
  <div id="box">
    <textarea id="inp" placeholder="falling through golden light… a warm voice calling my name… the door was open…"></textarea>
    <div class="row">
      <span id="cnt">0 / 15 words</span>
      <button id="go">Enter</button>
    </div>
    <div class="hint">flying · ocean · forest · space · city · nightmare · love · falling</div>
  </div>
</div>

<canvas id="c"></canvas>

<div id="xhair"><div class="dot"></div></div>

<div id="iprompt">[ E ] interact</div>

<div id="hud">
  <div id="dreamText"></div>
  <div id="controls">WASD / ARROWS — move &nbsp;·&nbsp; E — interact &nbsp;·&nbsp; CLICK — touch</div>
  <div id="wakeBtn" onclick="wakeUp()">ESC — wake up</div>
</div>

<div id="curtain"></div>

<script>
'use strict';

// ═══════════════════ UTILS ═══════════════════
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+0.99));
const TAU=Math.PI*2;
const hyp=(x,y)=>Math.sqrt(x*x+y*y);

function h(n){return(Math.abs(Math.sin(n*127.1+311.7))*43758.5453)%1;}
function n2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(h(xi+yi*57),h(xi+1+yi*57),u),lerp(h(xi+(yi+1)*57),h(xi+1+(yi+1)*57),u),v);
}

// ═══════════════════ THEME ═══════════════════
const KWORDS={
  flying:  ['fly','flying','float','soar','sky','cloud','wing','air','above','glide','hover','drift','high'],
  ocean:   ['ocean','sea','water','swim','wave','fish','beach','deep','coral','dive','rain','tide','blue'],
  forest:  ['forest','tree','wood','nature','leaf','green','grass','deer','fox','mushroom','moss','owl','wild'],
  space:   ['space','star','moon','planet','galaxy','universe','cosmos','orbit','void','infinite','dark','black'],
  nightmare:['shadow','chase','monster','fear','scary','scream','trapped','lost','alone','cold','run','blood'],
  city:    ['city','street','building','car','road','urban','neon','alley','bridge','crowd','light','night'],
  love:    ['love','heart','kiss','hug','warm','happy','joy','peace','soft','gentle','laugh','smile','together'],
  falling: ['fall','falling','drop','cliff','edge','bottomless','down','endless','pit','gravity','plunge'],
};
function detectTheme(words){
  const s={};for(const t in KWORDS)s[t]=0;
  words.forEach(w=>{
    const lw=w.toLowerCase().replace(/[^a-z]/g,'');
    for(const t in KWORDS)if(KWORDS[t].some(k=>lw.includes(k)||k.includes(lw)))s[t]++;
  });
  const top=Object.entries(s).sort((a,b)=>b[1]-a[1])[0];
  return top[1]>0?top[0]:'default';
}

const PALETTES={
  flying:   {sky:['#0d0624','#281060','#5828a0','#b060e8','#ffd0ff'],fog:'rgba(170,110,255,0.22)',accent:'#e0aaff'},
  ocean:    {sky:['#000d1f','#001840','#003060','#006090','#00a8cc'],fog:'rgba(0,80,160,0.3)',accent:'#00eeff'},
  forest:   {sky:['#050e00','#0d1f00','#183d00','#2d6600','#4d9400'],fog:'rgba(40,110,20,0.22)',accent:'#90ff50'},
  space:    {sky:['#000003','#020010','#05001e','#0b0030','#120040'],fog:'rgba(35,0,90,0.28)',accent:'#b090ff'},
  nightmare:{sky:['#020000','#0e0000','#1c0004','#130010','#080008'],fog:'rgba(90,0,18,0.42)',accent:'#ff1030'},
  city:     {sky:['#000408','#000e18','#00142c','#002040','#003055'],fog:'rgba(0,8,28,0.48)',accent:'#ff9900'},
  love:     {sky:['#120010','#280020','#520840','#a01e78','#ff60b0'],fog:'rgba(190,55,130,0.18)',accent:'#ffc0e8'},
  falling:  {sky:['#080808','#181818','#303030','#606060','#aaaaaa'],fog:'rgba(40,40,40,0.45)',accent:'#ffffff'},
  default:  {sky:['#060008','#120018','#1c0030','#320055','#500080'],fog:'rgba(50,0,90,0.28)',accent:'#c080ff'},
};
const THOUGHTS={
  flying:   ['the air holds you','you rise and the world shrinks','nothing is heavier than memory','you were always meant to be here','the clouds know your shape'],
  ocean:    ['the deep knows your name','light dissolves into blue','you breathe something older than air','the current goes where you need to go'],
  forest:   ['the trees remember longer than we do','something watches without fear','roots reach further than sight','you came from here'],
  space:    ['between the stars is home','distance is loneliness in disguise','you are made of what is already gone','the universe breathes slowly'],
  nightmare:["it can't reach you if you stay still",'the shadow has your face','wake up. not yet.','the door was always unlocked'],
  city:     ['a million lives in parallel light','no one looks up but the windows do','you are anyone here','neon always meant something'],
  love:     ['this warmth was always yours','you cannot hold it but it holds you','some moments wait instead of ending','the feeling comes before the name'],
  falling:  ['the ground keeps its distance','you have always been falling','weight is a direction','close your eyes further'],
  default:  ['you are further in than you think','the edge of sleep is its own country','stay a little longer','even the dreaming mind knows something true'],
};

// ═══════════════════ PHYSICS ═══════════════════
const PHYSICS={
  flying:   {sx:4.5,sy:3.5,grav:0,fric:0.86,bob:2,ground:false},
  ocean:    {sx:3.2,sy:2.8,grav:0.018,fric:0.88,bob:1.5,ground:false},
  forest:   {sx:3.8,sy:0,  grav:0.25, fric:0.80,bob:5,ground:true},
  space:    {sx:5,  sy:5,  grav:0,    fric:0.97,bob:0,ground:false},
  nightmare:{sx:5.5,sy:0,  grav:0.2,  fric:0.78,bob:6,ground:true},
  city:     {sx:3.5,sy:0,  grav:0.2,  fric:0.80,bob:4,ground:true},
  love:     {sx:3.2,sy:2.5,grav:0.01, fric:0.88,bob:1.5,ground:false},
  falling:  {sx:1.5,sy:6,  grav:0.35, fric:0.82,bob:0,ground:false},
  default:  {sx:3.5,sy:2.5,grav:0.02, fric:0.87,bob:2,ground:false},
};

// ═══════════════════ CANVAS / STATE ═══════════════════
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=0,H=0;
const WORLD_W=6000,WORLD_H=3000;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',()=>{resize();if(ACTIVE)buildScene();});

let ACTIVE=false;
let theme='default',pal;
let dwords=[];
let T=0,prevT=0;

// Player
let px=WORLD_W/2,py=WORLD_H/2;  // world position
let pvx=0,pvy=0;                  // velocity
let bobPhase=0;                   // head bob
let bobAmt=0;                     // current bob (lerped)
let moving=false;

// Keys
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='Escape')wakeUp();
  if(e.key.toLowerCase()==='e'&&ACTIVE)tryInteract();
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Mouse
let mx=0,my=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  if(ACTIVE){
    document.getElementById('xhair').style.left=mx+'px';
    document.getElementById('xhair').style.top=my+'px';
  }
});

// Scene objects
let objs=[];
let parts=[];
let wSprites=[];

// Nearest interactive object
let nearestObj=null;

// ═══════════════════ AUDIO ═══════════════════
let AC,master,rev;
function initAudio(){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0;
  rev=buildRev(5,2.5);
  const dry=AC.createGain();dry.gain.value=0.42;
  const wet=AC.createGain();wet.gain.value=0.58;
  master.connect(dry);master.connect(rev);
  dry.connect(AC.destination);rev.connect(wet);wet.connect(AC.destination);
}
function buildRev(dur,dec){
  const sr=AC.sampleRate,len=sr*dur;
  const b=AC.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  const cv=AC.createConvolver();cv.buffer=b;return cv;
}
function drone(freqs){
  const g=AC.createGain();g.gain.value=0;g.connect(master);
  freqs.forEach(f=>{
    const o=AC.createOscillator(),og=AC.createGain();
    o.type='sine';o.frequency.value=f;og.gain.value=0.18+Math.random()*0.14;
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.frequency.value=0.055+Math.random()*0.04;lg.gain.value=f*0.003;
    lfo.connect(lg);lg.connect(o.frequency);lfo.start();o.start();
    o.connect(og);og.connect(g);
  });
  g.gain.setTargetAtTime(0.2,AC.currentTime,3);
}
function melody(){
  const scales={
    flying:[261.6,293.7,329.6,392,440,523.3],ocean:[220,246.9,261.6,293.7,369.9],
    forest:[174.6,196,220,261.6,293.7],space:[130.8,146.8,164.8,196,220],
    nightmare:[138.6,155.6,174.6,185,207.7],city:[261.6,311.1,349.2,466.2,523.3],
    love:[293.7,329.6,392,440,587.3],falling:[196,220,246.9,261.6,293.7],
    default:[220,261.6,293.7,329.6,392],
  };
  const sc=scales[theme]||scales.default;let step=0;
  function note(){
    if(!ACTIVE)return;
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    f.type='lowpass';f.frequency.value=700+Math.random()*400;
    o.type='sine';o.frequency.value=sc[step%sc.length]*(Math.random()<0.25?2:1);
    step+=ri(1,3);
    const t=AC.currentTime;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.5);
    g.gain.exponentialRampToValueAtTime(0.001,t+3+Math.random()*2);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+5);
    setTimeout(note,2500+Math.random()*4000);
  }
  setTimeout(note,1200);
}
function ambNoise(){
  const buf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const filt=AC.createBiquadFilter(),g=AC.createGain();
  const fq={flying:350,ocean:180,forest:550,space:130,nightmare:260,city:750,love:420,falling:300,default:380};
  const gv={flying:0.04,ocean:0.07,forest:0.05,space:0.025,nightmare:0.09,city:0.06,love:0.035,falling:0.04,default:0.035};
  filt.type='bandpass';filt.frequency.value=fq[theme]||380;filt.Q.value=0.9;
  g.gain.value=gv[theme]||0.04;
  src.connect(filt);filt.connect(g);g.connect(master);src.start();
}
function sfx(freq,dur,type){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=freq||660;
  const t=AC.currentTime;
  g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+(dur||1.5));
  o.connect(g);g.connect(master);o.start(t);o.stop(t+(dur||1.5));
}
function footstep(){
  if(!AC||theme==='flying'||theme==='space'||theme==='ocean')return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=rnd(80,140);
  const t=AC.currentTime;
  g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.1);
}

// ═══════════════════ WORLD-SPACE OBJECTS ═══════════════════
// All objects have:
//   wx,wy  = world position
//   depth  = parallax depth (0=far,1=near)
//   sx,sy  = screen position (computed each frame)

function worldToScreen(wx,wy,depth){
  // wrap world x
  let dwx=wx-px;
  while(dwx>WORLD_W/2)dwx-=WORLD_W;
  while(dwx<-WORLD_W/2)dwx+=WORLD_W;
  const dwy=wy-py;
  return{
    x:dwx*depth+W/2,
    y:dwy*depth+H/2+bobAmt,
  };
}

class CloudObj{
  constructor(init){
    this.wx=rnd(0,WORLD_W);
    this.wy=rnd(-WORLD_H*0.3,WORLD_H*0.3);
    this.depth=rnd(0.06,0.22);
    this.spd=rnd(0.08,0.3);
    this.sc=rnd(0.6,2.2);
    this.al=rnd(0.3,0.65);
    this.puffs=Array.from({length:ri(4,8)},()=>({ox:rnd(-85,85)*this.sc,oy:rnd(-22,22)*this.sc,r:rnd(32,72)*this.sc}));
    this.type='cloud';
  }
  update(dt){
    this.wx+=this.spd*dt*0.06;
    if(this.wx>WORLD_W)this.wx-=WORLD_W;
  }
  draw(){
    const s=worldToScreen(this.wx,this.wy,this.depth);
    this.sx=s.x;this.sy=s.y;
    ctx.save();ctx.globalAlpha=this.al*(0.4+this.depth*3);
    ctx.translate(s.x,s.y);
    const g=ctx.createRadialGradient(0,-8,4,0,0,75*this.sc);
    g.addColorStop(0,'rgba(255,242,255,0.92)');g.addColorStop(0.5,'rgba(215,185,255,0.55)');g.addColorStop(1,'rgba(175,135,245,0)');
    ctx.fillStyle=g;ctx.beginPath();
    this.puffs.forEach(p=>{ctx.moveTo(p.ox+p.r,p.oy);ctx.arc(p.ox,p.oy,p.r,0,TAU);});
    ctx.fill();ctx.restore();
  }
  interact(){
    // puff the cloud
    for(let i=0;i<8;i++)parts.push(new SparkParticle(this.sx,this.sy,'rgba(230,210,255,','rgba(180,140,255,'));
    sfx(rnd(200,400),0.8);
    this.al=Math.min(0.9,this.al+0.3);
    setTimeout(()=>{this.al=rnd(0.3,0.65);},2000);
  }
  canInteract(sx,sy){return hyp(sx-this.sx,sy-this.sy)<100*this.sc;}
}

class StarObj{
  constructor(){
    this.wx=rnd(0,WORLD_W);this.wy=rnd(-WORLD_H*0.45,WORLD_H*0.45);
    this.depth=rnd(0.005,0.08);
    this.r=rnd(0.5,2.5);this.al=rnd(0.5,1);
    this.tp=rnd(0.5,2.5);this.ph=rnd(0,TAU);this.sx=0;this.sy=0;
    this.type='star';
  }
  update(dt){this.ph+=this.tp*dt*0.001;}
  draw(){
    const s=worldToScreen(this.wx,this.wy,this.depth);
    this.sx=s.x;this.sy=s.y;
    const a=this.al*(0.55+0.45*Math.sin(this.ph));
    ctx.save();ctx.globalAlpha=a;
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,this.r*3.5);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,'rgba(200,175,255,0.55)');g.addColorStop(1,'rgba(150,125,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,this.r*3.5,0,TAU);ctx.fill();
    ctx.restore();
  }
  interact(){
    for(let i=0;i<12;i++)parts.push(new SparkParticle(this.sx,this.sy,'rgba(255,240,180,','rgba(255,200,80,'));
    sfx(rnd(800,1400),1);
    this.al=1;this.r*=3;setTimeout(()=>{this.r/=3;this.al=rnd(0.5,1);},1200);
  }
  canInteract(sx,sy){return hyp(sx-this.sx,sy-this.sy)<40;}
}

class BirdObj{
  constructor(){
    this.wx=rnd(0,WORLD_W);this.wy=rnd(-WORLD_H*0.25,WORLD_H*0.1);
    this.depth=rnd(0.12,0.35);
    this.spd=rnd(0.8,2.2);this.baseWY=this.wy;

// ── Particles (screen-space) ──
class SparkParticle{
  constructor(x,y,col1,col2){
    this.x=x;this.y=y;
    const a=rnd(0,TAU);const spd=rnd(1,5);
    this.vx=Math.cos(a)*spd;this.vy=Math.sin(a)*spd-2;
    this.al=1;this.r=rnd(2,6);this.col1=col1;this.col2=col2;
  }
  update(dt){
    const s=dt*0.06;this.x+=this.vx*s;this.y+=this.vy*s;this.vy+=0.15*s;
    this.al-=0.025*s;this.r-=0.05*s;
  }
  draw(){
    if(this.al<=0)return;
    ctx.save();ctx.globalAlpha=Math.max(0,this.al);
    const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*2);
    g.addColorStop(0,this.col1+'1)');g.addColorStop(1,this.col2+'0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r*2,0,TAU);ctx.fill();
    ctx.restore();
  }
  alive(){return this.al>0&&this.r>0;}
}

class LeafParticle{
  constructor(x,y){
    this.x=x;this.y=y;
    this.vx=rnd(-1.5,1.5);this.vy=rnd(-2,0);
    this.rot=rnd(0,TAU);this.rs=rnd(-3,3);
    this.sc=rnd(4,10);this.hue=ri(60,120);this.al=1;
  }
  update(dt){
    const s=dt*0.06;this.x+=this.vx*s;this.y+=this.vy*s;this.vy+=0.08*s;this.rot+=this.rs*dt*0.01;
    this.al-=0.008*s;
  }
  draw(){
    if(this.al<=0)return;
    ctx.save();ctx.globalAlpha=Math.max(0,this.al);
    ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.fillStyle=`hsl(${this.hue},62%,38%)`;
    ctx.beginPath();ctx.ellipse(0,0,this.sc,this.sc*0.42,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  alive(){return this.al>0;}
}

class AmbParticle{
  constructor(type){this.type=type;this.reset(true);}
  reset(init){
    const t=this.type;
    if(t==='dust'){
      this.x=rnd(0,W);this.y=rnd(0,H);this.vx=rnd(-0.12,0.12);this.vy=rnd(-0.08,0.04);
      this.al=rnd(0.08,0.35);this.r=rnd(0.5,1.8);this.ph=rnd(0,TAU);
    }else if(t==='bubble'){
      this.x=rnd(0,W);this.y=init?rnd(0,H):H+18;
      this.vx=rnd(-0.28,0.28);this.vy=rnd(-0.75,-0.18);
      this.al=rnd(0.18,0.55);this.r=rnd(2,11);this.ph=rnd(0,TAU);
    }else if(t==='firefly'){
      this.x=rnd(0,W);this.y=init?rnd(0,H):rnd(H*0.3,H);
      this.vx=rnd(-0.28,0.28);this.vy=rnd(-0.45,-0.08);
      this.al=rnd(0.38,0.95);this.r=rnd(1.4,3.2);this.ph=rnd(0,TAU);
    }else if(t==='rain'){
      this.x=rnd(-50,W+50);this.y=init?rnd(0,H):-22;
      this.vx=rnd(0.8,2.8);this.vy=rnd(7.5,17);
      this.al=rnd(0.18,0.48);this.len=rnd(7,18);
    }else if(t==='ember'){
      this.x=rnd(0,W);this.y=init?rnd(0,H):H+5;
      this.vx=rnd(-0.45,0.45);this.vy=rnd(-1.8,-0.45);
      this.al=rnd(0.38,0.88);this.r=rnd(1,3.8);this.hue=rnd(5,42);
    }else if(t==='snow'){
      this.x=rnd(0,W);this.y=init?rnd(0,H):-12;
      this.vx=rnd(-0.42,0.42);this.vy=rnd(0.18,0.72);
      this.al=rnd(0.28,0.75);this.r=rnd(1,3.8);this.ph=rnd(0,TAU);
    }
  }
  update(dt){
    const s=dt*0.06;this.x+=this.vx*s;this.y+=this.vy*s;
    if(this.ph!==undefined)this.ph+=1.8*s*0.01;
    if(this.type==='dust')this.x+=Math.sin(this.ph*0.65)*0.28*s;
    if(this.type==='bubble')this.x+=Math.sin(this.ph)*0.38*s;
    if(this.type==='snow')this.x+=Math.sin(this.ph)*0.45*s;
    if(this.y<-35||this.y>H+35||this.x<-55||this.x>W+55)this.reset();
  }
  draw(){
    ctx.save();ctx.globalAlpha=this.al;
    if(this.type==='firefly'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*4.5);
      g.addColorStop(0,'rgba(195,255,98,1)');g.addColorStop(0.28,'rgba(148,255,48,0.55)');g.addColorStop(1,'rgba(98,195,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r*4.5,0,TAU);ctx.fill();
    }else if(this.type==='bubble'){
      ctx.strokeStyle=`rgba(145,215,255,${this.al})`;ctx.lineWidth=0.75;
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(195,238,255,0.09)';ctx.fill();
    }else if(this.type==='dust'){
      ctx.fillStyle='rgba(198,175,255,0.9)';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();
    }else if(this.type==='rain'){
      ctx.strokeStyle=`rgba(148,198,255,${this.al})`;ctx.lineWidth=0.75;
      ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+this.vx*this.len*0.1,this.y+this.len);ctx.stroke();
    }else if(this.type==='ember'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*2.2);
      g.addColorStop(0,`hsla(${this.hue},100%,88%,1)`);g.addColorStop(1,`hsla(${this.hue},100%,48%,0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r*2.2,0,TAU);ctx.fill();
    }else if(this.type==='snow'){
      ctx.fillStyle='rgba(218,232,255,0.9)';ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,TAU);ctx.fill();
    }
    ctx.restore();
    if(this.type==='rain'&&this.vy>0&&this.y>=H-5){
      // tiny splash
      ctx.save();ctx.globalAlpha=this.al*0.5;ctx.strokeStyle='rgba(148,198,255,0.4)';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.arc(this.x,H-2,rnd(2,5),Math.PI,TAU);ctx.stroke();ctx.restore();
    }
  }
  alive(){return true;}
}

class WordSprite{
  constructor(word,wx,wy){
    this.word=word;this.wx=wx;this.wy=wy;
    this.depth=rnd(0.25,0.55);
    this.al=0;this.tal=rnd(0.28,0.62);this.sz=rnd(0.9,1.5);
    this.ph=rnd(0,TAU);
    this.life=rnd(9000,18000);this.born=T;
    this.sx=0;this.sy=0;this.type='word';
  }
  update(dt){
    const age=T-this.born,fi=900,fo=2500;
    if(age<fi)this.al=this.tal*(age/fi);
    else if(age>this.life-fo)this.al=this.tal*Math.max(0,(this.life-age)/fo);
    else this.al=this.tal;
    this.ph+=0.4*dt*0.001;
    this.wy-=0.01*dt*0.06;
    return T-this.born<this.life;
  }
  draw(){
    const s=worldToScreen(this.wx,this.wy,this.depth);
    this.sx=s.x;this.sy=s.y;
    ctx.save();ctx.globalAlpha=this.al;
    ctx.font=`${13*this.sz}px Georgia`;ctx.textAlign='center';
    ctx.fillStyle='rgba(255,242,255,0.92)';ctx.shadowColor='rgba(175,118,255,0.82)';ctx.shadowBlur=11;
    ctx.fillText(this.word,s.x,s.y);
    ctx.restore();
  }
  interact(){
    for(let i=0;i<6;i++)parts.push(new SparkParticle(this.sx,this.sy,'rgba(230,210,255,','rgba(180,140,255,'));
    sfx(rnd(400,900),0.8);
    this.al=1;this.life=T-this.born+2000;
  }
  canInteract(sx,sy){return hyp(sx-this.sx,sy-this.sy)<50;}
}

// ═══════════════════ SCENE BUILDER ═══════════════════
function buildScene(){
  objs=[];parts=[];wSprites=[];
  pal=PALETTES[theme]||PALETTES.default;

  switch(theme){
    case 'flying':
      for(let i=0;i<4;i++)objs.push(new LightRayObj());
      for(let i=0;i<20;i++)objs.push(new CloudObj());
      for(let i=0;i<35;i++)objs.push(new BirdObj());
      for(let i=0;i<150;i++)parts.push(new AmbParticle('dust'));
      break;
    case 'ocean':
      for(let i=0;i<80;i++)objs.push(new FishObj());
      for(let i=0;i<18;i++)objs.push(new JellyfishObj());
      for(let i=0;i<180;i++)parts.push(new AmbParticle('bubble'));
      for(let i=0;i<60;i++)parts.push(new AmbParticle('dust'));
      break;
    case 'forest':
      for(let l=2;l>=0;l--)for(let i=0;i<8+l*3;i++)objs.push(new TreeObj(l));
      for(let i=0;i<3;i++)objs.push(new LightRayObj());
      for(let i=0;i<70;i++)parts.push(new AmbParticle('firefly'));
      for(let i=0;i<80;i++)parts.push(new AmbParticle('dust'));
      break;
    case 'space':
      for(let i=0;i<320;i++)objs.push(new StarObj());
      for(let i=0;i<6;i++)objs.push(new NebulaObj());
      for(let i=0;i<5;i++)objs.push(new PlanetObj());
      for(let i=0;i<22;i++)objs.push(new AsteroidObj());
      for(let i=0;i<50;i++)parts.push(new AmbParticle('dust'));
      break;
    case 'nightmare':
      for(let i=0;i<8;i++)objs.push(new ShadowFigObj());
      for(let i=0;i<220;i++)parts.push(new AmbParticle('rain'));
      for(let i=0;i<25;i++)parts.push(new AmbParticle('ember'));
      break;
    case 'city':
      for(let l=2;l>=0;l--)for(let i=0;i<10;i++)objs.push(new BuildingObj(l));
      for(let i=0;i<8;i++)objs.push(new NeonObj());
      for(let i=0;i<180;i++)parts.push(new AmbParticle('rain'));
      for(let i=0;i<30;i++)parts.push(new AmbParticle('dust'));
      break;
    case 'love':
      for(let i=0;i<4;i++)objs.push(new LightRayObj());
      for(let i=0;i<14;i++)objs.push(new CloudObj());
      for(let i=0;i<130;i++)parts.push(new AmbParticle('dust'));
      for(let i=0;i<40;i++)parts.push(new AmbParticle('snow'));
      break;
    case 'falling':
      for(let i=0;i<250;i++)objs.push(new StarObj());
      for(let i=0;i<10;i++)objs.push(new CloudObj());
      for(let i=0;i<100;i++)parts.push(new AmbParticle('dust'));
      break;
    default:
      for(let i=0;i<160;i++)objs.push(new StarObj());
      for(let i=0;i<10;i++)objs.push(new CloudObj());
      for(let i=0;i<90;i++)parts.push(new AmbParticle('dust'));
  }

  // Place word sprites in world
  dwords.forEach((w,i)=>{
    setTimeout(()=>{
      if(ACTIVE)wSprites.push(new WordSprite(w,px+rnd(-600,600),py+rnd(-300,300)));
    },900+i*600);
  });
}

// ═══════════════════ BACKGROUND DRAWING ═══════════════════
function drawBG(){
  const c=pal.sky;
  const g=ctx.createLinearGradient(0,0,0,H);
  c.forEach((col,i)=>g.addColorStop(i/(c.length-1),col));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Subtle parallax background noise patches
  const bx=px*0.01,by=py*0.01;
  for(let i=0;i<4;i++){
    const nx=n2(bx+i*2,by+i)*W,ny=n2(bx+i*2+5,by+i*2)*H;
    const r=80+n2(i*3,bx)*120;
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,r);
    ng.addColorStop(0,pal.accent+'18');
    ng.addColorStop(1,pal.accent+'00');
    ctx.fillStyle=ng;ctx.beginPath();ctx.arc(nx,ny,r,0,TAU);ctx.fill();
  }

  // Theme-specific background details
  if(theme==='ocean'){
    const ct=T*0.00025;
    for(let i=0;i<6;i++){
      const cx=((n2(i*0.5,ct)*W+px*0.05)%W+W)%W,cy=n2(i*0.5+10,ct)*H;
      const r=rnd(50,175);
      const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      cg.addColorStop(0,'rgba(0,175,215,0.035)');cg.addColorStop(1,'rgba(0,98,158,0)');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
    }
    ctx.save();ctx.globalAlpha=0.1;
    const sg=ctx.createLinearGradient(0,0,0,H*0.2);
    sg.addColorStop(0,'rgba(0,175,228,0.78)');sg.addColorStop(1,'rgba(0,98,178,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.moveTo(0,0);
    for(let x=0;x<=W;x+=11){ctx.lineTo(x,H*0.1+Math.sin(x*0.021+T*0.0009)*10+Math.sin(x*0.04+T*0.0013)*5);}
    ctx.lineTo(W,0);ctx.closePath();ctx.fill();ctx.restore();
  }

  if(theme==='nightmare'){
    if(Math.random()<0.002){ctx.fillStyle='rgba(255,228,198,0.12)';ctx.fillRect(0,0,W,H);}
    const rg=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.75);
    rg.addColorStop(0,'rgba(55,0,8,0)');rg.addColorStop(1,'rgba(115,0,18,0.25)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }

  // Ground / floor
  if(theme==='forest'||theme==='nightmare'||theme==='love'){
    const gy=H*0.83;
    const gc=theme==='forest'?'rgba(18,46,4,':(theme==='nightmare'?'rgba(8,0,4,':'rgba(46,9,28,');
    const gg=ctx.createLinearGradient(0,gy,0,H);
    gg.addColorStop(0,gc+'0.9)');gg.addColorStop(1,gc+'1)');
    ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  }
  if(theme==='city'){
    const sg=ctx.createLinearGradient(0,H*0.82,0,H);
    sg.addColorStop(0,'rgba(4,9,18,0.9)');sg.addColorStop(1,'rgba(2,4,9,1)');
    ctx.fillStyle=sg;ctx.fillRect(0,H*0.82,W,H*0.18);
  }
}

function drawFog(){
  const g=ctx.createLinearGradient(0,H*0.58,0,H);
  g.addColorStop(0,pal.fog.replace(/[\d.]+\)$/,'0)'));
  g.addColorStop(0.5,pal.fog);
  g.addColorStop(1,pal.fog.replace(/[\d.]+\)$/,'0.75)'));
  ctx.fillStyle=g;ctx.fillRect(0,H*0.58,W,H*0.42);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.min(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// ═══════════════════ INTERACT ═══════════════════
function tryInteract(){
  if(nearestObj){
    nearestObj.interact();
    return;
  }
  // interact with word near cursor
  const ws=wSprites.find(w=>w.canInteract(mx,my));
  if(ws)ws.interact();
}

// ═══════════════════ MAIN LOOP ═══════════════════
let stepPhase=0;
let lastStep=0;
let raf=0;

function loop(ts){
  if(!ACTIVE){raf=0;return;}
  const dt=Math.min(ts-prevT,50);prevT=ts;T+=dt;
  const ph=PHYSICS[theme]||PHYSICS.default;

  // ── Player movement ──
  const left =keys['a']||keys['arrowleft'];
  const right=keys['d']||keys['arrowright'];
  const up   =keys['w']||keys['arrowup'];
  const down =keys['s']||keys['arrowdown'];
  const sprint=keys['shift'];
  const spd=sprint?ph.sx*1.9:ph.sx;

  if(left)pvx-=spd*dt*0.01;
  if(right)pvx+=spd*dt*0.01;
  if(up&&!ph.ground)pvy-=(sprint?ph.sy*1.8:ph.sy)*dt*0.01;
  if(down&&!ph.ground)pvy+=(sprint?ph.sy*1.8:ph.sy)*dt*0.01;
  if(up&&ph.ground)pvy-=ph.sy*18; // jump for ground-based themes

  // Gravity
  pvy+=ph.grav*dt*0.06;
  // Friction
  pvx*=Math.pow(ph.fric,dt*0.06);
  pvy*=Math.pow(ph.fric,dt*0.06);
  // Max speed
  const maxSpd=ph.sx*15;
  pvx=clamp(pvx,-maxSpd,maxSpd);pvy=clamp(pvy,-maxSpd,maxSpd);

  px+=pvx*dt*0.06;
  py+=pvy*dt*0.06;

  // World wrap X
  if(px<0)px+=WORLD_W;if(px>WORLD_W)px-=WORLD_W;
  // Vertical clamping
  if(ph.ground){py=clamp(py,WORLD_H*0.05,WORLD_H*0.25);}
  else{py=clamp(py,-WORLD_H*0.3,WORLD_H*0.5);}

  // ── Head bob ──
  moving=left||right||up||down;
  const speed=hyp(pvx,pvy);
  if(moving&&speed>0.5){
    stepPhase+=speed*0.012*dt*0.06;
    bobAmt=lerp(bobAmt,Math.sin(stepPhase)*ph.bob*(sprint?1.6:1),0.1);
    // footstep sound
    if(T-lastStep>280-speed*10&&speed>1){
      footstep();lastStep=T;
    }
  }else{
    bobAmt=lerp(bobAmt,Math.sin(T*0.0004)*1.5,0.04);
  }

  // ── Update objects ──
  objs.forEach(o=>o.update(dt));
  parts=parts.filter(p=>{p.update(dt);return p.alive===undefined||p.alive();});
  wSprites=wSprites.filter(ws=>{const a=ws.update(dt);ws.draw&&null;return a;});

  // ── Find nearest interactable ──
  let best=null,bestD=Infinity;
  [...objs,...wSprites].forEach(o=>{
    if(o.canInteract&&o.canInteract(mx,my)){
      const d=o.sx!==undefined?hyp(mx-o.sx,my-o.sy):999;
      if(d<bestD){bestD=d;best=o;}
    }
  });
  nearestObj=best;
  const ipEl=document.getElementById('iprompt');
  if(best){ipEl.classList.add('show');}else{ipEl.classList.remove('show');}

  // ── DRAW ──
  ctx.clearRect(0,0,W,H);
  drawBG();
  // Sort by depth (back to front)
  const allObjs=[...objs,...wSprites].sort((a,b)=>(a.depth||0)-(b.depth||0));
  allObjs.forEach(o=>o.draw());
  parts.forEach(p=>p.draw());
  drawFog();

  // nightmare glitch
  if(theme==='nightmare'&&Math.random()<0.003){
    ctx.save();ctx.globalAlpha=0.1;ctx.drawImage(canvas,rnd(-4,4),rnd(-3,3));ctx.restore();
  }
  if((theme==='space'||theme==='flying')&&Math.random()<0.2){
    ctx.save();ctx.globalAlpha=0.03;ctx.globalCompositeOperation='screen';ctx.drawImage(canvas,1,0);ctx.restore();
  }

  // Respawn word sprites
  if(T%14000<dt&&dwords.length>0){
    const w=dwords[ri(0,dwords.length-1)];
    wSprites.push(new WordSprite(w,px+rnd(-500,500),py+rnd(-250,250)));
    sfx(rnd(400,1100),0.8);
  }

  raf=requestAnimationFrame(loop);
}

// ═══════════════════ DREAM TEXT ═══════════════════
let txtTimer;
function cycleDreamText(){
  const pool=THOUGHTS[theme]||THOUGHTS.default;let i=0;
  function next(){
    if(!ACTIVE)return;
    const el=document.getElementById('dreamText');
    el.classList.add('fade');
    setTimeout(()=>{el.textContent=pool[i%pool.length];i++;el.classList.remove('fade');},1800);
    txtTimer=setTimeout(next,8500+Math.random()*4000);
  }
  setTimeout(next,4000);
}

// ═══════════════════ INPUT ═══════════════════
const inp=document.getElementById('inp');
const cnt=document.getElementById('cnt');
const goBtn=document.getElementById('go');
inp.addEventListener('input',()=>{
  const n=inp.value.trim().split(/\s+/).filter(w=>w).length;
  const c=Math.min(n,15);
  cnt.textContent=`${c} / 15 words`;
  if(c>=15){cnt.classList.add('ready');goBtn.classList.add('on');}
  else{cnt.classList.remove('ready');goBtn.classList.remove('on');}
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tryStart();}});
goBtn.addEventListener('click',tryStart);
function tryStart(){
  const ws=inp.value.trim().split(/\s+/).filter(w=>w);
  if(ws.length<15)return;
  enterDream(ws.slice(0,15));
}

// Click to interact / place word
canvas.addEventListener('click',e=>{
  if(!ACTIVE)return;
  // Try interact first
  if(nearestObj){nearestObj.interact();return;}
  const ws=wSprites.find(w=>w.canInteract&&w.canInteract(e.clientX,e.clientY));
  if(ws){ws.interact();return;}
  // Spawn spark at click
  for(let i=0;i<6;i++)parts.push(new SparkParticle(e.clientX,e.clientY,pal.accent.replace('#','rgba(')+'80,','rgba(200,180,255,'));
  sfx(rnd(300,1000),0.6);
});

// ═══════════════════ STATE ═══════════════════
async function enterDream(ws){
  dwords=ws;theme=detectTheme(ws);
  initAudio();
  const freqs={
    flying:[55,110,165.8,220,275.6],ocean:[41.2,82.4,123.5,164.8,220],
    forest:[65.4,87.3,130.8,174.6,219.4],space:[27.5,55,82.4,110,138.6],
    nightmare:[43.7,55,73.4,87.3,110.6],city:[110,164.8,220,261.6,329.6],
    love:[130.8,174.6,220,261.6,349.2],falling:[82.4,110,138.6,164.8,220],
    default:[55,110,164.8,220,329.6],
  };
  drone(freqs[theme]||freqs.default);melody();ambNoise();
  master.gain.setTargetAtTime(1,AC.currentTime,2.5);

  resize();
  // Set player start position
  px=WORLD_W/2;py=WORLD_H/2;pvx=0;pvy=0;
  buildScene();

  const curtain=document.getElementById('curtain');
  curtain.classList.add('on');
  setTimeout(()=>{
    document.getElementById('intro').classList.add('gone');
    canvas.classList.add('show');
    document.getElementById('hud').classList.add('show');
    document.getElementById('xhair').classList.add('show');
    ACTIVE=true;prevT=performance.now();T=0;
    raf=requestAnimationFrame(loop);
    cycleDreamText();
    setTimeout(()=>curtain.classList.remove('on'),100);
  },1200);
}

function wakeUp(){
  if(!ACTIVE)return;
  clearTimeout(txtTimer);
  document.getElementById('curtain').classList.add('on');
  if(master)master.gain.setTargetAtTime(0,AC.currentTime,2);
  setTimeout(()=>{
    ACTIVE=false;if(raf)cancelAnimationFrame(raf);
    canvas.classList.remove('show');
    document.getElementById('hud').classList.remove('show');
    document.getElementById('xhair').classList.remove('show');
    document.getElementById('intro').classList.remove('gone');
    inp.value='';cnt.textContent='0 / 15 words';
    cnt.classList.remove('ready');goBtn.classList.remove('on');
    setTimeout(()=>document.getElementById('curtain').classList.remove('on'),100);
  },1500);
}

// ═══════════════════ BOOT ═══════════════════
window.onerror=(msg,_,line)=>{
  const d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:20px;left:20px;right:20px;background:rgba(150,0,0,0.85);color:#fff;padding:12px;border-radius:8px;font-size:13px;z-index:9999;font-family:monospace;';
  d.textContent='Error: '+msg+' (line '+line+')';
  document.body.appendChild(d);setTimeout(()=>d.remove(),8000);
};
resize();
</script>
</body>
</html>
