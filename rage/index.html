<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RAGE</title>
<style>
  :root{
    --accent:#ff4d4d; --accent2:#7dd3fc; --ok:#5cf29a;
    --text:#eef0f7; --dim:#9198b3; --panel-border:#2a2f45;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#0a0a0d;color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #c3d{position:fixed;inset:0;display:block;outline:none;}

  /* ---------------- HUD ---------------- */
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;pointer-events:none;font-size:13px;color:var(--dim);
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  #hud.hidden{display:none;}
  #hud .grp{display:flex;gap:14px;align-items:center;pointer-events:auto;}
  #hud b{color:var(--text);}
  #hud .pill{
    background:rgba(20,22,31,.7);border:1px solid var(--panel-border);
    border-radius:20px;padding:5px 12px;backdrop-filter:blur(4px);
  }
  #muteBtn{cursor:pointer;background:rgba(20,22,31,.7);border:1px solid var(--panel-border);
    border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-size:16px;pointer-events:auto;}
  #savedFlash{
    position:fixed;top:52px;right:18px;z-index:60;
    background:rgba(92,242,154,.15);border:1px solid var(--ok);color:var(--ok);
    padding:4px 10px;border-radius:8px;font-size:11px;letter-spacing:1px;
    opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  #savedFlash.show{opacity:1;}

  /* ---------------- TITLE / GAME OVER (flat overlays, like any 3D game's menu) ---------------- */
  .fullOverlay{
    position:fixed;inset:0;z-index:40;display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
    background:radial-gradient(circle at 50% 30%, rgba(36,18,20,.6) 0%, rgba(8,8,11,.86) 72%);
  }
  .fullOverlay.active{display:flex;}
  #titleLogo{
    font-size:min(18vw,140px);font-weight:900;letter-spacing:6px;
    background:linear-gradient(180deg,#ff8080 0%,var(--accent) 45%,#8a0000 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(255,60,60,.35);
    animation:titleShake 3.2s ease-in-out infinite;
  }
  @keyframes titleShake{
    0%,92%,100%{transform:translate(0,0) rotate(0deg);}
    93%{transform:translate(-3px,1px) rotate(-1deg);}
    94%{transform:translate(4px,-1px) rotate(1deg);}
    95%{transform:translate(-2px,2px) rotate(0deg);}
    96%{transform:translate(3px,0) rotate(1deg);}
    97%{transform:translate(0,0) rotate(0deg);}
  }
  #titleSub{color:var(--dim);font-size:14px;letter-spacing:3px;margin-bottom:14px;}
  .bigBtn{
    padding:16px 46px;font-size:20px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(135deg,var(--accent),#c62828);color:#fff;border:none;
    border-radius:10px;cursor:pointer;box-shadow:0 8px 24px rgba(255,60,60,.35);
    transition:transform .15s ease;
  }
  .bigBtn:hover{transform:scale(1.05);}
  .bigBtn:active{transform:scale(.97);}
  .bigBtn.blue{background:linear-gradient(135deg,var(--accent2),#3b82c4);color:#04141f;box-shadow:0 8px 20px rgba(125,211,252,.3);}
  #titleHelp{margin-top:22px;color:var(--dim);font-size:12px;line-height:1.8;max-width:360px;}
  #titleHelp b{color:var(--accent2);}
  #titleStats{margin-top:14px;color:var(--dim);font-size:11px;letter-spacing:1px;}
  #scene-gameover h1{font-size:clamp(30px,7vw,60px);color:var(--accent);margin:0;letter-spacing:2px;}
  #goStats{color:var(--dim);font-size:14px;line-height:2;margin:14px 0 22px;}
  #goStats b{color:var(--text);}

  /* ---------------- invisible click hit-regions over 3D world objects ---------------- */
  #hitLayer{position:fixed;inset:0;z-index:30;pointer-events:none;}
  .hitRegion{position:absolute;pointer-events:auto;cursor:pointer;background:transparent;border:none;padding:0;}

  /* ---------------- contextual caption + single CTA button (kept flat, like any game's prompt UI) ---------------- */
  #caption{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:35;
    text-align:center;color:#fff;font-size:14px;font-weight:600;
    text-shadow:0 2px 8px rgba(0,0,0,.9);pointer-events:none;max-width:80vw;
  }
  #ctaWrap{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:36;display:none;}
  #ctaWrap.show{display:block;}

  /* ---------------- speech bubbles (positioned via 3D->2D projection each frame) ---------------- */
  .bubble{
    position:fixed;z-index:37;background:#fff;color:#111;padding:12px 16px;border-radius:14px;
    font-size:14px;font-weight:600;max-width:220px;box-shadow:0 8px 20px rgba(0,0,0,.4);
    opacity:0;transform:translateY(8px) scale(.9);transition:opacity .3s ease,transform .3s ease;
    pointer-events:none;
  }
  .bubble.show{opacity:1;transform:translateY(0) scale(1);}
  .bubble::after{content:'';position:absolute;bottom:-9px;left:26px;border-width:10px 10px 0 0;border-style:solid;border-color:#fff transparent transparent transparent;}
  .bubble.reply{background:var(--accent2);color:#04141f;}
  .bubble.reply::after{border-color:var(--accent2) transparent transparent transparent;left:auto;right:26px;}

  #glitchText{
    position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:38;
    font-size:clamp(20px,6vw,40px);font-weight:900;color:var(--accent);letter-spacing:3px;
    text-shadow:2px 0 #7dd3fc,-2px 0 #ff00de;opacity:0;pointer-events:none;
  }
  #glitchText.show{animation:glitchPop .6s ease both;}
  @keyframes glitchPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
    15%{opacity:1;transform:translate(-52%,-48%) scale(1.05);}
    30%{transform:translate(-48%,-52%) scale(1);}
    85%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.1);}
  }

  #touchControls{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;z-index:40;}
  #touchControls.show{display:flex;}
  .tbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;pointer-events:auto;}
  #tJump{width:74px;height:74px;background:rgba(255,77,77,.25);border-color:rgba(255,77,77,.5);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div id="hud" class="hidden">
  <div class="grp">
    <span class="pill">💰 <b id="hudBalance">$0</b></span>
    <span class="pill">🖥️ PCs destroyed: <b id="hudPcs">0</b></span>
    <span class="pill">🏔️ Best height: <b id="hudBest">0</b>m</span>
  </div>
  <div class="grp"><div id="muteBtn">🔊</div></div>
</div>
<div id="savedFlash">SAVED</div>

<div id="titleScreen" class="fullOverlay active">
  <div id="titleLogo">RAGE</div>
  <div id="titleSub">a game about a game that will ruin your day</div>
  <button id="startBtn" class="bigBtn">START</button>
  <div id="titleHelp"><b>WASD / Arrows</b> to move &nbsp;•&nbsp; <b>SPACE / W / ↑</b> to jump<br>Climb as high as you can. Try not to break anything.</div>
  <div id="titleStats"></div>
</div>

<div id="scene-gameover" class="fullOverlay">
  <h1>YOU'RE BROKE</h1>
  <div id="goStats"></div>
  <button class="bigBtn" id="restartBtn">START OVER</button>
</div>

<div id="hitLayer"></div>
<div id="caption"></div>
<div id="ctaWrap"></div>
<div id="glitchText"></div>
<div id="touchControls">
  <div class="tbtn" id="tLeft">◀</div>
  <div class="tbtn" id="tRight">▶</div>
  <div class="tbtn" id="tJump">▲</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
"use strict";
/* =========================================================================
   UTIL
   ========================================================================= */
const rand = (a,b)=>a+Math.random()*(b-a);
const randInt = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeOutCubic = t=>1-Math.pow(1-t,3);
const easeInOutQuad = t=> t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const choose = arr=>arr[randInt(0,arr.length-1)];
const $ = id=>document.getElementById(id);
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function waitForEvent(el,ev){ return new Promise(res=>{ function h(e){ el.removeEventListener(ev,h); res(e); } el.addEventListener(ev,h); }); }
function fmtMoney(n){ return '$'+Math.round(n).toLocaleString('en-US'); }

/* =========================================================================
   AUDIO ENGINE  (fully synthesized, no external files -- unchanged by the 3D pass)
   ========================================================================= */
const AudioEngine = (()=>{
  let ctx=null, muted=false;
  let musicOn=false, musicTimer=null, musicIntensity=0, musicNodes=null;
  function getCtx(){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function master(){ return getCtx().destination; }
  function noiseBuffer(dur){
    const c = getCtx();
    const buf = c.createBuffer(1, Math.max(1,Math.floor(c.sampleRate*dur)), c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return buf;
  }
  function tone({freq=440,type='sine',dur=.2,vol=.3,freqEnd=null,delay=0,detune=0}={}){
    if(muted) return;
    const c=getCtx(); const t0=c.currentTime+delay;
    const osc=c.createOscillator(); osc.type=type; osc.frequency.setValueAtTime(freq,t0); osc.detune.value=detune;
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1),t0+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(.02,dur*.2));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g).connect(master());
    osc.start(t0); osc.stop(t0+dur+.05);
    return osc;
  }
  function noiseBurst({dur=.3,vol=.4,freq=2000,type='bandpass',Q=1,delay=0,freqEnd=null}={}){
    if(muted) return;
    const c=getCtx(); const t0=c.currentTime+delay;
    const src=c.createBufferSource(); src.buffer=noiseBuffer(dur);
    const filt=c.createBiquadFilter(); filt.type=type; filt.frequency.setValueAtTime(freq,t0); filt.Q.value=Q;
    if(freqEnd) filt.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,10),t0+dur);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(filt).connect(g).connect(master());
    src.start(t0); src.stop(t0+dur+.02);
  }
  function thud({vol=.5,delay=0,dur=.22}={}){
    if(muted) return;
    tone({freq:120,freqEnd:40,type:'sine',dur,vol,delay});
    noiseBurst({dur:dur*.8,vol:vol*.5,freq:400,type:'lowpass',delay});
  }
  function sUiClick(){ tone({freq:900,type:'square',dur:.05,vol:.08}); }
  function sJump(){ tone({freq:300,freqEnd:520,type:'triangle',dur:.12,vol:.18}); noiseBurst({dur:.04,vol:.05,freq:1800,delay:0}); }
  function sLand(intensity=0.5){
    const v=clamp(intensity,0,1);
    noiseBurst({dur:.09,vol:.06+v*.2,freq:1000-v*400,type:'lowpass'});
    thud({vol:.08+v*.3,dur:.1+v*.1});
  }
  function sStepClimb(pitch=1){ tone({freq:220*pitch,type:'square',dur:.06,vol:.06}); }
  function sDeathFall(){ tone({freq:500,freqEnd:60,type:'sawtooth',dur:.9,vol:.22}); noiseBurst({dur:.3,vol:.1,freq:400,type:'lowpass',delay:.6}); }
  function sKeySmash(){
    thud({vol:.7,dur:.3});
    noiseBurst({dur:.16,vol:.3,freq:500,type:'lowpass',delay:.02});
    for(let i=0;i<16;i++){
      const d=rand(0,.42);
      tone({freq:rand(300,900),type:'square',dur:.03,vol:.06,delay:d});
      noiseBurst({dur:.03,vol:.1,freq:rand(2000,5000),delay:d});
    }
    thud({vol:.3,delay:.48,dur:.28});
  }
  function sKeyPop(){
    tone({freq:rand(700,1100),type:'square',dur:.04,vol:.1});
    noiseBurst({dur:.03,vol:.12,freq:rand(3000,6000)});
    tone({freq:rand(1400,1800),type:'sine',dur:.06,vol:.03,delay:.02});
  }
  function sGlassCrack(){
    thud({vol:.55,dur:.18});
    noiseBurst({dur:.05,vol:.45,freq:6000,type:'highpass'});
    noiseBurst({dur:.25,vol:.3,freq:3500,type:'bandpass',Q:2,delay:.02});
    [3200,4800,6400].forEach((f,i)=>tone({freq:f,type:'sine',dur:.3,vol:.05,delay:.03+i*.015}));
    for(let i=0;i<6;i++) noiseBurst({dur:.02,vol:.05,freq:rand(2000,5000),delay:.08+i*.03});
  }
  function sGlassShatter(){
    thud({vol:.85,dur:.28});
    noiseBurst({dur:.08,vol:.55,freq:7000,type:'highpass'});
    noiseBurst({dur:.35,vol:.4,freq:2200,type:'bandpass',Q:1.4,delay:.02});
    noiseBurst({dur:.2,vol:.3,freq:500,type:'lowpass',delay:.05});
    [2600,3800,5200,6600].forEach((f,i)=>tone({freq:f,type:'sine',dur:.35,vol:.045,delay:.04+i*.02}));
    for(let i=0;i<12;i++){
      const d=.15+i*rand(.03,.07);
      tone({freq:rand(2500,6000),type:'sine',dur:.09,vol:.035,delay:d});
      noiseBurst({dur:.02,vol:.04,freq:rand(4000,8000),delay:d});
    }
    thud({vol:.3,delay:.5,dur:.3});
  }
  function sSpark(){ for(let i=0;i<3;i++) noiseBurst({dur:.03,vol:.1,freq:rand(4000,8000),delay:i*.08}); }
  function sDoorCreak(){
    tone({freq:170,freqEnd:280,type:'sawtooth',dur:.5,vol:.05});
    tone({freq:280,freqEnd:190,type:'sawtooth',dur:.55,vol:.045,delay:.45});
    noiseBurst({dur:.04,vol:.08,freq:2000,delay:.95});
  }
  function sDoorClose(){
    tone({freq:200,freqEnd:150,type:'sawtooth',dur:.3,vol:.05});
    thud({vol:.2,delay:.28,dur:.12});
    noiseBurst({dur:.03,vol:.06,freq:2500,delay:.32});
  }
  function sFootstep(delay=0,foot=0){
    noiseBurst({dur:.09,vol:.16,freq:foot?260:220,type:'lowpass',delay});
    tone({freq:foot?90:75,type:'sine',dur:.08,vol:.05,delay});
  }
  function sSigh(){ noiseBurst({dur:.5,vol:.06,freq:800,freqEnd:300,type:'lowpass'}); }
  function sPop(){ tone({freq:700,freqEnd:1200,type:'sine',dur:.08,vol:.1}); }
  function sPhoneChime(){ tone({freq:880,type:'sine',dur:.15,vol:.15}); tone({freq:1320,type:'sine',dur:.2,vol:.12,delay:.1}); }
  function sCashRegister(){ tone({freq:660,type:'square',dur:.08,vol:.12}); tone({freq:990,type:'square',dur:.1,vol:.12,delay:.09}); tone({freq:1320,type:'square',dur:.16,vol:.14,delay:.18}); }
  function sDeny(){ tone({freq:220,freqEnd:120,type:'sawtooth',dur:.4,vol:.2}); }
  function sCardboardRip(){
    for(let i=0;i<6;i++){
      const d=i*0.09+rand(0,.03);
      noiseBurst({dur:.12,vol:.28,freq:rand(500,1400),type:'bandpass',Q:.6,delay:d});
    }
    thud({vol:.25,delay:.6,dur:.2});
  }
  function sSnap(){ tone({freq:600,type:'square',dur:.03,vol:.12}); noiseBurst({dur:.02,vol:.12,freq:3000}); tone({freq:1800,type:'sine',dur:.05,vol:.03,delay:.02}); }
  function sPowerOn(){
    tone({freq:1400,type:'square',dur:.02,vol:.08});
    noiseBurst({dur:.02,vol:.1,freq:5000,delay:.01});
    noiseBurst({dur:1.1,vol:.16,freq:200,freqEnd:900,type:'bandpass',Q:.8,delay:.05});
    tone({freq:2000,freqEnd:3200,type:'sine',dur:.5,vol:.02,delay:.1});
    tone({freq:80,freqEnd:120,type:'sine',dur:1,vol:.15,delay:.15});
    tone({freq:1046,type:'square',dur:.12,vol:.06,delay:.9});
  }
  function sPowerOff(){ tone({freq:220,freqEnd:40,type:'sine',dur:.5,vol:.2}); noiseBurst({dur:.15,vol:.12,freq:150,type:'lowpass',delay:.02}); }
  function sWhoosh(){ noiseBurst({dur:.6,vol:.3,freq:1200,freqEnd:120,type:'lowpass'}); }
  function sRiggedSting(){
    noiseBurst({dur:.15,vol:.3,freq:1200,freqEnd:80,type:'lowpass',delay:0});
    tone({freq:200,freqEnd:50,type:'sawtooth',dur:1.1,vol:.28,delay:.1});
    noiseBurst({dur:.8,vol:.35,freq:3000,freqEnd:200,type:'bandpass',delay:.15});
  }
  function sDing(){ tone({freq:1046,type:'sine',dur:.4,vol:.12}); }
  function startAmbient(){
    if(musicOn||muted) return;
    musicOn=true;
    const c=getCtx();
    const master_ = c.createGain(); master_.gain.value=.5; master_.connect(master());
    const o1=c.createOscillator(); o1.type='sawtooth'; o1.frequency.value=55;
    const o2=c.createOscillator(); o2.type='sawtooth'; o2.frequency.value=55.6;
    const filt=c.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=300;
    const g=c.createGain(); g.gain.value=.05;
    o1.connect(filt); o2.connect(filt); filt.connect(g).connect(master_);
    o1.start(); o2.start();
    musicNodes={master_,o1,o2,filt,g};
    scheduleMusicPulse();
  }
  function scheduleMusicPulse(){
    if(!musicOn) return;
    const interval = lerp(900,320,musicIntensity);
    if(!muted){
      if(musicIntensity>.75){
        tone({freq:52,type:'sine',dur:.14,vol:.1});
        tone({freq:52,type:'sine',dur:.14,vol:.07,delay:.16});
      }else{
        tone({freq:55*2,type:'sine',dur:.3,vol:.05+musicIntensity*.05});
        if(musicIntensity>.5) tone({freq:55*3,type:'triangle',dur:.15,vol:.03,delay:.15});
      }
    }
    if(musicNodes) musicNodes.filt.frequency.setTargetAtTime(300+musicIntensity*1400, getCtx().currentTime, .3);
    musicTimer = setTimeout(scheduleMusicPulse, interval);
  }
  function setMusicIntensity(v){ musicIntensity = clamp(v,0,1); }
  function stopAmbient(){
    musicOn=false;
    clearTimeout(musicTimer);
    if(musicNodes){
      try{
        musicNodes.g.gain.setTargetAtTime(0,getCtx().currentTime,.2);
        setTimeout(()=>{ try{musicNodes.o1.stop(); musicNodes.o2.stop();}catch(e){} },400);
      }catch(e){}
      musicNodes=null;
    }
  }
  function setMuted(v){ muted=v; if(v) stopAmbient(); }
  return {
    ensure:getCtx, sUiClick,sJump,sLand,sStepClimb,sDeathFall,sKeySmash,sKeyPop,sGlassCrack,sGlassShatter,
    sSpark,sDoorCreak,sDoorClose,sFootstep,sSigh,sPop,sPhoneChime,sCashRegister,sDeny,sCardboardRip,sSnap,sPowerOn,sPowerOff,
    sWhoosh,sRiggedSting,sDing,startAmbient,stopAmbient,setMusicIntensity,setMuted,
    get muted(){return muted;}
  };
})();

/* =========================================================================
   PERSISTENT STATE
   ========================================================================= */
const SAVE_KEY = 'rage_save_v2_3d';
const state = { balance:1500, pcCost:650, pcsDestroyed:0, totalDeaths:0, bestHeight:0, muted:false, attempt:0 };
function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){}
}
function saveState(flash=true){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      balance:state.balance, pcCost:state.pcCost, pcsDestroyed:state.pcsDestroyed,
      totalDeaths:state.totalDeaths, bestHeight:state.bestHeight, muted:state.muted
    }));
    if(flash) flashSaved();
  }catch(e){}
}
function flashSaved(){
  const el = $('savedFlash');
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1200);
}
setInterval(()=>saveState(true), 30000);
function updateHud(){
  $('hudBalance').textContent = fmtMoney(state.balance);
  $('hudPcs').textContent = state.pcsDestroyed;
  $('hudBest').textContent = Math.floor(state.bestHeight);
}
function showGlitch(text){
  const el=$('glitchText');
  el.textContent=text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function setCaption(text){ $('caption').textContent = text || ''; }
function setCta(label, onClick, cls){
  const wrap = $('ctaWrap');
  wrap.innerHTML='';
  if(!label){ wrap.classList.remove('show'); return; }
  const btn=document.createElement('button');
  btn.className='bigBtn'+(cls?' '+cls:'');
  btn.textContent=label;
  btn.addEventListener('click', onClick);
  wrap.appendChild(btn);
  wrap.classList.add('show');
}
function clearCta(){ $('ctaWrap').classList.remove('show'); $('ctaWrap').innerHTML=''; }

/* =========================================================================
   THREE.JS WORLD SETUP

];
function drawKeyboardTexture(ctx,w,h,damage){
  ctx.fillStyle='#aeb2ba'; ctx.fillRect(0,0,w,h);
  const rows=KB_LAYOUT.length, padX=8, padY=6, rowH=(h-padY*2)/rows;
  let dmgSeed=0;
  KB_LAYOUT.forEach((row,ri)=>{
    const totalW = row.reduce((s,k)=>s+(k.w||1),0);
    let x=padX;
    const usableW = w-padX*2;
    row.forEach(spec=>{
      const kw = (spec.w||1)/totalW*usableW - 3;
      const y = padY + ri*rowH;
      const isDamaged = damage>0 && pseudoRand(dmgSeed++ + damage*97) < damage*0.13;
      if(isDamaged){
        ctx.fillStyle='#3a3d44';
        ctx.fillRect(x,y,kw,rowH-4);
      }else{
        const grad=ctx.createLinearGradient(x,y,x,y+rowH-4);
        grad.addColorStop(0,'#fbfcfe'); grad.addColorStop(1,'#d5d8de');
        ctx.fillStyle=grad;
        ctx.fillRect(x,y,kw,rowH-4);
        ctx.fillStyle='#565a63'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
        ctx.fillText(spec.l.toUpperCase(), x+3, y+rowH-8);
      }
      x += kw+3;
    });
  });
}
function pseudoRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

   ========================================================================= */
const debris = [];
const keycapDebrisGeo = new THREE.BoxGeometry(0.045,0.02,0.045);
const keycapDebrisMat = new THREE.MeshStandardMaterial({color:0xd7d9de});
const shardGeo = new THREE.BoxGeometry(0.05,0.004,0.08);
const shardMat = new THREE.MeshStandardMaterial({color:0xcfe8ff, roughness:0.1, metalness:0.2});
const sparkGeo = new THREE.SphereGeometry(0.012,5,5);
const dustGeo = new THREE.SphereGeometry(0.02,5,5);

function spawnDebris(position, kind, count){
  for(let i=0;i<count;i++){
    let geo, mat, gravity=2.4, life=rand(0.9,1.5);
    const vel = new THREE.Vector3(rand(-0.9,0.9), rand(0.6,1.8), rand(-0.5,0.9));
    if(kind==='keycap'){ geo=keycapDebrisGeo; mat=keycapDebrisMat; }
    else if(kind==='shard'){ geo=shardGeo; mat=shardMat; gravity=1.8; }
    else if(kind==='spark'){ geo=sparkGeo; mat=new THREE.MeshBasicMaterial({color:0xffb347,transparent:true}); gravity=1.2; life=rand(0.3,0.7); vel.multiplyScalar(1.6); }
    else { geo=dustGeo; mat=new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:0.6}); gravity=0.6; life=rand(0.35,0.6); vel.set(rand(-0.4,0.4),rand(0.2,0.7),rand(-0.4,0.4)); }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);
    scene.add(mesh);
    debris.push({mesh, vel, angVel:new THREE.Vector3(rand(-8,8),rand(-8,8),rand(-8,8)), life, maxLife:life, gravity, fade: kind==='spark'||kind==='dust'});
  }
}
function updateDebris(dtMs){
  const dt = dtMs/1000;
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.vel.y -= d.gravity*dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    d.mesh.rotation.x += d.angVel.x*dt;
    d.mesh.rotation.y += d.angVel.y*dt;
    d.life -= dt;
    if(d.fade) d.mesh.material.opacity = clamp(d.life/d.maxLife,0,1)*0.7;
    if(d.life<=0 || d.mesh.position.y < -0.3){
      scene.remove(d.mesh);
      debris.splice(i,1);
    }
  }
}

/* =========================================================================
   CAMERA CHOREOGRAPHY
   ========================================================================= */
const CAM = {
  desk:   { pos:[0, 1.32, 1.55],  look:[0, 1.05, -1.7] },
  wide:   { pos:[0.5, 1.5, 2.5],  look:[-1.2, 1.0, -1.3] },
  window: { pos:[1.1, 1.7, 0.6],  look:[2.3, 2.4, -3] },
  phone:  { pos:[0, 1.25, 1.55],  look:[0, 1.18, 0.75] },
};
camera.position.set(...CAM.desk.pos);
camera.lookAt(...CAM.desk.look);
let cameraAnim = null; // {startPos,startQuat,endPos,endQuat,t0,dur,resolve}
const _lookAtHelperCam = new THREE.PerspectiveCamera(); // a plain Object3D.lookAt() reverses eye/target vs. Camera.lookAt() -- use a real camera to get correct orientation math
function flyCameraTo(preset, dur=1100){
  return new Promise(resolve=>{
    const tmp = _lookAtHelperCam;
    tmp.position.set(...preset.pos);
    tmp.lookAt(new THREE.Vector3(...preset.look));
    const endPos = new THREE.Vector3(...preset.pos);
    if(camera.position.distanceToSquared(endPos) < 0.0004 && camera.quaternion.angleTo(tmp.quaternion) < 0.01){
      resolve(); // already there (e.g. two scenes in a row share a camera preset) -- skip the pointless tween
      return;
    }
    cameraAnim = {
      startPos: camera.position.clone(), startQuat: camera.quaternion.clone(),
      endPos, endQuat: tmp.quaternion.clone(),
      t0: performance.now(), dur, resolve
    };
  });
}
function tickCamera(now){
  if(!cameraAnim) return;
  const t = clamp((now-cameraAnim.t0)/cameraAnim.dur, 0, 1);
  const e = easeInOutQuad(t);
  camera.position.lerpVectors(cameraAnim.startPos, cameraAnim.endPos, e);
  camera.quaternion.slerpQuaternions(cameraAnim.startQuat, cameraAnim.endQuat, e);
  if(t>=1){ const r=cameraAnim.resolve; cameraAnim=null; r(); }
}
let camShakeUntil = 0, camShakeMag = 0;
function shakeCamera(mag=0.03, durMs=350){ camShakeMag=mag; camShakeUntil = performance.now()+durMs; }

/* =========================================================================
   PROJECTION-BASED HIT REGIONS + SPEECH BUBBLES (HTML overlays tracking 3D objects)
   ========================================================================= */
function worldToScreen(v3){
  const v = v3.clone().project(camera);
  return { x:(v.x*0.5+0.5)*innerWidth, y:(-v.y*0.5+0.5)*innerHeight, behind: v.z>1 };
}
const activeHitRegions = []; // {el, getPos():Vector3, sizePx}
function addHitRegion(getPos, sizePx, onClick){
  const el=document.createElement('button');
  el.className='hitRegion';
  el.addEventListener('click', onClick);
  $('hitLayer').appendChild(el);
  const entry = {el, getPos, sizePx};
  activeHitRegions.push(entry);
  return entry;
}
function removeHitRegion(entry){
  const i=activeHitRegions.indexOf(entry);
  if(i>=0) activeHitRegions.splice(i,1);
  entry.el.remove();
}
function clearHitRegions(){ while(activeHitRegions.length) removeHitRegion(activeHitRegions[0]); }
function updateHitRegions(){
  activeHitRegions.forEach(({el,getPos,sizePx})=>{
    const p = worldToScreen(getPos());
    el.style.left=(p.x-sizePx/2)+'px'; el.style.top=(p.y-sizePx/2)+'px';
    el.style.width=sizePx+'px'; el.style.height=sizePx+'px';
    el.style.display = p.behind? 'none':'block';
  });
}
const activeBubbles = []; // {el, getPos()}
function showBubble(text, getPos, cls, offsetY=0.35){
  const el=document.createElement('div');
  el.className='bubble'+(cls?' '+cls:'');
  el.textContent=text;
  document.body.appendChild(el);
  const entry={el, getPos:()=>getPos().clone().add(new THREE.Vector3(0.16,offsetY,0))};
  activeBubbles.push(entry);
  requestAnimationFrame(()=>el.classList.add('show'));
  return entry;
}
function hideBubble(entry){
  entry.el.classList.remove('show');
  setTimeout(()=>{
    const i=activeBubbles.indexOf(entry); if(i>=0) activeBubbles.splice(i,1);
    entry.el.remove();
  }, 320);
}
function updateBubbles(){
  activeBubbles.forEach(({el,getPos})=>{
    const p = worldToScreen(getPos());
    el.style.left=p.x+'px'; el.style.top=p.y+'px';
  });
}

/* =========================================================================
   THE RAGE MINI-GAME  (unchanged 2D physics/render -- drawn onto the monitor's canvas texture)
   ========================================================================= */
const CW=SCREEN_W, CH=SCREEN_H;
const TARGET_HEIGHT=4200;
const RIG_THRESHOLD=TARGET_HEIGHT*0.9;

const Climber = (()=>{
  let player, platforms, cameraY, height, running, rigged, riggedTimer, particles, keys, lastTime;
  let onDeathCb=null;
  const GRAV=0.55, JUMP_V=-11.4, MOVE_SPEED=4.2;

  function resetWorld(){
    player = {x:CW/2-12,y:CH-60,vx:0,vy:0,w:24,h:26,onGround:false};
    platforms = [{x:CW/2-60,y:CH-30,w:120,h:14,type:'normal'}];
    let y=CH-30;
    while(y>-TARGET_HEIGHT){ y -= rand(60,95); platforms.push(genPlatform(y)); }
    cameraY=0; height=0; running=false; rigged=false; riggedTimer=0; particles=[];
    keys={left:false,right:false,jump:false};
  }
  function genPlatform(y){
    const h = CH-1-y;
    const w = clamp(110-h*0.012, 46, 110);
    const x = rand(10,CW-10-w);
    let type='normal';
    const r=Math.random();
    if(h>500 && r<0.18) type='moving';
    else if(h>900 && r<0.30) type='crumble';
    return {x,y,w,h:14,type,phase:rand(0,Math.PI*2),dead:false,timer:0};
  }
  function start(cb){
    onDeathCb=cb;
    resetWorld();
    running=true;
    lastTime=performance.now();
  }
  function stop(){ running=false; }
  function setKey(k,v){ keys[k]=v; }
  function isRunning(){ return running; }

  function tick(now){
    if(!running) return;
    const dt=Math.min(32,now-lastTime)/16.67;
    lastTime=now;
    update(dt);
    render();
  }

  function update(dt){
    updateParticles(dt); // always ages/removes particles, whether rigged or not
    if(rigged){
      riggedTimer+=dt;
      player.vy += 1.6*dt;
      player.y += player.vy*dt;
      cameraY = lerp(cameraY, player.y-CH*0.35, 0.12);
      if(player.y - cameraY > CH+120){
        running=false;
        AudioEngine.sDeathFall();
        setTimeout(()=>{ if(onDeathCb) onDeathCb(Math.floor(height)); }, 250);
      }
      return;
    }
    player.vx = (keys.right?MOVE_SPEED:0) - (keys.left?MOVE_SPEED:0);
    if(keys.jump && player.onGround){ player.vy=JUMP_V; player.onGround=false; AudioEngine.sJump(); }
    player.vy += GRAV*dt;
    player.x += player.vx*dt;
    player.y += player.vy*dt;
    player.x = clamp(player.x,0,CW-player.w);

    const wasOnGround = player.onGround;
    player.onGround=false;
    for(const p of platforms){
      if(p.dead) continue;
      if(p.type==='moving'){ p.phase+=0.03*dt; p.x=clamp(p.x+Math.sin(p.phase)*1.4*dt,0,CW-p.w); }
      if(p.type==='crumble' && p.timer>0){ p.timer-=dt; if(p.timer<=0) p.dead=true; }
      const px=player.x,py=player.y,pw=player.w,ph=player.h;
      if(player.vy>0 && px+pw>p.x+4 && px<p.x+p.w-4 && py+ph>p.y && py+ph<p.y+p.h+14){
        const impactSpeed = player.vy;
        player.y = p.y-ph; player.vy=0; player.onGround=true;
        if(p.type==='crumble' && p.timer===0){ p.timer=26; }
        if(!wasOnGround){
          const intensity = clamp(impactSpeed/14,0,1);
          AudioEngine.sLand(intensity);
          spawnDust(player.x+player.w/2, player.y+player.h);
          if(intensity>0.7) shakeCamera(0.015,180);
        }
      }
    }

    height = Math.max(height, (CH-30) - player.y);
    cameraY = lerp(cameraY, player.y-CH*0.55, 0.12);

    for(const p of platforms){ if(!p.dead && p.y > cameraY+CH+40) p.dead=true; }
    platforms = platforms.filter(p=>!p.dead || p.y>cameraY-40);
    let minY=Math.min(...platforms.map(p=>p.y));
    while(minY > cameraY-TARGET_HEIGHT*2 && minY > -TARGET_HEIGHT*1.2){ minY -= rand(60,95); platforms.push(genPlatform(minY)); }

    AudioEngine.setMusicIntensity(clamp(height/TARGET_HEIGHT,0,1));

    if(player.y - cameraY > CH+60){
      running=false;
      AudioEngine.sDeathFall();
      setTimeout(()=>{ if(onDeathCb) onDeathCb(Math.floor(height)); }, 200);
      return;
    }
    if(height >= RIG_THRESHOLD && !rigged) triggerRig();
  }

  function triggerRig(){
    rigged=true;
    platforms.forEach(p=>p.dead=true);
    player.vy = 6; player.vx = 0;
    AudioEngine.sRiggedSting();
    showGlitch(choose(['NICE TRY.','SO CLOSE.','ALMOST.','NOT TODAY.','LOL NO.']));
    shakeCamera(0.05, 500);
    for(let i=0;i<40;i++) particles.push({x:player.x+player.w/2,y:player.y,vx:rand(-3,3),vy:rand(-6,-1),life:1});
  }
  function updateParticles(dt){
    particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.3*dt; p.life-=0.015*dt; });
    particles = particles.filter(p=>p.life>0);
  }
  function spawnDust(x,y){
    for(let i=0;i<6;i++) particles.push({x,y,vx:rand(-1.5,1.5),vy:rand(-1.8,-0.2),life:rand(.35,.6),type:'dust'});
  }
  function drawParallax(){
    gctx.save();
    gctx.translate(0,-cameraY*0.4);
    const spacing=52, cols=9;
    const startRow=Math.floor((cameraY*0.4-CH)/spacing)-2;
    const endRow=Math.floor((cameraY*0.4+CH)/spacing)+2;
    for(let row=startRow;row<=endRow;row++){
      for(let col=0;col<cols;col++){
        const wx=col*56+16, wy=row*spacing;
        const lit=pseudoRand(row*31.7+col*17.3)>0.72;
        gctx.fillStyle= lit? 'rgba(255,214,140,0.32)' : 'rgba(255,255,255,0.045)';
        gctx.fillRect(wx,wy,24,32);
      }
    }
    gctx.restore();
  }
  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawPlayer(){
    const cx=player.x+player.w/2, topY=player.y;
    const running_=Math.abs(player.vx)>0.4 && player.onGround;
    const t=performance.now()/100;
    const swing = running_? Math.sin(t)*7 : (player.onGround? 0 : 5);
    gctx.save();
    gctx.strokeStyle='#7a1f1f'; gctx.lineWidth=4; gctx.lineCap='round';
    gctx.beginPath(); gctx.moveTo(cx-4,topY+18); gctx.lineTo(cx-4+swing*0.35,topY+27); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(cx+4,topY+18); gctx.lineTo(cx+4-swing*0.35,topY+27); gctx.stroke();
    gctx.fillStyle='#ff4d4d';
    roundRectPath(gctx,cx-8,topY+3,16,17,4); gctx.fill();
    gctx.strokeStyle='#c93a3a'; gctx.lineWidth=3.4;
    const armSwing = running_? Math.sin(t+Math.PI)*6 : (player.onGround?0:-7);
    gctx.beginPath(); gctx.moveTo(cx-8,topY+7); gctx.lineTo(cx-13,topY+7+armSwing*0.4); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(cx+8,topY+7); gctx.lineTo(cx+13,topY+7-armSwing*0.4); gctx.stroke();
    gctx.fillStyle='#f2c9a0';
    gctx.beginPath(); gctx.arc(cx,topY,6,0,Math.PI*2); gctx.fill();
    gctx.fillStyle='#2a2a2a';
    gctx.fillRect(cx-3,topY-1,1.6,1.6); gctx.fillRect(cx+1.4,topY-1,1.6,1.6);
    gctx.restore();
  }
  function render(){
    gctx.clearRect(0,0,CW,CH);
    const t=clamp(height/TARGET_HEIGHT,0,1);
    const grad=gctx.createLinearGradient(0,0,0,CH);
    grad.addColorStop(0, lerpColor('#0d1b3a','#3a0d1b',t));
    grad.addColorStop(1, lerpColor('#1c2b52','#210a12',t));
    gctx.fillStyle=grad; gctx.fillRect(0,0,CW,CH);
    drawParallax();
    gctx.save();
    gctx.translate(0,-cameraY);
    gctx.strokeStyle='rgba(255,255,255,.15)';
    for(let i=0;i<3;i++){ gctx.beginPath(); gctx.moveTo(0,(CH-30)-TARGET_HEIGHT+i*4); gctx.lineTo(CW,(CH-30)-TARGET_HEIGHT+i*4); gctx.stroke(); }
    gctx.fillStyle='#ffd76b'; gctx.font='bold 16px sans-serif'; gctx.textAlign='center';
    gctx.fillText('🏁 FINISH', CW/2, (CH-30)-TARGET_HEIGHT-10);
    platforms.forEach(p=>{
      if(p.dead && p.type!=='crumble') return;
      let color = '#7dd3fc';
      if(p.type==='moving') color='#f472b6';
      if(p.type==='crumble') color = p.timer>0? '#ff9d4d':'#c9853a';
      gctx.fillStyle=color; gctx.fillRect(p.x,p.y,p.w,p.h);
      gctx.fillStyle='rgba(255,255,255,.28)'; gctx.fillRect(p.x,p.y,p.w,3);
      gctx.fillStyle='rgba(0,0,0,.18)'; gctx.fillRect(p.x,p.y+p.h-2,p.w,2);
    });
    drawPlayer();
    particles.forEach(p=>{
      gctx.globalAlpha=clamp(p.life,0,1);
      if(p.type==='dust'){ gctx.fillStyle='rgba(205,205,212,0.75)'; gctx.beginPath(); gctx.arc(p.x,p.y,2.4,0,Math.PI*2); gctx.fill(); }
      else{ gctx.fillStyle='#ffd76b'; gctx.fillRect(p.x,p.y,3,3); }
    });
    gctx.globalAlpha=1;
    gctx.restore();
    gctx.fillStyle='rgba(0,0,0,.35)'; gctx.fillRect(0,0,CW,26);
    gctx.fillStyle='#fff'; gctx.font='bold 13px sans-serif'; gctx.textAlign='left';
    gctx.fillText('HEIGHT: '+Math.floor(height)+'m', 10,18);
    gctx.textAlign='right';
    gctx.fillText('BEST: '+Math.floor(Math.max(state.bestHeight,height))+'m', CW-10,18);
    if(crackLayerActive) gctx.drawImage(crackLayer,0,0);
  }
  function lerpColor(c1,c2,t){
    const a=hexToRgb(c1), b=hexToRgb(c2);
    return `rgb(${Math.round(lerp(a.r,b.r,t))},${Math.round(lerp(a.g,b.g,t))},${Math.round(lerp(a.b,b.b,t))})`;
  }
  function hexToRgb(hex){ const n=parseInt(hex.slice(1),16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
  return {start,stop,setKey,isRunning,tick};
})();

  grad.addColorStop(0,'#0d1b3a'); grad.addColorStop(1,'#1c2b52');

  gctx.fillStyle='#7dd3fc'; roundRectPathStandalone(gctx, CW/2-70, CH/2+20, 140, 42, 8); gctx.fill();

  gctx.fillText(isRetry? 'RETRY':'START', CW/2, CH/2+47);

function roundRectPathStandalone(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function promptStart(isRetry){

/* =========================================================================
   CRACK / HOLE RENDERING (draws into crackLayer, composited onto the screen each frame)
   ========================================================================= */
function clearCracks(){ cctx.clearRect(0,0,crackLayer.width,crackLayer.height); crackLayerActive=false; }
function drawCrackBranch(ctx,x,y,angle,length,depth){
  if(depth<=0||length<5) return;
  const segs=randInt(3,6);
  let cx=x, cy=y, a=angle;
  ctx.beginPath(); ctx.moveTo(cx,cy);
  for(let i=0;i<segs;i++){
    a += rand(-.4,.4);
    const segLen = length/segs;
    cx += Math.cos(a)*segLen; cy += Math.sin(a)*segLen;
    ctx.lineTo(cx,cy);
    if(Math.random()<0.35) drawCrackBranch(ctx,cx,cy,a+rand(-1.1,1.1),length*.45,depth-1);
  }
  ctx.stroke();
}
function drawGlassCrack(ox,oy,radius,mainLines){
  crackLayerActive = true;
  cctx.save();
  cctx.strokeStyle='rgba(255,255,255,0.82)'; cctx.lineWidth=1.1;
  cctx.shadowColor='rgba(0,0,0,0.5)'; cctx.shadowBlur=2.5; cctx.shadowOffsetX=1; cctx.shadowOffsetY=1.5;
  for(let i=0;i<mainLines;i++){ const angle=(Math.PI*2/mainLines)*i+rand(-.35,.35); drawCrackBranch(cctx,ox,oy,angle,radius*rand(.7,1.15),3); }
  cctx.shadowBlur=1.5; cctx.shadowOffsetX=0; cctx.shadowOffsetY=0; cctx.shadowColor='rgba(180,220,255,0.5)';
  for(let r=6;r<34;r+=rand(7,12)){
    cctx.beginPath();
    for(let a=0;a<=Math.PI*2+0.25;a+=0.35){ const rr=r+rand(-2,2); const x=ox+Math.cos(a)*rr, y=oy+Math.sin(a)*rr; if(a===0) cctx.moveTo(x,y); else cctx.lineTo(x,y); }
    cctx.stroke();
  }
  cctx.shadowBlur=0; cctx.strokeStyle='rgba(255,255,255,0.95)'; cctx.lineWidth=1.8; cctx.lineCap='round';
  for(let i=0;i<mainLines;i++){
    const a=rand(0,Math.PI*2), r=rand(8,radius*0.45);
    const x=ox+Math.cos(a)*r, y=oy+Math.sin(a)*r;
    cctx.beginPath(); cctx.moveTo(x-4*Math.cos(a+1.3), y-4*Math.sin(a+1.3)); cctx.lineTo(x+4*Math.cos(a+1.3), y+4*Math.sin(a+1.3)); cctx.stroke();
  }
  cctx.restore();
}
function drawHole(ox,oy){
  crackLayerActive = true;
  cctx.save();
  cctx.globalCompositeOperation='source-over';
  cctx.fillStyle='rgba(4,4,6,0.92)'; cctx.fillRect(0,0,crackLayer.width,crackLayer.height);
  cctx.globalCompositeOperation='destination-out';
  cctx.beginPath();
  const pts=14;
  for(let i=0;i<=pts;i++){ const a=(Math.PI*2/pts)*i; const r=rand(34,58); const x=ox+Math.cos(a)*r, y=oy+Math.sin(a)*r; if(i===0) cctx.moveTo(x,y); else cctx.lineTo(x,y); }
  cctx.closePath(); cctx.fill();
  cctx.restore();
  drawGlassCrack(ox,oy,140,10);
  cctx.save();
  cctx.globalCompositeOperation='source-over';
  const grad=cctx.createRadialGradient(ox,oy,10,ox,oy,70);
  grad.addColorStop(0,'rgba(0,0,0,0.9)'); grad.addColorStop(1,'rgba(0,0,0,0)');
  cctx.fillStyle=grad; cctx.beginPath(); cctx.arc(ox,oy,70,0,Math.PI*2); cctx.fill();
  cctx.restore();
}
let deadScreenActive = false;
function startDeadScreen(){
  deadScreenActive = true;
  screenLight.intensity = 0;
}
function stopDeadScreen(){ deadScreenActive = false; screenLight.intensity = 0.35; }
function tickDeadScreen(){
  if(!deadScreenActive) return;
  const img=gctx.createImageData(CW,CH);
  for(let i=0;i<img.data.length;i+=4){ const v=Math.random()*255; img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255; }
  gctx.putImageData(img,0,0);
}

function spawnFist3D(fromLocal, toWorld, onImpact){
  return new Promise(resolve=>{
    const fistMat = new THREE.MeshStandardMaterial({color:0xf2c9a0});
    function makeFist(ghost, delayMs){
      setTimeout(()=>{
        const grp = new THREE.Group();
        const m = ghost? fistMat.clone() : fistMat;
        if(ghost){ m.transparent=true; m.opacity=0.3; }
        grp.add(new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8), m));
        grp.position.copy(fromLocal);
        scene.add(grp);
        const t0=performance.now(); const dur=260;
        function step(now){
          const t=clamp((now-t0)/dur,0,1);
          grp.position.lerpVectors(fromLocal, toWorld, easeOutCubic(t));
          if(t<1) requestAnimationFrame(step);
          else{
            scene.remove(grp);
            if(!ghost){ onImpact&&onImpact(); resolve(); }
          }
        }
        requestAnimationFrame(step);
      }, delayMs);
    }
    makeFist(true,0); makeFist(true,25); makeFist(true,45);
    makeFist(false,0);
  });
}

const momOpeners = ["Why'd you break it?!","There's a HOLE in the monitor?!","Not ANOTHER one!","Do you know how much these cost?!","I just bought that one!","We JUST talked about this!"];
const momClosers = ["Unbelievable.","We are not buying another one... fine, ONE more.","This is coming out of your allowance.","I'm telling your father.","You're paying for this one yourself.","This is the last time. I mean it."];
function tweenVec3(obj, from, to, dur){
  return new Promise(resolve=>{
    const t0=performance.now();
    function step(now){
      const t=clamp((now-t0)/dur,0,1);
      obj.position.lerpVectors(from, to, easeOutCubic(t));
      if(t<1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

/* =========================================================================
   WAITING SCENE (2 days -- real sun/moon crossing the 3D window)
   ========================================================================= */
async function waitingScene(){
  await flyCameraTo(CAM.window, 1000);
  setCaption('Estimated delivery: 2 days');
  for(let day=1; day<=2; day++){
    await new Promise(resolve=>{ setCta('Wait a day', ()=>{ clearCta(); resolve(); }); });
    AudioEngine.sUiClick();
    await animateDayNightCycle();
    setCaption(day<2 ? `DAY ${day} OF 2 — Almost there...` : `DAY ${day} OF 2 — It should arrive today!`);
  }
  await wait(500);
  setCaption('');
}
function animateDayNightCycle(){
  return new Promise(resolve=>{
    const t0=performance.now(); const dur=1400;
    function step(now){
      const t=clamp((now-t0)/dur,0,1);
      // sun rises left->right then a moon falls right->left (compressed day+night in one window pass)
      if(t<0.5){
        const tt=t/0.5;
        sunMoon.material.color.setHex(0xfff6c8);
        sunMoon.position.set(lerp(-0.7,0.7,tt), lerp(-0.5,0.6,Math.sin(tt*Math.PI)), 0.03);
        windowGlassMat.color.setHex(lerpHex(0x142544,0x6fa8d8,Math.sin(tt*Math.PI)));
      }else{
        const tt=(t-0.5)/0.5;
        sunMoon.material.color.setHex(0xdfe6ff);
        sunMoon.position.set(lerp(-0.7,0.7,tt), lerp(-0.5,0.5,Math.sin(tt*Math.PI)), 0.03);
        windowGlassMat.color.setHex(lerpHex(0x142544,0x24345c,Math.sin(tt*Math.PI)));
      }
      if(t<1) requestAnimationFrame(step);
      else{ sunMoon.position.set(-2,-2,0.03); windowGlassMat.color.setHex(0x142544); resolve(); }
    }
    requestAnimationFrame(step);
  });
}
function lerpHex(c1,c2,t){
  const a={r:(c1>>16)&255,g:(c1>>8)&255,b:c1&255}, b={r:(c2>>16)&255,g:(c2>>8)&255,b:c2&255};
  return (Math.round(lerp(a.r,b.r,t))<<16)|(Math.round(lerp(a.g,b.g,t))<<8)|Math.round(lerp(a.b,b.b,t));
}

/* =========================================================================
   ASSEMBLY SCENE (floating 3D parts you click to install)
   ========================================================================= */
async function assemblyScene(){
  await flyCameraTo(CAM.desk, 900);
  boxGroup.visible = false;
  monitor.visible = false; keyboardGroup.visible = false; mouseDevice.visible = false; towerGroup.visible = false;
  partMeshes.forEach(p=>scene.remove(p.mesh));
  partMeshes = [];
  const slots = [
    {id:'tower', pos:new THREE.Vector3(-1.55, 0.5, -1.5)},
    {id:'monitor', pos:new THREE.Vector3(0, DESK_TOP_Y+0.035+0.4, -0.15)},
    {id:'keyboard', pos:new THREE.Vector3(0, DESK_TOP_Y+0.06, 0.28)},
    {id:'mouse', pos:new THREE.Vector3(0.52, DESK_TOP_Y+0.08, 0.3)},
  ];
  let placed = 0;
  setCaption(`Click each part to install it — 0/${slots.length}`);
  await new Promise(resolveAll=>{
    PARTS_DEF.forEach((def,i)=>{
      const mesh = def.build();
      const floatPos = new THREE.Vector3(-0.66+i*0.44, 1.38+Math.sin(i*1.7)*0.05, 0.1);
      mesh.position.copy(floatPos);
      scene.add(mesh);
      const entry = {mesh, def, floatPos, region:null};
      partMeshes.push(entry);
      entry.region = addHitRegion(()=>mesh.position.clone(), 100, async ()=>{
        removeHitRegion(entry.region); entry.region=null;
        const idx=partMeshes.indexOf(entry); if(idx>=0) partMeshes.splice(idx,1); // stop idle-bob touching it once it starts flying to its slot
        AudioEngine.sSnap();
        const slot = slots.find(s=>s.id===def.id);
        await tweenVec3(mesh, mesh.position.clone(), slot.pos, 450);
        scene.remove(mesh);
        if(def.id==='tower') towerGroup.visible = true;
        if(def.id==='monitor') monitor.visible = true;
        if(def.id==='keyboard') keyboardGroup.visible = true;
        if(def.id==='mouse') mouseDevice.visible = true;
        placed++;
        setCaption(`Click each part to install it — ${placed}/${slots.length}`);
        if(placed>=slots.length) resolveAll();
      });
    });
  });
  await wait(300);
  setCaption('');
  await new Promise(resolve=>{ setCta('POWER ON', ()=>{ clearCta(); resolve(); }, 'blue'); });
  AudioEngine.sPowerOn();
  screenLight.intensity = 0.35;
  await wait(900);
}

/* =========================================================================

   ========================================================================= */
function resetMonitorFresh(){
  clearCracks();
  stopDeadScreen();
  keyboardDamageLevel = 0; refreshKeyboardTexture();
  Object.values(hintKeyMeshes).forEach(m=>{ m.visible=true; });
  towerLed.material.color.setHex(0x4dff4d);
  monitor.visible = true; keyboardGroup.visible = true; mouseDevice.visible = true; towerGroup.visible = true;

/* =========================================================================
   MAIN FLOW
   ========================================================================= */
async function playPcLifecycle(){
  await flyCameraTo(CAM.desk, 900);
  resetMonitorFresh();
  state.attempt=0;
  updateHud();

  while(state.attempt < 3){
    await promptStart(state.attempt>0);
    AudioEngine.startAmbient();
    await runRageGame();
    AudioEngine.stopAmbient();
    state.attempt++;
    saveState(false);
    if(state.attempt===1) await cutsceneKeyboardSmash();
    else if(state.attempt===2) await cutsceneScreenCrack();
    else if(state.attempt===3) await cutsceneScreenHole();
  }

  await momScene();
  await phoneStoreScene();
  await waitingScene();
  await deliveryScene();
  await assemblyScene();

  state.pcsDestroyed++;
  state.pcCost = Math.round(state.pcCost*1.22/10)*10;
  saveState();
  updateHud();
  // no need to fly the camera back / reset the monitor here -- assemblyScene already
  // left the camera at CAM.desk, and the next loop iteration does both of those anyway.
}
async function gameOverBankrupt(){
  $('scene-gameover').classList.add('active');
  $('goStats').innerHTML =
    `You destroyed <b>${state.pcsDestroyed}</b> PC${state.pcsDestroyed===1?'':'s'}<br>`+
    `Total rage-quits: <b>${state.totalDeaths}</b><br>`+
    `Best height reached: <b>${Math.floor(state.bestHeight)}m</b><br>`+
    `Final balance: <b>${fmtMoney(state.balance)}</b> (not enough for another PC)`;
  await waitForEvent($('restartBtn'),'click');
  AudioEngine.sUiClick();
  Object.assign(state,{balance:1500,pcCost:650,pcsDestroyed:0,totalDeaths:0,bestHeight:0,attempt:0});
  saveState();
  updateHud();
  $('scene-gameover').classList.remove('active');
  $('titleScreen').classList.add('active');
  $('hud').classList.add('hidden');
}
async function mainLoop(){
  while(true){
    try{ await playPcLifecycle(); }
    catch(e){
      if(e instanceof Bankrupt) await gameOverBankrupt();
      else{ console.error(e); await wait(500); }
    }
  }
}

/* =========================================================================
   MAIN RENDER LOOP
   ========================================================================= */
let lastFrame = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = now-lastFrame; lastFrame = now;

  if(mom.visible) momBob.position.y = Math.sin(now/650)*0.01;
  partMeshes.forEach((p,i)=>{ p.mesh.position.y = p.floatPos.y + Math.sin(now/500+i*1.7)*0.04; p.mesh.rotation.y = now/1400+i; });
  tickCamera(now);
  updateDebris(dt);
  updateHitRegions();
  updateBubbles();

  if(Climber.isRunning()) Climber.tick(now);
  if(deadScreenActive) tickDeadScreen();
  screenTexture.needsUpdate = true;

  let px=0, py=0;
  if(now < camShakeUntil){ px = rand(-1,1)*camShakeMag; py = rand(-1,1)*camShakeMag; }
  camera.position.x += px*0.02; camera.position.y += py*0.02;
  renderer.render(scene, camera);
  camera.position.x -= px*0.02; camera.position.y -= py*0.02;
}
