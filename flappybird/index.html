// warm colour grade + vignette to sell the lighting
function drawGrade() {
  const amb = sky('amb');
  ctx.save();
  if (amb < .98) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = (1 - amb) * .55;
    ctx.fillStyle = rgb(mixRGB([255, 255, 255], sky('light'), .9));
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  ctx.save();
  const v = ctx.createRadialGradient(W / 2, H * .45, H * .25, W / 2, H * .45, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,' + (.36 + vignettePulse * .34).toFixed(3) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // a cave map keeps its own dark, with a pool of light around the bird
  if (MAP.dark) {
    ctx.save();
    const d = MAP.dark;
    const pool = ctx.createRadialGradient(bird.x, bird.y, 40, bird.x, bird.y, 240);
    pool.addColorStop(0, 'rgba(0,0,0,0)');
    pool.addColorStop(1, 'rgba(0,0,0,' + d.toFixed(2) + ')');
    ctx.fillStyle = pool;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ruled paper drawn over the whole scene
  if (MAP.paperGrid) {
    ctx.save();
    ctx.globalAlpha = .5;
    ctx.strokeStyle = 'rgba(120,160,200,.55)'; ctx.lineWidth = 1;
    for (let y = 26; y < H; y += 26) {
      ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(230,120,120,.6)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(38.5, 0); ctx.lineTo(38.5, H); ctx.stroke();
    ctx.globalAlpha = .10;
    ctx.fillStyle = '#7a7466';
    for (let i = 0; i < 160; i++) {
      ctx.fillRect(hash(i * 3.1) * W, hash(i * 7.7) * H, 1.4, 1.4);
    }
    ctx.restore();
  }

  if (flash > .01) {
    ctx.save();
    ctx.globalAlpha = flash;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

/* =======================================================================
   AMBIENT LIFE — drawn in front of the world
   ======================================================================= */
function drawStains() {
  ctx.save();
  for (const st of stains) {
    ctx.globalAlpha = clamp(st.life, 0, 1) * .55;
    ctx.fillStyle = '#6d0f12';
    for (const b of st.blobs) {
      ctx.beginPath(); ctx.ellipse(st.x + b.dx, st.y + b.dy, b.r, b.r * .45, 0, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}
function drawBlood() {
  ctx.save();
  for (const b of blood) {
    ctx.globalAlpha = clamp(b.life, 0, 1) * .85;
    const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, 0, b.x, b.y, b.r);
    g.addColorStop(0, '#c4262c'); g.addColorStop(1, '#7a0d12');
    ctx.fillStyle = g;
    ctx.beginPath();
    // droplets stretch along their travel direction
    const sp = Math.hypot(b.vx, b.vy);
    ctx.ellipse(b.x, b.y, b.r * (1 + sp * .10), b.r, Math.atan2(b.vy, b.vx), 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}
function drawLeaves() {
  if (!MAP.air.leaves) return;
  ctx.save();
  for (const l of leaves) {
    ctx.globalAlpha = (.35 + l.depth * .35) * .9;
    ctx.save();
    ctx.translate(l.x, l.y); ctx.rotate(l.rot);
    ctx.scale(1, .55 + .45 * Math.abs(Math.cos(l.sway)));   // flutter edge-on
    const g = ctx.createLinearGradient(-l.len, 0, l.len, 0);
    g.addColorStop(0, rgb(tint(l.col)));
    g.addColorStop(1, rgb(tint(mixRGB(l.col, [60, 40, 12], .5))));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-l.len, 0);
    ctx.quadraticCurveTo(0, -l.len * .62, l.len, 0);
    ctx.quadraticCurveTo(0, l.len * .62, -l.len, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(70,50,16,.5)'; ctx.lineWidth = .6;
    ctx.beginPath(); ctx.moveTo(-l.len, 0); ctx.lineTo(l.len, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawMotes() {
  ctx.save();
  const amb = sky('amb');
  for (const m of motes) {
    const y = m.y + Math.sin(m.ph) * 8;
    ctx.globalAlpha = (.10 + m.d * .28) * amb;
    ctx.fillStyle = rgb(mixRGB(sky('light'), [255, 255, 255], .5));
    ctx.beginPath(); ctx.arc(m.x, y, m.r, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}
function drawButterflies() {
  if (!MAP.air.butterflies) return;
  ctx.save();
  for (const b of butterflies) {
    const y = b.y + Math.sin(b.t * b.sp * 2.2) * b.amp;
    const f = Math.abs(Math.sin(b.ph));      // wing beat
    ctx.save();
    ctx.translate(b.x, y);
    ctx.rotate(Math.cos(b.t * b.sp * 2.2) * .3);
    ctx.globalAlpha = .9;
    for (const sgn of [-1, 1]) {
      ctx.save();
      ctx.scale(sgn * (.25 + f * .75), 1);
      const g = ctx.createLinearGradient(0, -4, 6, 4);
      g.addColorStop(0, rgb(tint(b.col)));
      g.addColorStop(1, rgb(tint(mixRGB(b.col, [80, 40, 20], .55))));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(6, -6, 7, -1);
      ctx.quadraticCurveTo(6, 4, 0, 1.5);
      ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(40,28,14,.9)';
    ctx.fillRect(-.6, -3, 1.2, 7);
    ctx.restore();
  }
  ctx.restore();
}
function drawPrecip(front) {
  if (!drops.length) return;
  const kind = MAP.precip;
  ctx.save();
  const slant = wind * .9;
  let i = 0;

  if (kind === 'snow' || kind === 'ash') {
    const col = kind === 'snow' ? [255, 255, 255] : [126, 116, 112];
    for (const d of drops) {
      if ((i++ % 2 === 0) !== front) continue;
      ctx.globalAlpha = d.a * (front ? 1 : .55);
      ctx.fillStyle = rgb(mixRGB(col, sky('light'), .25));
      ctx.beginPath();
      ctx.arc(d.x + Math.sin(d.ph) * 3, d.y, d.len * (front ? .55 : .4), 0, 6.2832);
      ctx.fill();
    }
    if (kind === 'ash' && front) {   // a few embers still hot
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < drops.length; k += 9) {
        const d = drops[k];
        ctx.globalAlpha = .5 * Math.abs(Math.sin(d.ph * 2));
        ctx.fillStyle = '#ff8a2a';
        ctx.beginPath(); ctx.arc(d.x, d.y, d.len * .5, 0, 6.2832); ctx.fill();
      }
    }
  } else {
    // rain and sand both read as streaks, sand nearly horizontal
    const horiz = kind === 'sand';
    ctx.strokeStyle = horiz
      ? rgba(mixRGB([222, 190, 138], sky('light'), .3), front ? .5 : .3)
      : rgba(mixRGB(sky('light'), [190, 215, 255], .6), front ? .5 : .28);
    ctx.lineWidth = front ? 1.3 : .9;
    ctx.lineCap = 'round';
    for (const d of drops) {
      if ((i++ % 2 === 0) !== front) continue;
      ctx.globalAlpha = d.a * (front ? 1 : .7);
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      if (horiz) ctx.lineTo(d.x + d.len, d.y - d.len * .12);
      else ctx.lineTo(d.x - slant * d.len * .2, d.y + d.len);
      ctx.stroke();
    }
  }

  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(220,235,255,.45)'; ctx.lineWidth = 1;
  for (const sp of splashes) {
    ctx.globalAlpha = sp.life * .5;
    ctx.beginPath(); ctx.ellipse(sp.x, sp.y, sp.r * 3, sp.r, 0, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();
}

function drawBolt() {
  if (bolt.life <= 0 || !bolt.pts.length) return;
  const a = Math.min(1, bolt.life);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of [[14, .10], [6, .30], [2.2, .95]]) {
    ctx.lineWidth = pass[0];
    ctx.strokeStyle = 'rgba(226,240,255,' + (pass[1] * a).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(bolt.pts[0][0], bolt.pts[0][1]);
    for (let i = 1; i < bolt.pts.length; i++) ctx.lineTo(bolt.pts[i][0], bolt.pts[i][1]);
    ctx.stroke();
    ctx.beginPath();
    for (let i = 2; i < bolt.pts.length - 1; i += 3) {
      const [fx, fy] = bolt.pts[i];
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + (i % 2 ? 26 : -26), fy + 30);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawGusts() {
  if (!gusts.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (const g of gusts) {
    ctx.globalAlpha = g.life * .16;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x - g.len * .5, g.y - 4, g.x - g.len, g.y + 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRipples() {
  ctx.save();
  for (const r of ripples) {
    ctx.globalAlpha = r.life * .5;
    ctx.strokeStyle = 'rgba(255,240,230,.9)';
    ctx.lineWidth = 2 * r.life;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 3.2, r.r, 0, 0, 6.2832); ctx.stroke();
  }
  ctx.restore();
}
function drawTrail() {
  ctx.save();
  let i = -1;
  for (const t of trail) {
    i++;
    ctx.globalAlpha = t.life * (power.star > 0 ? .34 : .16);
    ctx.fillStyle = power.star > 0 ? rgb(hsl(starHue - i * 26, .95, .6)) : rgb(tint(PL().body));
    ctx.save();
    ctx.translate(t.x, t.y); ctx.rotate(t.rot);
    const ts = birdScale();
    ctx.beginPath(); ctx.ellipse(0, 0, 15 * t.life * ts, 13 * t.life * ts, 0, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* =======================================================================
   UI
   ======================================================================= */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function bigNumber(n, x, y, size) {
  ctx.save();
  ctx.font = '900 ' + size + 'px "Avenir Next", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3;
  ctx.lineWidth = size * .16; ctx.strokeStyle = 'rgba(20,24,34,.85)';
  ctx.strokeText(n, x, y);
  ctx.shadowColor = 'transparent';
  const g = ctx.createLinearGradient(0, y - size * .5, 0, y + size * .5);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.55, '#f4f7fb'); g.addColorStop(1, '#c8d2e0');
  ctx.fillStyle = g;
  ctx.fillText(n, x, y);
  ctx.restore();
}

const MEDALS = [
  { name: 'PLATINUM', at: 40, a: '#e8f2ff', b: '#94a8c4', t: '#2b3a4d' },
  { name: 'GOLD',     at: 25, a: '#ffe27a', b: '#c48f12', t: '#4a3405' },
  { name: 'SILVER',   at: 12, a: '#e9eef4', b: '#9aa6b4', t: '#39434f' },
  { name: 'BRONZE',   at: 5,  a: '#f0b183', b: '#a9611f', t: '#472108' }
];
const SILVER_AT = MEDALS.find(m => m.name === 'SILVER').at;
function medalFor(s) {
  for (const m of MEDALS) if (s >= m.at) return m;
  return null;
}
function drawMedal(x, y, r, m, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t * 1.4) * .06);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, m.a); g.addColorStop(.5, m.b); g.addColorStop(1, m.a);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r - 3, 0, 6.2832); ctx.stroke();
  // rotating specular sweep
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r - 3, 0, 6.2832); ctx.clip();
  ctx.globalAlpha = .5;
  ctx.rotate(t * .9);
  const sg = ctx.createLinearGradient(-r, 0, r, 0);
  sg.addColorStop(0, 'rgba(255,255,255,0)');
  sg.addColorStop(.5, 'rgba(255,255,255,.85)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(-r, -r * .4, r * 2, r * .8);
  ctx.restore();
  ctx.fillStyle = m.t;

// mode cards on the ready screen
/* =======================================================================
   MENU LIST — maps and modes at a readable size in a scrollable panel,
   so adding more of either never squeezes anything.
   ======================================================================= */
const MENU_VIEW = { x: 14, y: 126, w: W - 28, h: 444 };
const MAP_KEYS = ['Q', 'W', 'E', 'R', 'T', 'A', 'S', 'D', 'F', 'G',
                  'Z', 'C', 'Y', 'U', 'I', 'O', 'H', 'J', 'K', 'L'];
const MAP_CARD = { h: 58, gy: 8, top: 26 };
const MODE_CARD = { h: 48, gy: 7, gap: 30, headH: 30 };
let menuScroll = 0;

function menuColW() { return (MENU_VIEW.w - 30) / 2; }
function mapRows() { return Math.ceil(MAPS.length / 2); }
function modeRows() { return Math.ceil(MODES.length / 2); }
function modeTopLocal() {
  return MAP_CARD.top + mapRows() * (MAP_CARD.h + MAP_CARD.gy) - MAP_CARD.gy + MODE_CARD.gap;
}
function menuContentH() {
  return modeTopLocal() + modeRows() * (MODE_CARD.h + MODE_CARD.gy) - MODE_CARD.gy + 16;
}
function menuScrollMax() { return Math.max(0, menuContentH() - MENU_VIEW.h); }
function clampMenuScroll() { menuScroll = clamp(menuScroll, 0, menuScrollMax()); }

function mapCardRect(i) {
  const c = i % 2, r = (i / 2) | 0, cw = menuColW();
  return { x: MENU_VIEW.x + 10 + c * (cw + 10),
           y: MENU_VIEW.y + MAP_CARD.top + r * (MAP_CARD.h + MAP_CARD.gy) - menuScroll,
           w: cw, h: MAP_CARD.h };
}
function modeCardRect(i) {
  const c = i % 2, r = (i / 2) | 0, cw = menuColW();
  const last = (i === MODES.length - 1 && MODES.length % 2 === 1);
  return { x: MENU_VIEW.x + 10 + (last ? 0 : c * (cw + 10)),
           y: MENU_VIEW.y + modeTopLocal() + r * (MODE_CARD.h + MODE_CARD.gy) - menuScroll,
           w: last ? cw * 2 + 10 : cw, h: MODE_CARD.h };
}
function shopBtnRect() { return { x: (W - 168) / 2, y: 12, w: 168, h: 30 }; }
function inMenuView(p) {
  return p.x >= MENU_VIEW.x && p.x <= MENU_VIEW.x + MENU_VIEW.w &&
         p.y >= MENU_VIEW.y && p.y <= MENU_VIEW.y + MENU_VIEW.h;
}

// clip a label to the space it has, rather than letting it run on
function fitText(txt, maxW) {
  if (!txt) return '';
  if (ctx.measureText(txt).width <= maxW) return txt;
  let t = txt;
  while (t.length > 1 && ctx.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1);
  return t.replace(/[ ,.:;]+$/, '') + '\u2026';
}

function drawMenuList() {

    if (m.bonus) {

    } else {

    else { g.addColorStop(0, 'rgba(34,40,56,.80)'); g.addColorStop(1, 'rgba(22,26,38,.80)'); }

    roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
    ctx.strokeStyle = sel ? 'rgba(255,216,110,.95)' : 'rgba(255,255,255,.12)';
    ctx.lineWidth = sel ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.font = '800 12px "Avenir Next", Helvetica, Arial, sans-serif';

    if (m.id === 'move' && MAP.movingPipes) tail = 'Already moving on ' + MAP.name + '.';
    else if (m.id !== 'infinite') tail += '   ·   +10 at silver';
    ctx.fillText(fitText(tail, r.w - 24), r.x + 12, r.y + 36);
  });

  ctx.restore();   // end clip

  // scroll indicator
  const max = menuScrollMax();

    const trackX = MENU_VIEW.x + MENU_VIEW.w - 5;
    const th = Math.max(34, MENU_VIEW.h * (MENU_VIEW.h / menuContentH()));

    // fade hints at the edges
    ctx.save();
    roundRect(MENU_VIEW.x, MENU_VIEW.y, MENU_VIEW.w, MENU_VIEW.h, 14); ctx.clip();
    if (menuScroll > 2) {
      const fg = ctx.createLinearGradient(0, MENU_VIEW.y, 0, MENU_VIEW.y + 26);
      fg.addColorStop(0, 'rgba(8,12,20,.85)'); fg.addColorStop(1, 'rgba(8,12,20,0)');
      ctx.fillStyle = fg; ctx.fillRect(MENU_VIEW.x, MENU_VIEW.y, MENU_VIEW.w, 26);

    if (menuScroll < max - 2) {

      fg2.addColorStop(0, 'rgba(8,12,20,0)'); fg2.addColorStop(1, 'rgba(8,12,20,.85)');

    }

  ctx.restore();
}

// the panel slides in, so the buttons have to be measured the same way

const GO_PANEL = { w: 300, h: 216 };
function goLayout() {
  const t = clamp(gameOverT, 0, 1);
  const ease = 1 - Math.pow(1 - t, 3);
  const px = (W - GO_PANEL.w) / 2, py = 200 - 40 * (1 - ease);
  const by = py + GO_PANEL.h + 20, bh = 40, gap = 12;
  const againW = 168, menuW = 104;
  const total = againW + gap + menuW;
  const bx = (W - total) / 2;

    px: px, py: py, w: GO_PANEL.w, h: GO_PANEL.h, t: t,
    again: { x: bx, y: by, w: againW, h: bh },
    menu: { x: bx + againW + gap, y: by, w: menuW, h: bh }

}

/* =======================================================================
   PHYSICS CONSTANTS
   ======================================================================= */
const GRAVITY = 0.42, FLAP_V = -7.3, MAX_FALL = 11.5, TERMINAL_ROT = 1.45;
const CEILING = 8;   // fly into this and the run is over

// upside-down mode inverts the bird's whole relationship with gravity:
// it falls toward the sky and flaps itself down toward the grass
function gdir() { return mode === 'flip' ? -1 : 1; }
function birdScale() { return MD().sizeMul || 1; }
function birdRadius() { return 13 * (1 + (birdScale() - 1) * .92); }
function grav() { return GRAVITY * (MD().gravMul || 1) * (MAP.gravMul || 1); }
function flapV() { return FLAP_V * (MD().flapMul || 1); }
function maxFall() { return MAX_FALL * (MD().fallMul || 1); }

function flap() {
  if (state === S.READY) { startRun(); return; }
  if (state === S.DEAD) { replay(); return; }
  if (state === S.PAUSED) { state = S.PLAY; return; }
  if (state !== S.PLAY) return;
  if (sleepMode() && sleepy.asleep) {     // fast asleep — the tap goes nowhere
    if (Math.random() < .4) spawnZ(.7);
    return;
  }

  // glacier: frost on the wings makes the stroke land unevenly
  const jit = MAP.flapJitter || 0;
  const power2 = jit ? 1 + rnd(-jit, jit) : 1;
  bird.vy = flapV() * gdir() * power2;
  if (jit) {
    const weak = power2 < .94, strong = power2 > 1.06;
    if (weak || strong) {
      puff(bird.x - 8, bird.y + 4, weak ? 5 : 3, 1.6, [214, 240, 255]);
      if (weak) floatText(bird.x + 4, bird.y - 26, 'FROST', '#bfe4ff', 11);
    }
  }
  bird.rotV = -.22 * gdir();
  bird.flapPhase = -Math.PI / 2;   // snap the wings to the top of the stroke
  bird.flapSpeed = .60;
  bird.beak = 1;
  bird.squash = -.16;
  bird.legTuck = 1;
  wingBlur = 1;
  totalFlaps++;

  const voice = skinSfx();
  AU.flap(.85 + Math.random() * .3, voice);
  if (Math.random() < .10) AU.call(voice.call, .45);   // the odd call in flight
  puff(bird.x - 10, bird.y + 8, 5, 1.5, [255, 255, 255]);
  if (Math.random() < .18) burstFeathers(bird.x - 6, bird.y + 4, 1, -1);
}

function startRun() {
  state = S.PLAY;
  runs++;
  runTime = 0; newBest = false;
  bird.vy = flapV() * .8 * gdir();
  AU.call(skinSfx().call, .7);
  spawnGap = 0;
  AU.ui();
  AU.setMusic(1, .15);
}

// straight back into a run with the same map and mode
function replay() {
  reset();
  startRun();
}
// back to the map / mode picker
function toMenu() {
  reset();
  AU.ui();
}

function reset() {
  state = S.READY;
  score = 0; speed = 2.15; gapSize = 206;
  pipes.length = 0; feathers.length = 0; particles.length = 0; floaters.length = 0;
  blood.length = 0; stains.length = 0; trail.length = 0; splashes.length = 0;
  worldCoins.length = 0; items.length = 0; zs.length = 0;
  hazards.length = 0; hazardTimer = 2.5;
  pipeDir = 1; resetBoss();
  gustT = 4; gustFlash = 0;
  sleepy.phase = 0; sleepy.asleep = false; sleepy.drowsy = 0; sleepy.zTimer = 0;
  power.magnet = power.wind = power.star = 0;
  itemCountdown = 3;
  gusts.length = 0; bolt.life = 0;
  bird.y = READY_Y; bird.vy = 0; bird.rot = 0; bird.rotV = 0;
  bird.dead = false; bird.landed = false; bird.squash = 0;
  bird.r = birdRadius();
  bird.flipAmt = mode === 'flip' ? 1 : 0;
  shake = 0; flash = 0; vignettePulse = 0; slowmo = 1; gameOverT = 0;
  runTime = 0; newBest = false; ripples.length = 0; raceResult = null; invuln = 0;
  runCoins = 0; bonusAwarded = 0; modeBonusAwarded = 0;
  resetRival();
  AU.setMusic(.55, 0);
}

// every map but the meadow pays out for a run past five pipes,
// and every mode but infinite pays out for a silver medal
let bonusAwarded = 0, modeBonusAwarded = 0;
function modeBonus() { return mode === 'infinite' ? 0 : 10; }
function awardModeBonus() {
  modeBonusAwarded = 0;
  const b = modeBonus();
  if (b > 0 && score >= SILVER_AT) {
    modeBonusAwarded = b;
    coins += b; runCoins += b;
    floatText(W / 2, 176, MD().name + ' SILVER  +' + b, '#e9eef4', 18);
  }
}
function bonusAt() { return MAP.bonusAt || 6; }
// the map's own movement wins; MOVE mode only animates the still maps
function pipeMotion() {
  return MAP.movingPipes || (MD().movePipes ? { sp: [.5, 1.0] } : null);
}
function awardMapBonus() {
  bonusAwarded = 0;
  const b = MAP.bonus || 0;
  if (b > 0 && score >= bonusAt()) {
    bonusAwarded = b;
    coins += b; runCoins += b;
    AU.fanfare();
    floatText(W / 2, 128, MAP.name + ' BONUS  +' + b, '#ffd04a', 20);
  }
}

function die(cause) {
  if (state !== S.PLAY) return;
  state = S.DYING;
  bird.dead = true;
  deathCause = cause;
  bird.rotV = .12;
  if (cause === 'pipe') bird.vy = -3.4 * gdir();
  if (cause === 'ceiling') { bird.vy = 3.2; bird.rot = -.5; bird.rotV = .3; }
  if (cause === 'ground' && gdir() < 0) bird.vy = -3.0;
  if (cause === 'boulder') { bird.vy = 2.6; bird.rotV = .34; }
  if (cause === 'orb') { bird.vy = -2.2; bird.rotV = -.3; }
  shake = cause === 'ceiling' ? 20 : 16;
  flash = .55; slowmo = .35; vignettePulse = 1;
  AU.hit(); AU.call(skinSfx().call, 1.15); AU.duckMusic();
  if (cause === 'ceiling') AU.bonk();
  setTimeout(() => AU.fall(), 220);
  burstFeathers(bird.x, bird.y, cause === 'ceiling' ? 22 : 16, -1.5);
  puff(bird.x, bird.y, 12, 3.2, [255, 240, 200]);
  spatter(bird.x + (cause === 'pipe' ? 10 : 0), bird.y, cause === 'ceiling' ? 9 : 7,
          cause === 'pipe' ? -1.2 : 0, cause === 'ceiling' ? 1.2 : -.4);
  if (cause === 'ceiling') {
    // smear of feathers along the underside of the sky
    for (let i = 0; i < 10; i++) puff(bird.x + rnd(-24, 24), CEILING + rnd(0, 10), 1, 2.2, [235, 244, 255]);
    ripples.push({ x: bird.x, y: CEILING + bird.r, r: 4, life: 1 });
  }
  awardMapBonus();
  awardModeBonus();
  stats.deaths[cause] = (stats.deaths[cause] || 0) + 1;
  stats.pipes += score;
  stats.time += runTime;
  if (runTime > stats.bestTime) stats.bestTime = runTime;
  if (score > best) { best = score; newBest = true; floatText(W / 2, 150, 'NEW BEST!', '#ffd04a', 24); }
  save();
}

/* =======================================================================
   UPDATE
   ======================================================================= */
function update(dt) {
  timeSec += dt;
  const idle = state === S.READY || state === S.SHOP;
  const moving = state === S.PLAY || idle;

  // --- sky drifts through the day as the score climbs ---
  const day0 = MAP.dayStart == null ? 1 : MAP.dayStart;
  dayTarget = idle ? day0 : day0 + score / 9;
  dayPos += (dayTarget - dayPos) * Math.min(1, 1.4 * dt);
  const N = MAP.skies.length;
  const phase = dayPos % N;
  skyA = Math.floor(phase) % N;
  skyB = (skyA + 1) % N;
  skyT = phase - Math.floor(phase);

  // --- background always breathes, even on the menu ---
  for (const c of clouds) {
    c.x -= (0.16 + c.depth * 1.5) * (moving ? 1 : .5) * dt * 60;
    if (c.x < -240) { const n = makeCloud(W + rnd(60, 320)); Object.assign(c, n); }
  }
  for (const b of birdsFar) {
    b.x -= b.sp * dt * 60;
    if (b.x < -20) { b.x = W + rnd(20, 180); b.y = rnd(50, 280); }
  }
  if (timeSec - lastChirp > rnd(3, 7) && Math.random() < .02) {
    lastChirp = timeSec; if (state !== S.DYING) AU.chirp();
  }

  // --- shake / flash decay ---
  shake *= Math.pow(.86, dt * 60);
  flash *= Math.pow(.84, dt * 60);
  vignettePulse *= Math.pow(.95, dt * 60);
  slowmo = lerp(slowmo, 1, .05 * dt * 60);

  // --- blinking ---
  bird.blinkAt -= dt;
  if (bird.blinkAt <= 0 && bird.blink === 0) { bird.blink = .001; bird.blinkAt = rnd(2.2, 6); }
  if (sleepMode() && !bird.dead && (state === S.PLAY || state === S.PAUSED)) {
    bird.blink = clamp(Math.max(bird.blink, sleepy.drowsy * (sleepy.asleep ? 1 : .72)), 0, 1);
  } else if (bird.blink > 0 && !bird.dead) {
    bird.blink += dt * 9 * (bird.blink < .5 ? 1 : -1);
    if (bird.blink >= 1) bird.blink = .999;
    if (bird.blink <= 0) bird.blink = 0;
  }
  if (bird.dead) bird.blink = clamp(bird.blink + dt * 3, 0, .82);

  // --- wing animation ---
  bird.flapSpeed = lerp(bird.flapSpeed, idle ? .24 : .10, .06 * dt * 60);
  bird.flapPhase += (bird.dead ? .04 : bird.flapSpeed) * dt * 60 * 3.2;
  bird.beak = Math.max(0, bird.beak - dt * 3.4);
  bird.squash = lerp(bird.squash, 0, .12 * dt * 60);
  bird.tailWag += dt * 4;
  bird.breathe += dt * (state === S.READY ? 2.4 : 5.5);
  // legs tuck up while climbing, dangle while gliding down
  const wantTuck = bird.dead ? .1 : clamp(.25 + bird.flapSpeed * 1.4 - bird.vy * .05 * gdir(), 0, 1);
  bird.legTuck = lerp(bird.legTuck, wantTuck, .12 * dt * 60);
  // the head glances around when things are calm
  bird.headTurnAt -= dt;
  if (bird.headTurnAt <= 0) { bird.headTurnAt = rnd(2.5, 6); bird.headTurn = rnd(-.22, .12); }
  bird.headTurn = lerp(bird.headTurn, 0, .02 * dt * 60);
  bird.panic = lerp(bird.panic, ceilingWarn, .1 * dt * 60);
  // upside-down mode holds him over; dying rolls him over as well
  const wantFlip = ((mode === 'flip') !== bird.dead) ? 1 : 0;
  bird.flipAmt = lerp(bird.flipAmt, wantFlip, .16 * dt * 60);
  if (Math.sin(bird.flapPhase) > .95 && bird.flapSpeed > .3 && Math.random() < .12) AU.feather();

  const step = dt * 60 * slowmo;

  if (idle) {
    readyBob += dt * 2.2;
    bird.y = READY_Y + Math.sin(readyBob * 1.5) * 9;
    bird.rot = Math.sin(readyBob * 1.5) * .09;
    if (mode === 'race') {
      // the red bird warms up beside you, wings going
      animateRival(dt, dt * 60);
      rival.flapSpeed = lerp(rival.flapSpeed, .24, .06 * dt * 60);
      rival.x = bird.x - 54;
      rival.y = READY_Y + 34 + Math.sin(readyBob * 1.5 + 1.1) * 9;
      rival.rot = Math.sin(readyBob * 1.5 + 1.1) * .09;
      rival.vy = Math.cos(readyBob * 1.5 + 1.1) * 2;
    }
    groundOffset += 1.4 * step;
    scroll += 1.4 * step;
    AU.setWind(.15);
    AU.setMusic(.55, 0);
  }

  if (state === S.PLAY) runTime += dt;

  if (state === S.PLAY || state === S.DYING) {
    // gravity — pulls up instead of down while the bird is inverted
    const gd = gdir(), gA = grav(), vMax = maxFall();
    bird.vy = gd > 0 ? Math.min(bird.vy + gA * step, vMax)
                     : Math.max(bird.vy - gA * step, -vMax);
    bird.y += bird.vy * step;

    // rotation follows velocity with a little lag, like real inertia
    const targetRot = clamp(bird.vy * .085 * gd / (MD().flapMul || 1), -.52, TERMINAL_ROT);
    bird.rot = lerp(bird.rot, targetRot, (bird.vy * gd < 0 ? .22 : .10) * step);

    if (state === S.PLAY) {
      // difficulty ramp
      speed = Math.min(2.15 + score * .024, 3.95) * (MD().speedMul || 1) * (power.wind > 0 ? 2 : 1);
      gapSize = Math.max(206 - score * 1.1, 158) * (MD().gapMul || 1) + (MD().gapBonus || 0);

      scroll += speed * step;
      groundOffset += speed * step;

      spawnGap -= speed * step;
      pipeSpacing = (204 - Math.min(score * .7, 26)) * (MD().spacingMul || 1);
      if (spawnGap <= 0) { spawnPipe(); spawnGap = pipeSpacing; }

      for (const p of pipes) p.x -= speed * step;
      pipes = pipes.filter(p => p.x + p.w > -80);

      // pipes on the move: bounce inside the margins so the gap is
      // always somewhere you can actually fly through
      if (pipeMotion()) {
        for (const p of pipes) {
          if (!p.vsp) continue;
          const lo = 84 + p.gap / 2, hi = GROUND_Y - 84 - p.gap / 2;
          if (hi <= lo) continue;
          p.gapY += p.vsp * pipeDir * step;
          if (p.gapY < lo) { p.gapY = lo; p.vsp = Math.abs(p.vsp) * pipeDir; }
          if (p.gapY > hi) { p.gapY = hi; p.vsp = -Math.abs(p.vsp) * pipeDir; }
        }
      }
      if (MAP.boss) updateBoss(dt, step);

      // storm downdrafts: a hard shove up or down, telegraphed by the streaks
      if (MAP.gustPush) {
        gustT -= dt;
        gustFlash = Math.max(0, gustFlash - dt * 1.6);
        if (gustT <= 0) {
          gustT = rnd(3.2, 6.0);
          gustDir = Math.random() < .5 ? -1 : 1;
          bird.vy += gustDir * 4.6 * (MD().flapMul || 1);
          gustFlash = 1;
          shake = Math.max(shake, 7);
          AU.gust();
          floatText(W / 2, bird.y - 46, gustDir < 0 ? 'UPDRAFT' : 'DOWNDRAFT', '#cfe0f0', 16);
          for (let i = 0; i < 16; i++) {
            gusts.push({ x: rnd(0, W), y: bird.y + rnd(-70, 70), len: rnd(60, 190),
                         v: rnd(9, 16), life: 1 });
          }
        }
      }

      // ---- the sleep cycle ----
      if (sleepMode()) {
        sleepy.phase += dt;
        const cyc = SLEEP_AWAKE + SLEEP_OUT;
        const ph = sleepy.phase % cyc;
        const wasAsleep = sleepy.asleep;
        sleepy.asleep = ph >= SLEEP_AWAKE;
        // eyelids start sagging just before it goes under, as a warning
        sleepy.drowsy = sleepy.asleep ? 1
          : clamp((ph - (SLEEP_AWAKE - SLEEP_WARN)) / SLEEP_WARN, 0, 1);
        if (sleepy.asleep && !wasAsleep) {
          AU.yawn(); spawnZ(1);
          // one last reflexive wingbeat as it drops off, so a nap costs
          // height without simply dropping you out of the sky
          const boost = flapV() * .42 * gdir();
          bird.vy = gdir() > 0 ? Math.min(bird.vy, boost) : Math.max(bird.vy, boost);
          bird.squash = -.09;
          wingBlur = .55;
          AU.flap(.45, skinSfx());
          puff(bird.x - 9, bird.y + 7, 3, 1.2, [206, 232, 255]);
        }
        if (!sleepy.asleep && wasAsleep) { AU.wake(); bird.beak = 1; }
        sleepy.zTimer -= dt;
        if (sleepy.zTimer <= 0 && (sleepy.asleep || sleepy.drowsy > .55)) {
          sleepy.zTimer = sleepy.asleep ? .12 : .4;
          spawnZ(sleepy.asleep ? 1 : .6);
        }
      }

      // ---- power-up timers ----
      for (const k of ['magnet', 'wind', 'star']) {
        if (power[k] > 0) {
          power[k] -= dt;
          if (power[k] <= 0) { power[k] = 0; AU.powerEnd(); }
        }
      }
      starHue = (starHue + dt * 240) % 360;

      // ---- loose coins ----
      for (const c of worldCoins) {
        c.ph += dt * 5;
        c.x -= speed * step;
        if (power.magnet > 0) {          // dragged in from across the screen
          const dx = bird.x - c.x, dy = bird.y - c.y;
          const d = Math.hypot(dx, dy);
          if (d < 210) {
            const pull = (1 - d / 210) * 1.5;
            c.vx += (dx / (d || 1)) * pull * step;
            c.vy += (dy / (d || 1)) * pull * step;
          }
        }
        c.vx *= .97; c.vy *= .97;
        c.x += c.vx * step; c.y += c.vy * step;
      }
      worldCoins = worldCoins.filter(c => {
        if (Math.hypot(c.x - bird.x, c.y - bird.y) < c.r + bird.r) {
          coins++; runCoins++;
          AU.coin();
          puff(c.x, c.y, 4, 1.6, [255, 226, 130]);
          floatText(c.x, c.y - 16, '+1', '#ffd863', 14);
          return false;
        }
        return c.x > -40;
      });

      // ---- map hazards: volcano boulders, neon orbs ----
      if (MAP.hazard && !MAP.hazardInLane) {
        hazardTimer -= dt;
        if (hazardTimer <= 0) {
          const ev = MAP.hazardEvery || [3, 6];
          hazardTimer = rnd(ev[0], ev[1]);
          spawnHazard(MAP.hazard);
        }
      }
      for (const hz of hazards) {
        hz.ph += dt * 3;
        hz.rot += hz.rotV * step;
        if (hz.kind === 'boulder') {
          hz.vy += (hz.flat ? .012 : .10) * step;
          hz.x += (hz.vx - speed * .35) * step;
          hz.y += hz.vy * step;
          if (Math.random() < .5) {
            particles.push({ x: hz.x + rnd(-6, 6), y: hz.y + rnd(-6, 6),
              vx: rnd(-.4, .4), vy: rnd(-.5, .1), r: rnd(3, 8), life: 1,
              decay: .045, tint: [255, 150, 60], g: -.004 });
          }
        } else if (hz.kind === 'ball') {
          hz.vy += .22 * step;
          hz.x += (hz.vx - speed * .45) * step;
          hz.y += hz.vy * step;
          if (hz.y + hz.r >= GROUND_Y) {        // bounce off the ground
            hz.y = GROUND_Y - hz.r;
            hz.vy = -Math.max(Math.abs(hz.vy) * .88, 5.2);
            puff(hz.x, GROUND_Y, 4, 1.6, [255, 255, 255]);
            AU.bounce();
          }
          if (hz.y - hz.r <= CEILING + 4) {     // and off the top of the sky
            hz.y = CEILING + 4 + hz.r;
            hz.vy = Math.abs(hz.vy) * .9;
            AU.bounce();
          }
        } else if (hz.kind === 'drop') {
          hz.vy += .26 * step;
          hz.x -= speed * step;
          hz.y += hz.vy * step;
        } else {
          hz.x -= speed * step;        // exactly the world speed: it keeps its lane
          hz.y = hz.baseY + Math.sin(hz.ph * .5 + hz.seed) * hz.amp;
        }
      }
      hazards = hazards.filter(hz => {
        const hit = Math.hypot(hz.x - bird.x, hz.y - bird.y) < hz.r + bird.r * .82;
        if (hit) {
          if (power.star > 0) {          // starred: smash straight through it
            AU.hit();
            puff(hz.x, hz.y, 10, 3, hz.kind === 'boulder' ? [180, 150, 130] : [140, 240, 255]);
            shake = Math.max(shake, 6);
            return false;
          }
          playerCrash(hz.kind);
          return false;
        }
        if (hz.kind === 'boulder' && hz.y > GROUND_Y - 2) {
          puff(hz.x, GROUND_Y, 8, 2.4, [150, 126, 110]);
          shake = Math.max(shake, 4);
          return false;
        }
        if (hz.kind === 'drop' && hz.y - hz.r > GROUND_Y - 4) {
          puff(hz.x, GROUND_Y, 7, 2.2, [128, 96, 58]);
          shake = Math.max(shake, 3);
          AU.thud();
          return false;
        }
        return hz.x > -60 && hz.y < H + 80;
      });

      // ---- items ----
      for (const it of items) { it.x -= speed * step; it.ph += dt * 2.4; }
      items = items.filter(it => {
        if (Math.hypot(it.x - bird.x, it.y - bird.y) < it.r + bird.r) {
          const P = POWERS[it.kind];
          power[it.kind] = P.time;
          coins++; runCoins++;              // every item is worth a coin too
          AU.power(it.kind);
          flash = Math.max(flash, .30);
          puff(it.x, it.y, 14, 3, [255, 255, 255]);
          floatText(it.x, it.y - 22, '+1', '#ffd863', 15);
          floatText(W / 2, 172, P.name + '!', P.col, 22);
          if (it.kind === 'star') floatText(W / 2, 198, 'PIPES CANNOT TOUCH YOU', '#ffffff', 13);
          return false;
        }
        return it.x > -50;
      });

      // scoring
      for (const p of pipes) {
        if (!p.scored && p.x + p.w < bird.x - bird.r * .3) {
          p.scored = true; score++;
          AU.score(score);
          scorePop = 1;
          coins++; runCoins++;
          floatText(bird.x + 26, bird.y - 26, '+1', '#ffffff', 18);
          if (score % 10 === 0) {
            AU.fanfare();
            coins += 5; runCoins += 5;
            floatText(W / 2, 150, score + ' PIPES!  +5', '#7cf0b4', 22);
            flash = .18;
            save(true);
          }
          AU.setMusic(1, clamp(.12 + score * .028, 0, 1));
        }
      }

      if (mode === 'race') {
        updateRival(dt, step);
        if (score >= RACE_TARGET) finishRace(true);
        else if (rival.score >= RACE_TARGET) finishRace(false);
      }
      invuln = Math.max(0, invuln - dt);

      AU.setWind(clamp((speed - 2) / 3 + Math.abs(bird.vy) / 22, 0, 1));
      ceilingWarn = clamp(1 - (bird.y - bird.r - CEILING) / 80, 0, 1);

      // starred: pipes shred instead of stopping you
      if (power.star > 0) {
        for (const p of pipes) {
          if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w) {
            const topH = p.gapY - p.gap / 2, botY = p.gapY + p.gap / 2;
            if (bird.y - bird.r < topH || bird.y + bird.r > botY) {
              if (Math.random() < .6) puff(bird.x + 8, bird.y, 2, 2.4, [255, 240, 160]);
              shake = Math.max(shake, 3);
            }
          }
        }
      }

      // --- collisions ---
      if (bird.y - bird.r <= CEILING) { bird.y = CEILING + bird.r; playerCrash('ceiling'); }
      else if (bird.y + bird.r >= GROUND_Y) { bird.y = GROUND_Y - bird.r; playerCrash('ground'); }
      else if (invuln <= 0 && power.star <= 0) {
        for (const p of pipes) {
          if (bird.x + bird.r < p.x - 7 || bird.x - bird.r > p.x + p.w + 7) continue;
          const topH = p.gapY - p.gap / 2, botY = p.gapY + p.gap / 2;
          // circle vs the two rectangles (with the wider cap collar accounted for)
          const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w;
          const capX = bird.x + bird.r > p.x - 7 && bird.x - bird.r < p.x + p.w + 7;
          const nearCapTop = bird.y - bird.r < topH && bird.y + bird.r > topH - 28;
          const nearCapBot = bird.y + bird.r > botY && bird.y - bird.r < botY + 28;
          if ((inX && (bird.y - bird.r < topH || bird.y + bird.r > botY)) ||
              (capX && (nearCapTop || nearCapBot))) {
            playerCrash('pipe'); break;
          }
        }
      }
    }

    // --- falling out of the sky ---
    if (state === S.DYING) {
      const gd2 = gdir();
      bird.rot = Math.min(bird.rot + .07 * step, 1.62);
      groundOffset += speed * .3 * step;
      AU.setWind(.55);
      // it comes to rest wherever its gravity takes it
      const restY = gd2 > 0 ? GROUND_Y - bird.r : CEILING + bird.r;
      const landed = gd2 > 0 ? bird.y + bird.r >= GROUND_Y : bird.y - bird.r <= CEILING;
      if (landed) {
        bird.y = restY;
        if (!bird.landed) {
          bird.landed = true;
          AU.thud();
          spatter(bird.x + 4, restY + gd2 * -3, 6, -.8, -1.4 * gd2);
          if (gd2 > 0) addStain(bird.x, GROUND_Y - 1, 5);
          shake = 10; bird.squash = .35;
          puff(bird.x, restY, 14, 2.6, [186, 152, 96]);
          burstFeathers(bird.x, restY - gd2 * 8, 7, 0);
          setTimeout(() => { state = S.DEAD; save(); }, 420);
        }
        bird.vy = 0;
      }
    }
  }

  if (state !== S.PLAY) ceilingWarn = Math.max(0, ceilingWarn - dt * 2);

  if (state === S.DEAD) {
    gameOverT = Math.min(gameOverT + dt * 2.6, 1);
    AU.setWind(.1);
    AU.setMusic(.5, .05);
  }

  // --- particle integration ---
  for (const p of particles) {
    p.x += p.vx * step; p.y += p.vy * step;
    p.vy += p.g * step; p.vx *= .98; p.r += .22 * step;
    p.life -= p.decay * step;
  }
  particles = particles.filter(p => p.life > 0);

  for (const f of feathers) {
    f.sway += .12 * step;
    f.vy = Math.min(f.vy + .035 * step, 1.5);
    f.vx += Math.sin(f.sway) * .04 * step - speed * .012 * step;
    f.x += f.vx * step; f.y += f.vy * step;
    f.rot += f.rotV * step;
    f.rotV *= .99;
    if (f.y > GROUND_Y - 2) { f.y = GROUND_Y - 2; f.vy = 0; f.vx *= .9; f.decay = .02; }
    f.life -= f.decay * step;
  }
  feathers = feathers.filter(f => f.life > 0 && f.x > -40);

  for (const f of floaters) { f.y -= .55 * step; f.life -= .012 * step; }
  floaters = floaters.filter(f => f.life > 0);

  for (const z of zs) {
    z.sway += .06 * step;
    z.x += (z.vx + Math.sin(z.sway) * .25) * step;
    z.y += z.vy * step;
    z.rot += z.rotV * step;
    z.size += .06 * step;
    z.life -= .011 * step;
  }
  zs = zs.filter(z => z.life > 0);

  updateWorldFX(dt, step);
}

/* -----------------------------------------------------------------------
   AMBIENT LIFE — gusting wind, leaves, motes, butterflies, rain, blood
   ----------------------------------------------------------------------- */
function updateWorldFX(dt, step) {
  // gusts: a slow noise walk that everything light reacts to
  gust = fbm(timeSec * .22, 3);
  wind = .35 + gust * 1.15 + speed * .12;
  if (mode === 'tornado') { gust = Math.min(1, gust * .6 + .55); wind += 2.4; }

  // weather picks itself, favouring rain at dusk and night
  weather.next -= dt;
  if (weather.next <= 0) {
    weather.next = rnd(16, 40);
    const bias = MAP.precipBias;
    if (MAP.precip === 'none' || bias <= 0) weather.target = 0;
    else {
      const chance = clamp((sky('star') > .3 ? .55 : .18) * bias, 0, .95);
      weather.target = Math.random() < chance ? clamp(rnd(.45, 1) * Math.min(bias, 1.3), 0, 1) : 0;
    }
  }
  weather.rain += (weather.target - weather.rain) * Math.min(1, dt * .5);

  // --- leaves ---
  const leafCap = Math.round(9 * MAP.air.leaves * (MAP.leafStorm || 1));
  if (leaves.length < leafCap && Math.random() < .012) leaves.push(makeLeaf());
  for (const l of leaves) {
    l.sway += l.swaySp * step;
    l.x += (l.vx - wind * .55 * l.depth - speed * .22 * l.depth) * step;
    l.y += (l.vy + Math.sin(l.sway) * .28) * step;
    l.rot += (l.rotV + Math.sin(l.sway) * .02) * step;
    if (l.y > GROUND_Y - 4) { l.y = GROUND_Y - 4; l.vy = 0; l.vx -= .04 * step; }
  }
  leaves = leaves.filter(l => l.x > -30);

  // --- pollen / dust motes ---
  for (const m of motes) {
    m.ph += m.sp * dt;
    m.x -= (speed * .35 * m.d + wind * .3 * m.d) * step;
    if (m.x < -6) { m.x = W + rnd(0, 30); m.y = rnd(0, GROUND_Y); }
  }

  // --- butterflies ---
  for (const b of butterflies) {
    b.t += dt;
    b.x -= (speed * .5 + b.drift) * step;
    b.y += Math.sin(b.t * b.sp * 2.2) * .5 * step;
    b.ph += dt * 15;
    if (b.x < -20) Object.assign(b, makeButterfly(), { x: W + rnd(10, 90) });
  }

  // --- precipitation: rain, snow, ash or blowing sand ---
  const kind = MAP.precip;
  const SPEC = {
    rain: { n: 90, v: [13, 21], len: [9, 20], a: [.2, .55], drift: 1.5, sway: 0, splash: 1 },
    snow: { n: 110, v: [1.1, 2.9], len: [2, 4.2], a: [.45, .95], drift: .6, sway: 1.5, splash: 0 },
    ash:  { n: 95, v: [.8, 2.4], len: [1.6, 3.4], a: [.3, .75], drift: .9, sway: 1.1, splash: 0 },
    sand: { n: 120, v: [1.5, 4.5], len: [10, 26], a: [.15, .40], drift: 7, sway: .5, splash: 0 }
  }[kind] || null;

  if (SPEC && weather.rain > .05) {
    const want = Math.floor(weather.rain * SPEC.n);
    while (drops.length < want) {
      drops.push({
        x: rnd(-60, W + 60), y: rnd(-H, 0),
        v: rnd(SPEC.v[0], SPEC.v[1]), len: rnd(SPEC.len[0], SPEC.len[1]),
        a: rnd(SPEC.a[0], SPEC.a[1]), ph: Math.random() * 6.28, sp: rnd(.6, 1.8)
      });
    }
    for (const d of drops) {
      d.ph += d.sp * dt;
      d.y += d.v * step;
      d.x -= (wind * SPEC.drift + (SPEC.sway ? Math.sin(d.ph) * SPEC.sway : 0)) * step;
      if (d.x < -70) d.x = W + rnd(0, 60);
      if (d.y > GROUND_Y + rnd(0, 18)) {
        if (SPEC.splash) splashes.push({ x: d.x, y: GROUND_Y + rnd(2, 14), r: 1, life: 1 });
        d.y = rnd(-120, -10); d.x = rnd(-60, W + 60);
      }
    }
    if (drops.length > want + 30) drops.length = want;
  } else if (drops.length) {
    for (const d of drops) { d.y += d.v * step; d.x -= wind * 1.5 * step; }
    drops = drops.filter(d => d.y < GROUND_Y);
  }
  for (const sp of splashes) { sp.r += .55 * step; sp.life -= .06 * step; }
  splashes = splashes.filter(sp => sp.life > 0);

  // --- lightning during heavy rain ---
  if (weather.rain > .55) {
    bolt.next -= dt;
    if (bolt.next <= 0) {
      bolt.next = rnd(5, 16);
      const dist = Math.random();
      const pts = [];
      let bx = rnd(40, W - 40), by = 0;
      const endY = GROUND_Y - rnd(40, 160);
      while (by < endY) { pts.push([bx, by]); by += rnd(18, 42); bx += rnd(-26, 26); }
      bolt.pts = pts;
      bolt.life = 1;
      flash = Math.max(flash, .5 - dist * .28);
      setTimeout(() => AU.thunder(dist), 300 + dist * 2200);
    }
  }
  bolt.life = Math.max(0, bolt.life - dt * 5.5);

  // --- visible gust streaks when the wind really picks up ---
  if (gust > .62 && Math.random() < (mode === 'tornado' ? .55 : .10)) {
    gusts.push({ x: W + 40, y: rnd(30, GROUND_Y - 40), len: rnd(50, 160), v: rnd(7, 13), life: 1 });
  }
  for (const g of gusts) { g.x -= g.v * step; g.life -= .018 * step; }
  gusts = gusts.filter(g => g.life > 0 && g.x > -200);

  // --- impact rings ---
  for (const r of ripples) { r.r += 2.4 * step; r.life -= .035 * step; }
  ripples = ripples.filter(r => r.life > 0);

  // --- blood droplets settle into stains ---
  for (const b of blood) {
    if (b.stuck) { b.life -= b.decay * .35 * step; continue; }
    b.vy += .22 * step;
    b.vx -= speed * .04 * step;
    b.x += b.vx * step; b.y += b.vy * step;
    if (b.y >= GROUND_Y - 1) { b.y = GROUND_Y - 1; b.stuck = true; addStain(b.x, b.y, b.r * 1.6); }
    b.life -= b.decay * step;
  }
  blood = blood.filter(b => b.life > 0);
  for (const st of stains) { st.x -= speed * .25 * step; st.life -= .0016 * step; }
  stains = stains.filter(st => st.life > 0 && st.x > -30);

  // --- bird motion trail ---
  if ((state === S.PLAY || state === S.DYING) && Math.abs(bird.vy) > 4) {
    trail.push({ x: bird.x, y: bird.y, rot: bird.rot, life: 1 });
  }
  for (const t of trail) t.life -= .09 * step;
  trail = trail.filter(t => t.life > 0);
  if (trail.length > 14) trail.splice(0, trail.length - 14);

  // score pop decay
  scorePop = Math.max(0, scorePop - dt * 3.4);
  shopDenyT = Math.max(0, shopDenyT - dt);
  wingBlur = Math.max(0, wingBlur - dt * 2.6);
}

/* =======================================================================
   RACE MODE — the rival flies the same gauntlet with imperfect timing,
   and whoever crashes restarts at the front, giving up the pipes they
   were about to clear.
   ======================================================================= */
function resetRival() {
  rival.y = H * .45; rival.vy = 0; rival.rot = 0;
  rival.score = 0; rival.stun = 0; rival.err = 0; rival.nextErr = rnd(3, 8);
  rival.flapPhase = 0; rival.flapSpeed = 0;
  rival.off = -46; rival.penalty = 0; rival.virtual = 0; rival.flipAmt = 0;
  rival.x = bird.x - 46;
}

function rivalCrash() {
  rival.stun = 1.1;
  rival.score = 0;            // the streak is what matters — back to zero
  rival.penalty = -170;
  AU.squawk();
  burstFeathers(rival.x, rival.y, 9, -1);
  spatter(rival.x, rival.y, 4, -.8, -.4);
  puff(rival.x, rival.y, 6, 2.2, [230, 150, 140]);
  floatText(rival.x, rival.y - 30, 'RED LOST IT', '#ff9a8a', 14);
}

// cosmetic animation, shared with the player's renderer
function animateRival(dt, step) {
  rival.flapPhase += rival.flapSpeed * step * 3.2;
  rival.flapSpeed = lerp(rival.flapSpeed, state === S.READY ? .24 : .10, .06 * step);
  rival.beak = Math.max(0, rival.beak - dt * 3.4);
  rival.squash = lerp(rival.squash, 0, .12 * step);
  rival.tailWag += dt * 4;
  rival.breathe += dt * 5.5;
  rival.legTuck = lerp(rival.legTuck, rival.stun > 0 ? .1 : clamp(.25 + rival.flapSpeed * 1.4 - rival.vy * .05, 0, 1), .12 * step);
  rival.blinkAt -= dt;
  if (rival.blinkAt <= 0 && rival.blink === 0) { rival.blink = .001; rival.blinkAt = rnd(2.2, 6); }
  if (rival.blink > 0) {
    rival.blink += dt * 9 * (rival.blink < .5 ? 1 : -1);
    if (rival.blink >= 1) rival.blink = .999;
    if (rival.blink <= 0) rival.blink = 0;
  }
  rival.headTurn = lerp(rival.headTurn, 0, .02 * step);
  rival.flipAmt = lerp(rival.flipAmt, rival.stun > 0 ? 1 : 0, .16 * step);
}

function updateRival(dt, step) {
  animateRival(dt, step);

  // --- where it sits on screen: purely a function of the streak gap,
  //     so a lost streak physically drops it behind you ---
  const lead = rival.score - score;
  rival.penalty = lerp(rival.penalty, 0, .010 * step);
  // it trades places with you even at a level streak, and pulls clear
  // whenever the gap opens up
  let targetOff = clamp(lead, -9, 9) * 30 + Math.sin(timeSec * .38) * 40 + rival.penalty;
  if (Math.abs(targetOff) < 30) targetOff = targetOff < 0 ? -30 : 30;
  const prevX = rival.x;
  rival.off = lerp(rival.off, targetOff, .030 * step);
  rival.x = bird.x + rival.off;
  // px moved per frame — while it is surging it flies through the course
  rival.transit = Math.abs(rival.x - prevX) / Math.max(step, .001) > .5;

  const onScreen = rival.x > -30 && rival.x < W + 30;

  if (rival.stun > 0) {
    // knocked out: tumble belly-up until it shakes it off
    rival.stun -= dt;
    rival.vy = Math.min(rival.vy + grav() * step, maxFall());
    rival.y = Math.min(rival.y + rival.vy * step, GROUND_Y - rival.r);
    rival.rot = Math.min(rival.rot + .08 * step, 1.6);
    if (rival.stun <= 0) {
      rival.y = H * .45; rival.vy = 0; rival.rot = 0;
      puff(rival.x, rival.y, 8, 2, [255, 200, 190]);
    }
    return;
  }

  if (!onScreen) {
    // out of sight, flying on instruments: it clears pipes at the course
    // spacing, with the occasional lapse of its own
    rival.virtual += speed * step;
    if (rival.virtual >= pipeSpacing) {
      rival.virtual -= pipeSpacing;
      if (Math.random() < .05) { rivalCrash(); return; }
      rival.score++;
      rival.flapSpeed = .5; rival.flapPhase = -Math.PI / 2;
    }
    rival.y = lerp(rival.y, H * .45 + Math.sin(timeSec * 1.6) * 60, .02 * step);
    rival.vy = lerp(rival.vy, 0, .05 * step);
    rival.rot = lerp(rival.rot, 0, .05 * step);
    return;
  }

  // --- on screen: fly the real gauntlet ---
  rival.nextErr -= dt;
  if (rival.nextErr <= 0) { rival.nextErr = rnd(3.5, 9); rival.err = rnd(-46, 46); }
  rival.err = lerp(rival.err, 0, .6 * dt);

  const next = pipes.filter(p => p.x + p.w > rival.x - 6).sort((a, b) => a.x - b.x)[0];
  const target = (next ? next.gapY : H * .45) + rival.err - 10;
  if (rival.y > target && rival.vy > -2.4 * (MD().flapMul || 1)) {
    rival.vy = flapV();
    rival.flapPhase = -Math.PI / 2;
    rival.flapSpeed = .55;
    rival.beak = .8;
  }

  rival.vy = Math.min(rival.vy + grav() * step, maxFall());
  rival.y += rival.vy * step;
  rival.rot = lerp(rival.rot, clamp(rival.vy * .085 / (MD().flapMul || 1), -.52, TERMINAL_ROT), .14 * step);

  for (const p of pipes) {
    if (!p.rScored && p.x + p.w < rival.x) { p.rScored = true; rival.score++; }
  }
  if (rival.y - rival.r <= CEILING) { rival.y = CEILING + rival.r; rivalCrash(); return; }
  if (rival.y + rival.r >= GROUND_Y) { rival.y = GROUND_Y - rival.r; rivalCrash(); return; }
  if (rival.transit) return;   // mid-surge: it is between lanes, not clipping pipes
  for (const p of pipes) {
    if (rival.x + rival.r < p.x - 7 || rival.x - rival.r > p.x + p.w + 7) continue;
    const topH = p.gapY - p.gap / 2, botY = p.gapY + p.gap / 2;
    const inX = rival.x + rival.r > p.x && rival.x - rival.r < p.x + p.w;
    const capX = rival.x + rival.r > p.x - 7 && rival.x - rival.r < p.x + p.w + 7;
    const capTop = rival.y - rival.r < topH && rival.y + rival.r > topH - 28;
    const capBot = rival.y + rival.r > botY && rival.y - rival.r < botY + 28;
    if ((inX && (rival.y - rival.r < topH || rival.y + rival.r > botY)) || (capX && (capTop || capBot))) {
      rivalCrash(); return;
    }
  }
}

// in race mode a crash costs ground, not the run
function respawnPlayer() {
  bird.y = H * .42; bird.vy = 0; bird.rot = 0; bird.rotV = 0;
  bird.squash = .2;
  invuln = 1.7;
  // sweep away anything that would kill you the instant you reappear
  pipes = pipes.filter(p => p.x > bird.x + 120 || p.x + p.w < bird.x - 70);
  puff(bird.x, bird.y, 10, 2.4, [255, 255, 255]);
}

function playerCrash(cause) {
  if (mode !== 'race') { die(cause); return; }
  if (invuln > 0) return;
  deathCause = cause;
  AU.hit(); AU.call(skinSfx().call, 1.05);
  shake = 14; flash = .40; vignettePulse = .8; slowmo = .6;
  burstFeathers(bird.x, bird.y, 12, -1.5);
  spatter(bird.x, bird.y, 6, -1, -.4);
  floatText(W / 2, 210, 'STREAK LOST — START AGAIN', '#ff9a8a', 16);
  score = 0;
  stats.deaths[cause] = (stats.deaths[cause] || 0) + 1;
  respawnPlayer();
  save(true);
}

function finishRace(won) {
  state = S.DEAD;
  raceResult = won ? 'win' : 'lose';
  gameOverT = 0;
  flash = .45;
  if (won) { AU.fanfare(); floatText(W / 2, 160, 'YOU WIN!', '#ffd04a', 26); }
  else { AU.duckMusic(); AU.squawk(); }
  stats.pipes += score;
  stats.time += runTime;
  if (runTime > stats.bestTime) stats.bestTime = runTime;
  if (score > best) { best = score; newBest = true; }
  awardMapBonus();
  awardModeBonus();
  if (won) { stats.raceWins++; coins += 15; runCoins += 15; }
  save();
}

/* =======================================================================
   RENDER
   ======================================================================= */
function render() {
  ctx.save();
  if (shake > .3) {
    ctx.translate(rnd(-shake, shake) * .5, rnd(-shake, shake) * .5);
    ctx.rotate(rnd(-shake, shake) * .0008);
  }
  drawSky();
  drawStars();
  drawSun();
  drawGodRays();
  drawClouds();
  drawFarLayer();
  drawMidLayer();
  drawFarBirds();
  drawNearLayer();
  drawCloudShadows();
  drawPrecip(false);
  drawPipes();
  drawGround();
  drawStains();
  drawMotes();
  drawButterflies();
  drawParticles();
  drawPickups();
  drawHazards();
  drawBoss();
  drawLeaves();
  drawTrail();
  if (mode === 'race') drawRival();
  drawBird();
  drawBlood();
  drawRipples();
  drawZs();
  drawPrecip(true);
  drawGusts();
  drawBolt();
  drawCeilingHaze();
  drawFloaters();
  ctx.restore();
  drawGrade();
  drawUI();
}

/* =======================================================================
   PERSISTENCE — auto-saves every 30 seconds and on every death
   ======================================================================= */
const KEY = 'flappybird.realistic.v1';
const savedEl = document.getElementById('saved');
let savedTimer = null;

function save(silent) {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      v: 2, best: best, runs: runs, totalFlaps: totalFlaps,
      pipes: stats.pipes, time: Math.round(stats.time),
      bestTime: Math.round(stats.bestTime * 10) / 10, deaths: stats.deaths,
      raceWins: stats.raceWins, mode: mode, map: mapId,
      coins: coins, skin: skinId, owned: owned,
      music: AU.musicOn, sfx: AU.sfxOn, at: Date.now()
    }));
  } catch (e) { return; }
  if (silent) return;
  savedEl.classList.add('show');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => savedEl.classList.remove('show'), 1100);
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    best = d.best || 0; runs = d.runs || 0; totalFlaps = d.totalFlaps || 0;
    stats.pipes = d.pipes || 0; stats.time = d.time || 0; stats.bestTime = d.bestTime || 0;
    if (d.deaths) Object.assign(stats.deaths, d.deaths);
    stats.raceWins = d.raceWins || 0;
    if (d.mode && MODES.some(m => m.id === d.mode)) mode = d.mode;
    if (d.map && MAPS.some(m => m.id === d.map)) setMapById(d.map);
    coins = d.coins || 0;
    if (Array.isArray(d.owned)) owned = Array.from(new Set(['native', 'classic'].concat(d.owned)));
    if (d.skin && owned.indexOf(d.skin) >= 0 && SKINS.some(k => k.id === d.skin)) skinId = d.skin;
    if (typeof d.music === 'boolean') AU.musicOn = d.music;
    if (typeof d.sfx === 'boolean') AU.sfxOn = d.sfx;
  } catch (e) {}
}
load();
reset();          // apply the restored mode (bird size, etc.)
setInterval(() => save(), 30000);
window.addEventListener('beforeunload', () => save(true));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(true); if (state === S.PLAY) state = S.PAUSED; }
});

/* =======================================================================
   INPUT
   ======================================================================= */
function evtPos(e) {
  const r = cvs.getBoundingClientRect();
  const pt = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  return { x: (pt.clientX - r.left) / SCALE, y: (pt.clientY - r.top) / SCALE };
}

/* =======================================================================
   SHOP + PAUSE CONTROLS
   ======================================================================= */
let shopDeny = -1, shopDenyT = 0;

function openShop() {
  if (state !== S.READY) return;
  // open on whichever page holds the skin you are wearing
  const i = SKINS.findIndex(k => k.id === skinId);
  shopPage = i < 0 ? 0 : Math.floor(i / SHOP_PER_PAGE);
  state = S.SHOP; AU.init(); AU.resume(); AU.ui();
}
function closeShop() {
  if (state !== S.SHOP) return;
  state = S.READY; AU.ui(); save(true);
}
function pickSkin(i) {
  const k = SKINS[i];
  if (!k) return;
  if (owned.indexOf(k.id) >= 0) {          // already yours: wear it, and hear it
    if (skinId !== k.id) { skinId = k.id; save(true); }
    AU.call(skinSfx(k).call, .9);
    return;
  }
  if (coins >= k.price) {                  // buy and wear
    coins -= k.price;
    owned.push(k.id);
    skinId = k.id;
    AU.fanfare();
    setTimeout(() => AU.call(skinSfx(k).call, 1), 420);
    floatText(W / 2, 108, k.name + ' UNLOCKED', '#ffd04a', 20);
    save();
  } else {                                 // can't afford it yet
    shopDeny = i; shopDenyT = .45;
    AU.bonk();
  }
}

function togglePause() {
  if (state === S.PLAY) { state = S.PAUSED; AU.ui(); }
  else if (state === S.PAUSED) { state = S.PLAY; AU.ui(); }
}

// buttons on the pause overlay
function pauseLayout() {
  return {
    resume: { x: (W - 176) / 2, y: H / 2 + 26, w: 176, h: 42 },
    menu: { x: (W - 124) / 2, y: H / 2 + 80, w: 124, h: 38 }
  };
}

function setMap(id) {
  if (mapId === id) return;
  const keepScroll = menuScroll;
  setMapById(id);
  AU.ui();
  // the new world starts at midday with clear weather
  dayPos = dayTarget = MAP.dayStart == null ? 1 : MAP.dayStart;
  weather.rain = 0; weather.target = 0; weather.next = rnd(12, 26);
  drops.length = 0; splashes.length = 0; leaves.length = 0;
  reset();
  menuScroll = keepScroll;
  save(true);
}

function setMode(id) {
  if (mode === id) return;
  const keepScroll = menuScroll;
  mode = id;
  AU.ui();
  reset();
  menuScroll = keepScroll;
  save(true);
}

function primary(e) {
  if (e) e.preventDefault();
  AU.init(); AU.resume();

  // shop takes every tap while it is open
  if (state === S.SHOP) {
    if (!e) return;
    const p = evtPos(e);
    if (inRect(p, shopCloseRect())) { closeShop(); return; }
    if (shopPages() > 1) {
      if (inRect(p, shopPrevRect())) { shopFlip(-1); return; }
      if (inRect(p, shopNextRect())) { shopFlip(1); return; }
    }
    for (let cell = 0; cell < SHOP_PER_PAGE; cell++) {
      const i = shopSkinIndex(cell);
      if (i >= SKINS.length) break;
      if (inRect(p, shopCellRect(cell))) { pickSkin(i); return; }
    }
    return;
  }

  // paused: RESUME / MENU are buttons, anywhere else resumes
  if (state === S.PAUSED && e) {
    const p = evtPos(e), L = pauseLayout();
    if (inRect(p, L.menu)) { state = S.READY; reset(); AU.ui(); return; }
    if (inRect(p, L.resume)) { togglePause(); return; }
  }

  // game over: PLAY AGAIN / MENU are real buttons
  if (state === S.DEAD && e) {
    const p = evtPos(e), L = goLayout();
    if (inRect(p, L.menu)) { toMenu(); return; }
    if (inRect(p, L.again)) { replay(); return; }
  }
  // on the ready screen the mode cards take the tap instead of flapping
  if (state === S.READY && e) {
    const p = evtPos(e);
    if (inRect(p, shopBtnRect())) { openShop(); return; }
    if (inMenuView(p)) {
      for (let i = 0; i < MAPS.length; i++) {
        if (inRect(p, mapCardRect(i))) { setMap(MAPS[i].id); return; }
      }
      for (let i = 0; i < MODES.length; i++) {
        if (inRect(p, modeCardRect(i))) { setMode(MODES[i].id); return; }
      }
      return;    // a tap inside the list is never a flap
    }
  }
  flap();
}
/* On the menu a press might be a scroll, so the action waits for release
   and only fires if the pointer barely moved. In play it stays instant. */
let ptrHeld = false;
let drag = null;

function pointerDown(e) {
  if (state === S.READY) {
    const pt = (e.touches && e.touches[0]) || e;
    drag = { x: pt.clientX, y: pt.clientY, s0: menuScroll, moved: 0 };
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (ptrHeld) return;
  ptrHeld = true;
  primary(e);
}
function pointerMove(e) {
  if (!drag) return;
  const pt = (e.touches && e.touches[0]) || e;
  const dy = pt.clientY - drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(dy) + Math.abs(pt.clientX - drag.x));
  menuScroll = clamp(drag.s0 - dy / SCALE, 0, menuScrollMax());
  if (e.cancelable) e.preventDefault();
}
function pointerUp() {
  ptrHeld = false;
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved < 6) {       // a tap, not a drag
    primary({ clientX: d.x, clientY: d.y, preventDefault: function () {} });
  }
}

cvs.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
cvs.addEventListener('touchstart', pointerDown, { passive: false });
window.addEventListener('touchmove', pointerMove, { passive: false });
window.addEventListener('touchend', pointerUp);
window.addEventListener('touchcancel', () => { ptrHeld = false; drag = null; });

cvs.addEventListener('wheel', e => {
  if (state !== S.READY) return;
  menuScroll = clamp(menuScroll + e.deltaY * .6, 0, menuScrollMax());
  e.preventDefault();
}, { passive: false });
let keyHeld = false;
document.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') keyHeld = false;
});
document.addEventListener('keydown', e => {
  // on the menu the arrows scroll the list instead of flapping
  if (state === S.READY &&
      (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'PageUp' || e.code === 'PageDown')) {
    e.preventDefault();
    const up = e.code === 'ArrowUp' || e.code === 'PageUp';
    const amt = e.code.indexOf('Page') === 0 ? MENU_VIEW.h * .8 : 48;
    menuScroll = clamp(menuScroll + (up ? -amt : amt), 0, menuScrollMax());
    return;
  }
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (e.repeat || keyHeld) return;   // one flap per press — no holding it down
    keyHeld = true;
    if (state === S.SHOP) { closeShop(); return; }
    primary(e);
    return;
  }
  if (state === S.SHOP && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
    e.preventDefault();
    shopFlip(e.code === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.code === 'KeyB') {
    AU.init();
    if (state === S.SHOP) closeShop(); else openShop();
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    AU.init();
    if (state === S.SHOP) closeShop();
    else if (state === S.PLAY || state === S.PAUSED) togglePause();
    else if (state === S.DEAD) toMenu();      // back to the map / mode picker
    return;
  }
  if (/^Digit[1-9]$/.test(e.code)) {          // 1-6 pick the mode
    if (state === S.SHOP) return;
    if (state !== S.READY && state !== S.DEAD) return;
    const n = +e.code.slice(5);
    AU.init();
    if (MODES[n - 1]) { reset(); setMode(MODES[n - 1].id); }
    return;
  }
  {                                            // the QWERT / ASDFG rows pick the map
    const mi = MAP_KEYS.map(k => 'Key' + k).indexOf(e.code);
    if (mi >= 0) {
      if (state === S.SHOP) return;
      if (state !== S.READY && state !== S.DEAD) return;
      AU.init();
      if (MAPS[mi]) { reset(); setMap(MAPS[mi].id); }
      return;
    }
  }
  if (e.code === 'KeyM') { toggleMusic(); return; }
  if (e.code === 'KeyX') { toggleSfx(); return; }
});

const mBtn = document.getElementById('mBtn'), sBtn = document.getElementById('sBtn');
const pBtn = document.getElementById('pBtn');
pBtn.addEventListener('click', e => { e.stopPropagation(); AU.init(); AU.resume(); togglePause(); });
let pBtnState = null;
function syncPauseBtn() {
  const k = state === S.PAUSED ? 'paused' : state === S.PLAY ? 'play' : 'idle';
  if (k === pBtnState) return;
  pBtnState = k;
  pBtn.innerHTML = k === 'paused' ? '&#9654;' : '&#10073;&#10073;';
  pBtn.classList.toggle('off', k === 'idle');
  pBtn.title = k === 'paused' ? 'Resume (P)' : 'Pause (P)';
}
function syncButtons() {
  mBtn.classList.toggle('off', !AU.musicOn);
  sBtn.classList.toggle('off', !AU.sfxOn);
}
function toggleMusic() {
  AU.init(); AU.resume();
  AU.musicOn = !AU.musicOn;
  AU._mLevel = -1;
  AU.setMusic(state === S.PLAY ? 1 : .55, AU.music.intensity);
  syncButtons(); save(true);
}
function toggleSfx() {
  AU.init(); AU.resume();
  AU.sfxOn = !AU.sfxOn;
  if (AU.sfxOn) AU.ui();
  syncButtons(); save(true);
}
mBtn.addEventListener('click', e => { e.stopPropagation(); toggleMusic(); });
sBtn.addEventListener('click', e => { e.stopPropagation(); toggleSfx(); });
syncButtons();

/* =======================================================================
   MAIN LOOP — fixed-ish timestep, clamped so tab switches don't teleport
   ======================================================================= */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .1) dt = .1;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 8) { update(STEP); acc -= STEP; }
  render();
  syncPauseBtn();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
