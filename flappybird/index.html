<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Bird — Realistic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070d;
  font-family:'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;user-select:none;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{display:block;border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.07);
  cursor:pointer;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;border:none;outline:none;cursor:pointer}

/* ---- audio toggles ---- */
#toggles{position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px}
.tg{width:42px;height:42px;border-radius:12px;background:rgba(12,16,24,.62);backdrop-filter:blur(9px);
  border:1px solid rgba(255,255,255,.16);color:#e8eef6;font-size:17px;display:flex;align-items:center;
  justify-content:center;transition:.15s}
.tg:hover{background:rgba(30,40,55,.8)}
.tg.off{color:#6b7482;opacity:.55}

/* ---- saved flash ---- */
#saved{position:fixed;top:16px;left:16px;z-index:60;padding:7px 14px;border-radius:9px;
  background:rgba(30,200,120,.16);border:1px solid rgba(60,230,150,.45);color:#7cf0b4;
  font-size:11px;letter-spacing:2.4px;font-weight:700;opacity:0;transition:opacity .35s}
#saved.show{opacity:1}

/* ---- rotate hint ---- */
#hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:1.6px;
  color:rgba(255,255,255,.3);z-index:50;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div id="toggles">
  <button class="tg" id="pBtn" title="Pause (P)">&#10073;&#10073;</button>
  <button class="tg" id="mBtn" title="Music (M)">&#9835;</button>
  <button class="tg" id="sBtn" title="Sound effects (X)">&#128266;</button>
</div>
<div id="saved">SAVED</div>
<div id="hint">SPACE / CLICK / TAP to flap &nbsp;·&nbsp; P pause &nbsp;·&nbsp; B shop &nbsp;·&nbsp; M music &nbsp;·&nbsp; X sfx</div>

<script>
"use strict";
/* =======================================================================
   AUDIO ENGINE — everything synthesized live with the Web Audio API.
   No files to load: wing flaps, chirps, wind, impacts and a full
   adaptive soundtrack are all built from oscillators + shaped noise.
   ======================================================================= */
const AU = {
  ctx: null, master: null, sfxBus: null, musicBus: null, windBus: null,
  conv: null, noiseBuf: null, ready: false,
  musicOn: true, sfxOn: true,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = new AC();
    this.ctx = c;

    this.master = c.createGain();
    this.master.gain.value = 0.9;
    // gentle limiter so stacked layers never clip
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 22;
    comp.ratio.value = 6; comp.attack.value = .004; comp.release.value = .22;
    this.master.connect(comp); comp.connect(c.destination);

    this.sfxBus = c.createGain();   this.sfxBus.gain.value = 0.85;
    this.musicBus = c.createGain(); this.musicBus.gain.value = 0.0;
    this.windBus = c.createGain();  this.windBus.gain.value = 0.0;
    this.sfxBus.connect(this.master);
    this.musicBus.connect(this.master);
    this.windBus.connect(this.master);

    // --- noise source buffer (2s of white noise, reused everywhere) ---
    const n = c.sampleRate * 2;
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    // --- tiny synthetic reverb (open-air tail) ---
    const rl = Math.floor(c.sampleRate * 1.9);
    const imp = c.createBuffer(2, rl, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const b = imp.getChannelData(ch);
      for (let i = 0; i < rl; i++) {
        const t = i / rl;
        b[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (1 - t * 0.3);
      }
    }
    this.conv = c.createConvolver(); this.conv.buffer = imp;
    const rvG = c.createGain(); rvG.gain.value = 0.26;
    this.conv.connect(rvG); rvG.connect(this.master);

    this.startWind();
    this.startMusic();
    this.ready = true;
  },

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  t() { return this.ctx.currentTime; },

  noise(dur, gain, type, f0, f1, q, attack, dly) {
    const c = this.ctx, t = this.t() + (dly || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const flt = c.createBiquadFilter(); flt.type = type || 'bandpass';
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    flt.Q.value = q == null ? 1 : q;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + Math.min(attack == null ? .012 : attack, dur * .5));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(this.sfxBus);
    g.connect(this.conv);
    s.start(t); s.stop(t + dur + .05);
    return g;
  },

  tone(type, f0, f1, dur, gain, dly, detune) {
    const c = this.ctx, t = this.t() + (dly || 0);
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (detune) o.detune.value = detune;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus); g.connect(this.conv);
    o.start(t); o.stop(t + dur + .05);
    return o;
  },

  /* ---------------- individual sound effects ---------------- */

  // feathers pushing air — a soft swoosh, not a slap. Kept quiet and
  // slightly different every time so a fast run never sounds mechanical.
  flap(power, v) {
    if (!this.ready || !this.sfxOn) return;
    v = v || {};
    const air = v.air || 900, thump = v.thump || 124;
    const p = (power == null ? 1 : power) * (.9 + Math.random() * .2) * (v.gain || 1);
    const f0 = air + Math.random() * air * .35;
    this.noise(.26, .105 * p, 'bandpass', f0, air * .23, .75, .038);            // the body of air
    this.noise(.16, .030 * p, 'highpass', air * 2.5 + Math.random() * 500, air * .95, .5, .030);
    this.tone('sine', thump, thump * .5, .11, .034 * p);                        // faint chest thump
  },

  /* ---- one voice per skin ------------------------------------------
     Every skin has a call of its own: it plays when you pick the skin
     in the shop, now and then mid-flight, and once when you go down.
     ------------------------------------------------------------------ */
  call(kind, gain) {
    if (!this.ready || !this.sfxOn) return;
    const g = gain == null ? 1 : gain;
    const T = (type, f0, f1, dur, amp, dly, det) => this.tone(type, f0, f1, dur, amp * g, dly, det);
    const N = (dur, amp, type, f0, f1, q, att, dly) => this.noise(dur, amp * g, type, f0, f1, q, att, dly);

    switch (kind) {
      case 'cluck':                       // chicken: two clucks and a bawk
        N(.045, .10, 'bandpass', 950, 520, 3.2, .003, 0);
        T('triangle', 640, 430, .07, .10, 0);
        N(.045, .09, 'bandpass', 880, 480, 3.2, .003, .11);
        T('triangle', 570, 340, .08, .09, .11);
        T('sawtooth', 720, 250, .24, .055, .23);
        break;
      case 'caw':                         // magpie: harsh and flat
        T('sawtooth', 430, 250, .20, .11, 0);
        N(.20, .06, 'bandpass', 1500, 620, 2.2, .006, 0);
        T('sawtooth', 390, 210, .16, .07, .20);
        break;
      case 'warble':                      // robin / bluejay: bright trill
        for (let i = 0; i < 5; i++)
          T('sine', i % 2 ? 2300 : 1800, i % 2 ? 1900 : 2400, .055, .055, i * .058);
        break;
      case 'trill':                       // kingfisher: dry rattle
        for (let i = 0; i < 9; i++) N(.022, .045, 'bandpass', 3100, 2500, 7, .002, i * .035);
        T('sine', 2600, 2200, .08, .035, .32);
        break;
      case 'honk':                        // penguin / swan / flamingo
        T('sawtooth', 250, 210, .26, .085, 0, 6);
        T('sawtooth', 252, 208, .26, .07, 0, -6);
        N(.26, .030, 'bandpass', 700, 400, 1.6, .02, 0);
        break;
      case 'squawk': {                    // parrot / macaw
        const c = this.ctx, t = this.t();
        const o = c.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(880, t);
        o.frequency.exponentialRampToValueAtTime(1500, t + .06);
        o.frequency.exponentialRampToValueAtTime(430, t + .26);
        const lfo = c.createOscillator(); lfo.frequency.value = 34;
        const lg = c.createGain(); lg.gain.value = 110;
        lfo.connect(lg); lg.connect(o.frequency);
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 3;
        const gn = c.createGain();
        gn.gain.setValueAtTime(0, t);
        gn.gain.linearRampToValueAtTime(.15 * g, t + .02);
        gn.gain.exponentialRampToValueAtTime(.0001, t + .28);
        o.connect(f); f.connect(gn); gn.connect(this.sfxBus); gn.connect(this.conv);
        o.start(t); lfo.start(t); o.stop(t + .3); lfo.stop(t + .3);
        break;
      }
      case 'flare':                       // phoenix: a gout of fire
        this.noise(.34, .085 * g, 'bandpass', 420, 2600, 1.1, .012, 0);
        this.noise(.22, .045 * g, 'highpass', 3200, 1400, .7, .01, .05);
        T('sawtooth', 300, 70, .30, .075, 0);
        T('sine', 150, 55, .38, .05, .04);
        break;
      case 'screech':                     // hawk / peacock: falling scream
        T('sawtooth', 2400, 700, .34, .075, 0);
        T('sawtooth', 2380, 690, .34, .05, 0, 14);
        N(.34, .045, 'bandpass', 2600, 900, 3, .008, 0);
        break;
      case 'hoot':                        // shadow / obsidian: soft and low
        T('sine', 400, 360, .20, .10, 0);
        T('sine', 340, 300, .26, .085, .20);
        break;
      case 'whisper':                     // ghost: breath, no pitch
        N(.42, .055, 'bandpass', 1900, 700, .9, .09, 0);
        N(.30, .025, 'highpass', 3400, 2000, .6, .06, .10);
        break;
      case 'chime':                       // midas / diamond / emerald: struck metal
        T('sine', 1320, 1320, .55, .075, 0);
        T('sine', 2640, 2640, .42, .035, .01);
        T('sine', 3960, 3960, .30, .018, .02);
        break;
      case 'servo':                       // robotic: stepped motor and a relay
        T('square', 420, 420, .05, .045, 0);
        T('square', 620, 620, .05, .045, .06);
        T('square', 900, 900, .07, .04, .12);
        N(.04, .05, 'highpass', 4000, 3000, 1, .002, .20);
        break;
      case 'shimmer':                     // aurora / cosmic: detuned sweep
        T('triangle', 700, 1500, .5, .045, 0, 8);
        T('triangle', 702, 1510, .5, .045, .02, -8);
        T('sine', 2100, 2600, .35, .022, .05);
        break;
      case 'zap':                         // plasma: discharge
        N(.09, .08, 'highpass', 5000, 1800, .8, .002, 0);
        T('square', 1600, 300, .16, .06, 0);
        T('sine', 220, 90, .18, .045, .02);
        break;
      default:                            // chirp: the ordinary small bird
        for (let i = 0; i < 3; i++) {
          const f = 1900 + Math.random() * 900;
          T('sine', f, f * (1.25 + Math.random() * .5), .07, .05, i * .085);
        }
    }
  },

  // wings biting air on the way back up
  feather() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.10, .022, 'highpass', 3800, 2200, .5, .02);
  },

  // clearing a pipe — bright two-note chime
  score(n) {
    if (!this.ready || !this.sfxOn) return;
    const step = Math.min(n || 0, 12);
    const base = 784 * Math.pow(2, (step % 5) / 12);
    this.tone('sine', base, base, .20, .20);
    this.tone('sine', base * 1.5, base * 1.5, .32, .13, .045);
    this.tone('triangle', base * 2, base * 2, .16, .055, .045);
  },

  // milestone every 10 pipes
  fanfare() {
    if (!this.ready || !this.sfxOn) return;
    [0, 4, 7, 12].forEach((s, i) => {
      const f = 523.25 * Math.pow(2, s / 12);
      this.tone('triangle', f, f, .45, .13, i * .07);
    });
  },

  // body hitting a pipe: wooden crack + dull thud
  hit() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.13, .55, 'lowpass', 1900, 260, .8);
    this.tone('sawtooth', 165, 44, .22, .34);
    this.tone('sine', 90, 34, .34, .30);
  },

  // the long tumble to the ground
  fall() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('sine', 520, 90, .85, .17);
    this.tone('triangle', 262, 55, .85, .09);
  },

  // landing in the grass
  thud() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.30, .42, 'lowpass', 600, 120, .5);
    this.tone('sine', 74, 38, .30, .34);
  },

  // squeaky distress chirp
  squawk() {
    if (!this.ready || !this.sfxOn) return;
    const c = this.ctx, t = this.t();
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + .06);
    o.frequency.exponentialRampToValueAtTime(430, t + .26);
    const lfo = c.createOscillator(); lfo.frequency.value = 34;
    const lg = c.createGain(); lg.gain.value = 110;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 3;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.17, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .28);
    o.connect(f); f.connect(g); g.connect(this.sfxBus); g.connect(this.conv);
    o.start(t); lfo.start(t); o.stop(t + .3); lfo.stop(t + .3);
  },

  // idle ambience: distant songbirds
  chirp() {
    if (!this.ready || !this.sfxOn) return;
    const base = 1900 + Math.random() * 1100;
    const n = 2 + (Math.random() * 3 | 0);
    for (let i = 0; i < n; i++) {
      const f = base * (1 + (Math.random() - .5) * .3);
      this.tone('sine', f, f * (1.25 + Math.random() * .5), .07, .028, i * .085);
    }
  },

  // distant thunder: a long, soft rumble
  thunder(dist) {
    if (!this.ready || !this.sfxOn) return;
    const c = this.ctx, t = this.t();
    const near = 1 - clamp(dist, 0, 1);
    const dur = 1.6 + near * 1.6;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(120 + near * 420, t);
    lp.frequency.exponentialRampToValueAtTime(70, t + dur);
    lp.Q.value = .8;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.16 + near * .30, t + .05 + (1 - near) * .3);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const lfo = c.createOscillator(); lfo.frequency.value = 2.4 + near * 2;
    const lg = c.createGain(); lg.gain.value = .35;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(this.sfxBus); g.connect(this.conv);
    src.start(t); lfo.start(t); src.stop(t + dur + .1); lfo.stop(t + dur + .1);
    this.tone('sine', 44, 28, dur * .7, .10 + near * .12);
  },

  // wing scuffing the top of the sky
  bonk() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.09, .16, 'bandpass', 900, 380, 1.4);
    this.tone('sine', 150, 96, .10, .10);
  },

  // picking a coin out of the air
  coin() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('triangle', 1046, 1046, .09, .12);
    this.tone('triangle', 1568, 1568, .17, .085, .035);
  },
  // an item going off
  power(kind) {
    if (!this.ready || !this.sfxOn) return;
    const steps = kind === 'star' ? [0, 4, 7, 12, 16, 19] : kind === 'wind' ? [0, 5, 10] : [0, 3, 7];
    steps.forEach((st, i) => {
      const f = 523.25 * Math.pow(2, st / 12);
      this.tone(kind === 'wind' ? 'sawtooth' : 'triangle', f, f, .3, .10, i * .055);
    });
    if (kind === 'wind') this.noise(.5, .16, 'bandpass', 500, 2400, .8, .06);
  },
  // the star running out
  powerEnd() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('triangle', 784, 392, .3, .07);
  },

  // a cone spitting a rock out
  erupt() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.55, .22, 'lowpass', 380, 110, .7, .02);
    this.tone('sine', 96, 44, .4, .14);
  },
  // a hard shove of air
  gust() {
    if (!this.ready || !this.sfxOn) return;
    this.noise(.55, .14, 'bandpass', 900, 260, .8, .05);
    this.noise(.35, .05, 'highpass', 2600, 1100, .6, .04, .05);
  },
  // rubber on sand
  bounce() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('sine', 300, 150, .14, .085);
    this.noise(.09, .05, 'bandpass', 1400, 500, 1.2);
  },
  // a neon orb humming past
  orb() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('sine', 1320, 880, .35, .045);
    this.tone('triangle', 660, 440, .35, .03, .02);
  },

  // dropping off
  yawn() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('sine', 420, 170, .5, .055);
    this.noise(.45, .030, 'lowpass', 700, 260, .6, .1);
  },
  // snapping awake
  wake() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('triangle', 520, 880, .14, .07);
  },

  ui() {
    if (!this.ready || !this.sfxOn) return;
    this.tone('sine', 660, 990, .09, .10);
  },

  /* ---------------- continuous wind bed ---------------- */
  startWind() {
    const c = this.ctx, t = this.t();
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = .6;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 130;
    // slow gusting
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = .09;
    const lg = c.createGain(); lg.gain.value = 210;
    lfo.connect(lg); lg.connect(lp.frequency);
    const lfo2 = c.createOscillator(); lfo2.type = 'sine'; lfo2.frequency.value = .23;
    const lg2 = c.createGain(); lg2.gain.value = .35;
    const amp = c.createGain(); amp.gain.value = .55;
    lfo2.connect(lg2); lg2.connect(amp.gain);
    s.connect(hp); hp.connect(lp); lp.connect(amp); amp.connect(this.windBus);
    s.start(t); lfo.start(t); lfo2.start(t);
    this.windFilter = lp;
  },
  _wind: -1, _mLevel: -1, _mInt: -1,
  setWind(v) { // v: 0..1 — scales with flight speed
    if (!this.ready) return;
    if (Math.abs(v - this._wind) < .02) return;
    this._wind = v;
    const g = this.windBus.gain, t = this.t();
    g.cancelScheduledValues(t);
    g.setTargetAtTime(0.035 + v * 0.075, t, .4);
    if (this.windFilter) this.windFilter.frequency.setTargetAtTime(380 + v * 620, t, .5);
  },

  /* ---------------- adaptive soundtrack ---------------- */
  // Am - F - C - G loop with a pad, a plucked arpeggio, bass and a
  // light kit. Intensity rises as the run goes on.
  music: { step: 0, next: 0, timer: null, intensity: 0 },
  CHORDS: [
    { root: 55.00, notes: [220.00, 261.63, 329.63] },  // Am
    { root: 43.65, notes: [174.61, 220.00, 261.63] },  // F
    { root: 65.41, notes: [196.00, 261.63, 329.63] },  // C
    { root: 49.00, notes: [196.00, 246.94, 293.66] }   // G
  ],

  startMusic() {
    const BPM = 96, beat = 60 / BPM, sixteenth = beat / 4;
    this.music.next = this.t() + .12;
    const schedule = () => {
      if (!this.ctx) return;
      const now = this.t();
      while (this.music.next < now + .22) {
        this.playStep(this.music.step, this.music.next, sixteenth);
        this.music.step = (this.music.step + 1) % 64;
        this.music.next += sixteenth;
      }
    };
    this.music.timer = setInterval(schedule, 40);
  },

  playStep(step, t, dur) {
    const c = this.ctx, bar = (step / 16) | 0;
    const ch = this.CHORDS[bar % 4];
    const I = this.music.intensity;

    const voice = (type, f, len, gain, pan, filt) => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
      let node = o;
      if (filt) {
        const f2 = c.createBiquadFilter(); f2.type = 'lowpass';
        f2.frequency.setValueAtTime(filt, t);
        f2.frequency.exponentialRampToValueAtTime(filt * .4, t + len);
        o.connect(f2); node = f2;
      }
      node.connect(g);
      const p = c.createStereoPanner ? c.createStereoPanner() : null;
      if (p) { p.pan.value = pan || 0; g.connect(p); p.connect(this.musicBus); }
      else g.connect(this.musicBus);
      g.connect(this.conv);
      o.start(t); o.stop(t + len + .05);
    };

    // pad — sustained, once per bar
    if (step % 16 === 0) {
      ch.notes.forEach((f, i) => {
        voice('triangle', f, 2.6, .050 + I * .012, (i - 1) * .45, 1200);
        voice('sine', f * 2, 2.2, .018, (1 - i) * .4, 2400);
      });
    }
    // bass — root on 1 and the "and" of 3
    if (step % 16 === 0 || step % 16 === 10) {
      voice('sine', ch.root, .55, .16, 0, 420);
      voice('triangle', ch.root * 2, .28, .045 + I * .02, 0, 700);
    }
    // plucked arpeggio — denser as intensity climbs
    const arpPattern = [0, 4, 2, 6, 1, 5, 3, 7];
    if (step % 2 === 0 && I > .08) {
      const idx = arpPattern[(step / 2) % 8];
      const f = ch.notes[idx % 3] * (idx > 3 ? 2 : 1);
      voice('triangle', f, .34, (.030 + I * .045), ((step % 4) - 1.5) * .3, 3000 + I * 3000);
    }
    // hi-hat shimmer
    if (I > .3 && step % 4 === 2) {
      const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.030 * I, t + .004);
      g.gain.exponentialRampToValueAtTime(.0001, t + .06);
      s.connect(hp); hp.connect(g); g.connect(this.musicBus);
      s.start(t); s.stop(t + .1);
    }
    // soft kick on the downbeats
    if (I > .45 && (step % 16 === 0 || step % 16 === 8)) {
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(42, t + .12);
      const g = c.createGain();
      g.gain.setValueAtTime(.10 * I, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .2);
      o.connect(g); g.connect(this.musicBus);
      o.start(t); o.stop(t + .25);
    }
  },

  setMusic(level, intensity) { // level 0..1 volume, intensity 0..1 arrangement
    if (!this.ready) return;
    this.music.intensity = intensity;
    if (Math.abs(level - this._mLevel) < .01 && Math.abs(intensity - this._mInt) < .01) return;
    this._mLevel = level; this._mInt = intensity;
    const g = this.musicBus.gain, t = this.t();
    g.cancelScheduledValues(t);
    g.setTargetAtTime(this.musicOn ? level * .5 : 0, t, .55);
  },
  duckMusic() { // quick dip when the bird dies
    if (!this.ready) return;
    this._mLevel = -1;
    const g = this.musicBus.gain, t = this.t();
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.exponentialRampToValueAtTime(.0008, t + .45);
  }
};

const cvs = document.getElementById('game');

const W = 440, H = 740;           // logical world size
const GROUND_Y = H - 104;         // top of the grass
const READY_Y = H * .36;          // where the bird waits on the menu

let SCALE = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const pad = window.innerWidth < 600 ? 0 : 24;
  SCALE = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H);
  cvs.style.width = (W * SCALE) + 'px';
  cvs.style.height = (H * SCALE) + 'px';
  cvs.width = Math.round(W * SCALE * DPR);
  cvs.height = Math.round(H * SCALE * DPR);
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
resize();

/* =======================================================================
   HELPERS
   ======================================================================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mixRGB(c1, c2, t) {
  return [lerp(c1[0], c2[0], t) | 0, lerp(c1[1], c2[1], t) | 0, lerp(c1[2], c2[2], t) | 0];
}
const rgb = c => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

// deterministic value noise, used for terrain silhouettes and textures
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function vnoise(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i), hash(i + 1), u);
}
function fbm(x, oct) {
  let v = 0, a = .5, fr = 1;
  for (let i = 0; i < (oct || 4); i++) { v += a * vnoise(x * fr); fr *= 2; a *= .5; }
  return v;
}

function spawnPickups(gy, gh, x0) {
  const reach = Math.max(18, gh / 2 - 26);
  if (--itemCountdown <= 0) {
    itemCountdown = 4 + (Math.random() * 4 | 0);
    const kinds = ['magnet', 'wind', 'star'];
    items.push({
      x: x0, y: gy + rnd(-reach * .4, reach * .4),
      kind: kinds[Math.random() * kinds.length | 0],
      ph: Math.random() * 6.28, taken: 0, r: 15
    });
    return;
  }
  if (Math.random() > .78) return;
  const n = 3 + (Math.random() * 4 | 0);
  const amp = rnd(-1, 1) * reach * .7;
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? .5 : i / (n - 1);
    worldCoins.push({
      x: x0 + (i - (n - 1) / 2) * 25,
      y: gy + Math.sin(t * Math.PI) * amp,
      r: 9, ph: Math.random() * 6.28, vx: 0, vy: 0
    });
  }
}

/* =======================================================================
   THE BOSS — a lava titan holding station on the right. It lobs
   boulders down the lane, and every so often slams the floor hard
   enough to reverse every moving pipe on screen.
   ======================================================================= */
function resetBoss() {
  boss.on = false; boss.state = 'idle'; boss.t = 0; boss.ph = 0;
  boss.charge = 0; boss.shootT = 2.6; boss.slamT = 8;
  boss.x = W - 58; boss.homeY = H * .42; boss.y = boss.homeY;
}

function bossFire() {
  const aim = clamp((bird.y - boss.y) / 90, -1.1, 1.1);
  hazards.push({
    kind: 'boulder', flat: 1,
    x: boss.x - boss.r * .8, y: boss.y,
    vx: -rnd(3.4, 4.8), vy: aim,
    r: rnd(11, 16), rot: Math.random() * 6.28, rotV: rnd(-.09, .09),
    ph: 0, seed: Math.random() * 6.28
  });
  puff(boss.x - boss.r * .8, boss.y, 8, 2.4, [255, 170, 80]);
  AU.erupt();
}

function bossSlam() {
  pipeDir *= -1;                       // every moving pipe turns around
  for (const p of pipes) p.gapY += 0;  // (bounce logic picks the new sign up)
  shake = Math.max(shake, 22);
  flash = Math.max(flash, .34);
  AU.thud(); AU.erupt();
  floatText(W / 2, 150, 'PIPES REVERSED', '#ff9a4a', 22);
  for (let i = 0; i < 22; i++) {
    puff(boss.x - i * 22, GROUND_Y - 4, 1, 3.2, [200, 130, 80]);
  }
  ripples.push({ x: boss.x, y: GROUND_Y - 6, r: 6, life: 1 });
}

function updateBoss(dt, step) {
  if (!boss.on) { resetBoss(); boss.on = true; }
  boss.ph += dt;

  if (boss.state === 'idle') {
    boss.y = boss.homeY + Math.sin(boss.ph * 1.15) * 24;
    boss.shootT -= dt;
    boss.slamT -= dt;
    if (boss.slamT <= 0) { boss.state = 'rise'; boss.t = 0; }
    else if (boss.shootT <= 0) { boss.state = 'charge'; boss.t = 0; }

  } else if (boss.state === 'charge') {
    boss.t += dt;
    boss.charge = clamp(boss.t / .55, 0, 1);
    boss.y += Math.sin(boss.ph * 26) * .6;      // shuddering as it winds up
    if (boss.t >= .55) {
      bossFire();
      boss.charge = 0; boss.state = 'idle'; boss.shootT = rnd(2.0, 3.4);
    }

  } else if (boss.state === 'rise') {
    boss.t += dt;
    boss.y = lerp(boss.y, boss.homeY - 110, .10 * step);
    if (boss.t >= .65) { boss.state = 'slam'; boss.t = 0; }

  } else if (boss.state === 'slam') {
    boss.y += 26 * step;
    if (boss.y + boss.r >= GROUND_Y) {
      boss.y = GROUND_Y - boss.r;
      bossSlam();
      boss.state = 'recover'; boss.t = 0;
    }

  } else {                                       // recover
    boss.t += dt;
    boss.y = lerp(boss.y, boss.homeY, .06 * step);
    if (boss.t >= 1.0) { boss.state = 'idle'; boss.slamT = rnd(7, 11); }
  }

  // its body is solid
  if (Math.hypot(bird.x - boss.x, bird.y - boss.y) < boss.r * .82 + bird.r) {
    if (power.star > 0) {
      puff(bird.x, bird.y, 8, 3, [255, 180, 90]);
      shake = Math.max(shake, 8);
    } else {
      playerCrash('boss');
    }
  }
}

  });
  spawnPickups(gy, gh, W + 40 + 32 + pipeSpacing * .5);
  if (MAP.hazardInLane && Math.random() < (MAP.orbChance || .6)) {
    // the lane is the air between this pipe's collar and the next one's:
    // anything inside it can be flown around either way
    const orbR = 13, pad = 8;
    const lo = 71 + orbR + pad;
    const hi = pipeSpacing - 7 - orbR - pad;
    const off = hi > lo ? lerp(lo, hi, .58) : (lo + hi) / 2;
    spawnOrbInLane(gy, W + 40 + off);
  }
}

/* =======================================================================
   PARTICLES
   ======================================================================= */
function puff(x, y, n, spread, tint) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + rnd(-4, 4), y: y + rnd(-4, 4),
      vx: rnd(-spread, spread) - 1, vy: rnd(-spread, spread * .5),
      r: rnd(3, 11), life: 1, decay: rnd(.012, .03),
      tint: tint || [255, 255, 255], g: .012
    });
  }
}
function burstFeathers(x, y, n, vx0) {
  for (let i = 0; i < n; i++) {
    feathers.push({
      x: x, y: y,
      vx: rnd(-2.4, 2.4) + (vx0 || 0), vy: rnd(-3.4, 1.2),
      rot: Math.random() * 6.28, rotV: rnd(-.16, .16),
      len: rnd(7, 15), life: 1, decay: rnd(.004, .011),
      sway: Math.random() * 6.28, col: Math.random() < .78 ? 0 : 1
    });
  }
}
// a few droplets on impact — small, dark, and they dry into the scenery
function spatter(x, y, n, vx0, vy0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.2832, sp = rnd(.6, 3.4);
    blood.push({
      x: x, y: y,
      vx: Math.cos(a) * sp + (vx0 || 0), vy: Math.sin(a) * sp * .7 + (vy0 || 0) - .6,
      r: rnd(.9, 2.6), life: 1, decay: rnd(.004, .009), stuck: false
    });
  }
}
function addStain(x, y, r) {
  stains.push({ x: x, y: y, r: r, life: 1, blobs: Array.from({ length: 3 }, () => ({
    dx: rnd(-r, r), dy: rnd(-r * .5, r * .5), r: rnd(r * .35, r * .8) })) });
  if (stains.length > 26) stains.shift();
}

// blue Zs drifting off the sleeping bird
function spawnZ(scale) {
  zs.push({
    x: bird.x + 11, y: bird.y - 13,
    vx: rnd(.25, .7), vy: -rnd(.45, .85),
    size: (11 + Math.random() * 9) * (scale || 1),
    rot: rnd(-.25, .1), rotV: rnd(-.012, .012),
    sway: Math.random() * 6.28, life: 1
  });
}

function floatText(x, y, txt, col, size) {
  floaters.push({ x: x, y: y, txt: txt, col: col || '#fff', size: size || 20, life: 1 });
}

/* =======================================================================
   RENDERING — SKY, SUN, WEATHER
   ======================================================================= */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 60);
  g.addColorStop(0, rgb(sky('top')));
  g.addColorStop(.52, rgb(sky('mid')));
  g.addColorStop(1, rgb(sky('low')));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// the top of the sky is solid: haze normally, a red warning as you near it
function drawCeilingHaze() {
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, 34);
  g.addColorStop(0, rgba(mixRGB(sky('top'), [255, 255, 255], .55), .34));
  g.addColorStop(1, rgba(sky('top'), 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 34);

  if (ceilingWarn > .01) {
    const pulse = .55 + .45 * Math.sin(timeSec * 11);
    const wg = ctx.createLinearGradient(0, 0, 0, 58);
    wg.addColorStop(0, 'rgba(255,70,60,' + (.42 * ceilingWarn * pulse).toFixed(3) + ')');
    wg.addColorStop(1, 'rgba(255,70,60,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, 58);
    // hatched danger line
    ctx.globalAlpha = ceilingWarn * .75;
    ctx.strokeStyle = 'rgba(255,120,90,.9)'; ctx.lineWidth = 2;
    ctx.setLineDash([9, 7]); ctx.lineDashOffset = -timeSec * 40;
    ctx.beginPath(); ctx.moveTo(0, CEILING); ctx.lineTo(W, CEILING); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawStars() {
  const s = sky('star');
  if (s < .02) return;
  ctx.save();
  for (let i = 0; i < 110; i++) {
    const x = hash(i * 3.1) * W;
    const y = hash(i * 7.7) * (GROUND_Y * .72);
    const tw = .5 + .5 * Math.sin(i * 1.7 + timeSec * 2.1);
    const a = s * (.25 + hash(i * 2.3) * .75) * (.45 + tw * .55);
    const r = .5 + hash(i * 5.9) * 1.2;
    ctx.fillStyle = 'rgba(255,255,240,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawSun() {
  const c = sky('sun'), y = sky('sunY') * GROUND_Y, x = W * .74;
  const night = sky('star') > .7;
  ctx.save();
  // atmospheric glow
  const glow = ctx.createRadialGradient(x, y, 0, x, y, night ? 120 : 210);
  glow.addColorStop(0, rgba(c, night ? .34 : .55));
  glow.addColorStop(.35, rgba(c, night ? .12 : .20));
  glow.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = glow;
  ctx.fillRect(x - 230, y - 230, 460, 460);
  // disc
  ctx.beginPath(); ctx.arc(x, y, night ? 21 : 30, 0, 6.2832);
  const d = ctx.createRadialGradient(x - 8, y - 8, 2, x, y, night ? 22 : 32);
  d.addColorStop(0, '#fff');
  d.addColorStop(1, rgb(c));
  ctx.fillStyle = d; ctx.fill();
  if (night) { // lunar maria
    ctx.globalAlpha = .16; ctx.fillStyle = '#6a7490';
    ctx.beginPath(); ctx.arc(x - 6, y - 4, 6, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 7, y + 5, 4.4, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2, y - 9, 3, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}

// shafts of light raking down from the sun
function drawGodRays() {
  const amb = sky('amb') * (MAP.air.rays || 0);
  if (amb < .45) return;
  const x = W * .74, y = sky('sunY') * GROUND_Y;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(14px)';          // soft shafts, not hard wedges
  ctx.translate(x, y);
  for (let i = 0; i < 6; i++) {
    const a = -.95 + i * .38 + Math.sin(timeSec * .16 + i) * .05;
    const wdt = .055 + .035 * (1 + Math.sin(timeSec * .4 + i * 2.1));
    const len = 640;
    const g = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
    g.addColorStop(0, rgba(sky('sun'), .030 * amb));
    g.addColorStop(.4, rgba(sky('sun'), .016 * amb));
    g.addColorStop(1, rgba(sky('sun'), 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a - wdt) * len, Math.sin(a - wdt) * len);
    ctx.lineTo(Math.cos(a + wdt) * len, Math.sin(a + wdt) * len);
    ctx.closePath(); ctx.fill();
  }
  ctx.filter = 'none';
  ctx.restore();
}

// cloud shadows sweeping over the grass
function drawCloudShadows() {
  const amb = sky('amb') * (MAP.air.cloudShadows || 0);
  if (amb < .5) return;
  ctx.save();
  ctx.globalAlpha = .10 * amb;
  ctx.fillStyle = '#0d1a12';
  for (const c of clouds) {
    if (c.depth > .2) continue;
    const sx = c.x + 40;
    if (sx < -180 || sx > W + 180) continue;
    ctx.beginPath();
    ctx.ellipse(sx, GROUND_Y + 12, c.w * c.scale * .75, 9, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

/* ---- shadows -------------------------------------------------------
   Everything is lit from the sun, so everything leans its shadow away
   from it. One helper keeps the whole scene consistent.
   -------------------------------------------------------------------- */
function sunShadowDX(x) { return (x - W * .74) * .11; }

// a soft contact shadow on the grass, faded by how high the thing is
function castShadow(x, y, rx, ry, strength) {
  const h = clamp((GROUND_Y - y) / (GROUND_Y - 60), 0, 1);
  const a = ((1 - h) * .34 + .05) * (strength == null ? 1 : strength) * (.35 + sky('amb') * .65);
  if (a <= .012) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x + sunShadowDX(x), GROUND_Y + 9,
              rx * (1 - h * .35), ry * (1 - h * .35), 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

// scenery sitting on the ground gets a short, dark pool under it
function propShadow(x, w) {
  ctx.save();
  ctx.globalAlpha = .20 * (.3 + sky('amb') * .7);
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x + sunShadowDX(x) * .35, GROUND_Y + 7, w, 4.2, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

// ---- FAR LAYER -------------------------------------------------------
function drawMountains(icy) {
  const off = scroll * .045, baseY = GROUND_Y - 96;
  const far = mixRGB(sky('mid'), icy ? [96, 128, 158] : [72, 86, 122], .62);
  ctx.fillStyle = rgb(far);
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W + 8; x += 7) {
    const n = fbm((x + off) * (icy ? .0075 : .0055), 5);
    ctx.lineTo(x, baseY - n * (icy ? 150 : 120) + 40);
  }
  ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();

  const off2 = scroll * .085, base2 = GROUND_Y - 58;
  const near = mixRGB(sky('mid'), icy ? [70, 104, 138] : [46, 60, 86], .78);
  ctx.fillStyle = rgb(near);
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);
  const pts = [];
  for (let x = 0; x <= W + 8; x += 6) {
    const n = fbm((x + off2) * (icy ? .012 : .009), 5);
    const y = base2 - n * (icy ? 120 : 96) + 26;
    pts.push([x, y]); ctx.lineTo(x, y);
  }
  ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();
  // snow on the peaks
  ctx.save(); ctx.globalAlpha = (icy ? .85 : .5) * sky('amb');
  ctx.fillStyle = rgba(mixRGB(sky('light'), [255, 255, 255], icy ? .8 : .5), 1);
  for (let i = 1; i < pts.length - 1; i++) {
    const [x, y] = pts[i];
    if (y < pts[i - 1][1] && y < pts[i + 1][1] && y < base2 - (icy ? 30 : 52)) {
      const sz = icy ? 11 : 7;
      ctx.beginPath(); ctx.moveTo(x - sz, y + sz + 1); ctx.lineTo(x, y - 1); ctx.lineTo(x + sz, y + sz + 1);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

// flat-topped plateaus stepping back into the haze
function drawMesas() {
  for (const layer of [{ sp: .05, y: GROUND_Y - 58, h: 130, w: 150, tone: .60 },
                       { sp: .10, y: GROUND_Y - 26, h: 92, w: 110, tone: .80 }]) {
    const off = scroll * layer.sp;
    ctx.fillStyle = rgb(mixRGB(sky('mid'), [122, 78, 54], layer.tone));
    for (let i = -1; i < 8; i++) {
      const seed = Math.floor((i * layer.w + off) / layer.w);
      const x = i * layer.w - (off % layer.w);
      const h = layer.h * (.45 + hash(seed * 3.9) * .55);
      const w = layer.w * (.5 + hash(seed * 7.3) * .45);
      const top = layer.y - h;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y);
      ctx.lineTo(x + w * .10, top + h * .18);
      ctx.lineTo(x + w * .22, top);
      ctx.lineTo(x + w * .80, top);
      ctx.lineTo(x + w * .92, top + h * .14);
      ctx.lineTo(x + w, GROUND_Y);
      ctx.closePath(); ctx.fill();
      // strata lines catching the light
      ctx.save();
      ctx.globalAlpha = .16;
      ctx.strokeStyle = rgb(mixRGB(sky('light'), [255, 220, 170], .4)); ctx.lineWidth = 1.5;
      for (let k = 1; k < 5; k++) {
        const ly = top + (h / 5) * k;
        ctx.beginPath(); ctx.moveTo(x + w * .13, ly); ctx.lineTo(x + w * .88, ly); ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// smoking cones on the skyline
function drawVolcanoes() {
  const off = scroll * .055, span = 300;
  for (let i = -1; i < 4; i++) {
    const seed = Math.floor((i * span + off) / span);
    const x = i * span - (off % span) + hash(seed * 5.1) * 60;
    const h = 140 + hash(seed * 2.7) * 90;
    const w = 190 + hash(seed * 8.3) * 90;
    const top = GROUND_Y - h;
    ctx.fillStyle = rgb(mixRGB(sky('mid'), [30, 18, 20], .82));
    ctx.beginPath();
    ctx.moveTo(x - w / 2, GROUND_Y);
    ctx.lineTo(x - w * .10, top + 6);
    ctx.lineTo(x + w * .10, top + 6);
    ctx.lineTo(x + w / 2, GROUND_Y);
    ctx.closePath(); ctx.fill();
    // crater glow
    const pulse = .55 + .45 * Math.sin(timeSec * .9 + seed);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(x, top + 6, 1, x, top + 6, 54);
    cg.addColorStop(0, 'rgba(255,170,70,' + (.55 * pulse).toFixed(2) + ')');
    cg.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(x - 60, top - 54, 120, 108);
    ctx.restore();
    // lava running down one flank
    ctx.save();
    ctx.globalAlpha = .55 * pulse;
    ctx.strokeStyle = '#ff7a22'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w * .06, top + 8);
    ctx.quadraticCurveTo(x + w * .22, top + h * .5, x + w * .30, GROUND_Y - 4);
    ctx.stroke();
    ctx.restore();
    // smoke plume
    ctx.save();
    ctx.globalAlpha = .20;
    ctx.fillStyle = rgb(mixRGB(sky('mid'), [60, 50, 52], .5));
    for (let k = 0; k < 7; k++) {
      const py = top - 10 - k * 26;
      const pr = 16 + k * 11;
      const dx = Math.sin(timeSec * .25 + k * .7 + seed) * (6 + k * 4);
      ctx.beginPath(); ctx.arc(x + dx, py, pr, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
}

// open water out to the horizon
function drawOcean() {
  const horizon = GROUND_Y - 96;
  const amb = sky('amb'), L = sky('light');
  const g = ctx.createLinearGradient(0, horizon, 0, GROUND_Y + 6);
  g.addColorStop(0, rgb(mixRGB([54, 132, 176], L, .30 * amb)));
  g.addColorStop(.55, rgb(mixRGB([26, 106, 158], L, .18 * amb)));
  g.addColorStop(1, rgb(mixRGB([46, 158, 186], L, .28 * amb)));
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, GROUND_Y - horizon + 6);

  // sun glitter
  ctx.save();
  ctx.globalAlpha = .30 * amb;
  ctx.fillStyle = rgb(sky('sun'));
  for (let i = 0; i < 40; i++) {
    const t = hash(i * 3.1);
    const y = horizon + 6 + t * (GROUND_Y - horizon - 8);
    const spread = 10 + t * 70;
    const x = W * .74 + Math.sin(timeSec * 1.4 + i) * spread;
    ctx.fillRect(x, y, 4 + t * 10, 1.4);
  }
  ctx.restore();

  // rolling swell, faster the closer it is
  ctx.save();
  ctx.lineCap = 'round';
  for (let row = 0; row < 9; row++) {
    const t = row / 8;
    const y = horizon + 8 + t * t * (GROUND_Y - horizon - 10);
    const off = scroll * (.03 + t * .22) + timeSec * (6 + t * 22);
    ctx.globalAlpha = (.16 + t * .3) * (.4 + amb * .6);
    ctx.strokeStyle = rgb(mixRGB([226, 248, 255], L, .2));
    ctx.lineWidth = .8 + t * 1.6;
    for (let i = -1; i < 9; i++) {
      const step = 58 + t * 26;
      const x = i * step - (off % step);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + step * .25, y - 2 - t * 2, x + step * .5, y);
      ctx.stroke();
    }
  }
  ctx.restore();

  // surf line on the sand
  ctx.save();
  ctx.globalAlpha = .55;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = -1; i < 10; i++) {
    const x = i * 54 - ((scroll * .3 + timeSec * 14) % 54);
    const bob = Math.sin(timeSec * 1.6 + i) * 3;
    ctx.beginPath();
    ctx.ellipse(x + 27, GROUND_Y - 2 + bob, 30, 4.5, 0, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

// a pocked grey horizon
function drawCraters() {
  const off = scroll * .05, baseY = GROUND_Y - 40;
  ctx.fillStyle = rgb(mixRGB(sky('mid'), [92, 92, 106], .7));
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W + 8; x += 7) {
    const n = fbm((x + off) * .006, 4);
    ctx.lineTo(x, baseY - n * 70 + 20);
  }
  ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();

  const off2 = scroll * .11;
  ctx.fillStyle = rgb(mixRGB(sky('mid'), [58, 58, 70], .82));
  for (let i = -1; i < 9; i++) {
    const seed = Math.floor((i * 96 + off2) / 96);
    const x = i * 96 - (off2 % 96);
    const r = 24 + hash(seed * 4.1) * 40;
    const y = GROUND_Y - 6 - hash(seed * 7.7) * 26;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * .30, 0, Math.PI, 0); ctx.fill();
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.fillStyle = rgb(mixRGB(sky('light'), [255, 255, 255], .4));
    ctx.beginPath(); ctx.ellipse(x, y - r * .06, r * .92, r * .22, 0, Math.PI, 0); ctx.fill();
    ctx.restore();
    ctx.fillStyle = rgb(mixRGB(sky('mid'), [58, 58, 70], .82));
  }
}

// one cog, teeth and all
function drawGear(x, y, r, teeth, ang, fill, stroke) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath();
  const inner = r * .80, tipW = Math.PI / teeth * .52;
  for (let i = 0; i < teeth; i++) {
    const a = i / teeth * 6.2832;
    ctx.lineTo(Math.cos(a - tipW) * inner, Math.sin(a - tipW) * inner);
    ctx.lineTo(Math.cos(a - tipW * .62) * r, Math.sin(a - tipW * .62) * r);
    ctx.lineTo(Math.cos(a + tipW * .62) * r, Math.sin(a + tipW * .62) * r);
    ctx.lineTo(Math.cos(a + tipW) * inner, Math.sin(a + tipW) * inner);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  // hub and spokes
  ctx.globalAlpha = .55;
  ctx.strokeStyle = stroke || 'rgba(0,0,0,.4)'; ctx.lineWidth = Math.max(1, r * .10);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * 6.2832;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * .18, Math.sin(a) * r * .18);
    ctx.lineTo(Math.cos(a) * r * .62, Math.sin(a) * r * .62);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = stroke || 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.arc(0, 0, r * .18, 0, 6.2832); ctx.fill();
  ctx.restore();
}

// a molten sea out to the horizon
function drawLavaLake() {
  const horizon = GROUND_Y - 104;
  const g = ctx.createLinearGradient(0, horizon, 0, GROUND_Y + 6);
  g.addColorStop(0, '#5a1a0c');
  g.addColorStop(.45, '#8c2a0e');
  g.addColorStop(1, '#d8541a');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, GROUND_Y - horizon + 6);

  // dark crust plates drifting on it, glowing along the seams
  // wide crust plates, nearly touching, so the glow only shows in the seams
  for (let row = 0; row < 10; row++) {
    const t = row / 9;
    const y = horizon + 4 + t * t * (GROUND_Y - horizon - 6);
    const off = scroll * (.03 + t * .20) + timeSec * (4 + t * 16);
    const step2 = 76 + t * 66;
    for (let i = -1; i < 9; i++) {
      const seed = Math.floor((i * step2 + off) / step2);
      const x = i * step2 - (off % step2);
      const w2 = step2 * (.90 + hash(seed * 3.3) * .08);
      const h2 = (5 + t * 13) * (.8 + hash(seed * 7.1) * .4);
      ctx.globalAlpha = .78 + t * .18;
      const sh = 30 + t * 26 + hash(seed * 5.5) * 14;
      ctx.fillStyle = 'rgb(' + (sh | 0) + ',' + (sh * .58 | 0) + ',' + (sh * .5 | 0) + ')';
      ctx.beginPath();
      ctx.ellipse(x + w2 / 2, y, w2 / 2, h2 / 2, 0, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // glow coming off the surface
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createLinearGradient(0, horizon - 60, 0, GROUND_Y);
  hg.addColorStop(0, 'rgba(255,90,20,0)');
  hg.addColorStop(1, 'rgba(255,120,40,' + (.22 + .06 * Math.sin(timeSec * 1.4)).toFixed(3) + ')');
  ctx.fillStyle = hg;
  ctx.fillRect(0, horizon - 60, W, GROUND_Y - horizon + 60);
  ctx.restore();
}

// rock wall closing in behind
function drawCaveWall() {
  const off = scroll * .06;
  ctx.fillStyle = rgb(mixRGB(sky('mid'), [42, 36, 50], .72));
  ctx.fillRect(0, 0, W, GROUND_Y + 8);
  // hanging teeth from the roof
  ctx.fillStyle = rgb(mixRGB(sky('mid'), [26, 22, 32], .8));
  for (let i = -1; i < 18; i++) {
    const seed = Math.floor((i * 38 + off) / 38);
    const x = i * 38 - (off % 38);
    const hh = 24 + hash(seed * 4.1) * 70;
    const ww = 9 + hash(seed * 7.3) * 11;
    ctx.beginPath();
    ctx.moveTo(x - ww, 0); ctx.lineTo(x, hh); ctx.lineTo(x + ww, 0);
    ctx.closePath(); ctx.fill();
  }
  // damp seams catching what light there is
  ctx.save();
  ctx.globalAlpha = .12;
  ctx.strokeStyle = rgb(mixRGB(sky('light'), [255, 255, 255], .4));
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 12; i++) {
    let sx = ((hash(i * 9.7) * W * 2) - off * 1.6) % (W + 80);
    if (sx < -40) sx += W + 80;
    ctx.beginPath();
    ctx.moveTo(sx, 60 + hash(i) * 120);
    ctx.lineTo(sx + 14 - hash(i * 2) * 28, GROUND_Y - 40 - hash(i * 3) * 120);
    ctx.stroke();
  }
  ctx.restore();
}

// a reef bank far below the surface
function drawReefFar() {
  const off = scroll * .06, baseY = GROUND_Y - 70;
  ctx.fillStyle = rgb(mixRGB(sky('mid'), [30, 90, 104], .55));
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);
  for (let x = 0; x <= W + 8; x += 8) {
    const n = fbm((x + off) * .008, 4);
    ctx.lineTo(x, baseY - n * 80 + 26);
  }
  ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();
  // coral heads on the bank
  const off2 = scroll * .13;
  for (let i = -1; i < 12; i++) {
    const seed = Math.floor((i * 66 + off2) / 66);
    const x = i * 66 - (off2 % 66);
    const r = 12 + hash(seed * 5.1) * 22;
    const y = GROUND_Y - 24 - hash(seed * 8.3) * 30;
    const tone = hash(seed * 3.7);
    ctx.fillStyle = rgb(mixRGB(mixRGB([214, 96, 128], [120, 190, 176], tone), sky('mid'), .45));
    for (let k = 0; k < 4; k++) {
      const a = Math.PI + k / 3 * Math.PI;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r * .5, y + Math.sin(a) * r * .3, r * .55, 0, 6.2832);
      ctx.fill();
    }
  }
  // shafts of light coming down through the water
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .07;
  ctx.fillStyle = '#cfefff';
  for (let i = 0; i < 6; i++) {
    const x = ((i * 96 + timeSec * 7) % (W + 160)) - 80;
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 26, 0);
    ctx.lineTo(x + 70, GROUND_Y); ctx.lineTo(x + 8, GROUND_Y);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// an ocean of cloud tops seen from above
function drawCloudSea() {
  const horizon = GROUND_Y - 120;
  const g = ctx.createLinearGradient(0, horizon, 0, GROUND_Y + 8);
  g.addColorStop(0, rgb(mixRGB([236, 244, 252], sky('light'), .3)));
  g.addColorStop(1, rgb(mixRGB([198, 216, 236], sky('mid'), .3)));
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, GROUND_Y - horizon + 8);
  for (let row = 0; row < 7; row++) {
    const t = row / 6;
    const y = horizon + 8 + t * t * (GROUND_Y - horizon - 10);
    const off = scroll * (.04 + t * .18);
    const step2 = 70 + t * 54;
    for (let i = -1; i < 10; i++) {
      const seed = Math.floor((i * step2 + off) / step2);
      const x = i * step2 - (off % step2);
      const rr = step2 * (.34 + hash(seed * 4.7) * .2);
      ctx.globalAlpha = .55 + t * .4;
      ctx.fillStyle = rgb(mixRGB([255, 255, 255], sky('mid'), .10 + t * .22));
      ctx.beginPath();
      ctx.arc(x + rr, y, rr, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x, y, rr * 2, 16 + t * 20);
    }
  }
  ctx.globalAlpha = 1;
}

// ---- MID LAYER -------------------------------------------------------
function drawCity() {
  const off = scroll * .16, y0 = GROUND_Y - 22;
  const col = mixRGB(sky('low'), [38, 44, 70], .70);
  const lit = sky('star') > .25;
  ctx.save();
  ctx.globalAlpha = .85;
  for (let i = -1; i < 26; i++) {
    const seed = Math.floor((i * 46 + off) / 46);
    const x = i * 46 - (off % 46);
    const h = 26 + hash(seed * 3.3) * 86;
    const w = 24 + hash(seed * 9.1) * 20;
    ctx.fillStyle = rgb(col);
    ctx.fillRect(x, y0 - h, w, h + 22);
    if (lit) {
      ctx.fillStyle = 'rgba(255,214,130,' + (.55 * sky('star')).toFixed(2) + ')';
      for (let wy = y0 - h + 8; wy < y0 - 6; wy += 9) {
        for (let wx = x + 4; wx < x + w - 4; wx += 8) {
          if (hash(wx * 1.3 + wy * 5.7 + seed) > .55) ctx.fillRect(wx, wy, 3, 4);
        }
      }
    }
  }
  ctx.restore();
}

// towers stacked deep, every window a different colour of electric
function drawNeonCity() {
  const NEON = ['#31f0ff', '#ff3bb0', '#ffd23b', '#7b5bff', '#3bff9e'];
  for (const layer of [{ sp: .07, step: 58, base: GROUND_Y - 10, hmin: 90, hmax: 230, tone: .55, a: .55 },
                       { sp: .16, step: 44, base: GROUND_Y - 20, hmin: 50, hmax: 165, tone: .80, a: .95 }]) {
    const off = scroll * layer.sp;
    ctx.save();
    ctx.globalAlpha = layer.a;
    for (let i = -1; i < 14; i++) {
      const seed = Math.floor((i * layer.step + off) / layer.step);
      const x = i * layer.step - (off % layer.step);
      const h = layer.hmin + hash(seed * 3.3) * (layer.hmax - layer.hmin);
      const w = layer.step * (.62 + hash(seed * 9.1) * .30);
      const top = layer.base - h;
      ctx.fillStyle = rgb(mixRGB(sky('low'), [10, 10, 26], layer.tone));
      ctx.fillRect(x, top, w, h + 30);
      // lit windows
      const col = NEON[Math.floor(hash(seed * 4.7) * NEON.length)];
      ctx.fillStyle = col;
      for (let wy = top + 7; wy < layer.base - 8; wy += 8) {
        for (let wx = x + 3; wx < x + w - 4; wx += 7) {
          const t = hash(wx * 1.7 + wy * 5.3 + seed);
          if (t > .52) {
            ctx.globalAlpha = layer.a * (.25 + t * .55) * (.7 + .3 * Math.sin(timeSec * 2 + wx + wy));
            ctx.fillRect(wx, wy, 2.5, 3);
          }
        }
      }
      ctx.globalAlpha = layer.a;
      // a glowing sign band near the top
      if (hash(seed * 6.1) > .55) {
        ctx.save();
        ctx.globalAlpha = layer.a * (.65 + .35 * Math.sin(timeSec * 1.4 + seed));
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
        ctx.fillRect(x + 2, top + 12 + hash(seed) * 30, w - 4, 3);
        ctx.restore();
      }
      // aircraft warning light
      if (hash(seed * 11.3) > .7) {
        ctx.save();
        ctx.globalAlpha = layer.a * (.4 + .6 * Math.abs(Math.sin(timeSec * 2.2 + seed)));
        ctx.fillStyle = '#ff4d4d'; ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(x + w / 2, top - 2, 1.8, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }
}

// the works: girders, vats and slow cogs behind the line
function drawFactoryBack() {
  const amb = sky('amb');
  const wall = mixRGB(sky('low'), [52, 48, 44], .72);
  const TOP = 96;
  ctx.fillStyle = rgb(wall);
  ctx.fillRect(0, TOP, W, GROUND_Y - TOP + 8);

  // roof trusses under the skylights
  ctx.save();
  ctx.strokeStyle = rgb(mixRGB(wall, [24, 22, 20], .55));
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  const toff = scroll * .09;
  for (let i = -1; i < 7; i++) {
    const x = i * 96 - (toff % 96);
    ctx.beginPath();
    ctx.moveTo(x, TOP); ctx.lineTo(x + 48, TOP - 26); ctx.lineTo(x + 96, TOP);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 24, TOP); ctx.lineTo(x + 48, TOP - 26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 72, TOP); ctx.lineTo(x + 48, TOP - 26); ctx.stroke();
    ctx.lineWidth = 4;
  }
  ctx.fillStyle = rgb(mixRGB(wall, [18, 17, 16], .6));
  ctx.fillRect(0, TOP - 4, W, 8);
  ctx.restore();

  // big slow gears set into the wall
  const off = scroll * .09;
  for (let i = -1; i < 6; i++) {
    const seed = Math.floor((i * 128 + off) / 128);
    const x = i * 128 - (off % 128);
    const r = 34 + hash(seed * 3.7) * 30;
    const y = GROUND_Y - 150 - hash(seed * 8.1) * 80;
    const dir = hash(seed * 5.3) > .5 ? 1 : -1;
    drawGear(x, y, r, 10 + (hash(seed) * 6 | 0),
             timeSec * .35 * dir + seed,
             rgb(mixRGB(wall, [30, 28, 26], .55)), 'rgba(0,0,0,.35)');
  }

  // girders
  ctx.save();
  ctx.globalAlpha = .85;
  ctx.fillStyle = rgb(mixRGB(wall, [26, 24, 22], .5));
  const goff = scroll * .16;
  for (let i = -1; i < 8; i++) {
    const x = i * 92 - (goff % 92);
    ctx.fillRect(x, TOP, 10, GROUND_Y - TOP + 8);
  }
  ctx.fillRect(0, GROUND_Y - 320, W, 9);
  ctx.fillRect(0, GROUND_Y - 214, W, 9);
  ctx.fillRect(0, GROUND_Y - 108, W, 9);
  ctx.restore();

  // pipework and warning lamps
  ctx.save();
  const poff = scroll * .16;
  ctx.strokeStyle = rgb(mixRGB(wall, [86, 74, 52], .5));
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (let i = -1; i < 5; i++) {
    const x = i * 150 - (poff % 150);
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y - 200);
    ctx.lineTo(x + 60, GROUND_Y - 200);
    ctx.quadraticCurveTo(x + 86, GROUND_Y - 200, x + 86, GROUND_Y - 170);
    ctx.lineTo(x + 86, GROUND_Y - 120);
    ctx.stroke();
  }
  for (let i = -1; i < 7; i++) {
    const seed = Math.floor((i * 104 + poff) / 104);
    const x = i * 104 - (poff % 104);
    const lit = .35 + .65 * Math.abs(Math.sin(timeSec * 1.8 + seed));
    ctx.globalAlpha = lit * (.5 + amb * .5);
    ctx.fillStyle = hash(seed * 2.2) > .5 ? '#ffae2e' : '#e8483c';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x, GROUND_Y - 218, 3.2, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ---- NEAR LAYER ------------------------------------------------------
function drawConifers(frosted) {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const dark = mixRGB(frosted ? [42, 64, 72] : [26, 58, 38], sky('light'), .16 * sky('amb'));
  for (let i = -1; i < 22; i++) {
    const seed = Math.floor((i * 34 + off) / 34);
    const x = i * 34 - (off % 34) + hash(seed * 2.2) * 10;
    const h = 34 + hash(seed * 6.6) * 46;
    const w = 13 + hash(seed * 4.4) * 9;
    propShadow(x, w * 1.1);
    ctx.fillStyle = rgb(mixRGB(dark, frosted ? [16, 32, 44] : [10, 26, 18], hash(seed * 8.8) * .5));
    ctx.beginPath();
    ctx.moveTo(x, y0 - h);
    for (let t = 0; t < 4; t++) {
      const ty = y0 - h + (h / 4) * (t + 1);
      const tw = w * (t + 1) / 4;
      ctx.lineTo(x + tw, ty); ctx.lineTo(x + tw * .55, ty);
    }
    ctx.lineTo(x + 2, y0);
    ctx.lineTo(x - 2, y0);
    for (let t = 3; t >= 0; t--) {
      const ty = y0 - h + (h / 4) * (t + 1);
      const tw = w * (t + 1) / 4;
      ctx.lineTo(x - tw * .55, ty); ctx.lineTo(x - tw, ty);
    }
    ctx.closePath(); ctx.fill();
    if (frosted) {   // snow sitting on the branches
      ctx.save();
      ctx.globalAlpha = .8;
      ctx.fillStyle = rgb(mixRGB([250, 254, 255], sky('light'), .25));
      for (let t = 0; t < 4; t++) {
        const ty = y0 - h + (h / 4) * (t + 1);
        const tw = w * (t + 1) / 4;
        ctx.beginPath();
        ctx.moveTo(x - tw, ty); ctx.lineTo(x, ty - h / 4 * .55); ctx.lineTo(x + tw, ty);
        ctx.lineTo(x + tw * .6, ty - 2); ctx.lineTo(x, ty - h / 4 * .38); ctx.lineTo(x - tw * .6, ty - 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }
}

function drawCacti() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const body = mixRGB([44, 96, 58], sky('light'), .18 * sky('amb'));
  for (let i = -1; i < 16; i++) {
    const seed = Math.floor((i * 48 + off) / 48);
    const x = i * 48 - (off % 48) + hash(seed * 2.2) * 20;
    const t = hash(seed * 5.5);
    if (t < .42) {   // a boulder instead
      const r = 6 + hash(seed * 3.1) * 13;
      propShadow(x, r * 1.2);
      ctx.fillStyle = rgb(mixRGB([132, 96, 60], sky('light'), .14 * sky('amb')));
      ctx.beginPath(); ctx.ellipse(x, y0 - r * .45, r, r * .62, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(x - r, y0 - r * .45, r * 2, r * .5);
      continue;
    }
    const h = 26 + hash(seed * 6.6) * 40;
    const w = 7 + hash(seed * 4.4) * 4;
    propShadow(x, w * 2.1);
    ctx.fillStyle = rgb(mixRGB(body, [16, 44, 26], hash(seed * 8.8) * .5));
    // trunk
    ctx.beginPath();
    ctx.moveTo(x - w, y0); ctx.lineTo(x - w, y0 - h + w);
    ctx.quadraticCurveTo(x - w, y0 - h, x, y0 - h);
    ctx.quadraticCurveTo(x + w, y0 - h, x + w, y0 - h + w);
    ctx.lineTo(x + w, y0); ctx.closePath(); ctx.fill();
    // arms
    for (const sgn of (hash(seed * 7.7) > .45 ? [-1, 1] : [hash(seed * 9.9) > .5 ? 1 : -1])) {
      const ay = y0 - h * (.45 + hash(seed * sgn * 3.3) * .2);
      const al = 9 + hash(seed * 6.1) * 8;
      const au = 12 + hash(seed * 2.3) * 12;
      ctx.beginPath();
      ctx.moveTo(x + sgn * w * .6, ay + w * .8);
      ctx.lineTo(x + sgn * (w + al), ay + w * .8);
      ctx.quadraticCurveTo(x + sgn * (w + al + w * .8), ay + w * .8, x + sgn * (w + al + w * .8), ay);
      ctx.lineTo(x + sgn * (w + al + w * .8), ay - au);
      ctx.quadraticCurveTo(x + sgn * (w + al + w * .8), ay - au - w * .8, x + sgn * (w + al), ay - au - w * .8);
      ctx.quadraticCurveTo(x + sgn * (w + al - w * .8), ay - au - w * .8, x + sgn * (w + al - w * .8), ay - au);
      ctx.lineTo(x + sgn * (w + al - w * .8), ay - w * .2);
      ctx.lineTo(x + sgn * w * .6, ay - w * .2);
      ctx.closePath(); ctx.fill();
    }
    // ribs
    ctx.save();
    ctx.globalAlpha = .25;
    ctx.strokeStyle = '#1d4a2c'; ctx.lineWidth = 1;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath(); ctx.moveTo(x + k * w * .5, y0); ctx.lineTo(x + k * w * .5, y0 - h + w); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDeadTrees() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = -1; i < 18; i++) {
    const seed = Math.floor((i * 42 + off) / 42);
    const x = i * 42 - (off % 42) + hash(seed * 2.2) * 16;
    const h = 30 + hash(seed * 6.6) * 46;
    propShadow(x, 7);
    ctx.strokeStyle = rgb(mixRGB([28, 20, 20], sky('light'), .12 * sky('amb')));
    ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + (hash(seed) - .5) * 8, y0 - h); ctx.stroke();
    ctx.lineWidth = 1.8;
    for (let k = 0; k < 4; k++) {
      const by = y0 - h * (.45 + k * .16);
      const sgn = k % 2 ? 1 : -1;
      const bl = 8 + hash(seed * 3.7 + k) * 13;
      ctx.beginPath();
      ctx.moveTo(x + (hash(seed) - .5) * 5, by);
      ctx.quadraticCurveTo(x + sgn * bl * .6, by - 4, x + sgn * bl, by - 10 - hash(k + seed) * 8);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPalms() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  for (let i = -1; i < 12; i++) {
    const seed = Math.floor((i * 74 + off) / 74);
    const x = i * 74 - (off % 74) + hash(seed * 2.2) * 24;
    const h = 54 + hash(seed * 6.6) * 54;
    const lean = (hash(seed * 3.3) - .5) * 22;
    propShadow(x + lean * .4, 12);
    // trunk
    ctx.save();
    ctx.strokeStyle = rgb(mixRGB([124, 92, 54], sky('light'), .16 * sky('amb')));
    ctx.lineWidth = 5.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.quadraticCurveTo(x + lean * .4, y0 - h * .6, x + lean, y0 - h);
    ctx.stroke();
    // trunk rings
    ctx.globalAlpha = .3; ctx.lineWidth = 1;
    ctx.strokeStyle = '#4a341c';
    for (let k = 1; k < 6; k++) {
      const t = k / 6, rx = x + lean * .4 * t + lean * t * t * .6, ry = y0 - h * t;
      ctx.beginPath(); ctx.moveTo(rx - 3, ry); ctx.lineTo(rx + 3, ry); ctx.stroke();
    }
    ctx.restore();
    // fronds
    const tx = x + lean, ty = y0 - h;
    const green = mixRGB([36, 118, 62], sky('light'), .18 * sky('amb'));
    for (let f = 0; f < 6; f++) {
      const a = -Math.PI / 2 + (f - 2.5) * .52 + Math.sin(timeSec * 1.1 + f + seed) * .06;
      const fl = 22 + hash(seed * 9 + f) * 16;
      ctx.save();
      ctx.translate(tx, ty); ctx.rotate(a);
      ctx.fillStyle = rgb(mixRGB(green, [14, 62, 30], hash(seed + f) * .5));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(fl * .5, -7, fl, 2);
      ctx.quadraticCurveTo(fl * .5, 5, 0, 0);
      ctx.fill();
      ctx.restore();
    }
    // coconuts
    if (hash(seed * 11) > .55) {
      ctx.fillStyle = '#6a4a26';
      ctx.beginPath(); ctx.arc(tx - 3, ty + 4, 3.4, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(tx + 3, ty + 5, 3, 0, 6.2832); ctx.fill();
    }
  }
}

function drawFerns() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  for (let i = -1; i < 18; i++) {
    const seed = Math.floor((i * 40 + off) / 40);
    const x = i * 40 - (off % 40) + hash(seed * 2.2) * 14;
    const h = 26 + hash(seed * 6.6) * 40;
    propShadow(x, 14);
    const green = mixRGB([28, 92, 46], sky('light'), .16 * sky('amb'));
    for (let f = 0; f < 5; f++) {
      const a = -Math.PI / 2 + (f - 2) * .46 + Math.sin(timeSec * 1.4 + f + seed) * .07;
      const fl = h * (.7 + hash(seed * 3 + f) * .5);
      ctx.save();
      ctx.translate(x, y0); ctx.rotate(a);
      ctx.fillStyle = rgb(mixRGB(green, [10, 44, 22], hash(seed + f) * .55));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(fl * .45, -9, fl, 0);
      ctx.quadraticCurveTo(fl * .45, 9, 0, 0);
      ctx.fill();
      // midrib
      ctx.globalAlpha = .35;
      ctx.strokeStyle = '#0e3a1c'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(fl, 0); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawRocks() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  for (let i = -1; i < 20; i++) {
    const seed = Math.floor((i * 36 + off) / 36);
    const x = i * 36 - (off % 36) + hash(seed * 2.2) * 12;
    const r = 5 + hash(seed * 6.6) * 17;
    propShadow(x, r * 1.1);
    ctx.beginPath();
    const n = 6;
    for (let k = 0; k < n; k++) {
      const a = Math.PI + k / (n - 1) * Math.PI;
      const rr = r * (.72 + hash(seed * 12 + k) * .45);
      const px = x + Math.cos(a) * rr, py = y0 + Math.sin(a) * rr * .82;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    const rg = ctx.createLinearGradient(x - r, y0 - r, x + r, y0);
    rg.addColorStop(0, rgb(mixRGB([146, 146, 160], sky('light'), .2 * sky('amb'))));
    rg.addColorStop(1, rgb(mixRGB([54, 54, 66], sky('light'), .06 * sky('amb'))));
    ctx.fillStyle = rg; ctx.fill();
  }
}

function drawReeds() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = -1; i < 40; i++) {
    const seed = Math.floor((i * 18 + off) / 18);
    const x = i * 18 - (off % 18) + hash(seed * 2.2) * 8;
    const h = 26 + hash(seed * 6.6) * 46;
    const sway = Math.sin(timeSec * 1.5 + seed) * (3 + wind);
    ctx.strokeStyle = rgb(mixRGB([64, 96, 48], sky('light'), .14 * sky('amb')));
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.quadraticCurveTo(x + sway * .4, y0 - h * .6, x + sway, y0 - h);
    ctx.stroke();
    if (hash(seed * 5.5) > .5) {   // cattail head
      ctx.fillStyle = rgb(mixRGB([92, 62, 34], sky('light'), .12 * sky('amb')));
      ctx.beginPath();
      ctx.ellipse(x + sway, y0 - h - 5, 2.6, 7, sway * .03, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawLollipops() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const COLS = [['#ff6ab0', '#ffd6ea'], ['#6fe0d8', '#d6fffb'], ['#ffd34a', '#fff3c8'], ['#a78bfa', '#e6ddff']];
  for (let i = -1; i < 13; i++) {
    const seed = Math.floor((i * 62 + off) / 62);
    const x = i * 62 - (off % 62) + hash(seed * 2.2) * 20;
    const h = 34 + hash(seed * 6.6) * 44;
    const r = 9 + hash(seed * 4.4) * 8;
    propShadow(x, r);
    // stick
    ctx.strokeStyle = '#fffafc'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 - h); ctx.stroke();
    const c = COLS[Math.floor(hash(seed * 8.1) * COLS.length)];
    if (hash(seed * 9.3) > .5) {
      // round lolly with a spiral
      ctx.fillStyle = c[1];
      ctx.beginPath(); ctx.arc(x, y0 - h - r + 2, r, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = c[0]; ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let k = 0; k <= 28; k++) {
        const t = k / 28, a = t * 9 + timeSec * .6, rr = t * (r - 1.6);
        const px = x + Math.cos(a) * rr, py = y0 - h - r + 2 + Math.sin(a) * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    } else {
      // candy cane
      ctx.strokeStyle = c[1]; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y0 - h);
      ctx.quadraticCurveTo(x, y0 - h - 16, x + 12, y0 - h - 10);
      ctx.stroke();
      ctx.strokeStyle = c[0]; ctx.lineWidth = 2.2;
      for (let k = 0; k < 4; k++) {
        const t = k / 4 + .1;
        ctx.beginPath();
        ctx.moveTo(x - 3, y0 - h - t * 16);
        ctx.lineTo(x + 3, y0 - h - t * 16 - 3);
        ctx.stroke();
      }
    }
  }
}

function drawMachinery() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const steel = mixRGB([86, 82, 76], sky('light'), .14 * sky('amb'));
  for (let i = -1; i < 12; i++) {
    const seed = Math.floor((i * 76 + off) / 76);
    const x = i * 76 - (off % 76) + hash(seed * 2.2) * 16;
    const t = hash(seed * 5.5);
    if (t < .4) {                      // a crate
      const w2 = 22 + hash(seed * 3.1) * 16, h2 = 18 + hash(seed * 7.7) * 20;
      propShadow(x + w2 / 2, w2 * .6);
      ctx.fillStyle = rgb(mixRGB([116, 88, 52], sky('light'), .14 * sky('amb')));
      ctx.fillRect(x, y0 - h2, w2, h2);
      ctx.strokeStyle = 'rgba(60,42,20,.6)'; ctx.lineWidth = 1.4;
      ctx.strokeRect(x + .5, y0 - h2 + .5, w2 - 1, h2 - 1);
      ctx.beginPath();
      ctx.moveTo(x, y0 - h2); ctx.lineTo(x + w2, y0);
      ctx.moveTo(x + w2, y0 - h2); ctx.lineTo(x, y0);
      ctx.stroke();
    } else if (t < .74) {              // a roller on a stand
      const r = 9 + hash(seed * 6.6) * 7;
      propShadow(x, r * 1.2);
      ctx.strokeStyle = rgb(mixRGB(steel, [30, 28, 26], .4)); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 - r - 6); ctx.stroke();
      drawGear(x, y0 - r - 8, r, 9, timeSec * 1.4 + seed, rgb(steel), 'rgba(0,0,0,.4)');
    } else {                           // a piston
      const h2 = 22 + hash(seed * 9.1) * 22;
      const push = (Math.sin(timeSec * 2.2 + seed * 2) * .5 + .5) * 9;
      propShadow(x, 9);
      ctx.fillStyle = rgb(mixRGB(steel, [40, 38, 34], .35));
      ctx.fillRect(x - 7, y0 - h2, 14, h2);
      ctx.fillStyle = rgb(mixRGB(steel, [220, 216, 208], .5));
      ctx.fillRect(x - 3, y0 - h2 - 12 - push, 6, 14 + push);
      ctx.fillStyle = rgb(mixRGB(steel, [30, 28, 26], .5));
      ctx.fillRect(x - 9, y0 - h2 - 16 - push, 18, 5);
    }
  }
}

function drawStalagmites() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  for (let i = -1; i < 20; i++) {
    const seed = Math.floor((i * 34 + off) / 34);
    const x = i * 34 - (off % 34) + hash(seed * 2.2) * 12;
    const h = 20 + hash(seed * 6.6) * 56;
    const w = 7 + hash(seed * 4.4) * 9;
    propShadow(x, w);
    const g = ctx.createLinearGradient(x - w, y0 - h, x + w, y0);
    g.addColorStop(0, rgb(mixRGB([140, 132, 152], sky('light'), .16 * sky('amb'))));
    g.addColorStop(1, rgb(mixRGB([44, 38, 52], sky('light'), .05 * sky('amb'))));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w, y0);
    ctx.quadraticCurveTo(x - w * .4, y0 - h * .6, x, y0 - h);
    ctx.quadraticCurveTo(x + w * .4, y0 - h * .6, x + w, y0);
    ctx.closePath(); ctx.fill();
  }
}

function drawSeaweed() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = -1; i < 34; i++) {
    const seed = Math.floor((i * 21 + off) / 21);
    const x = i * 21 - (off % 21) + hash(seed * 2.2) * 9;
    const h = 30 + hash(seed * 6.6) * 62;
    const sway = Math.sin(timeSec * 1.1 + seed * .7) * 9;
    ctx.strokeStyle = rgb(mixRGB([44, 130, 96], sky('light'), .16 * sky('amb')));
    ctx.lineWidth = 3 + hash(seed * 3.3) * 2.6;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.bezierCurveTo(x - sway * .4, y0 - h * .4, x + sway, y0 - h * .7, x + sway * 1.4, y0 - h);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGravestones() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  for (let i = -1; i < 14; i++) {
    const seed = Math.floor((i * 58 + off) / 58);
    const x = i * 58 - (off % 58) + hash(seed * 2.2) * 18;
    const h = 20 + hash(seed * 6.6) * 26;
    const w = 12 + hash(seed * 4.4) * 9;
    const tilt = (hash(seed * 9.1) - .5) * .22;
    propShadow(x, w * .9);
    ctx.save();
    ctx.translate(x, y0); ctx.rotate(tilt);
    const stone = rgb(mixRGB([150, 148, 158], sky('light'), .14 * sky('amb')));
    ctx.fillStyle = stone;
    if (hash(seed * 7.7) > .45) {         // rounded headstone
      ctx.beginPath();
      ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h + w / 2);
      ctx.arc(0, -h + w / 2, w / 2, Math.PI, 0);
      ctx.lineTo(w / 2, 0); ctx.closePath(); ctx.fill();
    } else {                              // cross
      ctx.fillRect(-3, -h, 6, h);
      ctx.fillRect(-w / 2, -h + 7, w, 5.5);
    }
    ctx.globalAlpha = .3;
    ctx.fillStyle = '#2a2634';
    ctx.fillRect(-w / 2 + 3, -h + w / 2 + 2, w - 6, 1.6);
    ctx.fillRect(-w / 2 + 3, -h + w / 2 + 7, w - 8, 1.6);
    ctx.restore();
  }
}

function drawAutumnTrees() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const COLS = [[214, 108, 34], [186, 62, 30], [232, 168, 48], [154, 104, 30]];
  for (let i = -1; i < 14; i++) {
    const seed = Math.floor((i * 56 + off) / 56);
    const x = i * 56 - (off % 56) + hash(seed * 2.2) * 18;
    const h = 34 + hash(seed * 6.6) * 44;
    const r = 15 + hash(seed * 4.4) * 13;
    propShadow(x, r * .8);
    ctx.strokeStyle = rgb(mixRGB([84, 58, 34], sky('light'), .14 * sky('amb')));
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 - h); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y0 - h * .6); ctx.lineTo(x - r * .5, y0 - h * .85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y0 - h * .7); ctx.lineTo(x + r * .5, y0 - h * .92); ctx.stroke();
    const base = COLS[Math.floor(hash(seed * 8.1) * COLS.length)];
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * 6.2832 + seed;
      const cx2 = x + Math.cos(a) * r * .5, cy2 = y0 - h - 4 + Math.sin(a) * r * .35;
      ctx.fillStyle = rgb(mixRGB(mixRGB(base, [255, 210, 120], hash(seed + k) * .5),
                                 sky('light'), .14 * sky('amb')));
      ctx.beginPath(); ctx.arc(cx2, cy2, r * .62, 0, 6.2832); ctx.fill();
    }
  }
}

function drawSignage() {
  const off = scroll * .34, y0 = GROUND_Y + 4;
  const NEON = ['#31f0ff', '#ff3bb0', '#ffd23b', '#7b5bff'];
  ctx.save();
  for (let i = -1; i < 18; i++) {
    const seed = Math.floor((i * 40 + off) / 40);
    const x = i * 40 - (off % 40) + hash(seed * 2.2) * 8;
    const h = 12 + hash(seed * 6.6) * 30;
    const w = 16 + hash(seed * 4.4) * 14;
    propShadow(x + w / 2, w * .7);
    ctx.fillStyle = rgb(mixRGB([14, 16, 28], sky('light'), .10 * sky('amb')));
    ctx.fillRect(x, y0 - h, w, h + 4);
    const col = NEON[Math.floor(hash(seed * 8.1) * NEON.length)];
    ctx.save();
    ctx.globalAlpha = .55 + .45 * Math.sin(timeSec * 1.8 + seed * 2);
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    ctx.shadowColor = col; ctx.shadowBlur = 9;
    if (hash(seed * 5.9) > .5) {
      ctx.strokeRect(x + 3, y0 - h + 4, w - 6, Math.max(4, h - 12));
    } else {
      for (let k = 0; k < 3; k++) {
        const ly = y0 - h + 6 + k * 6;
        if (ly > y0 - 4) break;
        ctx.beginPath(); ctx.moveTo(x + 3, ly); ctx.lineTo(x + w - 4, ly); ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.restore();
}

// a funnel grinding along the horizon during TORNADO runs
function drawTornadoFunnel() {
  const cx = W * .78 + Math.sin(timeSec * .35) * 60;
  const topY = -10, botY = GROUND_Y + 6;
  const STEPS = 40;
  const wobAt = t => Math.sin(timeSec * 1.25 + t * 5.2) * (30 * (1 - t) * (1 - t));
  const halfAt = t => lerp(120, 15, Math.pow(t, .62)) * (1 + Math.sin(timeSec * 2 + t * 6) * .05);

  ctx.save();

  // solid body
  ctx.beginPath();
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS, y = lerp(topY, botY, t);
    const x = cx + wobAt(t) - halfAt(t);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let i = STEPS; i >= 0; i--) {
    const t = i / STEPS, y = lerp(topY, botY, t);
    ctx.lineTo(cx + wobAt(t) + halfAt(t), y);
  }
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, topY, 0, botY);
  const hazy = mixRGB(sky('mid'), [58, 54, 62], .45);
  const dark = mixRGB(sky('mid'), [34, 30, 38], .75);
  bg.addColorStop(0, rgba(hazy, .30));
  bg.addColorStop(.55, rgba(dark, .52));
  bg.addColorStop(1, rgba(dark, .70));
  ctx.fillStyle = bg;
  ctx.fill();

  // everything else stays inside the funnel
  ctx.save();
  ctx.clip();

  // darker core
  ctx.globalAlpha = .35;
  const core = ctx.createLinearGradient(cx - 60, 0, cx + 60, 0);
  core.addColorStop(0, 'rgba(0,0,0,0)');
  core.addColorStop(.5, 'rgba(10,8,12,.85)');
  core.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = core;
  ctx.fillRect(cx - 130, topY, 260, botY - topY);

  // banding spiralling down
  ctx.globalAlpha = .40;
  ctx.strokeStyle = 'rgba(232,232,240,.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 16; i++) {
    const t = ((timeSec * .42 + i / 16) % 1);
    const y = lerp(topY, botY, t);
    const hw = halfAt(t);
    ctx.beginPath();
    ctx.ellipse(cx + wobAt(t), y, hw * .96, Math.max(2, hw * .20), 0, 0, 6.2832);
    ctx.stroke();
  }

  // debris caught in the spin
  ctx.globalAlpha = .75;
  for (let i = 0; i < 34; i++) {
    const t = ((timeSec * .55 + i * .137) % 1);
    const a = timeSec * 4.2 + i * 1.3;
    const hw = halfAt(t);
    const y = lerp(topY, botY, t);
    const x = cx + wobAt(t) + Math.cos(a) * hw * .85;
    ctx.fillStyle = i % 3 ? 'rgba(126,108,88,.9)' : 'rgba(178,166,144,.9)';
    ctx.beginPath();
    ctx.ellipse(x, y, 2.6, 1.3, a, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();

  // dust skirt where it touches down
  ctx.globalAlpha = .38;
  const sg = ctx.createRadialGradient(cx + wobAt(1), botY, 2, cx + wobAt(1), botY, 90);
  sg.addColorStop(0, 'rgba(150,136,114,.85)');
  sg.addColorStop(1, 'rgba(150,136,114,0)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.ellipse(cx + wobAt(1), botY, 90, 26, 0, 0, 6.2832);
  ctx.fill();

  ctx.restore();
}

// ---- dispatchers -----------------------------------------------------
function drawFarLayer() {
  const f = MAP.far;
  if (f === 'mountains') drawMountains(false);
  else if (f === 'peaks') drawMountains(true);
  else if (f === 'mesas') drawMesas();
  else if (f === 'volcanoes') drawVolcanoes();
  else if (f === 'ocean') drawOcean();
  else if (f === 'craters') drawCraters();
  else if (f === 'lavalake') drawLavaLake();
  else if (f === 'cavewall') drawCaveWall();
  else if (f === 'reef') drawReefFar();
  else if (f === 'cloudsea') drawCloudSea();
}
function drawMidLayer() {
  const m = MAP.mid;
  if (m === 'city') drawCity();
  else if (m === 'neoncity') drawNeonCity();
  else if (m === 'factory') drawFactoryBack();
}
function drawNearLayer() {
  if (mode === 'tornado') drawTornadoFunnel();
  const n = MAP.near;
  if (n === 'conifers') drawConifers(false);
  else if (n === 'frostpines') drawConifers(true);
  else if (n === 'cacti') drawCacti();
  else if (n === 'deadtrees') drawDeadTrees();
  else if (n === 'signage') drawSignage();
  else if (n === 'palms') drawPalms();
  else if (n === 'ferns') drawFerns();
  else if (n === 'rocks') drawRocks();
  else if (n === 'reeds') drawReeds();
  else if (n === 'lollipops') drawLollipops();
  else if (n === 'machinery') drawMachinery();
  else if (n === 'stalagmites') drawStalagmites();
  else if (n === 'seaweed') drawSeaweed();
  else if (n === 'gravestones') drawGravestones();
  else if (n === 'autumntrees') drawAutumnTrees();
}

function drawClouds() {
  const ca = MAP.air.clouds;
  if (!ca) return;
  for (const c of clouds) {
    const x = c.x, y = c.y;
    if (x < -260 || x > W + 260) continue;
    ctx.save();
    ctx.translate(x, y); ctx.scale(c.scale, c.scale);
    const amb = sky('amb');
    const top = mixRGB(MAP.cloudTint || [255, 255, 255], sky('light'), .35);
