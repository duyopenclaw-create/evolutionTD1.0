<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIGGED — Ravenscourt Pier Midway</title>
<style>
  :root{
    --amber:#ffb545; --amber2:#ff8a1e; --red:#e0332c; --deep:#08060b;
    --ink:#f2e6d0; --dim:#9a8d78; --green:#5fe08a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    font-family:"Rockwell","Bookman Old Style","Palatino Linotype",Georgia,serif;
    color:var(--ink); user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;image-rendering:auto;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  .panel{position:absolute;pointer-events:auto}

  /* ---- top bar ---- */
  #bar{top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;
    background:linear-gradient(180deg,rgba(10,7,14,.92),rgba(10,7,14,.58) 70%,rgba(10,7,14,0));
    font-size:14px;letter-spacing:.06em}
  .stat{display:flex;align-items:center;gap:7px;text-shadow:0 2px 6px #000}
  .stat b{font-size:18px;color:var(--amber);font-weight:900;letter-spacing:.02em}
  .chip{padding:3px 9px;border:1px solid rgba(255,181,69,.35);border-radius:3px;
    background:rgba(255,181,69,.07);font-size:11px;letter-spacing:.14em;color:#e8d8b6}
  #bar .sp{flex:1}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,181,69,.4);
    background:linear-gradient(180deg,rgba(60,38,18,.85),rgba(26,16,10,.9));
    color:var(--ink);padding:6px 13px;border-radius:3px;font-family:inherit;font-size:12px;
    letter-spacing:.13em;text-transform:uppercase;transition:.13s;text-shadow:0 1px 3px #000}
  .btn:hover{background:linear-gradient(180deg,rgba(120,72,26,.95),rgba(50,28,12,.95));
    border-color:var(--amber);color:#fff;box-shadow:0 0 16px rgba(255,138,30,.35)}
  .btn:active{transform:translateY(1px)}
  .btn.hot{border-color:var(--amber);box-shadow:0 0 12px rgba(255,138,30,.4)}

  /* ---- notebook ---- */
  #note{right:0;top:46px;bottom:0;width:338px;transform:translateX(352px);
    transition:transform .34s cubic-bezier(.3,.9,.3,1);
    background:linear-gradient(180deg,#171009,#0e0a06);border-left:1px solid rgba(255,181,69,.28);
    box-shadow:-18px 0 50px rgba(0,0,0,.75);display:flex;flex-direction:column}
  #note.open{transform:translateX(0)}
  #note h3{margin:0;padding:13px 16px 9px;font-size:13px;letter-spacing:.24em;color:var(--amber);
    border-bottom:1px solid rgba(255,181,69,.2);text-transform:uppercase}
  #noteList{flex:1;overflow-y:auto;padding:10px 15px 24px;font-size:12.5px;line-height:1.55}
  #noteList .ng{margin:12px 0 5px;color:var(--amber2);font-size:11px;letter-spacing:.17em;
    text-transform:uppercase;border-bottom:1px dashed rgba(255,181,69,.2);padding-bottom:3px}
  #noteList .ni{color:#cfc0a4;margin:5px 0;padding-left:13px;position:relative}
  #noteList .ni:before{content:"·";position:absolute;left:3px;color:var(--amber2)}
  #noteList .ni.new{color:#fff8e6;animation:ipop .8s ease}
  @keyframes ipop{0%{background:rgba(255,181,69,.3)}100%{background:transparent}}
  #noteList::-webkit-scrollbar{width:7px}
  #noteList::-webkit-scrollbar-thumb{background:rgba(255,181,69,.3);border-radius:4px}
  .empty{color:#6d6152;font-style:italic;padding-top:8px}

  /* ---- settings ---- */
  #opt{right:0;top:46px;bottom:0;width:340px;transform:translateX(356px);overflow-y:auto;
    transition:transform .34s cubic-bezier(.3,.9,.3,1);
    background:linear-gradient(180deg,#171009,#0e0a06);border-left:1px solid rgba(255,181,69,.28);
    box-shadow:-18px 0 50px rgba(0,0,0,.75);padding-bottom:26px}
  #opt.open{transform:translateX(0)}
  #opt h3{margin:0;padding:13px 16px 9px;font-size:13px;letter-spacing:.24em;color:var(--amber);
    border-bottom:1px solid rgba(255,181,69,.2);text-transform:uppercase}
  #opt .oh{padding:14px 16px 4px;font-size:10.5px;letter-spacing:.24em;color:var(--amber2);text-transform:uppercase}
  #opt .og{padding:8px 16px}
  .orow{display:flex;align-items:center;gap:10px;margin:9px 0}
  .orow label{flex:0 0 74px;font-size:12px;color:#cfc0a4;letter-spacing:.06em}
  .orow .ov{flex:0 0 34px;text-align:right;font:600 11px monospace;color:var(--amber)}
  .orow input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--amber2),rgba(255,181,69,.2));outline:none}
  .orow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#ffe4b0;border:1px solid #7a4614;cursor:pointer;
    box-shadow:0 0 8px rgba(255,138,30,.6)}
  .otog{display:flex;gap:8px;margin:10px 0}
  .otog .btn{flex:1;padding:7px 4px;font-size:10.5px;letter-spacing:.08em}
  .btn.tog.off{opacity:.45;border-color:rgba(160,150,130,.3)}
  .btn.danger{border-color:rgba(224,51,44,.55);color:#ffb3af}
  .btn.danger:hover{background:linear-gradient(180deg,rgba(120,30,26,.95),rgba(50,14,12,.95));
    border-color:var(--red);box-shadow:0 0 16px rgba(224,51,44,.35)}
  .ostat{font-size:11.5px;line-height:1.7;color:#a99a80}
  .ostat b{color:#e8d8b6;font-weight:600}

  /* ---- barker speech ---- */
  #say{left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;
    max-width:min(760px,86vw);padding:13px 22px;border-radius:4px;transition:.3s;
    background:linear-gradient(180deg,rgba(24,12,6,.95),rgba(10,6,4,.97));
    border:1px solid rgba(255,181,69,.4);box-shadow:0 12px 44px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,181,69,.16);
    font-size:15.5px;line-height:1.5;text-align:center}
  #say.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #say .who{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--amber2);
    margin-bottom:6px;text-transform:uppercase}

  /* ---- on-screen arrows (touch) ---- */
  #dpad{right:16px;bottom:16px;width:186px;height:132px;pointer-events:none;z-index:6;
    touch-action:none;-webkit-user-select:none;user-select:none}
  #dpad .dk{position:absolute;pointer-events:auto;touch-action:none;cursor:pointer;
    width:58px;height:58px;border-radius:50%;font-size:19px;line-height:1;
    color:rgba(255,228,176,.85);background:rgba(18,12,8,.34);
    border:1.5px solid rgba(255,181,69,.45);
    box-shadow:0 0 14px rgba(255,138,30,.18), inset 0 1px 0 rgba(255,220,160,.18);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    transition:background .1s,transform .1s,box-shadow .1s,color .1s;
    text-shadow:0 0 10px rgba(255,170,70,.7)}
  #dpad .dk.up{left:64px;top:0}
  #dpad .dk.left{left:0;top:66px}
  #dpad .dk.right{left:128px;top:66px}
  #dpad .dk.on{background:rgba(120,70,20,.72);color:#fff6e2;transform:scale(.93);
    border-color:#ffb545;box-shadow:0 0 22px rgba(255,138,30,.55)}
  @media (max-width:760px){ #dpad{width:162px;height:118px;right:10px;bottom:10px}
    #dpad .dk{width:52px;height:52px;font-size:17px}
    #dpad .dk.up{left:55px} #dpad .dk.right{left:110px} #dpad .dk.left{top:60px} #dpad .dk.right{top:60px} }

  /* ---- unlock banner ---- */
  #unlock{left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;z-index:8}
  #ubar{pointer-events:auto;cursor:pointer;margin-top:54px;
    min-width:min(620px,84vw);max-width:min(760px,90vw);
    padding:13px 30px 14px;text-align:center;border-radius:4px;
    background:linear-gradient(180deg,rgba(46,26,8,.97),rgba(16,10,5,.97));
    border:1.5px solid var(--amber);
    box-shadow:0 14px 48px rgba(0,0,0,.8),0 0 40px rgba(255,138,30,.35),
      inset 0 1px 0 rgba(255,220,160,.25);
    opacity:0;transform:translateY(-26px) scale(.97);
    transition:opacity .35s ease,transform .35s cubic-bezier(.2,1.3,.4,1)}
  #unlock.on #ubar{opacity:1;transform:none;animation:ubGlow 2.4s ease-in-out infinite}
  @keyframes ubGlow{0%,100%{box-shadow:0 14px 48px rgba(0,0,0,.8),0 0 30px rgba(255,138,30,.28),inset 0 1px 0 rgba(255,220,160,.25)}
    50%{box-shadow:0 14px 48px rgba(0,0,0,.8),0 0 56px rgba(255,138,30,.6),inset 0 1px 0 rgba(255,220,160,.35)}}
  #ubar .ubk{display:block;font-size:10px;letter-spacing:.42em;color:var(--amber2);
    text-transform:uppercase;margin-bottom:5px}
  #ubar b{display:block;font-size:26px;letter-spacing:.08em;color:#fff3cf;font-weight:900;
    text-transform:uppercase;text-shadow:0 0 26px rgba(255,138,30,.75);line-height:1.15}
  #ubar span#ubS{display:block;margin-top:6px;font-size:13px;letter-spacing:.05em;
    color:#e0cda8;font-style:italic}
  @media (max-width:760px){ #ubar{padding:10px 18px 11px;margin-top:50px}
    #ubar b{font-size:19px} #ubar span#ubS{font-size:11.5px} }

  /* ---- toast / saved ---- */
  #toast{left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;
    gap:7px;align-items:center;pointer-events:none}
  .tst{padding:8px 18px;border-radius:3px;font-size:13px;letter-spacing:.1em;
    background:rgba(12,8,5,.93);border:1px solid rgba(255,181,69,.45);
    box-shadow:0 6px 24px rgba(0,0,0,.7);animation:tin .35s ease}
  .tst.good{border-color:rgba(95,224,138,.6);color:#c8ffd9}
  .tst.bad{border-color:rgba(224,51,44,.6);color:#ffc9c6}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  #needAudio{left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;
    color:#ffd9a0;background:rgba(12,8,5,.8);border:1px solid rgba(255,181,69,.35);
    padding:6px 14px;border-radius:20px;pointer-events:none;animation:pulseA 2.4s infinite}
  @keyframes pulseA{0%,100%{opacity:.55}50%{opacity:1}}
  #saved{right:14px;bottom:12px;font-size:10.5px;letter-spacing:.3em;color:var(--green);
    opacity:0;transition:opacity .25s;text-shadow:0 0 12px rgba(95,224,138,.7)}
  #saved.on{opacity:1}

  /* ---- big modal ---- */
  #modal{inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(20,10,4,.72),rgba(0,0,0,.94));z-index:9}
  #modal.on{display:flex}
  #mbox{width:min(600px,88vw);padding:30px 34px;text-align:center;border-radius:5px;
    background:linear-gradient(180deg,#1d1208,#0b0705);border:1px solid rgba(255,181,69,.5);
    box-shadow:0 30px 90px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,181,69,.2);animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes mpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  #mbox h2{margin:0 0 4px;font-size:30px;letter-spacing:.1em;color:var(--amber);
    text-transform:uppercase;text-shadow:0 0 30px rgba(255,138,30,.6)}
  #mbox .sub{font-size:12px;letter-spacing:.28em;color:var(--dim);margin-bottom:16px;text-transform:uppercase}
  #mbox p{font-size:15px;line-height:1.6;color:#ded0b4;margin:10px 0}
  #mbox .row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  #hint{left:50%;top:52px;transform:translateX(-50%);font-size:11.5px;letter-spacing:.18em;
    color:#b3a88f;text-shadow:0 2px 8px #000;text-transform:uppercase;opacity:.9}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;z-index:20;opacity:1;transition:opacity .45s}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ui">
  <div id="bar" class="panel hidden">
    <div class="stat"><span class="chip">Tickets</span><b id="tk">0</b></div>
    <div class="stat"><span class="chip" id="pzl">Prizes</span><b id="pz">0/6</b></div>
    <div class="stat" id="debtS" style="display:none"><span class="chip" style="border-color:rgba(224,51,44,.5);color:#ffb3af">Owed</span><b id="db" style="color:#ff6b63">0</b></div>
    <div class="sp"></div>
    <button class="btn" id="bNote">Notebook</button>
    <button class="btn" id="bView">View: Normal</button>
    <button class="btn" id="bOpt">⚙ Settings</button>
    <button class="btn hidden" id="bBack">◀ Midway</button>
  </div>
  <div id="note" class="panel">
    <h3>Field Notebook</h3>
    <div id="noteList"><div class="empty">Nothing worth writing down. Yet.</div></div>
  </div>
  <div id="opt" class="panel">
    <h3>Settings</h3>
    <div class="og">
      <div class="orow"><label>Master</label><input type="range" id="oMaster" min="0" max="100"><span class="ov" id="vMaster"></span></div>
      <div class="orow"><label>Music</label><input type="range" id="oMusic" min="0" max="100"><span class="ov" id="vMusic"></span></div>
      <div class="orow"><label>Effects</label><input type="range" id="oSfx" min="0" max="100"><span class="ov" id="vSfx"></span></div>
      <div class="orow"><label>Ambience</label><input type="range" id="oAmb" min="0" max="100"><span class="ov" id="vAmb"></span></div>
    </div>
    <div class="oh">Picture</div>
    <div class="og">
      <div class="orow"><label>Bloom</label><input type="range" id="oBloom" min="0" max="100"><span class="ov" id="vBloom"></span></div>
      <div class="orow"><label>Rain</label><input type="range" id="oRain" min="0" max="100"><span class="ov" id="vRain"></span></div>
      <div class="otog"><button class="btn tog" id="oGrain">Film grain</button><button class="btn tog" id="oShake">Screen shake</button></div>
      <div class="otog"><button class="btn tog" id="oHints">Control hints</button><button class="btn tog" id="oFull">Fullscreen</button></div>
      <div class="otog"><button class="btn tog" id="oDpad">On-screen arrows</button><button class="btn" id="oView">Camera</button></div>
    </div>
    <div class="oh">Game</div>
    <div class="og">
      <div class="ostat" id="oStat"></div>
      <div class="otog"><button class="btn" id="oSave">Save now</button><button class="btn danger" id="oWipe">Erase progress</button></div>
    </div>
    <button class="btn" id="oClose" style="margin-top:14px;width:100%">Close</button>
  </div>
  <div id="say" class="panel"><span class="who">The Barker</span><span id="sayT"></span></div>
  <div id="unlock" class="panel"><div id="ubar">
    <span class="ubk" id="ubk">Unlocked</span>
    <b id="ubT"></b><span id="ubS"></span>
  </div></div>
  <div id="toast" class="panel"></div>
  <div id="dpad" class="panel hidden">
    <button class="dk up"    data-k="action" aria-label="Enter">▲</button>
    <button class="dk left"  data-k="arrowleft"  aria-label="Left">◀</button>
    <button class="dk right" data-k="arrowright" aria-label="Right">▶</button>
  </div>
  <div id="saved" class="panel">SAVED</div>
  <div id="needAudio" class="panel hidden">♪  click anywhere to start the music</div>
  <div id="hint" class="panel"></div>
  <div id="modal" class="panel"><div id="mbox">
    <h2 id="mTitle">Title</h2><div class="sub" id="mSub"></div>
    <div id="mBody"></div><div class="row" id="mRow"></div>
  </div></div>
</div>
<div id="fade"></div>
<script>
"use strict";
/* ================================================================
   RIGGED — Ravenscourt Pier Midway
   Six carnival booths. Every one of them cheats.
   ================================================================ */
const VW = 1280, VH = 720;
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>(v-a)/(b-a||1);
const smooth=t=>t*t*(3-2*t);
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const rint=(a,b)=>Math.floor(rnd(b+1,a));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(x,y,X,Y)=>Math.hypot(X-x,Y-y);
const sgn=v=>v<0?-1:1;
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
function shuf(a){for(let i=a.length-1;i>0;i--){const j=rint(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
// deterministic hash noise
function h1(n){n=(n<<13)^n;return 1-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824;}
function fbm(x,s=1){let v=0,a=.5,f=s;for(let i=0;i<4;i++){v+=a*Math.sin(x*f+i*2.3)*Math.cos(x*f*.61+i);f*=2.02;a*=.5;}return v;}

/* ================================================================
   AUDIO — procedural calliope, fairground percussion, foley SFX
   ================================================================ */
const A = (()=>{
  let ctx=null, ok=false, on=true;
  let master, comp, dry, wet, conv, sfxB, musB, ambB;
  let rainG=null, windG=null, crowdG=null;
  const now=()=>ctx?ctx.currentTime:0;

  function makeIR(sec,decay,bright){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;
      for(let i=0;i<n;i++){const t=i/n;let v=(Math.random()*2-1)*Math.pow(1-t,decay);
        lp+=(v-lp)*bright; d[i]=lp*(1+.3*Math.sin(i*.0007+c));}}
    return b;
  }
  function init(){
    if(ok) return; 
    try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    master=ctx.createGain(); master.gain.value=on?.85:0;
    comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-15; comp.knee.value=26; comp.ratio.value=3.4;
    comp.attack.value=.006; comp.release.value=.24;
    conv=ctx.createConvolver(); conv.buffer=makeIR(2.6,2.4,.35);
    wet=ctx.createGain(); wet.gain.value=.3;
    dry=ctx.createGain(); dry.gain.value=1;
    sfxB=ctx.createGain(); sfxB.gain.value=.9;
    musB=ctx.createGain(); musB.gain.value=.52;
    ambB=ctx.createGain(); ambB.gain.value=.5;
    sfxB.connect(dry); musB.connect(dry); ambB.connect(dry);
    sfxB.connect(conv); musB.connect(conv); ambB.connect(conv);
    conv.connect(wet);
    dry.connect(comp); wet.connect(comp); comp.connect(master); master.connect(ctx.destination);
    ok=true; startAmb(); Mus.boot();
  }
  function resume(){ if(!ok) init(); if(ctx&&ctx.state==="suspended") ctx.resume(); }
  function setOn(v){ on=v; if(master) master.gain.setTargetAtTime(v?.85:0, now(), .04); }

  // ---------- primitives ----------
  function noiseBuf(sec){
    const n=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }
  let _pink=null;
  function pink(){ if(_pink) return _pink;
    const n=ctx.sampleRate*4, b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.96900*b2+w*.1538520;
      b3=.86650*b3+w*.3104856; b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.09; b6=w*.115926;}
    _pink=b; return b;
  }
  function env(g,t,a,d,pk=1,sus=0,rel=.08,hold=0){
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(pk,.0002),t+a);
    if(sus>0){ g.gain.exponentialRampToValueAtTime(Math.max(sus,.0002),t+a+d);
      g.gain.setValueAtTime(Math.max(sus,.0002),t+a+d+hold);
      g.gain.exponentialRampToValueAtTime(.0001,t+a+d+hold+rel); }
    else g.gain.exponentialRampToValueAtTime(.0001,t+a+d);
  }
  function tone(o){ // {f,type,dur,g,bus,atk,pan,bend,det,fil,q}
    if(!ok) return;
    const t=o.t||now(), dur=o.dur||.2;
    const os=ctx.createOscillator(); os.type=o.type||"sine";
    os.frequency.setValueAtTime(o.f,t);
    if(o.bend) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.bend),t+(o.bt||dur));
    if(o.det) os.detune.value=o.det;
    const g=ctx.createGain(); env(g,t,o.atk||.004,dur,o.g||.2,o.sus||0,o.rel||.09,o.hold||0);
    let node=os;
    if(o.fil){ const f=ctx.createBiquadFilter(); f.type=o.ft||"lowpass"; f.frequency.setValueAtTime(o.fil,t);
      if(o.fil2) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.fil2),t+dur);
      f.Q.value=o.q||1; node.connect(f); node=f; }
    node.connect(g);
    let out=g;
    if(o.pan!==undefined&&ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=clamp(o.pan,-1,1); g.connect(p); out=p; }
    out.connect(o.bus||sfxB);
    os.start(t); os.stop(t+dur+(o.sus>0?(o.hold||0)+(o.rel||.09):0)+.05);
    return os;
  }
  function noise(o){ // {dur,g,fil,ft,q,bus,pan,fil2}
    if(!ok) return;
    const t=o.t||now(), dur=o.dur||.15;
    const s=ctx.createBufferSource(); s.buffer=o.pink?pink():noiseBuf(Math.max(dur,.05)); s.loop=!!o.pink;
    const f=ctx.createBiquadFilter(); f.type=o.ft||"bandpass";
    f.frequency.setValueAtTime(o.fil||1200,t);
    if(o.fil2) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.fil2),t+dur);
    f.Q.value=o.q||1;
    const g=ctx.createGain(); env(g,t,o.atk||.002,dur,o.g||.2,o.sus||0,o.rel||.08,o.hold||0);
    s.connect(f); f.connect(g);
    let out=g;
    if(o.pan!==undefined&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);g.connect(p);out=p;}
    out.connect(o.bus||sfxB);
    s.start(t); s.stop(t+dur+.25);
    return s;
  }
  const mtof=m=>440*Math.pow(2,(m-69)/12);

  // ---------- ambience ----------
  function startAmb(){
    // rain on canvas
    const r=ctx.createBufferSource(); r.buffer=pink(); r.loop=true;
    const rf=ctx.createBiquadFilter(); rf.type="highpass"; rf.frequency.value=1100;
    const rf2=ctx.createBiquadFilter(); rf2.type="lowpass"; rf2.frequency.value=6200;
    rainG=ctx.createGain(); rainG.gain.value=.16;
    r.connect(rf); rf.connect(rf2); rf2.connect(rainG); rainG.connect(ambB); r.start();
    // wind
    const w=ctx.createBufferSource(); w.buffer=pink(); w.loop=true;
    const wf=ctx.createBiquadFilter(); wf.type="bandpass"; wf.frequency.value=260; wf.Q.value=.7;
    windG=ctx.createGain(); windG.gain.value=.1;
    const lfo=ctx.createOscillator(); lfo.frequency.value=.07;
    const lg=ctx.createGain(); lg.gain.value=.07; lfo.connect(lg); lg.connect(windG.gain); lfo.start();
    w.connect(wf); wf.connect(windG); windG.connect(ambB); w.start();
    // crowd murmur
    const c=ctx.createBufferSource(); c.buffer=pink(); c.loop=true;
    const cf=ctx.createBiquadFilter(); cf.type="bandpass"; cf.frequency.value=520; cf.Q.value=1.1;
    crowdG=ctx.createGain(); crowdG.gain.value=.07;
    const cl=ctx.createOscillator(); cl.frequency.value=.23;
    const clg=ctx.createGain(); clg.gain.value=.045; cl.connect(clg); clg.connect(crowdG.gain); cl.start();
    c.connect(cf); cf.connect(crowdG); crowdG.connect(ambB); c.start();
  }
  function amb(rain,wind,crowd){ if(!ok)return; const t=now();
    rainG.gain.setTargetAtTime(rain,t,.7); windG.gain.setTargetAtTime(wind,t,.7); crowdG.gain.setTargetAtTime(crowd,t,.9); }

  // ---------- continuous hum (motors, magnets) ----------
  function hum(f,g=.05,type="sawtooth",fil=340){
    if(!ok) return {set(){},stop(){},gain(){}};
    const o=ctx.createOscillator(); o.type=type; o.frequency.value=f;
    const o2=ctx.createOscillator(); o2.type="sine"; o2.frequency.value=f*2.01;
    const gg=ctx.createGain(); gg.gain.value=0;
    const f1=ctx.createBiquadFilter(); f1.type="lowpass"; f1.frequency.value=fil; f1.Q.value=2.2;
    const g2=ctx.createGain(); g2.gain.value=.3;
    o.connect(f1); o2.connect(g2); g2.connect(f1); f1.connect(gg); gg.connect(sfxB);
    o.start(); o2.start(); gg.gain.setTargetAtTime(g,now(),.08);
    return {
      set(F){ o.frequency.setTargetAtTime(F,now(),.06); o2.frequency.setTargetAtTime(F*2.01,now(),.06); },
      gain(G){ gg.gain.setTargetAtTime(G,now(),.06); },
      stop(){ gg.gain.setTargetAtTime(0,now(),.09); setTimeout(()=>{try{o.stop();o2.stop();}catch(e){}},500); }
    };
  }

  /* ---------------- MUSIC ---------------- */
  const CHORDS=[[69,72,76],[69,72,76],[69,74,77],[68,71,76],[69,72,76],[69,72,77],[68,71,76],[69,72,76]];
  const BASSR =[45,45,50,52,45,53,52,45];
  // melody: {b: absolute beat in 24-beat loop, m: midi, d: beats}
  const MEL=[
    {b:0,m:76,d:1},{b:1,m:72,d:1},{b:2,m:69,d:1},
    {b:3,m:71,d:1},{b:4,m:72,d:1},{b:5,m:76,d:1},
    {b:6,m:77,d:1.5},{b:7.5,m:74,d:.5},{b:8,m:69,d:1},
    {b:9,m:80,d:1},{b:10,m:76,d:1},{b:11,m:71,d:1},
    {b:12,m:81,d:1},{b:13,m:80,d:1},{b:14,m:76,d:1},
    {b:15,m:77,d:1},{b:16,m:81,d:1},{b:17,m:84,d:1},
    {b:18,m:83,d:1.5},{b:19.5,m:80,d:.5},{b:20,m:76,d:1},
    {b:21,m:69,d:2}
  ];
  const MOODS={
    title:   {bpm:92, lead:"bell",     drums:.0, bass:.5, chord:.5, mel:.55, wob:14, oct:0},
    midway:  {bpm:126,lead:"calliope", drums:.7, bass:.9, chord:.7, mel:.7,  wob:11, oct:0},
    claw:    {bpm:104,lead:"bell",     drums:.25,bass:.55,chord:.6, mel:.6,  wob:7,  oct:12},
    hoops:   {bpm:142,lead:"calliope", drums:.95,bass:.85,chord:.55,mel:.62, wob:8,  oct:0},
    bottles: {bpm:120,lead:"brass",    drums:.85,bass:1.1,chord:.6, mel:.6,  wob:9,  oct:-12},
    darts:   {bpm:152,lead:"calliope", drums:.8, bass:.8, chord:.5, mel:.6,  wob:13, oct:0},
    striker: {bpm:116,lead:"brass",    drums:1.0,bass:1.1,chord:.65,mel:.6,  wob:6,  oct:0},
    wheel:   {bpm:134,lead:"organ",    drums:.6, bass:.85,chord:.95,mel:.55, wob:16, oct:0},
    prizes:  {bpm:100,lead:"bell",     drums:.2, bass:.5, chord:.6, mel:.5,  wob:5,  oct:12},
    end:     {bpm:88, lead:"organ",    drums:.15,bass:.6, chord:.8, mel:.6,  wob:3,  oct:0}
  };
  const Mus={
    beat:0, t0:0, timer:null, mood:MOODS.midway, name:"midway", vol:1, playing:false,
    boot(){ if(this.timer) return; this.t0=now()+.15; this.beat=0; this.playing=true;
      this.timer=setInterval(()=>this.tick(),25); },
    set(n){ if(n===this.name) return; this.name=n; this.mood=MOODS[n]||MOODS.midway;
      if(musB) musB.gain.setTargetAtTime(.52,now(),.4); },
    duck(v){ if(musB) musB.gain.setTargetAtTime(v,now(),.15); },
    spb(){ return 60/this.mood.bpm; },
    tick(){
      if(!ok||!this.playing) return;
      const lim=now()+.2;
      let guard=0;
      while(this.t0<lim && guard++<40){ this.step(this.beat,this.t0); this.beat++; this.t0+=this.spb(); }
    },
    step(b,t){
      const M=this.mood, loop=b%24, bar=Math.floor(loop/3), inbar=loop%3;
      const ch=CHORDS[bar], root=BASSR[bar];
      const drift=M.wob*Math.sin(b*.21)+M.wob*.5*Math.sin(b*.77+1.3);
      // --- bass (oompah) ---
      if(M.bass>0){
        if(inbar===0) tone({t,f:mtof(root),type:"triangle",dur:.34,g:.24*M.bass,fil:340,bus:musB,atk:.008});
        else tone({t,f:mtof(root+12),type:"triangle",dur:.16,g:.09*M.bass,fil:520,bus:musB,atk:.006});
      }
      // --- chord stabs on 2 & 3 ---
      if(M.chord>0 && inbar>0){
        ch.forEach((m,i)=>tone({t:t+i*.006,f:mtof(m),type:"square",dur:.2,g:.045*M.chord,
          fil:1500,ft:"lowpass",q:.9,bus:musB,atk:.007,det:drift*(i?-1:1),pan:(i-1)*.35}));
      }
      if(this.name==="wheel"&&inbar===0){ // tremolo organ pad
        ch.forEach(m=>tone({t,f:mtof(m-12),type:"sine",dur:this.spb()*2.6,g:.05,bus:musB,atk:.12,sus:.03,hold:.2,rel:.4}));
      }
      // --- drums ---
      const D=M.drums;
      if(D>0){
        if(inbar===0){ tone({t,f:120,bend:44,bt:.11,type:"sine",dur:.2,g:.5*D,bus:musB,atk:.003});
          noise({t,dur:.05,g:.13*D,fil:2400,ft:"highpass",bus:musB}); }
        else { noise({t,dur:.12,g:.16*D,fil:1700,ft:"bandpass",q:.8,bus:musB,pan:inbar===1?-.3:.3}); }
        if(D>.6){ noise({t:t+this.spb()*.5,dur:.035,g:.05*D,fil:7600,ft:"highpass",bus:musB,pan:.2}); }
      }
      // --- melody ---
      if(M.mel>0){
        for(const n of MEL){ if(Math.abs(n.b-loop)<1e-6) this.lead(n.m+M.oct,n.d*this.spb(),M,drift,t); }
        // occasional grace note
        if(M.lead!=="organ" && loop%6===5 && Math.random()<.3)
          this.lead(ch[2]+M.oct+12,this.spb()*.28,M,drift,t+this.spb()*.5,.45);
      }
    },
    lead(m,dur,M,drift,t,sc=1){
      const f=mtof(m), v=M.mel*sc;
      if(M.lead==="bell"){
        tone({t,f,type:"sine",dur:dur*1.9,g:.16*v,bus:musB,atk:.004,fil:3200});
        tone({t,f:f*2.76,type:"sine",dur:dur*1.1,g:.05*v,bus:musB,atk:.003});
        tone({t,f:f*5.4,type:"sine",dur:dur*.5,g:.02*v,bus:musB,atk:.002});
      } else if(M.lead==="brass"){
        tone({t,f,type:"sawtooth",dur:dur*.95,g:.12*v,bus:musB,atk:.03,fil:900,fil2:1600,q:3,det:drift});
        tone({t,f:f*1.003,type:"sawtooth",dur:dur*.95,g:.08*v,bus:musB,atk:.04,fil:1100,q:2,det:-drift});
      } else if(M.lead==="organ"){
        [1,2,3,4].forEach((h,i)=>tone({t,f:f*h,type:i%2?"sine":"triangle",dur:dur*.98,
          g:(.11/(i+1))*v,bus:musB,atk:.02,sus:.02,hold:dur*.4,rel:.1,det:drift*.4}));
      } else { // calliope: detuned square + saw through a bandpass, with chiff
        tone({t,f,type:"square",dur:dur*.92,g:.11*v,bus:musB,atk:.006,fil:1900,ft:"bandpass",q:1.3,det:drift});
        tone({t,f:f*1.004,type:"sawtooth",dur:dur*.92,g:.07*v,bus:musB,atk:.009,fil:2400,ft:"bandpass",q:1.1,det:-drift});
        tone({t,f:f*2,type:"square",dur:dur*.5,g:.035*v,bus:musB,atk:.005,fil:3200,ft:"bandpass",q:1.6});
        noise({t,dur:.035,g:.035*v,fil:f*3,ft:"bandpass",q:2.5,bus:musB});
      }
    }
  };

  /* ---------------- SFX ---------------- */
  const S={
    ui(){ tone({f:760,type:"triangle",dur:.05,g:.07,bus:sfxB}); },
    hover(){ tone({f:1180,type:"sine",dur:.035,g:.035}); },
    coin(n=1){ const t=now();
      for(let i=0;i<n;i++){ const tt=t+i*.055;
        tone({t:tt,f:rnd(2600,2100),type:"square",dur:.07,g:.07,fil:5200,ft:"bandpass",q:4,pan:rnd(.3,-.3)});
        tone({t:tt+.012,f:rnd(3700,3100),type:"sine",dur:.11,g:.05});
        noise({t:tt,dur:.05,g:.05,fil:4800,ft:"highpass"}); } },
    tickets(n){ const t=now(), c=clamp(n,1,10);
      for(let i=0;i<c;i++) tone({t:t+i*.045,f:880*Math.pow(1.06,i),type:"square",dur:.06,g:.06,fil:3000,ft:"bandpass",q:3}); },
    clunk(){ tone({f:150,bend:64,type:"sine",dur:.16,g:.3}); noise({dur:.09,g:.14,fil:900,ft:"lowpass"}); },
    servo(){ return hum(rnd(122,112),.045,"sawtooth",300); },
    chain(){ const t=now(); for(let i=0;i<7;i++) noise({t:t+i*.031+rnd(.012),dur:.045,g:rnd(.07,.03),fil:rnd(4200,2600),ft:"bandpass",q:6,pan:rnd(.4,-.4)}); },
    clawClose(){ const t=now();
      tone({t,f:420,bend:190,bt:.14,type:"sawtooth",dur:.2,g:.1,fil:1300,q:2});
      noise({t:t+.13,dur:.07,g:.11,fil:2100,ft:"bandpass",q:3});
      tone({t:t+.15,f:240,bend:120,type:"square",dur:.1,g:.07,fil:900}); },
    clawOpen(){ tone({f:190,bend:430,bt:.13,type:"sawtooth",dur:.18,g:.08,fil:1200,q:2}); },
    plushDrop(){ noise({dur:.16,g:.16,fil:420,ft:"lowpass",q:.6}); tone({f:92,bend:50,type:"sine",dur:.14,g:.12}); },
    glass(v=1){ const t=now(); [1,1.62,2.41,3.7].forEach((h,i)=>
      tone({t,f:1240*h*rnd(1.02,.98),type:"sine",dur:rnd(.5,.28)/(i*.5+1),g:.09*v/(i+1),pan:rnd(.35,-.35)}));
      noise({t,dur:.05,g:.06*v,fil:5200,ft:"highpass"}); },
    thud(v=1){ tone({f:96,bend:48,type:"sine",dur:.2,g:.3*v}); noise({dur:.12,g:.11*v,fil:380,ft:"lowpass"}); },
    tok(v=1){ tone({f:1500,bend:760,bt:.04,type:"square",dur:.07,g:.14*v,fil:2600,ft:"bandpass",q:5});
      noise({dur:.04,g:.1*v,fil:3400,ft:"highpass"}); },
    bounce(v=1,p=0){ const s=clamp(v,.15,1);
      tone({f:rnd(230,170),bend:110,bt:.05,type:"sine",dur:.12,g:.2*s,pan:p});
      noise({dur:.05,g:.07*s,fil:1400,ft:"bandpass",q:1.4,pan:p}); },
    whoosh(v=1){ noise({dur:.26,g:.1*v,fil:340,fil2:2400,ft:"bandpass",q:.8,atk:.07}); },
    swish(){ const t=now(); noise({t,dur:.3,g:.14,fil:5200,fil2:1600,ft:"bandpass",q:1.1,atk:.02});
      tone({t:t+.02,f:520,bend:300,type:"sine",dur:.2,g:.05}); },
    rim(){ const t=now(); [1,2.3,3.9,5.1].forEach((h,i)=>
      tone({t,f:430*h,type:"sine",dur:rnd(1.3,.7)/(i+1),g:.11/(i+1),pan:rnd(.3,-.3)}));
      noise({t,dur:.06,g:.08,fil:3000,ft:"bandpass",q:3}); },
    backboard(){ tone({f:260,bend:170,bt:.1,type:"triangle",dur:.42,g:.2,fil:1100,q:3});
      noise({dur:.1,g:.09,fil:800,ft:"bandpass",q:1.2}); },
    pop(size=1){ const t=now();
      noise({t,dur:.055,g:.34,fil:1500/size,fil2:400,ft:"bandpass",q:.9,atk:.001});
      tone({t,f:900/size,bend:160,bt:.05,type:"square",dur:.07,g:.12,fil:2200});
      noise({t:t+.03,dur:.16,g:.06,fil:2600,ft:"highpass"}); },
    rubber(){ tone({f:310,bend:120,bt:.09,type:"sine",dur:.14,g:.11,fil:700});
      noise({dur:.07,g:.05,fil:900,ft:"bandpass",q:1.5}); },
    dart(){ noise({dur:.16,g:.09,fil:600,fil2:3000,ft:"bandpass",q:.9,atk:.05}); },
    thunk(){ tone({f:540,bend:200,bt:.05,type:"triangle",dur:.1,g:.13,fil:1600,q:2});
      noise({dur:.06,g:.1,fil:1200,ft:"bandpass",q:2}); },
    swing(){ noise({dur:.3,g:.14,fil:260,fil2:1900,ft:"bandpass",q:.7,atk:.13}); },
    hammer(v=1){ const t=now();
      tone({t,f:150,bend:52,bt:.09,type:"sine",dur:.3,g:.42*v});
      noise({t,dur:.13,g:.2*v,fil:560,ft:"lowpass"});
      tone({t,f:1900,bend:700,bt:.05,type:"square",dur:.08,g:.1*v,fil:2600,ft:"bandpass",q:4}); },
    dead(){ tone({f:110,bend:60,type:"sine",dur:.22,g:.3,fil:200});
      noise({dur:.18,g:.16,fil:230,ft:"lowpass",q:.5}); },
    bell(){ const t=now();
      [1,2.76,5.4,8.9,13.3].forEach((h,i)=>tone({t,f:660*h,type:"sine",dur:rnd(4.4,2.6)/(i*.7+1),
        g:.19/(i*.8+1),bus:sfxB,pan:rnd(.25,-.25)}));
      noise({t,dur:.09,g:.14,fil:6000,ft:"highpass"}); },
    ratchet(v=1){ tone({f:rnd(2100,1700),type:"square",dur:.03,g:.075*v,fil:3200,ft:"bandpass",q:7});
      noise({dur:.022,g:.05*v,fil:4200,ft:"highpass"}); },
    magnet(){ return hum(60,.0,"sawtooth",190); },
    buzzer(){ const t=now();
      tone({t,f:118,type:"sawtooth",dur:.6,g:.16,fil:700,q:4});
      tone({t,f:119.7,type:"square",dur:.6,g:.12,fil:600,q:4}); },
    fail(){ const t=now(); [0,1,2].forEach(i=>tone({t:t+i*.13,f:mtof(62-i*3),type:"sawtooth",dur:.28,g:.13,fil:900,q:2})); },
    prize(){ const t=now(); const seq=[69,72,76,81,84,88];
      seq.forEach((m,i)=>{ const tt=t+i*.085;
        [1,2,3].forEach(h=>tone({t:tt,f:mtof(m)*h,type:h===1?"square":"sine",dur:.5/h,g:.12/h,fil:4000,ft:"lowpass"}));
        noise({t:tt,dur:.05,g:.05,fil:6000,ft:"highpass"}); });
      noise({t:t+.5,dur:1.2,g:.1,fil:3400,ft:"bandpass",q:.7,atk:.1}); // applause
      for(let i=0;i<50;i++) noise({t:t+.5+Math.random()*1.1,dur:.035,g:.03,fil:rnd(4500,2000),ft:"bandpass",q:4,pan:rnd(1,-1)}); },
    sparkle(){ const t=now(); for(let i=0;i<6;i++) tone({t:t+i*.04,f:rnd(4200,2400),type:"sine",dur:.16,g:.045,pan:rnd(.7,-.7)}); },
    ding(){ tone({f:1760,type:"sine",dur:.5,g:.11}); tone({f:2640,type:"sine",dur:.3,g:.05}); },
    dim(){ noise({dur:.22,g:.05,fil:400,ft:"lowpass",atk:.02}); },
    paper(){ noise({dur:.14,g:.06,fil:3200,ft:"bandpass",q:1.1,atk:.02}); },
    step(wet=1,p=0){ const t=now();
      noise({t,dur:.055,g:.055,fil:rnd(420,300),ft:"lowpass",pan:p});
      noise({t:t+.004,dur:.07*wet,g:.035*wet,fil:rnd(3400,2400),ft:"bandpass",q:1.6,pan:p});
      tone({t,f:rnd(120,92),bend:60,type:"sine",dur:.06,g:.05,pan:p}); },
    door(){ tone({f:78,bend:40,type:"sine",dur:.7,g:.28}); noise({dur:.5,g:.11,fil:420,ft:"lowpass",atk:.1}); },
    thunder(){ const t=now();
      noise({t,dur:2.4,g:.18,fil:120,ft:"lowpass",atk:.25,q:.6});
      noise({t:t+.05,dur:.7,g:.09,fil:900,ft:"bandpass",q:.5,atk:.03}); }
  };

  function setMaster(v){ if(master) master.gain.setTargetAtTime(on?v*.85:0,now(),.05); }
  function setMusVol(v){ if(musB) musB.gain.setTargetAtTime(v*.52,now(),.08); }
  function setSfxVol(v){ if(sfxB) sfxB.gain.setTargetAtTime(v*.9,now(),.08); }
  function setAmbVol(v){ if(ambB) ambB.gain.setTargetAtTime(v*.5,now(),.12); }
  return { init, resume, setOn, isOn:()=>on, S, hum, amb, mus:Mus, ctx:()=>ctx, ready:()=>ok,
           setMaster, setMusVol, setSfxVol, setAmbVol };
})();

let VIGN=null;
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth, h=window.innerHeight;
  const s=Math.min(w/VW,h/VH);

function present(){
  MX.setTransform(1,0,0,1,0,0); MX.clearRect(0,0,CV.width,CV.height);
  const sx=CV.width/VW, sy=CV.height/VH;

    MX.globalCompositeOperation="lighter"; MX.globalAlpha=FX.bloom;
    MX.filter="blur(7px)"; MX.drawImage(BL,0,0,VW,VH);

    MX.filter="none"; MX.globalCompositeOperation="source-over"; MX.globalAlpha=1;
  }

/* ---- on-screen arrows: synthesise the keys the game already reads ---- */
const DKEYS={arrowleft:["arrowleft"],arrowright:["arrowright"],action:["arrowup"," ","e"]};
function dkDown(el,k){
  if(el.classList.contains("on")) return;
  el.classList.add("on"); A.resume();
  for(const key of DKEYS[k]){ if(!IN.keys.has(key)) IN.justKeys.add(key); IN.keys.add(key); }
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}
function dkUp(el,k){
  el.classList.remove("on");
  for(const key of DKEYS[k]) IN.keys.delete(key);
}
function syncDpad(){
  const on = OPT.dpad && cur && cur.dir;
  const el=document.getElementById("dpad");
  if(!el) return;
  el.classList.toggle("hidden",!on);
  if(!on) el.querySelectorAll(".dk").forEach(b=>dkUp(b,b.dataset.k));
}
(function wireDpad(){
  const el=document.getElementById("dpad"); if(!el) return;
  el.querySelectorAll(".dk").forEach(btn=>{
    const k=btn.dataset.k;
    const down=e=>{ e.preventDefault(); e.stopPropagation(); dkDown(btn,k);
      try{ btn.setPointerCapture(e.pointerId); }catch(_){} };
    const up=e=>{ e.preventDefault(); e.stopPropagation(); dkUp(btn,k); };
    btn.addEventListener("pointerdown",down);
    btn.addEventListener("pointerup",up);
    btn.addEventListener("pointercancel",up);
    btn.addEventListener("pointerleave",up);
    btn.addEventListener("contextmenu",e=>e.preventDefault());
  });
  window.addEventListener("blur",()=>el.querySelectorAll(".dk").forEach(b=>dkUp(b,b.dataset.k)));
})();

const P=[];
function spawn(o){ if(P.length>1400) P.splice(0,120);
  P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:600,life:0,max:1,r:3,col:"#fff",type:"spark",
    rot:rnd(TAU),vr:rnd(6,-6),drag:.999,a:1,z:1},o)); }
function burst(x,y,n,o={}){ for(let i=0;i<n;i++){ const a=o.ang!==undefined?o.ang+rnd(o.spread||TAU/2,-(o.spread||TAU/2)):rnd(TAU);
  const s=rnd(o.smax||260,o.smin||60);
  spawn(Object.assign({},o,{x:x+rnd(6,-6),y:y+rnd(6,-6),vx:Math.cos(a)*s,vy:Math.sin(a)*s,
    max:rnd(o.lmax||.9,o.lmin||.3),r:rnd(o.rmax||3.5,o.rmin||1),
    col:o.cols?pick(o.cols):(o.col||"#ffb545")})); } }
function updP(dt){
  for(let i=P.length-1;i>=0;i--){ const p=P[i];
    p.life+=dt; if(p.life>=p.max){ P.splice(i,1); continue; }
    p.vy+=p.g*dt; p.vx*=Math.pow(p.drag,dt*60); p.vy*=Math.pow(p.drag,dt*60);
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.floor!==undefined&&p.y>p.floor){ p.y=p.floor; p.vy*=-(p.bounce||.35); p.vx*=.7;
      if(Math.abs(p.vy)<24){p.vy=0;p.g=0;p.vx*=.86;} }
  }
}
function drawP(layer){
  X.save();
  for(const p of P){ if((p.z|0)!==(layer|0)) continue;
    const t=p.life/p.max, fade=p.type==="smoke"?Math.sin(t*Math.PI):(1-t);
    X.globalAlpha=clamp(fade*p.a,0,1);
    if(p.type==="spark"||p.type==="glow"){
      X.globalCompositeOperation="lighter";
      const r=p.r*(p.type==="glow"?(1+t*2):(1-t*.5));
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3.2);
      g.addColorStop(0,p.col); g.addColorStop(.35,p.col); g.addColorStop(1,"rgba(0,0,0,0)");
      X.fillStyle=g; X.beginPath(); X.arc(p.x,p.y,r*3.2,0,TAU); X.fill();
      X.globalCompositeOperation="source-over";
    } else if(p.type==="smoke"){
      X.fillStyle=p.col; X.beginPath(); X.arc(p.x,p.y,p.r*(1+t*2.6),0,TAU); X.fill();
    } else if(p.type==="shard"||p.type==="confetti"){
      X.save(); X.translate(p.x,p.y); X.rotate(p.rot); X.fillStyle=p.col;
      const w=p.r*(p.type==="confetti"?2.4:1.4), h=p.r*(p.type==="confetti"?.6:1.4)*Math.abs(Math.cos(p.rot*1.7));
      X.fillRect(-w/2,-h/2,w,h); X.restore();
    } else if(p.type==="water"){
      X.strokeStyle=p.col; X.lineWidth=p.r*.6; X.beginPath();

    }
  }
  X.restore(); X.globalAlpha=1;
}

function castShadow(x,y,len,skew,w,a=.3){

function festoon(pts,t,cols,sag=26,n=16,phase=0){
  for(let s=0;s<pts.length-1;s++){
    const a=pts[s], b=pts[s+1];
    X.strokeStyle="rgba(18,14,10,.85)"; X.lineWidth=1.6;
    X.beginPath();
    for(let i=0;i<=24;i++){ const u=i/24, x=lerp(a.x,b.x,u), sw=Math.sin(t*.7+s)*3;
      const y=lerp(a.y,b.y,u)+Math.sin(u*Math.PI)*sag+sw*Math.sin(u*Math.PI);
      i?X.lineTo(x,y):X.moveTo(x,y); }
    X.stroke();
    for(let i=0;i<n;i++){ const u=(i+.5)/n, x=lerp(a.x,b.x,u), sw=Math.sin(t*.7+s)*3;
      const y=lerp(a.y,b.y,u)+Math.sin(u*Math.PI)*sag+sw*Math.sin(u*Math.PI);

    }
  }

function bulbFrame(x,y,w,h,t,cols,step=26,phase=0,chase=true){
  const pts=[]; 
  for(let i=0;i<w;i+=step){ pts.push([x+i,y]); }
  for(let i=0;i<h;i+=step){ pts.push([x+w,y+i]); }
  for(let i=w;i>0;i-=step){ pts.push([x+i,y+h]); }
  for(let i=h;i>0;i-=step){ pts.push([x,y+i]); }
  pts.forEach((p,i)=>{ const li=chase?(.3+.7*Math.pow(Math.max(0,Math.sin(t*3-i*.42+phase)),3)):(.6+.4*Math.sin(t*2+i));

    const off=(t*speed*(i+1)*.4)%(VW*2)-VW*.5;
    X.beginPath();
    for(let k=0;k<=20;k++){ const x=k/20*VW*1.6-VW*.3;
      const yy=lerp(y0,y1,.5)+fbm((x+off)*.004+i*3,1)*26;
      k?X.lineTo(x,yy):X.moveTo(x,yy); }
    X.lineTo(VW*1.4,y1+80); X.lineTo(-VW*.4,y1+80); X.closePath(); X.fill();
  }
  X.restore(); X.globalAlpha=1;
}

      s:"all "+BOOTHS.length+" games won \u2014 take a turn on the wheel"});

/* ================================================================
   SHARED BACKDROP: night sky, pier, ferris wheel, boardwalk
   ================================================================ */
function skyAndSea(t,horizon=430){
  const g=X.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,"#070912"); g.addColorStop(.42,"#121a30"); g.addColorStop(.78,"#26243c");
  g.addColorStop(1,"#3a2c38");
  X.fillStyle=g; X.fillRect(0,0,VW,horizon);
  // stars
  for(let i=0;i<70;i++){ const x=(h1(i*2.7)*.5+.5)*VW, y=(h1(i*5.1)*.5+.5)*horizon*.6;
    const a=(.2+.5*Math.abs(Math.sin(t*.8+i)))*(1-y/(horizon*.8));
    X.globalAlpha=clamp(a,0,.6); X.fillStyle="#cfe0ff"; X.fillRect(x,y,1.3,1.3); }
  X.globalAlpha=1;
  // moon behind cloud
  const mx=VW*.78,my=88;
  X.save(); X.globalCompositeOperation="lighter";
  const mg=X.createRadialGradient(mx,my,4,mx,my,150);
  mg.addColorStop(0,"rgba(220,230,255,.55)"); mg.addColorStop(.12,"rgba(180,200,240,.2)");
  mg.addColorStop(1,"rgba(0,0,0,0)"); X.fillStyle=mg; X.beginPath(); X.arc(mx,my,150,0,TAU); X.fill();
  const mo=X.createRadialGradient(mx-6,my-6,2,mx,my,27);
  mo.addColorStop(0,"rgba(255,255,255,.95)"); mo.addColorStop(.7,"rgba(220,228,250,.8)"); mo.addColorStop(1,"rgba(190,200,230,.25)");
  X.fillStyle=mo; X.beginPath(); X.arc(mx,my,27,0,TAU); X.fill();
  X.restore();
  // clouds
  X.save(); X.globalAlpha=.5;
  for(let L=0;L<3;L++){
    const off=(t*(3+L*4))%(VW*2)-VW*.5, yy=40+L*52;
    X.fillStyle=`rgba(${28+L*10},${30+L*10},${46+L*12},.75)`;
    X.beginPath(); X.moveTo(-200,yy+70);
    for(let k=0;k<=26;k++){ const x=-200+k/26*(VW+400);
      X.lineTo(x,yy+fbm((x+off)*.0045+L*7,1)*20); }
    X.lineTo(VW+200,yy+80); X.closePath(); X.fill();
  }
  X.restore(); X.globalAlpha=1;
  // sea — the waterline sits above the deck so the bay is visible
  const SEA=horizon-74;
  const sg=X.createLinearGradient(0,SEA,0,horizon+60);
  sg.addColorStop(0,"#1b2740"); sg.addColorStop(.35,"#141c2e"); sg.addColorStop(1,"#0a0d16");
  X.fillStyle=sg; X.fillRect(0,SEA,VW,horizon-SEA+140);
  X.strokeStyle="rgba(150,185,225,.22)"; X.lineWidth=1.2;
  X.beginPath(); X.moveTo(0,SEA); X.lineTo(VW,SEA); X.stroke();
  // moonlit path on the water
  X.save(); X.globalCompositeOperation="lighter";
  const mp=X.createLinearGradient(0,SEA,0,horizon+40);
  mp.addColorStop(0,"rgba(190,210,250,.14)"); mp.addColorStop(1,"rgba(190,210,250,0)");
  X.fillStyle=mp; X.fillRect(VW*.62,SEA,VW*.3,horizon-SEA+60);
  X.restore();
  // the far shore, low and lit
  X.save();
  X.fillStyle="#0c0f18";
  for(let i=0;i<26;i++){
    const x=-60+i*56+h1(i*5.1)*14, w=30+h1(i*2.3)*26, hh=8+Math.abs(h1(i*7.9))*22;
    if(i%4===1){ X.beginPath(); X.moveTo(x,SEA); X.lineTo(x+w/2,SEA-hh-8); X.lineTo(x+w,SEA); X.closePath(); X.fill(); }
    else X.fillRect(x,SEA-hh,w,hh);
  }
  X.globalCompositeOperation="lighter";
  for(let i=0;i<40;i++){ const x=(h1(i*3.7)*.5+.5)*VW, y=SEA-4-Math.abs(h1(i*9.1))*16;
    X.globalAlpha=.25+.3*Math.abs(Math.sin(t*1.3+i));
    X.fillStyle=i%5===0?"#ff9a6a":"#ffd9a0"; X.fillRect(x,y,1.6,1.6); }
  X.restore(); X.globalAlpha=1;
  yachts(t,SEA);
  X.save(); X.globalCompositeOperation="lighter";
  for(let i=0;i<46;i++){ const y=SEA+4+(i%16)*6.2;
    const w=30+h1(i*3)*60, x=(h1(i*7.7)*.5+.5)*VW + Math.sin(t*.6+i)*12;
    X.globalAlpha=.05+.05*Math.sin(t*1.5+i); X.fillStyle="#9fc4e8";
    X.fillRect(x,y,w,1.2); }
  X.restore(); X.globalAlpha=1;
}

function yachts(t,horizon){
  // moored out past the pier, riding the swell
  const FLEET=[
    {x:-40,  z:.30, sail:1, hull:"#0d1420", lightC:"#ff6b5a"},
    {x:250,  z:.46, sail:1, hull:"#101a26", lightC:"#7dffa8"},
    {x:520,  z:.22, sail:0, hull:"#0b1118", lightC:"#ffd9a0"},
    {x:760,  z:.58, sail:1, hull:"#121d2a", lightC:"#7dffa8"},
    {x:1030, z:.36, sail:0, hull:"#0e1620", lightC:"#ff6b5a"},
    {x:1260, z:.50, sail:1, hull:"#111b28", lightC:"#ffd9a0"},

    X.save(); X.translate(bx,by+bob); X.rotate(roll); X.scale(sc,sc);

    X.fillStyle=y.hull;

      X.beginPath(); X.moveTo(0,-6); X.lineTo(0,-52); X.quadraticCurveTo(16,-28,24,-6); X.closePath(); X.fill();
    } else {
      X.fillStyle="#1a2632"; rr(-16,-22,34,16,2); X.fill();
      X.fillStyle="rgba(255,210,150,.5)"; X.fillRect(-11,-18,7,6); X.fillRect(2,-18,7,6);
    }

    X.beginPath(); X.moveTo(-42,0); X.quadraticCurveTo(-30,13,0,14);

    X.strokeStyle="rgba(190,210,235,.35)"; X.lineWidth=1;

  }

}
function ferris(cx,cy,R,t,lit=1){
  X.save();
  X.strokeStyle="rgba(18,20,30,.95)"; X.lineWidth=5;
  X.beginPath(); X.moveTo(cx-R*.62,cy+R); X.lineTo(cx,cy); X.lineTo(cx+R*.62,cy+R); X.stroke();
  const rot=t*.09;
  X.strokeStyle="rgba(26,28,40,.9)"; X.lineWidth=2.6;
  X.beginPath(); X.arc(cx,cy,R,0,TAU); X.stroke();
  X.beginPath(); X.arc(cx,cy,R*.62,0,TAU); X.stroke();
  for(let i=0;i<16;i++){
    const a=rot+i/16*TAU, x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R;
    X.beginPath(); X.moveTo(cx,cy); X.lineTo(x,y); X.stroke();
    const li=(.4+.6*Math.pow(Math.max(0,Math.sin(t*2.2-i*.55)),2))*lit;
    bulb(x,y,2.4,i%3===0?"#ff5aa8":i%3===1?"#4de0ff":"#ffd24d",1.3,li);
    // gondola
    X.fillStyle="rgba(22,24,34,.95)"; X.fillRect(x-5,y+3,10,7);
  }
  for(let i=0;i<34;i++){ const a=rot*.5+i/34*TAU;
    bulb(cx+Math.cos(a)*R*.62,cy+Math.sin(a)*R*.62,1.7,"#ffe6a8",1,(.3+.7*Math.abs(Math.sin(t*1.6+i*.4)))*lit*.7); }
  X.restore();
}
function boardwalk(y,t,reflectFn){
  const g=X.createLinearGradient(0,y,0,VH);
  g.addColorStop(0,"#241b16"); g.addColorStop(.3,"#1a1310"); g.addColorStop(1,"#0d0a09");
  X.fillStyle=g; X.fillRect(0,y,VW,VH-y);
  // planks in perspective
  for(let i=0;i<26;i++){
    const u=i/26, yy=y+Math.pow(u,1.7)*(VH-y);
    X.strokeStyle=`rgba(0,0,0,${.18+u*.25})`; X.lineWidth=1+u*1.6;
    X.beginPath(); X.moveTo(0,yy); X.lineTo(VW,yy); X.stroke();
    X.strokeStyle=`rgba(120,96,70,${.05+u*.06})`;
    X.beginPath(); X.moveTo(0,yy+1.5); X.lineTo(VW,yy+1.5); X.stroke();
  }
  for(let i=0;i<20;i++){
    const x=i/20*VW+((i*37)%19);
    X.strokeStyle="rgba(0,0,0,.2)"; X.lineWidth=1;
    X.beginPath(); X.moveTo(x,y); X.lineTo(x+(x-VW/2)*.5,VH); X.stroke();
  }
  if(reflectFn) wetFloor(0,y,VW,VH-y,reflectFn,.26,.5);
  // sheen
  const sh=X.createLinearGradient(0,y,0,VH);
  sh.addColorStop(0,"rgba(120,150,190,.06)"); sh.addColorStop(1,"rgba(120,150,190,0)");
  X.fillStyle=sh; X.fillRect(0,y,VW,VH-y);
}
function crowdRow(t,y,n,scale,alpha,speed){
  X.save(); X.globalAlpha=alpha;
  for(let i=0;i<n;i++){
    const ph=h1(i*4.1)*.5+.5;
    const x=((ph*VW*1.3 + t*speed*(.6+ph))%(VW*1.3))-VW*.15;
    const s=scale*(.85+ph*.3), bob=Math.sin(t*4*(0.8+ph)+i)*1.6;
    X.globalAlpha=alpha*.7; contactShadow(x,y+18*s,13*s,4*s,.5); X.globalAlpha=alpha;
    X.fillStyle="#07070c";
    X.beginPath();
    X.ellipse(x,y+bob-15*s,4.2*s,5*s,0,0,TAU); X.fill();          // head
    X.beginPath(); X.moveTo(x-7*s,y+bob); X.quadraticCurveTo(x,y+bob-16*s,x+7*s,y+bob);
    X.lineTo(x+5*s,y+bob+18*s); X.lineTo(x-5*s,y+bob+18*s); X.closePath(); X.fill();
  }
  X.restore(); X.globalAlpha=1;
}
function lampPost(x,y,h,t,col="#ffcf87"){
  X.fillStyle="#14100e"; X.fillRect(x-3,y-h,6,h);
  X.beginPath(); X.ellipse(x,y,12,4,0,0,TAU); X.fill();
  X.fillStyle="#191411"; X.beginPath(); X.moveTo(x-14,y-h); X.lineTo(x+14,y-h); X.lineTo(x+8,y-h-12); X.lineTo(x-8,y-h-12); X.closePath(); X.fill();
  const fl=.85+.15*Math.sin(t*9+x)+.05*h1(Math.floor(t*11)+x);
  bulb(x,y-h+4,5,col,2.6,fl);
  lightCone(x,y-h+6,Math.PI/2,.5,h*.95,"rgba(255,190,110,.5)",.1*fl);
}

function drawBarker(x,y,s,t,talk=0){
  contactShadow(x,y+2,26*s,7*s,.6);
  castShadow(x,y,74*s,.5,30*s,.26);
  X.save(); X.translate(x,y); X.scale(s,s);
  const sway=Math.sin(t*1.1)*.03;
  X.rotate(sway);
  const body="#0a0810";
  // coat
  X.fillStyle=body;
  X.beginPath(); X.moveTo(-26,0); X.quadraticCurveTo(-30,-58,-16,-76);
  X.lineTo(16,-76); X.quadraticCurveTo(30,-58,26,0); X.closePath(); X.fill();
  X.fillRect(-24,0,48,6);
  // tails
  X.beginPath(); X.moveTo(-26,-2); X.quadraticCurveTo(-34,22,-18,26); X.lineTo(-10,0); X.closePath(); X.fill();
  X.beginPath(); X.moveTo(26,-2); X.quadraticCurveTo(34,22,18,26); X.lineTo(10,0); X.closePath(); X.fill();
  // arms
  X.lineWidth=9; X.strokeStyle=body; X.lineCap="round";
  const ga=talk?Math.sin(t*7)*.5-.6:-.15;
  X.beginPath(); X.moveTo(-20,-64); X.quadraticCurveTo(-36,-44,-30+Math.sin(t*1.3)*2,-18); X.stroke();
  X.beginPath(); X.moveTo(20,-64); X.quadraticCurveTo(38,-52,34+Math.cos(ga)*10,-40+Math.sin(ga)*14); X.stroke();
  // cane
  X.lineWidth=2.4; X.strokeStyle="#2a1d12";
  X.beginPath(); X.moveTo(-30,-18); X.lineTo(-33,26); X.stroke();
  // head + hat
  X.fillStyle=body; X.beginPath(); X.ellipse(0,-88,11,13,0,0,TAU); X.fill();
  X.fillRect(-19,-100,38,4);
  X.fillRect(-13,-130,26,31);
  X.fillStyle="#6e1414"; X.fillRect(-13,-106,26,5);
  // rim light
  X.strokeStyle="rgba(255,170,80,.55)"; X.lineWidth=1.8;
  X.beginPath(); X.moveTo(13,-130); X.lineTo(13,-101); X.lineTo(19,-100); X.stroke();
  X.beginPath(); X.moveTo(11,-92); X.quadraticCurveTo(14,-84,8,-77); X.stroke();
  X.strokeStyle="rgba(255,150,70,.4)";
  X.beginPath(); X.moveTo(16,-76); X.quadraticCurveTo(30,-58,26,0); X.stroke();
  // eye glint
  if(Math.sin(t*.7)>-.9){ X.fillStyle="rgba(255,220,150,.9)"; X.fillRect(4,-90,2.6,2); }
  X.restore();
}

  X.fillStyle="rgba(0,0,0,.3)"; X.beginPath(); X.ellipse(2,-100,8,7,0,0,TAU); X.fill();

  enterSpot(sp){

  update(dt){
    this.t+=dt; this.nextSay-=dt;
    if(this.nextSay<=0){ this.nextSay=rnd(22,13);
      if(Math.random()<.7) say(pick(this.pl.x<GATE_X?BACKLINES:MIDLINES),4600); }
    const P0=this.pl;
    let mv=0;
    if(IN.keys.has("arrowleft")||IN.keys.has("a")) mv-=1;
    if(IN.keys.has("arrowright")||IN.keys.has("d")) mv+=1;
    if(mv!==0){ this.target=null; this.pending=null; }
    // pointer -> world
    const wx=IN.x+this.cam;
    let hb=null;
    const bT=birdView()?BIRD.BOOTH_T:248, bB=birdView()?BIRD.BOOTH_B:552;
    if(IN.y>=bT&&IN.y<=bB) hb=this.boothAt(wx);
    const hv=(IN.y>=bT-32&&IN.y<=bB+20&&wx>562&&wx<710)?"vault":null;
    const hovKey=hb?hb.id:hv;
    if(hovKey!==this.hov){ this.hov=hovKey; if(hovKey) A.S.hover(); }
    if(IN.justUp && dist(IN.downX,IN.downY,IN.x,IN.y)<26){
      const sp=hb?this.spots().find(z=>z.b===hb):(hv?this.spots().find(z=>z.vault):null);
      if(sp){ if(Math.abs(P0.x-sp.x)<118) this.enterSpot(sp);
        else { this.target=clamp(sp.x,this.minX(),this.maxX()); this.pending=sp; A.S.ui(); } }
      else if(IN.y>(birdView()?BIRD.DECK_T:560)) { this.target=clamp(wx,this.minX(),this.maxX()); this.pending=null; }
    }
    if(this.target!==null){
      const d=this.target-P0.x;
      if(Math.abs(d)<6){ P0.x=this.target; this.target=null;
        if(this.pending){ const q=this.pending; this.pending=null; this.enterSpot(q); } }
      else mv=sgn(d);
    }
    const SP=232;
    P0.vx=lerp(P0.vx,mv*SP,1-Math.pow(.0009,dt));
    if(Math.abs(P0.vx)<6) P0.vx=0;
    let nx=P0.x+P0.vx*dt;
    // the gate
    if(!backOpen() && nx<-12){ nx=-12;
      if(P0.vx<-40&&this.gateBump!==true){ this.gateBump=true; A.S.clunk();
        say(pick(["Back row's shut. Nothing down there but rot and rats.",
          "Not yet. Clear my vault first and I'll think about it.",
          "That gate's been locked since before you were born."]),4200);
        setTimeout(()=>this.gateBump=false,2500); }
    }
    if(!pavOpen() && nx>1206){ nx=1206;
      if(P0.vx>40&&this.pavBump!==true){ this.pavBump=true; A.S.clunk();
        say(pick(["Pavilion's past the back row. Clear all seven down there first.",
          "That end opens when the back row has nothing left to teach you.",
          "Seven prizes out of the dark end and I'll unlock it myself."]),4200);
        setTimeout(()=>this.pavBump=false,2500); } }
    P0.x=clamp(nx,this.minX(),this.maxX());
    P0.moving=Math.abs(P0.vx)>14;
    if(P0.moving){ P0.face=sgn(P0.vx);
      const pp=P0.ph; P0.ph+=Math.abs(P0.vx)*dt*.052;
      if(Math.floor(pp/Math.PI)!==Math.floor(P0.ph/Math.PI)){
        A.S.step(1,clamp((P0.x-this.cam-640)/640,-1,1));
        burst(P0.x-this.cam-P0.face*6,this.GY+2,3,{cols:["rgba(180,210,235,.7)"],type:"water",
          smax:70,smin:18,g:420,lmax:.35,rmax:2.4,ang:-1.57,spread:.9}); }
    } else P0.ph=lerp(P0.ph%TAU,0,dt*8);
    // camera
    const want=clamp(P0.x-VW/2,WORLD_L,WORLD_R-VW);
    this.cam=lerp(this.cam,want,1-Math.pow(.0001,dt));
    // proximity
    // --- a boat crosses the end of the pier, now and then ---
    this.boatT=(this.boatT||0)+dt;
    const cyc=this.boatT%BOAT_PERIOD;
    this.boatX = 2340-cyc*BOAT_SPEED;
    this.boatOn = this.boatX>=1876 && this.boatX<2360;   // only ever out past the last booth
    this.canJump = this.boatOn && P0.x>=JUMP_X && Math.abs(this.boatX-P0.x)<200;
    if(this.canJump && !G.flags.sawBoat){ G.flags.sawBoat=1;
      note("The Midway","A boat passes the very end of the pier, close enough to step onto. It does not wait."); save(); }
    let nb=null,nd=118;
    for(const sp of this.spots()){ const d=Math.abs(P0.x-sp.x); if(d<nd){ nd=d; nb=sp; } }
    this.near=nb;
    if(this.canJump&&(IN.justKeys.has("e")||IN.justKeys.has("w")||IN.justKeys.has("arrowup")
      ||IN.justKeys.has(" ")||IN.justKeys.has("enter"))){
      A.S.whoosh(1); A.S.step(1,.4); go("boat"); return;
    }
    if(nb && !this.canJump && (IN.justKeys.has("e")||IN.justKeys.has("w")||IN.justKeys.has("arrowup")
      ||IN.justKeys.has(" ")||IN.justKeys.has("enter"))) this.enterSpot(nb);
  },

    if(!G.plays.claw) say("The Lucky Claw! Strongest grip on the pier. Ask anybody.",5200);
  },
  exit(){ if(this.hum){this.hum.stop(); this.hum=null;} },
  makePile(){
    const kinds=[["bear","#ff5d9e","#ffa8cf","#c22a6a"],["bunny","#63d6ff","#b6ecff","#1f7fae"],
      ["frog","#63e08a","#bdf5cf","#1f8f4d"],["duck","#ffd24d","#fff0b8","#c08f0c"],
      ["octo","#c56bff","#e8c4ff","#7a2fb0"]];
    const a=[]; const floor=566;
    for(let i=0;i<11;i++){
      const k=kinds[i%5], r=rnd(30,23);
      a.push({kind:k[0],col:k[1],hi:k[2],sh:k[3],r,
        x:386+i*49+rnd(11,-11), y:floor-r*.7-((i*7)%3)*15+rnd(5,-5),
        rot:rnd(.4,-.4), sq:rnd(1.05,.92), need:.45, taken:false, val:4});
    }
    a.sort((p,q)=>p.y-q.y);
    if(!G.prizes.claw) a.push({kind:"gold",x:640,y:508,r:37,rot:0,need:.9,taken:false,val:0,gold:true});
    return a;
  },
  strongNow(){ const ph=this.cycT%9.0; return ph<2.2; },
  cycleGlow(){ const ph=this.cycT%9.0;
    if(ph<2.2) return 1; if(ph<2.5) return 1-(ph-2.2)/.3; if(ph>8.75) return (ph-8.75)/.25; return 0; },
  update(dt){
    this.t+=dt; this.cycT+=dt; this.shk*=Math.pow(.02,dt);
    const strong=this.strongNow();
    if(this.hum) this.hum.set(strong?99:124);
    this.rattle=lerp(this.rattle,strong?1:0,dt*6);
    if(this.state==="idle"){
      if(IN.keys.has("arrowleft")||IN.keys.has("a")) this.tX-=380*dt;
      if(IN.keys.has("arrowright")||IN.keys.has("d")) this.tX+=380*dt;
      if(IN.down&&IN.y>120&&IN.y<600) this.tX=IN.x;
      this.tX=clamp(this.tX,372,908);
      const d=this.tX-this.clawX; this.clawX+=clamp(d,-460*dt,460*dt);
      if(IN.justKeys.has(" ")) this.drop();
    } else if(this.state==="down"){
      this.clawY+=300*dt;
      const target=this.grabDepth();
      if(this.clawY>=target){ this.clawY=target; this.state="close"; this.stT=0; A.S.clawClose();
        this.gripNow=this.strongNow()?1:.3; }
    } else if(this.state==="close"){
      this.stT+=dt; this.open=clamp(1-this.stT*3.4,0,1);
      if(this.stT>.44){
        const p=this.findTarget();
        if(p && this.gripNow>=p.need){ this.held=p; A.S.clunk(); }
        else if(p){ this.held=p; this.slipT=rnd(1.5,.35); A.S.thud(.4); }
        this.state="up"; this.stT=0;
      }
    } else if(this.state==="up"){
      this.clawY-=220*dt;
      if(this.held){ this.held.x=this.clawX; this.held.y=this.clawY+this.held.r*.7+16;
        this.held.rot=Math.sin(this.t*7)*.07; }
      if(this.slipT>0){ this.slipT-=dt; if(this.slipT<=0) this.slip(); }
      if(this.clawY<=170){ this.clawY=170; this.state="over"; }
    } else if(this.state==="over"){
      const d=392-this.clawX; this.clawX+=clamp(d,-300*dt,300*dt);
      if(this.held){ this.held.x=this.clawX; this.held.y=this.clawY+this.held.r*.7+16;
        this.held.rot=Math.sin(this.t*7)*.07+clamp(d*.0012,-.3,.3); }
      if(this.slipT>0){ this.slipT-=dt; if(this.slipT<=0) this.slip(); }
      if(Math.abs(d)<3){ this.state="release"; this.stT=0; A.S.clawOpen(); }
    } else if(this.state==="release"){
      this.stT+=dt; this.open=clamp(this.stT*3.2,0,1);
      if(this.stT>.34){
        if(this.held){ const p=this.held; p.taken=true; this.held=null;
          A.S.plushDrop(); burst(392,600,16,{cols:["#ffd24d","#ff5aa8"],type:"spark",smax:200,g:400,lmax:.7});
          if(p.gold) this.grand(); else { win(p.val,"plush in the chute"); this.noteWin(); }
        }
        this.endGrab();
      }
    } else if(this.state==="retract"){
      this.stT+=dt; this.open=1;
      const d=640-this.clawX; this.clawX+=clamp(d,-320*dt,320*dt);
      if(this.stT>.5&&Math.abs(d)<4){ this.state=this.grabs>0?"idle":"ready"; this.tX=this.clawX; }
    }
    if(this.state!=="ready"&&this.win<=0&&!G.prizes.claw){}
  },
  grabDepth(){
    let best=520;
    for(const p of this.pile){ if(p.taken) continue;
      if(Math.abs(p.x-this.clawX)<p.r+16) best=Math.min(best,p.y-p.r*.2); }
    return clamp(best,300,540);
  },
  findTarget(){
    let best=null,bd=999;
    for(const p of this.pile){ if(p.taken) continue;
      const d=Math.abs(p.x-this.clawX);
      if(d<p.r+14 && d<bd){ bd=d; best=p; } }
    return best;
  },
  slip(){
    if(!this.held) return;

    A.S.clawOpen(); A.S.plushDrop(); shake(5);
    p.y=566-p.r*.7; p.x=clamp(p.x+rnd(30,-30),380,900); p.rot=rnd(.5,-.5);

      "Ohh, so close. Machine's getting old.","You had it. Right there."]),3200);

  noteSlip(p){

  drawClaw(x,y,open,t){

SCN.hoops={
  mood:"hoops", back:true, bloom:.4,
  RIMY:318, RIML:922, RIMR:1022, BBX:1030, BBT:150, BBB:320,
  START:{x:352,y:436}, G:1330, MAXV:1980, DRAG:232,
  enter(){
    this.t=0; this.state="ready"; this.shots=0; this.streak=0; this.made=0;
    this.ball=null; this.aim=null; this.ghost=null; this.trail=[]; this.lastTrail=null;
    this.net=this.makeNet(); this.rimShake=0; this.bbShake=0; this.flashMsg=0; this.msg="";
    this.madeTrail=G.best.hoopTrail||null; this.swishPt=G.best.hoopPt||null;
    hint("Drag back from the ball and release ");
    A.amb(.1,.06,.2);
    if(!G.plays.hoops) say("Three in a row! Any child could do it. None have.",5000);
  },
  makeNet(){ const n=[];
    for(let i=0;i<9;i++){ const u=i/8;
      n.push({x:lerp(this.RIML,this.RIMR,u),y:this.RIMY,ox:lerp(this.RIML,this.RIMR,u),
        px:lerp(this.RIML+13,this.RIMR-13,u),py:this.RIMY+52,vx:0,vy:0}); }
    return n; },
  play(){ const b=BMAP.hoops;
    if(!canPlay(b)){ A.S.buzzer(); say("Five tickets, sport."); return; }
    pay(b.cost); G.plays.hoops=(G.plays.hoops||0)+1; A.S.coin(2);
    this.shots=5; this.streak=0; this.made=0; this.state="aim"; this.lastTrail=null; this.ghost=null;
    save();
  },
  shoot(vx,vy){
    // RIG: the preview arc is computed with more juice than the shot actually gets
    this.ball={x:this.START.x,y:this.START.y,vx:vx*.962,vy:vy*.962,r:13,rot:0,vr:vx*.004,
      touchedRim:false,touchedBoard:false,scored:false,life:0};
    this.trail=[]; this.state="fly"; this.shots--; A.S.whoosh(.8);
  },
  simulate(vx,vy,steps){
    const pts=[]; let x=this.START.x,y=this.START.y,dx=vx,dy=vy; const dt=1/60;
    for(let i=0;i<steps;i++){ dy+=this.G*dt; dx*=.9985; dy*=.9985; x+=dx*dt; y+=dy*dt;
      pts.push({x,y}); if(y>640||x>1240) break; }
    return pts;
  },
  update(dt){
    this.t+=dt; this.rimShake*=Math.pow(.004,dt); this.bbShake*=Math.pow(.004,dt);
    this.flashMsg=Math.max(0,this.flashMsg-dt);
    // net physics
    for(const p of this.net){
      p.vy+=520*dt; p.vx+=(p.ox+(p.ox-(this.RIML+this.RIMR)/2)*.0-p.px)*0+0;
      const tx=p.ox+(p.ox-(this.RIML+this.RIMR)/2)*.42, ty=this.RIMY+54;
      p.vx+=(tx-p.px)*46*dt; p.vy+=(ty-p.py)*46*dt;
      p.vx*=Math.pow(.02,dt); p.vy*=Math.pow(.02,dt);
      p.px+=p.vx*dt; p.py+=p.vy*dt;
    }
    if(this.state==="aim"){
      if(IN.down){ this.aim={x:IN.x,y:IN.y}; }
      else if(this.aim){
        const dx=this.START.x-this.aim.x, dy=this.START.y-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,this.DRAG)/this.DRAG;
        if(s>.1){ const a=Math.atan2(dy,dx); const sp=s*this.MAXV;
          this.releasePt={x:this.aim.x,y:this.aim.y};
          this.shoot(Math.cos(a)*sp,Math.sin(a)*sp);
          this.ghost=this.simulate(Math.cos(a)*sp,Math.sin(a)*sp,240); }
        this.aim=null;
      }
    } else if(this.state==="fly"){
      const b=this.ball; b.life+=dt;
      for(let k=0;k<2;k++){
        const h=dt/2;
        b.vy+=this.G*h; b.vx*=Math.pow(.914,h); b.vy*=Math.pow(.914,h);
        const py=b.y; b.x+=b.vx*h; b.y+=b.vy*h; b.rot+=b.vr*h;
        // backboard  (RIG: springy)
        if(b.x+b.r>this.BBX && b.x-b.r<this.BBX+14 && b.y>this.BBT-4 && b.y<this.BBB){
          if(b.vx>0){ b.x=this.BBX-b.r; b.vx=-b.vx*1.42; b.vy*=1.05; b.touchedBoard=true;
            A.S.backboard(); this.bbShake=8; shake(5);
            burst(this.BBX,b.y,7,{cols:["#d8cdb4"],type:"dust",smax:120,g:260,lmax:.5,rmax:4});
            this.note("board"); }

/* ================================================================
   BOOTH 3 — BOTTLE-UP   (two-circle rigid bodies)
   ================================================================ */
function RB(x,y,m,cs,opt={}){
  return Object.assign({x,y,a:0,vx:0,vy:0,w:0,m,im:1/m,cs,
    I:m*760,iI:1/(m*760),e:.16,mu:.5,down:false,dead:false},opt);
}
function rbPts(b){ const c=Math.cos(b.a), s=Math.sin(b.a);
  return b.cs.map(o=>({x:b.x+o.x*c-o.y*s, y:b.y+o.x*s+o.y*c, r:o.r})); }
function rbApply(b,px,py,jx,jy){
  if(b.im===0) return;
  b.vx+=jx*b.im; b.vy+=jy*b.im;
  b.w+=((px-b.x)*jy-(py-b.y)*jx)*b.iI;
}
function rbVelAt(b,px,py){ return {x:b.vx-b.w*(py-b.y), y:b.vy+b.w*(px-b.x)}; }
function solveC(A,B,px,py,nx,ny,pen,e,mu){
  const va=A?rbVelAt(A,px,py):{x:0,y:0}, vb=B?rbVelAt(B,px,py):{x:0,y:0};
  const rvx=va.x-vb.x, rvy=va.y-vb.y, vn=rvx*nx+rvy*ny;
  const imA=A?A.im:0, imB=B?B.im:0;
  let denom=imA+imB;
  if(A){ const rx=px-A.x, ry=py-A.y, c=rx*ny-ry*nx; denom+=c*c*A.iI; }
  if(B){ const rx=px-B.x, ry=py-B.y, c=rx*ny-ry*nx; denom+=c*c*B.iI; }
  if(denom<=0) return;
  if(vn<0){
    const j=-(1+e)*vn/denom;
    if(A) rbApply(A,px,py,nx*j,ny*j);
    if(B) rbApply(B,px,py,-nx*j,-ny*j);
    // friction
    const tx=-ny, ty=nx;
    const va2=A?rbVelAt(A,px,py):{x:0,y:0}, vb2=B?rbVelAt(B,px,py):{x:0,y:0};
    const vt=(va2.x-vb2.x)*tx+(va2.y-vb2.y)*ty;
    let jt=-vt/denom; const lim=Math.abs(j)*mu;
    jt=clamp(jt,-lim,lim);
    if(A) rbApply(A,px,py,tx*jt,ty*jt);
    if(B) rbApply(B,px,py,-tx*jt,-ty*jt);
  }
  // positional correction
  const corr=Math.max(pen-.4,0)*.5/(imA+imB||1);
  if(A){ A.x+=nx*corr*A.im; A.y+=ny*corr*A.im; }
  if(B){ B.x-=nx*corr*B.im; B.y-=ny*corr*B.im; }
}

  enter(){
    this.t=0; this.state="ready"; this.balls=0; this.aim=null; this.ball=null;
    this.bots=[]; this.msg=""; this.msgT=0; this.settle=0; this.knocked=0; this.curtain=0;
    hint("Drag back from the ball and let go  ·  all three off the shelf");
    A.amb(.1,.06,.16);
    this.reset();
    if(!G.plays.bottles) say("Three bottles. One ball a throw. Simple as breathing.",5000);
  },
  reset(){
    const Y=this.SHELFY;
    const CS=[{x:-7,y:27,r:9},{x:7,y:27,r:9},{x:0,y:2,r:16},{x:0,y:-26,r:9}];
    this.bots=[
      RB(952,Y-36,17,CS.map(o=>({...o})),{lead:true,mu:.07,e:.05,seat:1}),
      RB(985,Y-36,17,CS.map(o=>({...o})),{lead:true,mu:.07,e:.05,seat:1}),
      RB(968,Y-104,1.1,CS.map(o=>({...o})),{lead:false,mu:.5,e:.22,seat:0})
    ];
    this.bots.forEach((b,i)=>{ b.I=b.m*(b.lead?1150:520); b.iI=1/b.I; b.id=i; });
    this.knocked=0;
  },
  play(){ const b=BMAP.bottles;
    if(!canPlay(b)){ A.S.buzzer(); say("Six tickets."); return; }
    pay(b.cost); G.plays.bottles=(G.plays.bottles||0)+1; A.S.coin(2);
    this.balls=3; this.state="aim"; this.reset(); save();
  },
  throwBall(vx,vy){
    this.ball={x:this.START.x,y:this.START.y,vx,vy,r:13,rot:0,m:2.4,im:1/2.4,I:1e9,iI:0,
      w:0,cs:[{x:0,y:0,r:13}],life:0,hit:false};
    this.state="fly"; this.balls--; A.S.whoosh(1);
  },
  step(dt){
    const G_=1500;
    const bodies=this.bots.filter(b=>!b.dead);
    const ball=this.ball;
    for(const b of bodies){
      if(!isFinite(b.x)||!isFinite(b.y)||!isFinite(b.a)){ b.x=1200; b.y=this.FLOOR-20; b.a=1.6;
        b.vx=b.vy=b.w=0; b.dead=true; if(!b.down){b.down=true; this.knocked++;} continue; }
      b.w=clamp(b.w,-36,36); b.vx=clamp(b.vx,-3800,3800); b.vy=clamp(b.vy,-3800,3800);
      b.vy+=G_*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.a+=b.w*dt;
      b.vx*=Math.pow(.55,dt); b.vy*=Math.pow(.85,dt); b.w*=Math.pow(.25,dt);
      // seating: heavy bottles sit in a shallow divot and resist tipping
      if(b.seat&&!b.down&&Math.abs(b.a)<.72&&b.y>this.SHELFY-70){
        b.w-=b.a*58*dt; b.w*=Math.pow(.07,dt); }
    }
    if(ball&&isFinite(ball.x)&&isFinite(ball.y)){ ball.vy+=G_*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; ball.rot+=ball.vx*.004*dt*60; ball.life+=dt; }
    const all=ball?bodies.concat([ball]):bodies;
    for(let it=0;it<4;it++){
      for(const b of all){
        const pts=b===ball?[{x:ball.x,y:ball.y,r:13}]:rbPts(b);
        for(const p of pts){
          // shelf plane
          if(p.x>this.SHELFL&&p.x<this.SHELFR&&p.y+p.r>this.SHELFY&&p.y<this.SHELFY+24){
            const pen=p.y+p.r-this.SHELFY;
            solveC(b,null,p.x,this.SHELFY,0,-1,pen,b===ball?.4:b.e,b===ball?.4:b.mu);
          }
          // shelf edges (so they can fall off)
          // floor
          if(p.y+p.r>this.FLOOR){
            const pen=p.y+p.r-this.FLOOR;
            solveC(b,null,p.x,this.FLOOR,0,-1,pen,b===ball?.42:.12,b===ball?.5:.8);
          }
          // back wall
          if(p.x+p.r>1214){ solveC(b,null,1214,p.y,1,0,p.x+p.r-1214,.25,.4); }
        }
      }
      // body-body
      for(let i=0;i<all.length;i++) for(let k=i+1;k<all.length;k++){
        const A_=all[i],B_=all[k];
        const pa=A_===ball?[{x:ball.x,y:ball.y,r:13}]:rbPts(A_);
        const pb=B_===ball?[{x:ball.x,y:ball.y,r:13}]:rbPts(B_);
        for(const p of pa) for(const q of pb){
          const dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy), rr2=p.r+q.r;
          if(d<rr2&&d>0.0001){
            const nx=dx/d, ny=dy/d, cx=q.x+nx*q.r, cy=q.y+ny*q.r;
            const isBall=(A_===ball||B_===ball);
            if(isBall&&!ball.hit){ ball.hit=true;
              const tgt=A_===ball?B_:A_;
              this.impact(tgt,cx,cy,Math.hypot(ball.vx,ball.vy)); }
            solveC(A_,B_,cx,cy,nx,ny,rr2-d,isBall?.3:.14,isBall?.4:.42);
          }
        }
      }
    }
    // off the shelf?
    for(const b of bodies){
      const flat=Math.abs(wrapA(b.a))>1.08;
      if(!b.down && (b.y>this.SHELFY+54 || b.x<this.SHELFL-6 || b.x>this.SHELFR+6 || flat)){
        b.down=true; this.knocked++; A.S.glass(.8);
        burst(b.x,b.y,8,{cols:["#e8f0ea","#bcd0c4"],type:"shard",smax:150,g:900,lmax:.7,rmax:4});
      }
    }
  },
  impact(tgt,x,y,sp){
    const hard=sp>620;
    if(tgt.lead){ A.S.thud(clamp(sp/900,.3,1)); shake(clamp(sp/160,2,9));
      burst(x,y,5,{cols:["#6b6257"],type:"dust",smax:80,g:200,lmax:.4,rmax:4});
      const low=y>this.SHELFY-30;
      if(low&&hard) note(BMAP.bottles.name,"Caught a bottom bottle low and hard — it slid across the shelf instead of tipping.");
      else note(BMAP.bottles.name,"Ball hit a bottom bottle dead on. Dull thud, barely a wobble. That thing is not empty.");
    } else { A.S.glass(1); note(BMAP.bottles.name,"The top bottle rings like glass and flies off easy."); }
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    if(this.state==="aim"){
      if(IN.down) this.aim={x:IN.x,y:IN.y};
      else if(this.aim){
        const dx=this.START.x-this.aim.x, dy=this.START.y-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,280)/280;
        if(s>.12){ const a=Math.atan2(dy,dx); this.throwBall(Math.cos(a)*s*1500,Math.sin(a)*s*1500); }
        this.aim=null;
      }
    } else if(this.state==="fly"){
      for(let k=0;k<3;k++) this.step(dt/3);
      const b=this.ball;
      let moving=false;
      for(const o of this.bots) if(!o.down&&(Math.abs(o.vx)>9||Math.abs(o.vy)>9||Math.abs(o.w)>.5)) moving=true;
      if(b&&(b.x>1260||b.y>this.FLOOR+60||b.life>4||(b.life>.9&&Math.abs(b.vx)<40&&b.y>this.FLOOR-20))) this.ball=null;
      if(!this.ball&&!moving){ this.settle+=dt; if(this.settle>.45){ this.settle=0; this.finishThrow(); } }
      else this.settle=0;
    } else if(this.state==="settleWin"){
      for(let k=0;k<2;k++) this.step(dt/2);
    }
  },
  finishThrow(){
    if(this.knocked>=3){ this.allDown(); return; }
    if(this.balls<=0){
      this.state="over";
      const t2=this.knocked===2?5:this.knocked===1?2:0;

        "Arm like that, you'd think it'd be easy."]),4200);
    } else this.state="aim";
  },
  allDown(){

    win(12,"cleared the stack");
    if(!G.prizes.bottles){
      G.prizes.bottles=true; A.S.prize(); flash(.6,"#dff6e6"); shake(12);

      save();

        "<p>Cold, heavy, and glazed the colour of old milk. It rattles when you shake it.</p><p>Something is sealed inside. He does not offer to open it.</p>",
        [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
    } else save();

    X.restore();

    // prize shelf left

  drawBottle(b,t){

SCN.darts={
  mood:"darts", back:true, bloom:.2,
  BX0:372, BY0:212, COLS:6, ROWS:4, DX:132, DY:94, HAND:{x:232,y:652},
  enter(){
    this.t=0; this.state="ready"; this.darts=0; this.pops=0; this.charge=0;
    this.fly=null; this.stuck=[]; this.msgT=0; this.msg="";
    this.makeBoard(); hint("Hold to steady your aim · release to throw · six pops wins");
    A.amb(.1,.05,.14);
    if(!G.plays.darts) say("Dull darts? Never. Sharpest on the pier. Six pops and the wall is yours.",5400);
  },
  makeBoard(){
    const cols=["#ff5aa8","#4de0ff","#ffd24d","#5fe08a","#c56bff","#ff7a45"];
    this.bals=[]; const n=this.COLS*this.ROWS;
    // a fixed number are properly inflated; which ones changes every play
    const taut=new Array(n).fill(false);
    const idx=shuf([...Array(n).keys()]).slice(0,9); idx.forEach(i=>taut[i]=true);
    for(let r=0;r<this.ROWS;r++) for(let c=0;c<this.COLS;c++){
      const i=r*this.COLS+c;
      this.bals.push({x:this.BX0+c*this.DX+ (r%2?14:0), y:this.BY0+r*this.DY,
        col:cols[(c+r)%6], taut:taut[i], pop:false, ph:rnd(TAU),
        rx:taut[i]?39:33, ry:taut[i]?47:39, wob:taut[i]?.3:1.5, sp:taut[i]?2.3:.95});
    }
  },
  play(){ const b=BMAP.darts;
    if(!canPlay(b)){ A.S.buzzer(); say("Five tickets a card."); return; }
    pay(b.cost); G.plays.darts=(G.plays.darts||0)+1; A.S.coin(2);
    this.darts=8; this.pops=0; this.stuck=[]; this.makeBoard(); this.state="aim"; save();
  },
  spread(){ return lerp(46,7,smooth(clamp(this.charge,0,1))); },
  throwDart(tx,ty){
    const sp=this.spread();
    const a=rnd(TAU), rr2=Math.sqrt(Math.random())*sp;
    const px=tx+Math.cos(a)*rr2, py=ty+Math.sin(a)*rr2;
    this.fly={x:this.HAND.x,y:this.HAND.y,tx:px,ty:py,u:0,rot:0};
    this.darts--; this.charge=0; this.state="fly"; A.S.dart();
  },
  resolve(x,y){
    let best=null,bd=1e9;
    for(const b of this.bals){ if(b.pop) continue;
      const dx=(x-b.x)/b.rx, dy=(y-b.y)/b.ry, d=dx*dx+dy*dy;
      if(d<1 && d<bd){ bd=d; best=b; } }
    if(!best){ A.S.thunk(); this.stuck.push({x,y,rot:rnd(.3,-.3),t:0}); return; }
    // RIG: the tip is dull. A taut balloon pops only on a near-centre hit.
    const centre=Math.sqrt(bd)<.62;
    if(best.taut && centre){
      best.pop=true; this.pops++; A.S.pop(1); shake(4);
      win(1,"pop");
      burst(best.x,best.y,26,{cols:[best.col,"#ffffff"],type:"shard",smax:340,g:700,lmax:.8,rmax:5});
      burst(best.x,best.y,10,{cols:[best.col],type:"spark",smax:200,g:300,lmax:.5,rmax:3});
      this.stuck.push({x,y,rot:rnd(.25,-.25),t:0});
      note(BMAP.darts.name,"Popped one dead centre. It was one of the tight, glossy ones.");
      this.msg="POP"; this.msgT=.9;
      if(this.pops>=6) this.grand();
    } else if(best.taut){
      A.S.rubber(); this.stuck.push({x,y,rot:rnd(.9,.4),t:0,slid:true});
      best.ph+=1.4;
      note(BMAP.darts.name,"Clipped the shoulder of a balloon and the dart just skated off. Tip's blunt.");
      this.msg="SKATED OFF"; this.msgT=.9;
    } else {
      A.S.rubber(); best.ph+=2.2;
      this.stuck.push({x:x+rnd(16,-16),y:y+rnd(26,10),rot:rnd(1.4,.8),t:0,drop:true});
      note(BMAP.darts.name,"Dart hit square on and the balloon just dented and shoved it away. Barely any air in it.");
      this.msg="BOUNCED"; this.msgT=.9;
    }
  },
  grand(){
    if(G.prizes.darts) return;

    if(this.fly){ const f=this.fly, u=smooth(f.u);

        this.msg==="POP"?"#ffd24d":"#e0332c",1.1); X.restore(); }
  },
  drawBalloon(b,t){
    if(b.pop){
      X.save(); X.globalAlpha=.55; X.translate(b.x,b.y+b.ry*.7);
      X.strokeStyle=b.col; X.lineWidth=2.4;

      return;
    }
    const w=Math.sin(t*b.sp+b.ph)*b.wob;
    X.save(); X.translate(b.x,b.y); X.rotate(w*.05);
    const rx=b.rx*(1+w*.012), ry=b.ry*(1-w*.012);

    X.strokeStyle="rgba(240,230,210,.4)"; X.lineWidth=1;
    X.beginPath(); X.moveTo(0,ry); X.quadraticCurveTo(w*4,ry+18,0,ry+34); X.stroke();

    g.addColorStop(0,"#ffffff"); g.addColorStop(.18,b.col); g.addColorStop(.75,b.col);
    g.addColorStop(1,"rgba(0,0,0,.55)");
    X.fillStyle=g; X.beginPath(); X.ellipse(0,0,rx,ry,0,0,TAU); X.fill();
    if(!b.taut){ // slack: soft dimple, matte, broad smeared highlight
      X.save(); X.globalAlpha=.22; X.fillStyle="#000";
      X.beginPath(); X.ellipse(rx*.22,ry*.1,rx*.62,ry*.46,-.4,0,TAU); X.fill();
      X.beginPath(); X.ellipse(-rx*.1,ry*.42,rx*.5,ry*.26,.2,0,TAU); X.fill(); X.restore();
      X.globalAlpha=.22; X.fillStyle="#fff";
      X.beginPath(); X.ellipse(-rx*.28,-ry*.3,rx*.46,ry*.34,-.5,0,TAU); X.fill(); X.globalAlpha=1;
      X.strokeStyle="rgba(0,0,0,.2)"; X.lineWidth=1.4;
      X.beginPath(); X.ellipse(0,0,rx,ry,0,0,TAU); X.stroke();
    } else {      // taut: one tight, hard specular dot and a crisp rim
      X.globalAlpha=1; X.fillStyle="#fff";
      X.beginPath(); X.ellipse(-rx*.36,-ry*.44,rx*.13,ry*.085,-.5,0,TAU); X.fill();
      X.globalAlpha=.34;
      X.beginPath(); X.ellipse(rx*.42,ry*.28,rx*.13,ry*.22,.4,0,TAU); X.fill();
      X.globalAlpha=1;
      X.strokeStyle="rgba(255,255,255,.4)"; X.lineWidth=1.2;
      X.beginPath(); X.ellipse(0,0,rx-1,ry-1,0,0,TAU); X.stroke();
    }
    X.fillStyle=b.col; X.beginPath();
    X.moveTo(-5,ry-2); X.lineTo(5,ry-2); X.lineTo(0,ry+7); X.closePath(); X.fill();
    X.restore();
  },
  drawDart(x,y,rot,a=1,s=1){
    X.save(); X.globalAlpha=a; X.translate(x,y); X.rotate(rot+Math.PI); X.scale(s,s);
    X.fillStyle="#d8d2c4"; X.beginPath(); X.moveTo(0,0); X.lineTo(11,-2.6); X.lineTo(11,2.6); X.closePath(); X.fill();
    X.fillStyle="#2c2a30"; rr(10,-2.4,17,4.8,2); X.fill();
    X.fillStyle="#b53a2a"; rr(25,-3.2,7,6.4,1.5); X.fill();

    X.beginPath(); X.moveTo(30,0); X.lineTo(41,-6); X.lineTo(39,0); X.lineTo(41,6); X.closePath(); X.fill();
    X.fillStyle="rgba(255,255,255,.35)"; rr(12,-2.2,12,1.6,1); X.fill();
    X.restore(); X.globalAlpha=1;
  }
};

  strike(){
    // RIG: a rubber dampener sits under the middle of the pad; the worn patch
    // left of centre sits directly over the linkage.
    const p=this.pos;                       // -1 .. 1 across the pad
    const inDead=Math.abs(p)<.2;
    const inSweet=Math.abs(p+.6)<.4;
    let mult=inDead?.55:inSweet?1.7:.78;
    const force=this.power*mult;
    this.lastDead=inDead; this.lastSweet=inSweet;
    this.h=0; this.hVel=force*1560; this.peak=0; this.hammer=1;
    A.S.swing();
    setTimeout(()=>{
      if(inDead){ A.S.dead(); shake(5); }
      else { A.S.hammer(inSweet?1.15:.9); A.S.tok(inSweet?1:.6); shake(inSweet?11:8); }
      burst(this.PADX+p*74,this.PADY,inDead?5:14,{cols:inDead?["#6b6257"]:["#ffd24d","#fff3c8"],
        type:inDead?"dust":"spark",smax:inDead?90:280,g:600,lmax:.6,rmax:4});
    },0);
    this.state="fly"; this.tries++;
    if(inDead) note(BMAP.striker.name,"Hit the middle of the pad. Dead, soft thud — like hitting a pillow. Puck barely moved.");
    else if(inSweet) note(BMAP.striker.name,"Hit the worn patch left of centre. Sharp metal CLANG and the puck flew.");
    else note(BMAP.striker.name,"Hit off to the side. Solid enough, but not the same ring as the worn spot.");
  },
  update(dt){
    this.t+=dt; this.showT=Math.max(0,this.showT-dt);
    this.hammer=Math.max(0,this.hammer-dt*2.6);

    if(this.state==="power"){
      this.meter+=this.mdir*dt*.66;
      if(this.meter>1){ this.meter=1; this.mdir=-1; } if(this.meter<0){ this.meter=0; this.mdir=1; }
      if(IN.justUp||IN.justKeys.has(" ")){ this.power=this.meter; this.state="place";
        this.meter=0; this.mdir=1; A.S.ratchet(1.2); }
    } else if(this.state==="place"){
      this.meter+=this.mdir*dt*.52;
      if(this.meter>1){ this.meter=1; this.mdir=-1; } if(this.meter<0){ this.meter=0; this.mdir=1; }
      if(IN.justUp||IN.justKeys.has(" ")){ this.pos=this.meter*2-1; A.S.ratchet(1.2); this.strike(); }

      this.h+=this.hVel*dt; this.hVel-=1750*dt;

    // hammer

    const ha=this.state==="fly"?lerp(-2.3,.25,clamp(1-this.hammer,0,1)):(-2.1+Math.sin(t*1.3)*.05);
    X.translate(TX-206,this.PADY-56); X.rotate(ha);

    X.beginPath(); X.moveTo(0,0); X.lineTo(158,0); X.stroke();
    X.fillStyle="#3a3630"; rr(152,-16,36,32,4); X.fill();
    X.fillStyle="#57524a"; rr(152,-16,36,13,4); X.fill();
    X.restore();
    // ---- meters ----
    X.textAlign="center";
    if(this.state==="power"||this.state==="place"){
      const isP=this.state==="power";
      const mx=190, my=isP?420:492, mw=320, mh=30;

      X.fillStyle="#1a140e"; rr(mx,my,mw,mh,4); X.fill();
      if(isP){ const lg=X.createLinearGradient(mx,0,mx+mw,0);
        lg.addColorStop(0,"#3a6b3a"); lg.addColorStop(.6,"#c9a227"); lg.addColorStop(1,"#e0332c");
        X.fillStyle=lg; rr(mx+2,my+2,(mw-4)*this.meter,mh-4,3); X.fill();
      } else {
        for(let i=0;i<30;i++){ X.fillStyle=i%2?"rgba(255,255,255,.05)":"rgba(255,255,255,.02)";
          X.fillRect(mx+2+i*(mw-4)/30,my+2,(mw-4)/30,mh-4); }
        X.fillStyle="#f0e0b0"; X.fillRect(mx+2+(mw-4)*this.meter-2,my+2,5,mh-4);
        X.fillStyle="rgba(255,181,69,.9)"; X.beginPath();
        X.moveTo(mx+2+(mw-4)*this.meter,my-4); X.lineTo(mx-4+(mw-4)*this.meter,my-12);
        X.lineTo(mx+8+(mw-4)*this.meter,my-12); X.closePath(); X.fill();
      }
      X.strokeStyle="rgba(255,255,255,.25)"; X.lineWidth=1.4; rr(mx,my,mw,mh,4); X.stroke();
      X.fillStyle="rgba(240,220,190,.6)"; X.font="italic 13px Georgia,serif";
