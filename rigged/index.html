        X.fillText("LEFT EDGE",mx+34,my+mh+34); X.fillText("RIGHT EDGE",mx+mw-40,my+mh+34); }
    }
    if(this.state==="power"||this.state==="place"||this.state==="fly"||this.state==="over"){
      X.fillStyle="rgba(240,220,190,.8)"; X.font="600 13px 'Rockwell',Georgia,serif";
      X.fillText("SWING  "+Math.round(this.power*100)+"%",350,394);
      if(this.state!=="power") X.fillText("HIT  "+(this.pos<0?"LEFT ":"RIGHT ")+Math.abs(Math.round(this.pos*100))+"%",350,414);
    }
    if(this.showT>0){ X.save(); X.globalAlpha=clamp(this.showT,0,1);
      signText(this.shown,350,212,52,"#fff0c8","#ff8a1e",1.1); X.restore(); }
    // hud
    if(this.state==="ready"||this.state==="over"||this.state==="won"){

      X.fillText(this.state==="ready"?"One swing, five tickets.":"Best so far: "+Math.round(this.best*100)+"%",
        350,612);
      if(button(250,628,200,36,this.state==="ready"?"PAY 5 TICKETS":"SWING AGAIN (5 TIX)",
        {font:"600 13px",off:!canPlay(BMAP.striker)})){ this.reset(); this.play(); }
    }
  }
};


/* ================================================================
   BOOTH 6 — WHEEL O' FORTUNE
   ================================================================ */
const WSEGS=[
  {v:2,c:"#8e1d2a"},{v:0,c:"#123a5c"},{v:3,c:"#8e1d2a"},{v:1,c:"#123a5c"},
  {v:5,c:"#8e1d2a"},{v:0,c:"#123a5c"},{v:2,c:"#8e1d2a"},{v:8,c:"#123a5c"},
  {v:-1,c:"#c9a227"},  // JACKPOT
  {v:0,c:"#123a5c"},{v:3,c:"#8e1d2a"},{v:1,c:"#123a5c"},
  {v:6,c:"#8e1d2a"},{v:0,c:"#123a5c"},{v:2,c:"#8e1d2a"},{v:4,c:"#123a5c"}
];
const JACK=8, NSEG=16;
SCN.wheel={
  mood:"wheel", back:true, bloom:.42,
  CX:840, CY:352, R:250,
  enter(){
    this.t=0; this.state="ready"; this.ang=rnd(TAU); this.vel=0; this.meter=0; this.mdir=1;
    this.locked=0; this.magnet=0; this.magHum=null; this.dim=0; this.result=null;
    this.peg=0; this.fc=-1; this.showT=0; this.msg=""; this.spins=G.best.wheelSpins||0;
    hint("Click to lock the spin strength");
    A.amb(.1,.06,.16);
    if(!G.plays.wheel) say("One spin, one destiny. The wheel does not lie. The wheel cannot lie.",5400);
  },
  exit(){ if(this.magHum){this.magHum.stop(); this.magHum=null;} },
  segFor(ang){ // which segment sits under the top pointer for a given wheel angle
    const a=((-ang-Math.PI/2)%TAU+TAU)%TAU;
    return (Math.floor(a/(TAU/NSEG))%NSEG+NSEG)%NSEG;
  },
  segAt(){ return this.segFor(this.ang); },
  predict(p){ // the honest forecast: no magnet in the maths
    let v=4.2+p*15.5, a=this.ang;
    for(let i=0;i<1200&&v>0;i++){ const dt=1/60, drag=1.35+v*.085;
      v=Math.max(0,v-drag*dt); a+=v*dt; }
    return a;
  },
  jackWindow(){ // how far the pointer is from the jackpot wedge, in segments
    const segA=(JACK+.5)*(TAU/NSEG);
    const ptr=((-this.ang-Math.PI/2)%TAU+TAU)%TAU;
    return wrapA(ptr-segA)/(TAU/NSEG);
  },
  play(){ const b=BMAP.wheel;
    if(!canPlay(b)){ A.S.buzzer(); say("Four tickets. Cheapest game on the pier."); return; }
    pay(b.cost); G.plays.wheel=(G.plays.wheel||0)+1; A.S.coin(2);
    this.state="power"; this.meter=0; this.mdir=1; this.result=null; this.fc=-1; save();
  },
  spin(p){
    this.locked=p; this.fcLock=this.fc; this.fc=-1; this.vel=4.2+p*15.5; this.state="spin"; this.magnet=0;
    A.S.ratchet(1.4); A.S.whoosh(1);
    if(!this.magHum) this.magHum=A.S.magnet();
  },
  update(dt){
    this.t+=dt; this.showT=Math.max(0,this.showT-dt);
    this.dim=lerp(this.dim,this.magnet>0?1:0,dt*10);
    if(this.state==="power"){
      this.meter+=this.mdir*dt*1.15;
      if(this.meter>1){ this.meter=1; this.mdir=-1; } if(this.meter<0){ this.meter=0; this.mdir=1; }
      this.fc=this.segFor(this.predict(this.meter));
      if(IN.justUp||IN.justKeys.has(" ")) this.spin(this.meter);
    } else if(this.state==="spin"){
      // deterministic friction
      let drag=1.35+this.vel*0.085;
      // RIG: an electromagnet grabs the rim whenever the jackpot comes past slowly
      const jd=Math.abs(this.jackWindow());
      const inWin=jd<1.05 && this.vel<2.6;
      if(inWin){ drag+=3.0; this.magnet=1;
        if(this.magHum) this.magHum.gain(.055);
        if(!this._notedMag){ this._notedMag=true;
          note(BMAP.wheel.name,"Every time the jackpot came round slow, the lights dipped and something started humming."); }
      } else { this.magnet=0; if(this.magHum) this.magHum.gain(0); }
      const prev=this.ang;
      this.vel=Math.max(0,this.vel-drag*dt);
      this.ang+=this.vel*dt;
      // peg clicks
      const step=TAU/NSEG;
      if(Math.floor(this.ang/step)!==Math.floor(prev/step)){
        A.S.ratchet(clamp(this.vel/8,.15,1)); this.peg=1;
      }
      this.peg=Math.max(0,this.peg-dt*7);
      if(this.vel<=0.0001){ this.settle(); }
    }
  },
  settle(){
    if(this.magHum) this.magHum.gain(0);
    this.state="over"; this.magnet=0;
    const i=this.segAt(), seg=WSEGS[i];
    G.best.wheelSpins=(G.best.wheelSpins||0)+1;
    if(seg.v===-1){ this.jackpot(); return; }
    this.msg=seg.v>0?("+"+seg.v):"NOTHING"; this.showT=2.4;
    if(seg.v>0){ win(seg.v,"the wheel"); A.S.ding(); }
    else { A.S.buzzer(); }
    const jd=Math.abs(this.jackWindow());
    if(jd<1.2) note(BMAP.wheel.name,"Stopped one notch short of the jackpot again. It slowed down hard right at the end.");
    if(jd<1.2) say(pick(["Agh! One click! One!","The wheel giveth. Mostly it taketh.",
      "So close you could taste it."]),4000);
    save();
  },
  jackpot(){
    this.msg="JACKPOT"; this.showT=4; A.S.prize(); flash(.6,"#ffe6a0"); shake(14);
    win(30,"JACKPOT");
    for(let i=0;i<110;i++) spawn({x:rnd(VW),y:rnd(-40,-300),vx:rnd(60,-60),vy:rnd(220,60),
      g:120,max:rnd(4,2),r:rnd(7,3),type:"confetti",col:pick(["#ffd24d","#39e0ff","#fff"]),drag:.995});
    if(!G.prizes.wheel){
      G.prizes.wheel=true;
      note(BMAP.wheel.name,"WON: the jackpot. Aimed a notch PAST it and let the brake drag me back on.");
      save();
      setTimeout(()=>modal("THE JACKPOT CROWN","GRAND PRIZE",
        "<p>Gold paint over tin, and one real stone in the front of it.</p><p>He hands it over with the flat, careful face of a man doing arithmetic.</p>",
        [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1200);
    } else save();
  },
  draw(t){
    const dim=1-this.dim*.32;
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#101c2a"); g.addColorStop(.5,"#16232e"); g.addColorStop(1,"#080c10");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    woodBoards(0,40,VW,640,11,.28);
    X.fillStyle=`rgba(6,10,16,${.45+this.dim*.14})`; X.fillRect(0,0,VW,VH);
    // bulb arch over the booth (dims when the magnet bites)
    const arc=[];
    for(let i=0;i<=22;i++){ const u=i/22, x=lerp(180,1240,u), y=120-Math.sin(u*Math.PI)*64;
      arc.push({x,y}); }
    X.strokeStyle="rgba(20,16,12,.9)"; X.lineWidth=3;
    X.beginPath(); arc.forEach((p,i)=>i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y)); X.stroke();
    arc.forEach((p,i)=>bulb(p.x,p.y,3.4,i%3===0?"#ffd24d":i%3===1?"#39e0ff":"#ff6b6b",1.5,
      dim*(.55+.45*Math.sin(t*3-i*.5))));
    // banner
    X.fillStyle="#123a5c"; X.beginPath(); X.moveTo(120,44); X.lineTo(560,44);
    X.lineTo(560,96); X.lineTo(340,110); X.lineTo(120,96); X.closePath(); X.fill();
    X.strokeStyle="rgba(180,230,255,.3)"; X.lineWidth=2; X.stroke();
    signText("ONE SPIN, ONE DESTINY",340,70,23,"#e6f6ff","#39e0ff",.85*dim);
    // the wheel
    const CX=this.CX, CY=this.CY, R=this.R;
    X.save(); X.translate(CX,CY);
    X.fillStyle="rgba(0,0,0,.5)"; X.beginPath(); X.arc(6,10,R+14,0,TAU); X.fill();
    // rim
    const rim=X.createRadialGradient(-R*.3,-R*.3,R*.7,0,0,R+16);
    rim.addColorStop(0,"#6b5a2a"); rim.addColorStop(.7,"#d8c089"); rim.addColorStop(1,"#5c4c22");
    X.fillStyle=rim; X.beginPath(); X.arc(0,0,R+14,0,TAU); X.fill();
    X.save(); X.rotate(this.ang);
    for(let i=0;i<NSEG;i++){
      const a0=i*(TAU/NSEG), a1=(i+1)*(TAU/NSEG), s=WSEGS[i];
      const gg=X.createRadialGradient(0,0,R*.2,0,0,R);
      const isJ=s.v===-1;
      gg.addColorStop(0,isJ?"#fff0b0":s.c); gg.addColorStop(1,isJ?"#c9a227":s.c);
      X.fillStyle=gg;
      X.beginPath(); X.moveTo(0,0); X.arc(0,0,R,a0,a1); X.closePath(); X.fill();
      X.strokeStyle="rgba(0,0,0,.35)"; X.lineWidth=1.4; X.stroke();

        X.fillText("POT",0,10); }
      else { X.fillStyle= s.v===0?"rgba(235,240,250,.55)":"#f4ecd4";
        X.font="900 30px 'Rockwell',Georgia,serif"; X.fillText(s.v===0?"—":String(s.v),0,0); }

    if(this.state==="power"&&this.fc>=0){

    for(let i=0;i<NSEG;i++){ const a=i*(TAU/NSEG);

      X.beginPath(); X.arc(R+3,0,4.6,0,TAU); X.fill();
      X.fillStyle="rgba(0,0,0,.3)"; X.beginPath(); X.arc(R+4.4,1.4,4.6,0,TAU); X.fill(); X.restore(); }
    X.restore();
    // hub
    const hub=X.createRadialGradient(-8,-8,3,0,0,34);
    hub.addColorStop(0,"#fff4cf"); hub.addColorStop(.5,"#d8c089"); hub.addColorStop(1,"#6b5a2a");

    X.fillStyle="#cfe6ff"; X.beginPath(); X.ellipse(-R*.3,-R*.35,R*.5,R*.22,-.7,0,TAU); X.fill(); X.restore();

    // pointer

    const flick=this.peg*10*(this.state==="spin"?1:0);
    X.rotate(flick*.04);
    X.fillStyle="#e8e0cc";
    X.beginPath(); X.moveTo(0,40); X.lineTo(-12,0); X.lineTo(12,0); X.closePath(); X.fill();

      X.fillStyle="#e6f6ff"; X.font="700 16px 'Rockwell',Georgia,serif";
      X.fillText(Math.round(this.meter*100)+"%",mx+mw/2,my+mh+26);
      X.fillStyle="rgba(200,230,255,.6)"; X.font="italic 12px Georgia,serif";

function wrapText(txt,cx,y,maxW,lh){
  const words=txt.split(" "); let line="", yy=y;
  for(const w of words){ const test=line?line+" "+w:w;
    if(X.measureText(test).width>maxW && line){ X.fillText(line,cx,yy); yy+=lh; line=w; }
    else line=test; }
  if(line) X.fillText(line,cx,yy);
}

/* ================================================================
   BACK ROW 2 — THE DUCK POND
   ================================================================ */
SCN.ducks={
  mood:"claw", back:true, bloom:.34,
  PL:180, PR:1100, PY:420,
  enter(){
    this.t=0; this.state="ready"; this.streak=G.best.duckStreak||0; this.msgT=0; this.msg="";
    this.lifted=null; this.liftT=0; this.picked=-1; this.make();
    hint("Pick a duck · the number is underneath");
    A.amb(.14,.06,.1);
    if(!G.plays.ducks) say("Every duck a winner! Some of 'em are just winnier than others.",5200);
  },
  make(){
    this.ducks=[];
    const wins=shuf([...Array(9).keys()]).slice(0,2);
    for(let i=0;i<9;i++){
      const w=wins.includes(i);
      this.ducks.push({i,win:w, x:this.PL+40+i*((this.PR-this.PL-80)/8)+rnd(14,-14),
        ph:rnd(TAU), sp:w?.4:1.0, amp:w?.9:3.2, sink:w?6.5:0,
        drift:(w?.32:.55)*(Math.random()<.5?-1:1), num:w?rint(20,40):rint(1,6), gone:false});
    }
  },
  play(){ const b=BMAP.ducks;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets a duck."); return; }
    pay(b.cost); G.plays.ducks=(G.plays.ducks||0)+1; A.S.coin(2);
    this.make(); this.state="pick"; this.lifted=null; this.picked=-1; save();
  },
  take(d){
    if(this.state!=="pick") return;
    this.state="lift"; this.liftT=0; this.lifted=d; this.picked=d.i;
    A.S.bounce(.5,0); A.S.rubber();
    if(d.win){
      this.streak++; G.best.duckStreak=this.streak;
      win(12,"a heavy one"); this.msg="WINNER  "+d.num; this.msgT=2.2; A.S.sparkle();
      note(BMAP.ducks.name,"That one was a winner — it sat lower in the water and hardly bobbed at all.");
      if(!G.prizes.ducks) this.grand();
      if(this.streak>=3) perfect("ducks");
    } else {
      this.streak=0; G.best.duckStreak=0;
      win(1,"number "+d.num); this.msg="NUMBER "+d.num; this.msgT=2.0; A.S.buzzer();
      note(BMAP.ducks.name,"A light one. It rode high and bobbed about like a cork.");
      say(pick(["Every duck a winner! That one's a small winner.",
        "Ooh, low number. Bad luck.","They all look the same, don't they."]),4000);
    }
    save();
  },
  grand(){
    G.prizes.ducks=true; A.S.prize(); flash(.5,"#ffe6a8"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#ffd24d","#5fe08a","#fff"]),drag:.995});
    note(BMAP.ducks.name,"WON: a winning duck. The heavy ones ride low.");
    save();
    setTimeout(()=>modal("THE LEAD DUCK","BACK ROW PRIZE",
      "<p>It weighs as much as a house brick and there is a number 40 stamped into its belly.</p><p>It has never floated in its life.</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    for(const d of this.ducks){ if(d.gone) continue;
      d.x+=d.drift*28*dt;
      if(d.x<this.PL+34){ d.x=this.PL+34; d.drift*=-1; }
      if(d.x>this.PR-34){ d.x=this.PR-34; d.drift*=-1; }
    }
    if(this.state==="lift"){ this.liftT+=dt;
      if(this.liftT>2.3){ this.state="ready"; if(this.lifted) this.lifted.gone=true; this.lifted=null; } }
    if(this.state==="pick"&&IN.justUp&&dist(IN.downX,IN.downY,IN.x,IN.y)<26){
      for(const d of this.ducks){ if(d.gone) continue;
        if(dist(IN.x,IN.y,d.x,this.PY-8+d.sink)<30){ this.take(d); break; } }
    }
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#13201e"); g.addColorStop(.5,"#182a26"); g.addColorStop(1,"#0a100f");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    woodBoards(0,60,VW,600,21,.3);
    X.fillStyle="rgba(6,12,10,.42)"; X.fillRect(0,0,VW,VH);
    // banner
    X.fillStyle="#1d5240"; X.beginPath(); X.moveTo(320,50); X.lineTo(960,50);
    X.lineTo(960,100); X.lineTo(640,114); X.lineTo(320,100); X.closePath(); X.fill();
    X.strokeStyle="rgba(180,255,220,.3)"; X.lineWidth=2; X.stroke();
    signText("EVERY DUCK A WINNER",640,78,25,"#e6fff0","#5fe08a",.9);
    for(let i=0;i<4;i++){ const lx=320+i*200;
      bulb(lx,140,3.4,"#ffe6b0",1.5,.9+.1*Math.sin(t*6+i));
      lightCone(lx,142,Math.PI/2,.5,320,"rgba(255,220,160,.35)",.05); }
    // trough
    const PL=this.PL,PR=this.PR,PY=this.PY;
    X.fillStyle="#2a2018"; rr(PL-26,PY-66,PR-PL+52,150,10); X.fill();
    X.fillStyle="#3d2f22"; rr(PL-18,PY-58,PR-PL+36,134,8); X.fill();
    X.save(); rr(PL-12,PY-52,PR-PL+24,122,6); X.clip();
    // water
    const wg=X.createLinearGradient(0,PY-52,0,PY+70);
    wg.addColorStop(0,"#1d5a72"); wg.addColorStop(.5,"#123c52"); wg.addColorStop(1,"#0a2030");
    X.fillStyle=wg; X.fillRect(PL-12,PY-52,PR-PL+24,122);
    X.save(); X.globalCompositeOperation="lighter";
    for(let r=0;r<9;r++){ X.strokeStyle="rgba(150,220,255,.13)"; X.lineWidth=1.3;
      X.beginPath();
      for(let k=0;k<=40;k++){ const x=PL-12+k*((PR-PL+24)/40);
        const y=PY-40+r*13+Math.sin(t*1.4+k*.42+r*.8)*2.4+Math.sin(t*.7+k*.2)*1.4;
        k?X.lineTo(x,y):X.moveTo(x,y); }
      X.stroke(); }
    X.restore();
    // reflections of the lamps
    X.save(); X.globalCompositeOperation="lighter"; X.globalAlpha=.16;
    for(let i=0;i<4;i++){ const lx=320+i*200;
      const rg=X.createRadialGradient(lx,PY+10,2,lx,PY+10,70);
      rg.addColorStop(0,"rgba(255,220,160,.7)"); rg.addColorStop(1,"rgba(0,0,0,0)");
      X.fillStyle=rg; X.fillRect(lx-70,PY-30,140,90); }
    X.restore();
    // ducks
    for(const d of this.ducks){ if(d.gone) continue;
      const bob=Math.sin(t*d.sp+d.ph)*d.amp;
      const y=PY-8+d.sink+bob;
      const hov=this.state==="pick"&&dist(IN.x,IN.y,d.x,y)<30;
      if(hov) hotBtn="duck";
      // waterline wake
      X.save(); X.globalAlpha=.5; X.strokeStyle="rgba(190,235,255,.5)"; X.lineWidth=1.2;
      X.beginPath(); X.ellipse(d.x,y+11,24+Math.sin(t*2+d.ph)*(d.win?1:3),4.5,0,0,TAU); X.stroke();
      X.restore();
      this.drawDuck(d.x,y,hov,t,d);
      // the part below the waterline
      X.save(); X.globalAlpha=.32; X.fillStyle="#e8c24d";
      X.beginPath(); X.ellipse(d.x,y+14,17,6,0,0,TAU); X.fill(); X.restore();
    }
    X.restore();
    // trough rim highlight
    X.strokeStyle="rgba(255,225,180,.16)"; X.lineWidth=2;
    rr(PL-18,PY-58,PR-PL+36,134,8); X.stroke();
    // the lifted duck
    if(this.lifted){
      const u=clamp(this.liftT*1.8,0,1), y=lerp(PY-8,190,smooth(u));
      X.save(); X.translate(this.lifted.x,y);
      X.strokeStyle="#6b5a3a"; X.lineWidth=3;
      X.beginPath(); X.moveTo(0,-14); X.lineTo(0,-120); X.stroke();
      X.rotate(Math.sin(this.liftT*5)*.12*(1-u));
      X.scale(1.5,1.5);
      this.drawDuck(0,0,false,t,this.lifted);
      // the number, stamped underneath
      if(u>=1){ X.save(); X.translate(0,16); X.scale(1,.5);
        X.fillStyle=this.lifted.win?"#ffe9a8":"#cfc3a4";
        X.beginPath(); X.ellipse(0,0,17,15,0,0,TAU); X.fill();
        X.restore();
        X.fillStyle="#3a2404"; X.font="900 15px 'Rockwell',Georgia,serif";
        X.textAlign="center"; X.textBaseline="middle"; X.fillText(String(this.lifted.num),0,17); }
      X.restore();
    }
    drawBarker(1196,682,1.55,t,this.state==="pick"?0:1);
    // HUD
    X.textAlign="center";
    if(this.state==="ready"){
      X.fillStyle="rgba(220,245,230,.85)"; X.font="italic 16px Georgia,serif";
      X.fillText(this.streak>0?`${this.streak} winners in a row.`:"Four tickets, one duck.",640,624);
      if(button(540,638,200,36,"PAY "+BMAP.ducks.cost+" TICKETS",{font:"600 13px",off:!canPlay(BMAP.ducks)})) this.play();
    } else if(this.state==="pick"){
      X.fillStyle="rgba(200,240,220,.7)"; X.font="italic 15px Georgia,serif";
      X.fillText("take one",640,616);
    }
    X.textAlign="left"; X.fillStyle="#bff0d4"; X.font="700 15px 'Rockwell',Georgia,serif";
    X.fillText("WINNERS IN A ROW  "+this.streak+" / 3",60,646);
    if(G.perfect.ducks){ X.fillStyle="#fff3cf"; X.fillText("PERFECT",60,672); }
    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";
      signText(this.msg,640,264,36,this.lifted&&this.lifted.win?"#fff3cf":"#d8e8e0",
        this.lifted&&this.lifted.win?"#ffd24d":"#5a7a70",1.1); X.restore(); }
  },
  drawDuck(x,y,hov,t,d){
    X.save(); X.translate(x,y);
    const body=hov?"#ffe27a":(d.win?"#f0c63f":"#ffd24d");
    const bg=X.createRadialGradient(-5,-6,2,0,0,22);
    bg.addColorStop(0,"#fff0b8"); bg.addColorStop(.6,body); bg.addColorStop(1,"#c9931a");
    X.fillStyle=bg;
    X.beginPath(); X.ellipse(0,2,19,11,0,0,TAU); X.fill();
    X.beginPath(); X.moveTo(-14,0); X.quadraticCurveTo(-22,-6,-16,-10); X.quadraticCurveTo(-8,-6,-6,0); X.fill();
    X.beginPath(); X.arc(9,-9,8.4,0,TAU); X.fill();
    X.fillStyle="#ff9022"; X.beginPath();
    X.moveTo(15,-9); X.lineTo(24,-7.5); X.lineTo(15,-5); X.closePath(); X.fill();
    X.fillStyle="#2a1a0c"; X.beginPath(); X.arc(11,-11.5,1.7,0,TAU); X.fill();
    X.fillStyle="rgba(255,255,255,.4)"; X.beginPath(); X.ellipse(-4,-3,7,3.4,-.5,0,TAU); X.fill();
    if(hov){ X.strokeStyle="rgba(190,255,220,.9)"; X.lineWidth=2;
      X.beginPath(); X.ellipse(0,0,26,17,0,0,TAU); X.stroke(); }
    X.restore();
  }
};


/* ================================================================
   BACK ROW 3 — CROOKED SIGHTS
   ================================================================ */
SCN.gallery={
  mood:"darts", back:true, bloom:.3,
  enter(){
    this.t=0; this.state="ready"; this.shots=0; this.hits=0; this.holes=[]; this.msgT=0; this.msg="";
    this.off={x:0,y:0}; this.kick=0; this.targets=[];
    this.makeTargets();
    hint("Click to fire · the sights are what they are");
    A.amb(.1,.05,.12);
    if(!G.plays.gallery) say("Straight barrel, true sights, tested this morning. Ten shots.",5200);
  },
  makeTargets(){
    this.targets=[];
    const rows=[{y:250,sp:54,r:30,v:2},{y:330,sp:-42,r:34,v:1},{y:410,sp:66,r:27,v:3}];
    rows.forEach((rw,ri)=>{ for(let i=0;i<5;i++)
      this.targets.push({x:260+i*180+ri*60,y:rw.y,r:rw.r,sp:rw.sp,v:rw.v,down:false,fall:0,ri}); });
  },
  play(){ const b=BMAP.gallery;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets for ten shots."); return; }
    pay(b.cost); G.plays.gallery=(G.plays.gallery||0)+1; A.S.coin(2);
    // RIG: the sights are bent. A fresh amount of bent, every round.
    this.off={x:rnd(32,14)*(Math.random()<.5?-1:1), y:rnd(22,8)*(Math.random()<.5?-1:1)};
    this.shots=10; this.hits=0; this.holes=[]; this.makeTargets(); this.state="fire"; save();
  },
  fire(){
    if(this.state!=="fire"||this.shots<=0) return;
    const hx=IN.x+this.off.x, hy=IN.y+this.off.y;
    this.shots--; this.kick=1;
    A.S.tok(1); A.S.thunk(); shake(3);
    burst(hx,hy,7,{cols:["#ffd9a0","#fff"],type:"spark",smax:160,g:500,lmax:.35,rmax:2.4});
    let hit=null;
    for(const tg of this.targets){ if(tg.down) continue;
      if(dist(hx,hy,tg.x,tg.y)<tg.r+9){ hit=tg; break; } }
    if(hit){ hit.down=true; this.hits++; win(hit.v,"target down");
      A.S.bell(); this.msg="HIT"; this.msgT=.7;
      burst(hit.x,hit.y,16,{cols:["#ffd24d","#fff3cf"],type:"spark",smax:240,g:500,lmax:.6,rmax:3});
      if(this.hits>=7 && !G.prizes.gallery) this.grand();
      if(this.hits>=10) perfect("gallery");
    } else {
      this.holes.push({x:hx,y:hy,t:0});
      this.msg="MISS"; this.msgT=.6;
      if(this.holes.length===1) note(BMAP.gallery.name,"First shot landed well off where the sights were pointed. The hole is over to one side.");
      if(this.holes.length===3) note(BMAP.gallery.name,"Three misses, all off in the same direction by the same distance. That is not my aim.");
    }
    if(this.shots<=0){ this.state="over";
      if(this.hits<8) say(pick(["Wind off the sea, that'll be it.",
        "Ten shots, and you fought the rifle every one of them.",
        "Sights are true. Says so on the tag."]),4200); }
  },
  grand(){
    G.prizes.gallery=true; A.S.prize(); flash(.5,"#ffd9a0"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#ff6b4d","#ffcf4d","#fff"]),drag:.995});
    note(BMAP.gallery.name,"WON: seven targets. Aim off by exactly as much as the rifle is off, in the other direction.");
    save();
    setTimeout(()=>modal("THE BENT RIFLE","BACK ROW PRIZE",
      "<p>You sight down the barrel and the world sits a hand's width to the left of where it ought to.</p><p>It has been like that since 1931, and it has never once been fixed.</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt); this.kick=Math.max(0,this.kick-dt*4);
    for(const tg of this.targets){
      if(tg.down){ tg.fall=Math.min(1,tg.fall+dt*5); continue; }
      tg.x+=tg.sp*dt;
      if(tg.x<230){ tg.x=230; tg.sp*=-1; } if(tg.x>1050){ tg.x=1050; tg.sp*=-1; }
    }
    for(const h of this.holes) h.t+=dt;
    if(this.state==="fire"&&IN.justUp&&dist(IN.downX,IN.downY,IN.x,IN.y)<26&&IN.y<520) this.fire();
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);

    // targets

    X.strokeStyle="rgba(255,200,140,.12)"; X.lineWidth=2; X.strokeRect(154,154,972,372);

    X.strokeStyle="rgba(255,190,130,.3)"; X.lineWidth=2; X.stroke();
    signText("TEN SHOTS · TEN TARGETS",640,80,25,"#ffe4c0","#ff6b4d",.9);
    for(let i=0;i<4;i++){ const lx=280+i*240;
      bulb(lx,146,3.4,"#ffcf87",1.5,.9+.1*Math.sin(t*6+i));
      lightCone(lx,148,Math.PI/2,.5,380,"rgba(255,200,140,.35)",.05); }
    // the rifle, chained to the counter
    X.save(); X.translate(640,640+this.kick*10); X.rotate(-.06-this.kick*.14);

SCN.alley={
  mood:"bottles", back:true, bloom:.34,
  L:470, R:810, TOP:180, BOT:600,
  enter(){
    this.t=0; this.state="ready"; this.balls=0; this.score=0; this.hundreds=0;
    this.ball=null; this.aim=null; this.msgT=0; this.msg=""; this.lip=0; this.pops=0;
    // the centre lane runs clear to the hundred - everything else is off to the sides
    this.holes=[
      {x:640,y:252,r:46,v:100,big:true},
      {x:512,y:300,r:31,v:50},{x:768,y:300,r:31,v:50},
      {x:492,y:398,r:33,v:20},{x:788,y:398,r:33,v:20},
      {x:552,y:476,r:35,v:10},{x:728,y:476,r:35,v:10},
      {x:640,y:430,r:30,v:5}
    ];
    hint("Drag back and let go · the hundred is in the middle");
    A.amb(.1,.05,.12);
    if(!G.plays.alley) say("Hundred in the middle. Easiest hole on the board, and the biggest.",5200);
  },
  play(){ const b=BMAP.alley;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets, nine balls."); return; }
    pay(b.cost); G.plays.alley=(G.plays.alley||0)+1; A.S.coin(2);
    this.balls=9; this.score=0; this.hundreds=0; this.state="aim"; save();
  },
  roll(vx,vy){
    this.ball={x:640,y:this.BOT-30,vx,vy,r:13,banked:0,life:0};
    this.balls--; this.state="roll"; A.S.whoosh(.7);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt); this.lip=Math.max(0,this.lip-dt*3);
    if(this.state==="aim"){
      if(IN.down) this.aim={x:IN.x,y:IN.y};
      else if(this.aim){
        const dx=640-this.aim.x, dy=(this.BOT-30)-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,190)/190;
        if(s>.1){ const a=Math.atan2(dy,dx); this.roll(Math.cos(a)*s*820,Math.sin(a)*s*820); }
        this.aim=null;
      }
    } else if(this.state==="roll"){
      const b=this.ball; b.life+=dt;
      for(let k=0;k<3;k++){
        const h=dt/3;
        b.vy+=150*h;                       // the ramp pulls it back down
        if(b.y<350) b.vx+=(640-b.x)*1.15*h; // the board is dished at the top - it gathers to the middle
        b.vx*=Math.pow(.70,h); b.vy*=Math.pow(.70,h);
        b.x+=b.vx*h; b.y+=b.vy*h;
        if(b.x-b.r<this.L){ b.x=this.L+b.r; b.vx=-b.vx*.7; b.banked++; A.S.bounce(.4,-.4); }
        if(b.x+b.r>this.R){ b.x=this.R-b.r; b.vx=-b.vx*.7; b.banked++; A.S.bounce(.4,.4); }
        if(b.y-b.r<this.TOP){ b.y=this.TOP+b.r; b.vy=-b.vy*.6; b.banked++; A.S.bounce(.5,0); }
        // holes: a ball only drops when it has lost its legs
        for(const ho of this.holes){
          if(dist(b.x,b.y,ho.x,ho.y)<ho.r-2){
            const sp=Math.hypot(b.vx,b.vy);
            // RIG: the hundred has a raised brass lip, so it wants the ball much slower
            const cap=ho.big?250:360;
            if(sp>cap){
              if(ho.big){ this.lip=1; A.S.tok(.8); this.pops++;
                b.vy=Math.abs(b.vy)*.5+60; b.vx*=.6;
                if(this.pops===2) note(BMAP.alley.name,"Ball dropped clean into the hundred and hopped straight back out. There is a lip round that one."); }
              continue;
            }
            this.sink(ho); return;
          }
        }
      }
      if(b.y>this.BOT-14||b.life>7){ this.miss(); }
    }
  },
  sink(ho){
    A.S.glass(.7); A.S.coin(1);
    this.score+=ho.v; win(Math.round(ho.v/10),ho.v+" hole");
    this.msg=String(ho.v); this.msgT=1.2;
    burst(ho.x,ho.y,14,{cols:["#c56bff","#fff"],type:"spark",smax:200,g:400,lmax:.6,rmax:3});
    if(ho.big){ this.hundreds++;
      note(BMAP.alley.name,"In the hundred at last — it only stays down if it arrives slow, off the rail.");
      if(!G.prizes.alley) this.grand();
      if(this.hundreds>=3) perfect("alley"); }
    this.ball=null; this.state=this.balls>0?"aim":"over";
  },
  miss(){
    A.S.thud(.4); this.ball=null; this.msg="BACK DOWN"; this.msgT=.8;
    this.state=this.balls>0?"aim":"over";
    if(this.state==="over"&&this.hundreds===0) say(pick(["Biggest hole on the board and nobody lands it.",
      "Roll it softer. Or harder. One of the two.","That's the game, friend."]),4200);
  },
  grand(){
    G.prizes.alley=true; A.S.prize(); flash(.5,"#d8b0ff"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#c56bff","#4de0ff","#fff"]),drag:.995});
    note(BMAP.alley.name,"WON: the hundred. Bank it off a rail so it arrives slow enough to drop.");
    save();
    setTimeout(()=>modal("THE HUNDRED CUP","BACK ROW PRIZE",
      "<p>A dented tin cup with HUNDRED punched into the side.</p><p>Inside, someone has scratched: <i>off the rail</i>.</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#1a1224"); g.addColorStop(.5,"#221830"); g.addColorStop(1,"#0b0812");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    woodBoards(0,60,VW,620,31,.32);
    X.fillStyle="rgba(8,6,14,.44)"; X.fillRect(0,0,VW,VH);
    // banner
    X.fillStyle="#3a1a52"; X.beginPath(); X.moveTo(330,44); X.lineTo(950,44);
    X.lineTo(950,92); X.lineTo(640,106); X.lineTo(330,92); X.closePath(); X.fill();
    X.strokeStyle="rgba(210,170,255,.3)"; X.lineWidth=2; X.stroke();
    signText("HUNDRED IN THE MIDDLE",640,70,24,"#f0e0ff","#c56bff",.9);
    // the board
    X.save();
    X.fillStyle="#241a2c"; rr(this.L-26,this.TOP-26,this.R-this.L+52,this.BOT-this.TOP+52,10); X.fill();
    const bg=X.createLinearGradient(0,this.TOP,0,this.BOT);
    bg.addColorStop(0,"#3a2a48"); bg.addColorStop(1,"#1d1526");
    X.fillStyle=bg; rr(this.L,this.TOP,this.R-this.L,this.BOT-this.TOP,6); X.fill();
    // rails
    X.fillStyle="#6b5a7a"; X.fillRect(this.L-12,this.TOP-12,12,this.BOT-this.TOP+24);
    X.fillRect(this.R,this.TOP-12,12,this.BOT-this.TOP+24);
    X.fillRect(this.L-12,this.TOP-12,this.R-this.L+24,12);
    X.fillStyle="rgba(255,230,255,.14)"; X.fillRect(this.L-12,this.TOP-12,4,this.BOT-this.TOP+24);
    // holes
    for(const ho of this.holes){
      X.fillStyle="#0a0710"; X.beginPath(); X.ellipse(ho.x,ho.y,ho.r,ho.r*.72,0,0,TAU); X.fill();
      X.strokeStyle=ho.big?"#d8b04d":"#8a7aa0"; X.lineWidth=ho.big?4:2.4;
      X.beginPath(); X.ellipse(ho.x,ho.y,ho.r,ho.r*.72,0,0,TAU); X.stroke();
      if(ho.big){ // the brass lip, catching the light
        X.save(); X.globalAlpha=.55+this.lip*.45;
        X.strokeStyle="#ffe9a8"; X.lineWidth=2.4;
        X.beginPath(); X.ellipse(ho.x,ho.y-2,ho.r+3,ho.r*.72+3,0,0,TAU); X.stroke();
        X.restore(); }
      X.fillStyle=ho.big?"#ffd24d":"rgba(230,215,245,.6)";
      X.font=(ho.big?"900 19px ":"700 14px ")+"'Rockwell',Georgia,serif";
      X.textAlign="center"; X.textBaseline="middle"; X.fillText(String(ho.v),ho.x,ho.y+ho.r*.72+14);
    }
    X.restore();
    // ball
    if(this.ball){ X.save(); X.translate(this.ball.x,this.ball.y);
      const bg2=X.createRadialGradient(-4,-5,2,0,0,14);
      bg2.addColorStop(0,"#ff9a88"); bg2.addColorStop(.6,"#b5301e"); bg2.addColorStop(1,"#5c1208");
      X.fillStyle=bg2; X.beginPath(); X.arc(0,0,13,0,TAU); X.fill();
      X.restore(); }
    // aiming
    if(this.state==="aim"){
      const sx=640, sy=this.BOT-30;
      X.save(); X.translate(sx,sy);
      const bg3=X.createRadialGradient(-4,-5,2,0,0,14);
      bg3.addColorStop(0,"#ff9a88"); bg3.addColorStop(.6,"#b5301e"); bg3.addColorStop(1,"#5c1208");
      X.fillStyle=bg3; X.beginPath(); X.arc(0,0,13,0,TAU); X.fill(); X.restore();
      if(this.aim){
        const dx=sx-this.aim.x, dy=sy-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,190)/190, a=Math.atan2(dy,dx);
        X.save(); X.setLineDash([4,7]); X.strokeStyle="rgba(210,180,255,.75)"; X.lineWidth=2.2;
        X.beginPath(); X.moveTo(sx,sy);
        X.lineTo(sx+Math.cos(a)*s*230,sy+Math.sin(a)*s*230); X.stroke(); X.restore();
        X.fillStyle="rgba(0,0,0,.6)"; rr(sx-58,sy+26,116,10,5); X.fill();
        X.fillStyle=`hsl(${lerp(280,320,s)},70%,62%)`; rr(sx-56,sy+28,112*s,6,3); X.fill();
      } else { X.fillStyle="rgba(220,200,240,.5)"; X.font="italic 13px Georgia,serif";
        X.textAlign="center"; X.fillText("drag back — release to roll",sx,sy+44); }

    // HUD
    X.textAlign="center";
    if(this.state==="ready"||this.state==="over"){
      X.fillStyle="rgba(230,220,245,.85)"; X.font="italic 16px Georgia,serif";
      X.fillText(this.state==="over"?`Scored ${this.score}. Hundreds: ${this.hundreds}.`:"Five tickets, nine balls.",640,650);
      if(button(540,662,200,34,this.state==="over"?"AGAIN ("+BMAP.alley.cost+" TIX)":"PAY "+BMAP.alley.cost+" TICKETS",
        {font:"600 13px",off:!canPlay(BMAP.alley)})) this.play();
    } else {
      X.textAlign="left"; X.fillStyle="#e0cfff"; X.font="700 16px 'Rockwell',Georgia,serif";

      X.textAlign="right"; X.fillText("SCORE  "+this.score+"   HUNDREDS  "+this.hundreds+" / 3",1210,650);
    }
    if(G.perfect.alley){ X.textAlign="left"; X.fillStyle="#fff3cf";
      X.font="700 13px 'Rockwell',Georgia,serif"; X.fillText("PERFECT",70,674); }
    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";

SCN.rings={
  mood:"bottles", back:true, bloom:.34,
  START:{x:250,y:560},
  enter(){
    this.t=0; this.state="ready"; this.left=0; this.on=0; this.aim=null; this.ring=null;
    this.msgT=0; this.msg=""; this.landed=[]; this.make();
    hint("Drag back and let go · get a ring over a neck");
    A.amb(.1,.05,.12);
    if(!G.plays.rings) say("Over the neck and the bottle's yours. Rings are regulation, I had them measured.",5400);
  },
  make(){
    this.bottles=[]; const n=7, chip=rint(0,n-1);
    for(let i=0;i<n;i++) this.bottles.push({
      x:640+(i-(n-1)/2)*78, y:470, chip:i===chip, ringed:false,
      neck:i===chip?9.5:13.2, tilt:rnd(.05,-.05) });
    this.landed=[];
  },
  play(){ const b=BMAP.rings;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets, five rings."); return; }
    pay(b.cost); G.plays.rings=(G.plays.rings||0)+1; A.S.coin(2);
    this.left=5; this.on=0; this.make(); this.state="aim"; save();
  },
  toss(vx,vy){
    this.ring={x:this.START.x,y:this.START.y,vx,vy,rot:0,vr:rnd(9,4)*(vx>0?1:-1),life:0,
      rx:20,settled:false,wob:0};
    this.left--; this.state="fly"; A.S.whoosh(.7);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    for(const l of this.landed) l.t+=dt;
    if(this.state==="aim"){
      if(IN.down) this.aim={x:IN.x,y:IN.y};
      else if(this.aim){
        const dx=this.START.x-this.aim.x, dy=this.START.y-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,190)/190;
        if(s>.12){ const a=Math.atan2(dy,dx); this.toss(Math.cos(a)*s*1180,Math.sin(a)*s*1180); }
        this.aim=null;
      }
    } else if(this.state==="fly"){
      const r=this.ring; r.life+=dt;
      r.vy+=1180*dt; r.vx*=Math.pow(.94,dt); r.x+=r.vx*dt; r.y+=r.vy*dt; r.rot+=r.vr*dt;
      // reaching the bottle line
      for(const b of this.bottles){
        if(b.ringed) continue;
        const neckY=b.y-46;
        if(r.y>neckY-6 && r.y<neckY+40 && Math.abs(r.x-b.x)<r.rx+6 && r.vy>0){
          const off=Math.abs(r.x-b.x);
          // RIG: the ring only clears a neck that has been chipped thinner
          if(off<14 && r.rx>b.neck+6.5){
            this.settle(b,r); return;
          } else if(off<20){
            // it catches, balances, and slides away
            A.S.glass(.5); r.vy=-90; r.vx=(r.x<b.x?-1:1)*rnd(180,80); r.vr*=1.6; r.wob=1;
            if(!b.chip) note(BMAP.rings.name,"Ring sat on the neck for a second, then slid off. It will not go over that glass.");
          }
        }
      }
      if(r.y>640){ this.landed.push({x:clamp(r.x,60,1220),y:648,rot:r.rot,t:0});
        A.S.rubber(); this.endToss(false); }
      else if(r.x<-40||r.x>1320||r.life>5) this.endToss(false);
    }
  },
  settle(b,r){
    b.ringed=true; this.on++; A.S.ding(); A.S.sparkle();
    win(6,"over the neck");
    this.msg="OVER"; this.msgT=1.4;
    burst(b.x,b.y-46,16,{cols:["#e8d8a0","#fff"],type:"spark",smax:200,g:400,lmax:.6,rmax:3});
    note(BMAP.rings.name,"That one went over clean. Its neck is chipped — thinner than the rest of them.");
    this.ring=null;
    if(!G.prizes.rings) this.grand();
    if(this.on>=5) perfect("rings");
    this.state=this.left>0?"aim":"over";
  },
  endToss(ok){
    this.ring=null;
    this.state=this.left>0?"aim":"over";
    if(this.state==="over"&&this.on===0) say(pick(["Regulation rings, regulation bottles.",
      "Close! They're all close.","Try the middle one. Everybody tries the middle one."]),4200);
  },
  grand(){
    G.prizes.rings=true; A.S.prize(); flash(.5,"#d8f0c8"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#5fe08a","#ffffff","#ffd24d"]),drag:.995});
    note(BMAP.rings.name,"WON: a ringer. Only the chipped bottle will take a ring.");
    save();
    setTimeout(()=>modal("THE CHIPPED BOTTLE","BACK ROW PRIZE",
      "<p>A green glass bottle with a neat bite taken out of the lip.</p><p>Every other bottle on that rail is a quarter-inch fatter, and always has been.</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#13201a"); g.addColorStop(.5,"#1a2a20"); g.addColorStop(1,"#0a100c");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    woodBoards(0,60,VW,620,41,.3);
    X.fillStyle="rgba(6,12,8,.44)"; X.fillRect(0,0,VW,VH);
    X.fillStyle="#1d4a30"; X.beginPath(); X.moveTo(330,44); X.lineTo(950,44);
    X.lineTo(950,92); X.lineTo(640,106); X.lineTo(330,92); X.closePath(); X.fill();
    X.strokeStyle="rgba(180,255,200,.3)"; X.lineWidth=2; X.stroke();
    signText("OVER THE NECK, IT'S YOURS",640,70,23,"#e6ffe8","#5fe08a",.9);
    for(let i=0;i<4;i++){ const lx=340+i*200;
      bulb(lx,132,3.4,"#e8ffd9",1.5,.9+.1*Math.sin(t*6+i));
      lightCone(lx,134,Math.PI/2,.5,360,"rgba(200,255,190,.32)",.05); }
    // the rail of bottles
    X.fillStyle="#2a2018"; X.fillRect(280,470,720,16);
    const rg=X.createLinearGradient(0,470,0,486);
    rg.addColorStop(0,"#6b5a3a"); rg.addColorStop(1,"#2a2018"); X.fillStyle=rg; X.fillRect(280,470,720,10);
    X.fillStyle="#1a1409"; X.fillRect(320,486,20,150); X.fillRect(940,486,20,150);
    for(const b of this.bottles) this.drawBottle(b,t);
    // rings on the floor
    for(const l of this.landed){ X.save(); X.globalAlpha=clamp(1-l.t*.1,.3,1);

    // flying ring
    if(this.ring){ const r=this.ring;
      X.save(); X.translate(r.x,r.y); X.rotate(r.rot);
      X.strokeStyle="#e8d8a0"; X.lineWidth=5.5;

    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";
      signText(this.msg,640,180,36,"#e6ffe8","#5fe08a",1.1); X.restore(); }
  },
  drawBottle(b,t){
    X.save(); X.translate(b.x,b.y); X.rotate(b.tilt);
    const h=86, w=30;
    const g=X.createLinearGradient(-w/2,0,w/2,0);

    g.addColorStop(.8,"#2d5c3a"); g.addColorStop(1,"#17361f");

    X.lineTo(-b.neck,-h); X.lineTo(b.neck,-h);
    X.lineTo(b.neck,-h*.7);
    X.quadraticCurveTo(w/2,-h*.62,w/2,-h*.48);
    X.lineTo(w/2,0); X.closePath(); X.fill();
    X.fillStyle="rgba(255,255,255,.3)"; X.fillRect(-w/2+5,-h*.62,3.4,h*.55);

SCN.pennies={
  mood:"wheel", back:true, bloom:.36,

    for(let i=0;i<26;i++) this.coins.push({
      x:rnd(this.R-40,this.L+40), y:rnd(this.LIP-16,this.BACK+50), r:15, vx:0, vy:0, gold:Math.random()<.25});
  },

    this.left=10; this.won=0; this.cleared=false; this.seed(); this.state="drop"; save();
  },
  pusherY(){
    // RIG: the stroke shortens the moment the shelf is loaded near the lip
    const near=this.coins.filter(c=>c.y>this.LIP-70).length;
    const want=near>=5?.42:(near>=3?.68:1);
    this.stroke=lerp(this.stroke,want,.02);

  },
  drop(x){
    if(this.left<=0) return;
    this.left--; A.S.coin(1);
    this.coins.push({x:clamp(x,this.L+20,this.R-20),y:this.BACK+16,r:15,vx:rnd(20,-20),vy:60,

  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    this.pushT+=dt*1.25;
    const py=this.pusherY();
    // coin physics: a shove from the pusher, separation, and the lip
    for(const c of this.coins){
      c.vy+=18*dt;
      if(c.y-c.r<py){ c.y=py+c.r; c.vy=Math.max(c.vy,42); }
      c.x+=c.vx*dt; c.y+=c.vy*dt;
      c.vx*=Math.pow(.02,dt); c.vy*=Math.pow(.05,dt);
      if(c.x<this.L+c.r){ c.x=this.L+c.r; c.vx=Math.abs(c.vx)*.4; }
      if(c.x>this.R-c.r){ c.x=this.R-c.r; c.vx=-Math.abs(c.vx)*.4; }
      if(c.fresh) c.fresh=Math.max(0,c.fresh-dt*2);
    }
    for(let it=0;it<3;it++)
      for(let i=0;i<this.coins.length;i++) for(let k=i+1;k<this.coins.length;k++){
        const a=this.coins[i],b=this.coins[k];
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), m=a.r+b.r-2;
        if(d<m&&d>.001){ const nx=dx/d, ny=dy/d, p=(m-d)*.5;
          a.x-=nx*p; a.y-=ny*p; b.x+=nx*p; b.y+=ny*p;
          const rel=(b.vy-a.vy)*ny+(b.vx-a.vx)*nx;
          if(rel<0){ a.vx+=nx*rel*.3; a.vy+=ny*rel*.3; b.vx-=nx*rel*.3; b.vy-=ny*rel*.3; } }
      }
    // over the lip
    for(let i=this.coins.length-1;i>=0;i--){ const c=this.coins[i];
      if(c.y-c.r>this.LIP){ this.coins.splice(i,1); this.won+=c.gold?3:1;

        burst(c.x,this.LIP+20,5,{cols:["#ffd24d"],type:"spark",smax:120,g:600,lmax:.4,rmax:2.4}); } }
    if(this.state==="drop"){
      if(!this.cleared && this.coins.length===0){ this.cleared=true;
        this.msg="SWEPT"; this.msgT=2.2; perfect("pennies");
        if(!G.prizes.pennies) this.grand(); }
      if(this.left<=0 && this.coins.every(c=>Math.abs(c.vy)<8)){

        if(this.won>=14 && !G.prizes.pennies) this.grand();
        else if(!this.cleared) say(pick(["So close. It's always so close.",
          "The pusher's tired tonight.","One more penny would've done it. It always would."]),4200);
      }
      if(IN.justUp&&IN.y<this.BACK+40&&IN.y>90&&dist(IN.downX,IN.downY,IN.x,IN.y)<26) this.drop(IN.x);
    }
    // a hidden stop bites
    if(this.stroke<.6&&this.noted<1){ this.noted=1;
      note(BMAP.pennies.name,"The pusher stopped coming all the way forward once the shelf filled up near the edge."); }
  },
  grand(){
    if(G.prizes.pennies) return;
    G.prizes.pennies=true; A.S.prize(); flash(.5,"#ffe6a8"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),

  },

    // cabinet
    X.fillStyle="#241c14"; rr(this.L-40,this.BACK-70,this.R-this.L+80,470,10); X.fill();

    const sg=X.createLinearGradient(0,this.BACK,0,this.LIP);

SCN.ladder={
  mood:"striker", dir:true, back:true, bloom:.36,
  RUNGS:12, TOPY:130, BOTY:620,
  enter(){
    this.t=0; this.state="ready"; this.rung=0; this.roll=0; this.w=0; this.last=0;
    this.fell=0; this.msgT=0; this.msg=""; this.climbs=0; this.noted=0; this.hand=1;
    hint("Click or press A / D to reach for the next rung — alternate sides");
    A.amb(.12,.06,.1);
    if(!G.plays.ladder) say("Twelve rungs and the bell. It's a rope ladder, not a staircase.",5200);
  },
  play(){ const b=BMAP.ladder;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets a climb."); return; }
    pay(b.cost); G.plays.ladder=(G.plays.ladder||0)+1; A.S.coin(2);
    this.rung=0; this.roll=rnd(.06,-.02); this.w=0; this.last=0; this.climbs++;
    this.state="climb"; save();
  },
  reach(side){
    if(this.state!=="climb") return;
    // a reach throws your weight to that side
    this.w += side*2.05;
    this.hand=side;
    if(side!==this.last){          // alternating hands is what actually climbs
      this.rung++; this.last=side; A.S.step(.6,side*.3); A.S.chain();
      if(this.rung>=this.RUNGS) this.ring();
    } else {                        // same hand twice: you steady yourself, you gain nothing
      A.S.rubber();
    }
  },
  ring(){
    this.state="won"; A.S.bell(); flash(.5,"#ffe8b0"); shake(12);
    win(16,"rang the rope bell");
    burst(640,this.TOPY,30,{cols:["#ffd24d","#fff6d8"],type:"spark",smax:380,g:400,lmax:1,rmax:4});
    note(BMAP.ladder.name,"Reached the bell. The ladder rolls one way on its own — you have to lean the other.");
    if(!G.prizes.ladder) this.grand();
    if(this.climbs===1) perfect("ladder");
    save();
  },
  fall(){
    this.state="fell"; this.fell=1; A.S.dead(); shake(9);
    this.msg="OFF"; this.msgT=1.6;
    if(this.noted<1){ this.noted=1;
      note(BMAP.ladder.name,"Came off the same side again. That ladder has a lean in it before you even touch it."); }
    say(pick(["Everybody goes off that side. Every single one.",
      "It's the rope. Ropes stretch.","Again? It's only six tickets."]),4200);
  },
  grand(){
    G.prizes.ladder=true; A.S.prize();

      "<p>Brass, green with salt, on a frayed loop of rope.</p><p>“That's been up there since my father,” he says. “He never rang it either.”</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  update(dt){

      const BIAS=-1.62;
      this.w += BIAS*dt;
      this.w += -this.roll*1.1*dt;          // the rope's own weak righting
      this.w *= Math.pow(.22,dt);
      this.roll += this.w*dt;
      if(Math.abs(this.roll)>1.15) this.fall();
      if(IN.justKeys.has("a")||IN.justKeys.has("arrowleft")) this.reach(-1);
      if(IN.justKeys.has("d")||IN.justKeys.has("arrowright")) this.reach(1);

      if(this.fell>1.8) this.state="over";
    }
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#1a1418"); g.addColorStop(.5,"#221a1e"); g.addColorStop(1,"#0b080a");

    X.strokeStyle="rgba(255,170,220,.3)"; X.lineWidth=2; X.stroke();

    X.fillStyle="#1d1a16"; X.fillRect(440,this.TOPY-30,400,16);
    X.fillStyle="#2a2620"; X.fillRect(444,this.TOPY-26,392,5);
    X.save(); X.translate(640,this.TOPY-34);
    const bg=X.createLinearGradient(-22,-20,22,18);
    bg.addColorStop(0,"#ffe98f"); bg.addColorStop(.4,"#d8a92a"); bg.addColorStop(1,"#8c6a10");
    X.fillStyle=bg; X.beginPath(); X.moveTo(-22,16); X.quadraticCurveTo(-19,-16,0,-22);
    X.quadraticCurveTo(19,-16,22,16); X.closePath(); X.fill();
    X.fillStyle="#8c7020"; X.fillRect(-25,14,50,6); X.restore();

/* ================================================================

SCN.pins={
  mood:"wheel", back:true, bloom:.4,
  L:420, R:860, TOP:170, BOT:560,
  enter(){
    this.t=0; this.state="ready"; this.left=0; this.jacks=0; this.disc=null;
    this.msgT=0; this.msg=""; this.lastDrop=G.best.pinDrop||null; this.trail=[]; this.noted=0;
    this.makeBoard();
    hint("Click along the top to drop · the middle slot is the hundred");
    A.amb(.1,.05,.14);
    if(!G.plays.pins) say("Straight down the middle for the jackpot. Couldn't be simpler.",5200);
  },
  makeBoard(){
    this.pins=[]; const rows=9, cx=(this.L+this.R)/2;
    for(let r=0;r<rows;r++){
      const n=6+(r%2), y=this.TOP+40+r*40, sp=(this.R-this.L)/(n+1);
      for(let i=0;i<n;i++){
        const x=this.L+sp*(i+1)+((r%2)?0:sp/2);
        // RIG: the two pins guarding the middle slot are fat brass ones
        const fat=(r===rows-1)&&Math.abs(x-cx)<70&&Math.abs(x-cx)>16;
        this.pins.push({x,y,r:fat?11.5:6,fat});
      }
    }
    this.slots=[];
    const sn=7, sw=(this.R-this.L)/sn;
    for(let i=0;i<sn;i++){
      const v=[5,10,25,100,25,10,5][i];
      this.slots.push({x:this.L+sw*i,w:sw,v,jack:v===100});
    }
  },
  play(){ const b=BMAP.pins;
    if(!canPlay(b)){ A.S.buzzer(); say(b.cost+" tickets, ten discs."); return; }
    pay(b.cost); G.plays.pins=(G.plays.pins||0)+1; A.S.coin(2);
    this.left=10; this.jacks=0; this.state="drop"; save();
  },
  drop(x){
    if(this.left<=0||this.disc) return;
    this.left--;
    // deterministic: the same column always does the same thing
    this.disc={x:clamp(x,this.L+16,this.R-16),y:this.TOP,vx:0,vy:0,r:11,hits:0,startX:x};
    this.trail=[]; A.S.coin(1);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    if(this.disc){
      const d=this.disc;
      for(let k=0;k<4;k++){
        const h=dt/4;
        d.vy+=900*h; d.vx*=Math.pow(.55,h);
        d.x+=d.vx*h; d.y+=d.vy*h;
        for(const p of this.pins){
          const dx=d.x-p.x, dy=d.y-p.y, dd=Math.hypot(dx,dy), m=d.r+p.r;
          if(dd<m&&dd>.0001){
            const nx=dx/dd, ny=dy/dd;
            d.x=p.x+nx*m; d.y=p.y+ny*m;
            const vn=d.vx*nx+d.vy*ny;
            d.vx-=1.42*vn*nx; d.vy-=1.42*vn*ny;
            d.vx+=nx*(p.fat?86:22);                 // fat pins throw it clear
            d.vy*=.72; d.hits++;
            A.S.ratchet(clamp(Math.abs(vn)/300,.1,.6));
            if(p.fat){ burst(p.x,p.y,4,{cols:["#ffe9a8"],type:"spark",smax:90,g:300,lmax:.3,rmax:2});
              if(this.noted<1){ this.noted=1;
                note(BMAP.pins.name,"Disc came off one of the two fat brass pins beside the middle slot and was thrown wide."); } }
          }
        }
        if(d.x<this.L+d.r){ d.x=this.L+d.r; d.vx=Math.abs(d.vx)*.5; }
        if(d.x>this.R-d.r){ d.x=this.R-d.r; d.vx=-Math.abs(d.vx)*.5; }
      }
      this.trail.push({x:d.x,y:d.y}); if(this.trail.length>90) this.trail.shift();
      if(d.y>this.BOT){ this.land(d); }
    }
    if(this.state==="drop"&&!this.disc&&IN.justUp&&IN.y<this.TOP+20&&IN.y>80
       &&dist(IN.downX,IN.downY,IN.x,IN.y)<26) this.drop(IN.x);
    if(this.state==="drop"&&this.left<=0&&!this.disc){ this.state="over";
      if(this.jacks===0) say(pick(["Straight down the middle, every time. Funny, that.",
        "The hundred's right there. It's the easiest one to aim at.",
        "Nearly. Everyone goes nearly."]),4200); }
  },
  land(d){
    const s=this.slots.find(sl=>d.x>=sl.x&&d.x<sl.x+sl.w)||this.slots[0];
    this.disc=null;
    win(Math.max(1,Math.round(s.v/5)),s.v+" slot");
    this.msg=String(s.v); this.msgT=1.4;
    A.S.glass(.6);
    burst(d.x,this.BOT+10,12,{cols:[s.jack?"#ffd24d":"#9fd8ff","#fff"],type:"spark",
      smax:200,g:420,lmax:.6,rmax:3});

      this.jacks++;
      this.lastDrop=d.startX; G.best.pinDrop=d.startX;
      note(BMAP.pins.name,"In the hundred. Dropping off to one side lets the fat pin throw it back across instead of away.");
      if(!G.prizes.pins) this.grand();
      if(this.jacks>=3) perfect("pins");
    }
    save();
  },
  grand(){
    G.prizes.pins=true; A.S.prize(); flash(.5,"#a8e8ff"); shake(10);
    for(let i=0;i<70;i++) spawn({x:rnd(VW),y:rnd(-40,-240),vx:rnd(60,-60),vy:rnd(200,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#4de0ff","#c56bff","#fff"]),drag:.995});
    note(BMAP.pins.name,"WON: the hundred slot. Never drop down the middle.");
    save();
    setTimeout(()=>modal("THE BRASS DISC","PAVILION PRIZE",
      "<p>Heavier than the ones in the machine, and a size too big for the slot.</p><p>“That's the one the inspector plays with,” he says.</p>",
      [{t:"Back to the Midway",f:()=>{closeModal();go("midway");}},{t:"Stay",f:closeModal}]),1000);
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#101a24"); g.addColorStop(.5,"#16222e"); g.addColorStop(1,"#070b10");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    woodBoards(0,60,VW,620,83,.32);
    X.fillStyle="rgba(6,10,14,.44)"; X.fillRect(0,0,VW,VH);
    X.fillStyle="#123a52"; X.beginPath(); X.moveTo(330,38); X.lineTo(950,38);
    X.lineTo(950,86); X.lineTo(640,100); X.lineTo(330,86); X.closePath(); X.fill();
    X.strokeStyle="rgba(170,230,255,.3)"; X.lineWidth=2; X.stroke();
    signText("DROP IT AND PRAY",640,64,24,"#e0f4ff","#4de0ff",.9);
    // the board

const TKEY="rigged_times_v1";
function fmtT(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600), m=Math.floor(s/60)%60, ss=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(ss).padStart(2,"0");
}
function loadTimes(){ try{ return JSON.parse(localStorage.getItem(TKEY)||"[]"); }catch(e){ return []; } }
function saveTime(ms){
  const a=loadTimes();
  const rec={ms,when:Date.now(),spent:G.totalSpent,loans:G.loans,
    perfect:perfCount(),games:BOOTHS.length};
  a.push(rec); a.sort((x,y)=>x.ms-y.ms);
  const keep=a.slice(0,12);
  try{ localStorage.setItem(TKEY,JSON.stringify(keep)); }catch(e){}
  return {list:keep, rank:keep.indexOf(rec)+1, rec};
}

SCN.island={
  mood:"claw", dir:true, back:false, bloom:.3,
  GY:648,
  enter(){
    this.t=0; this.cam=0; this.near=null; this.hov=null;
    this.pl={x:G.islX===undefined?-660:clamp(G.islX,ISL_L+70,ISL_R-70),vx:0,face:1,ph:0,moving:false};
    this.target=null; this.pending=null; this.said=0;
    hint("WASD to walk  ·  W or E to play  ·  the boat is waiting at the jetty");
    A.amb(.34,.4,0);
    if(!G.flags.islandSeen){ G.flags.islandSeen=1;
      note("The Island","Three booths, no lights on the road, nobody minding them. They still take tickets.");
      save(); }
  },
  exit(){ G.islX=this.pl?this.pl.x:-660; },
  spots(){ const a=ISLAND.map(b=>({x:b.x+BW/2,b}));
    a.push({x:ISL_L+96,jetty:true,b:null}); return a; },
  enterSpot(sp){
    if(sp.jetty){ A.S.whoosh(.8); go("sail"); return; }
    const b=sp.b;
    if(!canPlay(b)&&!G.prizes[b.id]){ A.S.buzzer();
      toast("That booth wants "+b.cost+" tickets","bad"); return; }
    A.S.ui(); go(b.id);
  },
  update(dt){
    this.t+=dt;
    const P0=this.pl;
    let mv=0;
    if(IN.keys.has("arrowleft")||IN.keys.has("a")) mv-=1;
    if(IN.keys.has("arrowright")||IN.keys.has("d")) mv+=1;
    if(mv!==0){ this.target=null; this.pending=null; }
    const wx=IN.x+this.cam;
    let hb=null;
    const iT=birdView()?BIRD.BOOTH_T:248, iB=birdView()?BIRD.BOOTH_B:560;
    if(IN.y>=iT&&IN.y<=iB) for(const b of ISLAND) if(wx>=b.x-8&&wx<=b.x+BW+8) hb=b;
    this.hov=hb?hb.id:null;
    if(IN.justUp&&dist(IN.downX,IN.downY,IN.x,IN.y)<26){
      const sp=hb?this.spots().find(z=>z.b===hb):null;
      if(sp){ if(Math.abs(P0.x-sp.x)<118) this.enterSpot(sp);
        else { this.target=clamp(sp.x,ISL_L+70,ISL_R-70); this.pending=sp; A.S.ui(); } }
      else if(IN.y>(birdView()?BIRD.DECK_T:540)){ this.target=clamp(wx,ISL_L+70,ISL_R-70); this.pending=null; }
    }
    if(this.target!==null){ const d=this.target-P0.x;
      if(Math.abs(d)<6){ P0.x=this.target; this.target=null;
        if(this.pending){ const q=this.pending; this.pending=null; this.enterSpot(q); } }
      else mv=sgn(d); }
    P0.vx=lerp(P0.vx,mv*216,1-Math.pow(.0009,dt));
    if(Math.abs(P0.vx)<6) P0.vx=0;
    P0.x=clamp(P0.x+P0.vx*dt,ISL_L+70,ISL_R-70);
    P0.moving=Math.abs(P0.vx)>14;
    if(P0.moving){ P0.face=sgn(P0.vx);
      const pp=P0.ph; P0.ph+=Math.abs(P0.vx)*dt*.052;
      if(Math.floor(pp/Math.PI)!==Math.floor(P0.ph/Math.PI)){
        A.S.step(.5,clamp((P0.x-this.cam-640)/640,-1,1));
        burst(P0.x-this.cam-P0.face*6,this.GY+2,3,{cols:["rgba(190,180,150,.6)"],type:"dust",
          smax:50,smin:12,g:260,lmax:.4,rmax:3,ang:-1.57,spread:.9}); }
    } else P0.ph=lerp(P0.ph%TAU,0,dt*8);
    this.cam=lerp(this.cam,clamp(P0.x-VW/2,ISL_L,ISL_R-VW),1-Math.pow(.0001,dt));
    let nb=null,nd=118;
    for(const sp of this.spots()){ const d=Math.abs(P0.x-sp.x); if(d<nd){ nd=d; nb=sp; } }
    this.near=nb;
    if(nb&&(IN.justKeys.has("e")||IN.justKeys.has("w")||IN.justKeys.has("arrowup")
      ||IN.justKeys.has(" ")||IN.justKeys.has("enter"))) this.enterSpot(nb);
  },
  draw(t){
    if(birdView()) return this.drawBird(t);
    const cam=this.cam, P0=this.pl;
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#05080f"); g.addColorStop(.5,"#0b1018"); g.addColorStop(1,"#141210");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    // stars and a cold moon - no bulbs out here
    for(let i=0;i<110;i++){ const sx=((h1(i*2.7)*.5+.5)*VW-cam*.06+VW)%VW, sy=(h1(i*5.1)*.5+.5)*340;
      X.globalAlpha=.22+.5*Math.abs(Math.sin(t*.7+i)); X.fillStyle="#cfe0ff"; X.fillRect(sx,sy,1.4,1.4); }
    X.globalAlpha=1;
    X.save(); X.globalCompositeOperation="lighter";
    const mg=X.createRadialGradient(1080-cam*.06,110,4,1080-cam*.06,110,170);
    mg.addColorStop(0,"rgba(200,215,245,.4)"); mg.addColorStop(1,"rgba(0,0,0,0)");
    X.fillStyle=mg; X.fillRect(700,0,600,320);
    X.fillStyle="rgba(226,234,252,.85)"; X.beginPath(); X.arc(1080-cam*.06,110,24,0,TAU); X.fill();
    X.restore();
    // the pier, a smear of light far off across the water
    X.save(); X.translate(-cam*.12,0); X.globalAlpha=.5;
    X.fillStyle="#0b0f18"; X.fillRect(-200,352,VW+400,10);
    for(let i=0;i<30;i++) bulb(-160+i*58,348,1.7,i%3?"#ffd24d":"#ff8a1e",1.3,.25+.3*Math.abs(Math.sin(t*1.4+i)));

    // dead bulbs on a sagging wire
    const fp=[]; for(let wx=ISL_L-100;wx<=ISL_R+200;wx+=300) fp.push({x:wx,y:214+Math.sin(wx*.004)*16});
    X.strokeStyle="rgba(28,26,22,.9)"; X.lineWidth=1.8;

    fog(t,600,720,.14,"#141a1e",7);
    rain(t,.3);
    X.save(); X.globalCompositeOperation="multiply"; X.globalAlpha=.3;
    X.fillStyle="#4a5a68"; X.fillRect(0,0,VW,VH); X.restore();

    X.fillText("no name on the chart · "+ISLAND.filter(b=>G.prizes[b.id]).length+" of 3 taken",VW/2,706);
  },
  drawBird(t){
    const cam=this.cam, P0=this.pl, B=BIRD, DECKY=(B.DECK_T+B.DECK_B)/2+34;
    X.fillStyle="#04060b"; X.fillRect(0,0,VW,VH);
    birdWater(t,cam,0,B.BOOTH_T,false);
    birdWater(t,cam,B.RAIL,VH,true);
    // sand instead of boards
    const sg=X.createLinearGradient(0,B.DECK_T,0,B.DECK_B);
    sg.addColorStop(0,"#241f16"); sg.addColorStop(.5,"#2c2619"); sg.addColorStop(1,"#1a170f");
    X.fillStyle=sg; X.fillRect(0,B.DECK_T,VW,B.DECK_B-B.DECK_T);
    for(let i=0;i<180;i++){ const x=((h1(i*3.1)*.5+.5)*2200-cam+3000)%2200-460;
      if(x<-20||x>VW+20) continue;
      X.globalAlpha=.06+.06*h1(i*9.7); X.fillStyle="#9a8f70";
      X.fillRect(x,B.DECK_T+12+((i*31)%(B.DECK_B-B.DECK_T-24)),3,2); }
    X.globalAlpha=1;
    // tideline
    X.strokeStyle="rgba(150,175,195,.14)"; X.lineWidth=2;
    X.beginPath();
    for(let k=0;k<=40;k++){ const x=k*VW/40; const y=B.RAIL-6+Math.sin(k*.6+t*.5)*4;
      k?X.lineTo(x,y):X.moveTo(x,y); }
    X.stroke();
    // the three booths, roofs rotted through
    ISLAND.forEach((b2,i)=>{
      const x=b2.x-cam; if(x<-240||x>VW+240) return;
      X.save(); X.globalCompositeOperation="multiply"; X.fillStyle="rgba(0,0,0,.6)";
      X.fillRect(x+7,B.BOOTH_T+9,BW,B.BOOTH_B-B.BOOTH_T); X.restore();
      X.fillStyle="#14120f"; X.fillRect(x,B.BOOTH_T,BW,70);
      for(let k=0;k<5;k++){ X.fillStyle="rgba(0,0,0,.5)";
        X.fillRect(x+12+k*32,B.BOOTH_T+14+((k*13)%30),18,14); }
      stripes(x-8,B.BOOTH_T+70,BW+16,56,b2.c1,"#6b6354",7,0);
      X.save(); X.globalCompositeOperation="multiply"; X.globalAlpha=.55;
      X.fillStyle="#2a3038"; X.fillRect(x-8,B.BOOTH_T+70,BW+16,56); X.restore();
      woodBoards(x-6,B.BOOTH_B-38,BW+12,38,i*7+2,.45);
      X.fillStyle="#0e0c10"; rr(x+10,B.BOOTH_T+14,BW-20,32,3); X.fill();
      const gi=(this.near&&this.near.b===b2)?1.1:.45;
      const w2=b2.name.split(" "), mid=Math.ceil(w2.length/2);
      if(b2.name.length>12){
        signText(w2.slice(0,mid).join(" "),x+BW/2,B.BOOTH_T+24,11,"#cfe0e8",b2.c1,gi);
        signText(w2.slice(mid).join(" "),x+BW/2,B.BOOTH_T+38,11,"#cfe0e8",b2.c1,gi);
      } else signText(b2.name,x+BW/2,B.BOOTH_T+31,12.5,"#cfe0e8",b2.c1,gi);
      if(G.prizes[b2.id]){ X.fillStyle="#ffd24d"; X.font="700 10px 'Rockwell',Georgia,serif";
        X.textAlign="center"; X.fillText("TAKEN",x+BW/2,B.BOOTH_B-46); }
      X.fillStyle="#cfc3a4"; rr(x+BW-44,B.BOOTH_B-28,38,17,3); X.fill();
      X.fillStyle="#2a1a0c"; X.font="700 10px 'Rockwell',Georgia,serif"; X.textAlign="center";
      X.fillText(b2.cost+" TIX",x+BW-25,B.BOOTH_B-16);
    });
    // the jetty runs out into the water
    const jx=ISL_L+96-cam;
    if(jx>-220&&jx<VW+220){
      X.fillStyle="#141109"; X.fillRect(jx-42,B.RAIL-20,84,150);
      for(let k=0;k<9;k++){ X.strokeStyle="rgba(0,0,0,.35)"; X.lineWidth=1.6;
        X.beginPath(); X.moveTo(jx-42,B.RAIL-8+k*16); X.lineTo(jx+42,B.RAIL-8+k*16); X.stroke(); }
      X.save(); X.translate(jx,VH-52); X.rotate(Math.PI/2+Math.sin(t*.6)*.05); X.scale(.42,.42);
      X.fillStyle="#1d2733";
      X.beginPath(); X.moveTo(-170,-46); X.quadraticCurveTo(0,-70,170,0);
      X.quadraticCurveTo(0,70,-170,46); X.closePath(); X.fill();
      X.fillStyle="rgba(215,226,242,.6)"; X.beginPath(); X.ellipse(-10,0,54,28,0,0,TAU); X.fill();
      X.restore();
      X.fillStyle="rgba(150,200,230,.4)"; X.font="600 10px monospace"; X.textAlign="center";
      X.fillText("THE JETTY",jx,B.RAIL+2);
    }
    // a few dead bulbs on the wire
    for(let wx=Math.floor((cam-400)/300)*300; wx<cam+VW+400; wx+=300){
      const x=wx-cam;
      X.strokeStyle="rgba(22,20,16,.85)"; X.lineWidth=1.5;
      X.beginPath(); X.moveTo(x,B.BOOTH_B-6); X.lineTo(x+46,B.RAIL+10); X.stroke();
      for(let k=0;k<6;k++){ const u=(k+.5)/6, dead=((k*7+wx)%5)!==0;
        bulb(x+46*u,lerp(B.BOOTH_B-6,B.RAIL+10,u),2.6,dead?"#2a2620":"#ffd9a0",1,
          dead?.05:.18+.2*Math.abs(Math.sin(t*.9+k))); }
    }
    birdWalker(P0.x-cam,DECKY,t,P0.ph,P0.face,P0.moving,"rgba(160,200,245,.5)");
    if(this.near){
      const sp=this.near, sx=sp.x-cam, y=B.BOOTH_B+34+Math.sin(t*3)*4;
      const label=sp.jetty?"BACK TO THE PIER  [E]":
        (G.prizes[sp.b.id]?"PLAY AGAIN  [E]":`PLAY \u00b7 ${sp.b.cost} TIX  [E]`);
      X.save(); X.font="700 13px 'Rockwell',Georgia,serif"; X.textAlign="center";
      const w=X.measureText(label).width+30;
      X.fillStyle="rgba(10,12,14,.92)"; rr(sx-w/2,y-18,w,26,13); X.fill();
      X.strokeStyle="rgba(150,220,255,.7)"; X.lineWidth=1.4; X.stroke();
      X.shadowColor="#4de0ff"; X.shadowBlur=12;
      X.fillStyle="#dff2ff"; X.fillText(label,sx,y-1); X.shadowBlur=0; X.restore();
    }
    rain(t,.3);
    X.save(); X.globalCompositeOperation="multiply"; X.globalAlpha=.28;
    X.fillStyle="#4a5a68"; X.fillRect(0,0,VW,VH); X.restore();
    X.textAlign="center"; X.fillStyle="rgba(170,190,205,.3)"; X.font="italic 12px Georgia,serif";
    X.fillText("no name on the chart \u00b7 from above",VW/2,VH-14);
  },
  drawJetty(t){
    const jx=ISL_L+96;
    X.fillStyle="#141109"; X.fillRect(jx-130,540,260,16);
    for(let i=0;i<7;i++){ X.fillStyle="#0e0c07"; X.fillRect(jx-118+i*36,556,10,70); }
    X.save(); X.translate(jx-40,516+Math.sin(t*.9)*3); X.rotate(Math.sin(t*.7)*.02); X.scale(.5,.5);
    X.strokeStyle="rgba(170,190,215,.5)"; X.lineWidth=4;
    X.beginPath(); X.moveTo(-10,-30); X.lineTo(-10,-300); X.stroke();
    X.fillStyle="rgba(215,226,242,.7)";
    X.beginPath(); X.moveTo(-16,-36); X.lineTo(-16,-290);
    X.quadraticCurveTo(-90,-170,-150,-36); X.closePath(); X.fill();
    const hg=X.createLinearGradient(0,-36,0,40);

    X.beginPath(); X.moveTo(-230,-30); X.quadraticCurveTo(-170,32,0,38);

    X.fillText("THE JETTY",jx,584);
  }
};

/* ================================================================
