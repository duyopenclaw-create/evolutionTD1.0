   ================================================================ */
SCN.lagoon={
  mood:"claw", back:false, bloom:.34,
  TOP:250, BOT:610, L:300, R:1000,
  enter(){
    this.t=0; this.state="ready"; this.lifts=0; this.keeps=0; this.y=this.TOP-40;
    this.held=null; this.msgT=0; this.msg=""; this.noted=0; this.make();
    hint("Hold to lower the magnet · let go to wind it up");
    A.amb(.3,.3,.06);
  },
  make(){
    const K=[
      {n:"horseshoe",mag:1,v:3,w:34,h:30},{n:"spanner",mag:1,v:2,w:44,h:12},
      {n:"tin",mag:1,v:2,w:30,h:26},{n:"chain",mag:1,v:3,w:40,h:14},
      {n:"bottle",mag:0,v:0,w:18,h:38},{n:"boot",mag:0,v:0,w:36,h:26},
      {n:"crab",mag:0,v:0,w:30,h:18}
    ];
    this.items=[];
    K.forEach((k,i)=>this.items.push(Object.assign({},k,{
      x:this.L+70+i*((this.R-this.L-140)/6)+rnd(18,-18),
      y:this.TOP+130+((i*53)%180), ph:rnd(TAU), gone:false, twitch:0})));
    // the prize everyone reaches for is brass, and brass is not magnetic
    this.items.push({n:"trophy",mag:0,v:0,w:34,h:44,x:(this.L+this.R)/2,
      y:this.BOT-54,ph:0,gone:false,twitch:0,shiny:1});
    // the key is inside the ugliest thing in the water
    this.items.push({n:"iron box",mag:1,v:8,box:1,w:46,h:34,
      x:this.R-120,y:this.BOT-40,ph:1,gone:false,twitch:0});
  },
  play(){ const b=BMAP.lagoon;
    if(!canPlay(b)){ A.S.buzzer(); toast(b.cost+" tickets","bad"); return; }
    pay(b.cost); G.plays.lagoon=(G.plays.lagoon||0)+1; A.S.coin(2);
    this.lifts=3; this.keeps=0; this.make(); this.y=this.TOP-40; this.held=null;
    this.state="fish"; save();
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    for(const it of this.items){ if(it.gone) continue;
      it.x+=Math.sin(this.t*.4+it.ph)*4*dt;
      // magnetic things lean toward the magnet as it goes by - the brass never does
      const d=dist(it.x,it.y,this.mx(),this.y);
      it.twitch=lerp(it.twitch,(it.mag&&d<170)?clamp(1-d/170,0,1):0,dt*6);
    }
    if(this.state!=="fish") return;
    const down=IN.down||IN.keys.has(" ");
    if(this.held){
      this.y-=240*dt;
      this.held.x=this.mx(); this.held.y=this.y+26;
      if(this.y<=this.TOP-40){ this.y=this.TOP-40; this.land(); }
    } else if(down){
      this.y=Math.min(this.BOT-10,this.y+190*dt);
      for(const it of this.items){ if(it.gone) continue;
        if(it.mag && dist(it.x,it.y,this.mx(),this.y+20)<it.w*.6+20){
          this.held=it; A.S.clunk(); A.S.tok(.6);
          if(!this.noted){ this.noted=1;
            note(BMAP.lagoon.name,"Things that take the magnet twitch toward it as it goes past. The bright trophy never moves a hair."); }
        } }
    } else {
      this.y=Math.max(this.TOP-40,this.y-200*dt);
    }
  },
  mx(){ return lerp(this.L+26,this.R-26,.5+.5*Math.sin(this.t*.42)); },   // edge to edge
  land(){
    const it=this.held; this.held=null; it.gone=true; this.lifts--;
    this.keeps++;
    A.S.glass(.5); A.S.coin(1);
    win(it.v,it.n);
    this.msg=it.n.toUpperCase(); this.msgT=1.8;
    if(it.box){
      this.msg="THE IRON BOX"; this.msgT=2.6;
      note(BMAP.lagoon.name,"The iron box came up heavy. The brass key was inside it all along.");
      if(!G.prizes.lagoon) this.grand();
    }
    if(this.keeps>=3) perfect("lagoon");
    if(this.lifts<=0) this.state="over";
    save();
  },
  grand(){
    G.prizes.lagoon=true; A.S.prize(); flash(.4,"#a8e8ff"); shake(8);
    for(let i=0;i<60;i++) spawn({x:rnd(VW),y:rnd(-40,-220),vx:rnd(60,-60),vy:rnd(190,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#4de0ff","#5fe08a","#fff"]),drag:.995});
    this.checkIsland();
    setTimeout(()=>modal("THE BRASS KEY","ISLAND PRIZE",
      "<p>It was never going to come up on a magnet. Brass never does.</p><p>It fits a lock somewhere. Nothing on this island has a lock.</p>",
      [{t:"Back to the island",f:()=>{closeModal();go("island");}},{t:"Stay",f:closeModal}]),900);
  },
  checkIsland(){ save();
    if(islandWon()&&!G.flags.islandDone){ G.flags.islandDone=1; save();
      setTimeout(()=>{ ubQueue.push({k:"isl",kind:"The island is cleared",
        t:"ALL THREE",s:"nobody was ever meant to find these — you took all of them"});
        flushUnlocks(); },1600); }
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#050a10"); g.addColorStop(.4,"#081018"); g.addColorStop(1,"#0b0d10");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    X.textAlign="center";
    signText("WHAT THE TIDE LEFT",640,86,26,"#dff2ff","#4de0ff",.7);
    // the tank
    X.fillStyle="#12171d"; rr(this.L-30,this.TOP-20,this.R-this.L+60,this.BOT-this.TOP+70,8); X.fill();
    X.save(); rr(this.L,this.TOP,this.R-this.L,this.BOT-this.TOP+30,4); X.clip();
    const wg=X.createLinearGradient(0,this.TOP,0,this.BOT+30);
    wg.addColorStop(0,"#16384a"); wg.addColorStop(.5,"#0d2231"); wg.addColorStop(1,"#06121c");
    X.fillStyle=wg; X.fillRect(this.L,this.TOP,this.R-this.L,this.BOT-this.TOP+40);
    X.save(); X.globalCompositeOperation="lighter";
    for(let r=0;r<14;r++){ X.strokeStyle="rgba(130,200,240,.08)"; X.lineWidth=1.2;
      X.beginPath();
      for(let k=0;k<=30;k++){ const x=this.L+k*((this.R-this.L)/30);
        const y=this.TOP+14+r*26+Math.sin(t*1.1+k*.5+r)*3; k?X.lineTo(x,y):X.moveTo(x,y); }
      X.stroke(); }
    X.restore();
    // things in the water
    for(const it of this.items){ if(it.gone) continue; this.drawItem(it,t); }
    // the rope and the magnet
    X.strokeStyle="#8a8a80"; X.lineWidth=2;
    X.beginPath(); X.moveTo(this.mx(),this.TOP-90); X.lineTo(this.mx(),this.y); X.stroke();
    X.save(); X.translate(this.mx(),this.y);
    const mg=X.createLinearGradient(-22,0,22,26);
    mg.addColorStop(0,"#c9ccd4"); mg.addColorStop(.5,"#7e838d"); mg.addColorStop(1,"#3c4149");
    X.fillStyle=mg; rr(-22,0,44,20,3); X.fill();
    X.fillStyle="#b5301e"; X.fillRect(-22,18,17,8);
    X.fillStyle="#1d3a8a"; X.fillRect(5,18,17,8);
    X.save(); X.globalCompositeOperation="lighter"; X.globalAlpha=.25+.2*Math.sin(t*4);
    const fg=X.createRadialGradient(0,20,2,0,20,70);
    fg.addColorStop(0,"rgba(120,190,255,.6)"); fg.addColorStop(1,"rgba(0,0,0,0)");
    X.fillStyle=fg; X.beginPath(); X.arc(0,20,70,0,TAU); X.fill(); X.restore();
    X.restore();
    X.restore();
    // frame + winch
    X.strokeStyle="rgba(150,190,220,.18)"; X.lineWidth=2;
    rr(this.L,this.TOP,this.R-this.L,this.BOT-this.TOP+30,4); X.stroke();
    X.fillStyle="#2a2620"; X.fillRect(this.mx()-30,this.TOP-104,60,20);
    X.fillStyle="#4a4640"; X.beginPath(); X.arc(this.mx(),this.TOP-94,9,0,TAU); X.fill();
    X.textAlign="center";
    if(this.state==="ready"||this.state==="over"){
      X.fillStyle="rgba(200,230,245,.8)"; X.font="italic 16px Georgia,serif";
      X.fillText(this.state==="over"?`${this.keeps} out of the water.`:"Five tickets, three lifts.",640,656);
      if(button(540,668,200,34,this.state==="over"?"AGAIN (5 TIX)":"PAY 5 TICKETS",
        {font:"600 13px",off:!canPlay(BMAP.lagoon)})) this.play();
    } else {
      X.textAlign="left"; X.fillStyle="#bfe8ff"; X.font="700 16px 'Rockwell',Georgia,serif";
      X.fillText("LIFTS  "+this.lifts,80,656);
      X.textAlign="center"; X.fillStyle="rgba(190,225,245,.5)"; X.font="italic 13px Georgia,serif";
      X.fillText("hold to lower",640,676);
    }
    if(G.perfect.lagoon){ X.textAlign="right"; X.fillStyle="#fff3cf";
      X.font="700 13px 'Rockwell',Georgia,serif"; X.fillText("PERFECT",1200,656); }
    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";
      signText(this.msg,640,170,30,"#dff2ff","#4de0ff",.9); X.restore(); }
    if(button(20,20,120,30,"◀ ISLAND",{font:"600 11px"})) go("island");
  },
  drawItem(it,t){
    const sway=Math.sin(t*.7+it.ph)*3, lean=it.twitch*10;
    X.save(); X.translate(it.x+lean,it.y+sway); X.rotate(Math.sin(t*.5+it.ph)*.08+it.twitch*.2);
    if(it.shiny){
      X.save(); X.globalCompositeOperation="lighter"; X.globalAlpha=.3+.15*Math.sin(t*2);
      const sg=X.createRadialGradient(0,0,2,0,0,52);
      sg.addColorStop(0,"rgba(255,220,130,.7)"); sg.addColorStop(1,"rgba(0,0,0,0)");
      X.fillStyle=sg; X.beginPath(); X.arc(0,0,52,0,TAU); X.fill(); X.restore();
      const bg=X.createLinearGradient(-16,-22,16,22);
      bg.addColorStop(0,"#ffe9a8"); bg.addColorStop(.5,"#c9a227"); bg.addColorStop(1,"#6b5210");
      X.fillStyle=bg;
      X.beginPath(); X.moveTo(-15,-20); X.lineTo(15,-20); X.lineTo(9,8); X.lineTo(-9,8); X.closePath(); X.fill();
      X.fillRect(-13,10,26,5); X.fillRect(-8,15,16,7);
      X.strokeStyle="#c9a227"; X.lineWidth=3;
      X.beginPath(); X.arc(-16,-10,7,.6,4.2); X.stroke();
      X.beginPath(); X.arc(16,-10,7,-1.1,2.5); X.stroke();
    } else if(it.box){
      X.fillStyle="#3a3630"; rr(-23,-17,46,34,3); X.fill();
      X.fillStyle="#2a2620"; rr(-23,-17,46,10,3); X.fill();
      X.strokeStyle="#5a564c"; X.lineWidth=2; rr(-23,-17,46,34,3); X.stroke();
      X.fillStyle="#1a1814"; X.fillRect(-5,-2,10,9);
      X.fillStyle="rgba(120,160,120,.25)"; X.fillRect(-23,6,46,11);
    } else {
      X.fillStyle=it.mag?"#6b7079":"#4a4038";
      if(it.n==="horseshoe"){ X.strokeStyle="#7a7f88"; X.lineWidth=9;
        X.beginPath(); X.arc(0,0,14,.5,Math.PI-.5,true); X.stroke(); }
      else if(it.n==="spanner"){ X.fillRect(-22,-4,44,8);
        X.beginPath(); X.arc(-22,0,8,0,TAU); X.arc(22,0,7,0,TAU); X.fill(); }
      else if(it.n==="chain"){ X.strokeStyle="#6b7079"; X.lineWidth=4;
        for(let k=0;k<4;k++){ X.beginPath(); X.ellipse(-16+k*11,0,7,5,0,0,TAU); X.stroke(); } }
      else if(it.n==="bottle"){ X.fillStyle="rgba(90,150,110,.7)";
        X.beginPath(); X.moveTo(-8,18); X.lineTo(-8,-8); X.lineTo(-3,-14); X.lineTo(-3,-20);
        X.lineTo(3,-20); X.lineTo(3,-14); X.lineTo(8,-8); X.lineTo(8,18); X.closePath(); X.fill(); }
      else if(it.n==="boot"){ X.fillStyle="#3a2f28";
        X.beginPath(); X.moveTo(-10,-14); X.lineTo(4,-14); X.lineTo(6,6); X.lineTo(18,10);
        X.lineTo(18,14); X.lineTo(-10,14); X.closePath(); X.fill(); }
      else if(it.n==="crab"){ X.fillStyle="#7a3a2a";
        X.beginPath(); X.ellipse(0,0,13,8,0,0,TAU); X.fill();
        X.strokeStyle="#7a3a2a"; X.lineWidth=2.4;
        for(let k=-1;k<=1;k+=2){ X.beginPath(); X.moveTo(k*10,2); X.lineTo(k*18,9); X.stroke(); } }
      else { rr(-14,-12,28,24,3); X.fill(); }
    }
    X.restore();
  }
};

/* ================================================================
   ISLAND 2 — THE MIRROR MAZE
   ================================================================ */
SCN.maze={
  mood:"wheel", back:false, bloom:.42,
  ROOMS:6,
  enter(){
    this.t=0; this.state="ready"; this.room=0; this.bumps=0; this.msgT=0; this.msg="";
    this.shake=0; this.gaps=[]; this.pick=-1; this.noted=0;
    hint("Click the way through · one of the three is not air");
    A.amb(.24,.34,0);
  },
  build(){
    this.gaps=[];
    for(let r=0;r<this.ROOMS;r++){
      const real=rint(0,2);
      // RIG: the middle one is glass far more often than chance would have it
      this.gaps.push({real: Math.random()<.62 ? (real===1?rint(0,1)*2:real) : real});
    }
  },
  play(){ const b=BMAP.maze;
    if(!canPlay(b)){ A.S.buzzer(); toast(b.cost+" tickets","bad"); return; }
    pay(b.cost); G.plays.maze=(G.plays.maze||0)+1; A.S.coin(2);
    this.room=0; this.bumps=0; this.build(); this.state="walk"; this.pick=-1; save();
  },
  choose(i){
    if(this.state!=="walk") return;
    const g=this.gaps[this.room];
    this.pick=i;
    if(i===g.real){
      A.S.step(.6,0); this.room++;
      this.msg="THROUGH"; this.msgT=.8;
      if(this.room>=this.ROOMS) this.out();
    } else {
      A.S.glass(1); shake(7); this.shake=1; this.bumps++;
      this.msg="GLASS"; this.msgT=1.1;
      if(this.bumps>=8){ this.state="over"; this.msg="ENOUGH"; this.msgT=2.2; A.S.buzzer(); }
      if(!this.noted){ this.noted=1;
        note(BMAP.maze.name,"Walked into a pane. The glass carries a reflection of my lamp; the real gap is the dark one."); }
    }
    setTimeout(()=>{ this.pick=-1; },240);
  },
  out(){
    this.state="won"; A.S.ding(); A.S.sparkle();
    win(10,"out of the maze");
    if(!G.prizes.maze){
      G.prizes.maze=true; A.S.prize(); flash(.4,"#e0c8ff");
      for(let i=0;i<60;i++) spawn({x:rnd(VW),y:rnd(-40,-220),vx:rnd(60,-60),vy:rnd(190,60),
        g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#c56bff","#fff","#4de0ff"]),drag:.995});
      note(BMAP.maze.name,"Out. The opening with no reflection in it is the only one that is really there.");
      SCN.lagoon.checkIsland.call(this);
      setTimeout(()=>modal("THE SILVERED PANE","ISLAND PRIZE",
        "<p>A hand mirror with the silvering gone at one corner, so you can see straight through that bit.</p><p>Useful, if you knew where to point it.</p>",
        [{t:"Back to the island",f:()=>{closeModal();go("island");}},{t:"Stay",f:closeModal}]),900);
    } else save();
    if(this.bumps===0) perfect("maze");
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt); this.shake*=Math.pow(.02,dt);
    if(this.state==="walk"&&IN.justUp&&dist(IN.downX,IN.downY,IN.x,IN.y)<26){
      for(let i=0;i<3;i++){ const x=340+i*300;
        if(IN.x>x&&IN.x<x+220&&IN.y>200&&IN.y<560) this.choose(i); }
    }
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#0a0812"); g.addColorStop(.5,"#120e1c"); g.addColorStop(1,"#08060c");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    X.save(); X.translate(Math.sin(t*40)*this.shake*5,0);
    X.textAlign="center";
    signText("FIND THE WAY OUT",640,84,26,"#efe0ff","#c56bff",.7);
    const gp=this.gaps[this.room];
    for(let i=0;i<3;i++){
      const x=340+i*300, real=gp&&i===gp.real;
      const hov=this.state==="walk"&&IN.x>x&&IN.x<x+220&&IN.y>200&&IN.y<560;
      if(hov) hotBtn="gap";
      // the frame
      X.fillStyle="#1a1526"; X.fillRect(x-16,196,16,368); X.fillRect(x+220,196,16,368);
      X.fillStyle="#0a0810"; X.fillRect(x,200,220,360);
      if(this.state!=="walk"||!gp){ /* nothing */ }
      else if(real){
        // a real gap. black, and a draught coming through it.
        const dg=X.createLinearGradient(0,200,0,560);
        dg.addColorStop(0,"#08070d"); dg.addColorStop(1,"#0a0a11");
        X.fillStyle=dg; X.fillRect(x,200,220,360);
        for(let k=0;k<9;k++){
          const sd=h1(k*13.7+i*3.1)*.5+.5;
          const dx2=x+18+((k*53+t*22*(.6+sd))%184);
          const dy2=236+((k*71+t*11*(.5+sd))%300);
          X.globalAlpha=.11+.10*Math.sin(t*1.4+k*1.3);
          X.fillStyle="#c4bad8"; X.fillRect(dx2,dy2,1.7,1.7);
        }
        X.globalAlpha=1;
      } else {
        // glass. also black. it just happens to be holding one small piece of your lamp.
        const gg=X.createLinearGradient(x,200,x+220,560);
        gg.addColorStop(0,"rgba(150,175,210,.030)"); gg.addColorStop(.5,"rgba(110,130,170,.012)");
        gg.addColorStop(1,"rgba(150,180,220,.026)");
        X.fillStyle=gg; X.fillRect(x,200,220,360);
        X.save(); X.globalCompositeOperation="lighter";
        const lx=x+110+Math.sin(t*.33+i*2.1)*16, ly=394;
        X.globalAlpha=.085;
        const lg=X.createRadialGradient(lx,ly,1,lx,ly,44);
        lg.addColorStop(0,"rgba(255,214,150,.55)"); lg.addColorStop(1,"rgba(0,0,0,0)");
        X.fillStyle=lg; X.beginPath(); X.arc(lx,ly,44,0,TAU); X.fill();
        X.globalAlpha=.34+.2*Math.sin(t*1.05+i*1.7);
        X.fillStyle="rgba(255,242,214,.95)";
        X.beginPath(); X.arc(lx,ly,1.9,0,TAU); X.fill();
        X.restore();
      }
      if(hov){ X.strokeStyle="rgba(220,200,255,.7)"; X.lineWidth=2; X.strokeRect(x-2,198,224,364); }
      if(this.pick===i){ X.fillStyle="rgba(255,255,255,.14)"; X.fillRect(x,200,220,360); }
    }
    // your lamp, held out in front
    X.save(); X.globalCompositeOperation="lighter";
    const pg=X.createRadialGradient(640,620,4,640,620,240);
    pg.addColorStop(0,"rgba(255,210,140,.35)"); pg.addColorStop(1,"rgba(0,0,0,0)");
    X.fillStyle=pg; X.fillRect(360,420,560,300); X.restore();
    drawWalker(640,648,1.25,t,0,1,false,1,"rgba(255,200,130,.5)");
    X.textAlign="center";
    if(this.state==="ready"||this.state==="won"||this.state==="over"){
      X.fillStyle="rgba(230,215,250,.8)"; X.font="italic 16px Georgia,serif";
      X.fillText(this.state==="won"?`Out in ${this.bumps} bruises.`:
        (this.state==="over"?`Walked into eight panes. Room ${this.room+1}.`:"Five tickets. Six rooms."),640,606);
      if(button(540,618,200,34,this.state==="ready"?"PAY 5 TICKETS":"AGAIN (5 TIX)",
        {font:"600 13px",off:!canPlay(BMAP.maze)})) this.play();
    } else {
      X.textAlign="left"; X.fillStyle="#e0cfff"; X.font="700 16px 'Rockwell',Georgia,serif";
      X.fillText("ROOM  "+(this.room+1)+" / "+this.ROOMS,80,606);
      X.textAlign="right"; X.fillText("GLASS  "+this.bumps+" / 8",1200,606);
    }
    if(G.perfect.maze){ X.textAlign="center"; X.fillStyle="#fff3cf";
      X.font="700 13px 'Rockwell',Georgia,serif"; X.fillText("PERFECT",640,584); }
    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";
      signText(this.msg,640,150,32,this.msg==="GLASS"?"#ffc9c6":"#e6ffe8",
        this.msg==="GLASS"?"#e0332c":"#5fe08a",1); X.restore(); }
    X.restore();
    if(button(20,20,120,30,"◀ ISLAND",{font:"600 11px"})) go("island");
  }
};

/* ================================================================
   ISLAND 3 — THE COCONUT SHY
   ================================================================ */
SCN.shy={
  mood:"bottles", back:false, bloom:.34,
  START:{x:250,y:540},
  enter(){
    this.t=0; this.state="ready"; this.balls=0; this.off=0; this.aim=null; this.ball=null;
    this.msgT=0; this.msg=""; this.noted=0; this.make();
    hint("Drag back and let go · most of them are cemented in");
    A.amb(.26,.36,0);
  },
  make(){
    this.nuts=[];
    const loose=shuf([0,1,2,3,4,5]).slice(0,3);
    for(let i=0;i<6;i++) this.nuts.push({
      x:560+i*112, y:400, loose:loose.includes(i), off:false,
      wob:0, ph:rnd(TAU), vx:0, vy:0, rot:0 });
  },
  play(){ const b=BMAP.shy;
    if(!canPlay(b)){ A.S.buzzer(); toast(b.cost+" tickets","bad"); return; }
    pay(b.cost); G.plays.shy=(G.plays.shy||0)+1; A.S.coin(2);
    this.balls=3; this.off=0; this.make(); this.state="aim"; save();
  },
  throwBall(vx,vy){
    this.ball={x:this.START.x,y:this.START.y,vx,vy,r:11,rot:0,life:0,hit:0};
    this.balls--; this.state="fly"; A.S.whoosh(.8);
  },
  update(dt){
    this.t+=dt; this.msgT=Math.max(0,this.msgT-dt);
    for(const n of this.nuts){
      if(n.off){ n.vy+=1500*dt; n.x+=n.vx*dt; n.y+=n.vy*dt; n.rot+=dt*6; continue; }
      // the loose ones rock in the wind. the cemented ones do not.
      n.wob=n.loose?Math.sin(this.t*1.6+n.ph)*3.4:0;
    }
    if(this.state==="aim"){
      if(IN.down) this.aim={x:IN.x,y:IN.y};
      else if(this.aim){
        const dx=this.START.x-this.aim.x, dy=this.START.y-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,190)/190;
        if(s>.1){ const a=Math.atan2(dy,dx); this.throwBall(Math.cos(a)*s*1420,Math.sin(a)*s*1420); }
        this.aim=null;
      }
    } else if(this.state==="fly"){
      const b=this.ball; b.life+=dt;
      for(let k=0;k<3;k++){
        const h=dt/3;
        b.vy+=1320*h; b.x+=b.vx*h; b.y+=b.vy*h; b.rot+=b.vx*.004*h;
        for(const n of this.nuts){ if(n.off) continue;
          if(dist(b.x,b.y,n.x+n.wob,n.y)<26 && !b.hit){
            b.hit=1;
            if(n.loose){
              n.off=true; n.vx=b.vx*.34+rnd(90,-40); n.vy=-160+b.vy*.2;
              this.off++; A.S.thud(.8); A.S.glass(.4); shake(5);
              win(4,"one off the post");
              this.msg="OFF!"; this.msgT=1.2;
              burst(n.x,n.y,14,{cols:["#9a7048","#5c3d22"],type:"shard",smax:220,g:700,lmax:.7,rmax:4});
              note(BMAP.shy.name,"That one came off. It was the one rocking in the wind before I threw.");
              if(!G.prizes.shy) this.grand();
              if(this.off>=3) perfect("shy");
            } else {
              A.S.dead(); shake(3);
              b.vx*=-.32; b.vy=-Math.abs(b.vy)*.3-60;
              this.msg="DEAD"; this.msgT=1.0;
              if(!this.noted){ this.noted=1;
                note(BMAP.shy.name,"Hit one square and it did not even rock. Something is holding it in the cup."); }
            }
          } }
      }
      if(b.y>660||b.x>1260||b.life>4){ this.ball=null;
        this.state=this.balls>0?"aim":"over"; }
    }
  },
  grand(){
    G.prizes.shy=true; A.S.prize(); flash(.4,"#ffd9a0");
    for(let i=0;i<60;i++) spawn({x:rnd(VW),y:rnd(-40,-220),vx:rnd(60,-60),vy:rnd(190,60),
      g:120,max:rnd(4,2),r:rnd(6,3),type:"confetti",col:pick(["#ff8a1e","#ffd24d","#fff"]),drag:.995});
    SCN.lagoon.checkIsland.call(this);
    setTimeout(()=>modal("THE LOOSE COCONUT","ISLAND PRIZE",
      "<p>Hollow, and light as a paper bag. Somebody drilled it and drank it out years ago.</p><p>It was the only one that could ever have fallen.</p>",
      [{t:"Back to the island",f:()=>{closeModal();go("island");}},{t:"Stay",f:closeModal}]),900);
  },
  draw(t){
    const g=X.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,"#0a0c10"); g.addColorStop(.5,"#131410"); g.addColorStop(1,"#0a0806");
    X.fillStyle=g; X.fillRect(0,0,VW,VH);
    X.textAlign="center";
    signText("KNOCK ONE OFF",640,84,26,"#ffe4c0","#ff8a1e",.7);
    // a rotten canvas backdrop
    X.fillStyle="#141812"; X.fillRect(420,150,800,360);
    for(let i=0;i<9;i++){ X.fillStyle="rgba(0,0,0,.25)";
      X.beginPath(); X.moveTo(420+i*90,150); X.quadraticCurveTo(420+i*90+22,330,420+i*90,510);
      X.lineTo(420+i*90+9,510); X.quadraticCurveTo(420+i*90+31,330,420+i*90+9,150); X.closePath(); X.fill(); }
    // the posts
    X.fillStyle="#241c12"; X.fillRect(480,504,720,14);
    for(const n of this.nuts){
      X.fillStyle="#3d3022"; X.fillRect(n.x-4,n.y+10,8,96);
      X.fillStyle="#4a3a24"; X.beginPath(); X.ellipse(n.x,n.y+12,13,7,0,0,TAU); X.fill();
      if(n.off) continue;
      X.save(); X.translate(n.x+n.wob,n.y); X.rotate(n.wob*.012);
      const cg=X.createRadialGradient(-5,-6,2,0,0,20);
      cg.addColorStop(0,"#9a7048"); cg.addColorStop(.6,"#5c3d22"); cg.addColorStop(1,"#2a1a0e");
      X.fillStyle=cg; X.beginPath(); X.ellipse(0,0,17,19,0,0,TAU); X.fill();
      X.strokeStyle="rgba(40,26,12,.6)"; X.lineWidth=1.2;
      for(let k=0;k<4;k++){ X.beginPath(); X.moveTo(-12+k*8,-17); X.quadraticCurveTo(-10+k*8,0,-12+k*8,17); X.stroke(); }
      X.fillStyle="#2a1a0e"; X.beginPath(); X.arc(-5,-9,2.4,0,TAU); X.arc(4,-9,2.4,0,TAU); X.fill();
      X.restore();
    }
    for(const n of this.nuts){ if(!n.off) continue;
      X.save(); X.translate(n.x,n.y); X.rotate(n.rot);
      X.fillStyle="#5c3d22"; X.beginPath(); X.ellipse(0,0,17,19,0,0,TAU); X.fill(); X.restore(); }
    if(this.ball){ X.save(); X.translate(this.ball.x,this.ball.y); X.rotate(this.ball.rot);
      const bg=X.createRadialGradient(-3,-4,1,0,0,11);
      bg.addColorStop(0,"#ff9a88"); bg.addColorStop(.6,"#b5301e"); bg.addColorStop(1,"#5c1208");
      X.fillStyle=bg; X.beginPath(); X.arc(0,0,11,0,TAU); X.fill(); X.restore(); }
    if(this.state==="aim"){
      X.save(); X.translate(this.START.x,this.START.y);
      const bg=X.createRadialGradient(-3,-4,1,0,0,11);
      bg.addColorStop(0,"#ff9a88"); bg.addColorStop(.6,"#b5301e"); bg.addColorStop(1,"#5c1208");
      X.fillStyle=bg; X.beginPath(); X.arc(0,0,11,0,TAU); X.fill(); X.restore();
      if(this.aim){
        const dx=this.START.x-this.aim.x, dy=this.START.y-this.aim.y;
        const s=clamp(Math.hypot(dx,dy),0,190)/190, a=Math.atan2(dy,dx);
        let px=this.START.x,py=this.START.y,vx=Math.cos(a)*s*1420,vy=Math.sin(a)*s*1420;
        X.save(); X.setLineDash([4,8]); X.strokeStyle="rgba(255,200,150,.7)"; X.lineWidth=2.2;
        X.beginPath(); X.moveTo(px,py);
        for(let i=0;i<110;i++){ vy+=1320/60; px+=vx/60; py+=vy/60; X.lineTo(px,py); if(px>1260||py>700) break; }
        X.stroke(); X.restore();
        X.fillStyle="rgba(0,0,0,.6)"; rr(this.START.x-58,this.START.y+30,116,10,5); X.fill();
        X.fillStyle=`hsl(${lerp(40,0,s)},80%,58%)`; rr(this.START.x-56,this.START.y+32,112*s,6,3); X.fill();
      } else { X.fillStyle="rgba(230,215,190,.5)"; X.font="italic 13px Georgia,serif";
        X.fillText("drag back — release to throw",this.START.x,this.START.y+54); }
    }
    X.textAlign="center";
    if(this.state==="ready"||this.state==="over"){
      X.fillStyle="rgba(240,225,200,.8)"; X.font="italic 16px Georgia,serif";
      X.fillText(this.state==="over"?`${this.off} off the posts.`:"Five tickets, three balls.",640,650);
      if(button(540,662,200,34,this.state==="over"?"AGAIN (5 TIX)":"PAY 5 TICKETS",
        {font:"600 13px",off:!canPlay(BMAP.shy)})) this.play();
    } else {
      X.textAlign="left"; X.fillStyle="#ffd9a0"; X.font="700 16px 'Rockwell',Georgia,serif";
      X.fillText("BALLS  "+this.balls,80,650);
      X.textAlign="right"; X.fillText("OFF  "+this.off+" / 3",1200,650);
    }
    if(G.perfect.shy){ X.textAlign="center"; X.fillStyle="#fff3cf";
      X.font="700 13px 'Rockwell',Georgia,serif"; X.fillText("PERFECT",640,628); }
    if(this.msgT>0){ X.save(); X.globalAlpha=clamp(this.msgT,0,1); X.textAlign="center";
      signText(this.msg,640,150,32,this.msg==="DEAD"?"#e8c4b4":"#fff3cf",
        this.msg==="DEAD"?"#7a5a4a":"#ffd24d",1); X.restore(); }
    if(button(20,20,120,30,"◀ ISLAND",{font:"600 11px"})) go("island");
  }
};


/* ================================================================
   BIRD'S-EYE POV — the pier from above
   ================================================================ */
function birdView(){ return OPT.view==="bird"; }
const BIRD={ SEA_T:0, BOOTH_T:118, BOOTH_B:296, DECK_T:296, DECK_B:540, RAIL:540 };

function birdWater(t,cam,y0,y1,near){
  const g=X.createLinearGradient(0,y0,0,y1);
  if(near){ g.addColorStop(0,"#10202e"); g.addColorStop(1,"#060c14"); }
  else { g.addColorStop(0,"#070d16"); g.addColorStop(1,"#122334"); }
  X.fillStyle=g; X.fillRect(0,y0,VW,y1-y0);
  X.save(); X.globalCompositeOperation="lighter";
  for(let i=0;i<46;i++){
    const yy=y0+6+((i*13)%(y1-y0-10));
    const xx=((h1(i*7.7)*.5+.5)*VW*1.4 - cam*.5 + t*(9+(i%7)*3))%(VW*1.4)-VW*.2;
    X.globalAlpha=.035+.045*Math.sin(t*1.3+i);
    X.fillStyle="#9fc4e8"; X.fillRect(xx,yy,40+h1(i*3)*70,1.3);
  }
  X.restore(); X.globalAlpha=1;
}
function birdDeck(t,cam,y0,y1){
  const g=X.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,"#2a2018"); g.addColorStop(.5,"#332619"); g.addColorStop(1,"#241b13");
  X.fillStyle=g; X.fillRect(0,y0,VW,y1-y0);
  // planks run across the pier
  for(let wx=Math.floor((cam-40)/26)*26; wx<cam+VW+40; wx+=26){
    const x=wx-cam;
    X.strokeStyle="rgba(0,0,0,.33)"; X.lineWidth=1.4;
    X.beginPath(); X.moveTo(x,y0); X.lineTo(x,y1); X.stroke();
    X.strokeStyle="rgba(150,122,86,.06)"; X.lineWidth=1;
    X.beginPath(); X.moveTo(x+1.4,y0); X.lineTo(x+1.4,y1); X.stroke();
  }
  for(let k=1;k<4;k++){ X.strokeStyle="rgba(0,0,0,.18)"; X.lineWidth=2;
    X.beginPath(); X.moveTo(0,y0+k*(y1-y0)/4); X.lineTo(VW,y0+k*(y1-y0)/4); X.stroke(); }
}
function birdWalker(x,y,t,ph,face,moving,rim){
  X.save(); X.translate(x,y); X.scale(1.45,1.45);
  // shadow thrown by the string lights above
  X.save(); X.globalCompositeOperation="multiply";
  const sg=X.createRadialGradient(x*0+4,8,1,4,8,26);
  sg.addColorStop(0,"rgba(0,0,0,.5)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  X.fillStyle=sg; X.beginPath(); X.ellipse(4,8,26,20,0,0,TAU); X.fill(); X.restore();
  const sway=moving?Math.sin(ph)*2.4:0;
  X.rotate(face>0?.12:-.12);
  // shoulders
  const bg=X.createLinearGradient(-15,-15,15,15);
  bg.addColorStop(0,"#2b4150"); bg.addColorStop(.5,"#1b2a33"); bg.addColorStop(1,"#111c23");
  X.fillStyle=bg;
  X.beginPath(); X.ellipse(0,sway*.3,17,13,0,0,TAU); X.fill();
  // arms swinging out to the sides
  X.strokeStyle="#22303a"; X.lineWidth=6; X.lineCap="round";
  X.beginPath(); X.moveTo(-12,-2+sway); X.lineTo(-19,8+sway*1.6); X.stroke();
  X.beginPath(); X.moveTo(12,-2-sway); X.lineTo(19,8-sway*1.6); X.stroke();
  // head and cap from directly above
  X.fillStyle="#22323f"; X.beginPath(); X.ellipse(0,-1,9.4,9,0,0,TAU); X.fill();
  X.fillStyle="#31485a"; X.beginPath(); X.ellipse(0,-1,7.4,7,0,0,TAU); X.fill();
  X.fillStyle="#16212a"; X.beginPath(); X.ellipse(face*4.6,-1,5,6.4,0,0,TAU); X.fill(); // the peak
  X.fillStyle="#b8443a"; X.beginPath(); X.ellipse(-face*2,5,7,4,0,0,TAU); X.fill();     // scarf
  X.strokeStyle=rim||"rgba(255,176,90,.55)"; X.lineWidth=1.6;
  X.beginPath(); X.arc(0,0,16,-2.5,.5); X.stroke();
  X.restore();
}
function birdCrowd(t,cam,y,n,alpha,speed,spread){
  X.save(); X.globalAlpha=alpha;
  for(let i=0;i<n;i++){
    const ph=h1(i*4.1)*.5+.5;
    const wx=((ph*3400 + t*speed*(.6+ph))%3400)+WORLD_L;
    const x=wx-cam; if(x<-40||x>VW+40) continue;
    const yy=y+Math.sin(i*2.1)*spread;
    X.save(); X.globalCompositeOperation="multiply"; X.fillStyle="rgba(0,0,0,.4)";
    X.beginPath(); X.ellipse(x+3,yy+6,13,10,0,0,TAU); X.fill(); X.restore();
    X.fillStyle="#0c0c13"; X.beginPath(); X.ellipse(x,yy,12,9,i*.7,0,TAU); X.fill();
    X.fillStyle="#15151f"; X.beginPath(); X.ellipse(x,yy,6.4,6,0,0,TAU); X.fill();
  }
  X.restore(); X.globalAlpha=1;
}

/*__BOOTHS__*/

/* ================================================================
   MAIN LOOP
   ================================================================ */
let lastT=performance.now(), fadeA=0;
function frame(now){
  const dt=Math.min(.05,Math.max(.001,(now-lastT)/1000)); lastT=now; T+=dt;
  if(G.scene!=="title"&&G.scene!=="results"&&!$("modal").classList.contains("on")) G.playMs=(G.playMs||0)+dt*1000;
  // transition
  if(transTo){ fadeA+=dt*4.2; if(fadeA>=1){ fadeA=1; doSwitch(transTo,transArg); transTo=null; transArg=null; } }
  else if(fadeA>0) fadeA=Math.max(0,fadeA-dt*3.2);
  const modalOpen=$("modal").classList.contains("on");
  hotBtn=null;
  if(cur){
    if(!transTo && !modalOpen && cur.update) cur.update(dt);
    updP(dt);
    X.setTransform(RS,0,0,RS,0,0);
    X.fillStyle="#04030a"; X.fillRect(0,0,VW,VH);
    X.save();
    if(FX.shake>.05){ const a=FX.shakeA+T*40;
      X.translate(Math.cos(a)*FX.shake,Math.sin(a*1.7)*FX.shake*.7); }
    cur.draw(T);
    X.restore();
  }
  FX.shake*=Math.pow(.0015,dt); if(FX.shake<.05) FX.shake=0;
  FX.flash=Math.max(0,FX.flash-dt*3.4);
  if(fadeA>0){ X.setTransform(RS,0,0,RS,0,0); X.globalAlpha=fadeA; X.fillStyle="#000";
    X.fillRect(0,0,VW,VH); X.globalAlpha=1; }
  present();
  CV.style.cursor=hotBtn?"pointer":"default";
  endInput(dt);
  requestAnimationFrame(frame);
}
/* ---- boot ---- */
function boot(){
  BOOTHS.forEach(b=>{ if(!SCN[b.id]) SCN[b.id]={mood:"midway",back:true,
    draw(){ X.fillStyle="#120c10"; X.fillRect(0,0,VW,VH);
      signText(b.name+" — coming soon",VW/2,VH/2,28,"#ffd9a0","#ff8a1e",1); }}; });
  loadOpts(); fit(); hud(); renderNotes();
  doSwitch("title");
  requestAnimationFrame(frame);
  setTimeout(()=>{ $("fade").style.opacity=0; },80);
  // --- music autostart: try immediately, then on the first sign of life ---
  A.init(); A.resume(); applyOpts();
  const kick=()=>{ A.resume();
    if(A.ctx()&&A.ctx().state==="running"){ $("needAudio").classList.add("hidden");
      evs.forEach(e=>window.removeEventListener(e,kick,true)); } };
  const evs=["pointerdown","pointermove","pointerup","keydown","touchstart","click","wheel","focus"];
  evs.forEach(e=>window.addEventListener(e,kick,true));
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) A.resume(); });
  setInterval(()=>{ const c=A.ctx();
    if(c&&c.state!=="running"&&A.isOn()) { c.resume().catch(()=>{}); $("needAudio").classList.remove("hidden"); }
    else $("needAudio").classList.add("hidden"); },900);
}
boot();
</script>
